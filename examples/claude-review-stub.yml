# Copy to .github/workflows/claude-review.yml in any Meridian repo to add the
# read-only reviewer. Auto-reviews PRs when they open (drafts are skipped
# until marked ready for review; release-please PRs are skipped too, gated in
# the reusable workflow) and on demand via an @review comment.
# Independent of the dev agent (claude.yml) — different trigger, different
# (lower) permissions.
#
# Caveat: auto-review-on-open (pull_request_target) fires where this file
# exists on the PR's BASE branch. On a pristine-base mirror like the
# inspect_ai fork, AGENT PRs target the upstream-mirror `main` (no meridian
# workflows — still never fires; the dev agent posts @review on PR open
# instead); only meridian-targeting maintenance PRs would gain
# auto-review-on-open from adopting this stub there.
#
# Caveat: PRs from forks are skipped by auto-review — under
# pull_request_target the event RUNS in base-repo context with secrets, so
# the same-repo gate below is the security boundary (do not remove it: it is
# what keeps untrusted fork heads from being checked out and exercised with
# base credentials). A maintainer can still review a fork PR with an @review
# comment, same trust decision made explicitly — the reusable's trig check
# enforces it (fork-head @review requires a commenter with write access,
# checked before checkout).

name: Review

on:
  # pull_request_target, NOT pull_request: the workflow (and the agent's
  # prompt/permissions) resolve from the BASE branch, so a PR editing the
  # reviewer's own files still auto-reviews — the PR's copy never runs, which
  # also satisfies the token exchange's workflow validation. Secrets come
  # from the base repo, so the same-repo gate below is the trust boundary;
  # fork PRs stay comment-triggered only.
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    # Run on PR events (skipping drafts — they get reviewed via
    # ready_for_review when marked ready — and fork PRs: under
    # pull_request_target the event runs with base-repo secrets, so this
    # same-repo check is a SECURITY boundary, not an ergonomic skip; the
    # full_name check, not head.repo.fork, keeps same-repo PRs working on
    # repos that are themselves forks), or on a PR comment containing @review. An explicit
    # @review still works on a draft and on a fork PR. `@review` does not
    # collide with the dev agent's `@claude` trigger.
    if: >
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.draft != true &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@review')) ||
      (github.event.issue.pull_request == null &&
       contains(github.event.issue.labels.*.name, 'External') &&
       contains(github.event.comment.body, '@review'))
    uses: meridianlabs-ai/agents/.github/workflows/claude-review.yml@main
    # Machine-account PAT for the deterministic ack/stage steps only (eyes
    # reaction + board stage); never handed to the review agent, which stays
    # read-only. Absent -> those steps no-op.
    secrets:
      MARVIN_TOKEN: ${{ secrets.MARVIN_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
