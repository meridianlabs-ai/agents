# Representative of the inspect_ai fork's `meridian` claude-setup (Python
# 3.11 pin, `uv pip install -e ".[dev]"`): a setuptools project with a `dev`
# extra. Used by the hosted canary's caller-recipes job.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inspect-ai-like"
version = "0"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
