# PyYAML for the Dependabot merge job (dependabot-merge.yml) and its tests;
# development tools for this repository's tests (tests.yml) and its dogfood
# stubs' provisioning. Not a package: with no [build-system], uv installs
# only the dependencies.
[project]
name = "meridian-agents"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest", "pytest-xdist"]

[tool.uv]
exclude-newer = "7 days"
required-version = ">=0.13.4"
