name: provision-fallback
description: >-
  Fallback provisioning where the caller repo has no `claude-setup` shim
  (design/architecture.md → "Provisioning the environment for the verify
  loop"): bootstrap uv and dev-install the checkout so the agent's pytest/
  ruff/mypy actually resolve. Shared by claude.yml (since 2026-09-09),
  claude-review.yml, claude-auto.yml
  and claude-auto-review.yml, which keep their own `if:` (the hashFiles
  guards and each workflow's trigger gate), `timeout-minutes` and
  `continue-on-error` — only the recipe lives here, so a tweak to the uv
  version, the retry or the extras/group detection is made once. The
  recipe itself is `provision.sh` next to this file (so the one step can
  run it as another user; the script is the same bash the step used to
  inline). Referenced fully-qualified
  (meridianlabs-ai/agents/.github/actions/provision-fallback@main); NO post
  step (local composite actions with post steps break teardown on the
  fork).

  Who it serves: on the Claude engine, PR heads on the inspect_ai fork,
  whose branches are cut from pristine main and carry no meridian files,
  and Python caller repos that never added the action; on the codex
  engine, EVERY provisioned checkout — the codex jobs never run the
  caller's `claude-setup` (below). NEVER a cross-repository fork head
  (issue #59): `uv pip install -e` runs the checkout's build backend, as
  `runner` with sudo, unrestricted egress and the job token present on the
  Claude path — every caller excludes those before this step (the
  reviewer's fork_head gate, the CI-fix stub's `head_repository.full_name
  == github.repository` filter, the review-fix gate's `isCrossRepository`
  skip).

  The `user` input (Claude Security findings 4628446 and 4629153, 2026-09-22):
  the four codex jobs pass `user: codex` and run this step AFTER the
  `create-codex-user` composite, so the recipe — the uv bootstrap into
  that user's home, the venv, the checkout's build backend and the cache
  warm — executes as the unprivileged `codex` user (`sudo -u codex -H`,
  sudo's reset environment, the workspace group grant for the writes),
  never as the runner. A same-repo head the pipeline itself authored (a
  `claude/issue-N-*` branch an earlier agent run produced from an
  outsider's issue text) can carry a hostile `pyproject.toml` build hook
  or a `claude-setup` action; on the codex path that code now runs with
  exactly what codex itself has — the codex uid, no sudo, no GitHub
  token, no OIDC request token, and no way to read the runner's processes
  — instead of as `runner` ahead of the codex-action step that holds
  `OPENAI_API_KEY`. The same reasoning is why those jobs use this recipe
  even where the caller defines `claude-setup`: a composite action can
  only run as the runner. The Claude jobs keep the runner-side recipe (no
  `user`): the Claude agent itself runs unsandboxed as the runner on every
  same-repo head and executes the tree's code when it runs the tests, so
  pre-agent provisioning gains hostile code nothing there — and those jobs
  name no OPENAI_API_KEY any more (design/codex-engine.md → Auth). The
  script is copied into `$RUNNER_TEMP` (755 runner:runner, readable by the
  codex user) before the `sudo`, so it never depends on the permissions
  of the action's own checkout directory.

  The `recipe` input (review round 1 of the same fix): a caller's own bash,
  run in place of the default venv + dev-install after the uv bootstrap —
  the reusable workflows' `codex_provision` input, which the caller's stub
  (a trusted workflow file, resolved from its default branch) supplies as
  the codex-run counterpart of its `claude-setup` action, since a composite
  action can only run as the runner and is never run on the codex path. It
  runs with the same environment as the default recipe (as `user` when
  set: no sudo, an explicit minimal environment — HOME=/home/<user>, the
  system PATH plus `~/.local/bin` for uv, no runner or XDG variables — cwd
  the checkout, network), so it can pin a Python (`uv venv --python
  3.11`), sync a lockfile (`uv sync --dev`), or install Node tooling
  (`corepack enable --install-directory ~/.local/bin && pnpm install
  --frozen-lockfile`). It runs under `bash --noprofile --norc -eo
  pipefail`, the options a `shell: bash` step gets, so any failing command
  fails the provisioning step (a caller handles an expected failure with
  `|| true`). The composite writes it to `$RUNNER_TEMP` (readable by the
  user) and passes the path as the script's one argument. Empty (the
  default) keeps the generic recipe. With a recipe the step is not gated on
  `pyproject.toml`: a Node repository's recipe runs too (the workflows'
  `if:`), and only the generic recipe needs the Python project.

  The `bin` output is the provisioned tools' directories, colon-separated
  and absolute — `<workspace>/.venv/bin`, `<workspace>/node_modules/.bin`
  and, under `user`, `/home/<user>/.local/bin` (where a recipe's `corepack
  enable --install-directory` or `uv tool install` puts binaries). codex
  starts under `sudo -u codex` with a reset PATH, and with the recipe
  running as codex there is no runner PATH to discover the tools from, so
  the codex jobs hand this output to `create-codex-user`'s `reset-home`
  mode, which writes it into codex's `config.toml` as the PATH of every
  command codex runs (executed-paths follow-up, option B, 2026-09-23), and
  their compose steps look the tools up in the same directories to name
  them in the prompt.

  The recipe (decision: Ransom, 2026-09-01), mirroring the fork's
  claude-setup: the uv installer curl is retried — its tarball download
  flaked repeatedly on 2026-08-12; uv's own HTTP retries internally. With
  `add-to-path: true` (the default) and no `user`, both bin dirs go on
  GITHUB_PATH so pytest/ruff/mypy resolve for the Claude engine, which runs
  as the runner with the job PATH. Under `user` NOTHING goes on
  GITHUB_PATH, whatever `add-to-path` says: the recipe runs under `env -i`,
  so the file is not even reachable (Claude Security finding 4628448;
  design/codex-engine.md → Runner-side search path: the runner prepends
  every GITHUB_PATH entry to every later step's PATH and resolves each
  step's shell interpreter through it, and the checkout — `.venv/bin`
  included — is codex-writable after `create-codex-user`'s grant, so a
  venv on the job PATH would let codex plant the `sudo`, `bash` or `git`
  the first runner-side step after it executes; `create-codex-user`
  refuses to start codex behind a workspace or codex-writable job PATH
  entry, and the reclaim re-checks). NOT for codex's own tool calls either
  way: under the unprivileged-user strategy codex-action launches codex via
  `sudo -u codex` (no -E), and sudo's env_reset/secure_path replaces PATH
  before codex starts (the drop-sudo strategy would forward the runner
  PATH; this repo does not use it), so codex's commands get these tools on
  their PATH from its `config.toml` instead (the `bin` output, above). Fatal on
  failure, exactly like claude-setup: a repo whose pyproject exists but
  cannot dev-install is a loud signal, not a silent static-only run — the
  callers' Surface steps report a failed outcome. No plain `-e .` fallback:
  uv (verified on 0.12.18), like pip, only WARNS on an unknown extra, so the
  `[dev]` install already succeeds on repos without one — a fallback could
  only mask real failures as a silent static degrade. Dev tools may instead
  live in PEP 735 `[dependency-groups]` (uv-native layouts: inspect_sandboxes
  has NO optional-dependencies at all), where the extras warning would mean
  a green step with a toolless venv — so when that table exists, `--group
  dev` is added; unlike an unknown extra, an absent group ERRORS, which is
  the loud failure this step wants. The table is detected with tomllib
  (runner python3 is ≥3.11), not grep: TOML allows whitespace in/before the
  header, and a formatting variant silently taking the extras-only branch is
  the exact toolless-venv outcome the group branch exists to prevent. Parity
  gap, accepted: claude-setup pins `--python 3.11` to the fork's CI, while
  bare `uv venv` resolves the runner's default (3.12 today, drifting with
  the image) — a generic fallback can't hardcode any one minor; repos that
  care can ship a `.python-version`, which uv honors.

  The `.venv/` it creates — and the `<pkg>.egg-info/` a setuptools PEP 660
  editable install writes INTO the source tree (verified: `pip install -e .`
  on a src-layout project leaves `src/<pkg>.egg-info/` behind; hatchling
  and other backends write nothing) — are added to `.git/info/exclude`
  unconditionally: the two loops' Claude-engine agents commit and push from
  this tree, the codex landing step stages with a blanket `git add -A`, and
  only the caller's .gitignore would otherwise keep either out (the codex
  path re-excludes both in its prep step regardless); for the reviewer,
  which never commits, the line is harmless.

  After the install it warms network-fetched caches the tests need
  (2026-09-09): tiktoken's BPE files into its default /tmp cache, readable
  by the codex user (and the dir left sticky-writable so codex can cache
  encodings outside the list; run as codex, the files are codex's own).
  Evidence-driven — add an entry when a run
  reports a blocked download; a failed or stalled warm (bounded by
  `timeout`) only costs a slower first test.

inputs:
  add-to-path:
    description: >-
      "true" (default) puts `$HOME/.local/bin` (uv) and the checkout's
      `.venv/bin` on GITHUB_PATH for the rest of the job — the Claude
      engine's bare `pytest`/`ruff`/`mypy` — when the recipe runs as the
      runner. "false" adds nothing to the job PATH. Ignored under `user`,
      where nothing is ever added (see the description): the codex jobs
      provision as the codex user, after its grant, and their compose steps
      find the tools through the `bin` output.
    required: false
    default: "true"
  recipe:
    description: >-
      A caller's own provisioning bash (the reusable workflows'
      `codex_provision` input), run after the uv bootstrap in place of the
      generic venv + dev-install; empty keeps the generic recipe. See the
      description.
    required: false
    default: ""
  user:
    description: >-
      Run the recipe as this unprivileged user (`sudo -u <user> -H`) instead
      of the runner. The codex jobs pass `codex`, after the
      `create-codex-user` composite has created the user and group-granted
      the workspace; empty (the default) runs it as the runner, as the
      Claude jobs do.
    required: false
    default: ""

outputs:
  bin:
    description: >-
      The provisioned tools' directories, colon-separated and absolute —
      the venv's bin, node_modules' bin and, under `user`, that user's
      `~/.local/bin`: the codex jobs put them on the PATH of codex's
      commands (`create-codex-user`'s `bin` input) and name the tools found
      there in the prompt.
    value: ${{ github.workspace }}/.venv/bin:${{ github.workspace }}/node_modules/.bin${{ inputs.user != '' && format(':/home/{0}/.local/bin', inputs.user) || '' }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        AS_USER: ${{ inputs.user }}
        ADD_TO_PATH: ${{ inputs.add-to-path }}
        RECIPE: ${{ github.action_path }}/provision.sh
        CALLER_RECIPE: ${{ inputs.recipe }}
      run: |
        set -euo pipefail
        # The caller's recipe, if any, as a file under RUNNER_TEMP (readable
        # by the user); passed as the script's one argument, never as
        # environment (sudo resets it) and never as shell text.
        args=()
        if [ -n "${CALLER_RECIPE:-}" ]; then
          printf '%s\n' "$CALLER_RECIPE" >"$RUNNER_TEMP/provision-recipe.sh"
          chmod 644 "$RUNNER_TEMP/provision-recipe.sh"
          bash -n "$RUNNER_TEMP/provision-recipe.sh"
          args=("$RUNNER_TEMP/provision-recipe.sh")
        fi
        if [ -z "${AS_USER:-}" ]; then
          # As the runner: the job PATH only when asked (ADD_TO_PATH reaches
          # the script through this step's environment).
          bash "$RECIPE" ${args[@]+"${args[@]}"}
        else
          # A copy under RUNNER_TEMP (755 runner:runner on the hosted image,
          # so readable by the user) rather than the action's own path, and
          # an EXPLICIT minimal environment (`env -i`): sudo's env_reset
          # alone is not enough — the hosted image's sudoers keeps the XDG_*
          # variables, and the first hosted run of the canary had the uv
          # installer, running as codex, try to write its receipt to the
          # runner's `$XDG_CONFIG_HOME/uv` (EACCES, three times, provisioning
          # failed). HOME, USER and LOGNAME are the user's; PATH is the
          # image's system path (the recipe prepends ~/.local/bin itself);
          # no GITHUB_*, no runner PATH, no XDG_* reaches the recipe. sudo
          # keeps the working directory, so the venv lands in the checkout
          # as in the runner case.
          install -m 644 "$RECIPE" "$RUNNER_TEMP/provision-fallback.sh"
          echo "provisioning as $AS_USER"
          sudo -u "$AS_USER" -H -- env -i \
            HOME="/home/$AS_USER" USER="$AS_USER" LOGNAME="$AS_USER" LANG=C.UTF-8 \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            bash "$RUNNER_TEMP/provision-fallback.sh" ${args[@]+"${args[@]}"}
        fi
