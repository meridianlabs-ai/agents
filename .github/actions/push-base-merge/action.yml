name: push-base-merge
description: >-
  Backstop for the Claude path of the runner-side base sync
  (design/architecture.md → "The merge moved to the runner"): if HEAD is
  still EXACTLY the sync-branch action's merge commit when the agent
  finishes, nothing else will push it, so this does. Gated on that exact SHA,
  so an agent that committed on top — pushed, or deliberately not — is never
  second-guessed. Shared by claude.yml, claude-auto.yml and
  claude-auto-review.yml. Referenced fully-qualified
  (meridianlabs-ai/agents/.github/actions/push-base-merge@main); NO post
  step (local composite actions with post steps break teardown on the fork).

  Authentication is step-scoped (design/architecture.md → "No persisted git
  credentials"): the push-token feeds a credential helper defined in this
  step's environment (GIT_CONFIG_*), never the workspace — the callers'
  checkouts run with persist-credentials:false, so there is no persisted
  credential to fall back on and no http.<origin>.extraheader to override.

inputs:
  branch:
    description: The PR head branch to push to (refs/heads/<branch>).
    required: true
  merge_sha:
    description: The sync-branch action's merge_sha output.
    required: true
  push-token:
    description: >-
      Token the push (and the pre-push fetch) authenticates with. The machine
      account's PAT (MARVIN_TOKEN) wherever the caller has it: the push must
      re-trigger CI, and a GITHUB_TOKEN push is dropped by the recursion
      guard. Required — the step fails loudly on an empty value rather than
      pushing unauthenticated (which would fail on a private repo, or as an
      anonymous write attempt on a public one).
    required: true
  require-file:
    description: >-
      Evidence the agent actually ran: a path that must exist and be non-empty
      for the push to proceed; empty disables the check. claude.yml passes
      claude-code-action's execution file, because the action — not the
      workflow's own trigger check — is what authorizes the commenter (it
      fails its step for an actor without write access) and the caller runs
      this backstop under always(): unfenced, an outsider's @claude on a
      public repo's behind PR would produce a machine-account push and a CI
      re-run — a write reachable without write access. The action writes the
      file only after the Claude session (or on an SDK error mid-run), never
      when it declines the actor or dies before starting Claude (verified in
      its src/entrypoints/run.ts and base-action/src/execution-file.ts). The
      loops leave it empty: their own gate already authorized the actor
      before checkout.
    required: false
    default: ""

outputs:
  pushed:
    description: "`1` when this action pushed the merge; empty otherwise."
    value: ${{ steps.push.outputs.pushed }}

runs:
  using: composite
  steps:
    - id: push
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        MERGE_SHA: ${{ inputs.merge_sha }}
        REQUIRE_FILE: ${{ inputs.require-file }}
        # Step-scoped credential (design/architecture.md → "No persisted git
        # credentials"): git reads GIT_CONFIG_* from the environment with
        # command-line precedence, so this defines a credential helper that
        # answers the 401 on the fetch and the push from GIT_TOKEN — the
        # push runs as the token's identity, and the token exists nowhere but
        # this step's environment. GIT_TOKEN is the one variable name every
        # copy of this block reads (AGENTS.md), so a copied block cannot
        # silently reference an unset name. The empty first entry resets any
        # helper inherited from the runner image's global config; the helper
        # itself is scoped to this server's URL, so no other host is ever
        # answered with the token. (A URL-embedded credential would take
        # precedence over this helper — git never consults one when the URL
        # carries auth — which is why the callers' `reset-origin-url` step,
        # run right after the claude-code-action step, put checkout's
        # credential-free origin URL back before this runs: the action
        # leaves its github_token on origin, and on a marvin-less caller
        # that is the App token it revokes in its own final step. With the
        # reset in place this helper is what authenticates the fetch and the
        # push.)
        GIT_TOKEN: ${{ inputs.push-token }}
        GIT_CONFIG_COUNT: "2"
        GIT_CONFIG_KEY_0: credential.helper
        GIT_CONFIG_VALUE_0: ""
        GIT_CONFIG_KEY_1: credential.${{ github.server_url }}.helper
        GIT_CONFIG_VALUE_1: '!f() { echo username=x-access-token; echo "password=$GIT_TOKEN"; }; f'
      run: |
        set -euo pipefail
        # Fence first: a run whose agent never started leaves the merge on the
        # runner; the next authorized run re-merges. No push here also means
        # no hand-back owed by the caller (pushed stays empty).
        if [ -n "$REQUIRE_FILE" ] && [ ! -s "$REQUIRE_FILE" ]; then
          echo "the agent never ran ($REQUIRE_FILE is missing or empty: claude-code-action declined the actor, or failed before starting Claude) — leaving the runner's base merge unpushed."
          exit 0
        fi
        if [ "$(git rev-parse HEAD)" != "$MERGE_SHA" ]; then
          echo "agent commits sit on top of the base merge — leaving the push to it."
          exit 0
        fi
        # Composite inputs are not enforced as required at runtime; a missing
        # token must not degrade into an unauthenticated push.
        if [ -z "$GIT_TOKEN" ]; then
          echo "::error::push-base-merge: push-token is empty — refusing to push the base merge unauthenticated."
          exit 1
        fi
        git fetch --quiet origin "$BRANCH"
        if [ "$(git rev-parse FETCH_HEAD)" = "$MERGE_SHA" ]; then
          echo "base merge is already on origin/$BRANCH."
          exit 0
        fi
        # Non-fast-forward guard: the remote may have moved during the run
        # while HEAD stayed at the merge — the agent landed its change
        # server-side via the API, or a human pushed to the PR branch while
        # this run went on (ordinary on the one-shot dev agent). Skip rather
        # than fail red; the next run re-merges on top of the new tip. No
        # push here also means no hand-back owed by the caller (pushed stays
        # empty).
        if ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
          echo "origin/$BRANCH moved past the runner's merge during the run — leaving it; the next run re-merges."
          exit 0
        fi
        git push --quiet origin "HEAD:refs/heads/$BRANCH"
        echo "pushed=1" >>"$GITHUB_OUTPUT"
        echo "pushed base merge $(git rev-parse --short HEAD) to $BRANCH"
