name: model-provenance
description: >-
  Report which Claude model actually served an agent run, and say so on the
  PR/issue when a model other than the requested one served output that the
  agent's own subagent model choices don't explain (the --fallback-model
  fired) or when the run ended in what looks like a classifier refusal. The
  init line of claude-execution-output.json echoes the REQUESTED model even
  when the fallback fires — only `modelUsage` in the final result shows what
  ran (design/architecture.md → Model selection). Also writes the run's cost,
  duration, turn count and result status to the job summary: the execution
  file itself is NOT uploaded (it carries every command output and file the
  agent read — design/architecture.md → No transcript artifacts), so this
  summary is the only after-the-fact record of what a run cost. Best-effort
  by design: every path exits 0 — provenance must never fail the agent's
  real work. Referenced
  fully-qualified (meridianlabs-ai/agents/.github/actions/model-provenance@main)
  so it works regardless of what the job checked out; NO post step (local
  composite actions with post steps break teardown on the fork).

inputs:
  exec-file:
    description: >-
      Path to claude-execution-output.json (claude-code-action's
      execution_file output). Empty/missing file = the agent never launched
      (a pre-launch skip, or the codex engine) — nothing to report.
    required: false
    default: ""
  requested:
    description: The model the workflow asked for (its `model` input, alias or ID).
    required: false
    default: ""
  token:
    description: >-
      Token for the provenance comment (MARVIN_TOKEN so it posts as the
      machine account, like the other deterministic posts). Empty skips the
      comment; the job summary and log lines still happen, and the `note`
      output carries the text so a workflow that keeps its agent job
      secret-free (claude-review.yml) can hand it to its land job as the
      manifest's `provenance_comment_file`.
    required: false
    default: ""
  repo:
    description: owner/name to comment in.
    required: false
    default: ${{ github.repository }}
  number:
    description: Issue or PR number to comment on. Empty skips the comment.
    required: false
    default: ""

outputs:
  note:
    description: >-
      The note this action would post (fallback / refusal text, WITHOUT the
      `<!-- model-provenance -->` first-line marker — the poster adds it);
      empty when there is nothing to flag. Written whether or not `token`
      was given, so a land job can post it later.
    value: ${{ steps.prov.outputs.note }}

runs:
  using: composite
  steps:
    - id: prov
      shell: bash
      env:
        EXEC: ${{ inputs.exec-file }}
        REQUESTED: ${{ inputs.requested }}
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        NUM: ${{ inputs.number }}
      run: |
        set -uo pipefail
        # Every early exit below leaves the `note` output empty; the one
        # path that has something to flag overwrites it (last write wins).
        echo "note=" >>"$GITHUB_OUTPUT"
        file="${EXEC:-/home/runner/work/_temp/claude-execution-output.json}"
        [ -f "$file" ] || { echo "model-provenance: no execution file; nothing to report."; exit 0; }
        msgs='(if type=="array" then . else .messages end)'
        # The init line's model is the alias RESOLVED (e.g. fable ->
        # claude-fable-5-1) but still the requested one, not what ran.
        init=$(jq -r "$msgs"' | map(select(.type=="system")) | .[0].model // empty' "$file" 2>/dev/null || true)
        usage=$(jq -c "$msgs"' | map(select(.type=="result")) | last | .modelUsage // {}' "$file" 2>/dev/null || echo '{}')
        [ "$usage" != "{}" ] || { echo "model-provenance: no modelUsage in the result (agent produced no result); nothing to report."; exit 0; }
        table=$(jq -r 'to_entries | map("| `\(.key)` | \(.value.inputTokens // 0) | \(.value.outputTokens // 0) |") | join("\n")' <<<"$usage")
        # Run totals from the result message. Numbers and booleans only —
        # never `.result`: that is the agent's free-text final message, the
        # one field that could carry a secret the agent chose to print, and
        # the summary is visible to anyone who can see the run.
        totals=$(jq -r "$msgs"' | map(select(.type=="result")) | last
          | "cost (USD): \((.total_cost_usd // 0) * 10000 | round / 10000) · duration: \((.duration_ms // 0) / 1000 | floor)s · turns: \(.num_turns // 0) · is_error: \(.is_error // false) · subtype: `\(.subtype // "unknown" | tostring | gsub("[^A-Za-z0-9_-]"; ""))`"' "$file" 2>/dev/null || true)
        echo "model-provenance: requested='${REQUESTED:-<default>}' init='$init'"
        echo "$table" | sed 's/^/model-provenance: /'
        [ -z "$totals" ] || echo "model-provenance: $totals"
        {
          echo "### Model provenance"
          echo ""
          echo "Requested: \`${REQUESTED:-<Claude Code default>}\` (init line: \`${init:-?}\`)"
          echo ""
          echo "| served by | input tokens | output tokens |"
          echo "|---|---:|---:|"
          echo "$table"
          # Blank line first: GFM only ends a table at a blank line.
          [ -z "$totals" ] || printf '\n%s\n' "$totals"
        } >>"$GITHUB_STEP_SUMMARY"
        # Fallback detection. Haiku is Claude Code's own subagent/summarization
        # traffic on every run, not a fallback. Of the remaining non-init
        # models that served OUTPUT tokens, only an UNEXPLAINED one is a
        # fallback: a subagent launched on an explicit model (the Agent/Task
        # tool's `model` input — an alias like `opus`, or a full id) lands in
        # modelUsage exactly like a per-request fallback would, but it is the
        # agent's own choice. Attribute those first and say nothing about them
        # beyond the job summary (decision: Ransom, 2026-09-02, after #398's
        # two general-purpose subagents on opus drew a fallback-shaped note).
        # A served set LACKING the init model is a fallback regardless — the
        # primary never ran — so nothing is attributed then: a whole-run
        # fallback that happens to land on a model a subagent also asked for
        # is still the fallback, and the note must name it.
        # The comparison needs the init model: with no init line (no `system`
        # message, or the field moved in a claude-code-action release) every
        # served model would look like "not the init model" and the note would
        # fire falsely on every run — so without it, report and don't judge.
        note=""
        if [ -n "$init" ]; then
          has_init=$(jq -r --arg init "$init" 'has($init)' <<<"$usage")
          sub_models=$(jq -c "$msgs"' | map(select(.type=="assistant"))
            | map(.message.content[]? | select(.type=="tool_use" and (.name | test("^(Task|Agent)$")))
                | .input.model // empty | select(type=="string" and length > 0))
            | unique' "$file" 2>/dev/null || echo '[]')
          # Classify each candidate: explained when some Agent-tool `model`
          # input is a substring of the served id (alias `opus` is inside
          # `claude-opus-5[1m]`; a full id matches itself — jq's contains()
          # is literal, so `[1m]` is not a glob). $want selects which list.
          classify='to_entries
            | map(select(.key != $init and (.key | test("haiku") | not) and ((.value.outputTokens // 0) > 0)))
            | map(.key as $k | . + {explained: ($has_init and any($subs[]; . as $a | $k | contains($a)))})
            | map(select(.explained == $want) | "\(.key) (\(.value.outputTokens) output tokens)") | join(", ")'
          explained=$(jq -r --arg init "$init" --argjson has_init "$has_init" --argjson subs "$sub_models" --argjson want true "$classify" <<<"$usage")
          fallback=$(jq -r --arg init "$init" --argjson has_init "$has_init" --argjson subs "$sub_models" --argjson want false "$classify" <<<"$usage")
          if [ -n "$explained" ]; then
            echo "model-provenance: subagents ran on $explained — the agent's own model choice, not a fallback."
            printf '\nSubagents ran on %s — the agent'"'"'s own model choice (Agent tool `model` input), not a fallback.\n' "$explained" >>"$GITHUB_STEP_SUMMARY"
          fi
          if [ "$has_init" != "true" ]; then
            served=${fallback:+tokens were served by $fallback}
            note="ℹ️ **Model fallback fired** on this run: requested \`${REQUESTED:-default}\` (\`$init\`), but ${served:-the primary never served any tokens}. The run's work is still valid; read it knowing the primary model was unavailable, overloaded, or declined."
            echo "::warning::model fallback: requested $init, served by ${fallback:-other}"
          elif [ -n "$fallback" ]; then
            # The primary served too, so this is a hedge, not a verdict: only
            # the Agent tool's `model` INPUT is attributable from the log. A
            # subagent whose model comes from its definition (`.claude/agents/
            # *.md` frontmatter, a built-in agent's default) or from the
            # Workflow tool's `agent({model})` leaves no such input and looks
            # exactly like a per-request fallback here.
            note="ℹ️ **Unexplained model served output** on this run: requested \`${REQUESTED:-default}\` (\`$init\`) served the main thread, but tokens were also served by $fallback and no Agent-tool \`model\` choice in the log accounts for it. Either the fallback fired for some requests (primary overloaded or declined) or a subagent ran on a model set in its definition rather than per call. The run's work is still valid."
            echo "::warning::unexplained model alongside $init: served by $fallback"
          fi
        else
          echo "model-provenance: no init line in the execution log; cannot judge whether the fallback fired."
        fi
        # Refusal heuristic: the final result errored and its text reads like
        # a classifier/policy refusal. The execution log carries no per-message
        # stop_reason, so the result text is the only signal.
        refusal=$(jq -r "$msgs"' | map(select(.type=="result")) | last
          | if (.is_error == true) and ((.result // "") | test("refus|classif|safety|policy|cannot help|can'"'"'t help"; "i")) then (.result | .[0:300]) else empty end' "$file" 2>/dev/null || true)
        if [ -n "$refusal" ]; then
          # De-fang: agent/API text posts from a write-access account. Trigger
          # tokens lose their @, the loop's substring-matched markers get a
          # space, and backticks go (one inside the snippet would close the
          # code span early and leave the rest as live markdown/HTML). The
          # marker list mirrors the `<!-- … -->` comments the workflows read;
          # keep it in step when adding one. Case-insensitive (GNU sed `I`)
          # because the stubs gate on GitHub's contains(), which ignores case.
          snippet=$(printf '%s' "$refusal" | tr -d '`' | tr '\n' ' ' \
            | sed -E 's/@(review|claude|auto)/\1/gI; s/claude-review-(summary|verdict|comment|nudge)/claude-review \1/gI; s/auto-(handoff|converged|review-rounds|review-head|fix-attempts)/auto \1/gI')
          line="⚠️ **Possible classifier refusal**: the run ended in an error whose text reads like a safety/policy refusal: \`$snippet\`"
          if [ -n "$note" ]; then note=$(printf '%s\n\n%s' "$note" "$line"); else note="$line"; fi
          echo "::warning::possible classifier refusal in the final result"
        fi
        [ -n "$note" ] || { echo "model-provenance: nothing to flag."; exit 0; }
        # Blank line first: GFM only ends a table at a blank line, so a bare
        # line under the last row would render as one more (single-cell) row.
        printf '\n%s\n' "$note" >>"$GITHUB_STEP_SUMMARY"
        # The `note` output, for callers that post from a separate land job.
        # Heredoc form: the note is multi-line when both shapes fire.
        {
          echo "note<<MODEL_PROVENANCE_NOTE_EOF"
          printf '%s\n' "$note"
          echo "MODEL_PROVENANCE_NOTE_EOF"
        } >>"$GITHUB_OUTPUT"
        if [ -n "$GH_TOKEN" ] && [ -n "$NUM" ]; then
          # First-line marker: the note posts as the machine account, and
          # claude-review.yml's "Verify the review was posted" counts machine-
          # account comments since run start as review output — it filters
          # this marker out so a fallback note can't mask a stalled review.
          body=$(printf '<!-- model-provenance -->\n%s' "$note")
          gh api "repos/$REPO/issues/$NUM/comments" -f body="$body" --silent \
            && echo "model-provenance: posted the note on #$NUM" \
            || echo "::warning::model-provenance: could not post the note on #$NUM"
        fi
        exit 0
