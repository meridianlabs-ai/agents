name: assert-no-persisted-credential
description: >-
  Regression guard for the no-persisted-credential invariant
  (design/architecture.md → "No persisted git credentials"): fail the job if
  actions/checkout left a credential in the workspace despite
  `persist-credentials: false`. Runs right after the checkout in claude.yml,
  claude-auto.yml and claude-auto-review.yml (one copy for all three, so the
  check cannot drift). The persisted-credential layout has changed across
  checkout releases — a local `http.<server>/.extraheader`, then an
  `include.path` to a file under RUNNER_TEMP (v4.3.1/v6) — so this asks git,
  which follows includes, rather than grepping the file. Keyed on the server
  URL, as checkout keys the header it persists (its git-auth-helper builds the
  key from serverUrl.origin), so the check is not vacuous on a GHES caller.
  Runs no network git. Referenced fully-qualified
  (meridianlabs-ai/agents/.github/actions/assert-no-persisted-credential@main);
  NO post step (local composite actions with post steps break teardown on the
  fork).

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SERVER_URL: ${{ github.server_url }}
      run: |
        set -uo pipefail
        # Exit status only: on the failure path --get-all would print the
        # header (AUTHORIZATION: basic <base64>) into the job log. checkout
        # registers that string with setSecret, but this check's own failure
        # mode should not depend on another action's masking.
        #
        # And the status is read, not just tested: `git config --get-all`
        # exits 1 when the key is not set and 128 when it could not read the
        # config at all (a corrupt or unreadable file, a safe.directory
        # refusal). A plain `if ! git config …` would treat that error as
        # "no credential" and pass the guard vacuously — fail closed instead.
        rc=0
        git config --get-all "http.$SERVER_URL/.extraheader" >/dev/null 2>&1 || rc=$?
        case $rc in
          1) echo "no credential persisted in .git/config." ;;
          0) echo "::error::actions/checkout persisted a credential in .git/config despite persist-credentials:false"; exit 1 ;;
          *) echo "::error::git config failed (exit $rc) — cannot verify the no-persisted-credential invariant"; exit 1 ;;
        esac
