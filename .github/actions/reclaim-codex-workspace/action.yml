name: reclaim-codex-workspace
description: >-
  Take .git back from the codex user and put the pre-codex .git/config back
  before ANY runner-side git command runs (design/codex-engine.md →
  Hook-safe landing). Runs unconditionally right after the codex step in
  claude.yml, claude-auto.yml and claude-auto-review.yml — `if: always() &&
  steps.codexuser.outcome == 'success'` — so it is the FIRST step after codex
  had write access to the tree, regardless of how codex ended (success,
  failure, cancelled). Everything downstream (the unresolved-merge guard,
  the landing step, the hand-back / unlanded-work fetches, Surface agent
  errors) then reads a clean config instead of each step defending itself;
  before this existed the loops' `Ensure hand-back after push` ran `git
  fetch` against the un-restored, codex-writable .git whenever the guard or
  the landing failed (review finding on #73). Ten things, in order:

  0. Trust nothing on the job PATH (Claude Security finding 4628448;
     design/codex-engine.md → Runner-side search path). The runner prepends
     every `GITHUB_PATH` entry to the PATH of every later step, so a
     directory codex could write there — a workspace venv provisioning put
     on the job PATH, made group-writable by `Create codex user`'s grant —
     would have `sudo`, `find`, `cp`, `mv` and the rest of this step's
     commands resolve to files codex planted, and the very first of them
     (`sudo pkill`) would run as `runner` → root before any kill or
     refusal below. Two layers: a nested `assert-runner-only-path` step
     first — the same check `Create codex user` ran before the grant,
     repeated after codex in case a later step added to `GITHUB_PATH`, this
     time without `protect` (a hop that became writable after the grant is
     refused, not fixed) — fails this step closed (and, through its
     outcome, skips every git-running step) if any PATH entry, any hop of
     it or of a symlink hop's target, is inside the workspace or writable
     by codex; and the reclaim script pins its own PATH to
     `system-path` before its first command, so every command below is
     the system one whatever the job PATH holds. The interpreter the
     runner picked for this step is outside both layers' reach, which is
     why the pre-grant check in `Create codex user` is the primary defence.
  1. Kill every process still running as the codex user (`pkill -KILL -u
     codex`, repeated until a pass finds nothing — one pass scans /proc
     once, and a forking survivor can slip it). codex-action's step is over
     and nothing legitimate runs as codex after it, but the runner does not
     reap orphans between steps, so a background process a prompt-injected
     codex left behind (`setsid nohup … &`) would otherwise outlive this
     step — and could rewrite the restored config below before the landing
     step's credentialed push (review round 4 of #73).
  2. Refuse a redirected git dir: fail if `.git` is a symlink, not a
     directory, or contains a `commondir` file. gitrepository-layout(5): a
     `commondir` file sets `$GIT_COMMON_DIR` unless the env already does,
     and `config` is then read from THERE — so codex could copy .git
     somewhere it owns, add a filter driver or repoint remote.origin.url,
     and a restore of `.git/config` would land on a file git no longer
     reads. This step runs no git, so the check needs no pin; the guard and
     landing steps (the two that write) pin
     `GIT_DIR`/`GIT_COMMON_DIR`/`GIT_WORK_TREE` too as belt and braces, the
     other post-codex git users rely on this refusal, and it makes a codex
     that tried it fail loudly instead.
  3. Refuse an embedded repository codex left in the tree: fail if the set
     of `.git` entries below the top level (directories, gitfiles or
     symlinks — `find -mindepth 2 -name .git`) differs from the list
     `Create codex user` snapshotted before the grant. A nested repo has its
     OWN `.git/config`, which neither the restore nor the env pins reach:
     once codex stages the directory as a gitlink, the landing step's `git
     status` / `git add -A` spawn `git status --porcelain=2` inside it
     (`is_submodule_modified`), the child refreshes the nested index, and a
     tracked file whose mtime changed re-hashes through the nested
     `filter.*.clean` driver — as `runner`, with the machine-account token
     in the environment (review round 5 of #73). Compared against a
     snapshot rather than refused outright so a caller's provisioning that
     legitimately leaves one (an editable `git+` install under `src/`)
     keeps working; codex's prompts forbid installs from `git+` URLs (a
     local `pip install -e .` is fine — no clone) — since its sandbox gained
     network (2026-09-09) such an install is the one way it could create
     one, and this check then fails the run loudly.
  4. `chown -R runner .git` — object fan-out dirs codex created are
     codex-owned, and the runner's codex-group membership is inert within
     the job, so runner-side object writes would otherwise fail
     intermittently.
  5. `chmod -R g-w .git` — revoke the group grant `Create codex user` put on
     the tree (`g+rwX` plus setgid on every directory). The chown alone
     leaves `.git/` `drwxrwsr-x runner codex`, a directory the codex user
     can still unlink from and create in, so a survivor of the kill would
     have a write path to the restored config; without the group bit it
     has none (codex is also in the `runner` group, so a `chgrp` would not
     do). Symbolic `g-w` keeps the setgid bit, so `.git` reads
     `drwxr-sr-x` afterwards — harmless, runner's umask gives new files no
     group write.
  6. `chmod g-w $GITHUB_WORKSPACE` (the root only, not recursive) — a
     same-parent rename needs write on the PARENT only, so with the
     workspace root still `drwxrwsr-x runner codex` a survivor could `mv
     .git .git.x && cp -a .git.x .git` and own the whole git dir; the
     landing step's `GIT_DIR` pin follows the path, so it would then read a
     config codex owns (review round 5 of #73). The rest of the working
     tree keeps its grant — runner owns the directories and reads codex's
     files fine.
  7. Restore the config `Create codex user` snapshotted right before the
     group grant, with `cp --remove-destination` — codex could have
     replaced the file with a symlink, and a plain cp would follow it and
     write elsewhere.
  8. Move `.git/hooks` aside (to `$RUNNER_TEMP/git-hooks.post-codex`, names
     of anything non-sample logged). A restore covers configuration, not
     files, and the chown leaves codex-written hooks runner-owned and
     executable; `git commit` is not the only runner — `git fetch` runs
     `reference-transaction` when it updates the remote-tracking ref (codex
     can delete the local one, so the next fetch deterministically does)
     and `git status` runs `post-index-change` whenever it writes the
     refreshed index — and the loops' hand-back and Surface fetches and
     claude.yml's open-PR fetch run both with the machine-account token in
     their env (review round 6 of #73). Nothing runner-side relies on
     hooks.
  9. Append `core.hooksPath = $RUNNER_TEMP/no-hooks` and `core.fsmonitor =
     false` to the restored config — the two keys a restore cannot cover
     (hooks are files, the fsmonitor extension lives in the index), pinned
     at this choke point so EVERY later git in the job is hook-free without
     each step carrying an env pin; the guard and landing steps keep their
     env pins as belt and braces.

  Steps 1-9 are `reclaim.sh` next to this file, which the composite's
  second step runs with its PATH already pinned; the Claude jobs' agent
  launcher runs the same script. With `user: claude-agent` every "codex"
  above reads as that user (design/executed-paths-residual.md → Pre-agent
  reclaim, → After the agent); the snapshot and hooks paths keep their
  `*-codex` names. Running it twice in a job is safe: each run restores
  the snapshot afresh and appends the pins once.

  Runs no git command itself. Referenced fully-qualified
  (meridianlabs-ai/agents/.github/actions/reclaim-codex-workspace@main); NO
  post step (local composite actions with post steps break teardown on the
  fork).

inputs:
  user:
    description: >-
      The agent user whose processes are killed and whose group grant is
      revoked: `codex` (the default: the codex jobs) or `claude-agent` (the
      Claude jobs, which run this before the agent as well as after it;
      design/executed-paths-residual.md → Pre-agent reclaim). The nested
      PATH check probes as this user too. Any other value fails the step.
    required: false
    default: codex
  config-snapshot:
    description: >-
      Path of the pre-codex `.git/config` copy to restore. Defaults to
      `$RUNNER_TEMP/git-config.pre-codex`, where `Create codex user` writes
      it (runner-only: RUNNER_TEMP stays 755 runner:runner, so codex can
      read but not replace it, and it contains no credential). Resolved in
      the shell rather than as a runner.temp-context default so the metadata
      needs no context.
    required: false
    default: ""
  embedded-snapshot:
    description: >-
      Path of the pre-codex list of embedded `.git` entries (sorted `find
      $GITHUB_WORKSPACE -mindepth 2 -name .git` output, one path per line;
      empty on a plain checkout). Defaults to
      `$RUNNER_TEMP/embedded-git.pre-codex`, where `Create codex user` writes
      it. Any difference after codex fails the step.
    required: false
    default: ""
  system-path:
    description: >-
      The PATH this step's commands run with, pinned before the first of
      them (see description, 0) and handed to the nested PATH check for its
      probes. The hosted runner image's root-owned system directories — NOT
      `/usr/local/bin`, which the image ships world-writable.
    required: false
    default: /usr/sbin:/usr/bin:/sbin:/bin

runs:
  using: composite
  steps:
    # 0. Refuse a job PATH with a codex-writable directory before anything
    #    else runs (see description).
    - uses: meridianlabs-ai/agents/.github/actions/assert-runner-only-path@main
      with:
        user: ${{ inputs.user }}
        system-path: ${{ inputs.system-path }}

    - shell: bash
      env:
        AGENT_USER: ${{ inputs.user }}
        SNAPSHOT: ${{ inputs.config-snapshot }}
        EMBEDDED_SNAPSHOT: ${{ inputs.embedded-snapshot }}
        SYSTEM_PATH: ${{ inputs.system-path }}
        RECLAIM_SCRIPT: ${{ github.action_path }}/reclaim.sh
      run: |
        set -euo pipefail
        # 0. System tools only, whatever GITHUB_PATH prepended: not even the
        #    `bash` that runs the script may resolve through a directory the
        #    agent user could write (reclaim.sh pins the same PATH again).
        export PATH="$SYSTEM_PATH"
        bash "$RECLAIM_SCRIPT"
