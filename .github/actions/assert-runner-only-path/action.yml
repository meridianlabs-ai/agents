name: assert-runner-only-path
description: >-
  Fail the job unless every directory on the job PATH is one the codex user
  cannot write or replace (Claude Security finding 4628448, 2026-09-22;
  design/codex-engine.md → Runner-side search path). The runner prepends
  every `GITHUB_PATH` entry to the PATH of every later step of the job,
  composite steps included, and resolves each `run:` step's shell
  interpreter through the same list (actions/runner `ScriptHandler`:
  `WhichUtil.Which(shell, …, prependPath)`); an entry, once added, is
  never removed. So a directory on the job PATH that the codex user can
  write — the workspace venv `provision-fallback` used to put there, made
  `runner:codex g+rwX` by `create-codex-user`'s grant — lets a
  prompt-injected codex plant `sudo`, `bash`, `git` or `jq` and have the
  FIRST runner-side step after its own run execute it as `runner`
  (passwordless sudo → root), before the reclaim's kill, chown or refusals:
  the codex containment would then be enforced by attacker-chosen binaries.
  No step's own `PATH=` can undo that (a step's env PATH is what the runner
  prepends TO, and the interpreter is chosen before the script runs), which
  is why this is checked and refused rather than pinned around.

  What is checked, for each PATH entry: every HOP of the entry as written —
  the entry itself and each of its ancestors up to `/` — and, wherever a hop
  is a symlink, every hop of the link's target as written, recursively
  (eight levels; a loop or an unresolvable hop refuses). A hop is a place
  the codex user could substitute: write on a directory is enough to rename
  its child away and put another in its place, and a symlink hop is
  replaced by writing its parent, so resolving the entry first and checking
  only the target would wave through a link from a writable place to
  `/usr/bin` (review round 1 of #131). Refused: a relative or empty entry
  (resolved against each step's working directory, the workspace); a hop
  whose physical path lies inside `$GITHUB_WORKSPACE` (codex-writable after
  the grant — checked by path, so it holds before the grant too); when the
  user exists, a hop that `sudo -u <user> test -w` finds writable, with the
  one exception of a sticky directory such as `/tmp`, where the user may
  create entries but not rename or unlink another user's — accepted when the
  child on the way down exists and is not owned by the user (`find -user`,
  which does not follow a symlink child); a hop that does not exist yet
  whose nearest existing ancestor is writable (the user could create it);
  and a regular file directly inside an entry that the user can write (an
  existing tool overwritten in place). Every probe runs by absolute system
  path: this step pins its OWN PATH to `system-path` first, so the check
  does not depend on the list it is checking.

  `protect: "true"` (how `create-codex-user` runs it, before the grant)
  turns a writable hop outside the workspace into a runner-only one instead
  of refusing it — `chown <this step's user>` plus `chmod go-w`, sticky and
  other bits kept — and refuses only if it is still writable afterwards
  (owned by the user, say). This is not an exemption: the hosted Ubuntu
  image ships `/opt` (with `/opt/pipx_bin` and `/opt/hostedtoolcache` on
  the job PATH), `/usr/local/bin` and `/usr/local/.ghcup` recursively mode
  777 (actions/runner-images `images/ubuntu/scripts/build/configure-system.sh`,
  `configure-environment.sh`, `install-nodejs.sh`, `install-haskell.sh`), so
  on a stock runner ANY unprivileged user could plant `/opt/pipx_bin/sudo`
  ahead of `/usr/bin` — refusing that would fail every codex run, and
  ignoring it would leave the hole the workspace venv merely made
  convenient. Protecting keeps the runner user's own writes (npm's global
  bin in `/usr/local/bin`, which openai/codex-action's `npm install -g`
  needs; the toolcache setup-* actions fill) and takes the codex user's
  away. Writable regular files directly inside an entry get `chmod go-w`
  the same way. Workspace hops are never protected: a workspace directory
  on the job PATH is a provisioning mistake the caller must fix
  (`provision-fallback` `add-to-path: false`). Without `protect` (how
  `reclaim-codex-workspace` runs it after codex) every writable hop
  refuses.

  Run twice on the codex write paths and once on the review path: by
  `create-codex-user`, after the user exists and BEFORE the workspace
  grant, so a job whose PATH would be hijackable never starts codex (the
  primary defence — codex never runs, and nothing untrusted has touched
  the runner's PATH or the protected directories); and by
  `reclaim-codex-workspace` first thing after codex, in case a later step or
  action added to `GITHUB_PATH` meanwhile (codex itself cannot: the
  per-step `GITHUB_PATH` file lives under the runner-only `$RUNNER_TEMP`;
  openai/codex-action installs the CLI with `npm install -g` and adds no
  path). Referenced fully-qualified
  (meridianlabs-ai/agents/.github/actions/assert-runner-only-path@main); NO
  post step (local composite actions with post steps break teardown on the
  fork). `tests/codex_path_smoke.sh` runs it on a hosted runner against the
  real image PATH and real identities.

inputs:
  user:
    description: >-
      The unprivileged user whose write access disqualifies a directory.
      Probed with `sudo -u <user> test -w`, so its group memberships count;
      skipped (path checks only) when the user does not exist yet.
    required: false
    default: codex
  protect:
    description: >-
      "true": a writable hop outside the workspace is made runner-only
      (`chown` to this step's user, `chmod go-w`) and re-probed instead of
      refused; "false" (default): refused. See description.
    required: false
    default: "false"
  system-path:
    description: >-
      The PATH this step runs its own probes with (`sudo`, `test`, `find`,
      `dirname` are resolved through it, never through the job PATH under
      test). The root-owned system directories of the hosted runner image —
      NOT `/usr/local/bin`, which the image ships world-writable; its entries
      are part of the job PATH and are checked like every other.
    required: false
    default: /usr/sbin:/usr/bin:/sbin:/bin

runs:
  using: composite
  steps:
    - shell: bash
      env:
        USER_NAME: ${{ inputs.user }}
        PROTECT: ${{ inputs.protect }}
        SYSTEM_PATH: ${{ inputs.system-path }}
      run: |
        set -euo pipefail
        job_path="$PATH"
        export PATH="$SYSTEM_PATH"
        me=$(id -un)
        ws=$(cd "$GITHUB_WORKSPACE" && pwd -P)
        # The physical path of a hop that may not exist yet: the nearest
        # existing directory resolved (symlinks and all), the rest appended
        # verbatim; fails on an unresolvable directory (a symlink loop).
        # Portable (`realpath -m` is GNU-only; the tests run on macOS too).
        physical() {
          local p="$1" rest="" real
          while [ ! -d "$p" ]; do
            rest="/$(basename "$p")$rest"
            p=$(dirname "$p")
          done
          real=$(cd "$p" 2>/dev/null && pwd -P) || return 1
          printf '%s%s\n' "$real" "$rest"
        }
        refuse() { # <entry> <reason>
          echo "::error::job PATH entry '$1' $2 — every step after codex resolves its commands, and the runner its shell interpreter, through the job PATH, so a directory the codex user can write or replace there hands it code execution as runner; refusing to continue (design/codex-engine.md → Runner-side search path)."
          exit 1
        }
        have_user=""
        if id "$USER_NAME" >/dev/null 2>&1; then have_user=1; fi
        writable() { sudo -u "$USER_NAME" test -w "$1"; }
        # lstat, not stat: a symlink child the user owns is the user's to
        # rename, whatever its target's owner.
        owned() { [ -n "$(sudo find "$1" -maxdepth 0 -user "$USER_NAME" 2>/dev/null)" ]; }
        # Make a hop runner-only and say so; the caller re-probes.
        protect() {
          sudo chown "$me" "$1"
          sudo chmod go-w "$1"
          echo "protected job PATH hop $1 (was writable by $USER_NAME; now owned by $me, group/other write removed)"
        }
        protected=0
        # Every hop of PATH as written, from the path up to /, then the
        # target chain of each symlink hop the same way (see description).
        walk() { # <entry> <path as written> <symlink depth>
          local e="$1" a="$2" depth="$3" child="" p target
          if [ "$depth" -gt 8 ]; then refuse "$e" "passes through more than 8 symlinks (at $a)"; fi
          while :; do
            p=$(physical "$a") || refuse "$e" "cannot be resolved (at $a)"
            if [ "$p" = "$ws" ] || [ "${p#"$ws"/}" != "$p" ]; then
              refuse "$e" "lies inside the workspace $GITHUB_WORKSPACE (at $a), which the codex user can write"
            fi
            if [ -L "$a" ]; then
              target=$(readlink "$a")
              case "$target" in /*) ;; *) target="$(dirname "$a")/$target" ;; esac
              walk "$e" "$target" $((depth + 1))
            fi
            if [ -n "$have_user" ] && sudo test -e "$a" && writable "$a"; then
              # Sticky (/tmp): creation only, so an EXISTING child not owned
              # by the user is safe there; a missing child or one the user
              # owns is not.
              if [ -n "$child" ] && sudo test -k "$a" && sudo test -e "$child" && ! owned "$child"; then
                :
              elif [ "$PROTECT" = "true" ] && [ ! -L "$a" ]; then
                protect "$a"
                protected=$((protected + 1))
                if writable "$a"; then refuse "$e" "is still writable by the $USER_NAME user after protection (at $a)"; fi
              else
                refuse "$e" "is writable by the $USER_NAME user (at $a)"
              fi
            fi
            [ "$a" = / ] && break
            child="$a"; a=$(dirname "$a")
          done
        }
        n=0
        # `tr` rather than `read -a`: an empty component ("a::b", a trailing
        # colon) must come out as an empty line, not vanish.
        while IFS= read -r e; do
          n=$((n + 1))
          case "$e" in
            "" ) refuse "(empty)" "is empty, which means the current directory" ;;
            /*) ;;
            *) refuse "$e" "is a relative path, resolved against each step's working directory" ;;
          esac
          walk "$e" "$e" 0
          [ -n "$have_user" ] || continue
          # Regular files directly inside the entry: an existing tool the
          # user could overwrite in place. Symlinks are skipped (chmod would
          # reach only their targets); group/other write bits select the
          # candidates, the user probe decides.
          p=$(physical "$e")
          if sudo test -d "$p"; then
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              writable "$f" || continue
              if [ "$PROTECT" = "true" ]; then
                sudo chmod go-w "$f"
                protected=$((protected + 1))
                if writable "$f"; then refuse "$e" "holds $f, still writable by the $USER_NAME user after protection"; fi
              else
                refuse "$e" "holds $f, a file writable by the $USER_NAME user"
              fi
            done < <(sudo find "$p" -maxdepth 1 -type f \( -perm -0002 -o -perm -0020 \) 2>/dev/null)
          fi
        done < <(printf '%s\n' "$job_path" | tr ':' '\n')
        echo "job PATH: $n entries, none inside the workspace${have_user:+ or writable by $USER_NAME}${have_user:+ ($protected hop(s)/file(s) protected)}."
