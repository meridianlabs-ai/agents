name: assert-runner-only-path
description: >-
  Fail the job unless every directory on the job PATH is one the codex user
  cannot write or replace (Claude Security finding 4628448, 2026-09-22;
  design/codex-engine.md → Runner-side search path). The runner prepends
  every `GITHUB_PATH` entry to the PATH of every later step of the job,
  composite steps included, and resolves each `run:` step's shell
  interpreter through the same list (actions/runner `ScriptHandler`:
  `WhichUtil.Which(shell, …, prependPath)`); an entry, once added, is
  never removed. So a directory on the job PATH that the codex user can
  write — the workspace venv `provision-fallback` used to put there, made
  `runner:codex g+rwX` by `create-codex-user`'s grant — lets a
  prompt-injected codex plant `sudo`, `bash`, `git` or `jq` and have the
  FIRST runner-side step after its own run execute it as `runner`
  (passwordless sudo → root), before the reclaim's kill, chown or refusals:
  the codex containment would then be enforced by attacker-chosen binaries.
  No step's own `PATH=` can undo that (a step's env PATH is what the runner
  prepends TO, and the interpreter is chosen before the script runs), which
  is why this is checked and refused rather than pinned around.

  What is checked, for each PATH entry: every HOP of the entry as written —
  the entry itself and each of its ancestors up to `/` — and, wherever a hop
  is a symlink, every hop of the link's target as written, recursively
  (eight levels; a loop or an unresolvable hop refuses). A hop is a place
  the codex user could substitute: write on a directory is enough to rename
  its child away and put another in its place, and a symlink hop is
  replaced by writing its parent, so resolving the entry first and checking
  only the target would wave through a link from a writable place to
  `/usr/bin` (review round 1 of #131). Refused: a relative or empty entry
  (resolved against each step's working directory, the workspace); a hop
  whose physical path lies inside `$GITHUB_WORKSPACE` (codex-writable after
  the grant — checked by path, so it holds before the grant too); when the
  user exists, a hop the user OWNS (`find -user`, an lstat — ownership is
  authority: an owner can chmod a read-only directory writable again, and
  the owner of a sticky directory may rename or unlink anyone's entries in
  it; review round 2 of #131) or that `sudo -u <user> test -w` finds
  writable, with the one exception of a sticky directory the user does not
  own, such as `/tmp`, where the user may create entries but not rename or
  unlink another user's — accepted when the child on the way down exists
  and is not owned by the user; and a hop that does not exist yet whose
  nearest existing ancestor is writable (the user could create it). Then
  the FILES directly inside each entry — a tool a later step may call, or
  the runner may pick as an interpreter — found in one `find` pass: every
  symlink, everything the user owns, everything the user could write
  through its group or the world (nothing else is the user's to change; the
  hosted image carries no ACLs). A symlink is followed as written — its
  target's directory chain is walked like an entry and the target checked
  in turn, recursively — so `bash -> $GITHUB_WORKSPACE/.venv/bin/bash` in a
  runner-only directory, or a link to a file the user owns or can write or
  replace, is refused as the planted interpreter it is; a regular file the
  user owns or can write is refused (round 2 of #131: the first cut skipped
  symlinks and prefiltered by mode bits). Hops and files found safe are
  remembered — when found UNCONDITIONALLY safe: a sticky directory accepted
  for one child is not, that acceptance is the child's, and a safe sibling
  must not vouch for a missing one (round 3 of #131) — so a chain many
  links share (`/etc/alternatives`, a toolcache) is probed once. The probes
  are batched per directory: three privileged `find` passes list what
  exists, what the user owns and what it can write (`-writable`, access(2)
  as the user), so a directory with hundreds of entries costs three `sudo`
  processes rather than hundreds — seconds on the hosted image for the
  whole job PATH, not the minute the per-path probes took. Every probe runs
  by absolute system path:
  this step pins its OWN PATH to `system-path` first, so the check does not
  depend on the list it is checking.

  `protect: "true"` (how `create-codex-user` runs it, before the grant)
  turns an owned or writable hop or file outside the workspace into a
  runner-only one instead of refusing it — `chown <this step's user>` plus
  `chmod go-w`, sticky and other bits kept — and refuses only if it is
  still owned or writable afterwards (a symlink is never protected: it is
  refused). This is not an exemption: the hosted Ubuntu
  image ships `/opt` (with `/opt/pipx_bin` and `/opt/hostedtoolcache` on
  the job PATH), `/usr/local/bin` and `/usr/local/.ghcup` recursively mode
  777 (actions/runner-images `images/ubuntu/scripts/build/configure-system.sh`,
  `configure-environment.sh`, `install-nodejs.sh`, `install-haskell.sh`), so
  on a stock runner ANY unprivileged user could plant `/opt/pipx_bin/sudo`
  ahead of `/usr/bin` — refusing that would fail every codex run, and
  ignoring it would leave the hole the workspace venv merely made
  convenient. Protecting keeps the runner user's own writes (npm's global
  bin in `/usr/local/bin`, which openai/codex-action's `npm install -g`
  needs; the toolcache setup-* actions fill) and takes the codex user's
  away. Owned or writable files directly inside an entry, and the targets
  their symlinks reach, are protected the same way. Workspace hops are never protected: a workspace directory
  on the job PATH is a provisioning mistake the caller must fix
  (`provision-fallback` `add-to-path: false`). Without `protect` (how
  `reclaim-codex-workspace` runs it after codex) every owned or writable hop
  or file refuses.

  Run twice on the codex write paths and once on the review path: by
  `create-codex-user`, after the user exists and BEFORE the workspace
  grant, so a job whose PATH would be hijackable never starts codex (the
  primary defence — codex never runs, and nothing untrusted has touched
  the runner's PATH or the protected directories); and by
  `reclaim-codex-workspace` first thing after codex, in case a later step or
  action added to `GITHUB_PATH` meanwhile (codex itself cannot: the
  per-step `GITHUB_PATH` file lives under the runner-only `$RUNNER_TEMP`;
  openai/codex-action installs the CLI with `npm install -g` and adds no
  path). Referenced fully-qualified
  (meridianlabs-ai/agents/.github/actions/assert-runner-only-path@main); NO
  post step (local composite actions with post steps break teardown on the
  fork). `tests/codex_path_smoke.sh` runs it on a hosted runner against the
  real image PATH and real identities.

inputs:
  user:
    description: >-
      The unprivileged user whose ownership or write access disqualifies a
      directory or file. Probed with `find -user` and `sudo -u <user> test
      -w`, so its group memberships count; skipped (path checks only) when
      the user does not exist yet.
    required: false
    default: codex
  protect:
    description: >-
      "true": an owned or writable hop or file outside the workspace is made
      runner-only (`chown` to this step's user, `chmod go-w`) and re-probed
      instead of refused; "false" (default): refused. See description.
    required: false
    default: "false"
  system-path:
    description: >-
      The PATH this step runs its own probes with (`sudo`, `test`, `find`,
      `dirname` are resolved through it, never through the job PATH under
      test). The root-owned system directories of the hosted runner image —
      NOT `/usr/local/bin`, which the image ships world-writable; its entries
      are part of the job PATH and are checked like every other.
    required: false
    default: /usr/sbin:/usr/bin:/sbin:/bin

runs:
  using: composite
  steps:
    - shell: bash
      env:
        USER_NAME: ${{ inputs.user }}
        PROTECT: ${{ inputs.protect }}
        SYSTEM_PATH: ${{ inputs.system-path }}
      run: |
        set -euo pipefail
        job_path="$PATH"
        export PATH="$SYSTEM_PATH"
        me=$(id -un)
        ws=$(cd "$GITHUB_WORKSPACE" && pwd -P)
        # The physical path of a hop that may not exist yet: the nearest
        # existing directory resolved (symlinks and all), the rest appended
        # verbatim; fails on an unresolvable directory (a symlink loop).
        # Portable (`realpath -m` is GNU-only; the tests run on macOS too).
        physical() {
          local p="$1" rest="" real
          while [ ! -d "$p" ]; do
            rest="/$(basename "$p")$rest"
            p=$(dirname "$p")
          done
          real=$(cd "$p" 2>/dev/null && pwd -P) || return 1
          printf '%s%s\n' "$real" "$rest"
        }
        refuse() { # <entry> <reason>
          echo "::error::job PATH entry '$1' $2 — every step after codex resolves its commands, and the runner its shell interpreter, through the job PATH, so a directory or file the codex user can write, own or replace there hands it code execution as runner; refusing to continue (design/codex-engine.md → Runner-side search path)."
          exit 1
        }
        inside_ws() { [ "$1" = "$ws" ] || [ "${1#"$ws"/}" != "$1" ]; }
        have_user=""
        groups_expr=()
        if id "$USER_NAME" >/dev/null 2>&1; then
          have_user=1
          # The user's groups, for the one-pass candidate scan below.
          for g in $(id -Gn "$USER_NAME"); do
            [ ${#groups_expr[@]} -eq 0 ] || groups_expr+=(-o)
            groups_expr+=(-group "$g")
          done
        fi
        # Newline-delimited sets: membership by exact line.
        set_has() { [[ "$1" == *$'\n'"$2"$'\n'* ]]; }
        # Answers for whole directories, three privileged passes each — what
        # exists, what the user owns (lstat), what the user can write
        # (access(2) as the user; GNU find's -writable) — so a directory with
        # hundreds of entries costs three sudo processes, not hundreds. The
        # per-path probes below are the fallback for a path whose directory
        # was not listed, and the re-check after a protection.
        listed=$'\n'; listed_w=$'\n'; exists_set=$'\n'; owned_set=$'\n'; writable_set=$'\n'
        list_dir() { # <directory>
          set_has "$listed" "$1" && return 0
          local ex ow wr
          # A directory that does not exist (an entry added before its tool
          # is installed) has no entries: listed as empty.
          if ! sudo test -d "$1"; then listed="$listed$1"$'\n'; listed_w="$listed_w$1"$'\n'; return 0; fi
          ex=$(sudo find "$1" -mindepth 1 -maxdepth 1 2>&1) || { echo "::error::assert-runner-only-path: could not list $1 ($ex)"; exit 1; }
          ow=$(sudo find "$1" -mindepth 1 -maxdepth 1 -user "$USER_NAME" 2>&1) || { echo "::error::assert-runner-only-path: could not list the $USER_NAME-owned entries of $1 ($ow)"; exit 1; }
          listed="$listed$1"$'\n'
          exists_set="$exists_set$ex"$'\n'
          owned_set="$owned_set$ow"$'\n'
          # As the user: a directory the user cannot read is not listed this
          # way, and its entries fall back to the per-path probe.
          if wr=$(sudo -u "$USER_NAME" find "$1" -mindepth 1 -maxdepth 1 -writable 2>/dev/null); then
            listed_w="$listed_w$1"$'\n'
            writable_set="$writable_set$wr"$'\n'
          fi
        }
        # `/` has no listed parent: it is always probed on its own.
        exists() { if [ "$1" != / ] && set_has "$listed" "$(dirname "$1")"; then set_has "$exists_set" "$1"; else sudo test -e "$1"; fi; }
        # lstat, not stat: a symlink the user owns is the user's to rename or
        # repoint, whatever its target's owner. Ownership is authority: an
        # owner can chmod a read-only directory or file writable again, so an
        # owned hop counts whatever its mode says now (review round 2 of #131).
        owned_probe() { [ -n "$(sudo find "$1" -maxdepth 0 -user "$USER_NAME" 2>/dev/null)" ]; }
        writable_probe() { sudo -u "$USER_NAME" test -w "$1"; }
        owned() { if [ "$1" != / ] && set_has "$listed" "$(dirname "$1")"; then set_has "$owned_set" "$1"; else owned_probe "$1"; fi; }
        writable() { if [ "$1" != / ] && set_has "$listed_w" "$(dirname "$1")"; then set_has "$writable_set" "$1"; else writable_probe "$1"; fi; }
        # Make a hop or file runner-only and say so; the caller re-probes.
        protect() {
          sudo chown "$me" "$1"
          sudo chmod go-w "$1"
          echo "protected job PATH ${2:-hop} $1 (was writable by or owned by $USER_NAME; now owned by $me, group/other write removed)"
        }
        protected=0
        # Hops and files already found UNCONDITIONALLY safe (or made safe): a
        # symlink target's chain is shared by many links (/etc/alternatives,
        # a toolcache), and every hop's ancestors were walked when the hop
        # was. A sticky directory accepted for one child is NOT remembered:
        # that acceptance holds for that child only (review round 3 of #131
        # — a safe sibling must not vouch for a missing one).
        seen=$'\n'
        seen_has() { set_has "$seen" "$1"; }
        seen_add() { seen="$seen$1"$'\n'; }
        contextual=""
        # One hop: refuse a workspace hop; a hop the user owns or can write is
        # protected (protect mode) or refused, with the sticky exception for
        # a directory the user does not own (see description).
        settle() { # <entry> <hop as written> <physical> <child or empty> <kind>
          local e="$1" a="$2" p="$3" child="$4" kind="$5"
          contextual=""
          if inside_ws "$p"; then
            refuse "$e" "lies inside the workspace $GITHUB_WORKSPACE (at $a), which the codex user can write"
          fi
          [ -n "$have_user" ] || return 0
          [ "$a" = / ] || list_dir "$(dirname "$a")"
          exists "$a" || return 0
          local why=""
          if owned "$a"; then why="is owned by the $USER_NAME user"
          elif [ -L "$a" ]; then
            # A symlink's writability is its target's, settled through the
            # target chain before this; the link itself is replaced only by
            # its owner (above) or through its parent (a hop). Never ask the
            # listing: it may predate the target's protection.
            return 0
          elif writable "$a"; then
            # Sticky (/tmp): creation only, so an EXISTING child not owned by
            # the user is safe there; a missing child, or one the user owns,
            # is not — and an owned sticky directory never is (handled above).
            if [ "$kind" = hop ] && [ -n "$child" ] && sudo test -k "$a" && exists "$child" && ! owned "$child"; then
              contextual=1
              return 0
            fi
            why="is writable by the $USER_NAME user"
          else
            return 0
          fi
          if [ "$PROTECT" = "true" ] && [ ! -L "$a" ]; then
            protect "$a" "$kind"
            protected=$((protected + 1))
            if owned_probe "$a" || writable_probe "$a"; then refuse "$e" "is still owned or writable by the $USER_NAME user after protection (at $a)"; fi
          else
            refuse "$e" "$why (at $a)"
          fi
        }
        # Every hop of a path as written, from the path up to /, then the
        # target chain of each symlink hop the same way (see description).
        walk() { # <entry> <path as written> <symlink depth>
          local e="$1" a="$2" depth="$3" child="" p target
          if [ "$depth" -gt 8 ]; then refuse "$e" "passes through more than 8 symlinks (at $a)"; fi
          while :; do
            if seen_has "$a"; then break; fi
            p=$(physical "$a") || refuse "$e" "cannot be resolved (at $a)"
            if [ -L "$a" ]; then
              target=$(readlink "$a")
              case "$target" in /*) ;; *) target="$(dirname "$a")/$target" ;; esac
              walk "$e" "$target" $((depth + 1))
            fi
            settle "$e" "$a" "$p" "$child" hop
            [ -n "$contextual" ] || seen_add "$a"
            [ "$a" = / ] && break
            child="$a"; a=$(dirname "$a")
          done
        }
        # A file directly inside a PATH entry — a tool a later step may call
        # or the runner may pick as an interpreter. A symlink is followed as
        # written: its target's directory chain is walked and the target
        # checked in turn (a link from a runner-only directory into the
        # workspace, or to a file the user owns or can write or replace, is
        # the planted interpreter by another name — review round 2 of #131).
        check_file() { # <entry> <file as written> <symlink depth>
          local e="$1" f="$2" depth="$3" p target
          if seen_has "$f"; then return 0; fi
          if [ "$depth" -gt 8 ]; then refuse "$e" "holds $f, which passes through more than 8 symlinks"; fi
          if [ -L "$f" ]; then
            target=$(readlink "$f")
            case "$target" in /*) ;; *) target="$(dirname "$f")/$target" ;; esac
            walk "$e" "$(dirname "$target")" $((depth + 1))
            check_file "$e" "$target" $((depth + 1))
          fi
          p=$(physical "$f") || refuse "$e" "holds $f, which cannot be resolved"
          settle "$e" "$f" "$p" "" file
          seen_add "$f"
        }
        n=0
        # `tr` rather than `read -a`: an empty component ("a::b", a trailing
        # colon) must come out as an empty line, not vanish.
        while IFS= read -r e; do
          n=$((n + 1))
          case "$e" in
            "" ) refuse "(empty)" "is empty, which means the current directory" ;;
            /*) ;;
            *) refuse "$e" "is a relative path, resolved against each step's working directory" ;;
          esac
          walk "$e" "$e" 0
          [ -n "$have_user" ] || continue
          # The entry's files, in one find pass: every symlink (its target
          # decides), everything the user owns, and everything the user could
          # write through its group or the world. Nothing else is the user's
          # to change (no ACLs on the hosted image).
          p=$(physical "$e")
          if sudo test -d "$p"; then
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              check_file "$e" "$f" 0
            done < <(sudo find "$p" -mindepth 1 -maxdepth 1 \( -type l -o -user "$USER_NAME" -o -perm -0002 -o \( -perm -0020 \( "${groups_expr[@]}" \) \) \) 2>/dev/null)
          fi
        done < <(printf '%s\n' "$job_path" | tr ':' '\n')
        echo "job PATH: $n entries, none inside the workspace${have_user:+ or owned or writable by $USER_NAME}${have_user:+ ($protected hop(s)/file(s) protected)}."
