name: reset-auto-counters
description: >-
  Reset the @auto loops' sticky counter comments — the CI-fix attempt tally
  (`<!-- auto-fix-attempts -->`, claude-auto.yml) and/or the review-round
  tally (`<!-- auto-review-rounds -->`, claude-auto-review.yml) — so the
  loop's next round starts at 1 with the full cap (design/auto-agent.md →
  Autonomy ceiling). Both counters are per-PR-lifetime tallies; the ONLY
  things that reset them are the two paths that share this step body: a
  human re-engaging the loop with an `@auto` comment on an existing PR
  (claude.yml, both counters) and the loops' own escalation hand-off (each
  loop resets its own counter, so "re-add the label to let me try again" is
  true). Referenced fully-qualified
  (meridianlabs-ai/agents/.github/actions/reset-auto-counters@main); NO post
  step (local composite actions with post steps break teardown on the fork).

  The reset body keeps the marker on line 1 (that is what the gates search
  for) and carries NO `rounds:` / `attempts:` number and NO
  `auto-review-head:` tip, so each gate's extractor reads the counter as
  absent (0) and the next round's Record step re-initialises the marker.
  With `trusted-logins` set, only a marker comment by one of those logins is
  a counter (the review-fix gate's own selection, Claude Security 4121983):
  resetting the newest marker regardless of author would PATCH an outsider's
  forgery and leave the loop's real counter exhausted, so "re-add the label"
  escalated again on sight.
  Dropping the head marker is deliberate: the no-progress check compares tips
  only once `prev >= 1`, so a fresh budget's first round is never mis-read as
  a stall (re-adding the label without pushing does not trip it), and that
  round records a fresh tip before anything reads one. The `reason` text is
  spliced into the body, so it must not contain a marker substring, a
  `rounds:`/`attempts:` number, or a literal @-trigger.

  Best-effort: every failure is reported through the `ok` output and never
  fails the caller's job — the callers' hand-off comment and label handling
  are the load-bearing part, and they phrase themselves on `ok`. A missing
  counter comment is not a failure (nothing to reset: the next round already
  starts at 1). The lookup and the PATCH retry with backoff (same shape as
  the gates' `ghr`) so a transient 5xx / rate-limit HTML page does not turn
  into a hand-off asking the human to hand-edit the counter; `ok=0` is
  reserved for the persistent case.

inputs:
  token:
    description: >-
      Token that can edit the machine account's comments (MARVIN_TOKEN, or
      github.token where the counters were posted by the workflow token).
    required: true
  repo:
    description: owner/name the PR lives in.
    required: true
  pr:
    description: Pull-request number whose counter comment(s) to reset.
    required: true
  counters:
    description: >-
      Space-separated subset of `rounds attempts` to reset. Default: both.
    required: false
    default: "rounds attempts"
  reason:
    description: >-
      Short human-readable clause recorded in the reset body after the word
      "reset", e.g. "on escalation — re-adding `auto` starts a fresh budget"
      (renders as "🤖 auto review rounds reset (on escalation — …) — the next
      round starts at 1 with the full cap.").
    required: true
  trusted-logins:
    description: >-
      Comma-separated logins whose marker comments count as the counter
      (the caller's TRUSTED_LOGINS). Empty (default): the newest marker
      comment by any author, as before.
    required: false
    default: ""

outputs:
  ok:
    description: >-
      "1" when every requested counter was reset or had no comment to reset;
      "0" when a lookup or PATCH failed (that counter keeps its old value).
    value: ${{ steps.reset.outputs.ok }}

runs:
  using: composite
  steps:
    - id: reset
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        PR: ${{ inputs.pr }}
        COUNTERS: ${{ inputs.counters }}
        REASON: ${{ inputs.reason }}
        TRUSTED_LOGINS: ${{ inputs.trusted-logins }}
      run: |
        set -uo pipefail
        # Retry with backoff, same shape as the gates' ghr(): a 5xx or
        # secondary-rate-limit response is an HTML page that makes `--jq`
        # fail with "invalid character '<'" (observed, per the gate comments).
        # Each attempt's stdout is captured and emitted only on overall
        # success, so a fail-then-succeed retry cannot prefix the captured
        # comment id with an error body.
        ghr() {
          local n=0 out
          until out=$("$@"); do
            n=$((n+1))
            if [ "$n" -ge 4 ]; then return 1; fi
            sleep $((n*3))
          done
          printf '%s' "$out"
        }
        ok=1
        # Comma list → jq array (whitespace-tolerant); `[]` when unset, which
        # the selection below reads as "any author".
        trusted=$(jq -cn --arg t "$TRUSTED_LOGINS" '$t | split(",") | map(gsub("^ +| +$"; "")) | map(select(. != ""))')
        for counter in $COUNTERS; do
          case "$counter" in
            rounds)   marker="<!-- auto-review-rounds -->"; label="auto review rounds";  unit="round" ;;
            attempts) marker="<!-- auto-fix-attempts -->";  label="auto CI-fix attempts"; unit="attempt" ;;
            *) echo "::warning::reset-auto-counters: unknown counter '$counter'; skipping."; ok=0; continue ;;
          esac
          # Same lookup the gates use: the LAST comment carrying the marker
          # — by one of the trusted logins when the caller named them. Gate
          # on the exit code, not the output: an empty result means no
          # counter comment exists (nothing to reset), a persistently failed
          # call means we don't know — report that as not-ok rather than
          # claiming a reset. `--paginate` output is one merged array on
          # current gh, one array per page on older releases; -s plus
          # `.[][]` flattens either.
          if ! cid=$(ghr gh api "repos/$REPO/issues/$PR/comments" --paginate \
                       | jq -rs --arg m "$marker" --argjson t "$trusted" \
                           '[.[][] | select((.body|contains($m)) and (($t|length) == 0 or ((.user.login // "") as $l | any($t[]; . == $l))))] | last | .id // empty'); then
            echo "::warning::reset-auto-counters: could not look up the $label comment on #$PR (after retries)."
            ok=0; continue
          fi
          if [ -z "$cid" ]; then
            echo "reset-auto-counters: no $label comment on #$PR; nothing to reset (the next $unit starts at 1)."
            continue
          fi
          body="$marker
        🤖 $label reset ($REASON) — the next $unit starts at 1 with the full cap."
          # The PATCH is idempotent, so retrying it is safe.
          if ghr gh api -X PATCH "repos/$REPO/issues/comments/$cid" -f body="$body" --silent; then
            echo "reset-auto-counters: reset $label on #$PR (comment $cid)."
          else
            echo "::warning::reset-auto-counters: could not reset $label on #$PR (comment $cid) after retries; it keeps its old value."
            ok=0
          fi
        done
        echo "ok=$ok" >>"$GITHUB_OUTPUT"
