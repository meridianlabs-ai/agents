          # 4628445): Claude Code then reads settings, hooks, .mcp.json,
          # CLAUDE.md, rules and skills from the user scope alone — the
          # action's merge of the caller's `settings` and the overlay — and
          # never from the checkout (project and local scopes), at startup
          # or on its settings watcher, so a project file that survives the
          # strip or appears mid-run changes nothing. Spliced AFTER the
          # caller's claude_args: the action takes the last --setting-sources
          # it sees. Same-repo heads are untouched.
          claude_args: >-
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
            ${{ inputs.model != '' && inputs.fallback_model != '' && format('--fallback-model {0}', inputs.fallback_model) || '' }}
            ${{ inputs.append_system_prompt != '' && format('--append-system-prompt {0}', toJSON(inputs.append_system_prompt)) || '' }}
            ${{ inputs.claude_args }}
            ${{ (needs.gate.outputs.mode == 'external' || needs.gate.outputs.fork_head == 'true') && '--setting-sources user' || '' }}
