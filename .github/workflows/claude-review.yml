      # The sandbox overlay's file `mask` entry (issue #70) needs Claude Code
      # >= 2.1.221, and `--setting-sources user` excludes a source's
      # sandbox.filesystem entries, Edit allow rules and Read deny rules from
      # the sandbox configuration only from 2.1.246 (code.claude.com/docs/en/
      # sandboxing → setting sources; Claude Security 4628445) — the floor is
      # the higher one. claude-code-action@v1 pins the CLI it installs and puts
      # it on GITHUB_PATH from inside its own steps, so `claude` exists on the
      # runner only AFTER the agent step — the check cannot run before it.
      # An older CLI would not have applied the mask, so a regression fails
      # the run loudly after the fact (::error + red job, the review already
      # posted) instead of leaving a green run with the token readable — and
      # `Surface agent errors` reads this step's outcome to post a ⚠️ on the
      # thread, since a red job under an already-complete review is the kind
      # of red nobody opens. Sandboxed paths only; skipped when the agent
      # never launched.
      - name: Check Claude Code version (sandbox file-mask and setting-source support)
        id: cliver
        if: >-
          always() && needs.gate.outputs.ok == 'true' &&
          steps.claude.outcome != 'skipped' &&
          (needs.gate.outputs.mode == 'external' || needs.gate.outputs.fork_head == 'true')
