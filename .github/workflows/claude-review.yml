          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -uo pipefail
          need=2.1.246
          # `|| true`: the step runs under `bash -e`, so without it a missing
          # binary (or unparseable --version) would exit here, before the
          # diagnostics below — red but silent.
          have=$(claude --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          echo "Claude Code version: ${have:-unknown} (sandbox credentials.files mask mode needs >= 2.1.221; excluded setting sources dropping out of the sandbox configuration needs >= $need)"
          if [ -z "$have" ]; then
