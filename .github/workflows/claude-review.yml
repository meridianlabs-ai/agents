      - uses: anthropics/claude-code-action@v1
        if: needs.gate.outputs.ok == 'true'
        id: claude
        with:
          anthropic_federation_rule_id: fdrl_01GpNgJm9jE6ZfvcqoJYQL2Y
          anthropic_organization_id: be5d0086-bc43-45d2-9184-20ecdd647aa7
          anthropic_service_account_id: svac_01RL4wYD7ikbypwYKf4wFojv
          anthropic_workspace_id: wrkspc_01RKCQ5DTPBatQ7kHLkaEueD
          prompt: ${{ steps.reviewprompt.outputs.value }}
          settings: ${{ steps.reviewsettings.outputs.value }}
          # The caller's list plus the loops' own identity (TRUSTED_LOGINS —
          # the User entry is inert, the action consults the list for
          # non-User actors only), so the land jobs' `@review` hand-back is
          # honoured once it posts as the App's bot login. "*" is kept as
          # the bare wildcard: the action recognises only the exact string.
          allowed_bots: ${{ inputs.allowed_bots == '*' && '*' || (inputs.allowed_bots != '' && format('{0},{1}', inputs.allowed_bots, env.TRUSTED_LOGINS) || env.TRUSTED_LOGINS) }}
