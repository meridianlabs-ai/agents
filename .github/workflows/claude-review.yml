name: Claude review (reusable)

# Read-only reviewer persona, separate from the dev agent in claude.yml.
# Posts PR review comments but has no write access to contents — it cannot
# push commits or open PRs (enforced by job permissions, not just the prompt).
# Same WIF auth as the dev agent. Callers add a stub (see
# examples/claude-review-stub.yml) that triggers on pull_request events
# (auto-review) and/or @review comments.
#
# Auto-review-on-open only fires where this workflow file exists on the PR's
# base branch (GitHub resolves pull_request-family workflows from the PR's
# branches, not the default branch). On a pristine-base mirror like the
# inspect_ai fork — whose PRs target an upstream-mirror `main` that has no
# meridian workflows — pull_request never fires; only the @review comment path
# (issue_comment, resolved from the default branch) works there. See README.
#
# Callers MUST grant id-token: write at the calling job level (GitHub does not
# pass id-token to reusable workflows implicitly).

on:
  workflow_call:
    inputs:
      review_prompt:
        description: Instruction given to the reviewer.
        required: false
        type: string
        default: >-
          Review this pull request. Focus on correctness bugs, security
          issues, and clear simplification or reuse opportunities. Be
          comprehensive within this single review: report every finding you are
          confident about in one pass — including minor and non-blocking nits —
          rather than surfacing one issue at a time, so the author can address
          them together in a single round. Still hold a high-confidence bar: do
          NOT pad the review with speculative or marginal guesses. You may run
          the test suite, ruff, and mypy to verify a finding before reporting
          it. This is a read-only review: do NOT modify code or push commits.
          You MUST post your review to the PR — it is not surfaced anywhere
          else — and you MUST post it within THIS run: a run cannot resume
          after your turn ends, so never finish intending to post later (if
          you delegate verification to subagents, wait for their results
          before ending). Post a concise top-level summary with `gh pr comment` (whether
          or not you found issues), and add inline comments for specific
          line-level findings. THEN, as your final action, post a SEPARATE
          standalone comment with a single `gh pr comment --body` call — post it
          in one call and do NOT edit it afterward. Its body must be EXACTLY one
          of these two lines, chosen by whether you are asking the author to
          change ANYTHING:
          (a) if you have NO outstanding suggestions at all — no blocking issues
          and no non-blocking nits, nothing you want changed:
          `🔎 Review complete — no outstanding suggestions. <!-- claude-review-summary --><!-- claude-review-verdict:clean -->`
          (b) otherwise — you raised anything actionable, even a single minor or
          explicitly non-blocking nit:
          `🔎 Review complete. <!-- claude-review-summary --><!-- claude-review-verdict:suggestions -->`
          (The trailing HTML comments are markers the @auto loop keys on:
          `claude-review-summary` fires the loop; `claude-review-verdict` tells it
          whether the PR has converged — `clean` hands off to a human, `suggestions`
          spends a fix round. They must be present in the body as first posted,
          since a comment built up via edits would not carry them in the `created`
          event. Keep the visible text neutral — do NOT mention @auto, so it
          doesn't read as if @auto is acting on PRs that aren't `auto`-labeled.)
          For a normal PR this is just a short "review complete" note.
      model:
        description: Preferred model (--model). Empty = Claude Code default.
        required: false
        type: string
        default: "fable"
      fallback_model:
        description: Fallback when the preferred model is unavailable.
        required: false
        type: string
        default: "default"
      settings:
        description: >-
          Claude Code settings JSON (inline). Allows the verify loop (tests +
          type/lint, both python/python3 forms) and posting the review (gh +
          inline-comment MCP), and DENIES file mutation and git writes. The
          deny overlay makes read-only intent explicit; the real boundary is
          the job's contents:read token, which can't push regardless. deny
          beats allow, so it holds even against any claude_args override.
          In external-review mode a sandbox overlay is merged in at runtime
          (see the compose-settings step) so the reviewer can execute the
          untrusted contributor tree safely.
        required: false
        type: string
        default: >-
          {"permissions":{
          "allow":["Read","Bash(pytest:*)","Bash(ruff:*)","Bash(mypy:*)","Bash(pyright:*)",
          "Bash(pip:*)","Bash(pip3:*)","Bash(uv:*)","Bash(python:*)",
          "Bash(python3:*)","Bash(gh:*)","mcp__github_inline_comment"],
          "deny":["Edit","Write","Bash(git push:*)","Bash(git commit:*)"]}}
      claude_args:
        description: Additional CLI arguments passed through to Claude Code.
        required: false
        type: string
        default: ""
      append_system_prompt:
        description: >-
          Repo-specific guidance appended to the review prompt (via
          --append-system-prompt, so it adds to — not replaces — review_prompt).
          Empty by default; the inspect_ai fork uses it to tell reviewers that
          inline review-comment replies don't reach the dev agent on that repo
          (pristine-main; see README → The inspect_ai fork), so users must act on
          findings with a top-level @claude comment.
        required: false
        type: string
        default: ""
      allowed_bots:
        description: >-
          Comma-separated bot logins whose events may trigger the reviewer, or
          "*" for all. Empty by default, which means claude-code-action rejects
          ALL bot-authored events (its checkHumanActor runs even in prompt/agent
          mode). The fork sets "claude[bot]" so the dev agent can kick off a
          review by posting a top-level @review comment when it opens a PR —
          auto-review-on-open can't fire there (the workflow isn't on the PR's
          base branch). Keep this empty on the dev workflow: allowing bots there
          would let the reviewer's own comments retrigger the dev agent.
        required: false
        type: string
        default: ""
    secrets:
      MARVIN_TOKEN:
        description: >-
          Machine-account PAT, consumed ONLY by the deterministic ack/stage
          steps below (👀 reaction on the @review comment; board stage →
          Agent while the review runs) — it is NEVER handed to
          claude-code-action, so the review agent itself stays read-only (app
          token + contents:read). Optional: absent, those steps no-op and the
          reviewer behaves exactly as before.
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    # Skip auto-review of release-please PRs: they are generated
    # changelog/version bumps with nothing to review, and the run would only
    # fail fast anyway (bot author, rejected by checkHumanActor), leaving a
    # red X on every release PR. Gated here rather than in the caller stubs so
    # all repos pick it up without recopying. An explicit @review comment
    # (issue_comment event) still works.
    if: >
      github.event_name != 'pull_request' ||
      !startsWith(github.event.pull_request.head.ref, 'release-please--')
    # One review per PR at a time, NEWEST WINS: a fresh trigger (push + Ready,
    # another @review, a loop re-request) cancels an in-flight review of
    # now-stale code — stale findings actively mislead the @auto fix agent,
    # and a cancelled review posts no summary marker, so it burns neither an
    # @auto round nor the model cost. Safe to cancel because the reviewer is
    # read-only/stateless (contrast claude-auto.yml's fixers, which are
    # mutating and use cancel-in-progress: false). Keyed per PR — or per proxy
    # issue in external-review mode (same number namespace). Rare cosmetic
    # edge: cancellation can land between the agent's summary comment and its
    # marker comment, leaving an orphan partial summary; the superseding
    # review posts a complete fresh set.
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read          # read code to review; cannot push
      pull-requests: write    # post review + inline comments
      issues: read
      id-token: write         # WIF auth
      actions: read
    steps:
      # Ack + stage run BEFORE the checkout (no workspace needed; the clone
      # costs ~1 min on large repos and the 👀 should land in seconds).
      # Word-boundary gate for comment events so a summary that merely quotes
      # `@review` in backticks doesn't ack; pull_request events (auto-review on
      # open/ready) always count. Marvin's own loop-posted @review DOES get the
      # ack — it doubles as "reviewer engaged" observability.
      # `ok` gates the whole run pipeline (checkout, agent, verify): the
      # caller stub's cheap substring gate admits events this word-boundary /
      # structure check rejects (a comment merely QUOTING @review; an External
      # issue with no upstream URL), and those used to reach checkout with
      # refs/pull/<issue#>/head — a ref that can't exist for a plain issue —
      # failing the job red with no feedback. `ack` additionally requires a
      # non-bot actor WITH WRITE ACCESS before the marvin-authenticated 👀 /
      # stage steps run — on a public repo, a drive-by @review must not move
      # the board or spend reactions (the agent itself was always actor-gated
      # by claude-code-action; this brings ack/stage to parity). Marvin has
      # write, so loop-posted @review keeps its ack.
      - name: Check trigger (run + ack/stage gating)
        id: trig
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          GH_REPO: ${{ github.repository }}
          COMMENT: ${{ github.event.comment.body }}
          IS_PR: ${{ github.event.issue.pull_request && 'true' || 'false' }}
          EXTERNAL: ${{ contains(github.event.issue.labels.*.name, 'External') && 'true' || 'false' }}
          IBODY: ${{ github.event.issue.body }}
        run: |
          ok=false mode=pr upstream=""
          if [ "$EVENT" = "pull_request" ]; then
            ok=true
          elif printf '%s' "$COMMENT" | grep -qE '(^|[[:space:]])@review([[:space:],.!?;:]|$)'; then
            if [ "$IS_PR" = "true" ]; then
              ok=true
            elif [ "$EXTERNAL" = "true" ]; then
              # External-review mode: @review on an External proxy ISSUE means
              # "review the tracked upstream PR" (see design/atlas-tracking.md
              # → External review tracking). The upstream URL comes from the
              # proxy body's template line.
              upstream=$(printf '%s' "$IBODY" \
                | grep -oE 'https://github\.com/[^/ ]+/[^/ ]+/pull/[0-9]+' | head -1)
              if [ -n "$upstream" ]; then ok=true mode=external; fi
            fi
          fi
          ack=false
          if [ "$ok" = "true" ]; then
            if [ "$EVENT" = "pull_request" ]; then
              ack=true  # auto-review on open; same-repo PRs only (stub gate)
            else
              case "$ACTOR" in
                *"[bot]") ;; # bots never ack/stage
                *)
                  perm=$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" \
                           --jq '.permission' 2>/dev/null || echo none)
                  case "$perm" in admin|write|maintain) ack=true ;; esac
                  ;;
              esac
            fi
          fi
          echo "ok=$ok  ack=$ack  mode=$mode  upstream=$upstream"
          {
            echo "ok=$ok"
            echo "ack=$ack"
            echo "mode=$mode"
            echo "upstream=$upstream"
            echo "up_repo=$(printf '%s' "$upstream" | sed -E 's#https://github\.com/([^/]+/[^/]+)/pull/.*#\1#')"
            echo "up_num=$(printf '%s' "$upstream" | grep -oE '[0-9]+$')"
            echo "started=$(date -u +%FT%TZ)"
          } >>"$GITHUB_OUTPUT"

      - name: Acknowledge trigger (eyes)
        if: steps.trig.outputs.ack == 'true' && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "no MARVIN_TOKEN; skipping ack"; exit 0; }
          gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes --silent || true

      # The @review loop is part of Agent (design/atlas-tracking.md):
      # a review starting means the automated machinery is engaged again, so
      # move the issue immediately rather than waiting for the review-fix
      # round. Idempotent; resolves the PR to its issue via branch/Fixes; the
      # set-stage action no-ops without the token.
      - name: Stage - Agent (review running)
        if: steps.trig.outputs.ack == 'true'
        uses: meridianlabs-ai/agents/.github/actions/set-stage@main
        with:
          stage: Agent
          token: ${{ secrets.MARVIN_TOKEN }}
          repo: ${{ github.repository }}
          issue: ${{ github.event.issue.number || github.event.pull_request.number }}

      # On a pull_request event the default checkout is the PR merge ref. On an
      # @review comment (issue_comment) the default would be the repo default
      # branch, so resolve the PR head explicitly.
      - if: steps.trig.outputs.ok == 'true' && steps.trig.outputs.mode != 'external'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}

      # External-review mode checks out the UPSTREAM PR's head (public read)
      # so the reviewer has the tree for context. The claude-setup provisioning
      # below is still skipped (the upstream tree carries no such action, and
      # installing a contributor's package outside a sandbox would execute
      # their build hooks next to this job's credentials); instead the
      # reviewer provisions and tests INSIDE the OS-level Bash sandbox set up
      # by the next two steps. persist-credentials:false because checkout
      # otherwise writes the job token into .git/config, where sandboxed
      # contributor code could read it — the repo is public, nothing after
      # this needs an authenticated remote. See design/architecture.md →
      # External reviews.
      - if: steps.trig.outputs.ok == 'true' && steps.trig.outputs.mode == 'external'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.trig.outputs.up_repo }}
          ref: refs/pull/${{ steps.trig.outputs.up_num }}/head
          fetch-depth: 0
          persist-credentials: false

      # External mode runs UNTRUSTED contributor code (installs execute build
      # hooks; pytest executes the tree), so it gets Claude Code's OS-level
      # Bash sandbox (bubblewrap + network proxy): every Bash command and
      # child process is confined to workspace writes and PyPI-only egress,
      # with the job's tokens hidden via the settings overlay below. The
      # seccomp filter (sandbox-runtime) is NOT optional here: without it
      # sandboxed code can connect to Unix domain sockets, and GitHub runners
      # expose /var/run/docker.sock — a full sandbox escape.
      - name: Install review sandbox
        id: sandbox
        if: steps.trig.outputs.ok == 'true' && steps.trig.outputs.mode == 'external'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq bubblewrap socat
          sudo npm install -g @anthropic-ai/sandbox-runtime
          # Ubuntu 24.04+ AppArmor can block the unprivileged user namespaces
          # bubblewrap needs; lift the restriction if this runner enforces it.
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = "1" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # Provision the project environment so the agent's allow-listed
      # pytest/ruff/mypy can actually run, instead of falling back to py_compile
      # and reasoning. Convention-based opt-in: a caller repo adds a
      # `.github/actions/claude-setup` composite action that delegates to its
      # existing, cache-backed CI setup; the GitHub cache is the caller's, so it
      # hits the entries normal CI populates. `./` resolves against the
      # checked-out workspace. The hashFiles guard makes this a no-op for repos
      # that don't define it. Fatal on failure. NOTE: the reviewer checks out
      # the PR head (above), so on the inspect_ai fork — whose PR branches are
      # cut from pristine main and carry no meridian files — the action is
      # absent and this is skipped; see design/architecture.md.
      - name: Provision project environment
        id: setup
        if: hashFiles('.github/actions/claude-setup/action.yml', '.github/actions/claude-setup/action.yaml') != ''
        uses: ./.github/actions/claude-setup

      # External mode keeps the caller's review_prompt (and the
      # append_system_prompt guidance, which flows in via claude_args as
      # always) — Meridian maintains the upstream repo, so its review
      # standards apply there too. One carve-out, neutralized in the override
      # below: author-facing mechanics like the fork's "reply with a top-level
      # @claude comment" tip are wrong on an upstream PR (no agent integration
      # there, and the maintainer relays anyway); the never-write-the-trigger-
      # token rule stays live because the findings land on the proxy issue. Only the MECHANICS are overridden, appended
      # after the prompt so they win: review the upstream diff; post the
      # ENTIRE review as ONE comment on the PROXY issue — never anything on
      # the contributor's upstream PR (the maintainer decides what to relay),
      # no inline comments, no claude-review-summary marker (this output is
      # for the human, not the @auto loop), and test runs happen INSIDE the
      # sandbox installed above (self-provisioned venv; static fallback when
      # the sandbox blocks something).
      - name: Compose review prompt
        if: steps.trig.outputs.ok == 'true'
        id: reviewprompt
        env:
          MODE: ${{ steps.trig.outputs.mode }}
          UP_REPO: ${{ steps.trig.outputs.up_repo }}
          UP_NUM: ${{ steps.trig.outputs.up_num }}
          PROXY: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          DEFAULT_PROMPT: ${{ inputs.review_prompt }}
        run: |
          if [ "$MODE" != "external" ]; then
            printf 'value=%s\n' "$DEFAULT_PROMPT" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'value=%s %s\n' "$DEFAULT_PROMPT" "EXTERNAL-REVIEW ADJUSTMENTS — these OVERRIDE any conflicting instruction above or in your system prompt. You are reviewing an EXTERNAL contributor's upstream pull request, $UP_REPO#$UP_NUM, on behalf of the maintainer; its head is checked out in the workspace. Read the diff with \`gh pr diff $UP_NUM --repo $UP_REPO\` and \`gh pr view $UP_NUM --repo $UP_REPO --json title,body,commits\`, and verify claims by reading the checked-out code. Post NOTHING to the upstream PR — no summary comment, no inline comments, no reviews, no reactions; the maintainer decides what feedback to relay. Instead post your ENTIRE review (summary verdict line — looks ready to approve / changes needed / needs discussion — plus line-level findings with file:line references, each tagged blocking or non-blocking) as ONE comment on the tracking issue $REPO#$PROXY using \`gh issue comment $PROXY --repo $REPO\`. Do NOT post the '🔎 Review complete' marker comment at all — this review is for a human, not the automation loop. Repo guidance in your system prompt about directing PR authors to reply with top-level @claude comments applies only to this repo's OWN PRs and does NOT apply here: the upstream PR and its author have no agent integration and nothing you write reaches them directly (the maintainer relays), so do not include any such instruction in your findings. Guidance about never writing the literal review-trigger token DOES still apply — your comment lands on the tracking issue, where that token would retrigger this workflow. The environment is not pre-provisioned, but every Bash command you run is confined by an OS-level sandbox (writes limited to the workspace, network egress limited to PyPI, repo and API tokens hidden from your commands), so you MAY install dependencies and run tests to verify findings: create a venv (\`python3 -m venv .venv\`), \`.venv/bin/pip install -e '.[dev]'\` (or the project's documented dev install), then run TARGETED tests near the changed code — not the full suite. If a command fails from a sandbox restriction (blocked host or path) or the install proves impractical, fall back to static review of that point: unsandboxed retries are disabled, so do not fight the sandbox, and do not let environment wrangling crowd out the review itself. You may write scratch test files inside the workspace via shell, but do not alter the contributor's code, and never commit or push. You MUST post the proxy-issue comment — your output is not surfaced anywhere else." >>"$GITHUB_OUTPUT"

      # External mode merges a sandbox overlay into the caller's settings (the
      # allow/deny permission rules are unchanged). failIfUnavailable makes a
      # broken sandbox a hard failure instead of a silent fallback to
      # unsandboxed execution; allowUnsandboxedCommands:false removes the
      # escape hatch that retries sandbox-blocked commands OUTSIDE the sandbox
      # (where the pytest allow rule would wave them through with credentials
      # intact). Egress is PyPI-only — broad domains (e.g. github.com) would
      # open domain-fronting exfiltration, since the sandbox proxy decides by
      # client-supplied hostname without TLS inspection. The env-var denies
      # unset the job's tokens inside the sandbox (sandboxed commands inherit
      # the parent env by default); the three Anthropic names cover the
      # action's possible auth vars — explicit denies rather than
      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB so normal-mode reviews on caller
      # repos are untouched. `gh` is excluded from the sandbox so the agent
      # can post its findings: exclusion applies to commands the AGENT issues —
      # a gh spawned by sandboxed contributor code stays sandboxed and
      # credential-less. This protects against malicious contributor CODE; a
      # prompt-injected agent is a separate (pre-existing) channel.
      - name: Compose settings (external sandbox overlay)
        if: steps.trig.outputs.ok == 'true' && steps.trig.outputs.mode == 'external'
        id: reviewsettings
        env:
          SETTINGS: ${{ inputs.settings }}
        run: |
          [ -n "$SETTINGS" ] || SETTINGS='{}'
          overlay='{"sandbox":{
            "enabled":true,
            "failIfUnavailable":true,
            "allowUnsandboxedCommands":false,
            "excludedCommands":["gh *"],
            "network":{"allowedDomains":["pypi.org","files.pythonhosted.org"]},
            "credentials":{"envVars":[
              {"name":"GITHUB_TOKEN","mode":"deny"},
              {"name":"GH_TOKEN","mode":"deny"},
              {"name":"ACTIONS_ID_TOKEN_REQUEST_TOKEN","mode":"deny"},
              {"name":"ACTIONS_RUNTIME_TOKEN","mode":"deny"},
              {"name":"ANTHROPIC_API_KEY","mode":"deny"},
              {"name":"ANTHROPIC_AUTH_TOKEN","mode":"deny"},
              {"name":"CLAUDE_CODE_OAUTH_TOKEN","mode":"deny"}
            ]}}}'
          merged=$(printf '%s' "$SETTINGS" | jq -c --argjson o "$overlay" '. * $o')
          {
            echo "value<<SETTINGS_EOF"
            printf '%s\n' "$merged"
            echo "SETTINGS_EOF"
          } >>"$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        if: steps.trig.outputs.ok == 'true'
        id: claude
        with:
          anthropic_federation_rule_id: fdrl_01GpNgJm9jE6ZfvcqoJYQL2Y
          anthropic_organization_id: be5d0086-bc43-45d2-9184-20ecdd647aa7
          anthropic_service_account_id: svac_01RL4wYD7ikbypwYKf4wFojv
          anthropic_workspace_id: wrkspc_01RKCQ5DTPBatQ7kHLkaEueD
          prompt: ${{ steps.reviewprompt.outputs.value }}
          settings: ${{ steps.reviewsettings.outputs.value || inputs.settings }}
          allowed_bots: ${{ inputs.allowed_bots }}
          claude_args: >-
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
            ${{ inputs.model != '' && inputs.fallback_model != '' && format('--fallback-model {0}', inputs.fallback_model) || '' }}
            ${{ inputs.append_system_prompt != '' && format('--append-system-prompt {0}', toJSON(inputs.append_system_prompt)) || '' }}
            ${{ inputs.claude_args }}

      # External review finished: the findings sit on the proxy issue awaiting
      # the maintainer's judgment — hand the stage back (mirrors the dev
      # agent's hand-back; without this the proxy would stay parked at Agent
      # Working after the review posts).
      - name: Stage - Review (external review posted)
        if: steps.trig.outputs.mode == 'external' && steps.claude.outcome == 'success'
        uses: meridianlabs-ai/agents/.github/actions/set-stage@main
        with:
          stage: Review
          token: ${{ secrets.MARVIN_TOKEN }}
          repo: ${{ github.repository }}
          issue: ${{ github.event.issue.number }}

      # Surface agent errors the action swallows (e.g. a model overload/529 or a
      # model 404), which otherwise leave the run green with no review posted.
      - name: Surface agent errors
        if: always() && steps.trig.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          SANDBOX_OUTCOME: ${{ steps.sandbox.outcome }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -uo pipefail
          file="${EXEC:-/home/runner/work/_temp/claude-execution-output.json}"
          err=""
          # Pre-agent setup failures skip the agent step entirely, so without
          # these checks no comment posts and the trigger silently goes red
          # (observed: a transient curl failure downloading uv in claude-setup).
          if [ "${SETUP_OUTCOME:-}" = "failure" ]; then
            err="environment provisioning (claude-setup) failed before the reviewer started — usually a transient dependency-download/network error; re-trigger to retry."
          elif [ "${SANDBOX_OUTCOME:-}" = "failure" ]; then
            err="the external-review sandbox install failed before the reviewer started — usually a transient package-download error; re-trigger to retry."
          fi
          [ -z "$err" ] && [ -f "$file" ] && err=$(jq -r '(if type=="array" then . else .messages end) | map(select(.type=="result" and .is_error==true)) | last | .result // empty' "$file" 2>/dev/null || true)
          if [ -z "$err" ] && [ "$CLAUDE_OUTCOME" = "failure" ]; then
            err="the review step failed before producing a result (see the job logs)."
          fi
          [ -z "$err" ] && { echo "No agent error detected."; exit 0; }
          echo "::error::Review did not complete: $err"
          if [ -n "${NUM:-}" ]; then
            gh issue comment "$NUM" --repo "$REPO" --body "$(printf '⚠️ The `@review` run did not complete — it errored before finishing:\n\n> %s\n\nUsually transient (model API capacity/overload). Re-trigger with `@review`; if it persists see https://status.claude.com.' "$err")" || true
          fi
          exit 1

      # A review run that ends without POSTING anything is a silent stall the
      # error surfacing above cannot see (observed: the agent spawned
      # verification subagents and ended its turn "to post once their results
      # arrive" — a run cannot resume, so nothing ever posted and the @auto
      # loop hung). Deterministic check: a successful run must have produced a
      # new claude[bot]/machine-account comment or PR review since run start;
      # otherwise post a visible re-trigger nudge and fail the run.
      - name: Verify the review was posted
        if: always() && steps.trig.outputs.ok == 'true' && steps.claude.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ steps.trig.outputs.mode }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          SINCE: ${{ steps.trig.outputs.started }}
        run: |
          set -uo pipefail
          bots='select(.user.login=="claude[bot]" or .user.login=="i-am-marvin")'
          n=$(gh api "repos/$REPO/issues/$NUM/comments?since=$SINCE" \
                --jq "[.[] | $bots] | length" 2>/dev/null || echo 0)
          if [ "$MODE" != "external" ]; then
            r=$(gh api "repos/$REPO/pulls/$NUM/reviews" \
                  --jq "[.[] | $bots | select(.submitted_at >= \"$SINCE\")] | length" 2>/dev/null || echo 0)
            n=$((n + r))
          fi
          [ "${n:-0}" -gt 0 ] && { echo "review output detected ($n items)."; exit 0; }
          echo "::error::review run succeeded but posted nothing since $SINCE"
          # Single-quoted body, backticked token: this posts as MARVIN, and a
          # bare @review here would re-trigger the review — a failed run would
          # then spawn its own retry loop.
          gh issue comment "$NUM" --repo "$REPO" --body '⚠️ The review run completed without posting a review (it likely ended its turn expecting to resume — runs cannot). Re-trigger with `@review`.' || true
          exit 1

      - name: Upload execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-execution-output
          path: /home/runner/work/_temp/claude-execution-output.json
          if-no-files-found: ignore
