name: Claude Auto Review (reusable)

# @auto Phase 2/3: the review -> fix loop and human handoff. A caller stub
# triggers this on `issue_comment` when the automated reviewer posts its marked
# summary comment on an `auto`-labeled PR. The dev agent addresses the
# feedback and commits; a trusted landing job then pushes as the machine
# account, posts the agent's replies, resolves the threads it settled and
# re-requests review — closing the loop. When the agent finds nothing left to
# fix, the landing job posts its hand-off to a human (it NEVER merges).
# Bounded by review_round_cap; at the cap it drops the `auto` label (the
# kill-switch) and pings a human.
#
# Why issue_comment, not pull_request_review: pull_request_review resolves
# workflows from the PR's base branch, so it never fires on a pristine-base fork
# (the inspect_ai fork). issue_comment resolves from the default branch and
# fires everywhere — one mechanism for all repos. The reviewer marks its summary
# comment (<!-- claude-review-summary -->) so this keys on it; @auto then reads
# the actual review + inline findings via the API.
#
# Only the automated reviewer's comments drive the loop (reviewer_login), and
# the state the gate reads back from PR comments — verdict, round counter,
# re-review requests, hand-off marker — counts only from the trusted logins
# in the workflow-level env below (Claude Security 4121983); the
# `auto` label authorizes — and the gate verifies who applied it (issue #92:
# the machine account or a write-access account, else the label is removed and
# no round runs); cross-repo (fork) PRs are skipped (the fix job checks out
# and runs PR head code — don't do that for untrusted forks). Shares the per-PR
# `concurrency` group with claude-auto.yml so the CI-fixer and review-fixer
# never work the same branch at once.
#
# Three jobs (design/architecture.md → Landing job; issue #83, the review
# loop's conversion after the CI-fix loop's in #82): `gate` resolves the PR,
# enforces the label gate, the stale-verdict guard, convergence and the round
# cap, and does the pre-agent marvin writes (stage → Agent, the round
# counter, or the converged / escalation hand-off) — no checkout; `fix`
# checks out the PR branch and runs the agent with the JOB TOKEN ONLY: it
# commits locally, never pushes or posts, and writes what the land job should
# reply, resolve and post into the landing manifest (emit-landing); `land` —
# a fresh runner, no checkout — pushes the commits as marvin (which re-runs
# CI), posts the replies, resolves the threads that belong to this PR, posts
# exactly `@review` or the `<!-- auto-handoff -->` comment (never both),
# moves the stage, posts the provenance note and the error report, and
# refunds the round when the agent never ran. Decision (Ransom, 2026-09-09):
# every comment the loop produces is posted by the land job as marvin after
# the push lands; the agent posts nothing and resolves nothing in-run.
# The machine account's token (the app token `gate` and `land` mint) is
# named in those two jobs and nowhere else: a process the
# agent left running, or a PATH/ENV edit it made through $GITHUB_PATH /
# $GITHUB_ENV, can observe later steps of its own job but not another job
# (Claude Security finding 4122321).

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      comment_author:
        description: Login that posted the triggering comment (github.event.comment.user.login).
        required: true
        type: string
      reviewer_login:
        description: Login of the automated reviewer whose marked summary comments drive the loop.
        required: false
        type: string
        default: "claude[bot]"
      review_allowed_bots:
        description: >-
          The reviewer's `allowed_bots` for this repo (claude-review.yml; same
          syntax — comma-separated bot logins, `[bot]` suffix optional, or
          "*"). A bot the reviewer honours a `@review` from has a review
          pending when it posts one, so the stale-verdict guard counts its
          requests; keep it equal to the reviewer stub's value. The default
          is the reviewer bot: that is what the deployed reviewer stubs that
          allow-list any bot name (the inspect_ai fork's, for the dev agent's
          PR-open request), and the loop's behaviour for its requests before
          the author filters — so existing callers need no change. A caller
          whose reviewer admits no bot passes an explicit empty string.
          github-actions[bot] is never honoured, whatever the list.
        required: false
        type: string
        default: "claude[bot]"
      auto_label:
        required: false
        type: string
        default: "auto"
      review_round_cap:
        description: >-
          Max review -> fix rounds before escalating to a human. This is the
          hard ceiling on a *productive* loop; a separate no-progress check
          (below) escalates earlier if a fix round pushes no new commit.
        required: false
        type: number
        default: 10
      handoff_mention:
        description: >-
          GitHub login to @-mention on convergence/escalation handoff. Empty
          (default) derives it from the PR's "Fixes/Closes #N" issue: first
          assignee, else author; bots and the machine account are skipped.
        required: false
        type: string
        default: ""
      anchor_repo:
        description: >-
          Repo whose issues this repo's claude/issue-N-* branch numbers
          reference when the same-named branch also exists THERE (the
          companion convention — e.g. ts-mono sets meridianlabs-ai/inspect_ai).
          Mention derivation resolves companion branch numbers and
          fully-qualified closing refs against it, so the right human is
          found without naming anyone in config. Empty = this repo only.
        required: false
        type: string
        default: ""
      model:
        required: false
        type: string
        default: "opus"
      fallback_model:
        required: false
        type: string
        default: "default"
      codex_model:
        description: >-
          Model for the codex engine (design/codex-engine.md). Empty (the
          default) omits --model so the run uses the codex CLI's own default,
          which tracks OpenAI's current flagship without edits here (decision:
          Ransom, 2026-09-08; previously pinned gpt-5.6-sol). Set to pin.
        required: false
        type: string
        default: ""
      codex_effort:
        description: >-
          Reasoning effort for codex implementation runs
          (low|medium|high|xhigh|max). Runs at high — reviews run at xhigh
          (decision: Ransom, 2026-09-08). Empty falls back to the codex CLI
          default.
        required: false
        type: string
        default: "high"
      provision:
        description: >-
          The caller's provisioning recipe (bash), run as the unprivileged
          agent user in the checkout after that user exists and before the
          agent starts. Today only CODEX runs use it (as the codex user):
          Claude runs keep the repository's `.github/actions/claude-setup`
          action, with the generic recipe as the runner-side fallback, until
          they move to an agent user of their own and take this recipe too
          (design/executed-paths-residual.md). It is the codex-run
          counterpart of claude-setup, which the codex job never runs (a
          composite action can only run as the runner, and nothing from the
          checkout may run as the runner in that job: Claude Security
          finding 4628446). Empty (the default) falls back to
          `codex_provision`; with both empty the generic recipe runs — `uv
          venv` and `uv pip install -e .[dev]` (`--group dev` when the
          project declares one) — where the checkout has a pyproject.toml.
          Set it to keep what the repository's claude-setup does: a Python
          pin (`uv venv --python 3.11`), a lockfile sync (`uv sync --dev`),
          Node tooling (`corepack enable --install-directory ~/.local/bin &&
          pnpm install --frozen-lockfile`). The recipe runs with uv
          bootstrapped on PATH and network on; it has no sudo, HOME is the
          agent user's (/home/codex), PATH is sudo's default plus
          ~/.local/bin, and it must create the project's `.venv` for the
          prompts' tool discovery (which also looks in `node_modules/.bin`
          and ~/.local/bin). It runs under `bash --noprofile --norc -eo
          pipefail`, like a `shell: bash` step: a failing command fails
          provisioning (handle an expected failure with `|| true`). A recipe
          runs whether or not the checkout has a pyproject.toml — only the
          generic recipe needs one. It comes from the caller's workflow
          file, so it is trusted like every other input here; keep it free
          of anything derived from the run's event.
        required: false
        type: string
        default: ""
      codex_provision:
        description: >-
          The earlier name of `provision`, kept so the stubs that set it keep
          working: used, with the same semantics, when `provision` is empty,
          and ignored when `provision` is set.
        required: false
        type: string
        default: ""
      append_system_prompt:
        description: >-
          Repo-specific guidance (e.g. the fork's "a human promotes upstream
          rather than merging here" note for the handoff). Empty by default.
        required: false
        type: string
        default: ""
      branch_sync_append:
        description: >-
          Caller-specific merge guidance, same channel as claude.yml's input of
          the same name: reaches the agent on BOTH engines whenever "Sync
          branch with base" merged this run — appended to the conflict note
          when the merge is handed to the agent, and spliced behind a "a
          workflow step already merged; review the result" lead-in when the
          runner merged cleanly. Clean merges are the case that motivated it
          (git auto-merges a CHANGELOG without conflict and lands the entry
          under the wrong heading — the fork's append checks for that). Empty
          by default. Keep it a single line — the Claude-path prompt travels
          as one output line, so newlines are flattened.
        required: false
        type: string
        default: ""
      settings:
        description: >-
          Claude Code settings JSON. Keep in sync with claude.yml /
          claude-auto.yml — the fix agent needs the same edit + verify-loop +
          git/gh allow-list, MINUS `Bash(git push:*)`: the fix agent commits
          locally and the land job pushes (issue #83, as #82 did for the
          CI-fix loop). The "Compose fix settings" step strips that rule from
          whatever a caller passes here (a JSON object, or the action's other
          documented form, a path to a settings file) and adds it (plus the
          gh comment/review/create verbs) to a `deny` list, so a caller's
          settings cannot re-enable the direct push and posting commands.
        required: false
        type: string
        default: >-
          {"permissions":{"allow":["Read","Edit","Write",
          "Bash(pytest:*)","Bash(ruff:*)","Bash(mypy:*)","Bash(pyright:*)","Bash(pip:*)",
          "Bash(pip3:*)","Bash(uv:*)","Bash(python:*)","Bash(python3:*)",
          "Bash(gh:*)",
          "Bash(git fetch:*)","Bash(git merge:*)","Bash(git rebase:*)",
          "Bash(git checkout:*)","Bash(git switch:*)",
          "Bash(git branch:*)","Bash(git status:*)","Bash(git log:*)",
          "Bash(git diff:*)","Bash(git show:*)","Bash(git rev-parse:*)",
          "Bash(git remote:*)",
          "Bash(git add:*)","Bash(git commit:*)","Bash(git config:*)"]}}
    secrets:
      MARVIN_APP_CLIENT_ID:
        description: >-
          Client ID of the machine account's GitHub App (`meridian-marvin`,
          bot login `meridian-marvin[bot]`; Phase 2 of the credential
          separation, design/architecture.md → Landing job). With
          MARVIN_APP_PRIVATE_KEY it is the machine account's only credential
          (the PAT was retired 2026-09-18), consumed ONLY by
          the `gate` job (the PR lookup, the round counter, stage → Agent,
          the converged / escalation hand-off) and the `land` job (the push
          of the agent's commits — it must come from a real identity so CI
          re-runs and the `@review` re-triggers the reviewer; a GITHUB_TOKEN
          push or comment would be dropped — plus the replies, the thread
          resolutions, the hand-back or hand-off, the codex summary, the
          stage move and the round refund); each mints a one-hour
          installation token scoped to this repository and to the
          permissions that job's writes need, revoked when the job ends, and
          every push, comment, label and board move runs as the bot. NEVER
          present in the `fix` job, where the PR's code runs. Without the
          two secrets the loop can't function, so the gate fails at its mint
          step. Pass it explicitly by name in the stub's `secrets:` map,
          never `secrets: inherit`.
        required: false
      MARVIN_APP_PRIVATE_KEY:
        description: >-
          Private key (PEM) of the GitHub App named by MARVIN_APP_CLIENT_ID;
          read ONLY by the mint steps of the `gate` and `land` jobs. Needed
          together with it (see MARVIN_APP_CLIENT_ID).
        required: false
      OPENAI_API_KEY:
        description: >-
          OpenAI API key for the codex engine (design/codex-engine.md); used
          only by fix rounds on PRs labeled engine:codex.
        required: false

# Agents never write the Actions cache (Claude Security 4629157;
# design/agent-cache-scope.md). The token every job of this workflow
# gets can restore caches but not save them, in any scope, on any
# trigger: the platform enforces it, so it holds whatever the caller's
# claude-setup nests and whatever the agent runs. Never raise it; a
# caller that caps its calling job at `read` or wider keeps working.
cache-mode: read

# Trusted identities, in ONE place (Claude Security 4121983; the Class B
# principle: a comment drives the loop only if its author is a trusted
# identity or holds write access). Every author check in this file reads
# these lists; no check names a login inline. The machine account appears
# under both of its logins: the User `i-am-marvin` (the PAT, today) and the
# GitHub App's `meridian-marvin[bot]` (Phase 2: the app's tokens post as the
# bot; its collaborator permission reads `none`, so it is trusted by login
# only). The User leaves both lists when the PAT is retired.
env:
  # The loop's own identity: the land job posts the hand-back and the
  # hand-off as it, the gate records the round counter as it. Only its
  # counter and hand-off comments are loop state, and only they are PATCHed.
  TRUSTED_LOGINS: i-am-marvin,meridian-marvin[bot]
  # Who posts the reviewer's marked summary (the verdict). All are active
  # authors: the Claude engine posts its marked verdict directly, as
  # claude[bot] (claude-review.yml's review prompt; also `reviewer_login`'s
  # default); the Codex engine's verdict travels in the landing manifest and
  # claude-review.yml's land job posts it as the machine account (either
  # login). Any other login's verdict is ignored.
  REVIEWER_LOGINS: i-am-marvin,meridian-marvin[bot],claude[bot]

jobs:
  # TRUSTED, first: the PR lookup, the `auto`-label gate, the stale-verdict
  # guard, convergence, the round cap and every marvin write that must happen
  # BEFORE the agent runs — stage → Agent, the round counter, or the
  # converged / escalation hand-off (disarm, reset, hand-off). Checks out
  # nothing: every value it emits is computed from the API before any PR code
  # ran, which is what makes its outputs the trusted context the other two
  # jobs run on (`head_branch` is the PR's live head ref, the validator's pin
  # for the landing manifest's branch).
  gate:
    runs-on: ubuntu-latest
    # Same group as claude-auto.yml's CI-fixer (keyed on PR number): all @auto
    # pushes to a PR serialize, and the round counter's read-modify-write can't
    # race. cancel-in-progress: false lets an in-flight fix finish. The same
    # group is on the `fix` job (so two agents never work the same branch at
    # once); the `land` job is deliberately NOT in the group — claude-auto.yml's
    # gate comment has the rationale (arbitrary ordering inside a group, at
    # most one pending job, a landing cancelled as the older pending job would
    # lose the agent's commits; the land composite's non-fast-forward guard
    # covers the residual overlap loudly, never forcing).
    concurrency:
      group: claude-auto-${{ github.repository }}-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write    # job-token fallbacks of the counter/hand-off posts
      issues: write
    outputs:
      act: ${{ steps.gate.outputs.act }}
      head_branch: ${{ steps.gate.outputs.head_branch }}
      engine: ${{ steps.gate.outputs.engine }}
      round: ${{ steps.gate.outputs.round }}
      cap: ${{ inputs.review_round_cap }}
      verdict: ${{ steps.gate.outputs.verdict }}
      head: ${{ steps.gate.outputs.head }}
      mention: ${{ steps.gate.outputs.mention }}
      continuation: ${{ steps.gate.outputs.continuation }}
      # The identity the fix job's runner-side commits carry (the base
      # merge, the codex commit): the bot's when this job minted an app
      # token — so the commit author and the land job's pusher agree; the
      # User's is sync-branch's default, unreachable now that the gate
      # fails when it did not mint. Decided here, where the minting
      # happened; the fix job only reads these two strings.
      git_user_name: ${{ steps.mint.outcome == 'success' && 'meridian-marvin[bot]' || 'i-am-marvin' }}
      git_user_email: ${{ steps.mint.outcome == 'success' && '330132053+meridian-marvin[bot]@users.noreply.github.com' || 'i-am-marvin@users.noreply.github.com' }}
    steps:
      # The machine account's token for this job (Phase 2, design/
      # architecture.md → Landing job): a one-hour installation token of the
      # GitHub App, minted from the caller's app secrets and
      # scoped to THIS repository and to what this job writes — the round
      # counter, the converged / escalation hand-offs and the gate-failure
      # note (issues), the `auto` label's removal on escalation or an
      # outsider's label (pull requests), the stage moves (the org's Atlas
      # project); the PR, review and timeline reads are covered by the same
      # permissions, and the closed-PR continuation's live-branch-tip read
      # (`repos/<repo>/branches/<head>`, below) needs contents: read — on a
      # private caller a token without it gets a 404 there, which the gate
      # reads as "branch gone" and skips the round (review round 1, PR #111).
      # The responsible-human derivation also READS the anchor
      # repo (a public one — the inspect_ai fork — in every deployment;
      # best-effort, empty on failure). Revoked when the job ends. Every
      # later step reads `steps.mint.outputs.token`. Unconditional: the loop
      # cannot work without the machine account, so a caller without the
      # app secrets fails here, first and loudly (the PAT was retired
      # 2026-09-18; the gate used to skip with a log line when it was absent).
      - name: Mint the machine account's token
        id: mint
        uses: actions/create-github-app-token@v2
        with:
          # `app-id` accepts the App ID or the Client ID; v2 has no client-id input.
          app-id: ${{ secrets.MARVIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
          owner: meridianlabs-ai
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-organization-projects: write

      # The gate is three steps, all via the API, before any checkout: resolve
      # the PR and check reviewer identity, same-repo, token, the auto label
      # and not-merged; verify who applied the label (shared composite); then compute
      # the round count and decide. The counter increments before the agent
      # runs, so a crashed agent still consumes a round — and it is computed
      # only AFTER the labeler check passes, so an outsider's label never
      # burns rounds. Also derives the PR head branch (issue_comment doesn't
      # carry it). Downstream steps read every gate output (`act`,
      # `head_branch`, `engine`, `round`, …) from the LAST step; the resolve
      # step hands it the PR JSON it fetched, so the split is invisible to them.
      - name: Resolve PR and check the auto label
        id: resolve
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          AUTHOR: ${{ inputs.comment_author }}
          REVIEWER: ${{ inputs.reviewer_login }}
          AUTO_LABEL: ${{ inputs.auto_label }}
        run: |
          set -euo pipefail
          # `act` here is skip or verify (proceed to the labeler check); the
          # final act (skip/fix/converged/escalate) is the Gate and count step's.
          act() { echo "act=$1" >>"$GITHUB_OUTPUT"; }
          # Retry a gh call on transient failure. A 5xx / secondary rate limit
          # returns an HTML error page, which `gh --jq` then rejects with
          # "invalid character '<'"; under `set -e` an unguarded call like that
          # aborts the gate BEFORE it decides fix/escalate/converge, so no fix,
          # no escalation, no error comment ever posts and the loop silently
          # stalls with the label still on (see design/auto-agent.md). Retry
          # with backoff; a persistent failure still returns non-zero so the
          # gate-failure failsafe below surfaces it instead of dying quietly.
          # Each attempt's stdout is captured and emitted only on overall
          # success: a failed `gh api` prints the HTTP error body to STDOUT
          # (stderr carries only the `gh:` line), so streaming attempts
          # through would prefix a fail-then-succeed retry's real output
          # with error bodies — poisoning every $(ghr …) capture in exactly
          # the case the retry exists for. (Same pattern as api() in
          # claude-review.yml's trig step.)
          ghr() {
            local n=0 out
            until out=$("$@"); do
              n=$((n+1))
              if [ "$n" -ge 4 ]; then return 1; fi
              sleep $((n*3))
            done
            printf '%s' "$out"
          }
          echo "review-fix gate: pr=#$PR comment_author='$AUTHOR' reviewer_login='$REVIEWER'"
          # Codex-engine reviews post their verdict via the machine account
          # (design/codex-engine.md — github-actions[bot] comments trigger no
          # stubs), so marker comments from it (TRUSTED_LOGINS, either login)
          # carry the same authority as the reviewer bot's.
          in_trusted() { case ",${TRUSTED_LOGINS// /}," in *",$1,"*) return 0 ;; esac; return 1; }
          if [ "$AUTHOR" != "$REVIEWER" ] && ! in_trusted "$AUTHOR"; then
            echo "Comment by '$AUTHOR', not the automated reviewer '$REVIEWER' (or the machine account); ignoring."
            act skip; exit 0
          fi
          pr_json=$(ghr gh pr view "$PR" --repo "$REPO" --json state,closedAt,headRefName,headRefOid,isCrossRepository,labels 2>/dev/null) || {
            echo "#$PR is not a pull request (or the API is persistently unavailable); skipping."; act skip; exit 0; }
          if [ "$(jq -r '.isCrossRepository' <<<"$pr_json")" = "true" ]; then
            echo "PR #$PR is from a fork (cross-repository); skipping — would check out and run untrusted code."
            act skip; exit 0
          fi
          if [ "$(jq -r --arg l "$AUTO_LABEL" 'any(.labels[]; .name==$l)' <<<"$pr_json")" != "true" ]; then
            echo "PR #$PR is not @auto-labeled; skipping."; act skip; exit 0
          fi
          # A MERGED PR is done, whatever its labels (CLOSED is different —
          # see the continuation logic in Gate and count). Decide it HERE,
          # ahead of the labeler check: a merged PR still carrying the label
          # is a state this loop has always skipped silently, and running the
          # composite on it would cost a timeline fetch and a permission
          # lookup per reviewer event — and, for an unverifiable labeler,
          # post the "not running" notice (or a disarm note) on a merged PR.
          if [ "$(jq -r '.state' <<<"$pr_json")" = "MERGED" ]; then
            echo "PR #$PR is MERGED; nothing to continue. Skipping."; act skip; exit 0
          fi
          # Hand the fetched PR to the counting step (one line: gh emits
          # compact JSON, and `-c` guarantees it for the single-line output).
          echo "pr_json=$(jq -c . <<<"$pr_json")" >>"$GITHUB_OUTPUT"
          act verify

      # Who applied the label (issue #92): the most recent `labeled` event
      # must come from marvin or a write-access account. An outsider's label
      # is removed (as marvin) and noted on the PR; no evidence (no event,
      # an App labeler, a failed lookup) refuses without disarming and posts
      # a one-time notice. Shared composite with claude-auto.yml — the
      # verdicts and the PR-facing text live there. Runs under the machine
      # account's token (the resolve step already required it). A persistent timeline fetch
      # failure FAILS this step, which the gate-failure failsafe below
      # surfaces like a crash of the other two.
      - name: Verify who applied the auto label
        id: labeler
        if: steps.resolve.outputs.act == 'verify'
        uses: meridianlabs-ai/agents/.github/actions/verify-auto-labeler@main
        with:
          token: ${{ steps.mint.outputs.token }}
          repo: ${{ github.repository }}
          pr: ${{ inputs.pr_number }}
          label: ${{ inputs.auto_label }}
          trusted-logins: ${{ env.TRUSTED_LOGINS }}

      - name: Gate and count
        id: gate
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          PR_JSON: ${{ steps.resolve.outputs.pr_json }}
          RESOLVED: ${{ steps.resolve.outputs.act }}
          LABELER_VERDICT: ${{ steps.labeler.outputs.verdict }}
          CAP: ${{ inputs.review_round_cap }}
          # A caller's reviewer_login override counts as a verdict author
          # alongside REVIEWER_LOGINS (the workflow-level env, inherited).
          REVIEWER: ${{ inputs.reviewer_login }}
          ALLOWED_BOTS: ${{ inputs.review_allowed_bots }}
          HANDOFF_MENTION: ${{ inputs.handoff_mention }}
          ANCHOR_REPO: ${{ inputs.anchor_repo }}
          MARKER: "<!-- auto-review-rounds -->"
        run: |
          set -euo pipefail
          act() { echo "act=$1" >>"$GITHUB_OUTPUT"; }
          # Same ghr as the resolve step (and claude-auto.yml's gate).
          ghr() {
            local n=0 out
            until out=$("$@"); do
              n=$((n+1))
              if [ "$n" -ge 4 ]; then return 1; fi
              sleep $((n*3))
            done
            printf '%s' "$out"
          }
          if [ "$RESOLVED" != "verify" ]; then act skip; exit 0; fi
          if [ "$LABELER_VERDICT" != "ok" ]; then
            echo "Labeler check on PR #$PR: ${LABELER_VERDICT:-no verdict}; skipping."; act skip; exit 0
          fi
          pr_json="$PR_JSON"
          # Closed PR, still auto-labeled: on the fork that is a deliberate
          # continuation surface, not garbage — promotion opens the upstream
          # PR from the SAME branch (upstream runs no agents), so
          # post-promotion feedback is fixed by looping HERE, and every push
          # lands on the upstream PR's diff. But a closed PR's recorded
          # headRefOid is FROZEN at close: steering by it makes reviews
          # re-read old code and the no-progress check compare frozen
          # against frozen — observed on fork PR #351 (2026-09-01), which
          # escalated "pushed no new changes" while its fix rounds' pushes
          # were landing on the upstream diff. Steer by the LIVE branch tip
          # instead; a deleted branch means a genuinely dead PR — skip.
          # CLOSED only: the continuation contract is promotion-shaped
          # (promotion closes the fork PR, nothing merges it) — a MERGED PR
          # is done, and looping on its surviving branch would push commits
          # that never reach main while the moving tip defeats the
          # no-progress escalation that used to kill exactly that zombie.
          # The MERGED skip itself lives in the resolve step, ahead of the
          # labeler check, so only OPEN and CLOSED reach here.
          pr_state=$(jq -r '.state' <<<"$pr_json")
          live_tip=""
          if [ "$pr_state" != "OPEN" ]; then
            # ghr emits captured stdout only on success, so a deleted branch
            # (persistent 404) yields an empty capture and the skip below
            # fires — the error body `gh api` prints to STDOUT never reaches
            # the substitution, and a fail-then-succeed retry still yields a
            # clean SHA. The hex check is belt-and-braces against unexpected
            # API output — fail-safe: skip, don't steer by garbage.
            live_tip=$(ghr gh api "repos/$REPO/branches/$(jq -r '.headRefName' <<<"$pr_json")" --jq '.commit.sha' 2>/dev/null) || live_tip=""
            [[ "$live_tip" =~ ^[0-9a-f]{40}$ ]] || live_tip=""
            if [ -z "$live_tip" ]; then
              echo "PR #$PR is $pr_state and its branch is gone (or the API is persistently unavailable); nothing to continue. Skipping."
              act skip; exit 0
            fi
            echo "PR #$PR is $pr_state but auto-labeled with a live branch (promotion continuation); steering by branch tip $live_tip."
          fi
          continuation=false
          closed_at=""
          if [ -n "$live_tip" ]; then
            continuation=true
            # The close timestamp is the continuation epoch: the converged
            # handoff's idempotence check only counts hand-backs posted after
            # it, so the pre-promotion handoff (which is what led to the
            # close) doesn't silence the continuation's own ending.
            closed_at=$(jq -r '.closedAt // ""' <<<"$pr_json")
          fi
          echo "continuation=$continuation" >>"$GITHUB_OUTPUT"
          echo "closed_at=$closed_at" >>"$GITHUB_OUTPUT"
          echo "head_branch=$(jq -r '.headRefName' <<<"$pr_json")" >>"$GITHUB_OUTPUT"
          # Engine selection (design/codex-engine.md): fix rounds follow the
          # PR's engine:codex label; relabeling switches later rounds.
          echo "engine=$(jq -r 'if any(.labels[]; .name=="engine:codex") then "codex" else "claude" end' <<<"$pr_json")" >>"$GITHUB_OUTPUT"

          # Human to @-mention on handoff/escalation: the first assignee of the
          # issue this PR closes (Fixes/Closes/Resolves #N), else its author,
          # unless overridden. Assignee first since 2026-09-10: the assignee is
          # the repo's "responsible human" (Atlas views filter on assignee) and
          # the reporter may be someone else — inspect_ai#473's convergence
          # handoff pinged the issue's author while the assignee had kicked off
          # the run. Bots and the machine account are skipped — no point
          # pinging the PR's own machine-account author.
          mention="$HANDOFF_MENTION"
          if [ -z "$mention" ]; then
            # Match both `Fixes #N` and the fully-qualified `Fixes owner/repo#N`
            # (the fork mandates the latter — a bare `#N` there silently rebinds
            # to upstream when the branch is promoted). Only resolve a mention
            # when the reference targets THIS repo: a cross-repo `owner/repo#N`
            # points at a different tracker, so its number is meaningless here.
            ref=$(ghr gh pr view "$PR" --repo "$REPO" --json body --jq '.body // ""' \
                    | grep -ioE '(fixes|closes|resolves)[[:space:]]+([-A-Za-z0-9._]+/[-A-Za-z0-9._]+)?#[0-9]+' \
                    | head -1 || true)
            inum=""
            issue_repo="$REPO"
            lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
            if [ -n "$ref" ]; then
              refrepo=$(printf '%s' "$ref" | grep -oiE '[-A-Za-z0-9._]+/[-A-Za-z0-9._]+' || true)
              if [ -z "$refrepo" ] || [ "$(lower "$refrepo")" = "$(lower "$REPO")" ]; then
                inum=$(printf '%s' "$ref" | sed -n 's/.*#\([0-9]\{1,\}\).*/\1/p')
              elif [ -n "${ANCHOR_REPO:-}" ] && [ "$(lower "$refrepo")" = "$(lower "$ANCHOR_REPO")" ]; then
                # companion PR referencing its anchor issue cross-repo
                inum=$(printf '%s' "$ref" | sed -n 's/.*#\([0-9]\{1,\}\).*/\1/p')
                issue_repo="$ANCHOR_REPO"
              fi
            fi
            # Fallback for the MENTION only (closing semantics untouched): a PR
            # may deliberately use a non-closing ref — observed: "Refs ...#103"
            # on a docs-only PR that must not close its issue — so derive the
            # issue from the claude/issue-N-* branch convention when no closing
            # ref matched. On a companion repo the branch number references the
            # ANCHOR repo's tracker — but only when the same branch exists
            # there (this repo's own agent mints identically-shaped names for
            # native issues), so check for the twin before resolving remotely.
            if [ -z "$inum" ]; then
              hb=$(jq -r '.headRefName' <<<"$pr_json")
              inum=$(printf '%s' "$hb" | sed -n 's/^claude\/issue-\([0-9]\{1,\}\)-.*/\1/p')
              if [ -n "$inum" ] && [ -n "${ANCHOR_REPO:-}" ] && \
                 gh api "repos/$ANCHOR_REPO/branches/$hb" --silent >/dev/null 2>&1; then
                issue_repo="$ANCHOR_REPO"
              fi
            fi
            if [ -n "$inum" ]; then
              # First assignee that is neither a Bot (e.g. an assigned Copilot
              # coding agent) nor the machine account, else the author unless
              # it's a bot or the machine account (marvin is a User, not a
              # Bot — triage-created issues are marvin-authored). Never a PR
              # (the /issues/N endpoint returns PRs too — observed pinging an
              # unrelated PR author). `.assignees // []` is belt and braces:
              # the endpoint always returns an array, but a null would make
              # jq exit non-zero and the `|| true` would hide it as no mention.
              mention=$(ghr gh api "repos/$issue_repo/issues/$inum" 2>/dev/null \
                          | jq -r --arg t "${TRUSTED_LOGINS// /}" '($t | split(",")) as $tl | if .pull_request then "" else (([(.assignees // [])[] | select(.type != "Bot" and (.login as $l | any($tl[]; . == $l) | not)) | .login] | first // "") as $a | if $a != "" then $a elif (.user.type=="Bot" or (.user.login as $l | any($tl[]; . == $l))) then "" else .user.login end) end' 2>/dev/null || true)
            fi
          fi
          echo "mention=$mention" >>"$GITHUB_OUTPUT"

          # Fetch the PR's comments ONCE, unfiltered, and query the local array
          # below. Filtering with `--paginate --jq` would be wrong here:
          # `--jq` runs PER PAGE, so past 100 comments `... | last` emits one
          # element per page and a "single" body comes back multi-line.
          # `--paginate` output is one merged array on current gh, one array
          # per page on older releases; -s plus `.[][]` flattens either.
          comments=$(ghr gh api "repos/$REPO/issues/$PR/comments" --paginate | jq -s '[.[][]]')

          # Author filters (Claude Security 4121983). Everything the loop
          # recovers from that list below — the verdict, the round counter
          # with its head SHA, the re-review requests, and (in the hand-off
          # step) the hand-off marker — is selected by marker substring, and
          # on a public caller any account can comment on an auto-labeled
          # PR. Unfiltered, a forged verdict converged the loop with findings
          # still open; a forged counter escalated it (dropping the label) or
          # reset the cap that bounds spend — and the loop adopted the
          # forgery as its sticky comment, PATCHing it as marvin from then
          # on; a forged `@review` made the stale-verdict guard skip a real
          # verdict with no review pending. The logins come from the
          # workflow-level env (TRUSTED_LOGINS, REVIEWER_LOGINS), never
          # inline. Comma lists → jq arrays, whitespace-tolerant.
          logins() { jq -cn --arg t "$1" '$t | split(",") | map(gsub("^ +| +$"; "")) | map(select(. != ""))'; }
          reviewers=$(logins "$REVIEWER_LOGINS,$REVIEWER")
          trusted=$(logins "$TRUSTED_LOGINS")
          in_logins() { jq -en --argjson l "$1" --arg x "$2" 'any($l[]; . == $x)' >/dev/null; }
          # bot_allowed <login>: named in review_allowed_bots — the
          # reviewer's own allow-list, same normalisation as
          # claude-code-action's isAllowedBot (case-insensitive, `[bot]`
          # optional, "*" = every bot) — except github-actions[bot], which
          # no list admits (any repository's workflow run posts as it).
          bot_allowed() {
            local bot bots
            [ "$1" != "github-actions[bot]" ] || return 1
            [ "$(printf '%s' "$ALLOWED_BOTS" | tr -d ' ')" = "*" ] && return 0
            bot=$(printf '%s' "$1" | sed 's/\[bot\]$//' | tr '[:upper:]' '[:lower:]')
            bots=$(printf '%s' "$ALLOWED_BOTS" | tr '[:upper:]' '[:lower:]' | sed 's/\[bot\]//g')
            case ",$(printf '%s' "$bots" | tr -d ' ')," in *",$bot,"*) return 0 ;; esac
            return 1
          }
          # trusted_author <login> <type>: who the REVIEWER would run a
          # review for (claude-review.yml's trig step), so that a request the
          # reviewer will honour is pending and one it will refuse is not —
          # a TRUSTED_LOGINS login; a bot in review_allowed_bots; or an
          # account with write access (a collaborator's manual re-review
          # request is as real as the loop's own). A reviewer identity
          # (REVIEWER_LOGINS) is a verdict AUTHOR, not a requester by right:
          # its `@review` counts through the allow-list like any bot's (the
          # input's default names it, as the deployed reviewer stubs do), so
          # a caller whose reviewer refuses bots can say so and the gate will
          # not wait for a review that never runs. Any other bot — by the payload's `user.type` (a
          # GitHub App actor need not carry a `[bot]` suffix; e.g. Copilot)
          # or the suffix — is refused without a lookup: the collaborators
          # endpoint 404s for Apps. One permission lookup per login per run,
          # cached in a string rather than an associative array so the step
          # also runs under bash 3 (tests/); a failed lookup is untrusted —
          # fail closed, like every gate lookup.
          perm_cache=""
          trusted_author() {
            in_logins "$trusted" "$1" && return 0
            [ -n "$1" ] || return 1
            if [ "${2:-}" = "Bot" ] || [[ "$1" == *"[bot]" ]]; then
              bot_allowed "$1" && return 0
              return 1
            fi
            case " $perm_cache " in
              *" $1=yes "*) return 0 ;;
              *" $1=no "*) return 1 ;;
            esac
            local perm
            perm=$(ghr gh api "repos/$REPO/collaborators/$1/permission" --jq '.permission' 2>/dev/null) || perm=none
            case "$perm" in
              admin|maintain|write) perm_cache="$perm_cache $1=yes"; return 0 ;;
              *) perm_cache="$perm_cache $1=no"; return 1 ;;
            esac
          }

          # Stale-verdict guard: this job fires on the verdict comment but can
          # queue for many minutes behind a ci-fix run (shared per-PR
          # concurrency group, cancel-in-progress: false), and by the time it
          # runs the "latest" verdict may describe a commit that is no longer
          # the tip. Observed inspect_flow#825 (2026-09-09): a clean verdict
          # on the original commit queued its review-fix run behind the
          # ci-fix run; ci-fix pushed a fix and requested re-review; the
          # queued run then read the still-latest clean verdict, declared
          # convergence and pinged the human, who merged — and the real
          # re-review landed a suggestion on a merged PR. Every loop-driven
          # push (ci-fix, the dev agent, this loop's fix rounds — their
          # `@review` is the land job's, posted right after the push) ends
          # with a bare re-review request, so a
          # verdict older than the latest such request describes code the
          # reviewer never saw AND has a fresh review pending: skip and let
          # that review's own verdict re-fire the loop. The request-shape
          # test is the caller stub's admission gate (not backticked; not a
          # reviewer-stamped comment) AND the word-bounded token test the
          # reusable reviewer applies before it actually runs a review
          # (claude-review.yml, trig step) — a looser `contains` would count
          # `cc @reviewers` as a pending request and skip with nothing
          # scheduled.
          # Deliberately NOT compared against the tip commit's date: the
          # reviewer never fires on `synchronize`, so a push that arrives
          # WITHOUT a request (a human pushing while this run is queued) has
          # no review pending — skipping there would strand the loop (label
          # on, nothing scheduled, only a job-log line), and a committer clock
          # ahead of GitHub's could skip the verdict for the very commit the
          # reviewer reviewed. Such a push keeps the prior behavior: the
          # verdict is acted on against the new tip.
          # The verdict: the reviewer identities' latest marked summary.
          summary_json=$(jq -c --argjson r "$reviewers" 'map(select((.body|contains("claude-review-summary")) and ((.user.login // "") as $l | any($r[]; . == $l)))) | last // empty' <<<"$comments")
          summary=$(jq -r '.body' <<<"${summary_json:-null}")
          verdict=$(printf '%s' "$summary" | sed -n 's/.*claude-review-verdict:\([a-z]*\).*/\1/p')
          echo "verdict=$verdict" >>"$GITHUB_OUTPUT"
          if [ -n "$verdict" ]; then
            verdict_at=$(jq -r '.created_at' <<<"$summary_json")
            # The latest re-review request by a trusted author: newest first,
            # stop at the first that passes (the lookups are per login).
            rereview_at=""
            while IFS=$'\t' read -r login type created; do
              if trusted_author "$login" "$type"; then rereview_at="$created"; break; fi
            done < <(jq -r '[.[] | select((.body|test("(^|\\s)@review(\\s|[,.!?;:]|$)")) and (.body|contains("`@review`")|not) and (.body|contains("<!-- claude-review-comment -->")|not))] | sort_by(.created_at) | reverse | .[] | [(.user.login // ""), (.user.type // ""), .created_at] | @tsv' <<<"$comments")
            # ISO-8601 UTC timestamps compare correctly as strings; an empty
            # rereview_at (no request yet) never compares greater.
            if [[ "$verdict_at" < "$rereview_at" ]]; then
              echo "Latest verdict '$verdict' ($verdict_at) predates a later re-review request ($rereview_at); that review is pending. Skipping."
              act skip; exit 0
            fi
          fi

          # Deterministic convergence: if the reviewer's latest summary carries a
          # `clean` verdict (no outstanding suggestions), hand off to a human
          # without spending a fix round. An absent verdict (older reviewer, or a
          # caller that overrides review_prompt) falls through to the round-count
          # path below, preserving prior behavior.
          if [ "$verdict" = "clean" ]; then
            echo "Reviewer verdict is clean; converging without a fix round."
            act converged; exit 0
          fi

          # Latest rounds-marker comment BY THE LOOP (TRUSTED_LOGINS — the
          # gate writes it as marvin; the land job's refund step selects the
          # same way), captured once like summary_json above; cid feeds the
          # Record round PATCH, the body the counters below. A marker in any
          # other login's comment is ignored and never PATCHed.
          marker_json=$(jq -c --arg m "$MARKER" --argjson t "$trusted" 'map(select((.body|contains($m)) and ((.user.login // "") as $l | any($t[]; . == $l)))) | last // empty' <<<"$comments")
          cid=$(jq -r '.id // empty' <<<"${marker_json:-null}")
          prev=0
          prevsha=""
          # field <name> <re> <body>: the value of the body's ONE
          # `<name>:<value>` token. `<name>:` must occur exactly once — every
          # occurrence is counted BEFORE any value is read, so a malformed
          # first token cannot hide behind a valid later one — and the WHOLE
          # value must match <re> up to the format's own delimiter,
          # whitespace or the end (`rounds: N (cap …`, `auto-review-head:SHA
          # -->`), so `10oops`, `10.5` and a suffixed SHA are malformed, not
          # 10, 10 and a tip. Empty when absent, malformed or repeated.
          field() {
            local name="$1:" body="$3" stripped after re
            stripped=${body//"$name"/}
            [ $(( (${#body} - ${#stripped}) / ${#name} )) -eq 1 ] || return 0
            after=${body#*"$name"}
            re="^[[:space:]]*($2)([[:space:]]|\$)"
            [[ "$after" =~ $re ]] || return 0
            printf '%s' "${BASH_REMATCH[1]}"
          }
          if [ -n "$cid" ]; then
            mbody=$(jq -r '.body // ""' <<<"$marker_json")
            # Strict shapes, or the value counts as absent: `prev` feeds
            # arithmetic and `prevsha` a tip comparison, and a body that does
            # not parse (a hand edit — the escalation text invites one) would
            # otherwise make the arithmetic fail under set -e on every
            # trigger (a persistent stall with the label on and a failsafe
            # comment per verdict), read `10oops` as 10, or a partial SHA as
            # the tip. At most nine digits, read as DECIMAL (`08` is not
            # octal, and a wider value would wrap negative and never reach
            # the cap). 0 keeps the loop running; Record round rewrites the
            # body in shape.
            prev=$(field rounds '[0-9]{1,9}' "$mbody")
            if [ -z "$prev" ]; then
              echo "Counter comment $cid has no single well-formed 'rounds: N' value; counting from 0."
              prev=0
            fi
            prev=$((10#$prev))
            # Branch tip recorded when the previous round started (see Record round).
            prevsha=$(field auto-review-head '[0-9a-f]{40}' "$mbody")
          fi
          next=$((prev + 1))
          head=$(jq -r '.headRefOid' <<<"$pr_json")
          # Closed-PR continuation: the frozen headRefOid lies; the live tip
          # is what fix rounds push to and what progress is measured by.
          [ -n "$live_tip" ] && head="$live_tip"
          echo "cid=$cid" >>"$GITHUB_OUTPUT"
          echo "round=$next" >>"$GITHUB_OUTPUT"
          echo "head=$head" >>"$GITHUB_OUTPUT"

          # No-progress escalation: the previous fix round pushed no new commit
          # (branch tip unchanged since it was recorded) yet the reviewer still
          # has suggestions. Re-running the agent against an unchanged tree would
          # just repeat itself, so hand off early rather than burning rounds up
          # to the cap. Keyed on the recorded tip ALONE, not on the count: a
          # refund keeps the head marker while it may take the count to 0
          # (round 1 refunded), and a `prev >= 1` guard would skip the check
          # exactly there, so a verdict on an unchanged tip after such a
          # refund would start round 1 again (Claude Security 4628734). A
          # body without a tip — a reset, or a pre-upgrade marker — skips the
          # check and falls through.
          if [ -n "$prevsha" ] && [ "$head" = "$prevsha" ]; then
            echo "No new commit since the tip $head was recorded (counter at $prev); escalating for no progress."
            echo "stalled=1" >>"$GITHUB_OUTPUT"
            act escalate; exit 0
          fi
          if [ "$next" -gt "$CAP" ]; then act escalate; else act fix; fi

      # Failsafe: if any of the three gate steps errored (e.g. a transient API
      # failure the retries above couldn't ride out), `act` was never set, so
      # every step below skips and nothing reaches the PR — the loop would
      # stall silently with the label still on. Surface it so a human knows to
      # resume. Kept trigger-free ON PURPOSE: the body must not contain a
      # literal @review or @auto, or this bot-authored comment would re-fire
      # the loop and, on a persistent gate failure, spin (see
      # design/auto-agent.md). The `auto` label is left on so re-running the
      # job or a fresh review resumes cleanly.
      - name: Surface gate failure
        if: >-
          always() &&
          (steps.resolve.outcome == 'failure' || steps.labeler.outcome == 'failure' ||
           steps.gate.outcome == 'failure')
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          [ -z "${PR:-}" ] && { echo "No PR number; nothing to surface."; exit 0; }
          gh issue comment "$PR" --repo "$REPO" --body "$(printf '⚠️ auto: the review-fix run errored before it could act (a transient GitHub API failure in a gate step). The loop is paused, not stopped — the label is still on. Re-run the failed job (%s) or post a fresh review request to resume.' "$RUN_URL")" || true

      # Atlas tracking (design/atlas-tracking.md): a review-fix round is the
      # agent working the PR's issue; both @auto exits — converged AND
      # escalated — hand back to a human (there is no Agent →
      # Sign-off; the driver reaches Sign-off by sending it onward). The PR
      # resolves to its issue via claude/issue-N-* (then a Fixes ref). The
      # move back to Review after a fix round — on the re-review request as
      # well as on the agent's own hand-off — is the land job's (the
      # manifest's `stage`).
      - name: Stage - Agent
        if: steps.gate.outputs.act == 'fix'
        uses: meridianlabs-ai/agents/.github/actions/set-stage@main
        with:
          stage: Agent
          token: ${{ steps.mint.outputs.token }}
          repo: ${{ github.repository }}
          issue: ${{ inputs.pr_number }}
          branch: ${{ steps.gate.outputs.head_branch }}

      - name: Stage - Review (handoff)
        if: steps.gate.outputs.act == 'converged' || steps.gate.outputs.act == 'escalate'
        uses: meridianlabs-ai/agents/.github/actions/set-stage@main
        with:
          stage: Review
          token: ${{ steps.mint.outputs.token }}
          repo: ${{ github.repository }}
          issue: ${{ inputs.pr_number }}
          branch: ${{ steps.gate.outputs.head_branch }}

      # Reviewer reported no outstanding suggestions: hand off to a human for the
      # final review/merge (@auto never merges). Idempotent so a later clean
      # re-review doesn't re-ping. The `auto` label is left on, so further CI or
      # human-review activity can still re-engage @auto.
      #
      # On a closed-PR continuation (see the gate) the idempotence window
      # starts at the PR's close: the designed flow is converge → handoff →
      # human promotes (closing the PR) → upstream feedback re-engages the
      # loop, so a pre-close handoff comment is near-certain and would
      # otherwise swallow the continuation's own hand-back — the stage would
      # move to Review with no comment and no @-mention, and the operator
      # would learn the loop finished only by polling. Hand-backs posted
      # after the close still dedupe against each other.
      - name: Converged handoff
        if: steps.gate.outputs.act == 'converged'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          MENTION: ${{ steps.gate.outputs.mention }}
          CONTINUATION: ${{ steps.gate.outputs.continuation }}
          CLOSED_AT: ${{ steps.gate.outputs.closed_at }}
          MARKER: "<!-- auto-converged -->"
        run: |
          set -euo pipefail
          # ISO-8601 UTC timestamps compare correctly as strings; an empty
          # $since (open PR) makes every marker comment count, as before.
          # `--paginate` output is one merged array on current gh, one array
          # per page on older releases; -s plus `.[][]` flattens either so
          # the check yields a single true/false. An API failure yields ""
          # and falls through to posting — same as before.
          since=""
          [ "${CONTINUATION:-}" = "true" ] && since="${CLOSED_AT:-}"
          # Only the loop's own hand-offs count (TRUSTED_LOGINS: this step
          # posts as the machine account); the marker in anyone else's
          # comment would otherwise silence the owed ping (Claude Security
          # 4121983).
          trusted=$(jq -cn --arg t "$TRUSTED_LOGINS" '$t | split(",") | map(gsub("^ +| +$"; "")) | map(select(. != ""))')
          posted=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                     | jq -rs --arg m "$MARKER" --arg since "$since" --argjson t "$trusted" \
                         'any(.[][]; (.body|contains($m)) and (.created_at > $since) and ((.user.login // "") as $l | any($t[]; . == $l)))' || true)
          if [ "$posted" = "true" ]; then
            echo "Handoff already posted${since:+ since close ($since)}; skipping."; exit 0
          fi
          ping=""; [ -n "$MENTION" ] && ping="@$MENTION "
          if [ "${CONTINUATION:-}" = "true" ]; then
            ci="this PR is closed, so the checks shown here are the frozen pre-close runs — CI for the live branch tip runs as push-triggered checks on the branch (and, on repos with a promotion flow, on the upstream PR)."
          else
            ci="see the checks above for CI status."
          fi
          gh pr comment "$PR" --repo "$REPO" --body "$MARKER
          ${ping}🤖 auto: the reviewer has no outstanding feedback — this PR has converged. auto never takes the final step (merge, or upstream promotion on the fork), so it's yours now; $ci The \`auto\` label is left on, so auto will still react to new review or CI activity; remove it to disengage."

      # Escalation is three steps in a fixed order — disarm, reset, hand off —
      # and each later one phrases itself on the earlier ones' outcomes
      # (mirror of claude-auto.yml's escalation, same reasoning):
      #   1. Disarm: remove the label. This is the load-bearing part (it is
      #      also what a human does to stop @auto manually), so it goes first
      #      and nothing else is gated on anything but it.
      #   2. Reset the round counter — ONLY if the disarm succeeded. The
      #      counter is a per-PR-lifetime tally, so after a cap escalation
      #      "re-add it to let me keep iterating" would otherwise re-escalate
      #      on the very next review with suggestions (round 11 > 10); a human
      #      re-labeling has decided the loop deserves another full budget.
      #      Gating on the disarm keeps a failed label removal self-limiting,
      #      as it was before the reset existed: the label stays on but the
      #      counter stays exhausted, so the next verdict re-escalates (and
      #      retries the removal) instead of running a fresh budget with no
      #      human decision. The reset body is the shared composite's (no
      #      head marker: the no-progress check needs prev >= 1, so a fresh
      #      budget's first round skips it and records a fresh tip first),
      #      and it resets the comment THE GATE counted from (its `cid`,
      #      passed as `comment-id`; TRUSTED_LOGINS filters the fallback
      #      lookup) — never an outsider's marker, which would leave the
      #      real counter exhausted: re-add the label and it escalates again
      #      on sight. The CI-fix loop calls the composite the same way.
      #   3. Hand off: the comment tells the truth about both — a failed reset
      #      leaves the exhausted counter in place, and promising a fresh
      #      budget then would be exactly the false "re-add it" the reset
      #      exists to fix; a failed disarm is the one case where "re-add it"
      #      is wrong because it was never removed. It also says that re-adding
      #      the label ALONE does nothing here: this loop only fires on the
      #      reviewer's next verdict, so the human must request a fresh review
      #      too (the CI-fix loop needs no such clause — a red run is its
      #      trigger). The post retries (shared post-pr-comment composite) and
      #      runs even if the disarm or reset STEP errored outright
      #      (!cancelled(), not the default success()): by this point the
      #      label may already be gone, so a skipped or transiently failed
      #      comment would leave the PR silently parked with nobody pinged and
      #      only a red job as the trace. Empty disarm/reset outputs (the step
      #      never wrote them) route to the conservative wording — "still
      #      armed", "could not reset".
      # The disarm and the reset are shared composites (AGENTS.md convention:
      # step bodies copied between the loops live in .github/actions/).
      - name: Disarm the loop (escalation)
        if: steps.gate.outputs.act == 'escalate'
        id: disarm
        uses: meridianlabs-ai/agents/.github/actions/disarm-auto-loop@main
        with:
          token: ${{ steps.mint.outputs.token }}
          repo: ${{ github.repository }}
          pr: ${{ inputs.pr_number }}
          label: ${{ inputs.auto_label }}

      - name: Reset the round counter (escalation)
        if: steps.gate.outputs.act == 'escalate' && steps.disarm.outputs.disarmed == '1'
        id: reset
        uses: meridianlabs-ai/agents/.github/actions/reset-auto-counters@main
        with:
          token: ${{ steps.mint.outputs.token }}
          repo: ${{ github.repository }}
          pr: ${{ inputs.pr_number }}
          counters: rounds
          comment-id: ${{ steps.gate.outputs.cid }}
          trusted-logins: ${{ env.TRUSTED_LOGINS }}
          reason: "on escalation — re-adding `${{ inputs.auto_label }}` starts a fresh budget"

      # Trigger-free ON PURPOSE (like every bot-authored comment here): the
      # re-engagement path is described, never spelled as its literal trigger.
      - name: Compose the hand-off
        if: ${{ !cancelled() && steps.gate.outputs.act == 'escalate' }}
        id: handoff
        env:
          AUTO_LABEL: ${{ inputs.auto_label }}
          CAP: ${{ inputs.review_round_cap }}
          MENTION: ${{ steps.gate.outputs.mention }}
          STALLED: ${{ steps.gate.outputs.stalled }}
          DISARMED: ${{ steps.disarm.outputs.disarmed }}
          RESET_OK: ${{ steps.reset.outputs.ok }}
        run: |
          set -euo pipefail
          if [ "$DISARMED" != "1" ]; then
            clause="I could not remove the \`$AUTO_LABEL\` label (API error), so the loop is still armed — but its round counter is exhausted, so I'll escalate again rather than run. Remove the label by hand to stop me; to let me keep iterating with a fresh budget, re-engage me with an @-mention comment (that re-applies the label, resets both counters and, if it pushes a fix, requests a fresh review)."
          elif [ "$RESET_OK" = "1" ]; then
            clause="Removing the \`$AUTO_LABEL\` label. Re-add it AND request a fresh review to let me keep iterating — I only act on the reviewer's next verdict, so the label alone does nothing. The round counter is reset, so that starts a fresh budget of $CAP."
          else
            clause="Removing the \`$AUTO_LABEL\` label. Re-add it AND request a fresh review to let me keep iterating (I only act on the reviewer's next verdict) — but I could not reset the round counter (API error), so first edit my sticky \"auto review rounds\" comment so the count reads 0, or re-engage me with an @-mention comment instead (that re-applies the label, resets both counters and, if it pushes a fix, requests a fresh review); otherwise I'll escalate again on sight."
          fi
          ping=""; [ -n "$MENTION" ] && ping="@$MENTION "
          if [ "${STALLED:-}" = "1" ]; then
            reason="my last fix round pushed no new changes, so I'm not making progress on the reviewer's remaining feedback"
          else
            reason="the reviewer still has feedback after $CAP review rounds and I haven't converged"
          fi
          printf 'body=%s\n' "${ping}🤖 auto: $reason. Handing this to a human. $clause" >>"$GITHUB_OUTPUT"

      - name: Escalate to human
        if: ${{ !cancelled() && steps.gate.outputs.act == 'escalate' }}
        uses: meridianlabs-ai/agents/.github/actions/post-pr-comment@main
        with:
          token: ${{ steps.mint.outputs.token }}
          repo: ${{ github.repository }}
          pr: ${{ inputs.pr_number }}
          body: ${{ steps.handoff.outputs.body }}
          what: escalation hand-off
          failure-hint: >-
            The disarm (disarmed=${{ steps.disarm.outputs.disarmed || 'unknown' }})
            and reset (ok=${{ steps.reset.outputs.ok || 'skipped' }}) above have
            already run, so nobody was told.

      # Record the round (idempotent sticky comment) before invoking the
      # agent. Until the job split this ran AFTER the fix job's sync and
      # provisioning steps, so a sync or provisioning failure — which skips
      # the agent — never burned a round; it cannot follow them any more
      # (they run in the untrusted job, and this is a marvin write), so the
      # land job's refund step now covers that case too: a round whose agent
      # never launched and whose landing pushed nothing is refunded, whatever
      # skipped it.
      - name: Record round
        if: steps.gate.outputs.act == 'fix'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          CID: ${{ steps.gate.outputs.cid }}
          ROUND: ${{ steps.gate.outputs.round }}
          CAP: ${{ inputs.review_round_cap }}
          HEAD: ${{ steps.gate.outputs.head }}
          MARKER: "<!-- auto-review-rounds -->"
        run: |
          set -euo pipefail
          # The auto-review-head marker records the branch tip at the START of
          # this round; next round's gate compares against it to detect a fix
          # round that pushed nothing (no-progress escalation).
          body="$MARKER
          🤖 auto review rounds: $ROUND (cap $CAP).
          <!-- auto-review-head:$HEAD -->"
          if [ -n "$CID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$CID" -f body="$body" --silent
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" --silent
          fi

  # UNTRUSTED: checks out the PR head, provisions, runs the agent. Names NO
  # GitHub-write secret — the machine account's token is absent (the
  # invariant at the top of this file); the codex engine's OPENAI_API_KEY is
  # named at its Run step
  # because codex must hold its own key, and the WIF inputs on the action
  # step are identifiers, not secrets (AGENTS.md). The agent commits locally
  # and never pushes or posts: the job token is read-only (permissions below),
  # the settings deny `git push` and the gh posting verbs, and everything
  # that must be pushed, replied, resolved, posted or moved afterwards goes
  # into the landing manifest the last step uploads, for the `land` job to
  # act on.
  fix:
    needs: gate
    if: needs.gate.outputs.act == 'fix' && needs.gate.outputs.engine != 'codex'
    runs-on: ubuntu-latest
    # Same group as the gate (rationale there): one agent per PR branch at a
    # time, and never alongside a CI-fix round.
    concurrency:
      group: claude-auto-${{ github.repository }}-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read          # checkout, sync fetches; cannot push
      pull-requests: read     # the review reads; cannot comment or resolve
      issues: read
      id-token: write         # WIF auth (and the action's own App token)
      actions: read
    outputs:
      # What the land job needs from this job, both read from STEP OUTCOMES
      # — the runner's record of whether a step was entered and how it
      # exited, settled for the agent step before any agent code ran and
      # for the steps ahead of it before that — never from a file in the
      # workspace or under RUNNER_TEMP, which a process the agent leaves
      # behind, or the PR's own provisioning step, can write (Claude
      # Security 4628734; claude-auto.yml's finding 4628657 retired the
      # execution-file "launched" signal for the same reason).
      # `agent_skipped` is `true` when this job's agent step — the Claude
      # step; the codex job publishes its own — was never entered, which is
      # the case exactly when the checkout, the sync or the provisioning
      # failed ahead of it. It drives the land job's round refund and
      # nothing else: a step that was entered and then FAILED, whatever
      # failed it, is not skipped, so that round keeps its count — the
      # agent cannot make its own step read as never entered, only as
      # failed. `agent_outcome` is the Claude step's outcome; only `success`
      # admits a re-review request on a round that landed nothing (the Land
      # step's `allow-no-change-handback`) — a value the agent can only push
      # toward `failure`, which withholds.
      agent_outcome: ${{ steps.claude.outcome }}
      agent_skipped: ${{ steps.claude.outcome == 'skipped' && 'true' || 'false' }}
    steps:
      # Check out the PR head (the gate's lookup). persist-credentials:false
      # (issue #61): checkout otherwise writes its token into .git/config for
      # the rest of the job — and the codex job, which starts with this same
      # checkout, group-grants the whole workspace to the codex user. Nothing
      # is persisted; every later
      # git network call authenticates itself (design/architecture.md → "No
      # persisted git credentials"): the runner-side steps through a
      # step-scoped credential helper on the job token, the agent through
      # claude-code-action's own origin-URL credential (its App token — the
      # agent never pushes, so the identity behind it no longer matters
      # here). The fetch itself is a read, so the job token is enough for it.
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.gate.outputs.head_branch }}
          token: ${{ github.token }}
          persist-credentials: false

      # Regression guard for the invariant above (shared composite — one copy
      # for all three workflows): asks git, which follows includes, for the
      # header checkout would have persisted, keyed on the server URL.
      - name: Assert no credential persisted in the workspace
        uses: meridianlabs-ai/agents/.github/actions/assert-no-persisted-credential@main

      # Capture the branch tip before the agent runs: emit-landing's start-sha
      # (commits above it are the run's landable work), and what "Compose
      # landing manifest" compares HEAD against to decide whether the agent
      # committed. Stamped BEFORE the base sync below, so a round whose only
      # product is the runner's base merge still counts as landable work.
      # rev-parse on its own line under -e, so a failure is this step's (not
      # echo's success with an empty sha); Surface agent errors reads the
      # outcome, and the emit step falls back to github.sha so the manifest
      # carrying that error still validates.
      - name: Record base SHA
        id: base
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      # ---- Deterministic base-branch sync (design/architecture.md) ---------
      # The base merge happens HERE, on the runner, for BOTH engines (this
      # job and the codex job open the same way) — not in a prompt. The codex sandbox holds no credentials and is told not to fetch,
      # so it cannot be asked to merge (instruction, not structure, since its
      # sandbox gained network on 2026-09-09; the in-progress hand-off means it
      # never needs to), and a prompted merge is advisory, so branches drifted
      # anyway: inspect_ai#392 sat 11 commits behind main across 20 commits,
      # and because GitHub cannot compute a merge ref for a conflicted PR, CI
      # never ran and every fix round was written against stale code.
      #
      # A CONFLICTED merge is handed on differently per engine: the Claude path
      # gets a CLEAN index and re-merges inside the agent (it has network and
      # the git allow-list); codex gets the merge still IN PROGRESS and resolves
      # the markers in the tree, and its commit step refuses to proceed while
      # any survive. In claude.yml the split is forced — tag mode's setupBranch
      # runs `git checkout <branch> --`, which aborts on an unmerged index. This
      # workflow runs the action in agent mode (bare `prompt:`, no
      # track_progress), which does NOT run setupBranch, so the action would
      # tolerate an in-progress merge here. The split is mirrored anyway: one
      # mental model and one merge instruction across all three workflows (here
      # the inline merge_note in "Compose review-fix prompt"; claude.yml's is
      # its branch_sync_prompt input).
      #
      # The step body is the shared sync-branch composite (one copy for all
      # three workflows). checkout stays false: this job's actions/checkout
      # already put the PR head branch in the workspace (the gate handled fork
      # PRs, and a CLOSED PR with a live branch is a continuation the loop
      # deliberately syncs), and "Record base SHA" above stamped its PRE-merge
      # tip — which is what makes a round whose only product is the base
      # merge still count as landable work (the merge commit is above the
      # start SHA, so the land job pushes it; there is no separate backstop
      # any more). The job token: the composite only reads (a PR lookup and
      # fetches), and it is what its step-scoped git credential is built from.
      - name: Sync branch with base
        id: sync
        uses: meridianlabs-ai/agents/.github/actions/sync-branch@main
        with:
          pr: ${{ inputs.pr_number }}
          engine: ${{ needs.gate.outputs.engine }}
          token: ${{ github.token }}
          # The merge commit's author: the gate decided it from which token
          # it minted (bot on the app path, User on the PAT).
          user-name: ${{ needs.gate.outputs.git_user_name }}
          user-email: ${{ needs.gate.outputs.git_user_email }}
          # The head tip the gate read (its `head`: headRefOid on an open
          # PR, the live branch tip on a closed-PR continuation) — the
          # checkout above was by branch NAME, so a push between the gate
          # and this step would otherwise start the round on code the gate
          # never saw. The sync fails before merging instead (the agent is
          # skipped and the round refunded), and the pre-merge start it
          # records is the gate's — the start the land job is pinned to
          # (finding 4628444, criterion 2).
          head-sha: ${{ needs.gate.outputs.head }}

      # Provision the project environment BEFORE the fix agent starts, so its
      # pytest/ruff/pyright actually run — the same two steps the reviewer
      # has (claude-review.yml; rationale there and in design/architecture.md
      # → "Provisioning the environment for the verify loop"). Until
      # 2026-09-09 the loops had neither, and the
      # gap was invisible on the Claude engine, which installs what it needs
      # from inside the agent, but total on codex, whose sandbox had NO
      # network until 2026-09-09: every codex fix round ran in a bare
      # checkout — "No module named inspect_ai / pytest / ruff / pyright" —
      # pushed changes verified only by whatever tests import nothing, and
      # finally declined to fix at all (inspect_flow#824, 2026-09-09). Placed
      # after the base sync (so a dependency file the merge touched is what
      # gets installed). A provisioning failure SKIPS the agent; the round
      # the gate already recorded is refunded by the land job (the agent
      # never launched and nothing lands), and the Surface step reports it.
      # Fatal on failure, like the reviewer's: a broken setup must be loud,
      # not a silent static-only fix round (the Claude path aborts a
      # conflicted base merge and re-merges inside the agent, so the codex
      # job's conflicted-round tolerance has no counterpart here). Claude
      # engine only: this job runs the caller's composite (and the fallback
      # below) as the runner, which is exactly how the Claude agent itself
      # runs — unsandboxed, as the runner, over a same-repo tree whose tests
      # it then executes — except root: this step still has the runner's
      # sudo, which the "Drop the runner's root access" step below removes
      # before the agent (finding 4629153, criterion 2; the residual is
      # recorded in design/architecture.md → No root for the agent uid);
      # and this job names no
      # OPENAI_API_KEY (Claude Security finding 4629153: the key is the
      # codex job's alone). The codex job provisions differently: the shared
      # fallback recipe, run as the unprivileged codex user AFTER the codex
      # user boundary exists, never the caller's composite as the runner
      # (finding 4628446).
      - name: Provision project environment
        id: setup
        if: hashFiles('.github/actions/claude-setup/action.yml', '.github/actions/claude-setup/action.yaml') != ''
        uses: ./.github/actions/claude-setup

      # Fallback where claude-setup is absent (PR heads on the inspect_ai
      # fork, whose branches are cut from pristine main; Python caller repos
      # that never added the action — NOT cross-repository fork heads, which
      # never reach this step: the gate above skips `isCrossRepository`
      # PRs): the same provision-fallback composite the reviewer runs (uv
      # version, retry, extras/`--group dev`, PATH and `.venv/`-exclude
      # reasoning in its description) — the exclude matters here because,
      # unlike the reviewer, the Claude-engine agent commits from this tree.
      - name: Provision project environment (fallback)
        id: setupfb
        timeout-minutes: 10
        if: >-
          hashFiles('.github/actions/claude-setup/action.yml', '.github/actions/claude-setup/action.yaml') == '' &&
          hashFiles('pyproject.toml') != ''
        uses: meridianlabs-ai/agents/.github/actions/provision-fallback@main

      # Root ends here (Claude Security finding 4629153, criterion 2): the
      # agent runs as the runner, so the runner's passwordless sudo, its
      # docker socket and same-uid inspection of the runner's processes are
      # removed after the last step that needs root and before the agent
      # step, with the agent step's own `if:`, and the composite checks from
      # the runner that `sudo -n true` fails. A failure skips the agent and
      # the Surface step says why. Nothing after the agent step uses sudo or
      # docker. design/architecture.md → No root for the agent uid.
      - name: Drop the runner's root access before the agent
        id: noroot
        uses: meridianlabs-ai/agents/.github/actions/drop-runner-root@main

      # The agent commits and stops, and says what the land job should reply,
      # resolve and post through a JSON file under the landing directory —
      # it holds no credential that may push or post as the loop's identity,
      # so the prompt says so plainly. The review-addressing guidance is
      # unchanged; only the write instructions moved from "post/resolve/push
      # it yourself" to "write it into the manifest": the rationale reply
      # becomes a `replies` entry, the thread resolution a `resolve_threads`
      # id, the re-review request `handback: true`, the hand-off a
      # `handoff_body_file` — the land job prepends the hand-off marker
      # itself, so the agent never writes a marker. The ENVIRONMENT and
      # ENDING CONTRACT paragraphs stay, restated for a run that ends with
      # commits on the branch and a manifest. The backtick discipline for
      # trigger tokens and loop markers stays too, aimed at commit messages
      # and the body files now: both render on the PR from a write-access
      # account (the land job de-fangs the bodies as well — two layers, so
      # neither can drift to zero).
      - name: Compose review-fix prompt
        id: prompt
        env:
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          ROUND: ${{ needs.gate.outputs.round }}
          CAP: ${{ inputs.review_round_cap }}
          AGENT_MERGE: ${{ steps.sync.outputs.agent_merge }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          SYNC_BASE: ${{ steps.sync.outputs.base }}
          SYNC_APPEND: ${{ inputs.branch_sync_append }}
          CONTINUATION: ${{ needs.gate.outputs.continuation }}
          MENTION: ${{ needs.gate.outputs.mention }}
          LANDING_DIR: ${{ runner.temp }}/landing
        run: |
          # The landing directory exists before the agent starts, runner-owned,
          # so the agent writes its manifest-extra.json and body files straight
          # into it (the codex path creates it in its prep step for the same
          # reason).
          mkdir -p "$LANDING_DIR"
          # Who the agent's hand-off body pings (the doc-only-nit round and the
          # everything-declined hand-off end with a hand-off the land job
          # posts, not the gate's Converged handoff step). Spliced from the
          # gate's derivation so the rule lives in one place — as prose here
          # it was a fifth copy that kept the pre-2026-09-10 author-first
          # rule after the four code copies moved to assignee-first.
          if [ -n "${MENTION:-}" ]; then
            mention_note=", and @-mention @$MENTION in it — the workflow derived that login as this PR's responsible human (the caller's handoff_mention override, else the first assignee of the PR's Fixes #N issue, else its author), so use it as-is rather than re-deriving who to ping"
          else
            mention_note="; the workflow found no human to @-mention for this PR (no handoff_mention override and no Fixes #N issue with a human assignee or author), so mention nobody"
          fi
          # Live-branch continuation (see the gate): without this note the
          # fix agent discovers a CLOSED PR cold and may plausibly conclude
          # there is nothing to do — the class of misreading the continuation
          # flow exists to fix. Mirrors the reviewer prompt's NOTE, and
          # overrides the handoff's mergeability and CI reports, both of
          # which read the frozen pre-close state on a closed PR.
          note=""
          if [ "${CONTINUATION:-}" = "true" ]; then
            note=" NOTE — closed-PR continuation: PR #$PR is CLOSED but still auto-labeled with a live branch (on repos with a promotion flow this means it was promoted upstream and pushes to this branch update the upstream PR's diff). The checked-out branch is the loop's working surface, not a dead PR: address the feedback and commit on the current branch as usual. Two hand-off adjustments: mergeable/mergeStateStatus is meaningless on a closed PR, so skip that report; and \`gh pr checks\` reflects the FROZEN pre-close head (PR checks never re-run for post-close pushes, so 'this re-runs CI' does not apply here either) — skip it too. Instead note that CI and merge/promotion of the continued work happen on the upstream PR (or as push-triggered checks on the branch tip), outside this loop."
          fi
          # The merge instruction is spliced only when "Sync branch with base"
          # could not land the merge itself — it aborts a conflicted merge to
          # hand the Claude path a clean index (see that step's comment), so
          # on that path the agent does the merge. The caller's
          # branch_sync_append reaches the agent on
          # EITHER path: the fork's is about a non-conflicting CHANGELOG
          # mis-merge, so a clean runner merge is exactly when it applies.
          merge_note=""
          if [ "${AGENT_MERGE:-}" = "1" ]; then
            merge_note=" FIRST TASK, before any of the above: this branch conflicts with its base branch $SYNC_BASE, and a workflow step could not merge it for you. Merge origin/$SYNC_BASE into this branch and resolve every conflict, preserving both sides' intent — the base side is other people's merged work, so never resolve by discarding it wholesale — and leave that merge committed on the branch; the workflow lands it with your other commits. Until that lands GitHub cannot compute a merge ref for this PR, so CI does not run and anything else you do here is unverified."
            # Flattened: a newline would corrupt the value= output line below.
            [ -n "${SYNC_APPEND:-}" ] && merge_note="$merge_note $(tr '\n' ' ' <<<"$SYNC_APPEND")"
          elif [ -n "${MERGE_SHA:-}" ] && [ -n "${SYNC_APPEND:-}" ]; then
            merge_note=" NOTE: a workflow step already merged origin/$SYNC_BASE into this branch before you started (a clean merge, no conflicts). Review that merge result against the following before your other changes, and fix it in your commit if it is off: $(tr '\n' ' ' <<<"$SYNC_APPEND")"
          fi
          printf 'value=%s\n' "You are @auto addressing automated-review feedback on PR #$PR in $REPO (review round $ROUND of $CAP). Read the reviewer's latest summary and any inline review comments with gh: \`gh pr view $PR --comments\`, \`gh api repos/$REPO/pulls/$PR/reviews\`, and \`gh api repos/$REPO/pulls/$PR/comments\`. Your goal is to leave the PR in the best shape you reasonably can, so address the feedback thoroughly — this INCLUDES minor and explicitly non-blocking suggestions (nits, naming, small refactors, reuse/DRY cleanups, doc fixes). Do NOT skip a suggestion just because the reviewer marked it non-blocking or 'not worth blocking on'; if it is a reasonable improvement, make it. The only items to leave unaddressed are ones you genuinely disagree with, that are clearly out of scope for this PR, or that are not a net improvement — for each of those, instead of changing code, write a brief rationale to its own file under $LANDING_DIR/ (e.g. $LANDING_DIR/reply-1.md; file names must match [A-Za-z0-9._-] and must not start with a dot) and append {\"review_comment_id\": <id>, \"body_file\": \"<file name relative to $LANDING_DIR>\"} to the \`replies\` array in $LANDING_DIR/manifest-extra.json. The id is the numeric \`id\` of that inline comment as \`gh api repos/$REPO/pulls/$PR/comments\` returns it; use the thread's FIRST comment (the one with no \`in_reply_to_id\`) so the reply lands in the right thread. Verify your changes (run the relevant pytest/ruff/mypy). If you made any changes, COMMIT them to the current branch with git — do NOT push — and set \`handback\` to true in the manifest: the workflow pushes and requests the re-review for you. EXCEPTION — documentation-only nit round: if EVERY suggestion you acted on this round was explicitly minor/non-blocking (nit-level) AND every change you committed is documentation-only (markdown/doc files, code comments, docstrings — zero behavioral code change), do NOT set handback — another review round would just re-read prose. Instead declare the loop done: hand off to a human as described below, noting the round was doc-only nits. LANDING (mandatory): you hold no credential that may push or post as the loop's identity, so do NOT push, do NOT open a PR, and do NOT post any comment, review, reply or reaction or resolve any thread yourself. The workflow lands your work after your run ends — it pushes the branch's new commits as the machine account (which re-runs CI), posts your replies, resolves the threads you list, and posts the re-review request or the hand-off — all from the manifest you write: $LANDING_DIR/manifest-extra.json, one JSON object with at most these four keys and nothing else: \`replies\` (array of {review_comment_id, body_file}), \`resolve_threads\` (array of review-thread node ids), \`handback\` (boolean), \`handoff_body_file\` (file name). Body files live next to it under $LANDING_DIR/ and are referenced by name. Create the file if it does not exist and rewrite it whole when you update it, so it is valid JSON when your turn ends (an unparsable file drops everything in it). Do NOT create, edit or delete files that later automated runs execute or load as configuration: anything under .github/ (workflows, which the machine account has no permission to push, and composite actions), agent and git configuration at any depth (CLAUDE.md, CLAUDE.local.md, AGENTS.md, .claude/, .mcp.json, .codex/, .agents/, .gitmodules, .husky/), and build and dependency configuration at any depth (pyproject.toml, setup.py, setup.cfg, uv.lock, uv.toml, .python-version, requirements*.txt, package.json, and the npm, pnpm and yarn lockfiles and configuration files). The landing refuses the whole bundle, so every commit of the run is lost; if the task needs such a change, stop and say so in a comment so a maintainer makes it from their machine. ENVIRONMENT (mandatory): your work exists ONLY on this ephemeral runner until committed — the workflow packages the commits on the current branch when your turn ends — and a run can NEVER resume after your final turn: background tasks do not re-invoke you and their completion notifications never arrive, so never end your turn waiting on anything (subagents, background commands, test suites): collect results in the foreground, and if a final validation is long-running, commit FIRST and let the PR's own CI be the gate (observed loss: a fix round ended with tests 'running in the background' and everything evaporated with the runner). ENDING CONTRACT (mandatory): a run that committed ANY change ends with exactly ONE of the two hand-backs in the manifest — \`handback: true\` (the re-review request) or a \`handoff_body_file\` (the hand-off). Setting both, or neither, is a contract violation: the workflow then posts NEITHER, reports the violation on the PR as an error and fails the run, leaving the board stranded at Agent. Uncommitted edits to tracked files are lost with the runner and reported as a failed round, so commit everything you mean to keep and revert scratch edits to tracked files you do not. THREAD RESOLUTION: list the inline review threads you FULLY addressed in code, so settled feedback is visibly closed — list threads via \`gh api graphql\` (query \`repository.pullRequest.reviewThreads\` — each node has an \`id\` of the form PRRT_…, \`isResolved\`, and its \`comments\`), then append each such thread's \`id\` to \`resolve_threads\` in the manifest; the workflow resolves exactly those after the push. Never list a thread you deliberately declined (the one you wrote a rationale for), only partly addressed, or did not actually address — declined threads stay open so a human can adjudicate them. HAND-OFF: hand off to a human ONLY when nothing remains worth improving — i.e. the review is clean/approving, every remaining suggestion is one you have deliberately declined with a rationale in \`replies\`, or you completed a documentation-only nit round (above). To hand off: check CI with \`gh pr checks $PR\` and mergeability with \`gh pr view $PR --json mergeable,mergeStateStatus\`, then write ONE file under $LANDING_DIR/ (e.g. $LANDING_DIR/handoff.md) and name it in \`handoff_body_file\`: a summary of what you addressed and anything you intentionally declined (and why), with the current CI and mergeable status${mention_note}. The workflow prepends the hand-off marker line itself when it posts that file (the board stage moves on it); do NOT write any marker into the file. Do NOT merge — auto hands the final step to a human. In commit messages and in every file you write for the manifest, refer to this automation as \`auto\` without an @ prefix, and never write the review or dev-agent trigger tokens bare (backtick them): the commit list and those bodies render on the PR from a write-access account, where a bare trigger token would start a workflow. The loop's marker substrings get the same discipline: never write claude-review-summary, claude-review-verdict, claude-review-comment, auto-handoff, auto-review-rounds, auto-review-head, or auto-fix-attempts verbatim in a commit message or a body file — the loop matches them by plain substring, so quoting a reviewer verdict comment verbatim would forge a verdict; when referencing one, break it (e.g. 'claude-review summary'). Likewise never write the codex reviewer's footer 'engine: codex' verbatim: it and the review-comment marker are how the codex fix rounds locate the newest review, so a body of yours carrying either would be mistaken for the review.${note}${merge_note}" >>"$GITHUB_OUTPUT"

      # The agent's push and posting channels are closed in settings, not only
      # in the prompt: `Bash(git push:*)` is stripped from the caller's allow
      # list and put on a `deny` list together with the gh verbs that post or
      # open things (deny beats allow in Claude Code, so this holds against a
      # caller's `settings` and any claude_args override). Guard rails, not
      # a security boundary: `Bash(gh:*)` stays allowed because the review
      # reads the fix needs go through it, so `gh api -X POST/PATCH`
      # (a comment, a reply, a `resolveReviewThread` mutation), `gh pr
      # edit|close|ready` or a `git -C . push` pass the listed prefixes
      # while the action's own App token — NOT scoped to this job's
      # read-only permissions; it carries the App's contents/PR/issues
      # write — is in reach. What holds structurally is the invariant at the
      # top of this file: nothing the agent can reach is marvin's identity,
      # so a write that slipped past the deny list and the prompt would be
      # claude[bot]'s — attributable, and the same identity the dev agent
      # already writes under on a marvin-less claude.yml caller — never the
      # loop's. No MCP server is installed in agent mode without explicit
      # tool grants (none are given), so there is no API-side commit or
      # comment tool to deny. Same step as claude-auto.yml's; keep the two
      # in step.
      - name: Compose fix settings (deny pushes and posts)
        id: fixsettings
        env:
          SETTINGS: ${{ inputs.settings }}
        run: |
          set -euo pipefail
          # The action documents `settings` as a JSON string OR a path to a
          # settings file (its setupClaudeCodeSettings tries JSON.parse
          # first, then reads the path relative to the workspace — i.e. a
          # file from this PR checkout, which the deny overlay below then
          # covers like any other). Mirror that, since the value is
          # transformed here before the action sees it; anything else fails
          # loudly and the Surface step reports it (FIXSETTINGS_OUTCOME) —
          # the action step is skipped, not failed, so nothing else would.
          [ -n "$SETTINGS" ] || SETTINGS='{}'
          is_object() { printf '%s' "$1" | jq -e 'type == "object"' >/dev/null 2>&1; }
          if ! is_object "$SETTINGS" && [ -f "$SETTINGS" ]; then
            echo "settings input is a path; reading $SETTINGS"
            SETTINGS=$(cat "$SETTINGS")
          fi
          is_object "$SETTINGS" || { echo "::error::the settings input is neither a JSON object nor a path to a file holding one"; exit 1; }
          deny='["Bash(git push:*)","Bash(gh pr comment:*)","Bash(gh issue comment:*)","Bash(gh pr review:*)","Bash(gh pr create:*)","Bash(gh pr merge:*)","Bash(gh issue create:*)"]'
          merged=$(printf '%s' "$SETTINGS" | jq -c --argjson d "$deny" '
            .permissions.allow = ((.permissions.allow // []) - $d)
            | .permissions.deny = (((.permissions.deny // []) + $d) | unique)')
          {
            echo "value<<SETTINGS_EOF"
            printf '%s\n' "$merged"
            echo "SETTINGS_EOF"
          } >>"$GITHUB_OUTPUT"

      # No github_token: the action mints its own App token through the OIDC
      # exchange (as claude-review.yml's and claude-auto.yml's do), so the
      # machine-account PAT is nowhere in this job. The GIT_CONFIG_* env is
      # the step-scoped fallback credential (issue #61) for any git call that
      # does not go through the action's rewritten origin URL — the JOB token
      # now: the agent never pushes, and the helper is scoped to this
      # server's URL, so a `git fetch` the agent aims at any other host gets
      # no credential.
      - uses: anthropics/claude-code-action@v1
        id: claude
        env:
          GIT_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.${{ github.server_url }}.helper
          GIT_CONFIG_VALUE_1: '!f() { echo username=x-access-token; echo "password=$GIT_TOKEN"; }; f'
        with:
          anthropic_federation_rule_id: fdrl_01GpNgJm9jE6ZfvcqoJYQL2Y
          anthropic_organization_id: be5d0086-bc43-45d2-9184-20ecdd647aa7
          anthropic_service_account_id: svac_01RL4wYD7ikbypwYKf4wFojv
          anthropic_workspace_id: wrkspc_01RKCQ5DTPBatQ7kHLkaEueD
          prompt: ${{ steps.prompt.outputs.value }}
          # The trigger actor is the reviewer bot — or, for a codex-engine
          # verdict, the machine account, whose Phase 2 App login is a bot too
          # (TRUSTED_LOGINS; the User entry is inert) — so lift
          # claude-code-action's default non-human-actor guard for exactly
          # those (never '*'). The gate above did the real authorization.
          allowed_bots: ${{ format('claude,{0}', env.TRUSTED_LOGINS) }}
          settings: ${{ steps.fixsettings.outputs.value }}
          claude_args: >-
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
            ${{ inputs.model != '' && inputs.fallback_model != '' && format('--fallback-model {0}', inputs.fallback_model) || '' }}
            ${{ inputs.append_system_prompt != '' && format('--append-system-prompt {0}', toJSON(inputs.append_system_prompt)) || '' }}

      # The action leaves its App token in remote.origin.url; reset the URL so
      # the token does not sit in .git/config for the rest of the job and so
      # any later runner-side fetch reaches its own step-scoped helper — git
      # never consults a helper when the URL carries a credential. One
      # mechanism across the three workflows. always(): a failed agent leaves
      # the URL rewritten too.
      - name: Reset origin URL after the agent
        if: always() && steps.claude.outcome != 'skipped'
        uses: meridianlabs-ai/agents/.github/actions/reset-origin-url@main

      # Which model actually served this run (design/architecture.md → Model
      # selection): the init line echoes the requested model even when
      # --fallback-model fires, so this parses modelUsage, writes the served-
      # model table to THIS job's summary, and — when a non-requested model
      # served tokens or the result reads like a classifier refusal — hands
      # the note it would have posted back as its `note` output. No token:
      # this job names no secret, so the note travels to the land job as the
      # manifest's provenance_comment_file (composed below) and posts from
      # there as the machine account. Best-effort, always exits 0. (The codex
      # job's counterpart is its Codex usage step.)
      - name: Model provenance
        id: provenance
        if: always()
        uses: meridianlabs-ai/agents/.github/actions/model-provenance@main
        with:
          exec-file: ${{ steps.claude.outputs.execution_file }}
          requested: ${{ inputs.model }}

      # Surface agent errors the action swallows (model overload/529, 404, etc.),
      # which otherwise leave the review-fix run green with nothing landed.
      # Also catches the "completed-but-blocked" case: the agent finishes with
      # no error but left uncommitted edits (see below). This job cannot post
      # the ⚠️ itself any more (the comment must come from an account whose
      # posts are read, and this job holds no such token): the message is
      # written to a file the landing manifest carries as `error` with
      # fail_run true, and the LAND job posts it — de-fanged, as the machine
      # account — and fails the run AFTER everything else landed. So this step
      # exits 0 on every path: the red X is the land job's.
      - name: Surface agent errors
        id: surface
        if: always()
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          BASE_OUTCOME: ${{ steps.base.outcome }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          SYNC_CONFLICTS: ${{ steps.sync.outputs.conflicts }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          SETUPFB_OUTCOME: ${{ steps.setupfb.outcome }}
          NOROOT_OUTCOME: ${{ steps.noroot.outcome }}
          FIXSETTINGS_OUTCOME: ${{ steps.fixsettings.outcome }}
          # The gate job's lookup (trusted: computed as marvin before any PR
          # code ran); the land job de-fangs the body it lands in anyway.
          MENTION: ${{ needs.gate.outputs.mention }}
          ERROR_FILE: ${{ runner.temp }}/agent-error.md
          # The tree check below runs git after the agent; pinned like the
          # codex job's landing steps (design/codex-engine.md → Hook-safe
          # landing) so the ordering never becomes load-bearing.
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: ${{ runner.temp }}/no-hooks
          GIT_CONFIG_KEY_1: core.fsmonitor
          GIT_CONFIG_VALUE_1: "false"
        run: |
          set -uo pipefail
          rm -f "$ERROR_FILE"
          file="${EXEC:-/home/runner/work/_temp/claude-execution-output.json}"
          err=""
          # The checkout, the persisted-credential assertion or the SHA step
          # failed: nothing else ran. The SHA step has no always(), so a
          # failed checkout OR a tripped assertion (the composite exits 1)
          # leaves it SKIPPED, not failed — test for anything but success,
          # and name all three causes so a tripped security invariant is not
          # read as a checkout hiccup and blindly re-triggered.
          if [ "${BASE_OUTCOME:-}" != "success" ]; then
            err="checking out the PR branch, verifying no credential was persisted in the workspace, or reading the branch SHA failed before the agent started — see the job logs for which; no fix was attempted this round. Re-trigger to retry only if it was the checkout or the SHA read; a persisted credential is a workflow bug, not a transient."
          fi
          # The base-branch sync died before the agent started (a transient
          # gh/fetch error, or its own loud non-conflict merge failure). Every
          # downstream step is SKIPPED, not failed, so no other branch below
          # fires; the round the gate recorded is refunded by the land job
          # (the agent never launched, nothing lands) — without this the
          # failure is a silent stall with the board at Agent.
          if [ -z "$err" ] && [ "${SYNC_OUTCOME:-}" = "failure" ]; then
            err="the base-branch sync step failed before the agent started (a transient gh/fetch error, or a base merge that failed without content conflicts — see the job logs); no fix was attempted this round. Re-trigger to retry."
          fi
          # Provisioning died before the agent started: same shape as the sync
          # failure above — the agent steps are SKIPPED and without this the
          # job is a silent red with the board parked at Agent. Unlike the
          # sync failure (which exits before merge_sha is written), the
          # runner's clean base merge, if there was one, is still above the
          # start SHA here, so emit-landing bundles it and the land job
          # pushes it — re-running CI — and posts the re-review request, even
          # though no fix was attempted. That is the right outcome (the
          # branch stays current, and the re-run finds nothing left to merge,
          # so a deterministic failure repeats this comment at most once more
          # and then stops rather than looping), but the wording below says
          # so instead of claiming nothing moved. A DETERMINISTIC cause is
          # named too: the PR's own dependency change (a pyproject.toml that
          # no longer installs) now fails provisioning on every trigger —
          # before 2026-09-09 the Claude engine would have attempted that
          # class of fix; accepted, it mirrors the dev agent's and reviewer's
          # fatal stance, but "re-trigger" is wrong advice for it, so the
          # message says to fix it by hand. (The codex job tolerates a
          # provisioning failure on its conflicted path; this job has no
          # such path — the Claude engine's sync aborts a conflicted merge
          # and hands it to the agent.)
          if [ -z "$err" ] && [ "${SETUP_OUTCOME:-}" = "failure" ]; then
            err="environment provisioning (claude-setup) failed before the fix agent started — a transient dependency-download/network error, a dependency file the base merge touched, or this PR's own dependency change no longer installing (that one fails identically on every trigger: fix it by hand); no fix was attempted this round, though the runner's clean base merge, if there was one, was still landed on the branch. Re-trigger if it looks transient."
          elif [ -z "$err" ] && [ "${SETUPFB_OUTCOME:-}" = "failure" ]; then
            err="fallback environment provisioning (uv dev-install) failed before the fix agent started — a transient dependency-download/network error, the project not dev-installing on a bare runner, or this PR's own dependency change no longer installing (either of those fails identically on every trigger: fix it by hand — check the job logs); no fix was attempted this round, though the runner's clean base merge, if there was one, was still landed on the branch. Re-trigger if it looks transient."
          fi
          # Taking root away from the runner failed (drop-runner-root): the
          # agent step is SKIPPED, not failed — the boundary fails closed —
          # so without this clause nothing would say why. Probably not
          # transient (a runner image change), so no plain re-trigger advice.
          if [ -z "$err" ] && [ "${NOROOT_OUTCOME:-}" = "failure" ]; then
            err="removing the runner's root access (sudo, the docker socket, process inspection) failed before the fix agent started, so no fix was attempted, though the runner's clean base merge, if there was one, was still landed on the branch — the job log names the check that failed. This is probably not transient: re-triggering fails the same way until the runner image or the drop-runner-root step changes."
          fi
          # The settings composer failed (a caller's `settings` that is
          # neither a JSON object nor a path to a file holding one): the
          # action step is SKIPPED, not failed, so without this clause the
          # round ends "No agent error detected" with a red job on every
          # trigger and nothing on the PR. Deterministic — the caller's stub
          # is what needs fixing, so no "re-trigger" advice.
          if [ -z "$err" ] && [ "${FIXSETTINGS_OUTCOME:-}" = "failure" ]; then
            err="composing the fix agent's settings failed before the agent started — the caller's \`settings\` input is neither a JSON object nor a path to a file holding one (see the job logs); no fix was attempted this round. This fails identically on every trigger: fix the caller stub's settings input."
          fi
          # The agent's own error text is free-form (and unbounded — it is
          # the final message when is_error is set); cap it so the manifest's
          # error.message stays well under the validator's 64 KiB limit.
          [ -z "$err" ] && [ -f "$file" ] && err=$(jq -r '(if type=="array" then . else .messages end) | map(select(.type=="result" and .is_error==true)) | last | .result // empty' "$file" 2>/dev/null | head -c 6000 || true)
          if [ -z "$err" ] && [ "$CLAUDE_OUTCOME" = "failure" ]; then
            err="the review-fix step failed before producing a result (see the job logs)."
          fi
          # Completed-but-blocked: the action reports success,
          # but the agent left edits to tracked files uncommitted — they die
          # with the runner, whatever its summary says. A healthy round either
          # commits its changes (the land job pushes them) or makes none at
          # all (it declines with rationale replies and hands off, or its
          # final message explains why, relayed by the land job). Untracked
          # files are normal scratch (test caches, venvs) — only tracked-file
          # edits count (inspect_ai#271 was a false ⚠️ from untracked
          # leftovers on a doc-only round). Flagged only when nothing of the
          # AGENT's is landable: HEAD still at the start SHA, or exactly the
          # runner's clean base merge (a merge-only round — the one commit
          # above the start SHA is the runner's, and the agent's own work is
          # the edits dying here; the merge still lands, so the wording says
          # "no fix", not "nothing"). With an agent commit above it the fix
          # lands and the leftovers are a warning, as before the split when a
          # pushed round was never second-guessed. The old "a hand-off posted
          # this round explains unpushed edits" exemption is gone with the
          # push wall it excused: the agent no longer pushes, so uncommitted
          # edits next to a hand-off are still lost work.
          if [ -z "$err" ] && [ "$CLAUDE_OUTCOME" = "success" ] && [ -n "${BASE_SHA:-}" ]; then
            dirty=$(git status --porcelain --untracked-files=no --ignore-submodules=dirty 2>/dev/null || true)
            if [ -n "$dirty" ]; then
              head=$(git rev-parse HEAD 2>/dev/null || echo "$BASE_SHA")
              if [ "$head" = "$BASE_SHA" ] || { [ -n "${MERGE_SHA:-}" ] && [ "$head" = "$MERGE_SHA" ]; }; then
                # Strip the @ from trigger tokens in agent-authored text and
                # split the codex reviewer's footer — this is embedded in a
                # marvin-authored comment, which pr-feedback-context would
                # take for the newest review if it carried the footer (the
                # land job de-fangs triggers and markers again, but not the
                # footer: see the codex summary step's comment).
                summary=$(jq -r '(if type=="array" then . else .messages end) | map(select(.type=="result")) | last | .result // empty' "$file" 2>/dev/null | head -c 1000 | sed -E -e 's/@(review|claude|auto)/\1/g' -e 's/engine: codex/engine  codex/g' || true)
                err="the agent finished but left edits to tracked files uncommitted, so no fix landed on the branch (only the runner's base merge, if there was one) — whatever its summary reports, no code change reached the PR."
                [ -n "$summary" ] && err="$err Agent summary: $summary"
              else
                echo "::warning::the agent committed a fix but also left uncommitted edits to tracked files behind; the commits land, the leftovers die with the runner: $(printf '%s' "$dirty" | head -5 | tr '\n' ' ')"
              fi
            fi
          fi
          [ -z "$err" ] && { echo "No agent error detected."; exit 0; }
          echo "::error::review-fix run did not complete: $err — the land job posts the note and fails the run."
          # cc the responsible human (gate-derived): without a mention these
          # error reports on agent-authored PRs email nobody.
          cc=""
          [ -n "${MENTION:-}" ] && cc=$(printf '\n\ncc @%s' "$MENTION")
          # Re-trigger advice is `@auto`, NOT `@review`: the review that
          # started this round is already posted, so a fresh `@review`
          # would spend a whole review pass re-deriving the same findings
          # before the loop could act. An `@auto` comment on the PR runs
          # the dev agent straight at the standing review (claude.yml's
          # kickoff-on-existing-PR path), re-applies the label, resets both
          # sticky budgets, and its ending contract posts the `@review`
          # hand-back — so the loop resumes where it stopped (Ransom,
          # 2026-09-09; design/atlas-tracking.md → standing review). Bare
          # `@review` stays the right call only when no usable review
          # exists. The tokens are backticked (the land job's de-fang would
          # backtick them anyway): the stubs' machine-account guard drops
          # this comment before any gate reads it, but a bare token here
          # must not be what that guard is protecting against.
          printf '⚠️ The auto review-fix run did not complete:\n\n> %s\n\nIf this looks transient (model API capacity/overload), resume with an `@auto` comment (e.g. `@auto address the review feedback`) — that re-runs the fix against the review already posted and resets the round budget; a fresh `@review` would only repeat the review. Otherwise it likely needs a human.%s\n' "$err" "$cc" >"$ERROR_FILE"

      # Everything the land job pushes, posts, resolves or moves, as ONE JSON
      # object for emit-landing's manifest-extra (schema:
      # .github/actions/emit-landing/README.md). Body text goes in as files
      # under the landing directory, referenced by name; the manifest itself
      # is DATA the land job validates before acting. This is where the
      # review loop's ENDING CONTRACT is enforced: a round that committed
      # changes owes exactly one of the two hand-backs — `handback: true`
      # (the land job posts `@review`) or a `handoff_body_file` (the land
      # job posts it under the `<!-- auto-handoff -->` marker) — and both or
      # neither is a violation: both are dropped, the manifest's `error`
      # explains the contract (the land job posts it and fails the run), and
      # no stage is set, since nothing hands the round back. Both set is a
      # violation whether or not anything was committed (they contradict
      # each other); neither set is one only when the agent committed —
      # merge-only and no-change rounds are handled below.
      #
      # Claude path: the agent's own `manifest-extra.json` in the landing
      # directory supplies `replies`, `resolve_threads`, `handback` and
      # `handoff_body_file` — those four keys and nothing else: every other
      # manifest field is the workflow's (a `comments` or `issues` entry from
      # the agent would be a posting channel the split closed), so unknown
      # keys are dropped, not merged. Values are normalized rather than
      # passed through: a mistyped field (a string "true", a fractional id,
      # a non-PRRT thread id) would otherwise make the validator refuse the
      # WHOLE manifest and the agent's commits with it — dropping the entry
      # with a warning is the proportionate failure. `resolve_threads` is
      # attached only when the agent committed real changes, the codex
      # path's rule (a round that changed nothing settled nothing); `land`
      # intersects the ids with the PR's own threads before resolving.
      #   agent committed, handback → handback: true, and NO stage: the
      #     re-review is mid-flight, and a card stays at Agent while any
      #     agent of the loop is still to run (one rule for every loop,
      #     design/atlas-tracking.md; Ransom, 2026-09-18 — until then the
      #     hand-back set Review too)
      #   agent committed, handoff  → handoff_body_file, stage: Review (the
      #     hand-off ends the loop and hands the PR to a human)
      #   no agent commit (HEAD at the start SHA, or exactly the runner's
      #     clean base merge — merge-only), handoff → handoff_body_file,
      #     stage: Review (everything remaining declined with rationale —
      #     the replies carry it; a merge-only round lands the merge too)
      #   no agent commit, handback → honored when HEAD moved (merge-only:
      #     the runner's base merge lands and re-runs CI, so the re-review
      #     is owed like any bundled hand-back) or the agent step SUCCEEDED
      #     (the re-review re-reads the same code; the gate's no-progress
      #     check then escalates, as it did when the agent posted the
      #     request itself), and dropped when neither holds: a failed or
      #     skipped step with nothing to land owes no re-review, and
      #     honoring one would let a round that never ran re-arm the loop
      #     (Claude Security 4628734; the land job drops it again from the
      #     trusted side — see the Land step's `allow-no-change-handback`)
      #   no agent commit, neither → the round is CONCLUDED with a hand-off
      #     whose body is the agent's final message (when the run succeeded
      #     and the Surface step found no error): the codex path's rule,
      #     applied when the agent decided nothing — a no-change or
      #     merge-only round re-reviewed would read the same code again,
      #     and on a moving base a merge-only re-review defeats the gate's
      #     no-progress check every round (design/architecture.md → the
      #     backstop's merge-only leak); a hand-off also keeps a round that
      #     gave up from stranding the board at Agent. With an error, the
      #     Surface step's report is the round's only comment (as before).
      # Codex path: codex's final message is the body the commit step wrote;
      # the hand-back rule is decided here from HEAD, exactly as the old
      # `Land codex fix` step did — committed changes: `comments` + handback
      # (+ the parsed RESOLVED-THREADS ids); nothing changed, or the base
      # merge alone: the body becomes the hand-off. A moved HEAD with no
      # summary (the commit step failed after codex's own local commits)
      # owes the re-review anyway — the commits land.
      # `moved` requires ancestry (the same test emit-landing applies before
      # it bundles — a rebased HEAD lands nothing and must owe nothing), and
      # a hand-back is owed on ancestry ALONE, whatever the agent step's
      # outcome: a Claude step that ended `failure` after committing lands
      # those commits and hands back, with the Surface step's error posted
      # alongside — dropping committed work is worse, the push is what
      # re-runs CI, and the ⚠️ says the round failed. emit-landing drops
      # handback, stage, resolve_threads and handoff_body_file again when it
      # drops the bundle, so no bare `@review`, no thread resolution and no
      # completion hand-off posts for a round whose work was lost.
      # Not set -e: a manifest must come out of every path. On the codex path
      # (the ENGINE the gate resolved — not `codexuser.outcome`, which is
      # `skipped`/`failure` when the prep or user-setup step failed and would
      # let those two fall through to the ancestry branch) the git reads are
      # skipped (nothing lands, no hand-back) unless the unresolved-merge
      # guard SUCCEEDED — the same condition emit-landing's read-only takes;
      # claude-auto.yml's composer has the full rationale (the guard is the
      # enforcement point: a failed guard means conflict markers survive in
      # a tree codex may have committed over). Post-codex git, so the git
      # dir is pinned by env like the guard and the commit step (AGENTS.md).
      - name: Compose landing manifest
        id: landing
        if: always()
        env:
          DIR: ${{ runner.temp }}/landing
          EXTRA: ${{ runner.temp }}/landing-extra.json
          PR: ${{ inputs.pr_number }}
          ROUND: ${{ needs.gate.outputs.round }}
          MENTION: ${{ needs.gate.outputs.mention }}
          START_SHA: ${{ steps.base.outputs.sha }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          PROV_NOTE: ${{ steps.provenance.outputs.note }}
          ERROR_FILE: ${{ runner.temp }}/agent-error.md
          GIT_DIR: ${{ github.workspace }}/.git
          GIT_COMMON_DIR: ${{ github.workspace }}/.git
          GIT_WORK_TREE: ${{ github.workspace }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: ${{ runner.temp }}/no-hooks
          GIT_CONFIG_KEY_1: core.fsmonitor
          GIT_CONFIG_VALUE_1: "false"
        run: |
          set -uo pipefail
          mkdir -p "$DIR"
          extra='{}'
          moved=false
          head=""
          if [[ "${START_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            head=$(git rev-parse HEAD 2>/dev/null || echo "$START_SHA")
            if [ "$head" != "$START_SHA" ] && git merge-base --is-ancestor "$START_SHA" "$head" 2>/dev/null; then
              moved=true
            fi
          fi
          # Merge-only: HEAD moved, but only to the runner's clean base merge
          # — any agent commit would have moved it further — so the agent
          # committed nothing.
          merge_only=""
          [ "$moved" = "true" ] && [ -n "${MERGE_SHA:-}" ] && [ "$head" = "$MERGE_SHA" ] && merge_only=1
          committed=""
          [ "$moved" = "true" ] && [ -z "$merge_only" ] && committed=1
          violation=""
          relay=""
          agent='{}'
          if [ -f "$DIR/manifest-extra.json" ]; then
            if ! agent=$(jq -c 'if type=="object" then . else error("not an object") end' "$DIR/manifest-extra.json" 2>&1); then
              echo "::error::landing: the agent's manifest-extra.json is not a JSON object ($agent); its replies, resolutions and hand-back were dropped."
              violation="its manifest-extra.json is not valid JSON (an object), so everything in it was dropped"
              agent='{}'
            fi
          fi
          # Normalize the four fields the agent may set; count what the
          # normalization dropped so the log says why a reply is missing.
          norm=$(jq -c '{
              handback: (.handback == true),
              handoff: ((.handoff_body_file // "") | if type == "string" then . else "" end),
              replies: [(.replies // [])[]? | select(type == "object"
                          and (.review_comment_id | type == "number") and (.review_comment_id == (.review_comment_id | floor)) and .review_comment_id > 0
                          and (.body_file | type == "string") and .body_file != "")
                        | {review_comment_id, body_file}],
              threads: [(.resolve_threads // [])[]? | strings | select(test("^PRRT_[A-Za-z0-9_-]+$"))] | unique,
              mistyped: [(if has("handback") and (.handback | type) != "boolean" then "handback (not a boolean)" else empty end),
                         (if has("handoff_body_file") and (.handoff_body_file | type) != "string" then "handoff_body_file (not a string)" else empty end)],
              dropped_replies: ((.replies // []) | if type == "array" then length else 0 end),
              dropped_threads: ((.resolve_threads // []) | if type == "array" then length else 0 end),
              unknown: [keys[] | select(. != "handback" and . != "handoff_body_file" and . != "replies" and . != "resolve_threads")]
            } | .dropped_replies -= (.replies | length) | .dropped_threads -= (.threads | length)' <<<"$agent" 2>/dev/null) \
            || norm='{"handback":false,"handoff":"","replies":[],"threads":[],"mistyped":[],"dropped_replies":0,"dropped_threads":0,"unknown":[]}'
          handback=$(jq -r '.handback' <<<"$norm")
          handoff=$(jq -r '.handoff' <<<"$norm")
          [ "$(jq -r '.mistyped | length' <<<"$norm")" = "0" ] || echo "::warning::landing: ignored mistyped field(s) in the agent's manifest, treated as unset: $(jq -r '.mistyped | join(", ")' <<<"$norm")."
          [ "$(jq -r '.dropped_replies' <<<"$norm")" = "0" ] || echo "::warning::landing: dropped $(jq -r '.dropped_replies' <<<"$norm") malformed replies entr(ies) from the agent's manifest (need a positive integer review_comment_id and a body_file name)."
          [ "$(jq -r '.dropped_threads' <<<"$norm")" = "0" ] || echo "::warning::landing: dropped $(jq -r '.dropped_threads' <<<"$norm") resolve_threads entr(ies) that are not PRRT_ ids."
          [ "$(jq -r '.unknown | length' <<<"$norm")" = "0" ] || echo "::warning::landing: ignored keys the agent may not set in its manifest: $(jq -r '.unknown | join(", ")' <<<"$norm")."
          if [ "$handback" = "true" ] && [ -n "$handoff" ]; then
            violation="${violation:+$violation; and }it set BOTH \`handback: true\` and a \`handoff_body_file\` ($handoff)"
          elif [ -n "$committed" ] && [ "$handback" != "true" ] && [ -z "$handoff" ]; then
            violation="${violation:+$violation; and }it committed changes but set NEITHER \`handback: true\` nor a \`handoff_body_file\`"
          fi
          if [ -n "$violation" ]; then
            echo "::error::landing: ending-contract violation — $violation; posting neither hand-back."
          elif [ "$handback" = "true" ]; then
            if [ "$moved" = "true" ] || [ "${CLAUDE_OUTCOME:-}" = "success" ]; then
              extra=$(jq -c '.handback = true' <<<"$extra")
              [ -n "$committed" ] || echo "::warning::landing: the agent set handback without committing anything${merge_only:+ (the base merge from the runner lands)}; the re-review re-reads unchanged code (the gate's no-progress check escalates a stall)."
            else
              # Nothing to land and no completed run behind the request:
              # a re-review is owed by a landed commit — the agent's or
              # the runner's clean base merge, whose bundle lands and
              # re-runs CI whatever the step's outcome — or by a run that
              # finished and chose it, never by a round that failed or
              # never ran with nothing to push (the file may predate the
              # agent — the PR's own provisioning step can write it). Keyed
              # on `moved`, the same test emit-landing bundles by, so the
              # hand-back and the bundle cannot come apart (emit-landing
              # drops both when the bundle is lost). The land job enforces
              # the same rule from the trusted side (`allow-no-change-
              # handback` off unless the agent step succeeded, bundled
              # hand-backs exempt); this keeps the manifest honest and the
              # log explicit.
              echo "::warning::landing: the agent set handback, HEAD did not move and the agent step did not succeed (outcome: ${CLAUDE_OUTCOME:-unknown}); no re-review is owed by a round that landed nothing and did not complete, so none is requested."
            fi
          elif [ -n "$handoff" ]; then
            extra=$(jq -c --arg f "$handoff" '.handoff_body_file = $f | .stage = "Review"' <<<"$extra")
          elif [ -z "$committed" ] && [ "${CLAUDE_OUTCOME:-}" = "success" ] && [ ! -s "$ERROR_FILE" ] && [[ "$PR" =~ ^[0-9]+$ ]]; then
            # No agent commit and no decision from the agent: conclude the
            # round with a hand-off built from its final message (below).
            echo "landing: no agent commit${merge_only:+ (base merge only)} and no hand-back set; concluding the round with a hand-off carrying the agent's summary."
            relay=1
          fi
          [ "$(jq -r '.replies | length' <<<"$norm")" = "0" ] || extra=$(jq -c --argjson r "$(jq -c '.replies' <<<"$norm")" '.replies = $r' <<<"$extra")
          if [ "$(jq -r '.threads | length' <<<"$norm")" != "0" ]; then
            if [ -n "$committed" ]; then
              extra=$(jq -c --argjson t "$(jq -c '.threads' <<<"$norm")" '.resolve_threads = $t' <<<"$extra")
            else
              echo "::warning::landing: the agent listed $(jq -r '.threads | length' <<<"$norm") thread(s) to resolve but committed no change; resolving none (a round that changed nothing settled nothing)."
            fi
          fi
          if [ -n "$relay" ]; then
            file="${EXEC:-/home/runner/work/_temp/claude-execution-output.json}"
            # The hand-off body for a round the agent concluded nothing
            # about: the same shape as the codex no-change hand-off (ping,
            # header, the final message), de-fanged as the codex summary
            # step does — this posts as marvin, so a final message quoting a
            # trigger, a loop marker or the codex reviewer's footer would
            # fire a workflow, forge a verdict or pose as the newest review.
            # `land` repeats the trigger and marker rules but deliberately
            # not the footer (it posts the codex reviewer's real one), so
            # this is the footer's only layer. The land job prepends the
            # auto-handoff marker; nothing here writes it.
            summary=$(jq -r '(if type=="array" then . else .messages end) | map(select(.type=="result")) | last | .result // empty' "$file" 2>/dev/null | head -c 10000 \
              | sed -E -e 's/@(review|claude|auto)/`\1`/g' \
                       -e 's/claude-review-(summary|verdict|comment)/claude-review \1/g' \
                       -e 's/engine: codex/engine  codex/g' \
                       -e 's/auto-(handoff|review-rounds|review-head|fix-attempts)/auto \1/g' || true)
            ping=""; [ -n "${MENTION:-}" ] && ping="@$MENTION "
            {
              printf '%sauto (review round %s): no code changes this round%s and no re-review requested — the agent'"'"'s summary below. No review threads were resolved (nothing changed); please resolve any that are settled.\n\n' "$ping" "$ROUND" "${merge_only:+ (the base-branch merge from the workflow was committed)}"
              printf '%s\n' "${summary:-(the agent produced no final message)}"
            } >"$DIR/agent-summary.md"
            extra=$(jq -c '.handoff_body_file = "agent-summary.md" | .stage = "Review"' <<<"$extra")
          fi
          if [ -n "${PROV_NOTE:-}" ]; then
            printf '%s\n' "$PROV_NOTE" >"$DIR/prov.md"
            extra=$(jq -c '.provenance_comment_file = "prov.md"' <<<"$extra")
          fi
          # The error: the Surface step's message, the contract violation, or
          # both (one comment, the violation appended). Our own text, so it
          # names no live trigger token; the land job de-fangs it anyway.
          if [ -n "$violation" ]; then
            cc=""; [ -n "${MENTION:-}" ] && cc=$(printf '\n\ncc @%s' "$MENTION")
            {
              [ ! -s "$ERROR_FILE" ] || { cat "$ERROR_FILE"; printf '\n---\n\n'; }
              printf '⚠️ The auto review-fix round violated its ending contract: %s. A round that committed anything must end with exactly ONE of the two hand-backs in its manifest — `handback: true` (the re-review request) or a `handoff_body_file` (the hand-off) — so NEITHER was posted and the board stage was left at Agent; the commits, replies and thread resolutions it did produce were landed. To resume the loop, post the re-review request or a hand-off by hand.%s\n' "$violation" "$cc"
            } >"$ERROR_FILE.contract"
            mv "$ERROR_FILE.contract" "$ERROR_FILE"
          fi
          if [ -s "$ERROR_FILE" ]; then
            extra=$(jq -c --rawfile msg "$ERROR_FILE" '.error = {message: $msg, fail_run: true}' <<<"$extra")
          fi
          printf '%s\n' "$extra" >"$EXTRA"
          echo "landing: moved=$moved committed=${committed:-0} merge_only=${merge_only:-0} $(jq -c 'if .error then .error.message = "<\(.error.message | length) chars>" else . end' <<<"$extra")"

      # Last, always: package the commits above the start SHA and the
      # manifest for the land job. The PR number is the caller's trusted
      # event number (`inputs.pr_number` — `github.event.issue.number` on the
      # reviewer's comment), the SAME value the land job gets (README → Using
      # the pair): the validator pins the manifest's pr_number to it and its
      # branch to that PR's live head ref (the gate's lookup, passed to
      # `land` as pr-head-ref). Never read-only on this path: a Claude step
      # that ended `failure` after committing lands those commits with the
      # Surface step's error alongside (the composer's comment). The manifest
      # carries that error for the land job to post.
      - name: Emit landing manifest
        if: always()
        uses: meridianlabs-ai/agents/.github/actions/emit-landing@main
        with:
          # When the checkout (or the SHA step) failed, `steps.base` is empty
          # and an empty start_sha would be refused at `validate` — and the
          # land composite posts the manifest's error only from a VALIDATED
          # manifest, so the Surface step's checkout-failure message would be
          # lost to the log. With no repo there is nothing to bundle either
          # way; github.sha (always 40 hex; the default-branch head on
          # issue_comment) is a trusted, well-formed placeholder.
          start-sha: ${{ steps.base.outputs.sha || github.sha }}
          branch: ${{ needs.gate.outputs.head_branch }}
          pr-number: ${{ inputs.pr_number }}
          manifest-extra: ${{ runner.temp }}/landing-extra.json
          read-only: "false"


  # UNTRUSTED, codex engine: the same checkout and sync as the Claude job
  # above, then the codex user boundary, provisioning AS that user, codex,
  # the reclaim and the deterministic commit. The ONLY job of the workflow
  # that names OPENAI_API_KEY (Claude Security finding 4629153: a secret a
  # step references is delivered to the job's runner whether or not the
  # step's `if:` ends up true — the runner builds its `secrets` context
  # from the job message before any step runs — so the Claude job's message
  # used to carry the codex key too; now this job is selected by the gate's
  # engine output at the job level, which GitHub evaluates before
  # dispatching, and a Claude-engine round never has a job message with the
  # key in it). And the only job that runs the codex user recipe: nothing
  # from the checked-out tree executes as the runner here (finding 4628446;
  # the provisioning step's comment).
  fix-codex:
    needs: gate
    if: needs.gate.outputs.act == 'fix' && needs.gate.outputs.engine == 'codex'
    runs-on: ubuntu-latest
    # Same group as the gate (rationale there): one agent per PR branch at a
    # time, and never alongside a CI-fix round.
    concurrency:
      group: claude-auto-${{ github.repository }}-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read          # checkout, sync fetches; cannot push
      pull-requests: read     # the review reads; cannot comment or resolve
      issues: read
      id-token: write         # WIF auth (and the action's own App token)
      actions: read
    outputs:
      # What the land job's refund step needs from this job: whether the
      # agent step ran to a result. `agent_outcome` is `failure` when any
      # codex step that precedes or is the codex run failed, and the codex
      # run's outcome otherwise (`skipped` on a run whose sync or
      # provisioning failed before it started). `agent_skipped` is `true`
      # when the codex run was never entered — `skipped`, the case exactly
      # when the checkout, the sync, a prep step, the codex user, the
      # provisioning or the home reset failed ahead of it — and drives the
      # land job's refund alone (Claude Security 4628734: a run that was
      # entered and failed keeps its round). Step outcomes only: nothing a
      # PR file can forge (the Claude job's comment on the same outputs).
      agent_outcome: ${{ (steps.codexprep.outcome == 'failure' || steps.codexuser.outcome == 'failure' || steps.codexhome.outcome == 'failure' || steps.codexfeedback.outcome == 'failure' || steps.codexcompose.outcome == 'failure' || steps.codexfix.outcome == 'failure') && 'failure' || steps.codexfix.outcome }}
      agent_skipped: ${{ steps.codexfix.outcome == 'skipped' && 'true' || 'false' }}
    steps:
      # Check out the PR head (the gate's lookup). persist-credentials:false
      # (issue #61): checkout otherwise writes its token into .git/config for
      # the rest of the job — and this job group-grants the whole workspace
      # to the codex user. Nothing is persisted; every later git network call
      # authenticates itself (design/architecture.md → "No persisted git
      # credentials"): the runner-side steps through a step-scoped credential
      # helper on the job token; codex holds no credential and never
      # fetches. The fetch itself is a read, so the job token is enough for
      # it.
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.gate.outputs.head_branch }}
          token: ${{ github.token }}
          persist-credentials: false

      # Regression guard for the invariant above (shared composite — one copy
      # for all three workflows): asks git, which follows includes, for the
      # header checkout would have persisted, keyed on the server URL.
      - name: Assert no credential persisted in the workspace
        uses: meridianlabs-ai/agents/.github/actions/assert-no-persisted-credential@main

      # Capture the branch tip before the agent runs: emit-landing's start-sha
      # (commits above it are the run's landable work), and what "Compose
      # landing manifest" compares HEAD against to decide whether the agent
      # committed. Stamped BEFORE the base sync below, so a round whose only
      # product is the runner's base merge still counts as landable work.
      # rev-parse on its own line under -e, so a failure is this step's (not
      # echo's success with an empty sha); Surface agent errors reads the
      # outcome, and the emit step falls back to github.sha so the manifest
      # carrying that error still validates.
      - name: Record base SHA
        id: base
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      # ---- Deterministic base-branch sync (design/architecture.md) ---------
      # The base merge happens HERE, on the runner, for BOTH engines (this
      # job and the codex job open the same way) — not in a prompt. The codex sandbox holds no credentials and is told not to fetch,
      # so it cannot be asked to merge (instruction, not structure, since its
      # sandbox gained network on 2026-09-09; the in-progress hand-off means it
      # never needs to), and a prompted merge is advisory, so branches drifted
      # anyway: inspect_ai#392 sat 11 commits behind main across 20 commits,
      # and because GitHub cannot compute a merge ref for a conflicted PR, CI
      # never ran and every fix round was written against stale code.
      #
      # A CONFLICTED merge is handed on differently per engine: the Claude path
      # gets a CLEAN index and re-merges inside the agent (it has network and
      # the git allow-list); codex gets the merge still IN PROGRESS and resolves
      # the markers in the tree, and its commit step refuses to proceed while
      # any survive. In claude.yml the split is forced — tag mode's setupBranch
      # runs `git checkout <branch> --`, which aborts on an unmerged index. This
      # workflow runs the action in agent mode (bare `prompt:`, no
      # track_progress), which does NOT run setupBranch, so the action would
      # tolerate an in-progress merge here. The split is mirrored anyway: one
      # mental model and one merge instruction across all three workflows (here
      # the inline merge_note in "Compose review-fix prompt"; claude.yml's is
      # its branch_sync_prompt input).
      #
      # The step body is the shared sync-branch composite (one copy for all
      # three workflows). checkout stays false: this job's actions/checkout
      # already put the PR head branch in the workspace (the gate handled fork
      # PRs, and a CLOSED PR with a live branch is a continuation the loop
      # deliberately syncs), and "Record base SHA" above stamped its PRE-merge
      # tip — which is what makes a round whose only product is the base
      # merge still count as landable work (the merge commit is above the
      # start SHA, so the land job pushes it; there is no separate backstop
      # any more). The job token: the composite only reads (a PR lookup and
      # fetches), and it is what its step-scoped git credential is built from.
      - name: Sync branch with base
        id: sync
        uses: meridianlabs-ai/agents/.github/actions/sync-branch@main
        with:
          pr: ${{ inputs.pr_number }}
          engine: ${{ needs.gate.outputs.engine }}
          token: ${{ github.token }}
          # The merge commit's author: the gate decided it from which token
          # it minted (bot on the app path, User on the PAT).
          user-name: ${{ needs.gate.outputs.git_user_name }}
          user-email: ${{ needs.gate.outputs.git_user_email }}
          # The head tip the gate read (its `head`), as in the fix job's
          # copy: the checkout was by branch NAME, so a push between the gate
          # and this step would otherwise start the round on code the gate
          # never saw. The sync fails before merging instead, and the
          # pre-merge start it records is the gate's — the start the land
          # job is pinned to (finding 4628444, criterion 2).
          head-sha: ${{ needs.gate.outputs.head }}

      # ---- Codex engine fix round (design/codex-engine.md) -------------------
      # No GitHub credentials in the codex sandbox, so the review feedback is
      # pre-fetched into the prompt file (job token: reads only; the two
      # steps after provisioning); the commit is deterministic (below), and
      # the push, the summary comment, the thread resolutions and the
      # re-review request or hand-off are the land job's, through the
      # manifest — the composition step decides between the two from whether
      # HEAD moved, exactly as the old `Land codex fix` step did. This step is
      # the part that must run BEFORE the codex user exists: the commit
      # identity it writes into .git/config is what `Create codex user`
      # snapshots and the reclaim step restores, and the landing directory
      # is created runner-owned before codex gets its workspace grants, so
      # the codex user (a member of the runner group under the
      # create-codex-user recipe) cannot pre-create it or plant a file the
      # later commit and compose steps write next to.
      - name: Prepare codex workspace
        id: codexprep
        env:
          LANDING_DIR: ${{ runner.temp }}/landing
          # The codex commit's author (the gate's outputs: bot on the app
          # path, User on the PAT — see the gate job).
          GIT_USER_NAME: ${{ needs.gate.outputs.git_user_name }}
          GIT_USER_EMAIL: ${{ needs.gate.outputs.git_user_email }}
        run: |
          set -euo pipefail
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          mkdir -p "$LANDING_DIR"
          # The commit step stages with a blanket `git add -A` (new source
          # files are legitimate output), so exclude the scratch that
          # provisioning and codex's verification runs leave behind on repos
          # whose .gitignore doesn't already cover it (caches, venvs, the
          # egg-info a setuptools editable install writes into the source
          # tree). Written HERE, before the codex user exists: after the
          # workspace grant a process running as codex could have replaced
          # .git/info/exclude with a symlink, and a runner-side append would
          # follow it (finding 4628446, review round 1). The prompt file
          # itself lives in RUNNER_TEMP for the same reason.
          printf '%s\n' .venv/ venv/ '*.egg-info/' __pycache__/ \
            .pytest_cache/ .mypy_cache/ .ruff_cache/ .coverage node_modules/ \
            >>.git/info/exclude

      # codex-action's default safety-strategy (drop-sudo) chmods root-owned
      # service sockets under /run, breaking D-Bus -> systemd-resolved -> DNS;
      # the hosted runner then dies with "lost communication" 52-65 minutes
      # into the job (openai/codex-action#160; observed twice at ~62 min on
      # inspect_ai#389, 2026-08-31). Until fixed upstream, run codex as a
      # dedicated unprivileged user — the README's other blessed strategy for
      # permission profiles: containment is the user boundary plus the
      # profile sandbox, and the API key stays out of reach (codex has no
      # sudo). The user/grant recipe — pre-codex .git/config and embedded-
      # repo snapshots for the reclaim step, the action's
      # examples/unprivileged-user.yml chown/g+rwX, the codex-owned output
      # dir under RUNNER_TEMP, git safe.directory, and network ON in the
      # sandbox (design/codex-engine.md → Network) — is the shared
      # create-codex-user composite; its description carries the rationale
      # for each. Step name and id are load-bearing: the reclaim step gates
      # on `steps.codexuser.outcome`. Runs BEFORE provisioning (Claude
      # Security finding 4628446): from here on nothing from the checked-out
      # tree executes as the runner — the provisioning step below runs the
      # tree's build backend as the codex user, and codex itself runs as
      # that user.
      - name: Create codex user
        id: codexuser
        uses: meridianlabs-ai/agents/.github/actions/create-codex-user@main

      # Provision the project environment AS THE CODEX USER, after the user
      # boundary exists (Claude Security finding 4628446). The Claude job
      # runs the caller's `claude-setup` composite and the fallback recipe as
      # the runner; a composite action can only run as the runner, and on
      # this job the runner is a uid with passwordless sudo, the OIDC request
      # token and — at the codex-action step below — OPENAI_API_KEY, none of
      # which the codex user boundary lets codex reach. The PR head this job
      # checks out may be one the pipeline itself authored from an outsider's
      # issue text (pushed and labelled by the machine account, so
      # `same-repo` says nothing about who wrote its `pyproject.toml` build
      # hooks or its `claude-setup` action), so its code runs only where
      # codex's own code runs: as `codex`, no sudo, no tokens, no view of the
      # runner's processes. Hence always the shared fallback recipe (`user:
      # codex` — the composite runs `provision.sh` under `sudo -u codex -H`),
      # never `./.github/actions/claude-setup`, even on callers that define
      # it: the venv lands in the checkout as before, codex-owned, and the
      # compose step names its tools by the composite's `bin` output. Python
      # projects (`pyproject.toml`) get the generic recipe; a caller recipe runs
      # without one (the stub knows its project: a Node repository's `pnpm
      # install` has no pyproject); anything else codex provisions itself
      # inside its sandbox, which has network (its prompt says so).
      # Placed after the base sync (so a dependency file the merge touched is
      # what gets installed). A provisioning failure SKIPS the agent; the
      # round the gate already recorded is refunded by the land job (the
      # agent never launched and nothing lands), and the Surface step
      # reports it — fatal, with ONE exception: the conflict path. sync-branch
      # hands codex the base merge still IN PROGRESS, with conflict markers
      # in the tree, and provisioning runs over that tree — so when
      # pyproject.toml or the lockfile is among the conflicted files the
      # install fails DETERMINISTICALLY, and a fatal failure here would skip
      # the very round that exists to resolve the markers (every re-trigger
      # failing the same way). So when the sync left conflicts a provisioning
      # failure is tolerated: the round runs static-only, codex is told in
      # its prompt that provisioning failed, and the next round — on the
      # resolved branch — provisions normally. `outcome` still reads
      # `failure` on the tolerated path (only `conclusion` is neutralized),
      # which is what the prompt composer and the Surface step key on.
      - name: Provision project environment (as the codex user)
        id: setup
        timeout-minutes: 10
        if: hashFiles('pyproject.toml') != '' || inputs.provision != '' || inputs.codex_provision != ''
        continue-on-error: ${{ steps.sync.outputs.conflicts != '' }}
        uses: meridianlabs-ai/agents/.github/actions/provision-fallback@main
        with:
          user: codex
          # The caller's own recipe, if its stub set one (the trusted
          # counterpart of its claude-setup): `provision`, else the earlier
          # `codex_provision`; both empty runs the generic dev-install.
          recipe: ${{ inputs.provision || inputs.codex_provision }}

      # The boundary between provisioning-as-codex and codex-action (Claude
      # Security finding 4628446, review round 1): kill every process still
      # running as codex — a hostile build backend's survivor — and re-create
      # the codex home from scratch. codex-action's runner-side bootstrap
      # reads ~codex/.codex/config.toml (following a symlink) and writes the
      # merged file back readable by codex, so a config.toml the provisioning
      # had replaced with a link to /proc/self/environ would copy the action
      # process's environment — the OIDC request token, the key input — into
      # a file codex can read. After this step nothing runs as codex and the
      # only files codex-action reads before launching codex are the ones the
      # composite wrote. A failure skips codex (the Surface step names it).
      - name: Reset codex home
        id: codexhome
        uses: meridianlabs-ai/agents/.github/actions/create-codex-user@main
        with:
          mode: reset-home
          # The provisioned tools on the PATH of codex's own commands, never
          # the job PATH (create-codex-user's `bin` input).
          bin: ${{ steps.setup.outputs.bin }}

      # The PR-thread sections of the codex prompt (top-level comments
      # filtered and anchored on the newest review round, review threads by
      # state) come from the shared composite — the same jq the dev verb
      # embeds, so the two cannot drift — written to a file the compose step
      # cats. A failed fetch fails this step (retry-then-fail inside), which
      # skips the compose and the agent: the Surface step names it and the
      # infra-crash refund treats it like a failed prep.
      - name: Fetch PR thread for codex prompt
        id: codexfeedback
        uses: meridianlabs-ai/agents/.github/actions/pr-feedback-context@main
        with:
          token: ${{ github.token }}
          repo: ${{ github.repository }}
          pr: ${{ inputs.pr_number }}
          out: ${{ runner.temp }}/codex-feedback.md

      # The prompt: the review feedback and the task, with the verification
      # instruction keyed on what the provisioning step (as codex, above) did.
      # After provisioning, as the runner, into RUNNER_TEMP (755
      # runner:runner, readable by codex; codex-action reads prompt-file
      # runner-side anyway) — never into the workspace: once the codex user
      # has its grant, a runner-side write there could follow a symlink a
      # process running as codex planted (finding 4628446, review round 1).
      - name: Compose codex prompt
        id: codexcompose
        env:
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          ROUND: ${{ needs.gate.outputs.round }}
          CONFLICTS: ${{ steps.sync.outputs.conflicts }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          SYNC_BASE: ${{ steps.sync.outputs.base }}
          SYNC_APPEND: ${{ inputs.branch_sync_append }}
          CAP: ${{ inputs.review_round_cap }}
          CONTINUATION: ${{ needs.gate.outputs.continuation }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          BIN: ${{ steps.setup.outputs.bin }}
        run: |
          set -euo pipefail
          # What the sandbox actually has depends on what the provisioning
          # step did: it is conditional (no pyproject.toml means it did not
          # run), and on a conflicted round a failure is tolerated rather
          # than fatal (see that step) — so the verification instruction says
          # which case it is instead of asserting a venv that may not exist.
          # The tools resolve by name: under the unprivileged-user strategy
          # codex-action launches codex via `sudo -u codex` (no -E), and
          # sudo's env_reset/secure_path replaces PATH before codex starts,
          # so the job PATH never reaches codex (inspect_flow#818 dev run,
          # 2026-09-09), but the Reset codex home step writes the
          # composite's `bin` directories into codex's config.toml as the
          # PATH of every command codex runs. The provisioning ran as codex,
          # so there is no runner PATH to discover from: the tools named are
          # looked up in those same directories.
          if [ "${SETUP_OUTCOME:-}" = "success" ]; then
            tools=""
            IFS=: read -r -a dirs <<<"$BIN"
            for t in pytest ruff mypy pyright python3 node pnpm npm; do
              for d in "${dirs[@]}"; do
                [ -x "$d/$t" ] && { tools="$tools$t=$d/$t "; break; }
              done
            done
            verify="Verify your changes with the locally provisioned tools where relevant. Their directories are on the PATH of every command you run, so they resolve by name, as do project scripts that call one another: ${tools:-none discovered}."
          elif [ "${SETUP_OUTCOME:-}" = "failure" ]; then
            verify="NOTE: environment provisioning FAILED before you started (on this conflicted round the likely cause is a conflicted dependency file — pyproject.toml or a lockfile — see the merge conflict task below), so pytest and the project's dependencies are probably NOT installed. Resolve the merge conflict first; THEN you may provision them yourself (network is available inside your sandbox): create .venv in the project root and dev-install the project into it (e.g. /usr/bin/python3 -m venv .venv && .venv/bin/pip install -e '.[dev]' — .venv/ and *.egg-info/ are already git-excluded; keep it to that). If that fails too, verify as far as the bare runner allows (py_compile, reading the code) and state plainly in your final message that verification was static-only this round — the next round provisions normally once the resolved branch is pushed."
          else
            verify="Verify your changes locally (pytest/ruff/mypy) where relevant and available — no project environment was provisioned for this checkout (no pyproject.toml); network is available inside your sandbox, so you may install what verification needs yourself (keep it minimal and out of the tree — a venv or cache directory, never edits to tracked files)."
          fi
          {
            echo "You are auto, addressing automated-review feedback on PR #$PR in $REPO (review round $ROUND of $CAP), running on the Codex engine in a local checkout of the PR's head branch."
            # Same continuation note as the Claude fix prompt: the codex
            # agent cannot query PR state itself, but the embedded comments
            # below may mention the close, so pre-empt the "closed PR,
            # nothing to do" misreading here too.
            if [ "${CONTINUATION:-}" = "true" ]; then
              echo "NOTE — closed-PR continuation: PR #$PR is CLOSED but still auto-labeled with a live branch (on repos with a promotion flow this means it was promoted upstream and pushes to this branch update the upstream PR's diff). The checked-out branch is the loop's working surface, not a dead PR — address the feedback as usual."
            fi
            echo "CONSTRAINTS: you have NO GitHub credentials — nothing you run can push or post, and you must NOT run gh, git fetch or git push at all (an anonymous fetch might succeed on a public repo; do not try it — the checked-out tree is the one to work on). Network access IS available inside your sandbox for package downloads and test fixtures (install into the project venv if a tool is missing; keep installs minimal, never install from a git+ URL — an editable VCS install clones a repo into the venv, and a nested checkout fails the run — and do not edit dependency files the task does not call for), but nothing you do can push to or post on GitHub. Edit the working tree on the checked-out branch only — do NOT create or switch branches or check out other commits. Do NOT create, edit or delete files that later automated runs execute or load as configuration: anything under .github/ (workflows, which the machine account has no permission to push, and composite actions), agent and git configuration at any depth (CLAUDE.md, CLAUDE.local.md, AGENTS.md, .claude/, .mcp.json, .codex/, .agents/, .gitmodules, .husky/), and build and dependency configuration at any depth (pyproject.toml, setup.py, setup.cfg, uv.lock, uv.toml, .python-version, requirements*.txt, package.json, and the npm, pnpm and yarn lockfiles and configuration files). The landing refuses the whole bundle, so every commit of the run is lost; if the task needs such a change, stop and say so in your final message so a maintainer makes it from their machine. Committing locally is unnecessary but harmless (local commits land too); a deterministic workflow step commits leftover edits, and the workflow's landing job then pushes the branch (which re-runs CI) and posts your final message and the re-review request for you. $verify"
            if [ -n "${CONFLICTS:-}" ]; then
              echo "MERGE CONFLICT RESOLUTION — do this FIRST, before the task below. A merge of origin/$SYNC_BASE into this branch is already IN PROGRESS in your working tree and conflicts in these files:"
              sed 's/^/  /' <<<"$CONFLICTS"
              [ -n "${SYNC_APPEND:-}" ] && echo "$SYNC_APPEND"
              echo "Resolve every conflict by editing those files, preserving BOTH sides' intent — the base side is other people's merged work, so never resolve by discarding it wholesale. Local git is available and useful here (git status, git diff, git log, git add <file>); the GitHub-facing commands the CONSTRAINTS above forbid (gh, git fetch, git push) stay forbidden, and you must NOT run git merge, git rebase or git checkout of any ref — that would strand the in-progress merge. After resolving each file you MUST stage it with git add <file>: the landing step FAILS the run on any path still unmerged in the index (that index check is what catches binary and modify/delete conflicts, which have no markers), and on any surviving conflict marker — so leaving either is strictly worse than resolving and staging. Once resolved, treat the MERGED tree as the code you are working on: re-run the relevant tests against it, not against the pre-merge state."
            elif [ -n "${MERGE_SHA:-}" ] && [ -n "${SYNC_APPEND:-}" ]; then
              # Clean merge: the repo-specific merge rule still applies (the
              # fork's is about a NON-conflicting CHANGELOG mis-merge).
              echo "BASE MERGE NOTE: a workflow step already merged origin/$SYNC_BASE into this branch before you started (a clean merge, no conflicts). Review that merge result against the following before the task below, and fix it in the working tree if it is off:"
              echo "$SYNC_APPEND"
            fi
            echo "Address the feedback thoroughly — including minor and explicitly non-blocking suggestions. Leave unaddressed only what you genuinely disagree with or is out of scope, and say why in your final message."
            echo "ENDING CONTRACT: your final message MUST start with a single conventional-commit summary line for your changes (it becomes the commit subject), then a blank line, then a body listing what you addressed and anything you deliberately declined with rationale (it is posted as a comment). If nothing needs changing, leave the tree untouched and explain why. If the prompt has a REVIEW THREADS section, end the body with ONE final line of exactly the form RESOLVED-THREADS: <thread-id> <thread-id> ... (all ids on that same line, space-separated) naming the OPEN threads (their thread-id values from that section) whose feedback you FULLY addressed in code this round — or RESOLVED-THREADS: none. Never list a thread you declined, only partly addressed, or answered with rationale instead of a change: the workflow resolves exactly the threads on that line, on your word, and only once your changes have landed."
            echo ""
            # RECENT PR COMMENTS (filtered, anchored on the newest review
            # round, bounded tail) and REVIEW THREADS (by state, OPEN with
            # thread ids) — written by the pr-feedback-context composite
            # step above; the filter and renderer rationale lives there.
            cat "$RUNNER_TEMP/codex-feedback.md"
          } >"$RUNNER_TEMP/codex-context.md"
          # The review feedback IS this round's task, and the verdict
          # comment that triggered the run guarantees at least one PR
          # comment exists — so with outright fetch failures failing the
          # composite step with the real error in the log (here and in the
          # dev-verb compose alike), an empty feedback section can only be a
          # fetch that returned wrong data while exiting 0. Proceeding
          # would spend the round on a feedback-less prompt and conclude the
          # loop on missing context; fail loud instead — a codexprep failure
          # routes into the existing error surfacing and the round refund.
          # NOT `sed … | grep -q` (the original shape): grep -q exits on
          # its first match and closes the pipe, sed then fails flushing
          # what it still had buffered ("couldn't flush stdout: Broken
          # pipe"), and under pipefail the pipeline's status is sed's — so
          # a feedback section large enough to outrun grep read as "no
          # comments" and failed a healthy round (inspect_ai#428 round 7,
          # 2026-09-09: 55 comments, long review). Same SIGPIPE hazard the
          # head -c note below already avoids; extract to a file, then
          # grep the file — no writer ever sees a closed pipe.
          sed -n '/^RECENT PR COMMENTS/,/^REVIEW THREADS/p' \
              "$RUNNER_TEMP/codex-context.md" >"$RUNNER_TEMP/codex-feedback-section.md"
          if ! grep -q '^--- ' "$RUNNER_TEMP/codex-feedback-section.md"; then
            echo "::error::review-feedback section is empty — either the fetch returned no comments (transient gh/API failure?) or the machine-comment filter removed every one (a review posted in a shape the filter drops? see the jq in the pr-feedback-context composite) — failing the round rather than running codex without the feedback"
            exit 1
          fi
          # Cap + de-fang from the completed scratch file, NOT in one pipeline
          # with the writers above: with the group piped straight into head -c,
          # the cap being hit mid-group leaves the next writer (a plain echo)
          # facing a closed pipe — SIGPIPE kills the group subshell (or, with
          # SIGPIPE ignored, set -e catches the write error) and pipefail fails
          # the step, data-dependently. Reading a file, no writer ever sees a
          # closed pipe. (The sed is belt-and-braces with the commit step's
          # output de-fang: the embedded comments include the reviewer's
          # verdict comments, and a marker substring codex never sees is one
          # it cannot echo; the substitutions are length-neutral. The
          # review-comment anchor marker and the codex reviewer's engine
          # footer are in the list too: the pr-feedback-context composite has
          # already anchored on them, and a fix summary that echoed either
          # would be a false anchor for a later round on this PR.)
          head -c 120000 "$RUNNER_TEMP/codex-context.md" \
            | sed -E -e 's/claude-review-(summary|verdict|comment)/claude-review \1/g' \
                     -e 's/engine: codex/engine  codex/g' \
                     -e 's/auto-(handoff|review-rounds|review-head|fix-attempts)/auto \1/g' >"$RUNNER_TEMP/codex-prompt.md"

      - name: Run Codex fix
        id: codexfix
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          safety-strategy: unprivileged-user
          codex-user: codex
          model: ${{ inputs.codex_model }}
          effort: ${{ inputs.codex_effort }}
          permission-profile: workspace_net
          # As the Claude fix step's allowed_bots: the reviewer bot, or the
          # machine account's App login posting a codex verdict.
          allow-bot-users: ${{ format('claude,{0}', env.TRUSTED_LOGINS) }}
          prompt-file: ${{ runner.temp }}/codex-prompt.md
          output-file: ${{ runner.temp }}/codex/codex-final.md

      # FIRST step after codex had write access to the tree, on every path
      # (always(): success, failure, cancelled): take .git back from the
      # codex user, refuse a redirected git dir (.git/commondir, symlinked
      # .git), and restore the pre-codex .git/config that `Create codex user`
      # snapshotted (design/codex-engine.md → Hook-safe landing). Runs BEFORE
      # the guard, the commit step, the manifest composer and emit-landing so
      # that every later git-running step reads a clean config regardless of
      # how codex ended; each of them is gated on this step having SUCCEEDED
      # (`== 'success'`, never `!= 'failure'`: a reclaim cancelled mid-run
      # must skip every later git call). Runs no git itself.
      - name: Reclaim workspace from codex
        id: codexreclaim
        if: always() && steps.codexuser.outcome == 'success'
        uses: meridianlabs-ai/agents/.github/actions/reclaim-codex-workspace@main

      # Bring codex's final message across the user boundary ONCE, right
      # after the reclaim's kill loop has ended every codex process: the
      # output file sits in the codex-owned $RUNNER_TEMP/codex, whose entry
      # codex could swap for a symlink, and every reader below runs as the
      # runner. The composite opens it with O_NOFOLLOW, refuses anything
      # but a regular codex-owned file, and copies it to
      # $RUNNER_TEMP/codex-final.md (runner-only); the commit subject, the
      # RESOLVED-THREADS parse and the summary read that copy and nothing
      # else under the codex-owned dir (finding 4628447). A refused or
      # missing message leaves no copy and the readers fall back to their
      # defaults (default subject, the no-final-message placeholder).
      # Gated like the guard; runs no git. continue-on-error: the copy is
      # best-effort like the parse — a failure here (a misconfigured owner,
      # an unwritable destination) must leave no copy, not strand the
      # commit behind the readers' implicit success() gate.
      - name: Import codex final message
        id: codexfinal
        continue-on-error: true
        if: steps.codexfix.outcome == 'success' && steps.codexreclaim.outcome == 'success'
        uses: meridianlabs-ai/agents/.github/actions/import-codex-final@main

      # Token split for the codex run: the CLI's step-log "tokens used" is one
      # blended number (non-cached input + output), so this reads the session
      # rollout codex wrote under its CODEX_HOME and puts input / cached /
      # output / reasoning counts and the model that served in the job
      # summary — the codex counterpart of the Claude job's Model provenance
      # step. Runs right
      # after codex, before the commit step, so a commit failure can't hide
      # the spend. Best-effort: the script exits 0 on every path, and
      # continue-on-error makes that structural — a failure here must never
      # trip the commit step's implicit success() gate and strand the work.
      - name: Codex usage
        if: always()
        continue-on-error: true
        uses: meridianlabs-ai/agents/.github/actions/codex-usage@main
        with:
          requested-model: ${{ inputs.codex_model }}
          requested-effort: ${{ inputs.codex_effort }}

      # Unresolved-merge guard (shared composite): the commit step's `git add
      # -A` would happily stage conflict markers and `git commit` would then
      # produce a valid merge commit containing them, so this check is the
      # only thing between a half-resolved merge and the PR branch. A separate
      # step so the commit step below is skipped, not entered, on failure;
      # the Surface step reads this step's outcome, and so do the manifest
      # composer and emit-landing (read-only unless this step SUCCEEDED):
      # codex may commit locally, and a commit over staged-but-still-marked
      # paths completes the merge and moves HEAD past the start SHA, so the
      # push must key on this step, not on ancestry alone — as the old Land
      # codex fix step did. Also gated on the reclaim: a refused (redirected)
      # git dir must not be read at all.
      - name: Guard against an unresolved merge (codex)
        id: codexguard
        if: steps.codexfix.outcome == 'success' && steps.codexreclaim.outcome == 'success'
        uses: meridianlabs-ai/agents/.github/actions/unresolved-merge-guard@main
        with:
          conflicts: ${{ steps.sync.outputs.conflicts }}

      # Codex cannot run gh, so the review threads it reports as fully
      # addressed (the RESOLVED-THREADS: line of its final message) travel to
      # the land job as the manifest's `resolve_threads`, resolved there on
      # its word after the push. This step only PARSES the line (resolve:
      # "false" — the job token could not resolve a thread anyway): the
      # shared composite's tolerant parse/strip, with its `ids` output
      # (shape-checked `PRRT_…`) for the composer, which attaches them only
      # after a commit of real changes (a no-change or merge-only round
      # addressed nothing, whatever the line says); `land` intersects them
      # with the PR's own threads before resolving, so a hallucinated or
      # foreign id is skipped there. Also writes the final message with the
      # line stripped — it is machine input, not summary — for the commit
      # step's summary. Runs no git; gated on the guard so a codex path that
      # lands nothing parses nothing.
      - name: Parse review threads codex reported as addressed
        id: codexthreads
        if: steps.codexguard.outcome == 'success'
        uses: meridianlabs-ai/agents/.github/actions/resolve-reported-threads@main
        with:
          token: ${{ github.token }}
          repo: ${{ github.repository }}
          pr: ${{ inputs.pr_number }}
          final-message: ${{ runner.temp }}/codex-final.md
          stripped: ${{ runner.temp }}/codex-final.stripped.md
          resolve: "false"

      # The commit half of what used to be "Land codex fix": commit whatever
      # codex left in the tree, then write the de-fanged summary comment into
      # the landing directory for the land job to post — as the plain summary
      # of a round that committed changes (the manifest then owes the
      # `@review`), or as the body of the hand-off when nothing changed or
      # only the runner's base merge did (the manifest's composer names it
      # `handoff_body_file`; the land job prepends the marker). No push and
      # no credential here — the push is the land job's, from the bundle
      # emit-landing writes at the end of this job. First git-running step
      # after codex had write access to the workspace: the reclaim step above
      # already took .git back and restored the pre-codex .git/config (remote
      # URLs, credential/http keys, filter drivers, fsmonitor, hooksPath —
      # anything codex wrote there is gone), and this step trusts nothing
      # else under .git (design/codex-engine.md → hook-safe landing): the git
      # dir is pinned by env (GIT_DIR/GIT_COMMON_DIR/GIT_WORK_TREE), so a
      # .git/commondir file could not redirect git to a config codex owns
      # even if the reclaim's refusal had missed it (gitrepository-layout(5):
      # that file sets GIT_COMMON_DIR unless the env already does), and the
      # GIT_CONFIG_* env below re-pins the two things a config restore cannot:
      # hooks live as FILES in .git/hooks, so hooksPath points at an empty,
      # runner-only path; and the index may carry the fsmonitor extension, so
      # fsmonitor is off. The reclaim already moved .git/hooks aside and
      # appended the same two keys to the restored config for every later
      # step; the env pin here is belt and braces on the step that commits.
      # GIT_CONFIG_GLOBAL skips the runner's ~/.gitconfig as well: codex is
      # in the runner group, and a group-writable home file would sit outside
      # the restore (the hosted image ships it runner-only; this makes that
      # structural — identity for the commit is in the repo config the
      # reclaim restored).
      - name: Commit codex fix
        id: codexcommit
        if: steps.codexguard.outcome == 'success'
        env:
          PR: ${{ inputs.pr_number }}
          ROUND: ${{ needs.gate.outputs.round }}
          MENTION: ${{ needs.gate.outputs.mention }}
          OUT: ${{ runner.temp }}/codex-final.stripped.md
          # The copy `Import codex final message` verified, never the
          # codex-owned output file (finding 4628447).
          FINAL: ${{ runner.temp }}/codex-final.md
          IDS: ${{ steps.codexthreads.outputs.ids }}
          DIR: ${{ runner.temp }}/landing
          START_SHA: ${{ steps.base.outputs.sha }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          GIT_DIR: ${{ github.workspace }}/.git
          GIT_COMMON_DIR: ${{ github.workspace }}/.git
          GIT_WORK_TREE: ${{ github.workspace }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: ${{ runner.temp }}/no-hooks
          GIT_CONFIG_KEY_1: core.fsmonitor
          GIT_CONFIG_VALUE_1: "false"
        run: |
          set -euo pipefail
          # System tools only, whatever GITHUB_PATH prepended: `Create codex
          # user` refused any codex-writable job PATH entry before codex ran,
          # and the reclaim re-checked; this pin is belt and braces on the
          # step that commits (design/codex-engine.md → Runner-side search
          # path).
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          mkdir -p "$DIR"
          # MERGE_HEAD too: a conflict resolution staged byte-identical to
          # HEAD ("ours" on every hunk) leaves status clean while the merge
          # is still in progress — commit anyway so the merge completes,
          # HEAD moves past START_SHA, and the landing lands it.
          # --ignore-submodules=dirty: never spawn `git status` inside an
          # embedded repo (is_submodule_modified) — its nested .git/config
          # is codex-writable and outside the restore and the pins. The
          # reclaim step already refuses a nested repo codex added; this is
          # belt and braces, and `dirty` (unlike `all`) still reports a
          # changed gitlink pointer. `git add -A` below cannot be pinned the
          # same way, which is why the refusal is the primary defence.
          if [ -n "$(git status --porcelain --ignore-submodules=dirty)" ] || git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            # || true inside the substitution: without it a missing/unreadable
            # $FINAL fails the pipeline and set -e kills the step before the
            # fallback is reached — the fallback would only ever cover an
            # empty first line.
            subject=$(head -n1 "$FINAL" 2>/dev/null | cut -c1-120 || true)
            [ -n "$subject" ] || subject="codex: address review feedback on PR #$PR"
            git add -A
            git commit --quiet -m "$subject" -m "Co-Authored-By: Codex <noreply@openai.com>"
          fi
          # Landable work = HEAD moved since round start, not just a dirty
          # tree: the prompt calls local commits unnecessary but they are
          # possible, and a status-only check would silently discard them
          # with the runner. emit-landing bundles START_SHA..HEAD at the end
          # of the job and the land job pushes it to the PR head branch
          # (refusing a HEAD that does not descend from START_SHA — loud, not
          # lossy); here the outcome shapes the summary's first line, and
          # the composer reads the two outputs to pick hand-back or hand-off.
          committed=""
          merge_only=""
          if [ "$(git rev-parse HEAD)" != "$START_SHA" ]; then
            committed=1
            # HEAD still exactly the runner's clean base merge: codex changed
            # nothing (any commit above would have moved it). The push itself
            # is what restores CI (a computable merge ref); a re-review would
            # only re-read the same code codex just declined to change, so
            # this round is treated like a no-change round below and
            # concludes with the hand-off. That also keeps the gate's
            # no-progress escalation honest: a re-review here would let the
            # moved tip read as progress on every round the base moves.
            [ -n "${MERGE_SHA:-}" ] && [ "$(git rev-parse HEAD)" = "$MERGE_SHA" ] && merge_only=1
            echo "committed $(git rev-parse --short HEAD) on the branch${merge_only:+ (base merge only)} — the land job pushes it"
          fi
          echo "committed=$committed" >>"$GITHUB_OUTPUT"
          echo "merge_only=$merge_only" >>"$GITHUB_OUTPUT"
          # One body either way, de-fanged (it posts from a write-access
          # account; the gate matches the loop's verdict/handoff markers with
          # plain substring contains(), so codex QUOTING one — likely, its
          # prompt embeds the reviewer's verdict comments verbatim — would
          # forge a verdict or suppress an owed hand-back: break those
          # substrings too). Committed codex changes: a plain summary, and
          # the manifest owes the `@review`. No changes, or the base merge
          # alone: the round is concluded — this body becomes the hand-off,
          # and the land job leads it with the auto-handoff marker (so the
          # marker is never in agent-derived text here). The headers say
          # "committed", not "pushed": this step cannot know the push
          # happened (emit-landing may still lose the bundle and drop the
          # hand-back, and the land job posts the body either way), so the
          # wording claims only what is true here. OUT is the stripped copy
          # the parse step wrote — falling back to FINAL, the imported copy of
          # codex's message unstripped (never the codex-owned output file;
          # finding 4628447), when that copy is missing (the composite warned; a
          # read needs no write permission, and a stray RESOLVED-THREADS
          # line in a comment beats the summary going unread —
          # inspect_ai#428's ten blind rounds). The list here includes the
          # review-comment anchor marker and the codex reviewer's engine
          # footer: this body posts as marvin, a machine author the
          # review-fix rounds' anchor selection trusts, so a summary echoing
          # either would be taken for the newest review by the next fix
          # round on the same PR. The land job's `defang` (land/lib.sh)
          # repeats the trigger and marker rules (two layers, so neither can
          # drift to zero) but deliberately NOT the footer: `land` is shared
          # with claude-review.yml, which posts the codex reviewer's own
          # footer through it as the anchor. So the footer sed lives only
          # here and in the Claude-path bodies below (the relay's
          # agent-summary.md and the Surface step's embedded summary); keep
          # the three copies in step.
          src="$OUT"; [ -f "$src" ] || src="$FINAL"
          n_ids=$(wc -w <<<"${IDS:-}" | tr -d ' ')
          {
            if [ -n "$committed" ] && [ -z "$merge_only" ]; then
              printf '🤖 auto (codex, round %s): changes committed — summary below. %s review thread(s) codex reported as fully addressed are resolved when this round lands; the rest stay open.\n\n' "$ROUND" "$n_ids"
            else
              ping=""; [ -n "$MENTION" ] && ping="@$MENTION "
              printf '%sauto (codex, round %s): no code changes this round%s — summary below. No review threads were resolved (nothing changed); please resolve any that are settled.\n\n' "$ping" "$ROUND" "${merge_only:+ (the base-branch merge from the workflow was committed)}"
            fi
            sed -E -e 's/@(review|claude|auto)/`\1`/g' \
                   -e 's/claude-review-(summary|verdict|comment)/claude-review \1/g' \
                   -e 's/engine: codex/engine  codex/g' \
                   -e 's/auto-(handoff|review-rounds|review-head|fix-attempts)/auto \1/g' \
                   "$src" 2>/dev/null || echo "(codex produced no final message)"
          } >"$DIR/codex-comment.md"
          # GitHub caps comment bodies at 65,536 characters and codex's final
          # message is unbounded; a post failing there would lose the summary
          # for work that already landed. Truncate with a note instead —
          # cutting the de-fanged body can't resurrect a trigger or marker
          # (the sed removed the @ / split the substrings, and truncation
          # only drops trailing bytes). 59,000, not 60,000: the land job's
          # own de-fang re-caps at 60,000, and the note below must fit under
          # THAT cap or the second truncation would drop it.
          if [ "$(wc -c <"$DIR/codex-comment.md")" -gt 59000 ]; then
            head -c 59000 "$DIR/codex-comment.md" >"$DIR/codex-comment.trunc"
            printf '\n\n_[truncated: codex output exceeded the comment size cap]_\n' >>"$DIR/codex-comment.trunc"
            mv "$DIR/codex-comment.trunc" "$DIR/codex-comment.md"
          fi
          echo "codex summary: $(wc -c <"$DIR/codex-comment.md") bytes — posted by the land job."
      # ---- end Codex engine ---------------------------------------------------

      # Surface agent errors: a failed step anywhere on the path (the commit
      # step is deterministic, so a completed codex run cannot strand its
      # edits the way the Claude job's agent can). This job cannot post
      # the ⚠️ itself any more (the comment must come from an account whose
      # posts are read, and this job holds no such token): the message is
      # written to a file the landing manifest carries as `error` with
      # fail_run true, and the LAND job posts it — de-fanged, as the machine
      # account — and fails the run AFTER everything else landed. So this step
      # exits 0 on every path: the red X is the land job's.
      - name: Surface agent errors
        id: surface
        if: always()
        env:
          BASE_OUTCOME: ${{ steps.base.outcome }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          SYNC_CONFLICTS: ${{ steps.sync.outputs.conflicts }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          CODEXFEEDBACK_OUTCOME: ${{ steps.codexfeedback.outcome }}
          CODEXPREP_OUTCOME: ${{ steps.codexprep.outcome }}
          CODEXCOMPOSE_OUTCOME: ${{ steps.codexcompose.outcome }}
          CODEXUSER_OUTCOME: ${{ steps.codexuser.outcome }}
          CODEXHOME_OUTCOME: ${{ steps.codexhome.outcome }}
          CODEX_OUTCOME: ${{ steps.codexfix.outcome }}
          CODEXRECLAIM_OUTCOME: ${{ steps.codexreclaim.outcome }}
          CODEXGUARD_OUTCOME: ${{ steps.codexguard.outcome }}
          CODEXCOMMIT_OUTCOME: ${{ steps.codexcommit.outcome }}
          # The gate job's lookup (trusted: computed as marvin before any PR
          # code ran); the land job de-fangs the body it lands in anyway.
          MENTION: ${{ needs.gate.outputs.mention }}
          ERROR_FILE: ${{ runner.temp }}/agent-error.md
        run: |
          set -uo pipefail
          rm -f "$ERROR_FILE"
          err=""
          # The checkout, the persisted-credential assertion or the SHA step
          # failed: nothing else ran. The SHA step has no always(), so a
          # failed checkout OR a tripped assertion (the composite exits 1)
          # leaves it SKIPPED, not failed — test for anything but success,
          # and name all three causes so a tripped security invariant is not
          # read as a checkout hiccup and blindly re-triggered.
          if [ "${BASE_OUTCOME:-}" != "success" ]; then
            err="checking out the PR branch, verifying no credential was persisted in the workspace, or reading the branch SHA failed before the agent started — see the job logs for which; no fix was attempted this round. Re-trigger to retry only if it was the checkout or the SHA read; a persisted credential is a workflow bug, not a transient."
          fi
          # The base-branch sync died before the agent started (a transient
          # gh/fetch error, or its own loud non-conflict merge failure). Every
          # downstream step is SKIPPED, not failed, so no other branch below
          # fires; the round the gate recorded is refunded by the land job
          # (the agent never launched, nothing lands) — without this the
          # failure is a silent stall with the board at Agent.
          if [ -z "$err" ] && [ "${SYNC_OUTCOME:-}" = "failure" ]; then
            err="the base-branch sync step failed before the agent started (a transient gh/fetch error, or a base merge that failed without content conflicts — see the job logs); no fix was attempted this round. Re-trigger to retry."
          fi
          # Provisioning died before the agent started: same shape as the sync
          # failure above — the agent steps are SKIPPED and without this the
          # job is a silent red with the board parked at Agent. Unlike the
          # sync failure (which exits before merge_sha is written), the
          # runner's clean base merge, if there was one, is still above the
          # start SHA here, so emit-landing bundles it and the land job
          # pushes it — re-running CI — and posts the re-review request, even
          # though no fix was attempted. That is the right outcome (the
          # branch stays current, and the re-run finds nothing left to merge,
          # so a deterministic failure repeats this comment at most once more
          # and then stops rather than looping), but the wording below says
          # so instead of claiming nothing moved. A DETERMINISTIC cause is
          # named too: the PR's own dependency change (a pyproject.toml that
          # no longer installs) now fails provisioning on every trigger —
          # before 2026-09-09 the Claude engine would have attempted that
          # class of fix; accepted, it mirrors the dev agent's and reviewer's
          # fatal stance, but "re-trigger" is wrong advice for it, so the
          # message says to fix it by hand. EXCEPT on the conflict path
          # (SYNC_CONFLICTS non-empty): there the provisioning step is
          # continue-on-error, the round ran static-only with the failure
          # spelled out in codex's prompt, and the later clauses judge what
          # it did — so a failure there is a log warning, not an error, and
          # "re-trigger to retry" (wrong advice for a conflicted dependency
          # file, which fails identically every time) is never given for it.
          if [ -n "${SYNC_CONFLICTS:-}" ]; then
            if [ "${SETUP_OUTCOME:-}" = "failure" ]; then
              echo "::warning::environment provisioning failed on a conflicted round (conflicts in: $(tr '\n' ' ' <<<"$SYNC_CONFLICTS" | sed 's/ *$//')); the fix agent ran static-only and was told so."
            fi
          elif [ -z "$err" ] && [ "${SETUP_OUTCOME:-}" = "failure" ]; then
            err="environment provisioning (the uv dev-install, run as the codex user) failed before the fix agent started — a transient dependency-download/network error, the project not dev-installing on a bare runner, a dependency file the base merge touched, or this PR's own dependency change no longer installing (those fail identically on every trigger: fix it by hand — check the job logs); no fix was attempted this round, though the runner's clean base merge, if there was one, was still landed on the branch. Re-trigger if it looks transient."
          fi
          if [ -z "$err" ] && [ "${CODEXFEEDBACK_OUTCOME:-}" = "failure" ]; then
            err="fetching the PR thread for the codex prompt failed before the agent started (a gh/API error that outlasted three attempts — see the job logs); no fix was attempted this round, and the round is refunded. Re-trigger to retry."
          fi
          if [ -z "$err" ] && [ "${CODEXPREP_OUTCOME:-}" = "failure" ]; then
            err="the codex workspace-preparation step failed before the agent started — no fix was attempted this round (see the job logs)."
          fi
          if [ -z "$err" ] && [ "${CODEXCOMPOSE_OUTCOME:-}" = "failure" ]; then
            err="composing the codex prompt failed before the agent started — no fix was attempted this round (an empty review-feedback section, or see the job logs)."
          fi
          # A failed codex-user setup SKIPS the codex step, so it needs its
          # own check or the failure is a silent red job.
          if [ -z "$err" ] && [ "${CODEXHOME_OUTCOME:-}" = "failure" ]; then
            err="resetting the codex home after provisioning failed before the agent started — processes were still running as codex after repeated kills (a provisioning survivor?) or the home could not be re-created (see the job logs); nothing was attempted."
          fi
          if [ -z "$err" ] && [ "${CODEXUSER_OUTCOME:-}" = "failure" ]; then
            err="the codex user setup failed before the agent started — no fix was attempted this round (a job PATH entry inside the workspace or writable by the codex user — nothing in this job adds to the job PATH before it, so most likely a runner-image change — or adduser/usermod failing; see the job logs)."
          fi
          if [ -z "$err" ] && [ "${CODEX_OUTCOME:-}" = "failure" ]; then
            err="the codex fix step failed (missing OPENAI_API_KEY, or a codex-action error — see the job logs)."
          fi
          # A reclaim that did not succeed SKIPS the guard, the commit step
          # and every later git call (the manifest composer skips git and
          # emit-landing runs read-only whenever the guard did not succeed,
          # which a skipped guard is): on this path .git is still the
          # codex-written one (a refusal, a failed restore, or a job cancel
          # that landed mid-reclaim — outcome `cancelled`, not `failure`, with
          # the kill/chown/restore only partly done). `!= success` mirrors
          # the other step gates; the codexuser test keeps the Claude path's
          # `skipped` reclaim from tripping it.
          if [ -z "$err" ] && [ "${CODEXUSER_OUTCOME:-}" = "success" ] && [ "${CODEXRECLAIM_OUTCOME:-}" != "success" ]; then
            err="codex finished but the workspace could not be reclaimed from it (reclaim step outcome: ${CODEXRECLAIM_OUTCOME:-unknown}) — processes were still running as codex after repeated kills, .git is not a plain directory or a .git/commondir redirect exists, codex left an embedded git repository in the tree (a git init or git worktree add under the checkout — the false-alarm case in design/codex-engine.md → Hook-safe landing), the pre-codex git config could not be restored, or the job was cancelled mid-reclaim (see the job logs); nothing was landed this round. Inspect the codex run's transcript before re-triggering."
          fi
          # A failed guard SKIPS the commit step, so it needs its own check.
          # "nothing was landed" holds because the manifest composer and
          # emit-landing go read-only on a guard that did not succeed: a
          # local commit codex made over the markers is never bundled.
          if [ -z "$err" ] && [ "${CODEXGUARD_OUTCOME:-}" = "failure" ]; then
            err="codex finished but left the base merge unresolved (an unmerged index or surviving conflict markers — see the job logs); nothing was landed. Resolve and stage the conflicts manually, or drop the engine:codex label to use the Claude path."
          fi
          if [ -z "$err" ] && [ "${CODEXCOMMIT_OUTCOME:-}" = "failure" ]; then
            # The guard succeeded on this path, so codex's own local commits
            # (if any) still land through ancestry; only the runner's commit
            # of its leftover edits is lost — say so, rather than "nothing".
            err="codex finished but committing its leftover edits failed — codex's own local commits, if any, still land; its uncommitted edits did not, and its summary could not be composed (see the job logs)."
          fi
          [ -z "$err" ] && { echo "No agent error detected."; exit 0; }
          echo "::error::review-fix run did not complete: $err — the land job posts the note and fails the run."
          # cc the responsible human (gate-derived): without a mention these
          # error reports on agent-authored PRs email nobody.
          cc=""
          [ -n "${MENTION:-}" ] && cc=$(printf '\n\ncc @%s' "$MENTION")
          # Re-trigger advice is `@auto`, NOT `@review`: the review that
          # started this round is already posted, so a fresh `@review`
          # would spend a whole review pass re-deriving the same findings
          # before the loop could act. An `@auto` comment on the PR runs
          # the dev agent straight at the standing review (claude.yml's
          # kickoff-on-existing-PR path), re-applies the label, resets both
          # sticky budgets, and its ending contract posts the `@review`
          # hand-back — so the loop resumes where it stopped (Ransom,
          # 2026-09-09; design/atlas-tracking.md → standing review). Bare
          # `@review` stays the right call only when no usable review
          # exists. The tokens are backticked (the land job's de-fang would
          # backtick them anyway): the stubs' machine-account guard drops
          # this comment before any gate reads it, but a bare token here
          # must not be what that guard is protecting against.
          printf '⚠️ The auto review-fix run did not complete:\n\n> %s\n\nIf this looks transient (model API capacity/overload), resume with an `@auto` comment (e.g. `@auto address the review feedback`) — that re-runs the fix against the review already posted and resets the round budget; a fresh `@review` would only repeat the review. Otherwise it likely needs a human.%s\n' "$err" "$cc" >"$ERROR_FILE"

      # Everything the land job pushes, posts, resolves or moves, as ONE JSON
      # object for emit-landing's manifest-extra (schema:
      # .github/actions/emit-landing/README.md). Body text goes in as files
      # under the landing directory, referenced by name; the manifest itself
      # is DATA the land job validates before acting. This is where the
      # review loop's ENDING CONTRACT is enforced: a round that committed
      # changes owes exactly one of the two hand-backs — `handback: true`
      # (the land job posts `@review`) or a `handoff_body_file` (the land
      # job posts it under the `<!-- auto-handoff -->` marker) — and both or
      # neither is a violation: both are dropped, the manifest's `error`
      # explains the contract (the land job posts it and fails the run), and
      # no stage is set, since nothing hands the round back. Both set is a
      # violation whether or not anything was committed (they contradict
      # each other); neither set is one only when the agent committed —
      # merge-only and no-change rounds are handled below.
      #
      # Claude path: the agent's own `manifest-extra.json` in the landing
      # directory supplies `replies`, `resolve_threads`, `handback` and
      # `handoff_body_file` — those four keys and nothing else: every other
      # manifest field is the workflow's (a `comments` or `issues` entry from
      # the agent would be a posting channel the split closed), so unknown
      # keys are dropped, not merged. Values are normalized rather than
      # passed through: a mistyped field (a string "true", a fractional id,
      # a non-PRRT thread id) would otherwise make the validator refuse the
      # WHOLE manifest and the agent's commits with it — dropping the entry
      # with a warning is the proportionate failure. `resolve_threads` is
      # attached only when the agent committed real changes, the codex
      # path's rule (a round that changed nothing settled nothing); `land`
      # intersects the ids with the PR's own threads before resolving.
      #   agent committed, handback → handback: true, and NO stage: the
      #     re-review is mid-flight, and a card stays at Agent while any
      #     agent of the loop is still to run (one rule for every loop,
      #     design/atlas-tracking.md; Ransom, 2026-09-18 — until then the
      #     hand-back set Review too)
      #   agent committed, handoff  → handoff_body_file, stage: Review (the
      #     hand-off ends the loop and hands the PR to a human)
      #   no agent commit (HEAD at the start SHA, or exactly the runner's
      #     clean base merge — merge-only), handoff → handoff_body_file,
      #     stage: Review (everything remaining declined with rationale —
      #     the replies carry it; a merge-only round lands the merge too)
      #   no agent commit, handback → honored when HEAD moved (merge-only:
      #     the runner's base merge lands and re-runs CI, so the re-review
      #     is owed like any bundled hand-back) or the agent step SUCCEEDED
      #     (the re-review re-reads the same code; the gate's no-progress
      #     check then escalates, as it did when the agent posted the
      #     request itself), and dropped when neither holds: a failed or
      #     skipped step with nothing to land owes no re-review, and
      #     honoring one would let a round that never ran re-arm the loop
      #     (Claude Security 4628734; the land job drops it again from the
      #     trusted side — see the Land step's `allow-no-change-handback`)
      #   no agent commit, neither → the round is CONCLUDED with a hand-off
      #     whose body is the agent's final message (when the run succeeded
      #     and the Surface step found no error): the codex path's rule,
      #     applied when the agent decided nothing — a no-change or
      #     merge-only round re-reviewed would read the same code again,
      #     and on a moving base a merge-only re-review defeats the gate's
      #     no-progress check every round (design/architecture.md → the
      #     backstop's merge-only leak); a hand-off also keeps a round that
      #     gave up from stranding the board at Agent. With an error, the
      #     Surface step's report is the round's only comment (as before).
      # Codex path: codex's final message is the body the commit step wrote;
      # the hand-back rule is decided here from HEAD, exactly as the old
      # `Land codex fix` step did — committed changes: `comments` + handback
      # (+ the parsed RESOLVED-THREADS ids); nothing changed, or the base
      # merge alone: the body becomes the hand-off. A moved HEAD with no
      # summary (the commit step failed after codex's own local commits)
      # owes the re-review anyway — the commits land.
      # `moved` requires ancestry (the same test emit-landing applies before
      # it bundles — a rebased HEAD lands nothing and must owe nothing), and
      # a hand-back is owed on ancestry ALONE, whatever the agent step's
      # outcome: a Claude step that ended `failure` after committing lands
      # those commits and hands back, with the Surface step's error posted
      # alongside — dropping committed work is worse, the push is what
      # re-runs CI, and the ⚠️ says the round failed. emit-landing drops
      # handback, stage, resolve_threads and handoff_body_file again when it
      # drops the bundle, so no bare `@review`, no thread resolution and no
      # completion hand-off posts for a round whose work was lost.
      # Not set -e: a manifest must come out of every path. On the codex path
      # (the ENGINE the gate resolved — not `codexuser.outcome`, which is
      # `skipped`/`failure` when the prep or user-setup step failed and would
      # let those two fall through to the ancestry branch) the git reads are
      # skipped (nothing lands, no hand-back) unless the unresolved-merge
      # guard SUCCEEDED — the same condition emit-landing's read-only takes;
      # claude-auto.yml's composer has the full rationale (the guard is the
      # enforcement point: a failed guard means conflict markers survive in
      # a tree codex may have committed over). Post-codex git, so the git
      # dir is pinned by env like the guard and the commit step (AGENTS.md).
      - name: Compose landing manifest
        id: landing
        if: always()
        env:
          DIR: ${{ runner.temp }}/landing
          EXTRA: ${{ runner.temp }}/landing-extra.json
          PR: ${{ inputs.pr_number }}
          ROUND: ${{ needs.gate.outputs.round }}
          MENTION: ${{ needs.gate.outputs.mention }}
          START_SHA: ${{ steps.base.outputs.sha }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          CODEXGUARD_OUTCOME: ${{ steps.codexguard.outcome }}
          CODEXCOMMIT_OUTCOME: ${{ steps.codexcommit.outcome }}
          CODEX_IDS: ${{ steps.codexthreads.outputs.ids }}
          ERROR_FILE: ${{ runner.temp }}/agent-error.md
          GIT_DIR: ${{ github.workspace }}/.git
          GIT_COMMON_DIR: ${{ github.workspace }}/.git
          GIT_WORK_TREE: ${{ github.workspace }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: ${{ runner.temp }}/no-hooks
          GIT_CONFIG_KEY_1: core.fsmonitor
          GIT_CONFIG_VALUE_1: "false"
        run: |
          set -uo pipefail
          mkdir -p "$DIR"
          extra='{}'
          moved=false
          head=""
          if [ "${CODEXGUARD_OUTCOME:-}" != "success" ]; then
            echo "landing: the codex unresolved-merge guard did not succeed (outcome: ${CODEXGUARD_OUTCOME:-unknown} — a failed prep, user-setup, provisioning, codex or reclaim step skips it); running no git — nothing lands and no hand-back is owed."
          elif [[ "${START_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            head=$(git rev-parse HEAD 2>/dev/null || echo "$START_SHA")
            if [ "$head" != "$START_SHA" ] && git merge-base --is-ancestor "$START_SHA" "$head" 2>/dev/null; then
              moved=true
            fi
          fi
          # Merge-only: HEAD moved, but only to the runner's clean base merge
          # — any agent commit would have moved it further — so the agent
          # committed nothing.
          merge_only=""
          [ "$moved" = "true" ] && [ -n "${MERGE_SHA:-}" ] && [ "$head" = "$MERGE_SHA" ] && merge_only=1
          committed=""
          [ "$moved" = "true" ] && [ -z "$merge_only" ] && committed=1
          have_summary=""
          [ "${CODEXCOMMIT_OUTCOME:-}" = "success" ] && [ -s "$DIR/codex-comment.md" ] && [[ "$PR" =~ ^[0-9]+$ ]] && have_summary=1
          if [ "$moved" = "true" ] && { [ -n "$committed" ] || [ -z "$have_summary" ]; }; then
            extra=$(jq -c '.handback = true' <<<"$extra")
            if [ -n "$have_summary" ]; then
              extra=$(jq -c --argjson n "$PR" '.comments = [{number: $n, body_file: "codex-comment.md"}]' <<<"$extra")
              # One jq builds the array, so an empty or all-filtered list
              # is exactly `[]` (a grep with no match exits 1, and under
              # pipefail its `|| echo '[]'` fallback appended a SECOND
              # array — --argjson then failed and emptied the manifest:
              # review round 1 of #83, the RESOLVED-THREADS: none case).
              ids=$(jq -nc --arg s "${CODEX_IDS:-}" '[$s | split(" ")[] | select(test("^PRRT_[A-Za-z0-9_-]+$"))] | unique')
              [ "$ids" = "[]" ] || extra=$(jq -c --argjson t "$ids" '.resolve_threads = $t' <<<"$extra")
            fi
          elif [ -n "$have_summary" ]; then
            extra=$(jq -c '.handoff_body_file = "codex-comment.md" | .stage = "Review"' <<<"$extra")
          fi
          if [ -s "$ERROR_FILE" ]; then
            extra=$(jq -c --rawfile msg "$ERROR_FILE" '.error = {message: $msg, fail_run: true}' <<<"$extra")
          fi
          printf '%s\n' "$extra" >"$EXTRA"
          echo "landing: moved=$moved committed=${committed:-0} merge_only=${merge_only:-0} $(jq -c 'if .error then .error.message = "<\(.error.message | length) chars>" else . end' <<<"$extra")"

      # Last, always: package the commits above the start SHA and the
      # manifest for the land job. The PR number is the caller's trusted
      # event number (`inputs.pr_number` — `github.event.issue.number` on the
      # reviewer's comment), the SAME value the land job gets (README → Using
      # the pair): the validator pins the manifest's pr_number to it and its
      # branch to that PR's live head ref (the gate's lookup, passed to
      # `land` as pr-head-ref). read-only unless the unresolved-merge guard
      # succeeded (the composer's condition, see its comment; a failed prep,
      # user-setup, provisioning, codex or reclaim step skips the guard): a
      # reclaim that did not succeed skips the guard, and no git may run
      # against a workspace codex still owns; a FAILED guard means conflict
      # markers survive in the tree, and a local commit codex made over them
      # must not be bundled — read-only packages nothing above the start SHA.
      # Either way the manifest still carries the Surface step's error for
      # the land job to post.
      - name: Emit landing manifest
        if: always()
        uses: meridianlabs-ai/agents/.github/actions/emit-landing@main
        with:
          # When the checkout (or the SHA step) failed, `steps.base` is empty
          # and an empty start_sha would be refused at `validate` — and the
          # land composite posts the manifest's error only from a VALIDATED
          # manifest, so the Surface step's checkout-failure message would be
          # lost to the log. With no repo there is nothing to bundle either
          # way; github.sha (always 40 hex; the default-branch head on
          # issue_comment) is a trusted, well-formed placeholder.
          start-sha: ${{ steps.base.outputs.sha || github.sha }}
          branch: ${{ needs.gate.outputs.head_branch }}
          pr-number: ${{ inputs.pr_number }}
          manifest-extra: ${{ runner.temp }}/landing-extra.json
          read-only: ${{ steps.codexguard.outcome != 'success' && 'true' || 'false' }}


  # TRUSTED, last: a fresh runner that checks out nothing and installs
  # nothing. The `land` composite is the whole landing — download, validate,
  # push the bundled commits as marvin (re-running CI), post the codex or
  # no-change summary and the agent's rationale replies, resolve the threads
  # that belong to this PR, post exactly `@review` or the marker-led hand-off,
  # move the stage to Review, post the provenance note, report the agent
  # error and fail the run when it says so — then the round refund. always():
  # a fix job that failed still gets its error posted and its round refunded;
  # with no artifact at all (runner killed mid-agent) the composite fails
  # its download, lands nothing, and says so on the PR. A CANCELLED fix job
  # skips the Land step; its refund follows the same evidence as every
  # other round's (see the refund step).
  #
  # Gated on the gate job having SUCCEEDED, not only on its `act` output: a
  # gate that failed after writing act=fix — `Record round` is the realistic
  # case, one un-retried `gh api` write under set -e — skips the fix job
  # (`needs.fix.result` is `skipped`), so there is no artifact to land, and
  # whether the round was recorded is unknown; landing would post "Landing
  # failed at step(s): download" on the PR for a round that never started,
  # and refunding might write one BELOW the true count (weakening the
  # kill-switch). Neither runs: a red gate job with nothing on the PR, as a
  # Record-round failure was before the split.
  land:
    needs: [gate, fix, fix-codex]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.act == 'fix'
    runs-on: ubuntu-latest
    env:
      # The result and outputs of the ONE fix job the gate's engine selected
      # (the other is `skipped`, with empty outputs): what the steps below
      # gate on.
      AGENT_RESULT: ${{ needs.gate.outputs.engine == 'codex' && needs.fix-codex.result || needs.fix.result }}
      AGENT_OUTCOME: ${{ needs.gate.outputs.engine == 'codex' && needs.fix-codex.outputs.agent_outcome || needs.fix.outputs.agent_outcome }}
      AGENT_SKIPPED: ${{ needs.gate.outputs.engine == 'codex' && needs.fix-codex.outputs.agent_skipped || needs.fix.outputs.agent_skipped }}
    # Every write here is marvin's (the land composite's `token`, the refund's
    # GH_TOKEN); the job token only reads — the artifact, the default branch,
    # the start SHA fetch.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read           # artifact download
    steps:
      # The machine account's token for this job (see the gate job's mint
      # step): scoped to THIS repository and to the landing's writes — the
      # push (contents), the `@review` hand-back or hand-off, the codex
      # summary and the round refund (issues), the review replies and the
      # thread resolutions (pull requests), the stage move (the org's Atlas
      # project). Follow-up issues are refused here (`allowed-issue-repos:
      # ""`), so no other repository is in scope. Revoked when the job ends.
      - name: Mint the machine account's token
        id: mint
        uses: actions/create-github-app-token@v2
        with:
          # `app-id` accepts the App ID or the Client ID; v2 has no client-id input.
          app-id: ${{ secrets.MARVIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
          owner: meridianlabs-ai
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-organization-projects: write

      # Skipped when the fix job was cancelled (claude-auto.yml's land job
      # skips the same way): its usual cause is the concurrency group's
      # arbitrary ordering — a round whose agent never started — and landing
      # it would fail the artifact download and post "Landing failed" on the
      # PR for nothing; a run cancelled by hand mid-agent is skipped too, so
      # its partial commits are not pushed and re-reviewed on the strength of
      # an always(). The step is gated, not the job, so the refund below
      # still runs — and refunds only on the evidence every round needs: the
      # job's own `agent_skipped` output. A job cancelled during checkout,
      # sync or provisioning delivers it (the agent step is `skipped`) and
      # is refunded; one cancelled after the agent step started delivers
      # `false` and keeps its round; a PENDING job cancelled before it
      # started delivers no outputs at all, and unknown keeps its round —
      # one round of slack on a rare concurrency cancellation, not a refund
      # decided by a job that may have run the agent (Claude Security
      # 4628734, review round 1). `skipped` is
      # excluded too — the job-level gate on the gate job's success already
      # rules it out, so the test is belt and braces for the same "no
      # artifact, no agent" shape should the job gate ever loosen.
      - name: Land
        id: land
        if: env.AGENT_RESULT != 'cancelled' && env.AGENT_RESULT != 'skipped'
        uses: meridianlabs-ai/agents/.github/actions/land@main
        with:
          # The machine account (the minted app token), no fallback: the
          # gate already failed when the app secrets were absent (a
          # job-token push would not re-run CI and a job-token `@review`
          # would not trigger the reviewer).
          token: ${{ steps.mint.outputs.token }}
          # The caller's trusted event number — the SAME value emit-landing
          # got: the validator pins the manifest's pr_number to it, and it is
          # where the final report goes when the manifest never validated
          # (missing artifact, tampered manifest).
          pr-number: ${{ inputs.pr_number }}
          # The PR's live head ref, read by the gate (`gh pr view … headRefName`)
          # before any PR code ran: the validator's pin for the manifest's
          # branch — no lookup of its own needed.
          pr-head-ref: ${{ needs.gate.outputs.head_branch }}
          # The branch tip the gate read before any PR code ran (`head`):
          # the run's start, which the fix job's sync required its checkout
          # to be at — so a manifest that carries commits must name exactly
          # it as start_sha, or the validator refuses it before the fetch
          # (finding 4628444, criterion 2).
          start-sha: ${{ needs.gate.outputs.head }}
          # The review-fix manifest never files follow-up issues; an empty
          # allow-list makes the validator refuse any that appear.
          allowed-issue-repos: ""
          # A loop round never labels a PR (issue #138): the round's PR is
          # pinned by pr-number, and `auto` / `engine:*` are a trusted
          # decider's, never the fix agent's — the loop gates accept the
          # machine account as the labeler. An empty list makes the
          # validator refuse any `pr.labels` a manifest carries.
          allowed-pr-labels: "[]"
          # A re-review request on a manifest with NO bundle is honored only
          # when the agent step succeeded (`agent_outcome`, a step outcome
          # the agent can push only toward `failure`): a round that landed
          # nothing and did not complete owes no `@review`, and one that
          # posted would re-arm the loop from a round that never ran — the
          # self-retrigger of Claude Security 4628734, where a bundle-less
          # hand-back rode a refunded round. A bundled hand-back is
          # unaffected: the push is what re-runs CI, whatever the step's
          # outcome. The composer applies the same rule in the fix job; this
          # is the trusted copy.
          allow-no-change-handback: ${{ env.AGENT_OUTCOME == 'success' && 'true' || 'false' }}

      # Infra crashes must not burn review rounds (mirror of claude-auto.yml's
      # attempt refund): the counter increments in the gate job, BEFORE the
      # agent runs, but a round whose agent step was NEVER ENTERED — a sync
      # or provisioning failure that skipped it outright (before the split
      # the round was recorded after those steps; it cannot be any more, so
      # the refund covers it), a failed codex feedback-fetch / prep /
      # user-setup step, or a job cancelled while one of those steps ran
      # (the agent step is `skipped` then too) — attempted no fix. Roll the
      # sticky counter back one. Two conditions: the fix job's
      # `agent_skipped` output is true (both engines' agent steps `skipped`,
      # a step outcome the runner settled before any agent code ran), and
      # the landing pushed nothing (a round whose commits landed keeps its
      # round whatever the agent step's outcome). The job's RESULT is not
      # evidence: a job cancelled after the agent step started ran the
      # agent (its output reads `false` and the round is kept), and a
      # pending job cancelled before it started delivers no outputs at all
      # — unknown, so it keeps its round (one round of slack on a rare
      # concurrency cancellation; the escalation still drops the label and
      # posts, and the reset restores the budget). A step that was entered
      # and then FAILED — the
      # action's bootstrap failure, its actor refusal, a Claude or codex
      # failure during the run, the codex step failing on a missing
      # OPENAI_API_KEY (which used to be refunded; the sandboxed agent can
      # fail its own step too, so the step's outcome cannot decide) — is a
      # round: nothing lands, the Surface error posts, and the count stays,
      # so a persistent cause reaches the cap and a human, not a silent
      # refund loop. Until Claude Security 4628734
      # (2026-09-22) the refund fired on `agent_outcome != success` plus an
      # empty execution file (the retired "launched" step's output), both
      # decided inside the untrusted job after the agent had run: a steered
      # agent that killed
      # the action's process, or truncated the file from a process it left
      # behind, made a completed round read as an infra crash, and a
      # bundle-less hand-back in the same manifest then re-armed the loop
      # on the refunded count without bound. The cost of the narrower rule
      # is that a transient bootstrap failure now spends a round; the cap
      # and the stall check bound spend either way. Never on a FAILED gate
      # (the job gate above): whether `Record round` ever incremented is
      # then unknown, and an unrecorded round refunded would put the count
      # one below the truth — not refunding is the conservative side.
      #
      # NOT serialized: this job is outside the per-PR concurrency group (the
      # gate's comment says why), so this write can interleave with the next
      # run's gate re-recording the same sticky comment. Narrowed, not
      # closed: the step decrements the comment's CURRENT count and keeps
      # its CURRENT head marker instead of writing the gate's stale values,
      # so a record the next gate made in between survives in either order.
      # Only the two read-modify-writes crossing inside one window still
      # leaves the count one off. Accepted: the trigger is rare, the cost is
      # one round of slack in either direction, and an escalation still
      # drops the label and posts — never a silent stall.
      - name: Refund infra-crashed round
        if: >-
          always() && needs.gate.outputs.act == 'fix' &&
          env.AGENT_SKIPPED == 'true' &&
          steps.land.outputs.pushed != '1'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          ROUND: ${{ needs.gate.outputs.round }}
          CAP: ${{ inputs.review_round_cap }}
          MARKER: "<!-- auto-review-rounds -->"
        run: |
          set -uo pipefail
          # The loop's own counter only (TRUSTED_LOGINS), selected as the
          # gate selects it: a marker in another login's comment is never
          # PATCHed (Claude Security 4121983). `--paginate` output is one
          # merged array on current gh, one array per page on older
          # releases; -s plus `.[][]` flattens either.
          trusted=$(jq -cn --arg t "$TRUSTED_LOGINS" '$t | split(",") | map(gsub("^ +| +$"; "")) | map(select(. != ""))')
          cid=$(gh api "repos/$REPO/issues/$PR/comments" --paginate 2>/dev/null \
                  | jq -rs --arg m "$MARKER" --argjson t "$trusted" \
                      '[.[][] | select((.body|contains($m)) and ((.user.login // "") as $l | any($t[]; . == $l)))] | last | .id // empty' 2>/dev/null || true)
          [ -z "$cid" ] && { echo "No counter comment found; nothing to refund."; exit 0; }
          # Re-read the count and the head marker (same strict whole-token
          # parse as the gate's `field`) rather than trusting the gate's
          # values: the next run's gate may have re-recorded since. An
          # absent or unparsable count is 0 and an absent head is none — NOT
          # this run's values: a reset body (escalation or re-engagement)
          # carries neither on purpose, and a late refund writing this run's
          # round and tip back over it would undo the fresh budget and
          # re-arm the no-progress check on the very next verdict. Refunding
          # from 0 stays at 0 (never below), with no head marker, so the
          # next round starts at 1 and records a fresh tip — the reset's
          # promise.
          # field <name> <re> <body>: the value of the body's ONE
          # `<name>:<value>` token. `<name>:` must occur exactly once — every
          # occurrence is counted BEFORE any value is read, so a malformed
          # first token cannot hide behind a valid later one — and the WHOLE
          # value must match <re> up to the format's own delimiter,
          # whitespace or the end (`rounds: N (cap …`, `auto-review-head:SHA
          # -->`), so `10oops`, `10.5` and a suffixed SHA are malformed, not
          # 10, 10 and a tip. Empty when absent, malformed or repeated.
          field() {
            local name="$1:" body="$3" stripped after re
            stripped=${body//"$name"/}
            [ $(( (${#body} - ${#stripped}) / ${#name} )) -eq 1 ] || return 0
            after=${body#*"$name"}
            re="^[[:space:]]*($2)([[:space:]]|\$)"
            [[ "$after" =~ $re ]] || return 0
            printf '%s' "${BASH_REMATCH[1]}"
          }
          # Only a body that was actually READ gets the absent-is-0 reading:
          # a failed GET is not an absent count, and zeroing the counter on
          # it would erase the budget and the no-progress baseline. Skip the
          # refund instead — one round of slack, the accepted cost here.
          if ! mbody=$(gh api "repos/$REPO/issues/comments/$cid" --jq '.body' 2>/dev/null); then
            echo "::warning::could not read counter comment $cid on #$PR; not refunding (the count stays as recorded — one round of slack, never a reset)."
            exit 0
          fi
          cur=$(field rounds '[0-9]{1,9}' "$mbody")
          cur=$((10#${cur:-0}))
          head=$(field auto-review-head '[0-9a-f]{40}' "$mbody")
          prev=$(( cur > 0 ? cur - 1 : 0 ))
          body="$MARKER
          🤖 auto review rounds: $prev (cap $CAP). (one round refunded — the fix agent never ran and nothing landed: infrastructure, not the fix)"
          [ -n "$head" ] && body="$body
          <!-- auto-review-head:$head -->"
          gh api -X PATCH "repos/$REPO/issues/comments/$cid" -f body="$body" --silent || true
          echo "Refunded round: counter $cur -> $prev (this run was round $ROUND)."
