name: Claude Auto Review (reusable)

# @auto Phase 2/3: the review -> fix loop and human handoff. A caller stub
# triggers this on `issue_comment` when the automated reviewer posts its marked
# summary comment on an `auto`-labeled PR. The dev agent (as the machine
# account) addresses the feedback, pushes, and re-requests review — closing the
# loop. When it finds nothing to fix, it hands off to a human (it NEVER merges).
# Bounded by review_round_cap; at the cap it drops the `auto` label (the
# kill-switch) and pings a human.
#
# Why issue_comment, not pull_request_review: pull_request_review resolves
# workflows from the PR's base branch, so it never fires on a pristine-base fork
# (the inspect_ai fork). issue_comment resolves from the default branch and
# fires everywhere — one mechanism for all repos. The reviewer marks its summary
# comment (<!-- claude-review-summary -->) so this keys on it; @auto then reads
# the actual review + inline findings via the API.
#
# Only the automated reviewer's comments drive the loop (reviewer_login); the
# `auto` label authorizes; cross-repo (fork) PRs are skipped (the agent checks
# out and runs PR head code under MARVIN_TOKEN — don't do that for untrusted
# forks). Shares the per-PR `concurrency` group with claude-auto.yml so the
# CI-fixer and review-fixer never push to the same branch at once.

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      comment_author:
        description: Login that posted the triggering comment (github.event.comment.user.login).
        required: true
        type: string
      reviewer_login:
        description: Login of the automated reviewer whose marked summary comments drive the loop.
        required: false
        type: string
        default: "claude[bot]"
      auto_label:
        required: false
        type: string
        default: "auto"
      review_round_cap:
        description: >-
          Max review -> fix rounds before escalating to a human. This is the
          hard ceiling on a *productive* loop; a separate no-progress check
          (below) escalates earlier if a fix round pushes no new commit.
        required: false
        type: number
        default: 10
      handoff_mention:
        description: >-
          GitHub login to @-mention on convergence/escalation handoff. Empty
          (default) derives the originating human from the PR's "Fixes/Closes
          #N" linked-issue author; bots are skipped.
        required: false
        type: string
        default: ""
      anchor_repo:
        description: >-
          Repo whose issues this repo's claude/issue-N-* branch numbers
          reference when the same-named branch also exists THERE (the
          companion convention — e.g. ts-mono sets meridianlabs-ai/inspect_ai).
          Mention derivation resolves companion branch numbers and
          fully-qualified closing refs against it, so the right human is
          found without naming anyone in config. Empty = this repo only.
        required: false
        type: string
        default: ""
      model:
        required: false
        type: string
        default: "fable"
      fallback_model:
        required: false
        type: string
        default: "default"
      append_system_prompt:
        description: >-
          Repo-specific guidance (e.g. the fork's "a human promotes upstream
          rather than merging here" note for the handoff). Empty by default.
        required: false
        type: string
        default: ""
      settings:
        description: Keep in sync with claude.yml / claude-auto.yml.
        required: false
        type: string
        default: >-
          {"permissions":{"allow":["Read","Edit","Write",
          "Bash(pytest:*)","Bash(ruff:*)","Bash(mypy:*)","Bash(pyright:*)","Bash(pip:*)",
          "Bash(pip3:*)","Bash(uv:*)","Bash(python:*)","Bash(python3:*)",
          "Bash(gh:*)",
          "Bash(git fetch:*)","Bash(git merge:*)","Bash(git rebase:*)",
          "Bash(git push:*)","Bash(git checkout:*)","Bash(git switch:*)",
          "Bash(git branch:*)","Bash(git status:*)","Bash(git log:*)",
          "Bash(git diff:*)","Bash(git show:*)","Bash(git rev-parse:*)",
          "Bash(git remote:*)",
          "Bash(git add:*)","Bash(git commit:*)","Bash(git config:*)"]}}
    secrets:
      MARVIN_TOKEN:
        required: false
      OPENAI_API_KEY:
        description: >-
          OpenAI API key for the codex engine (design/codex-engine.md); used
          only by fix rounds on PRs labeled engine:codex.
        required: false

jobs:
  auto-review-fix:
    runs-on: ubuntu-latest
    # Same group as claude-auto.yml's CI-fixer (keyed on PR number): all @auto
    # pushes to a PR serialize, and the round counter's read-modify-write can't
    # race. cancel-in-progress: false lets an in-flight fix finish.
    concurrency:
      group: claude-auto-${{ github.repository }}-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # Gate (reviewer identity, same-repo, auto label, token) and compute the
      # round count — all via the API, before any checkout. The counter
      # increments before the agent runs, so a crashed agent still consumes a
      # round. Also derives the PR head branch (issue_comment doesn't carry it).
      - name: Gate and count
        id: gate
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          AUTHOR: ${{ inputs.comment_author }}
          REVIEWER: ${{ inputs.reviewer_login }}
          AUTO_LABEL: ${{ inputs.auto_label }}
          CAP: ${{ inputs.review_round_cap }}
          HANDOFF_MENTION: ${{ inputs.handoff_mention }}
          ANCHOR_REPO: ${{ inputs.anchor_repo }}
          HAS_TOKEN: ${{ secrets.MARVIN_TOKEN != '' }}
          MARKER: "<!-- auto-review-rounds -->"
        run: |
          set -euo pipefail
          act() { echo "act=$1" >>"$GITHUB_OUTPUT"; }
          # Retry a gh call on transient failure. A 5xx / secondary rate limit
          # returns an HTML error page, which `gh --jq` then rejects with
          # "invalid character '<'"; under `set -e` an unguarded call like that
          # aborts the gate BEFORE it decides fix/escalate/converge, so no fix,
          # no escalation, no error comment ever posts and the loop silently
          # stalls with the label still on (see design/auto-agent.md). Retry
          # with backoff; a persistent failure still returns non-zero so the
          # gate-failure failsafe below surfaces it instead of dying quietly.
          ghr() {
            local n=0
            until "$@"; do
              n=$((n+1))
              if [ "$n" -ge 4 ]; then return 1; fi
              sleep $((n*3))
            done
          }
          echo "review-fix gate: pr=#$PR comment_author='$AUTHOR' reviewer_login='$REVIEWER'"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "No MARVIN_TOKEN; the review loop can't push/re-request as a real identity. Skipping."
            act skip; exit 0
          fi
          # Codex-engine reviews post their verdict via the machine account
          # (design/codex-engine.md — github-actions[bot] comments trigger no
          # stubs), so marker comments from it carry the same authority as
          # the reviewer bot's.
          if [ "$AUTHOR" != "$REVIEWER" ] && [ "$AUTHOR" != "i-am-marvin" ]; then
            echo "Comment by '$AUTHOR', not the automated reviewer '$REVIEWER' (or the machine account); ignoring."
            act skip; exit 0
          fi
          pr_json=$(ghr gh pr view "$PR" --repo "$REPO" --json headRefName,headRefOid,isCrossRepository,labels 2>/dev/null) || {
            echo "#$PR is not a pull request (or the API is persistently unavailable); skipping."; act skip; exit 0; }
          if [ "$(jq -r '.isCrossRepository' <<<"$pr_json")" = "true" ]; then
            echo "PR #$PR is from a fork (cross-repository); skipping — would run untrusted code under MARVIN_TOKEN."
            act skip; exit 0
          fi
          if [ "$(jq -r --arg l "$AUTO_LABEL" 'any(.labels[]; .name==$l)' <<<"$pr_json")" != "true" ]; then
            echo "PR #$PR is not @auto-labeled; skipping."; act skip; exit 0
          fi
          echo "head_branch=$(jq -r '.headRefName' <<<"$pr_json")" >>"$GITHUB_OUTPUT"
          # Engine selection (design/codex-engine.md): fix rounds follow the
          # PR's engine:codex label; relabeling switches later rounds.
          echo "engine=$(jq -r 'if any(.labels[]; .name=="engine:codex") then "codex" else "claude" end' <<<"$pr_json")" >>"$GITHUB_OUTPUT"

          # Human to @-mention on handoff/escalation: the author of the issue this
          # PR closes (Fixes/Closes/Resolves #N), unless overridden. Bots are
          # skipped — no point pinging the PR's own machine-account author.
          mention="$HANDOFF_MENTION"
          if [ -z "$mention" ]; then
            # Match both `Fixes #N` and the fully-qualified `Fixes owner/repo#N`
            # (the fork mandates the latter — a bare `#N` there silently rebinds
            # to upstream when the branch is promoted). Only resolve a mention
            # when the reference targets THIS repo: a cross-repo `owner/repo#N`
            # points at a different tracker, so its number is meaningless here.
            ref=$(ghr gh pr view "$PR" --repo "$REPO" --json body --jq '.body // ""' \
                    | grep -ioE '(fixes|closes|resolves)[[:space:]]+([-A-Za-z0-9._]+/[-A-Za-z0-9._]+)?#[0-9]+' \
                    | head -1 || true)
            inum=""
            issue_repo="$REPO"
            lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
            if [ -n "$ref" ]; then
              refrepo=$(printf '%s' "$ref" | grep -oiE '[-A-Za-z0-9._]+/[-A-Za-z0-9._]+' || true)
              if [ -z "$refrepo" ] || [ "$(lower "$refrepo")" = "$(lower "$REPO")" ]; then
                inum=$(printf '%s' "$ref" | sed -n 's/.*#\([0-9]\{1,\}\).*/\1/p')
              elif [ -n "${ANCHOR_REPO:-}" ] && [ "$(lower "$refrepo")" = "$(lower "$ANCHOR_REPO")" ]; then
                # companion PR referencing its anchor issue cross-repo
                inum=$(printf '%s' "$ref" | sed -n 's/.*#\([0-9]\{1,\}\).*/\1/p')
                issue_repo="$ANCHOR_REPO"
              fi
            fi
            # Fallback for the MENTION only (closing semantics untouched): a PR
            # may deliberately use a non-closing ref — observed: "Refs ...#103"
            # on a docs-only PR that must not close its issue — so derive the
            # issue from the claude/issue-N-* branch convention when no closing
            # ref matched. On a companion repo the branch number references the
            # ANCHOR repo's tracker — but only when the same branch exists
            # there (this repo's own agent mints identically-shaped names for
            # native issues), so check for the twin before resolving remotely.
            if [ -z "$inum" ]; then
              hb=$(jq -r '.headRefName' <<<"$pr_json")
              inum=$(printf '%s' "$hb" | sed -n 's/^claude\/issue-\([0-9]\{1,\}\)-.*/\1/p')
              if [ -n "$inum" ] && [ -n "${ANCHOR_REPO:-}" ] && \
                 gh api "repos/$ANCHOR_REPO/branches/$hb" --silent >/dev/null 2>&1; then
                issue_repo="$ANCHOR_REPO"
              fi
            fi
            if [ -n "$inum" ]; then
              # Author, unless it's a bot or the machine account (marvin is a
              # User, not a Bot — triage-created issues are marvin-authored);
              # then the first assignee. Never a PR (the /issues/N endpoint
              # returns PRs too — observed pinging an unrelated PR author).
              mention=$(ghr gh api "repos/$issue_repo/issues/$inum" \
                          --jq 'if .pull_request then "" elif (.user.type=="Bot" or .user.login=="i-am-marvin") then (.assignees[0].login // "") else .user.login end' 2>/dev/null || true)
            fi
          fi
          echo "mention=$mention" >>"$GITHUB_OUTPUT"

          # Deterministic convergence: if the reviewer's latest summary carries a
          # `clean` verdict (no outstanding suggestions), hand off to a human
          # without spending a fix round. An absent verdict (older reviewer, or a
          # caller that overrides review_prompt) falls through to the round-count
          # path below, preserving prior behavior.
          summary=$(ghr gh api "repos/$REPO/issues/$PR/comments" --paginate \
                      --jq 'map(select(.body|contains("claude-review-summary"))) | last | .body')
          verdict=$(printf '%s' "$summary" | sed -n 's/.*claude-review-verdict:\([a-z]*\).*/\1/p')
          if [ "$verdict" = "clean" ]; then
            echo "Reviewer verdict is clean; converging without a fix round."
            act converged; exit 0
          fi

          cid=$(ghr gh api "repos/$REPO/issues/$PR/comments" --paginate \
                  --jq 'map(select(.body|contains("'"$MARKER"'"))) | last | .id // empty')
          prev=0
          prevsha=""
          if [ -n "$cid" ]; then
            mbody=$(ghr gh api "repos/$REPO/issues/comments/$cid" --jq '.body')
            prev=$(printf '%s' "$mbody" | sed -n 's/.*rounds:[[:space:]]*\([0-9]*\).*/\1/p')
            prev=${prev:-0}
            # Branch tip recorded when the previous round started (see Record round).
            prevsha=$(printf '%s' "$mbody" | sed -n 's/.*auto-review-head:\([0-9a-f]*\).*/\1/p')
          fi
          next=$((prev + 1))
          head=$(jq -r '.headRefOid' <<<"$pr_json")
          echo "cid=$cid" >>"$GITHUB_OUTPUT"
          echo "round=$next" >>"$GITHUB_OUTPUT"
          echo "head=$head" >>"$GITHUB_OUTPUT"

          # No-progress escalation: the previous fix round pushed no new commit
          # (branch tip unchanged since it was recorded) yet the reviewer still
          # has suggestions. Re-running the agent against an unchanged tree would
          # just repeat itself, so hand off early rather than burning rounds up
          # to the cap. Only meaningful once a prior round recorded a tip; a
          # marker without one (pre-upgrade) skips the check and falls through.
          if [ "$prev" -ge 1 ] && [ -n "$prevsha" ] && [ "$head" = "$prevsha" ]; then
            echo "No new commit since round $prev (tip $head unchanged); escalating for no progress."
            echo "stalled=1" >>"$GITHUB_OUTPUT"
            act escalate; exit 0
          fi
          if [ "$next" -gt "$CAP" ]; then act escalate; else act fix; fi

      # Failsafe: if the gate step itself errored (e.g. a transient API failure
      # the retries above couldn't ride out), it never set `act`, so every step
      # below skips and nothing reaches the PR — the loop would stall silently
      # with the label still on. Surface it so a human knows to resume. Kept
      # trigger-free ON PURPOSE: the body must not contain a literal @review or
      # @auto, or this bot-authored comment would re-fire the loop and, on a
      # persistent gate failure, spin (see design/auto-agent.md). The `auto`
      # label is left on so re-running the job or a fresh review resumes cleanly.
      - name: Surface gate failure
        if: always() && steps.gate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          [ -z "${PR:-}" ] && { echo "No PR number; nothing to surface."; exit 0; }
          gh issue comment "$PR" --repo "$REPO" --body "$(printf '⚠️ auto: the review-fix run errored before it could act (a transient GitHub API failure in the gate step). The loop is paused, not stopped — the label is still on. Re-run the failed job (%s) or post a fresh review request to resume.' "$RUN_URL")" || true

      # Atlas tracking (design/atlas-tracking.md): a review-fix round is the
      # agent working the PR's issue; both @auto exits — converged AND
      # escalated — hand back to a human (there is no Agent →
      # Sign-off; the driver reaches Sign-off by sending it onward). The PR
      # resolves to its issue via claude/issue-N-* (then a Fixes ref).
      - name: Stage - Agent
        if: steps.gate.outputs.act == 'fix'
        uses: meridianlabs-ai/agents/.github/actions/set-stage@main
        with:
          stage: Agent
          token: ${{ secrets.MARVIN_TOKEN }}
          repo: ${{ github.repository }}
          issue: ${{ inputs.pr_number }}
          branch: ${{ steps.gate.outputs.head_branch }}

      - name: Stage - Review (handoff)
        if: steps.gate.outputs.act == 'converged' || steps.gate.outputs.act == 'escalate'
        uses: meridianlabs-ai/agents/.github/actions/set-stage@main
        with:
          stage: Review
          token: ${{ secrets.MARVIN_TOKEN }}
          repo: ${{ github.repository }}
          issue: ${{ inputs.pr_number }}
          branch: ${{ steps.gate.outputs.head_branch }}

      # Reviewer reported no outstanding suggestions: hand off to a human for the
      # final review/merge (@auto never merges). Idempotent so a later clean
      # re-review doesn't re-ping. The `auto` label is left on, so further CI or
      # human-review activity can still re-engage @auto.
      - name: Converged handoff
        if: steps.gate.outputs.act == 'converged'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          MENTION: ${{ steps.gate.outputs.mention }}
          MARKER: "<!-- auto-converged -->"
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/issues/$PR/comments" --paginate \
               --jq 'any(.[]; .body|contains("'"$MARKER"'"))' | grep -q true; then
            echo "Handoff already posted; skipping."; exit 0
          fi
          ping=""; [ -n "$MENTION" ] && ping="@$MENTION "
          gh pr comment "$PR" --repo "$REPO" --body "$MARKER
          ${ping}🤖 auto: the reviewer has no outstanding feedback — this PR has converged. auto never takes the final step (merge, or upstream promotion on the fork), so it's yours now; see the checks above for CI status. The \`auto\` label is left on, so auto will still react to new review or CI activity; remove it to disengage."

      - name: Escalate to human
        if: steps.gate.outputs.act == 'escalate'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          AUTO_LABEL: ${{ inputs.auto_label }}
          CAP: ${{ inputs.review_round_cap }}
          MENTION: ${{ steps.gate.outputs.mention }}
          STALLED: ${{ steps.gate.outputs.stalled }}
        run: |
          set -euo pipefail
          ping=""; [ -n "$MENTION" ] && ping="@$MENTION "
          if [ "${STALLED:-}" = "1" ]; then
            reason="my last fix round pushed no new changes, so I'm not making progress on the reviewer's remaining feedback"
          else
            reason="the reviewer still has feedback after $CAP review rounds and I haven't converged"
          fi
          gh pr comment "$PR" --repo "$REPO" --body \
            "${ping}🤖 auto: $reason. Removing the \`$AUTO_LABEL\` label and handing this to a human. Re-add it to let me keep iterating."
          gh pr edit "$PR" --repo "$REPO" --remove-label "$AUTO_LABEL" || true

      # Check out the PR head (derived above); authenticate as the machine
      # account so the agent's fix push re-triggers CI and its `@review` comment
      # re-triggers the reviewer (a GITHUB_TOKEN push/comment would be dropped).
      - name: Check out PR branch
        if: steps.gate.outputs.act == 'fix'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.gate.outputs.head_branch }}
          token: ${{ secrets.MARVIN_TOKEN || github.token }}

      # Capture the branch tip before the agent runs so the error-surfacing step
      # can tell whether the agent's work actually landed on the branch — and
      # the start time, so the self-handoff detector below only matches
      # comments this run posted.
      - name: Record base SHA
        if: steps.gate.outputs.act == 'fix'
        id: base
        run: |
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "started=$(date -u +%FT%TZ)" >>"$GITHUB_OUTPUT"

      - name: Record round
        if: steps.gate.outputs.act == 'fix'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          CID: ${{ steps.gate.outputs.cid }}
          ROUND: ${{ steps.gate.outputs.round }}
          CAP: ${{ inputs.review_round_cap }}
          HEAD: ${{ steps.gate.outputs.head }}
          MARKER: "<!-- auto-review-rounds -->"
        run: |
          set -euo pipefail
          # The auto-review-head marker records the branch tip at the START of
          # this round; next round's gate compares against it to detect a fix
          # round that pushed nothing (no-progress escalation).
          body="$MARKER
          🤖 auto review rounds: $ROUND (cap $CAP).
          <!-- auto-review-head:$HEAD -->"
          if [ -n "$CID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$CID" -f body="$body" --silent
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" --silent
          fi

      - name: Compose review-fix prompt
        if: steps.gate.outputs.act == 'fix'
        id: prompt
        env:
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          ROUND: ${{ steps.gate.outputs.round }}
          CAP: ${{ inputs.review_round_cap }}
        run: |
          printf 'value=%s\n' "You are @auto addressing automated-review feedback on PR #$PR in $REPO (review round $ROUND of $CAP). Read the reviewer's latest summary and any inline review comments with gh: \`gh pr view $PR --comments\`, \`gh api repos/$REPO/pulls/$PR/reviews\`, and \`gh api repos/$REPO/pulls/$PR/comments\`. Your goal is to leave the PR in the best shape you reasonably can, so address the feedback thoroughly — this INCLUDES minor and explicitly non-blocking suggestions (nits, naming, small refactors, reuse/DRY cleanups, doc fixes). Do NOT skip a suggestion just because the reviewer marked it non-blocking or 'not worth blocking on'; if it is a reasonable improvement, make it. The only items to leave unaddressed are ones you genuinely disagree with, that are clearly out of scope for this PR, or that are not a net improvement — for each of those, reply to that specific comment with a brief rationale instead of changing code. Verify your changes (run the relevant pytest/ruff/mypy). If you made any changes, commit and push to the current branch as the machine account (this re-runs CI), then post a single top-level comment of exactly \`@review\` to request re-review. EXCEPTION — documentation-only nit round: if EVERY suggestion you acted on this round was explicitly minor/non-blocking (nit-level) AND every change you pushed is documentation-only (markdown/doc files, code comments, docstrings — zero behavioral code change), do NOT post the re-review request — another review round would just re-read prose. Instead declare the loop done: hand off to a human as described below, noting the round was doc-only nits. ENDING CONTRACT (mandatory): a run that pushed ANY commit must end with exactly ONE of the two hand-backs — the \`@review\` re-review comment, or the doc-only exception's handoff comment. Pushing and posting neither is never permitted: it strands the board at Agent with nothing running, because the loop's only stage transitions come from reviewer verdicts and handoff markers. After pushing, resolve the inline review threads you fully addressed in code, so settled feedback is visibly closed: list threads via \`gh api graphql\` (query \`repository.pullRequest.reviewThreads\` — each node has an \`id\`, \`isResolved\`, and its \`comments\`), then for each thread you resolved in code run the \`resolveReviewThread\` mutation, e.g. \`gh api graphql -f query='mutation(\$id:ID!){resolveReviewThread(input:{threadId:\$id}){thread{isResolved}}}' -F id=<threadId>\`. Leave UNRESOLVED any thread you deliberately declined (the one you replied to with a rationale) so a human can adjudicate it, and never resolve a thread you did not actually address. Hand off to a human ONLY when nothing remains worth improving — i.e. the review is clean/approving, every remaining suggestion is one you have deliberately declined with a posted rationale, or you completed a documentation-only nit round (above). To hand off: check CI with \`gh pr checks $PR\` and mergeability with \`gh pr view $PR --json mergeable,mergeStateStatus\`, then post ONE comment whose FIRST line is exactly \`<!-- auto-handoff -->\` (the workflow moves the board stage on that marker), followed by a summary of what you addressed and anything you intentionally declined (and why), with the current CI and mergeable status, and @-mention the PR's originating human (the author of the issue referenced by \"Fixes #<n>\" in the PR body, if any). Do NOT merge — auto hands the final step to a human. In any comment you post here, refer to this automation as \`auto\` without an @ prefix; a literal @auto would re-trigger the loop. The same discipline applies to the review trigger: the ONLY place you may write that token bare is the single exact re-review request comment described above — anywhere else in comment prose, backtick it (\`@review\`), because your comments post as a write-access account and a bare token anywhere in the body starts a review run. The loop's marker substrings get the same discipline: never write claude-review-summary, claude-review-verdict, auto-review-rounds, auto-review-head, or auto-fix-attempts verbatim in any comment you post — the loop matches them by plain substring, so quoting a reviewer verdict comment verbatim would forge a verdict; when referencing one, break it (e.g. 'claude-review summary'). The auto-handoff marker is legitimate ONLY as the first line of the single handoff comment described above; never quote it elsewhere. Skip posting if an equivalent handoff comment already exists." >>"$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        if: steps.gate.outputs.act == 'fix' && steps.gate.outputs.engine != 'codex'
        id: claude
        with:
          anthropic_federation_rule_id: fdrl_01GpNgJm9jE6ZfvcqoJYQL2Y
          anthropic_organization_id: be5d0086-bc43-45d2-9184-20ecdd647aa7
          anthropic_service_account_id: svac_01RL4wYD7ikbypwYKf4wFojv
          anthropic_workspace_id: wrkspc_01RKCQ5DTPBatQ7kHLkaEueD
          github_token: ${{ secrets.MARVIN_TOKEN }}
          prompt: ${{ steps.prompt.outputs.value }}
          # The trigger actor is the reviewer bot, so lift claude-code-action's
          # default non-human-actor guard for that one bot (never '*'). The gate
          # above did the real authorization.
          allowed_bots: "claude"
          settings: ${{ inputs.settings }}
          claude_args: >-
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
            ${{ inputs.model != '' && inputs.fallback_model != '' && format('--fallback-model {0}', inputs.fallback_model) || '' }}
            ${{ inputs.append_system_prompt != '' && format('--append-system-prompt {0}', toJSON(inputs.append_system_prompt)) || '' }}

      # ---- Codex engine fix round (design/codex-engine.md) -------------------
      # No network/credentials in the codex sandbox, so the review feedback is
      # pre-fetched into the prompt file and the landing (commit/push/post) is
      # deterministic. The existing backstops then close the loop: a push with
      # no hand-back gets the @review from "Ensure hand-back after push"; a
      # no-change round posts the auto-handoff marker the selfhandoff detector
      # stages. Review-thread resolution needs gh and is a v1 non-goal — the
      # handoff notes threads are left for the human.
      - name: Prepare codex fix context
        id: codexprep
        if: steps.gate.outputs.act == 'fix' && steps.gate.outputs.engine == 'codex'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          ROUND: ${{ steps.gate.outputs.round }}
          CAP: ${{ inputs.review_round_cap }}
        run: |
          set -euo pipefail
          git config user.name "i-am-marvin"
          git config user.email "i-am-marvin@users.noreply.github.com"
          {
            echo "You are auto, addressing automated-review feedback on PR #$PR in $REPO (review round $ROUND of $CAP), running on the Codex engine in a local checkout of the PR's head branch."
            echo "CONSTRAINTS: you have NO network access and NO GitHub credentials — you cannot run gh, git fetch, git push, or post comments; do not try. Edit the working tree on the checked-out branch only — do NOT create or switch branches or check out other commits. Committing locally is unnecessary but harmless (the landing step lands local commits too); a deterministic workflow step commits leftover edits, pushes, and posts the re-review request for you. Verify your changes with the local tools (pytest/ruff/mypy) where relevant."
            echo "Address the feedback thoroughly — including minor and explicitly non-blocking suggestions. Leave unaddressed only what you genuinely disagree with or is out of scope, and say why in your final message."
            echo "ENDING CONTRACT: your final message MUST start with a single conventional-commit summary line for your changes (it becomes the commit subject), then a blank line, then a body listing what you addressed and anything you deliberately declined with rationale (it is posted as a comment). If nothing needs changing, leave the tree untouched and explain why."
            echo ""
            echo "RECENT PR COMMENTS (newest last; the review feedback is here):"
            gh api "repos/$REPO/issues/$PR/comments" --paginate --slurp \
              --jq 'add | .[-12:][] | "--- \(.user.login) at \(.created_at):\n\(.body)\n"' 2>/dev/null || true
            # Bounded like the issue-comment slice above: the head -c cap
            # below keeps the START of the file, so an unbounded inline
            # section (every thread the PR ever had, oldest first) would
            # crowd out the NEWEST feedback — the findings this round is
            # meant to address — on long-lived comment-heavy PRs.
            echo "INLINE REVIEW COMMENTS (path:line; newest last):"
            gh api "repos/$REPO/pulls/$PR/comments" --paginate --slurp \
              --jq 'add | .[-40:][] | "--- \(.path):\(.line // .original_line // "?") \(.user.login):\n\(.body)\n"' 2>/dev/null || true
          } >"$RUNNER_TEMP/codex-context.md"
          # Cap + de-fang from the completed scratch file, NOT in one pipeline
          # with the writers above: with the group piped straight into head -c,
          # the cap being hit mid-group leaves the next writer (a plain echo)
          # facing a closed pipe — SIGPIPE kills the group subshell (or, with
          # SIGPIPE ignored, set -e catches the write error) and pipefail fails
          # the step, data-dependently. Reading a file, no writer ever sees a
          # closed pipe. (The sed is belt-and-braces with the landing step's
          # output de-fang: the embedded comments include the reviewer's
          # verdict comments, and a marker substring codex never sees is one
          # it cannot echo; the substitutions are length-neutral.)
          head -c 120000 "$RUNNER_TEMP/codex-context.md" \
            | sed -E -e 's/claude-review-(summary|verdict)/claude-review \1/g' \
                     -e 's/auto-(handoff|review-rounds|review-head|fix-attempts)/auto \1/g' >.codex-prompt.md
          #
          # The landing step stages with a blanket `git add -A`, so exclude
          # the prompt file and the scratch codex's verification runs leave
          # behind on repos whose .gitignore doesn't cover it (caches, venvs).
          printf '%s\n' .codex-prompt.md .venv/ venv/ __pycache__/ \
            .pytest_cache/ .mypy_cache/ .ruff_cache/ .coverage node_modules/ \
            >>.git/info/exclude

      - name: Run Codex fix
        id: codexfix
        if: steps.gate.outputs.act == 'fix' && steps.gate.outputs.engine == 'codex'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          allow-bot-users: "claude"
          prompt-file: .codex-prompt.md
          output-file: ${{ runner.temp }}/codex-final.md

      - name: Land codex fix
        id: codexland
        if: steps.codexfix.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          ROUND: ${{ steps.gate.outputs.round }}
          MENTION: ${{ steps.gate.outputs.mention }}
          OUT: ${{ runner.temp }}/codex-final.md
          START_SHA: ${{ steps.base.outputs.sha }}
          HEAD_BRANCH: ${{ steps.gate.outputs.head_branch }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            # || true inside the substitution: without it a missing/unreadable
            # $OUT fails the pipeline and set -e kills the step before the
            # fallback is reached — the fallback would only ever cover an
            # empty first line.
            subject=$(head -n1 "$OUT" 2>/dev/null | cut -c1-120 || true)
            [ -n "$subject" ] || subject="codex: address review feedback on PR #$PR"
            git add -A
            git commit --quiet -m "$subject" -m "Co-Authored-By: Codex <noreply@openai.com>"
          fi
          # Landable work = HEAD moved since round start, not just a dirty
          # tree: the prompt calls local commits unnecessary but they are
          # possible, and a status-only check would silently discard them
          # with the runner. Explicit refspec so the PR head branch is what
          # gets updated even if codex left HEAD on some other local branch;
          # a diverted HEAD that isn't genuinely new work fails the push
          # non-fast-forward — loud, not lossy.
          pushed=""
          if [ "$(git rev-parse HEAD)" != "$START_SHA" ]; then
            git push --quiet origin "HEAD:refs/heads/$HEAD_BRANCH"
            pushed=1
            echo "pushed $(git rev-parse --short HEAD) to $HEAD_BRANCH"
          fi
          # One comment either way, de-fanged (posts from a write-access
          # account; the gate and the hand-back backstop match the loop's
          # verdict/handoff markers with plain substring contains(), so codex
          # QUOTING one — likely, its prompt embeds the reviewer's verdict
          # comments verbatim — would forge a verdict or suppress an owed
          # hand-back: break those substrings too, in codex's text only, not
          # the deliberate leading marker below). Pushed: a plain summary —
          # "Ensure hand-back" below owes the @review. No changes: the round
          # is concluded — lead with the auto-handoff marker so the
          # selfhandoff detector moves the board.
          {
            if [ -z "$pushed" ]; then
              echo "<!-- auto-handoff -->"
              ping=""; [ -n "$MENTION" ] && ping="@$MENTION "
              printf '%sauto (codex, round %s): no code changes this round — summary below. Inline review threads are not auto-resolved on the codex engine; please resolve any settled ones.\n\n' "$ping" "$ROUND"
            else
              printf '🤖 auto (codex, round %s): changes pushed — summary below. Inline review threads are not auto-resolved on the codex engine.\n\n' "$ROUND"
            fi
            sed -E -e 's/@(review|claude|auto)/`\1`/g' \
                   -e 's/claude-review-(summary|verdict)/claude-review \1/g' \
                   -e 's/auto-(handoff|review-rounds|review-head|fix-attempts)/auto \1/g' \
                   "$OUT" 2>/dev/null || echo "(codex produced no final message)"
          } >"$RUNNER_TEMP/codex-comment.md"
          gh api "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/codex-comment.md" --silent
      # ---- end Codex engine ---------------------------------------------------

      # The agent may end the loop itself instead of posting @review — a
      # documentation-only nit round, or all remaining feedback declined with
      # Backstop for the ending contract: a fix round that pushed commits must
      # end with @review or the doc-only handoff — observed (inspect_ai#206): a
      # doc-only round took the "don't post @review" branch, skipped the
      # handoff half, and stranded the stage at Agent. If the tip moved and
      # neither hand-back was posted, post the re-review request as the
      # machine account — a redundant review round is the safe completion
      # (word-boundary gate + newest-wins concurrency make duplicates cheap).
      # Codex gate is codexfix, not codexland: a landing that pushed and then
      # died posting its comment still owes the @review — this step detects
      # the push itself, so gating on the earlier step closes that gap.
      - name: Ensure hand-back after push
        if: >-
          always() && steps.gate.outputs.act == 'fix' &&
          (steps.claude.outcome == 'success' || steps.codexfix.outcome == 'success')
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          HEAD_BRANCH: ${{ steps.gate.outputs.head_branch }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          SINCE: ${{ steps.base.outputs.started }}
        run: |
          set -uo pipefail
          git fetch --quiet origin "$HEAD_BRANCH" 2>/dev/null || true
          tip=$(git rev-parse "origin/$HEAD_BRANCH" 2>/dev/null || echo "$BASE_SHA")
          [ "$tip" = "$BASE_SHA" ] && { echo "No push this round; no hand-back owed."; exit 0; }
          posted=$(gh api "repos/$REPO/issues/$PR/comments?since=$SINCE" \
            --jq '[.[] | select((.body | test("^\\s*@review\\s*$")) or (.body | contains("auto-handoff")))] | length' 2>/dev/null || echo 0)
          if [ "${posted:-0}" -gt 0 ]; then
            echo "Hand-back already posted this round."
          else
            echo "Agent pushed ($BASE_SHA -> $tip) without a hand-back; posting the re-review request."
            # Retry with backoff: this comment IS the hand-back — a swallowed
            # failure (observed: GitHub 503 during an outage) strands the
            # board at Agent with green CI and nobody notified. Fail the run
            # loudly if it never lands.
            ok=""
            for i in 1 2 3 4 5; do
              if gh pr comment "$PR" --repo "$REPO" --body '@review'; then ok=1; break; fi
              echo "hand-back post failed (attempt $i); retrying"
              sleep $((i * 15))
            done
            if [ -z "$ok" ]; then
              echo "::error::hand-back @review comment failed after 5 attempts — post it manually"
              exit 1
            fi
          fi

      # rationale — by posting a handoff comment whose first line is
      # <!-- auto-handoff -->. Detect a fresh one (posted by the machine
      # account after this run started) and move the board to Review;
      # without this the stage would stay parked at Agent, since the
      # deterministic converged/escalate paths only fire on reviewer verdicts.
      - name: Detect agent self-handoff
        id: selfhandoff
        if: >-
          steps.gate.outputs.act == 'fix' &&
          (steps.claude.outcome == 'success' || steps.codexland.outcome == 'success')
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          SINCE: ${{ steps.base.outputs.started }}
        run: |
          set -euo pipefail
          n=$(gh api "repos/$REPO/issues/$PR/comments?since=$SINCE" \
                --jq '[.[] | select(.user.login=="i-am-marvin" and (.body|startswith("<!-- auto-handoff -->")))] | length' \
                2>/dev/null || echo 0)
          echo "self-handoff comments since $SINCE: $n"
          echo "found=$([ "${n:-0}" -gt 0 ] && echo true || echo false)" >>"$GITHUB_OUTPUT"

      - name: Stage - Review (self-handoff)
        if: steps.selfhandoff.outputs.found == 'true'
        uses: meridianlabs-ai/agents/.github/actions/set-stage@main
        with:
          stage: Review
          token: ${{ secrets.MARVIN_TOKEN }}
          repo: ${{ github.repository }}
          issue: ${{ inputs.pr_number }}
          branch: ${{ steps.gate.outputs.head_branch }}

      # Surface agent errors the action swallows (model overload/529, 404, etc.),
      # which otherwise leave the review-fix run green with no fix/handoff posted.
      # Also catches the "completed-but-blocked" case: the agent finishes with no
      # error but left its work unlanded (see the landed/pending check below).
      - name: Surface agent errors
        if: always() && steps.gate.outputs.act == 'fix'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          NUM: ${{ inputs.pr_number }}
          HEAD_BRANCH: ${{ steps.gate.outputs.head_branch }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          MENTION: ${{ steps.gate.outputs.mention }}
          HANDED: ${{ steps.selfhandoff.outputs.found }}
          CODEXPREP_OUTCOME: ${{ steps.codexprep.outcome }}
          CODEX_OUTCOME: ${{ steps.codexfix.outcome }}
          CODEXLAND_OUTCOME: ${{ steps.codexland.outcome }}
        run: |
          set -uo pipefail
          file="${EXEC:-/home/runner/work/_temp/claude-execution-output.json}"
          err=""
          [ -f "$file" ] && err=$(jq -r '(if type=="array" then . else .messages end) | map(select(.type=="result" and .is_error==true)) | last | .result // empty' "$file" 2>/dev/null || true)
          if [ -z "$err" ] && [ "${CODEXPREP_OUTCOME:-}" = "failure" ]; then
            err="the codex context-preparation step failed before the agent started — no fix was attempted this round (see the job logs)."
          fi
          if [ -z "$err" ] && [ "${CODEX_OUTCOME:-}" = "failure" ]; then
            err="the codex fix step failed (missing OPENAI_API_KEY, or a codex-action error — see the job logs)."
          fi
          if [ -z "$err" ] && [ "${CODEXLAND_OUTCOME:-}" = "failure" ]; then
            err="codex finished but its landing step failed — the fix may not have reached the branch (see the job logs)."
          fi
          if [ -z "$err" ] && [ "$CLAUDE_OUTCOME" = "failure" ]; then
            err="the review-fix step failed before producing a result (see the job logs)."
          fi
          # Completed-but-blocked: the action reports success, but the agent did
          # work that never reached the branch — uncommitted edits or local
          # commits it couldn't push (e.g. a git command outside the allow-list).
          # A healthy round either lands its changes (commit+push, or a
          # server-side API commit — both advance the remote tip) or makes no
          # changes at all, so unlanded local work means the round silently
          # stalled and nothing reached the PR. See design/auto-agent.md.
          if [ -z "$err" ] && [ -n "${BASE_SHA:-}" ]; then
            git fetch origin "$HEAD_BRANCH" --quiet 2>/dev/null || true
            remote=$(git rev-parse "origin/$HEAD_BRANCH" 2>/dev/null || echo "$BASE_SHA")
            pending=""
            # untracked files are normal scratch (test caches, venvs) — only
            # tracked-file edits count as unlanded work (inspect_ai#271 was a
            # false ⚠️ from untracked leftovers on a doc-only round)
            [ -n "$(git status --porcelain --untracked-files=no 2>/dev/null || true)" ] && pending=1
            [ -n "$(git rev-list "$BASE_SHA..HEAD" 2>/dev/null || true)" ] && pending=1
            # A hand-off posted this round EXPLAINS unpushed local edits:
            # the agent hit the workflow-scope push wall, said so, and
            # delivered the change another way (observed: agents#28 got a
            # proper hand-off plus this redundant ⚠️ 18 seconds later).
            # HANDED is the selfhandoff detector's strict match (machine
            # account + marker as the leading line, per the documented
            # hand-off contract — quoting it in prose, e.g. in backticks
            # mid-comment, does not match), so the ⚠️ is suppressed only when the
            # same signal moved the board to Review. A cancelled claude step
            # skips that detector; its empty output falls through to flagging.
            if [ "$remote" = "$BASE_SHA" ] && [ -n "$pending" ]; then
              if [ "${HANDED:-}" = "true" ]; then
                echo "::notice::unpushed local edits, but a hand-off comment posted this round explains them; not flagging."
              else
                # Strip the @ from trigger tokens in agent-authored text: this
                # summary is embedded in a MARVIN-authored comment below, and a
                # bare @review/@claude/@auto in it would trigger that workflow
                # (marvin is a write-access human account to every gate).
                summary=$(jq -r '(if type=="array" then . else .messages end) | map(select(.type=="result")) | last | .result // empty' "$file" 2>/dev/null | head -c 1000 | sed -E 's/@(review|claude|auto)/\1/g' || true)
                err="the agent finished but left edits to tracked files (or unpushed commits) that never landed on the branch — whatever its summary reports, no code change reached the PR."
                [ -n "$summary" ] && err="$err Agent summary: $summary"
              fi
            fi
          fi
          [ -z "$err" ] && { echo "No agent error detected."; exit 0; }
          echo "::error::review-fix run did not complete: $err"
          if [ -n "${NUM:-}" ]; then
            # cc the responsible human (gate-derived): without a mention these
            # error reports on agent-authored PRs email nobody.
            cc=""
            [ -n "${MENTION:-}" ] && cc=$(printf '\n\ncc @%s' "$MENTION")
            gh issue comment "$NUM" --repo "$REPO" --body "$(printf '⚠️ The auto review-fix run did not complete:\n\n> %s\n\nIf this looks transient (model API capacity/overload), re-trigger with `@review`; otherwise it likely needs a human.%s' "$err" "$cc")" || true
          fi
          exit 1

      # Infra crashes must not burn review rounds (mirror of claude-auto.yml's
      # attempt refund): a step that died with NO execution output attempted
      # nothing. A failed codex step is the same class — its landing step
      # never ran, so nothing reached the PR (persistently missing
      # OPENAI_API_KEY must not march a PR to spurious escalation) — and so
      # is a failed codex PREP step, which dies before the agent starts and
      # skips codexfix outright; the exec-file guard below is Claude-only and
      # no execution file ever exists on the codex path, so the refund
      # proceeds. Rebuild the sticky counter body including the head marker
      # the next gate's no-progress check reads. Per-PR concurrency
      # serializes us.
      - name: Refund infra-crashed round
        if: >-
          always() && steps.gate.outputs.act == 'fix' &&
          (steps.claude.outcome == 'failure' || steps.codexfix.outcome == 'failure' ||
           steps.codexprep.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
          ROUND: ${{ steps.gate.outputs.round }}
          CAP: ${{ inputs.review_round_cap }}
          HEAD: ${{ steps.gate.outputs.head }}
          MARKER: "<!-- auto-review-rounds -->"
        run: |
          set -uo pipefail
          file="${EXEC:-/home/runner/work/_temp/claude-execution-output.json}"
          if [ -s "$file" ]; then
            echo "Execution output exists — a real round ran; not refunding."
            exit 0
          fi
          prev=$((ROUND - 1))
          cid=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                  --jq 'map(select(.body|contains("'"$MARKER"'"))) | last | .id // empty' 2>/dev/null || true)
          [ -z "$cid" ] && { echo "No counter comment found; nothing to refund."; exit 0; }
          body="$MARKER
          🤖 auto review rounds: $prev (cap $CAP). (one round refunded — the fix agent crashed before starting: infrastructure, not the fix)
          <!-- auto-review-head:$HEAD -->"
          gh api -X PATCH "repos/$REPO/issues/comments/$cid" -f body="$body" --silent || true
          echo "Refunded round $ROUND -> $prev."

      - name: Upload execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-auto-review-execution-output
          path: /home/runner/work/_temp/claude-execution-output.json
          if-no-files-found: ignore
