name: Claude Auto Review (reusable)

# @auto Phase 2/3: the review -> fix loop and human handoff. A caller stub
# triggers this on `issue_comment` when the automated reviewer posts its marked
# summary comment on an `auto`-labeled PR. The dev agent (as the machine
# account) addresses the feedback, pushes, and re-requests review — closing the
# loop. When it finds nothing to fix, it hands off to a human (it NEVER merges).
# Bounded by review_round_cap; at the cap it drops the `auto` label (the
# kill-switch) and pings a human.
#
# Why issue_comment, not pull_request_review: pull_request_review resolves
# workflows from the PR's base branch, so it never fires on a pristine-base fork
# (the inspect_ai fork). issue_comment resolves from the default branch and
# fires everywhere — one mechanism for all repos. The reviewer marks its summary
# comment (<!-- claude-review-summary -->) so this keys on it; @auto then reads
# the actual review + inline findings via the API.
#
# Only the automated reviewer's comments drive the loop (reviewer_login); the
# `auto` label authorizes — and the gate verifies who applied it (issue #92:
# the machine account or a write-access account, else the label is removed and
# no round runs); cross-repo (fork) PRs are skipped (the agent checks
# out and runs PR head code under MARVIN_TOKEN — don't do that for untrusted
# forks). Shares the per-PR `concurrency` group with claude-auto.yml so the
# CI-fixer and review-fixer never push to the same branch at once.

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      comment_author:
        description: Login that posted the triggering comment (github.event.comment.user.login).
        required: true
        type: string
      reviewer_login:
        description: Login of the automated reviewer whose marked summary comments drive the loop.
        required: false
        type: string
        default: "claude[bot]"
      auto_label:
        required: false
        type: string
        default: "auto"
      review_round_cap:
        description: >-
          Max review -> fix rounds before escalating to a human. This is the
          hard ceiling on a *productive* loop; a separate no-progress check
          (below) escalates earlier if a fix round pushes no new commit.
        required: false
        type: number
        default: 10
      handoff_mention:
        description: >-
          GitHub login to @-mention on convergence/escalation handoff. Empty
          (default) derives the originating human from the PR's "Fixes/Closes
          #N" linked-issue author; bots are skipped.
        required: false
        type: string
        default: ""
      anchor_repo:
        description: >-
          Repo whose issues this repo's claude/issue-N-* branch numbers
          reference when the same-named branch also exists THERE (the
          companion convention — e.g. ts-mono sets meridianlabs-ai/inspect_ai).
          Mention derivation resolves companion branch numbers and
          fully-qualified closing refs against it, so the right human is
          found without naming anyone in config. Empty = this repo only.
        required: false
        type: string
        default: ""
      model:
        required: false
        type: string
        default: "fable"
      fallback_model:
        required: false
        type: string
        default: "default"
      codex_model:
        description: >-
          Model for the codex engine (design/codex-engine.md). Empty (the
          default) omits --model so the run uses the codex CLI's own default,
          which tracks OpenAI's current flagship without edits here (decision:
          Ransom, 2026-09-08; previously pinned gpt-5.6-sol). Set to pin.
        required: false
        type: string
        default: ""
      codex_effort:
        description: >-
          Reasoning effort for codex implementation runs
          (low|medium|high|xhigh|max). Runs at high — reviews run at xhigh
          (decision: Ransom, 2026-09-08). Empty falls back to the codex CLI
          default.
        required: false
        type: string
        default: "high"
      append_system_prompt:
        description: >-
          Repo-specific guidance (e.g. the fork's "a human promotes upstream
          rather than merging here" note for the handoff). Empty by default.
        required: false
        type: string
        default: ""
      branch_sync_append:
        description: >-
          Caller-specific merge guidance, same channel as claude.yml's input of
          the same name: reaches the agent on BOTH engines whenever "Sync
          branch with base" merged this run — appended to the conflict note
          when the merge is handed to the agent, and spliced behind a "a
          workflow step already merged; review the result" lead-in when the
          runner merged cleanly. Clean merges are the case that motivated it
          (git auto-merges a CHANGELOG without conflict and lands the entry
          under the wrong heading — the fork's append checks for that). Empty
          by default. Keep it a single line — the Claude-path prompt travels
          as one output line, so newlines are flattened.
        required: false
        type: string
        default: ""
      settings:
        description: Keep in sync with claude.yml / claude-auto.yml.
        required: false
        type: string
        default: >-
          {"permissions":{"allow":["Read","Edit","Write",
          "Bash(pytest:*)","Bash(ruff:*)","Bash(mypy:*)","Bash(pyright:*)","Bash(pip:*)",
          "Bash(pip3:*)","Bash(uv:*)","Bash(python:*)","Bash(python3:*)",
          "Bash(gh:*)",
          "Bash(git fetch:*)","Bash(git merge:*)","Bash(git rebase:*)",
          "Bash(git push:*)","Bash(git checkout:*)","Bash(git switch:*)",
          "Bash(git branch:*)","Bash(git status:*)","Bash(git log:*)",
          "Bash(git diff:*)","Bash(git show:*)","Bash(git rev-parse:*)",
          "Bash(git remote:*)",
          "Bash(git add:*)","Bash(git commit:*)","Bash(git config:*)"]}}
    secrets:
      MARVIN_TOKEN:
        required: false
      OPENAI_API_KEY:
        description: >-
          OpenAI API key for the codex engine (design/codex-engine.md); used
          only by fix rounds on PRs labeled engine:codex.
        required: false

jobs:
  auto-review-fix:
    runs-on: ubuntu-latest
    # Same group as claude-auto.yml's CI-fixer (keyed on PR number): all @auto
    # pushes to a PR serialize, and the round counter's read-modify-write can't
    # race. cancel-in-progress: false lets an in-flight fix finish.
    concurrency:
      group: claude-auto-${{ github.repository }}-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # The gate is three steps, all via the API, before any checkout: resolve
      # the PR and check reviewer identity, same-repo, token and the auto
      # label; verify who applied the label (shared composite); then compute
      # the round count and decide. The counter increments before the agent
      # runs, so a crashed agent still consumes a round — and it is computed
      # only AFTER the labeler check passes, so an outsider's label never
      # burns rounds. Also derives the PR head branch (issue_comment doesn't
      # carry it). Downstream steps read every gate output (`act`,
      # `head_branch`, `engine`, `round`, …) from the LAST step; the resolve
      # step hands it the PR JSON it fetched, so the split is invisible to them.
      - name: Resolve PR and check the auto label
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          AUTHOR: ${{ inputs.comment_author }}
          REVIEWER: ${{ inputs.reviewer_login }}
          AUTO_LABEL: ${{ inputs.auto_label }}
          HAS_TOKEN: ${{ secrets.MARVIN_TOKEN != '' }}
        run: |
          set -euo pipefail
          # `act` here is skip or verify (proceed to the labeler check); the
          # final act (skip/fix/converged/escalate) is the Gate and count step's.
          act() { echo "act=$1" >>"$GITHUB_OUTPUT"; }
          # Retry a gh call on transient failure. A 5xx / secondary rate limit
          # returns an HTML error page, which `gh --jq` then rejects with
          # "invalid character '<'"; under `set -e` an unguarded call like that
          # aborts the gate BEFORE it decides fix/escalate/converge, so no fix,
          # no escalation, no error comment ever posts and the loop silently
          # stalls with the label still on (see design/auto-agent.md). Retry
          # with backoff; a persistent failure still returns non-zero so the
          # gate-failure failsafe below surfaces it instead of dying quietly.
          # Each attempt's stdout is captured and emitted only on overall
          # success: a failed `gh api` prints the HTTP error body to STDOUT
          # (stderr carries only the `gh:` line), so streaming attempts
          # through would prefix a fail-then-succeed retry's real output
          # with error bodies — poisoning every $(ghr …) capture in exactly
          # the case the retry exists for. (Same pattern as api() in
          # claude-review.yml's trig step.)
          ghr() {
            local n=0 out
            until out=$("$@"); do
              n=$((n+1))
              if [ "$n" -ge 4 ]; then return 1; fi
              sleep $((n*3))
            done
            printf '%s' "$out"
          }
          echo "review-fix gate: pr=#$PR comment_author='$AUTHOR' reviewer_login='$REVIEWER'"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "No MARVIN_TOKEN; the review loop can't push/re-request as a real identity. Skipping."
            act skip; exit 0
          fi
          # Codex-engine reviews post their verdict via the machine account
          # (design/codex-engine.md — github-actions[bot] comments trigger no
          # stubs), so marker comments from it carry the same authority as
          # the reviewer bot's.
          if [ "$AUTHOR" != "$REVIEWER" ] && [ "$AUTHOR" != "i-am-marvin" ]; then
            echo "Comment by '$AUTHOR', not the automated reviewer '$REVIEWER' (or the machine account); ignoring."
            act skip; exit 0
          fi
          pr_json=$(ghr gh pr view "$PR" --repo "$REPO" --json state,closedAt,headRefName,headRefOid,isCrossRepository,labels 2>/dev/null) || {
            echo "#$PR is not a pull request (or the API is persistently unavailable); skipping."; act skip; exit 0; }
          if [ "$(jq -r '.isCrossRepository' <<<"$pr_json")" = "true" ]; then
            echo "PR #$PR is from a fork (cross-repository); skipping — would run untrusted code under MARVIN_TOKEN."
            act skip; exit 0
          fi
          if [ "$(jq -r --arg l "$AUTO_LABEL" 'any(.labels[]; .name==$l)' <<<"$pr_json")" != "true" ]; then
            echo "PR #$PR is not @auto-labeled; skipping."; act skip; exit 0
          fi
          # Hand the fetched PR to the counting step (one line: gh emits
          # compact JSON, and `-c` guarantees it for the single-line output).
          echo "pr_json=$(jq -c . <<<"$pr_json")" >>"$GITHUB_OUTPUT"
          act verify

      # Who applied the label (issue #92): the most recent `labeled` event
      # must come from marvin or a write-access account. An outsider's label
      # is removed (as marvin) and noted on the PR; no evidence (no event,
      # an App labeler, a failed lookup) refuses without disarming and posts
      # a one-time notice. Shared composite with claude-auto.yml — the
      # verdicts and the PR-facing text live there. Runs under MARVIN_TOKEN
      # (the resolve step already required it). A persistent timeline fetch
      # failure FAILS this step, which the gate-failure failsafe below
      # surfaces like a crash of the other two.
      - name: Verify who applied the auto label
        id: labeler
        if: steps.resolve.outputs.act == 'verify'
        uses: meridianlabs-ai/agents/.github/actions/verify-auto-labeler@main
        with:
          token: ${{ secrets.MARVIN_TOKEN }}
          repo: ${{ github.repository }}
          pr: ${{ inputs.pr_number }}
          label: ${{ inputs.auto_label }}

      - name: Gate and count
        id: gate
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          PR_JSON: ${{ steps.resolve.outputs.pr_json }}
          RESOLVED: ${{ steps.resolve.outputs.act }}
          LABELER_VERDICT: ${{ steps.labeler.outputs.verdict }}
          CAP: ${{ inputs.review_round_cap }}
          HANDOFF_MENTION: ${{ inputs.handoff_mention }}
          ANCHOR_REPO: ${{ inputs.anchor_repo }}
          MARKER: "<!-- auto-review-rounds -->"
        run: |
          set -euo pipefail
          act() { echo "act=$1" >>"$GITHUB_OUTPUT"; }
          # Same ghr as the resolve step (and claude-auto.yml's gate).
          ghr() {
            local n=0 out
            until out=$("$@"); do
              n=$((n+1))
              if [ "$n" -ge 4 ]; then return 1; fi
              sleep $((n*3))
            done
            printf '%s' "$out"
          }
          if [ "$RESOLVED" != "verify" ]; then act skip; exit 0; fi
          if [ "$LABELER_VERDICT" != "ok" ]; then
            echo "Labeler check on PR #$PR: ${LABELER_VERDICT:-no verdict}; skipping."; act skip; exit 0
          fi
          pr_json="$PR_JSON"
          # Closed PR, still auto-labeled: on the fork that is a deliberate
          # continuation surface, not garbage — promotion opens the upstream
          # PR from the SAME branch (upstream runs no agents), so
          # post-promotion feedback is fixed by looping HERE, and every push
          # lands on the upstream PR's diff. But a closed PR's recorded
          # headRefOid is FROZEN at close: steering by it makes reviews
          # re-read old code and the no-progress check compare frozen
          # against frozen — observed on fork PR #351 (2026-09-01), which
          # escalated "pushed no new changes" while its fix rounds' pushes
          # were landing on the upstream diff. Steer by the LIVE branch tip
          # instead; a deleted branch means a genuinely dead PR — skip.
          # CLOSED only: the continuation contract is promotion-shaped
          # (promotion closes the fork PR, nothing merges it) — a MERGED PR
          # is done, and looping on its surviving branch would push commits
          # that never reach main while the moving tip defeats the
          # no-progress escalation that used to kill exactly that zombie.
          pr_state=$(jq -r '.state' <<<"$pr_json")
          live_tip=""
          if [ "$pr_state" = "MERGED" ]; then
            echo "PR #$PR is MERGED; nothing to continue. Skipping."
            act skip; exit 0
          elif [ "$pr_state" != "OPEN" ]; then
            # ghr emits captured stdout only on success, so a deleted branch
            # (persistent 404) yields an empty capture and the skip below
            # fires — the error body `gh api` prints to STDOUT never reaches
            # the substitution, and a fail-then-succeed retry still yields a
            # clean SHA. The hex check is belt-and-braces against unexpected
            # API output — fail-safe: skip, don't steer by garbage.
            live_tip=$(ghr gh api "repos/$REPO/branches/$(jq -r '.headRefName' <<<"$pr_json")" --jq '.commit.sha' 2>/dev/null) || live_tip=""
            [[ "$live_tip" =~ ^[0-9a-f]{40}$ ]] || live_tip=""
            if [ -z "$live_tip" ]; then
              echo "PR #$PR is $pr_state and its branch is gone (or the API is persistently unavailable); nothing to continue. Skipping."
              act skip; exit 0
            fi
            echo "PR #$PR is $pr_state but auto-labeled with a live branch (promotion continuation); steering by branch tip $live_tip."
          fi
          continuation=false
          closed_at=""
          if [ -n "$live_tip" ]; then
            continuation=true
            # The close timestamp is the continuation epoch: the converged
            # handoff's idempotence check only counts hand-backs posted after
            # it, so the pre-promotion handoff (which is what led to the
            # close) doesn't silence the continuation's own ending.
            closed_at=$(jq -r '.closedAt // ""' <<<"$pr_json")
          fi
          echo "continuation=$continuation" >>"$GITHUB_OUTPUT"
          echo "closed_at=$closed_at" >>"$GITHUB_OUTPUT"
          echo "head_branch=$(jq -r '.headRefName' <<<"$pr_json")" >>"$GITHUB_OUTPUT"
          # Engine selection (design/codex-engine.md): fix rounds follow the
          # PR's engine:codex label; relabeling switches later rounds.
          echo "engine=$(jq -r 'if any(.labels[]; .name=="engine:codex") then "codex" else "claude" end' <<<"$pr_json")" >>"$GITHUB_OUTPUT"

          # Human to @-mention on handoff/escalation: the author of the issue this
          # PR closes (Fixes/Closes/Resolves #N), unless overridden. Bots are
          # skipped — no point pinging the PR's own machine-account author.
          mention="$HANDOFF_MENTION"
          if [ -z "$mention" ]; then
            # Match both `Fixes #N` and the fully-qualified `Fixes owner/repo#N`
            # (the fork mandates the latter — a bare `#N` there silently rebinds
            # to upstream when the branch is promoted). Only resolve a mention
            # when the reference targets THIS repo: a cross-repo `owner/repo#N`
            # points at a different tracker, so its number is meaningless here.
            ref=$(ghr gh pr view "$PR" --repo "$REPO" --json body --jq '.body // ""' \
                    | grep -ioE '(fixes|closes|resolves)[[:space:]]+([-A-Za-z0-9._]+/[-A-Za-z0-9._]+)?#[0-9]+' \
                    | head -1 || true)
            inum=""
            issue_repo="$REPO"
            lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
            if [ -n "$ref" ]; then
              refrepo=$(printf '%s' "$ref" | grep -oiE '[-A-Za-z0-9._]+/[-A-Za-z0-9._]+' || true)
              if [ -z "$refrepo" ] || [ "$(lower "$refrepo")" = "$(lower "$REPO")" ]; then
                inum=$(printf '%s' "$ref" | sed -n 's/.*#\([0-9]\{1,\}\).*/\1/p')
              elif [ -n "${ANCHOR_REPO:-}" ] && [ "$(lower "$refrepo")" = "$(lower "$ANCHOR_REPO")" ]; then
                # companion PR referencing its anchor issue cross-repo
                inum=$(printf '%s' "$ref" | sed -n 's/.*#\([0-9]\{1,\}\).*/\1/p')
                issue_repo="$ANCHOR_REPO"
              fi
            fi
            # Fallback for the MENTION only (closing semantics untouched): a PR
            # may deliberately use a non-closing ref — observed: "Refs ...#103"
            # on a docs-only PR that must not close its issue — so derive the
            # issue from the claude/issue-N-* branch convention when no closing
            # ref matched. On a companion repo the branch number references the
            # ANCHOR repo's tracker — but only when the same branch exists
            # there (this repo's own agent mints identically-shaped names for
            # native issues), so check for the twin before resolving remotely.
            if [ -z "$inum" ]; then
              hb=$(jq -r '.headRefName' <<<"$pr_json")
              inum=$(printf '%s' "$hb" | sed -n 's/^claude\/issue-\([0-9]\{1,\}\)-.*/\1/p')
              if [ -n "$inum" ] && [ -n "${ANCHOR_REPO:-}" ] && \
                 gh api "repos/$ANCHOR_REPO/branches/$hb" --silent >/dev/null 2>&1; then
                issue_repo="$ANCHOR_REPO"
              fi
            fi
            if [ -n "$inum" ]; then
              # Author, unless it's a bot or the machine account (marvin is a
              # User, not a Bot — triage-created issues are marvin-authored);
              # then the first assignee. Never a PR (the /issues/N endpoint
              # returns PRs too — observed pinging an unrelated PR author).
              mention=$(ghr gh api "repos/$issue_repo/issues/$inum" \
                          --jq 'if .pull_request then "" elif (.user.type=="Bot" or .user.login=="i-am-marvin") then (.assignees[0].login // "") else .user.login end' 2>/dev/null || true)
            fi
          fi
          echo "mention=$mention" >>"$GITHUB_OUTPUT"

          # Fetch the PR's comments ONCE, unfiltered, and query the local array
          # below. Filtering with `--paginate --jq` would be wrong here:
          # `--jq` runs PER PAGE, so past 100 comments `... | last` emits one
          # element per page and a "single" body comes back multi-line.
          # `--paginate` output is one merged array on current gh, one array
          # per page on older releases; -s plus `.[][]` flattens either.
          comments=$(ghr gh api "repos/$REPO/issues/$PR/comments" --paginate | jq -s '[.[][]]')

          # Stale-verdict guard: this job fires on the verdict comment but can
          # queue for many minutes behind a ci-fix run (shared per-PR
          # concurrency group, cancel-in-progress: false), and by the time it
          # runs the "latest" verdict may describe a commit that is no longer
          # the tip. Observed inspect_flow#825 (2026-09-09): a clean verdict
          # on the original commit queued its review-fix run behind the
          # ci-fix run; ci-fix pushed a fix and requested re-review; the
          # queued run then read the still-latest clean verdict, declared
          # convergence and pinged the human, who merged — and the real
          # re-review landed a suggestion on a merged PR. Every loop-driven
          # push (ci-fix, the dev agent, this job's fix rounds and their
          # hand-back backstop) ends with a bare re-review request, so a
          # verdict older than the latest such request describes code the
          # reviewer never saw AND has a fresh review pending: skip and let
          # that review's own verdict re-fire the loop. The request-shape
          # test is the caller stub's admission gate (not backticked; not a
          # reviewer-stamped comment) AND the word-bounded token test the
          # reusable reviewer applies before it actually runs a review
          # (claude-review.yml, trig step) — a looser `contains` would count
          # `cc @reviewers` as a pending request and skip with nothing
          # scheduled.
          # Deliberately NOT compared against the tip commit's date: the
          # reviewer never fires on `synchronize`, so a push that arrives
          # WITHOUT a request (a human pushing while this run is queued) has
          # no review pending — skipping there would strand the loop (label
          # on, nothing scheduled, only a job-log line), and a committer clock
          # ahead of GitHub's could skip the verdict for the very commit the
          # reviewer reviewed. Such a push keeps the prior behavior: the
          # verdict is acted on against the new tip.
          summary_json=$(jq -c 'map(select(.body|contains("claude-review-summary"))) | last // empty' <<<"$comments")
          summary=$(jq -r '.body' <<<"${summary_json:-null}")
          verdict=$(printf '%s' "$summary" | sed -n 's/.*claude-review-verdict:\([a-z]*\).*/\1/p')
          if [ -n "$verdict" ]; then
            verdict_at=$(jq -r '.created_at' <<<"$summary_json")
            rereview_at=$(jq -r '[.[] | select((.body|test("(^|\\s)@review(\\s|[,.!?;:]|$)")) and (.body|contains("`@review`")|not) and (.body|contains("<!-- claude-review-comment -->")|not)) | .created_at] | max // ""' <<<"$comments")
            # ISO-8601 UTC timestamps compare correctly as strings; an empty
            # rereview_at (no request yet) never compares greater.
            if [[ "$verdict_at" < "$rereview_at" ]]; then
              echo "Latest verdict '$verdict' ($verdict_at) predates a later re-review request ($rereview_at); that review is pending. Skipping."
              act skip; exit 0
            fi
          fi

          # Deterministic convergence: if the reviewer's latest summary carries a
          # `clean` verdict (no outstanding suggestions), hand off to a human
          # without spending a fix round. An absent verdict (older reviewer, or a
          # caller that overrides review_prompt) falls through to the round-count
          # path below, preserving prior behavior.
          if [ "$verdict" = "clean" ]; then
            echo "Reviewer verdict is clean; converging without a fix round."
            act converged; exit 0
          fi

          # Latest rounds-marker comment, captured once like summary_json above;
          # cid feeds the Record round PATCH, the body the counters below.
          marker_json=$(jq -c --arg m "$MARKER" 'map(select(.body|contains($m))) | last // empty' <<<"$comments")
          cid=$(jq -r '.id // empty' <<<"${marker_json:-null}")
          prev=0
          prevsha=""
          if [ -n "$cid" ]; then
            mbody=$(jq -r '.body // ""' <<<"$marker_json")
            prev=$(printf '%s' "$mbody" | sed -n 's/.*rounds:[[:space:]]*\([0-9]*\).*/\1/p')
            prev=${prev:-0}
            # Branch tip recorded when the previous round started (see Record round).
            prevsha=$(printf '%s' "$mbody" | sed -n 's/.*auto-review-head:\([0-9a-f]*\).*/\1/p')
          fi
          next=$((prev + 1))
          head=$(jq -r '.headRefOid' <<<"$pr_json")
          # Closed-PR continuation: the frozen headRefOid lies; the live tip
          # is what fix rounds push to and what progress is measured by.
          [ -n "$live_tip" ] && head="$live_tip"
          echo "cid=$cid" >>"$GITHUB_OUTPUT"
          echo "round=$next" >>"$GITHUB_OUTPUT"
          echo "head=$head" >>"$GITHUB_OUTPUT"

          # No-progress escalation: the previous fix round pushed no new commit
          # (branch tip unchanged since it was recorded) yet the reviewer still
          # has suggestions. Re-running the agent against an unchanged tree would
          # just repeat itself, so hand off early rather than burning rounds up
          # to the cap. Only meaningful once a prior round recorded a tip; a
          # marker without one (pre-upgrade) skips the check and falls through.
          if [ "$prev" -ge 1 ] && [ -n "$prevsha" ] && [ "$head" = "$prevsha" ]; then
            echo "No new commit since round $prev (tip $head unchanged); escalating for no progress."
            echo "stalled=1" >>"$GITHUB_OUTPUT"
            act escalate; exit 0
          fi
          if [ "$next" -gt "$CAP" ]; then act escalate; else act fix; fi

      # Failsafe: if any of the three gate steps errored (e.g. a transient API
      # failure the retries above couldn't ride out), `act` was never set, so
      # every step below skips and nothing reaches the PR — the loop would
      # stall silently with the label still on. Surface it so a human knows to
      # resume. Kept trigger-free ON PURPOSE: the body must not contain a
      # literal @review or @auto, or this bot-authored comment would re-fire
      # the loop and, on a persistent gate failure, spin (see
      # design/auto-agent.md). The `auto` label is left on so re-running the
      # job or a fresh review resumes cleanly.
      - name: Surface gate failure
        if: >-
          always() &&
          (steps.resolve.outcome == 'failure' || steps.labeler.outcome == 'failure' ||
           steps.gate.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          [ -z "${PR:-}" ] && { echo "No PR number; nothing to surface."; exit 0; }
          gh issue comment "$PR" --repo "$REPO" --body "$(printf '⚠️ auto: the review-fix run errored before it could act (a transient GitHub API failure in a gate step). The loop is paused, not stopped — the label is still on. Re-run the failed job (%s) or post a fresh review request to resume.' "$RUN_URL")" || true

      # Atlas tracking (design/atlas-tracking.md): a review-fix round is the
      # agent working the PR's issue; both @auto exits — converged AND
      # escalated — hand back to a human (there is no Agent →
      # Sign-off; the driver reaches Sign-off by sending it onward). The PR
      # resolves to its issue via claude/issue-N-* (then a Fixes ref).
      - name: Stage - Agent
        if: steps.gate.outputs.act == 'fix'
        uses: meridianlabs-ai/agents/.github/actions/set-stage@main
        with:
          stage: Agent
          token: ${{ secrets.MARVIN_TOKEN }}
          repo: ${{ github.repository }}
          issue: ${{ inputs.pr_number }}
          branch: ${{ steps.gate.outputs.head_branch }}

      - name: Stage - Review (handoff)
        if: steps.gate.outputs.act == 'converged' || steps.gate.outputs.act == 'escalate'
        uses: meridianlabs-ai/agents/.github/actions/set-stage@main
        with:
          stage: Review
          token: ${{ secrets.MARVIN_TOKEN }}
          repo: ${{ github.repository }}
          issue: ${{ inputs.pr_number }}
          branch: ${{ steps.gate.outputs.head_branch }}

      # Reviewer reported no outstanding suggestions: hand off to a human for the
      # final review/merge (@auto never merges). Idempotent so a later clean
      # re-review doesn't re-ping. The `auto` label is left on, so further CI or
      # human-review activity can still re-engage @auto.
      #
      # On a closed-PR continuation (see the gate) the idempotence window
      # starts at the PR's close: the designed flow is converge → handoff →
      # human promotes (closing the PR) → upstream feedback re-engages the
      # loop, so a pre-close handoff comment is near-certain and would
      # otherwise swallow the continuation's own hand-back — the stage would
      # move to Review with no comment and no @-mention, and the operator
      # would learn the loop finished only by polling. Hand-backs posted
      # after the close still dedupe against each other.
      - name: Converged handoff
        if: steps.gate.outputs.act == 'converged'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          MENTION: ${{ steps.gate.outputs.mention }}
          CONTINUATION: ${{ steps.gate.outputs.continuation }}
          CLOSED_AT: ${{ steps.gate.outputs.closed_at }}
          MARKER: "<!-- auto-converged -->"
        run: |
          set -euo pipefail
          # ISO-8601 UTC timestamps compare correctly as strings; an empty
          # $since (open PR) makes every marker comment count, as before.
          # `--paginate` output is one merged array on current gh, one array
          # per page on older releases; -s plus `.[][]` flattens either so
          # the check yields a single true/false. An API failure yields ""
          # and falls through to posting — same as before.
          since=""
          [ "${CONTINUATION:-}" = "true" ] && since="${CLOSED_AT:-}"
          posted=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                     | jq -rs --arg m "$MARKER" --arg since "$since" \
                         'any(.[][]; (.body|contains($m)) and (.created_at > $since))' || true)
          if [ "$posted" = "true" ]; then
            echo "Handoff already posted${since:+ since close ($since)}; skipping."; exit 0
          fi
          ping=""; [ -n "$MENTION" ] && ping="@$MENTION "
          if [ "${CONTINUATION:-}" = "true" ]; then
            ci="this PR is closed, so the checks shown here are the frozen pre-close runs — CI for the live branch tip runs as push-triggered checks on the branch (and, on repos with a promotion flow, on the upstream PR)."
          else
            ci="see the checks above for CI status."
          fi
          gh pr comment "$PR" --repo "$REPO" --body "$MARKER
          ${ping}🤖 auto: the reviewer has no outstanding feedback — this PR has converged. auto never takes the final step (merge, or upstream promotion on the fork), so it's yours now; $ci The \`auto\` label is left on, so auto will still react to new review or CI activity; remove it to disengage."

      # Escalation is three steps in a fixed order — disarm, reset, hand off —
      # and each later one phrases itself on the earlier ones' outcomes
      # (mirror of claude-auto.yml's escalation, same reasoning):
      #   1. Disarm: remove the label. This is the load-bearing part (it is
      #      also what a human does to stop @auto manually), so it goes first
      #      and nothing else is gated on anything but it.
      #   2. Reset the round counter — ONLY if the disarm succeeded. The
      #      counter is a per-PR-lifetime tally, so after a cap escalation
      #      "re-add it to let me keep iterating" would otherwise re-escalate
      #      on the very next review with suggestions (round 11 > 10); a human
      #      re-labeling has decided the loop deserves another full budget.
      #      Gating on the disarm keeps a failed label removal self-limiting,
      #      as it was before the reset existed: the label stays on but the
      #      counter stays exhausted, so the next verdict re-escalates (and
      #      retries the removal) instead of running a fresh budget with no
      #      human decision. The reset body is the shared composite's (no
      #      head marker: the no-progress check needs prev >= 1, so a fresh
      #      budget's first round skips it and records a fresh tip first).
      #   3. Hand off: the comment tells the truth about both — a failed reset
      #      leaves the exhausted counter in place, and promising a fresh
      #      budget then would be exactly the false "re-add it" the reset
      #      exists to fix; a failed disarm is the one case where "re-add it"
      #      is wrong because it was never removed. It also says that re-adding
      #      the label ALONE does nothing here: this loop only fires on the
      #      reviewer's next verdict, so the human must request a fresh review
      #      too (the CI-fix loop needs no such clause — a red run is its
      #      trigger). The post retries (shared post-pr-comment composite) and
      #      runs even if the disarm or reset STEP errored outright
      #      (!cancelled(), not the default success()): by this point the
      #      label may already be gone, so a skipped or transiently failed
      #      comment would leave the PR silently parked with nobody pinged and
      #      only a red job as the trace. Empty disarm/reset outputs (the step
      #      never wrote them) route to the conservative wording — "still
      #      armed", "could not reset".
      # The disarm and the reset are shared composites (AGENTS.md convention:
      # step bodies copied between the loops live in .github/actions/).
      - name: Disarm the loop (escalation)
        if: steps.gate.outputs.act == 'escalate'
        id: disarm
        uses: meridianlabs-ai/agents/.github/actions/disarm-auto-loop@main
        with:
          token: ${{ secrets.MARVIN_TOKEN || github.token }}
          repo: ${{ github.repository }}
          pr: ${{ inputs.pr_number }}
          label: ${{ inputs.auto_label }}

      - name: Reset the round counter (escalation)
        if: steps.gate.outputs.act == 'escalate' && steps.disarm.outputs.disarmed == '1'
        id: reset
        uses: meridianlabs-ai/agents/.github/actions/reset-auto-counters@main
        with:
          token: ${{ secrets.MARVIN_TOKEN || github.token }}
          repo: ${{ github.repository }}
          pr: ${{ inputs.pr_number }}
          counters: rounds
          reason: "on escalation — re-adding `${{ inputs.auto_label }}` starts a fresh budget"

      # Trigger-free ON PURPOSE (like every bot-authored comment here): the
      # re-engagement path is described, never spelled as its literal trigger.
      - name: Compose the hand-off
        if: ${{ !cancelled() && steps.gate.outputs.act == 'escalate' }}
        id: handoff
        env:
          AUTO_LABEL: ${{ inputs.auto_label }}
          CAP: ${{ inputs.review_round_cap }}
          MENTION: ${{ steps.gate.outputs.mention }}
          STALLED: ${{ steps.gate.outputs.stalled }}
          DISARMED: ${{ steps.disarm.outputs.disarmed }}
          RESET_OK: ${{ steps.reset.outputs.ok }}
        run: |
          set -euo pipefail
          if [ "$DISARMED" != "1" ]; then
            clause="I could not remove the \`$AUTO_LABEL\` label (API error), so the loop is still armed — but its round counter is exhausted, so I'll escalate again rather than run. Remove the label by hand to stop me; to let me keep iterating with a fresh budget, re-engage me with an @-mention comment (that re-applies the label, resets both counters and, if it pushes a fix, requests a fresh review)."
          elif [ "$RESET_OK" = "1" ]; then
            clause="Removing the \`$AUTO_LABEL\` label. Re-add it AND request a fresh review to let me keep iterating — I only act on the reviewer's next verdict, so the label alone does nothing. The round counter is reset, so that starts a fresh budget of $CAP."
          else
            clause="Removing the \`$AUTO_LABEL\` label. Re-add it AND request a fresh review to let me keep iterating (I only act on the reviewer's next verdict) — but I could not reset the round counter (API error), so first edit my sticky \"auto review rounds\" comment so the count reads 0, or re-engage me with an @-mention comment instead (that re-applies the label, resets both counters and, if it pushes a fix, requests a fresh review); otherwise I'll escalate again on sight."
          fi
          ping=""; [ -n "$MENTION" ] && ping="@$MENTION "
          if [ "${STALLED:-}" = "1" ]; then
            reason="my last fix round pushed no new changes, so I'm not making progress on the reviewer's remaining feedback"
          else
            reason="the reviewer still has feedback after $CAP review rounds and I haven't converged"
          fi
          printf 'body=%s\n' "${ping}🤖 auto: $reason. Handing this to a human. $clause" >>"$GITHUB_OUTPUT"

      - name: Escalate to human
        if: ${{ !cancelled() && steps.gate.outputs.act == 'escalate' }}
        uses: meridianlabs-ai/agents/.github/actions/post-pr-comment@main
        with:
          token: ${{ secrets.MARVIN_TOKEN || github.token }}
          repo: ${{ github.repository }}
          pr: ${{ inputs.pr_number }}
          body: ${{ steps.handoff.outputs.body }}
          what: escalation hand-off
          failure-hint: >-
            The disarm (disarmed=${{ steps.disarm.outputs.disarmed || 'unknown' }})
            and reset (ok=${{ steps.reset.outputs.ok || 'skipped' }}) above have
            already run, so nobody was told.

      # Check out the PR head (derived above). persist-credentials:false
      # (issue #61): checkout otherwise writes its token into .git/config for
      # the rest of the job — and this job's codex path group-grants the
      # whole workspace to the codex user, which could then read the machine
      # account's PAT off disk. Nothing is persisted now; every later git
      # network call authenticates itself (design/architecture.md → "No
      # persisted git credentials"): the runner-side steps through a
      # step-scoped credential helper, the agent through claude-code-action's
      # own origin-URL credential (its github_token, MARVIN_TOKEN — so the fix
      # push still re-triggers CI and its `@review` comment still re-triggers
      # the reviewer; a GITHUB_TOKEN push/comment would be dropped). The
      # fetch itself is a read, so the job token is enough for it.
      - name: Check out PR branch
        if: steps.gate.outputs.act == 'fix'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.gate.outputs.head_branch }}
          token: ${{ github.token }}
          persist-credentials: false

      # Regression guard for the invariant above (shared composite — one copy
      # for all three workflows): asks git, which follows includes, for the
      # header checkout would have persisted, keyed on the server URL.
      - name: Assert no credential persisted in the workspace
        if: steps.gate.outputs.act == 'fix'
        uses: meridianlabs-ai/agents/.github/actions/assert-no-persisted-credential@main

      # Capture the branch tip before the agent runs so the error-surfacing step
      # can tell whether the agent's work actually landed on the branch — and
      # the start time, so the self-handoff detector below only matches
      # comments this run posted.
      - name: Record base SHA
        if: steps.gate.outputs.act == 'fix'
        id: base
        run: |
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "started=$(date -u +%FT%TZ)" >>"$GITHUB_OUTPUT"

      # ---- Deterministic base-branch sync (design/architecture.md) ---------
      # The base merge happens HERE, on the runner, for BOTH engines — not in a
      # prompt. The codex sandbox holds no credentials and is told not to fetch,
      # so it cannot be asked to merge (instruction, not structure, since its
      # sandbox gained network on 2026-09-09; the in-progress hand-off means it
      # never needs to), and a prompted merge is advisory, so branches drifted
      # anyway: inspect_ai#392 sat 11 commits behind main across 20 commits,
      # and because GitHub cannot compute a merge ref for a conflicted PR, CI
      # never ran and every fix round was written against stale code.
      #
      # A CONFLICTED merge is handed on differently per engine: the Claude path
      # gets a CLEAN index and re-merges inside the agent (it has network and
      # the git allow-list); codex gets the merge still IN PROGRESS and resolves
      # the markers in the tree, and its landing step refuses to push while any
      # survive. In claude.yml the split is forced — tag mode's setupBranch runs
      # `git checkout <branch> --`, which aborts on an unmerged index. This
      # workflow runs the action in agent mode (bare `prompt:`, no
      # track_progress), which does NOT run setupBranch, so the action would
      # tolerate an in-progress merge here. The split is mirrored anyway: one
      # mental model and one merge instruction across all three workflows (here
      # the inline merge_note in "Compose review-fix prompt"; claude.yml's is
      # its branch_sync_prompt input).
      #
      # The step body is the shared sync-branch composite (one copy for all
      # three workflows). checkout stays false: this job's actions/checkout
      # already put the PR head branch in the workspace (the gate handled fork
      # PRs, and a CLOSED PR with a live branch is a continuation the loop
      # deliberately syncs), and "Record base SHA" above stamped its PRE-merge
      # tip — which is what makes a round whose only product is the base
      # merge still count as landable work and push. The job token: the
      # composite only reads (a PR lookup and fetches), and it is what its
      # step-scoped git credential is built from.
      - name: Sync branch with base
        id: sync
        if: steps.gate.outputs.act == 'fix'
        uses: meridianlabs-ai/agents/.github/actions/sync-branch@main
        with:
          pr: ${{ inputs.pr_number }}
          engine: ${{ steps.gate.outputs.engine }}
          token: ${{ github.token }}

      # Provision the project environment BEFORE the fix agent starts, so its
      # pytest/ruff/pyright actually run — the same two steps the reviewer
      # has (claude-review.yml; rationale there and in design/architecture.md
      # → "Provisioning the environment for the verify loop"). Until
      # 2026-09-09 the loops had neither, and the
      # gap was invisible on the Claude engine, which installs what it needs
      # from inside the agent, but total on codex, whose sandbox had NO
      # network until 2026-09-09: every codex fix round ran in a bare
      # checkout — "No module named inspect_ai / pytest / ruff / pyright" —
      # pushed changes verified only by whatever tests import nothing, and
      # finally declined to fix at all (inspect_flow#824, 2026-09-09). Placed
      # after the base sync (so a dependency file the merge touched is what
      # gets installed) and BEFORE the Record round step, mirroring the sync's
      # own ordering: a provisioning failure then SKIPS the agent and the
      # round is never recorded, so nothing needs refunding — the Surface
      # step reports it. Fatal on failure, like the reviewer's: a broken
      # setup must be loud, not a silent static-only fix round.
      #
      # ONE exception: the codex conflict path. sync-branch hands codex the
      # base merge still IN PROGRESS, with conflict markers in the tree, and
      # provisioning runs over that tree — so when pyproject.toml or the
      # lockfile is among the conflicted files the install fails
      # DETERMINISTICALLY, and a fatal failure here would skip the very round
      # that exists to resolve the markers (every re-trigger failing the
      # same way). So when the sync left conflicts (non-empty only on the
      # codex path — the Claude path aborts its conflicted merge), a
      # provisioning failure is tolerated: the round runs static-only, as
      # every codex round did before 2026-09-09, codex is told in its prompt
      # that provisioning failed, and the next round — on the resolved
      # branch — provisions normally. `outcome` still reads `failure` on the
      # tolerated path (only `conclusion` is neutralized), which is what the
      # prompt composer and the Surface step key on.
      - name: Provision project environment
        id: setup
        if: >-
          steps.gate.outputs.act == 'fix' &&
          hashFiles('.github/actions/claude-setup/action.yml', '.github/actions/claude-setup/action.yaml') != ''
        continue-on-error: ${{ steps.sync.outputs.conflicts != '' }}
        uses: ./.github/actions/claude-setup

      # Fallback where claude-setup is absent (PR heads on the inspect_ai
      # fork, whose branches are cut from pristine main; Python caller repos
      # that never added the action — NOT cross-repository fork heads, which
      # never reach this step: the gate above skips `isCrossRepository`
      # PRs): the same provision-fallback composite the reviewer runs (uv
      # version, retry, extras/`--group dev`, PATH and `.venv/`-exclude
      # reasoning in its description) — the exclude matters here because,
      # unlike the reviewer, the Claude-engine agent commits and pushes from
      # this tree. Same conflicted-round tolerance as above.
      - name: Provision project environment (fallback)
        id: setupfb
        timeout-minutes: 10
        if: >-
          steps.gate.outputs.act == 'fix' &&
          hashFiles('.github/actions/claude-setup/action.yml', '.github/actions/claude-setup/action.yaml') == '' &&
          hashFiles('pyproject.toml') != ''
        continue-on-error: ${{ steps.sync.outputs.conflicts != '' }}
        uses: meridianlabs-ai/agents/.github/actions/provision-fallback@main

      - name: Record round
        if: steps.gate.outputs.act == 'fix'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          CID: ${{ steps.gate.outputs.cid }}
          ROUND: ${{ steps.gate.outputs.round }}
          CAP: ${{ inputs.review_round_cap }}
          HEAD: ${{ steps.gate.outputs.head }}
          MARKER: "<!-- auto-review-rounds -->"
        run: |
          set -euo pipefail
          # The auto-review-head marker records the branch tip at the START of
          # this round; next round's gate compares against it to detect a fix
          # round that pushed nothing (no-progress escalation).
          body="$MARKER
          🤖 auto review rounds: $ROUND (cap $CAP).
          <!-- auto-review-head:$HEAD -->"
          if [ -n "$CID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$CID" -f body="$body" --silent
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" --silent
          fi

      - name: Compose review-fix prompt
        if: steps.gate.outputs.act == 'fix'
        id: prompt
        env:
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          ROUND: ${{ steps.gate.outputs.round }}
          CAP: ${{ inputs.review_round_cap }}
          AGENT_MERGE: ${{ steps.sync.outputs.agent_merge }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          SYNC_BASE: ${{ steps.sync.outputs.base }}
          SYNC_APPEND: ${{ inputs.branch_sync_append }}
          CONTINUATION: ${{ steps.gate.outputs.continuation }}
        run: |
          # Live-branch continuation (see the gate): without this note the
          # fix agent discovers a CLOSED PR cold and may plausibly conclude
          # there is nothing to do — the class of misreading the continuation
          # flow exists to fix. Mirrors the reviewer prompt's NOTE, and
          # overrides the handoff's mergeability and CI reports, both of
          # which read the frozen pre-close state on a closed PR.
          note=""
          if [ "${CONTINUATION:-}" = "true" ]; then
            note=" NOTE — closed-PR continuation: PR #$PR is CLOSED but still auto-labeled with a live branch (on repos with a promotion flow this means it was promoted upstream and pushes to this branch update the upstream PR's diff). The checked-out branch is the loop's working surface, not a dead PR: address the feedback and push to the current branch as usual. Two handoff adjustments: mergeable/mergeStateStatus is meaningless on a closed PR, so skip that report; and \`gh pr checks\` reflects the FROZEN pre-close head (PR checks never re-run for post-close pushes, so 'this re-runs CI' does not apply here either) — skip it too. Instead note that CI and merge/promotion of the continued work happen on the upstream PR (or as push-triggered checks on the branch tip), outside this loop."
          fi
          # The merge instruction is spliced only when "Sync branch with base"
          # could not land the merge itself — it aborts a conflicted merge to
          # hand the Claude path a clean index (see that step's comment), so
          # on that path the agent does the merge. The caller's
          # branch_sync_append reaches the agent on
          # EITHER path: the fork's is about a non-conflicting CHANGELOG
          # mis-merge, so a clean runner merge is exactly when it applies.
          merge_note=""
          if [ "${AGENT_MERGE:-}" = "1" ]; then
            merge_note=" FIRST TASK, before any of the above: this branch conflicts with its base branch $SYNC_BASE, and a workflow step could not merge it for you. Merge origin/$SYNC_BASE into this branch and resolve every conflict, preserving both sides' intent — the base side is other people's merged work, so never resolve by discarding it wholesale — then include that merge when you push. Until that lands GitHub cannot compute a merge ref for this PR, so CI does not run and anything else you do here is unverified."
            # Flattened: a newline would corrupt the value= output line below.
            [ -n "${SYNC_APPEND:-}" ] && merge_note="$merge_note $(tr '\n' ' ' <<<"$SYNC_APPEND")"
          elif [ -n "${MERGE_SHA:-}" ] && [ -n "${SYNC_APPEND:-}" ]; then
            merge_note=" NOTE: a workflow step already merged origin/$SYNC_BASE into this branch before you started (a clean merge, no conflicts). Review that merge result against the following before your other changes, and fix it in your commit if it is off: $(tr '\n' ' ' <<<"$SYNC_APPEND")"
          fi
          printf 'value=%s\n' "You are @auto addressing automated-review feedback on PR #$PR in $REPO (review round $ROUND of $CAP). Read the reviewer's latest summary and any inline review comments with gh: \`gh pr view $PR --comments\`, \`gh api repos/$REPO/pulls/$PR/reviews\`, and \`gh api repos/$REPO/pulls/$PR/comments\`. Your goal is to leave the PR in the best shape you reasonably can, so address the feedback thoroughly — this INCLUDES minor and explicitly non-blocking suggestions (nits, naming, small refactors, reuse/DRY cleanups, doc fixes). Do NOT skip a suggestion just because the reviewer marked it non-blocking or 'not worth blocking on'; if it is a reasonable improvement, make it. The only items to leave unaddressed are ones you genuinely disagree with, that are clearly out of scope for this PR, or that are not a net improvement — for each of those, reply to that specific comment with a brief rationale instead of changing code. Verify your changes (run the relevant pytest/ruff/mypy). If you made any changes, commit and push to the current branch as the machine account (this re-runs CI), then post a single top-level comment of exactly \`@review\` to request re-review. EXCEPTION — documentation-only nit round: if EVERY suggestion you acted on this round was explicitly minor/non-blocking (nit-level) AND every change you pushed is documentation-only (markdown/doc files, code comments, docstrings — zero behavioral code change), do NOT post the re-review request — another review round would just re-read prose. Instead declare the loop done: hand off to a human as described below, noting the round was doc-only nits. ENVIRONMENT (mandatory): your work exists ONLY on this ephemeral runner until committed and pushed, and a run can NEVER resume after your final turn — background tasks do not re-invoke you and their completion notifications never arrive, so never end your turn waiting on anything (subagents, background commands, test suites): collect results in the foreground, and if a final validation is long-running, commit and push FIRST and let the PR's own CI be the gate (observed loss: a fix round ended with tests 'running in the background' and everything evaporated with the runner). ENDING CONTRACT (mandatory): a run that pushed ANY commit must end with exactly ONE of the two hand-backs — the \`@review\` re-review comment, or the doc-only exception's handoff comment. Pushing and posting neither is never permitted: it strands the board at Agent with nothing running, because the loop's only stage transitions come from reviewer verdicts and handoff markers. After pushing, resolve the inline review threads you fully addressed in code, so settled feedback is visibly closed: list threads via \`gh api graphql\` (query \`repository.pullRequest.reviewThreads\` — each node has an \`id\`, \`isResolved\`, and its \`comments\`), then for each thread you resolved in code run the \`resolveReviewThread\` mutation, e.g. \`gh api graphql -f query='mutation(\$id:ID!){resolveReviewThread(input:{threadId:\$id}){thread{isResolved}}}' -F id=<threadId>\`. Leave UNRESOLVED any thread you deliberately declined (the one you replied to with a rationale) so a human can adjudicate it, and never resolve a thread you did not actually address. Hand off to a human ONLY when nothing remains worth improving — i.e. the review is clean/approving, every remaining suggestion is one you have deliberately declined with a posted rationale, or you completed a documentation-only nit round (above). To hand off: check CI with \`gh pr checks $PR\` and mergeability with \`gh pr view $PR --json mergeable,mergeStateStatus\`, then post ONE comment whose FIRST line is exactly \`<!-- auto-handoff -->\` (the workflow moves the board stage on that marker), followed by a summary of what you addressed and anything you intentionally declined (and why), with the current CI and mergeable status, and @-mention the PR's originating human (the author of the issue referenced by \"Fixes #<n>\" in the PR body, if any). Do NOT merge — auto hands the final step to a human. In any comment you post here, refer to this automation as \`auto\` without an @ prefix; a literal @auto would re-trigger the loop. The same discipline applies to the review trigger: the ONLY place you may write that token bare is the single exact re-review request comment described above — anywhere else in comment prose, backtick it (\`@review\`), because your comments post as a write-access account and a bare token anywhere in the body starts a review run. The loop's marker substrings get the same discipline: never write claude-review-summary, claude-review-verdict, claude-review-comment, auto-review-rounds, auto-review-head, or auto-fix-attempts verbatim in any comment you post — the loop matches them by plain substring, so quoting a reviewer verdict comment verbatim would forge a verdict; when referencing one, break it (e.g. 'claude-review summary'). Likewise never write the codex reviewer's footer 'engine: codex' verbatim: it and the review-comment marker are how the codex fix rounds locate the newest review, so a comment of yours carrying either would be mistaken for the review. The auto-handoff marker is legitimate ONLY as the first line of the single handoff comment described above; never quote it elsewhere. Skip posting if an equivalent handoff comment already exists.${note}${merge_note}" >>"$GITHUB_OUTPUT"

      # The agent's own pushes authenticate through the action: its prepare
      # step (agent mode too — configureGitAuth in src/modes/agent/index.ts)
      # rewrites the origin URL to carry github_token, so `git push origin`
      # inside the agent runs as the machine account with nothing persisted
      # by checkout. The GIT_CONFIG_* env is belt and braces for that
      # (issue #61 asked for it as the fallback): a credential helper that
      # answers a 401 from the same token, for any git call that does not go
      # through the rewritten origin URL. URL credentials take precedence
      # over helpers, so it never changes the push identity — and it adds
      # nothing to the agent's reach: the same token is already in its
      # environment as GITHUB_TOKEN (that is what its `gh` calls use). The
      # helper is scoped to this server's URL, so a `git fetch` the agent
      # aims at any other host gets no credential.
      - uses: anthropics/claude-code-action@v1
        if: steps.gate.outputs.act == 'fix' && steps.gate.outputs.engine != 'codex'
        id: claude
        env:
          GIT_TOKEN: ${{ secrets.MARVIN_TOKEN }}
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.${{ github.server_url }}.helper
          GIT_CONFIG_VALUE_1: '!f() { echo username=x-access-token; echo "password=$GIT_TOKEN"; }; f'
        with:
          anthropic_federation_rule_id: fdrl_01GpNgJm9jE6ZfvcqoJYQL2Y
          anthropic_organization_id: be5d0086-bc43-45d2-9184-20ecdd647aa7
          anthropic_service_account_id: svac_01RL4wYD7ikbypwYKf4wFojv
          anthropic_workspace_id: wrkspc_01RKCQ5DTPBatQ7kHLkaEueD
          github_token: ${{ secrets.MARVIN_TOKEN }}
          prompt: ${{ steps.prompt.outputs.value }}
          # The trigger actor is the reviewer bot, so lift claude-code-action's
          # default non-human-actor guard for that one bot (never '*'). The gate
          # above did the real authorization.
          allowed_bots: "claude"
          settings: ${{ inputs.settings }}
          claude_args: >-
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
            ${{ inputs.model != '' && inputs.fallback_model != '' && format('--fallback-model {0}', inputs.fallback_model) || '' }}
            ${{ inputs.append_system_prompt != '' && format('--append-system-prompt {0}', toJSON(inputs.append_system_prompt)) || '' }}

      # The action leaves MARVIN_TOKEN in remote.origin.url; reset the URL so
      # the later runner-side fetches (backstop, hand-back, Surface) reach
      # their own step-scoped helpers — git never consults a helper when the
      # URL carries a credential — and so the PAT does not sit in .git/config
      # for the rest of the job. Same identity either way here (this loop
      # always has MARVIN_TOKEN); hygiene, and one mechanism across the three
      # workflows. always(): a failed agent leaves the URL rewritten too.
      - name: Reset origin URL after the agent
        if: always() && steps.claude.outcome != 'skipped'
        uses: meridianlabs-ai/agents/.github/actions/reset-origin-url@main

      # If the runner's base merge is STILL the branch tip, the agent finished
      # without committing anything of its own and nothing else will push it.
      # Land it anyway: restoring the PR to mergeable is what lets GitHub
      # compute a merge ref again, which is what lets CI run at all. Gated on
      # HEAD being EXACTLY that merge commit, so an agent that committed on top
      # — pushed, or deliberately not — is never second-guessed. always(), so a
      # failed or cancelled agent still leaves the branch current.
      # Shared push-base-merge composite (exact-SHA gate, non-fast-forward
      # guard, push). push-token is the machine account: nothing is persisted
      # by this job's checkout, so the composite authenticates its own push
      # (step-scoped), and it must run as marvin to re-trigger CI. The gate
      # already guaranteed the secret is set on this path.
      # The id is for "Surface agent errors": without it a failed push here is
      # misdiagnosed — the runner's merge sits in rev-list BASE_SHA..HEAD while
      # origin still equals BASE_SHA, so the unlanded-work check would blame
      # the agent for edits it never made.
      - name: Push base merge if unpushed
        id: backstop
        if: >-
          always() && steps.gate.outputs.act == 'fix' &&
          steps.gate.outputs.engine != 'codex' && steps.sync.outputs.merge_sha != ''
        uses: meridianlabs-ai/agents/.github/actions/push-base-merge@main
        with:
          branch: ${{ steps.gate.outputs.head_branch }}
          merge_sha: ${{ steps.sync.outputs.merge_sha }}
          push-token: ${{ secrets.MARVIN_TOKEN }}

      # ---- Codex engine fix round (design/codex-engine.md) -------------------
      # No GitHub credentials in the codex sandbox, so the review feedback is
      # pre-fetched into the prompt file and the landing (commit/push/post) is
      # deterministic. The existing backstops then close the loop: a push with
      # no hand-back gets the @review from "Ensure hand-back after push"; a
      # no-change round posts the auto-handoff marker the selfhandoff detector
      # stages. Review-thread resolution runs on codex's word after the push
      # (the resolve-reported-threads composite below).
      #
      # The PR-thread sections of the codex prompt (top-level comments
      # filtered and anchored on the newest review round, review threads by
      # state) come from the shared composite — the same jq the dev verb
      # embeds, so the two cannot drift — written to a file the prep step
      # cats. A failed fetch fails this step (retry-then-fail inside), which
      # skips the prep and the agent: the Surface step names it and the
      # infra-crash refund treats it like a failed prep.
      - name: Fetch PR thread for codex prompt
        id: codexfeedback
        if: steps.gate.outputs.act == 'fix' && steps.gate.outputs.engine == 'codex'
        uses: meridianlabs-ai/agents/.github/actions/pr-feedback-context@main
        with:
          token: ${{ secrets.MARVIN_TOKEN || github.token }}
          repo: ${{ github.repository }}
          pr: ${{ inputs.pr_number }}
          out: ${{ runner.temp }}/codex-feedback.md

      - name: Prepare codex fix context
        id: codexprep
        if: steps.gate.outputs.act == 'fix' && steps.gate.outputs.engine == 'codex'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          ROUND: ${{ steps.gate.outputs.round }}
          CONFLICTS: ${{ steps.sync.outputs.conflicts }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          SYNC_BASE: ${{ steps.sync.outputs.base }}
          SYNC_APPEND: ${{ inputs.branch_sync_append }}
          CAP: ${{ inputs.review_round_cap }}
          CONTINUATION: ${{ steps.gate.outputs.continuation }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          SETUPFB_OUTCOME: ${{ steps.setupfb.outcome }}
        run: |
          set -euo pipefail
          git config user.name "i-am-marvin"
          git config user.email "i-am-marvin@users.noreply.github.com"
          # What the sandbox actually has depends on what the provisioning
          # steps did: both are conditional (no claude-setup and no
          # pyproject.toml means neither ran), and on a conflicted round a
          # failure is tolerated rather than fatal (see the provisioning
          # steps) — so the verification instruction says which case it is
          # instead of asserting a venv that may not exist. The tools go in
          # by ABSOLUTE path: under the unprivileged-user strategy
          # codex-action launches codex via `sudo -u codex` (no -E), and
          # sudo's env_reset/secure_path replaces PATH before codex starts,
          # so the venv does NOT resolve as bare names there (inspect_flow#818
          # dev run, 2026-09-09; the reviewer's Create codex user step has
          # said as much since 2026-09-01). This step runs as the runner with
          # the provisioned PATH in effect, so discover here.
          if [ "${SETUP_OUTCOME:-}" = "success" ] || [ "${SETUPFB_OUTCOME:-}" = "success" ]; then
            tools=""
            for t in pytest ruff mypy pyright python3; do
              path=$(command -v "$t" 2>/dev/null || true)
              [ -n "$path" ] && tools="$tools$t=$path "
            done
            verify="Verify your changes with the locally provisioned tools where relevant. Your process runs under sudo with a reset PATH, so bare command names will NOT resolve — invoke them by these ABSOLUTE paths: ${tools:-none discovered}."
          elif [ "${SETUP_OUTCOME:-}" = "failure" ] || [ "${SETUPFB_OUTCOME:-}" = "failure" ]; then
            verify="NOTE: environment provisioning FAILED before you started (on this conflicted round the likely cause is a conflicted dependency file — pyproject.toml or a lockfile — see the merge conflict task below), so pytest and the project's dependencies are probably NOT installed. Resolve the merge conflict first; THEN you may provision them yourself (network is available inside your sandbox): create .venv in the project root and dev-install the project into it (e.g. /usr/bin/python3 -m venv .venv && .venv/bin/pip install -e '.[dev]' — .venv/ and *.egg-info/ are already git-excluded; keep it to that). If that fails too, verify as far as the bare runner allows (py_compile, reading the code) and state plainly in your final message that verification was static-only this round — the next round provisions normally once the resolved branch is pushed."
          else
            verify="Verify your changes locally (pytest/ruff/mypy) where relevant and available — no project environment was provisioned for this checkout (no claude-setup action and no pyproject.toml)."
          fi
          {
            echo "You are auto, addressing automated-review feedback on PR #$PR in $REPO (review round $ROUND of $CAP), running on the Codex engine in a local checkout of the PR's head branch."
            # Same continuation note as the Claude fix prompt: the codex
            # agent cannot query PR state itself, but the embedded comments
            # below may mention the close, so pre-empt the "closed PR,
            # nothing to do" misreading here too.
            if [ "${CONTINUATION:-}" = "true" ]; then
              echo "NOTE — closed-PR continuation: PR #$PR is CLOSED but still auto-labeled with a live branch (on repos with a promotion flow this means it was promoted upstream and pushes to this branch update the upstream PR's diff). The checked-out branch is the loop's working surface, not a dead PR — address the feedback as usual."
            fi
            echo "CONSTRAINTS: you have NO GitHub credentials — nothing you run can push or post, and you must NOT run gh, git fetch or git push at all (an anonymous fetch might succeed on a public repo; do not try it — the checked-out tree is the one to work on). Network access IS available inside your sandbox for package downloads and test fixtures (install into the project venv if a tool is missing; keep installs minimal, never install from a git+ URL — an editable VCS install clones a repo into the venv, and a nested checkout fails the run — and do not edit dependency files the task does not call for), but nothing you do can push to or post on GitHub. Edit the working tree on the checked-out branch only — do NOT create or switch branches or check out other commits. Committing locally is unnecessary but harmless (the landing step lands local commits too); a deterministic workflow step commits leftover edits, pushes, and posts the re-review request for you. $verify"
            if [ -n "${CONFLICTS:-}" ]; then
              echo "MERGE CONFLICT RESOLUTION — do this FIRST, before the task below. A merge of origin/$SYNC_BASE into this branch is already IN PROGRESS in your working tree and conflicts in these files:"
              sed 's/^/  /' <<<"$CONFLICTS"
              [ -n "${SYNC_APPEND:-}" ] && echo "$SYNC_APPEND"
              echo "Resolve every conflict by editing those files, preserving BOTH sides' intent — the base side is other people's merged work, so never resolve by discarding it wholesale. Local git is available and useful here (git status, git diff, git log, git add <file>); the GitHub-facing commands the CONSTRAINTS above forbid (gh, git fetch, git push) stay forbidden, and you must NOT run git merge, git rebase or git checkout of any ref — that would strand the in-progress merge. After resolving each file you MUST stage it with git add <file>: the landing step FAILS the run on any path still unmerged in the index (that index check is what catches binary and modify/delete conflicts, which have no markers), and on any surviving conflict marker — so leaving either is strictly worse than resolving and staging. Once resolved, treat the MERGED tree as the code you are working on: re-run the relevant tests against it, not against the pre-merge state."
            elif [ -n "${MERGE_SHA:-}" ] && [ -n "${SYNC_APPEND:-}" ]; then
              # Clean merge: the repo-specific merge rule still applies (the
              # fork's is about a NON-conflicting CHANGELOG mis-merge).
              echo "BASE MERGE NOTE: a workflow step already merged origin/$SYNC_BASE into this branch before you started (a clean merge, no conflicts). Review that merge result against the following before the task below, and fix it in the working tree if it is off:"
              echo "$SYNC_APPEND"
            fi
            echo "Address the feedback thoroughly — including minor and explicitly non-blocking suggestions. Leave unaddressed only what you genuinely disagree with or is out of scope, and say why in your final message."
            echo "ENDING CONTRACT: your final message MUST start with a single conventional-commit summary line for your changes (it becomes the commit subject), then a blank line, then a body listing what you addressed and anything you deliberately declined with rationale (it is posted as a comment). If nothing needs changing, leave the tree untouched and explain why. If the prompt has a REVIEW THREADS section, end the body with ONE final line of exactly the form RESOLVED-THREADS: <thread-id> <thread-id> ... (all ids on that same line, space-separated) naming the OPEN threads (their thread-id values from that section) whose feedback you FULLY addressed in code this round — or RESOLVED-THREADS: none. Never list a thread you declined, only partly addressed, or answered with rationale instead of a change: a workflow step resolves exactly the threads on that line, on your word, and only if your changes were pushed."
            echo ""
            # RECENT PR COMMENTS (filtered, anchored on the newest review
            # round, bounded tail) and REVIEW THREADS (by state, OPEN with
            # thread ids) — written by the pr-feedback-context composite
            # step above; the filter and renderer rationale lives there.
            cat "$RUNNER_TEMP/codex-feedback.md"
          } >"$RUNNER_TEMP/codex-context.md"
          # The review feedback IS this round's task, and the verdict
          # comment that triggered the run guarantees at least one PR
          # comment exists — so with outright fetch failures failing the
          # composite step with the real error in the log (here and in the
          # dev-verb compose alike), an empty feedback section can only be a
          # fetch that returned wrong data while exiting 0. Proceeding
          # would spend the round on a feedback-less prompt and conclude the
          # loop on missing context; fail loud instead — a codexprep failure
          # routes into the existing error surfacing and the round refund.
          # NOT `sed … | grep -q` (the original shape): grep -q exits on
          # its first match and closes the pipe, sed then fails flushing
          # what it still had buffered ("couldn't flush stdout: Broken
          # pipe"), and under pipefail the pipeline's status is sed's — so
          # a feedback section large enough to outrun grep read as "no
          # comments" and failed a healthy round (inspect_ai#428 round 7,
          # 2026-09-09: 55 comments, long review). Same SIGPIPE hazard the
          # head -c note below already avoids; extract to a file, then
          # grep the file — no writer ever sees a closed pipe.
          sed -n '/^RECENT PR COMMENTS/,/^REVIEW THREADS/p' \
              "$RUNNER_TEMP/codex-context.md" >"$RUNNER_TEMP/codex-feedback-section.md"
          if ! grep -q '^--- ' "$RUNNER_TEMP/codex-feedback-section.md"; then
            echo "::error::review-feedback section is empty — either the fetch returned no comments (transient gh/API failure?) or the machine-comment filter removed every one (a review posted in a shape the filter drops? see the jq in the pr-feedback-context composite) — failing the round rather than running codex without the feedback"
            exit 1
          fi
          # Cap + de-fang from the completed scratch file, NOT in one pipeline
          # with the writers above: with the group piped straight into head -c,
          # the cap being hit mid-group leaves the next writer (a plain echo)
          # facing a closed pipe — SIGPIPE kills the group subshell (or, with
          # SIGPIPE ignored, set -e catches the write error) and pipefail fails
          # the step, data-dependently. Reading a file, no writer ever sees a
          # closed pipe. (The sed is belt-and-braces with the landing step's
          # output de-fang: the embedded comments include the reviewer's
          # verdict comments, and a marker substring codex never sees is one
          # it cannot echo; the substitutions are length-neutral. The
          # review-comment anchor marker and the codex reviewer's engine
          # footer are in the list too: the pr-feedback-context composite has
          # already anchored on them, and a fix summary that echoed either
          # would be a false anchor for a later round on this PR.)
          head -c 120000 "$RUNNER_TEMP/codex-context.md" \
            | sed -E -e 's/claude-review-(summary|verdict|comment)/claude-review \1/g' \
                     -e 's/engine: codex/engine  codex/g' \
                     -e 's/auto-(handoff|review-rounds|review-head|fix-attempts)/auto \1/g' >.codex-prompt.md
          #
          # The landing step stages with a blanket `git add -A`, so exclude
          # the prompt file and the scratch codex's verification runs leave
          # behind on repos whose .gitignore doesn't cover it (caches, venvs,
          # the egg-info a setuptools editable install — claude-setup's or
          # the fallback's — writes into the source tree).
          printf '%s\n' .codex-prompt.md .venv/ venv/ '*.egg-info/' __pycache__/ \
            .pytest_cache/ .mypy_cache/ .ruff_cache/ .coverage node_modules/ \
            >>.git/info/exclude

      # codex-action's default safety-strategy (drop-sudo) chmods root-owned
      # service sockets under /run, breaking D-Bus -> systemd-resolved -> DNS;
      # the hosted runner then dies with "lost communication" 52-65 minutes
      # into the job (openai/codex-action#160; observed twice at ~62 min on
      # inspect_ai#389, 2026-08-31). Until fixed upstream, run codex as a
      # dedicated unprivileged user — the README's other blessed strategy for
      # permission profiles: containment is the user boundary plus the
      # profile sandbox, and the API key stays out of reach (codex has no
      # sudo). The user/grant recipe — pre-codex .git/config and embedded-
      # repo snapshots for the reclaim step, the action's
      # examples/unprivileged-user.yml chown/g+rwX, the codex-owned output
      # dir under RUNNER_TEMP, git safe.directory, and network ON in the
      # sandbox (design/codex-engine.md → Network) — is the shared
      # create-codex-user composite; its description carries the rationale
      # for each. Step name and id are load-bearing: the reclaim step gates
      # on `steps.codexuser.outcome`.
      - name: Create codex user
        id: codexuser
        if: steps.gate.outputs.act == 'fix' && steps.gate.outputs.engine == 'codex'
        uses: meridianlabs-ai/agents/.github/actions/create-codex-user@main

      - name: Run Codex fix
        id: codexfix
        if: steps.gate.outputs.act == 'fix' && steps.gate.outputs.engine == 'codex'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          safety-strategy: unprivileged-user
          codex-user: codex
          model: ${{ inputs.codex_model }}
          effort: ${{ inputs.codex_effort }}
          permission-profile: workspace_net
          allow-bot-users: "claude"
          prompt-file: .codex-prompt.md
          output-file: ${{ runner.temp }}/codex/codex-final.md

      # FIRST step after codex had write access to the tree, on every path
      # (always(): success, failure, cancelled): take .git back from the
      # codex user, refuse a redirected git dir (.git/commondir, symlinked
      # .git), and restore the pre-codex .git/config that `Create codex user`
      # snapshotted (design/codex-engine.md → Hook-safe landing). Runs BEFORE
      # the guard and the landing so that every later step — guard, landing,
      # the hand-back fetch, Surface — reads a clean config regardless of how
      # codex, the guard or the landing ended; when this lived inside the
      # landing step, a failed guard or a landing refusal left the hand-back
      # step's `git fetch` running through codex's config (remote URL,
      # core.sshCommand) with MARVIN_TOKEN in its env. Runs no git itself.
      - name: Reclaim workspace from codex
        id: codexreclaim
        if: always() && steps.codexuser.outcome == 'success'
        uses: meridianlabs-ai/agents/.github/actions/reclaim-codex-workspace@main

      # Token split for the codex run: the CLI's step-log "tokens used" is one
      # blended number (non-cached input + output), so this reads the session
      # rollout codex wrote under its CODEX_HOME and puts input / cached /
      # output / reasoning counts and the model that served in the job
      # summary — the codex counterpart of Model provenance below. Runs right
      # after codex, before landing, so a landing failure can't hide the
      # spend. Best-effort: the script exits 0 on every path, and
      # continue-on-error makes that structural — a failure here must never
      # trip the landing step's implicit success() gate and strand the work.
      - name: Codex usage
        if: always() && steps.gate.outputs.act == 'fix' && steps.gate.outputs.engine == 'codex'
        continue-on-error: true
        uses: meridianlabs-ai/agents/.github/actions/codex-usage@main
        with:
          requested-model: ${{ inputs.codex_model }}
          requested-effort: ${{ inputs.codex_effort }}

      # Unresolved-merge guard (shared composite): the landing step's `git add
      # -A` would happily stage conflict markers and `git commit` would then
      # produce a valid merge commit containing them, so this check is the
      # only thing between a half-resolved merge and the PR branch. A separate
      # step so the landing step below is skipped, not entered, on failure;
      # the Surface step reads this step's outcome. Also gated on the reclaim:
      # a refused (redirected) git dir must not be read at all.
      - name: Guard against an unresolved merge (codex)
        id: codexguard
        if: steps.codexfix.outcome == 'success' && steps.codexreclaim.outcome == 'success'
        uses: meridianlabs-ai/agents/.github/actions/unresolved-merge-guard@main
        with:
          conflicts: ${{ steps.sync.outputs.conflicts }}

      # First credentialed step after codex had write access to the
      # workspace. The reclaim step above already took .git back and restored
      # the pre-codex .git/config (remote URLs, credential/http keys, filter
      # drivers, fsmonitor, hooksPath — anything codex wrote there is gone),
      # and this step trusts nothing else under .git (design/codex-engine.md
      # → hook-safe landing): the git dir is pinned by env
      # (GIT_DIR/GIT_COMMON_DIR/GIT_WORK_TREE), so a .git/commondir file
      # could not redirect git to a config codex owns even if the reclaim's
      # refusal had missed it (gitrepository-layout(5): that file sets
      # GIT_COMMON_DIR unless the env already does), and the GIT_CONFIG_* env
      # below re-pins the two things a config restore cannot: hooks live as
      # FILES in .git/hooks, so hooksPath points at an empty, runner-only
      # path; and the index may carry the fsmonitor extension, so fsmonitor
      # is off. The reclaim already moved .git/hooks aside and appended the
      # same two keys to the restored config for every later step; the env
      # pin here is belt and braces on the step that pushes. GIT_CONFIG_GLOBAL
      # skips the runner's ~/.gitconfig as well: codex is in the runner
      # group, and a group-writable home file would sit outside the restore
      # (the hosted image ships it runner-only; this makes that structural —
      # identity for the commit is in the repo config the reclaim restored).
      # The credential helper is the machine account — the push must
      # re-trigger CI, and the gate above already exited on a missing
      # MARVIN_TOKEN, so there is no job-token fallback here — it is scoped
      # to this server's URL, and it lives only in this step's environment.
      - name: Land codex fix
        id: codexland
        if: steps.codexguard.outcome == 'success'
        env:
          PR: ${{ inputs.pr_number }}
          OUT: ${{ runner.temp }}/codex/codex-final.md
          START_SHA: ${{ steps.base.outputs.sha }}
          HEAD_BRANCH: ${{ steps.gate.outputs.head_branch }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          GIT_DIR: ${{ github.workspace }}/.git
          GIT_COMMON_DIR: ${{ github.workspace }}/.git
          GIT_WORK_TREE: ${{ github.workspace }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TOKEN: ${{ secrets.MARVIN_TOKEN }}
          GIT_CONFIG_COUNT: "4"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.${{ github.server_url }}.helper
          GIT_CONFIG_VALUE_1: '!f() { echo username=x-access-token; echo "password=$GIT_TOKEN"; }; f'
          GIT_CONFIG_KEY_2: core.hooksPath
          GIT_CONFIG_VALUE_2: ${{ runner.temp }}/no-hooks
          GIT_CONFIG_KEY_3: core.fsmonitor
          GIT_CONFIG_VALUE_3: "false"
        run: |
          set -euo pipefail
          # MERGE_HEAD too: a conflict resolution staged byte-identical to
          # HEAD ("ours" on every hunk) leaves status clean while the merge
          # is still in progress — commit anyway so the merge completes,
          # HEAD moves past START_SHA, and the push gate lands it.
          # --ignore-submodules=dirty: never spawn `git status` inside an
          # embedded repo (is_submodule_modified) — its nested .git/config
          # is codex-writable and outside the restore and the pins. The
          # reclaim step already refuses a nested repo codex added; this is
          # belt and braces, and `dirty` (unlike `all`) still reports a
          # changed gitlink pointer. `git add -A` below cannot be pinned the
          # same way, which is why the refusal is the primary defence.
          if [ -n "$(git status --porcelain --ignore-submodules=dirty)" ] || git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            # || true inside the substitution: without it a missing/unreadable
            # $OUT fails the pipeline and set -e kills the step before the
            # fallback is reached — the fallback would only ever cover an
            # empty first line.
            subject=$(head -n1 "$OUT" 2>/dev/null | cut -c1-120 || true)
            [ -n "$subject" ] || subject="codex: address review feedback on PR #$PR"
            git add -A
            git commit --quiet -m "$subject" -m "Co-Authored-By: Codex <noreply@openai.com>"
          fi
          # Landable work = HEAD moved since round start, not just a dirty
          # tree: the prompt calls local commits unnecessary but they are
          # possible, and a status-only check would silently discard them
          # with the runner. Explicit refspec so the PR head branch is what
          # gets updated even if codex left HEAD on some other local branch;
          # a diverted HEAD that isn't genuinely new work fails the push
          # non-fast-forward — loud, not lossy.
          pushed=""
          merge_only=""
          if [ "$(git rev-parse HEAD)" != "$START_SHA" ]; then
            git push --quiet origin "HEAD:refs/heads/$HEAD_BRANCH"
            pushed=1
            # HEAD still exactly the runner's clean base merge: codex changed
            # nothing (any commit above would have moved it). The push itself
            # is what restores CI (a computable merge ref); a re-review would
            # only re-read the same code codex just declined to change, so
            # this round is treated like a no-change round below and
            # concludes with the hand-off. That also keeps the gate's
            # no-progress escalation honest: a re-review here would let the
            # moved tip read as progress on every round the base moves.
            [ -n "${MERGE_SHA:-}" ] && [ "$(git rev-parse HEAD)" = "$MERGE_SHA" ] && merge_only=1
            echo "pushed $(git rev-parse --short HEAD) to $HEAD_BRANCH${merge_only:+ (base merge only)}"
          fi
          # The two steps below (thread resolution, summary comment) run no
          # git: they key on these outputs instead of re-deriving them.
          echo "pushed=$pushed" >>"$GITHUB_OUTPUT"
          echo "merge_only=$merge_only" >>"$GITHUB_OUTPUT"

      # Codex cannot run gh, so the review threads it reports as fully
      # addressed (the RESOLVED-THREADS: line of its final message) are
      # resolved here on its word — rationale, guards and format tolerance
      # in the composite. Only after a push of real changes: a no-change or
      # merge-only round addressed nothing, whatever the line says. Also
      # writes the final message with the line stripped, on every path: it
      # is machine input, not summary. Best-effort — never fails the job.
      - name: Resolve review threads codex reported as addressed
        id: codexthreads
        if: steps.codexland.outcome == 'success'
        uses: meridianlabs-ai/agents/.github/actions/resolve-reported-threads@main
        with:
          token: ${{ secrets.MARVIN_TOKEN || github.token }}
          repo: ${{ github.repository }}
          pr: ${{ inputs.pr_number }}
          final-message: ${{ runner.temp }}/codex/codex-final.md
          stripped: ${{ runner.temp }}/codex-final.stripped.md
          resolve: ${{ steps.codexland.outputs.pushed == '1' && steps.codexland.outputs.merge_only != '1' }}

      # One comment either way, de-fanged (posts from a write-access
      # account; the gate and the hand-back backstop match the loop's
      # verdict/handoff markers with plain substring contains(), so codex
      # QUOTING one — likely, its prompt embeds the reviewer's verdict
      # comments verbatim — would forge a verdict or suppress an owed
      # hand-back: break those substrings too, in codex's text only, not
      # the deliberate leading marker below). Pushed with codex changes:
      # a plain summary — "Ensure hand-back" below owes the @review. No
      # changes, or the base merge alone: the round is concluded — lead
      # with the auto-handoff marker so the selfhandoff detector moves
      # the board and "Ensure hand-back" sees the hand-off already posted.
      # Gated on the resolve step (which is gated on the landing): the
      # summary states the resolved count, and OUT is the stripped copy it
      # wrote — falling back to FINAL, codex's message unstripped, when that
      # copy is missing (the composite warned; a read needs no write
      # permission, and a stray RESOLVED-THREADS line in a comment beats the
      # summary going unread — inspect_ai#428's ten blind rounds). Runs no
      # git, so it carries no git env or credential.
      - name: Post codex summary
        id: codexpost
        if: steps.codexthreads.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          ROUND: ${{ steps.gate.outputs.round }}
          MENTION: ${{ steps.gate.outputs.mention }}
          OUT: ${{ runner.temp }}/codex-final.stripped.md
          FINAL: ${{ runner.temp }}/codex/codex-final.md
          PUSHED: ${{ steps.codexland.outputs.pushed }}
          MERGE_ONLY: ${{ steps.codexland.outputs.merge_only }}
          RESOLVED: ${{ steps.codexthreads.outputs.resolved }}
        run: |
          set -euo pipefail
          src="$OUT"; [ -f "$src" ] || src="$FINAL"
          {
            if [ -z "$PUSHED" ] || [ -n "$MERGE_ONLY" ]; then
              echo "<!-- auto-handoff -->"
              ping=""; [ -n "$MENTION" ] && ping="@$MENTION "
              printf '%sauto (codex, round %s): no code changes this round%s — summary below. No review threads were resolved (nothing changed); please resolve any that are settled.\n\n' "$ping" "$ROUND" "${MERGE_ONLY:+ (the base-branch merge from the workflow was pushed)}"
            else
              printf '🤖 auto (codex, round %s): changes pushed — summary below. Resolved %s review thread(s) codex reported as fully addressed; the rest stay open.\n\n' "$ROUND" "${RESOLVED:-0}"
            fi
            sed -E -e 's/@(review|claude|auto)/`\1`/g' \
                   -e 's/claude-review-(summary|verdict|comment)/claude-review \1/g' \
                   -e 's/engine: codex/engine  codex/g' \
                   -e 's/auto-(handoff|review-rounds|review-head|fix-attempts)/auto \1/g' \
                   "$src" 2>/dev/null || echo "(codex produced no final message)"
          } >"$RUNNER_TEMP/codex-comment.md"
          # GitHub caps comment bodies at 65,536 characters and codex's final
          # message is unbounded; here the post failing lands AFTER the push,
          # losing the summary for work that already landed. Truncate with a
          # note instead — the leading auto-handoff marker sits at the START
          # of the file so a no-change round's stage move survives the cap,
          # and cutting the de-fanged body can't resurrect a trigger or
          # marker (the sed removed the @ / split the substrings, and
          # truncation only drops trailing bytes).
          if [ "$(wc -c <"$RUNNER_TEMP/codex-comment.md")" -gt 60000 ]; then
            head -c 60000 "$RUNNER_TEMP/codex-comment.md" >"$RUNNER_TEMP/codex-comment.trunc"
            printf '\n\n_[truncated: codex output exceeded the comment size cap]_\n' >>"$RUNNER_TEMP/codex-comment.trunc"
            mv "$RUNNER_TEMP/codex-comment.trunc" "$RUNNER_TEMP/codex-comment.md"
          fi
          gh api "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/codex-comment.md" --silent
      # ---- end Codex engine ---------------------------------------------------

      # The agent may end the loop itself instead of posting @review — a
      # documentation-only nit round, or all remaining feedback declined with
      # Backstop for the ending contract: a fix round that pushed commits must
      # end with @review or the doc-only handoff — observed (inspect_ai#206): a
      # doc-only round took the "don't post @review" branch, skipped the
      # handoff half, and stranded the stage at Agent. If the tip moved and
      # neither hand-back was posted, post the re-review request as the
      # machine account — a redundant review round is the safe completion
      # (word-boundary gate + newest-wins concurrency make duplicates cheap).
      # Codex gate is codexfix + codexreclaim, not codexland: a landing that
      # pushed and then died posting its comment still owes the @review —
      # this step detects the push itself, so gating on the earlier steps
      # closes that gap. The reclaim half is what makes the fetch below safe
      # to run: it is the step that restored the pre-codex .git/config, and
      # it precedes the landing, so a landing that pushed always passes it;
      # a reclaim that refused (redirected git dir) means nothing pushed and
      # nothing is owed, and this step must not run git through codex's
      # config with the machine-account token in its env.
      # Two steps: this one decides whether a hand-back is owed; the shared
      # post-pr-comment composite posts it with retry/backoff and fails the
      # run loudly if it never lands — this comment IS the hand-back, and a
      # swallowed failure (observed: GitHub 503 during an outage) strands the
      # board at Agent with green CI and nobody notified.
      - name: Check whether a hand-back is owed
        if: >-
          always() && steps.gate.outputs.act == 'fix' &&
          (steps.claude.outcome == 'success' ||
           (steps.codexfix.outcome == 'success' && steps.codexreclaim.outcome == 'success'))
        id: handback
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          HEAD_BRANCH: ${{ steps.gate.outputs.head_branch }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          SINCE: ${{ steps.base.outputs.started }}
          # Step-scoped credential for the best-effort fetch: with nothing
          # persisted by checkout it would otherwise fail silently on a
          # private caller and the tip would always read as unmoved.
          GIT_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.${{ github.server_url }}.helper
          GIT_CONFIG_VALUE_1: '!f() { echo username=x-access-token; echo "password=$GIT_TOKEN"; }; f'
        run: |
          set -uo pipefail
          git fetch --quiet origin "$HEAD_BRANCH" 2>/dev/null || true
          tip=$(git rev-parse "origin/$HEAD_BRANCH" 2>/dev/null || echo "$BASE_SHA")
          [ "$tip" = "$BASE_SHA" ] && { echo "No push this round; no hand-back owed."; exit 0; }
          # Hand-off marker matched as the leading line (same shape as the
          # selfhandoff detector), not as a substring: the action's tracking
          # comment is rewritten with the agent's summary, which may mention
          # the marker in prose without being a hand-off.
          posted=$(gh api "repos/$REPO/issues/$PR/comments?since=$SINCE" \
            --jq '[.[] | select((.body | test("^\\s*@review\\s*$")) or (.body | startswith("<!-- auto-handoff -->")))] | length' 2>/dev/null || echo 0)
          if [ "${posted:-0}" -gt 0 ]; then
            echo "Hand-back already posted this round."
          else
            echo "Agent pushed ($BASE_SHA -> $tip) without a hand-back; posting the re-review request."
            echo "owed=1" >>"$GITHUB_OUTPUT"
          fi

      - name: Ensure hand-back after push
        if: always() && steps.handback.outputs.owed == '1'
        uses: meridianlabs-ai/agents/.github/actions/post-pr-comment@main
        with:
          token: ${{ secrets.MARVIN_TOKEN || github.token }}
          repo: ${{ github.repository }}
          pr: ${{ inputs.pr_number }}
          body: "@review"
          what: hand-back @review

      # rationale — by posting a handoff comment whose first line is
      # <!-- auto-handoff -->. Detect a fresh one (posted by the machine
      # account after this run started) and move the board to Review;
      # without this the stage would stay parked at Agent, since the
      # deterministic converged/escalate paths only fire on reviewer verdicts.
      - name: Detect agent self-handoff
        id: selfhandoff
        if: >-
          steps.gate.outputs.act == 'fix' &&
          (steps.claude.outcome == 'success' || steps.codexpost.outcome == 'success')
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          SINCE: ${{ steps.base.outputs.started }}
        run: |
          set -euo pipefail
          n=$(gh api "repos/$REPO/issues/$PR/comments?since=$SINCE" \
                --jq '[.[] | select(.user.login=="i-am-marvin" and (.body|startswith("<!-- auto-handoff -->")))] | length' \
                2>/dev/null || echo 0)
          echo "self-handoff comments since $SINCE: $n"
          echo "found=$([ "${n:-0}" -gt 0 ] && echo true || echo false)" >>"$GITHUB_OUTPUT"

      - name: Stage - Review (self-handoff)
        if: steps.selfhandoff.outputs.found == 'true'
        uses: meridianlabs-ai/agents/.github/actions/set-stage@main
        with:
          stage: Review
          token: ${{ secrets.MARVIN_TOKEN }}
          repo: ${{ github.repository }}
          issue: ${{ inputs.pr_number }}
          branch: ${{ steps.gate.outputs.head_branch }}

      # Which model actually served this run (design/architecture.md → Model
      # selection): the init line echoes the requested model even when
      # --fallback-model fires, so this parses modelUsage and posts a note on
      # the PR when a non-requested model served tokens or the result
      # reads like a classifier refusal. Best-effort, always exits 0. Codex
      # runs have no execution file — the Codex usage step above covers them.
      - name: Model provenance
        if: always() && steps.gate.outputs.act == 'fix' && steps.gate.outputs.engine != 'codex'
        uses: meridianlabs-ai/agents/.github/actions/model-provenance@main
        with:
          exec-file: ${{ steps.claude.outputs.execution_file }}
          requested: ${{ inputs.model }}
          token: ${{ secrets.MARVIN_TOKEN }}
          repo: ${{ github.repository }}
          number: ${{ inputs.pr_number }}

      # Surface agent errors the action swallows (model overload/529, 404, etc.),
      # which otherwise leave the review-fix run green with no fix/handoff posted.
      # Also catches the "completed-but-blocked" case: the agent finishes with no
      # error but left its work unlanded (see the landed/pending check below).
      - name: Surface agent errors
        if: always() && steps.gate.outputs.act == 'fix'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          NUM: ${{ inputs.pr_number }}
          HEAD_BRANCH: ${{ steps.gate.outputs.head_branch }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          MENTION: ${{ steps.gate.outputs.mention }}
          HANDED: ${{ steps.selfhandoff.outputs.found }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          SYNC_CONFLICTS: ${{ steps.sync.outputs.conflicts }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          SETUPFB_OUTCOME: ${{ steps.setupfb.outcome }}
          BACKSTOP_OUTCOME: ${{ steps.backstop.outcome }}
          CODEXFEEDBACK_OUTCOME: ${{ steps.codexfeedback.outcome }}
          CODEXPREP_OUTCOME: ${{ steps.codexprep.outcome }}
          CODEXUSER_OUTCOME: ${{ steps.codexuser.outcome }}
          CODEX_OUTCOME: ${{ steps.codexfix.outcome }}
          CODEXRECLAIM_OUTCOME: ${{ steps.codexreclaim.outcome }}
          CODEXGUARD_OUTCOME: ${{ steps.codexguard.outcome }}
          CODEXLAND_OUTCOME: ${{ steps.codexland.outcome }}
          CODEXPOST_OUTCOME: ${{ steps.codexpost.outcome }}
          # Step-scoped credential for the unlanded-work fetch below (nothing
          # is persisted by checkout; see "Ensure hand-back after push").
          GIT_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.${{ github.server_url }}.helper
          GIT_CONFIG_VALUE_1: '!f() { echo username=x-access-token; echo "password=$GIT_TOKEN"; }; f'
        run: |
          set -uo pipefail
          file="${EXEC:-/home/runner/work/_temp/claude-execution-output.json}"
          err=""
          # The base-branch sync died before the agent started (a transient
          # gh/fetch error, or its own loud non-conflict merge failure). Every
          # downstream step is SKIPPED, not failed, so no other branch below
          # fires; the round was deliberately not recorded (Record round runs
          # after the sync), so the refund path does not apply either — without
          # this the failure is a silent stall with the board parked at Agent.
          if [ "${SYNC_OUTCOME:-}" = "failure" ]; then
            err="the base-branch sync step failed before the agent started (a transient gh/fetch error, or a base merge that failed without content conflicts — see the job logs); no fix was attempted this round. Re-trigger to retry."
          fi
          # Provisioning died before the agent started: same shape as the sync
          # failure above — the agent and landing steps are SKIPPED (the round
          # was not recorded, so no refund applies) and without this the job
          # is a silent red with the board parked at Agent. Unlike the sync
          # failure (which exits before merge_sha is written), ONE downstream
          # step still fires here on the Claude path: `Push base merge if
          # unpushed` is always()-gated on merge_sha alone, so the runner's
          # clean base merge is pushed — re-running CI — even though no fix
          # was attempted. That is the right outcome (the branch stays
          # current; "Ensure hand-back after push" is gated on the agent
          # having succeeded, so no @review is owed or posted for it), but
          # the wording below says so instead of claiming nothing moved. A
          # DETERMINISTIC cause is named too: the PR's own dependency change
          # (a pyproject.toml that no longer installs) now fails provisioning
          # on every trigger — before 2026-09-09 the Claude engine would have
          # attempted that class of fix; accepted, it mirrors the dev agent's
          # and reviewer's fatal stance, but "re-trigger" is wrong advice for
          # it, so the message says to fix it by hand. EXCEPT on the codex
          # conflict path (SYNC_CONFLICTS non-empty): there the provisioning
          # steps are continue-on-error, the round ran static-only with the
          # failure spelled out in codex's prompt, and the later clauses
          # judge what it did — so a failure there is a log warning, not an
          # error, and "re-trigger to retry" (wrong advice for a conflicted
          # dependency file, which fails identically every time) is never
          # given for it.
          if [ -n "${SYNC_CONFLICTS:-}" ]; then
            if [ "${SETUP_OUTCOME:-}" = "failure" ] || [ "${SETUPFB_OUTCOME:-}" = "failure" ]; then
              echo "::warning::environment provisioning failed on a conflicted round (conflicts in: $(tr '\n' ' ' <<<"$SYNC_CONFLICTS" | sed 's/ *$//')); the fix agent ran static-only and was told so."
            fi
          elif [ -z "$err" ] && [ "${SETUP_OUTCOME:-}" = "failure" ]; then
            err="environment provisioning (claude-setup) failed before the fix agent started — a transient dependency-download/network error, a dependency file the base merge touched, or this PR's own dependency change no longer installing (that one fails identically on every trigger: fix it by hand); no fix was attempted this round, though on the Claude engine the runner's clean base merge, if there was one, was still pushed to the branch. Re-trigger if it looks transient."
          elif [ -z "$err" ] && [ "${SETUPFB_OUTCOME:-}" = "failure" ]; then
            err="fallback environment provisioning (uv dev-install) failed before the fix agent started — a transient dependency-download/network error, the project not dev-installing on a bare runner, or this PR's own dependency change no longer installing (either of those fails identically on every trigger: fix it by hand — check the job logs); no fix was attempted this round, though on the Claude engine the runner's clean base merge, if there was one, was still pushed to the branch. Re-trigger if it looks transient."
          fi
          [ -z "$err" ] && [ -f "$file" ] && err=$(jq -r '(if type=="array" then . else .messages end) | map(select(.type=="result" and .is_error==true)) | last | .result // empty' "$file" 2>/dev/null || true)
          if [ -z "$err" ] && [ "${CODEXFEEDBACK_OUTCOME:-}" = "failure" ]; then
            err="fetching the PR thread for the codex prompt failed before the agent started (a gh/API error that outlasted three attempts — see the job logs); no fix was attempted this round, and the round was refunded. Re-trigger to retry."
          fi
          if [ -z "$err" ] && [ "${CODEXPREP_OUTCOME:-}" = "failure" ]; then
            err="the codex context-preparation step failed before the agent started — no fix was attempted this round (see the job logs)."
          fi
          # A failed codex-user setup SKIPS the codex step, so it needs its
          # own check or the failure is a silent red job.
          if [ -z "$err" ] && [ "${CODEXUSER_OUTCOME:-}" = "failure" ]; then
            err="the codex user setup failed before the agent started — no fix was attempted this round (a runner-image change breaking adduser/usermod? — see the job logs)."
          fi
          if [ -z "$err" ] && [ "${CODEX_OUTCOME:-}" = "failure" ]; then
            err="the codex fix step failed (missing OPENAI_API_KEY, or a codex-action error — see the job logs)."
          fi
          # A reclaim that did not succeed SKIPS the guard and the landing.
          # Checked before the git commands below on purpose: on this path
          # .git is still the codex-written one (a refusal, a failed restore,
          # or a job cancel that landed mid-reclaim — outcome `cancelled`,
          # not `failure`, with the kill/chown/restore only partly done), so
          # this step must not run git through it — a non-empty err skips
          # every git call below. `!= success` mirrors the guard's and the
          # hand-back's step gates; the codexuser test keeps the Claude
          # path's `skipped` reclaim from tripping it.
          if [ -z "$err" ] && [ "${CODEXUSER_OUTCOME:-}" = "success" ] && [ "${CODEXRECLAIM_OUTCOME:-}" != "success" ]; then
            err="codex finished but the workspace could not be reclaimed from it (reclaim step outcome: ${CODEXRECLAIM_OUTCOME:-unknown}) — processes were still running as codex after repeated kills, .git is not a plain directory or a .git/commondir redirect exists, codex left an embedded git repository in the tree (a git init or git worktree add under the checkout — the false-alarm case in design/codex-engine.md → Hook-safe landing), the pre-codex git config could not be restored, or the job was cancelled mid-reclaim (see the job logs); nothing was pushed this round. Inspect the codex run's transcript before re-triggering."
          fi
          # A failed guard SKIPS the landing step, so it needs its own check.
          if [ -z "$err" ] && [ "${CODEXGUARD_OUTCOME:-}" = "failure" ]; then
            err="codex finished but left the base merge unresolved (an unmerged index or surviving conflict markers — see the job logs); nothing was pushed. Resolve and stage the conflicts manually, or drop the engine:codex label to use the Claude path."
          fi
          if [ -z "$err" ] && [ "${CODEXLAND_OUTCOME:-}" = "failure" ]; then
            err="codex finished but its landing step failed — the fix may not have reached the branch (see the job logs)."
          fi
          # The landing pushed but the summary never posted (the thread
          # resolution composite is best-effort and cannot fail, so a skipped
          # post means a failed post). The hand-back backstop still owes the
          # @review off the push itself; this names the missing summary.
          if [ -z "$err" ] && [ "${CODEXLAND_OUTCOME:-}" = "success" ] && [ "${CODEXPOST_OUTCOME:-}" != "success" ]; then
            err="codex's fix was pushed but its summary comment could not be posted (post step outcome: ${CODEXPOST_OUTCOME:-unknown}; see the job logs for the final message and any review threads resolved)."
          fi
          if [ -z "$err" ] && [ "$CLAUDE_OUTCOME" = "failure" ]; then
            err="the review-fix step failed before producing a result (see the job logs)."
          fi
          # The base-merge backstop's push failed after a healthy agent run
          # (token scope, transient network). Checked BEFORE the unlanded-work
          # check below: the runner's merge commit is in rev-list
          # BASE_SHA..HEAD while origin still equals BASE_SHA, so without this
          # clause that check would report agent edits that never landed —
          # the wrong diagnosis for a round where the agent changed nothing.
          # "Changed nothing" means COMMITTED nothing, though: the agent can
          # still have left uncommitted edits to tracked files (edited, then
          # ran out of turns or hit a tool denial before committing), and
          # this clause preempts the check that would have reported them —
          # so say so here when the tree is dirty instead of asserting that
          # nothing was lost.
          if [ -z "$err" ] && [ "${BACKSTOP_OUTCOME:-}" = "failure" ]; then
            err="the agent finished, but pushing the runner's base-branch merge failed (see the job logs) — the PR branch is still behind its base."
            if [ -n "$(git status --porcelain --untracked-files=no --ignore-submodules=dirty 2>/dev/null || true)" ]; then
              err="$err The agent also left uncommitted edits to tracked files that never reached the branch."
            else
              err="$err No fix was lost: the agent made no changes this round."
            fi
          fi
          # Completed-but-blocked: the action reports success, but the agent did
          # work that never reached the branch — uncommitted edits or local
          # commits it couldn't push (e.g. a git command outside the allow-list).
          # A healthy round either lands its changes (commit+push, or a
          # server-side API commit — both advance the remote tip) or makes no
          # changes at all, so unlanded local work means the round silently
          # stalled and nothing reached the PR. See design/auto-agent.md.
          if [ -z "$err" ] && [ -n "${BASE_SHA:-}" ]; then
            git fetch origin "$HEAD_BRANCH" --quiet 2>/dev/null || true
            remote=$(git rev-parse "origin/$HEAD_BRANCH" 2>/dev/null || echo "$BASE_SHA")
            pending=""
            # untracked files are normal scratch (test caches, venvs) — only
            # tracked-file edits count as unlanded work (inspect_ai#271 was a
            # false ⚠️ from untracked leftovers on a doc-only round)
            [ -n "$(git status --porcelain --untracked-files=no --ignore-submodules=dirty 2>/dev/null || true)" ] && pending=1
            [ -n "$(git rev-list "$BASE_SHA..HEAD" 2>/dev/null || true)" ] && pending=1
            # A hand-off posted this round EXPLAINS unpushed local edits:
            # the agent hit the workflow-scope push wall, said so, and
            # delivered the change another way (observed: agents#28 got a
            # proper hand-off plus this redundant ⚠️ 18 seconds later).
            # HANDED is the selfhandoff detector's strict match (machine
            # account + marker as the leading line, per the documented
            # hand-off contract — quoting it in prose, e.g. in backticks
            # mid-comment, does not match), so the ⚠️ is suppressed only when the
            # same signal moved the board to Review. A cancelled claude step
            # skips that detector; its empty output falls through to flagging.
            if [ "$remote" = "$BASE_SHA" ] && [ -n "$pending" ]; then
              if [ "${HANDED:-}" = "true" ]; then
                echo "::notice::unpushed local edits, but a hand-off comment posted this round explains them; not flagging."
              else
                # Strip the @ from trigger tokens in agent-authored text: this
                # summary is embedded in a MARVIN-authored comment below. The
                # stubs' machine-account guard should already drop that
                # comment, but stripping is defense in depth (a caller repo
                # may carry an older stub) — a bare @review/@claude/@auto
                # must not be what that guard is protecting against.
                summary=$(jq -r '(if type=="array" then . else .messages end) | map(select(.type=="result")) | last | .result // empty' "$file" 2>/dev/null | head -c 1000 | sed -E 's/@(review|claude|auto)/\1/g' || true)
                err="the agent finished but left edits to tracked files (or unpushed commits) that never landed on the branch — whatever its summary reports, no code change reached the PR."
                [ -n "$summary" ] && err="$err Agent summary: $summary"
              fi
            fi
          fi
          [ -z "$err" ] && { echo "No agent error detected."; exit 0; }
          echo "::error::review-fix run did not complete: $err"
          if [ -n "${NUM:-}" ]; then
            # cc the responsible human (gate-derived): without a mention these
            # error reports on agent-authored PRs email nobody.
            cc=""
            [ -n "${MENTION:-}" ] && cc=$(printf '\n\ncc @%s' "$MENTION")
            # Re-trigger advice is `@auto`, NOT `@review`: the review that
            # started this round is already posted, so a fresh `@review`
            # would spend a whole review pass re-deriving the same findings
            # before the loop could act. An `@auto` comment on the PR runs
            # the dev agent straight at the standing review (claude.yml's
            # kickoff-on-existing-PR path), re-applies the label, resets both
            # sticky budgets, and its ending contract posts the `@review`
            # hand-back — so the loop resumes where it stopped (Ransom,
            # 2026-09-09; design/atlas-tracking.md → standing review). Bare
            # `@review` stays the right call only when no usable review
            # exists. The tokens are backticked as defense in depth: the
            # stubs' machine-account guard (actor != i-am-marvin and not a
            # [bot]) should already drop this comment before any gate reads
            # it, and claude.yml's trigger regex wants whitespace before the
            # token anyway — but a caller repo may carry an older stub, and a
            # bare token here must not be what that guard is protecting
            # against.
            gh issue comment "$NUM" --repo "$REPO" --body "$(printf '⚠️ The auto review-fix run did not complete:\n\n> %s\n\nIf this looks transient (model API capacity/overload), resume with an `@auto` comment (e.g. `@auto address the review feedback`) — that re-runs the fix against the review already posted and resets the round budget; a fresh `@review` would only repeat the review. Otherwise it likely needs a human.%s' "$err" "$cc")" || true
          fi
          exit 1

      # Infra crashes must not burn review rounds (mirror of claude-auto.yml's
      # attempt refund): a step that died with NO execution output attempted
      # nothing. A failed codex step is the same class — its landing step
      # never ran, so nothing reached the PR (persistently missing
      # OPENAI_API_KEY must not march a PR to spurious escalation) — and so
      # are a failed codex PREP or user-setup step, which die before the
      # agent starts and skip codexfix outright; the exec-file guard below is
      # Claude-only and no execution file ever exists on the codex path, so
      # the refund proceeds. Rebuild the sticky counter body including the
      # head marker the next gate's no-progress check reads. Per-PR
      # concurrency serializes us.
      - name: Refund infra-crashed round
        if: >-
          always() && steps.gate.outputs.act == 'fix' &&
          (steps.claude.outcome == 'failure' || steps.codexfix.outcome == 'failure' ||
           steps.codexfeedback.outcome == 'failure' || steps.codexprep.outcome == 'failure' ||
           steps.codexuser.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
          ROUND: ${{ steps.gate.outputs.round }}
          CAP: ${{ inputs.review_round_cap }}
          HEAD: ${{ steps.gate.outputs.head }}
          MARKER: "<!-- auto-review-rounds -->"
        run: |
          set -uo pipefail
          file="${EXEC:-/home/runner/work/_temp/claude-execution-output.json}"
          if [ -s "$file" ]; then
            echo "Execution output exists — a real round ran; not refunding."
            exit 0
          fi
          prev=$((ROUND - 1))
          cid=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                  --jq 'map(select(.body|contains("'"$MARKER"'"))) | last | .id // empty' 2>/dev/null || true)
          [ -z "$cid" ] && { echo "No counter comment found; nothing to refund."; exit 0; }
          body="$MARKER
          🤖 auto review rounds: $prev (cap $CAP). (one round refunded — the fix agent crashed before starting: infrastructure, not the fix)
          <!-- auto-review-head:$HEAD -->"
          gh api -X PATCH "repos/$REPO/issues/comments/$cid" -f body="$body" --silent || true
          echo "Refunded round $ROUND -> $prev."
