# The repo's unit tests (tests/README.md): the full suite, `python3 -m
# pytest -n auto`, on every PR and on every push to main. No path filter —
# the suite lifts `run:` bodies out of the reusable workflows, the
# composites, the stubs and the examples, so almost any change can break it.
#
# A serial run took 118 s on the hosted image on PR #160's run (2026-09-23)
# and 284 s on main at 2761962 (2026-10-02); `-n auto` (pytest-xdist, one
# worker per core) took 103 s on PR #204's first run. It once took ~9.5
# minutes, ~450 s of it in test_codex_path.py, while that module's PATH
# checks listed the image's real /bin, thousands of symlinks; they now
# check a small fixture tree.
# The timeout is well above the run time and still stops a hung test early.
#
# No secrets, no agent: a read-only job token, no `secrets.` reference, never
# `pull_request_target` (a fork PR runs its own tree with the fork's
# read-only token), and the checkout persists no credential (AGENTS.md → No
# git credential is ever written to the workspace). It posts nothing and
# pushes nothing, so it starts no agent workflow itself. Its `name:` is the
# CI workflow this repo's @auto stub (claude-auto-stub.yml) watches through
# `workflow_run`: a failed run on a same-repo PR reaches the CI-fix gate,
# which acts only on a PR carrying the `auto` label.
#
# What this does NOT cover: the workflows are exercised here only as text
# and as lifted step scripts against stubs. A live run is still validated by
# triggering the agents and by the hosted canaries and smoke runs
# (codex-path-smoke.yml, root-boundary-smoke.yml, engine-isolation-canary.yml,
# cache-mode-canary.yml) — AGENTS.md → Testing a change.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # pytest and pytest-xdist from uv.lock (the `dev` group of
      # pyproject.toml), with no Actions cache.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: false
      - run: uv sync --locked --python 3.12
      - run: uv run --no-sync python3 -m pytest -n auto
