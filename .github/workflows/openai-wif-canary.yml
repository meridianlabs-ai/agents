# Canaries for the codex jobs' OpenAI workload identity federation
# (design/untrusted-agent-job.md → Codex jobs: OpenAI API Platform workload
# identity federation, and → Testing). No secret and no model: each job
# requests a GitHub OIDC token and asks OpenAI's token exchange for a
# service-account token with the openai-wif-proxy composite's `probe` mode,
# which records the outcome and the token's non-secret claims (`aud`,
# `event_name`, `job_workflow_ref`) in the job summary and drops any token
# it gets. A refusal is HTTP 4xx; an outage counts as neither and fails the
# job.
#
# The mapping matches the issuer, the audience, the owner and its id, and
# two booleans the identity provider derives: `job_workflow_ref` is one of
# the four agent workflows at `refs/heads/main`, and `event_name` is one the
# stubs use (`workflow_run` is one; `workflow_dispatch` and `schedule` are
# not). Each job fails one condition on the event that isolates it:
#
#   no-reusable-workflow       a job in this file: the workflow (on
#                              workflow_run);
#   other-reusable-workflow    openai-wif-canary-reusable.yml, a reusable
#                              workflow of this repository at `main` that is
#                              not one of the four: the workflow (on
#                              workflow_run);
#   reviewer-wrong-audience    claude-review.yml@main's probe job with
#                              another audience: the audience (on
#                              workflow_run);
#   reviewer-meridian-audience claude-review.yml@main's probe job with the
#                              Meridian audience: the event, on a dispatch or
#                              the schedule, where it must be refused; on
#                              workflow_run it matches every condition and
#                              must be exchanged, the positive control that
#                              makes the refusals mean something.
#
# Runs after each `main` run of the engine isolation canary (daily, on its
# push paths and by hand), weekly on its own schedule (the wrong-event case),
# and by hand. A `workflow_run` workflow runs from the default branch only,
# and the reviewer's probe input exists only on `main` once this lands, so
# a branch cannot run this as itself.

name: openai wif canary

on:
  workflow_run:
    workflows: ["engine isolation canary"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * 1"   # Mondays 06:41 UTC, a wrong-event run

permissions:
  contents: read

jobs:
  no-reusable-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: OpenAI exchange from a job in no reusable workflow (expect refused)
        uses: meridianlabs-ai/agents/.github/actions/openai-wif-proxy@main
        with:
          mode: probe
          expect: refused

  other-reusable-workflow:
    uses: ./.github/workflows/openai-wif-canary-reusable.yml
    permissions:
      contents: read
      id-token: write

  reviewer-meridian-audience:
    uses: meridianlabs-ai/agents/.github/workflows/claude-review.yml@main
    # Everything a job of claude-review.yml requests, read-only but the
    # probe's OIDC token: a called workflow's jobs get no more than this.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    cache-mode: read
    with:
      openai_wif_probe: meridian-audience
      openai_wif_probe_expect: ${{ github.event_name == 'workflow_run' && 'exchanged' || 'refused' }}

  reviewer-wrong-audience:
    uses: meridianlabs-ai/agents/.github/workflows/claude-review.yml@main
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    cache-mode: read
    with:
      openai_wif_probe: wrong-audience
      openai_wif_probe_expect: refused
