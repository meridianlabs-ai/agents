# Hosted-runner canary for the engine split (Claude Security findings 4628446
# and 4629153; design/codex-engine.md → One job per engine). Not a caller
# stub and not an agent run: no real secret, no model, no codex-action. Four
# parts on the stock `ubuntu-latest` image:
#
#   probe                  the secret-delivery probe
#                          (engine-isolation-canary-reusable.yml): a called
#                          workflow, shaped like the agent workflows, given
#                          two SYNTHETIC repository secrets — CANARY_SENTINEL_A
#                          and CANARY_SENTINEL_B, values `CANARYA-<16 hex>` /
#                          `CANARYB-<16 hex>` set by hand (`gh secret set`),
#                          never a provider key. Its jobs show that a secret a
#                          skipped step references IS delivered to that job's
#                          runner (the positive control; the pre-fix Claude
#                          job's shape), that a job referencing nothing gets
#                          neither sentinel although the caller passed both
#                          and sibling jobs reference them (the fixed Claude
#                          job, and per-job scoping), and that a used secret
#                          is found (the codex job's shape).
#   pipeline-probe         the same sentinels in the agent workflows' own
#                          shape (engine-isolation-canary-pipeline.yml), run
#                          once per engine: the three secrets under their
#                          real names (sentinel A for both App secrets, B
#                          for the OpenAI key), a gate and a land job that
#                          reference the App secrets in job env and as
#                          action inputs, and the two agent jobs selected by
#                          the gate's `engine` output. Expected: the Claude
#                          agent job holds no App secret and no OpenAI key,
#                          the codex job the OpenAI key alone (finding
#                          4629153, fix criterion 3).
#   provisioning-boundary  the codex-side boundary of THIS revision, with the
#                          real codex user, real sudo and the composites
#                          lifted from the checkout (not `@main`, so a branch
#                          is tested as itself): `create-codex-user`, then
#                          `provision-fallback` with `user: codex` over the
#                          hostile checkout in tests/fixtures/hostile-checkout
#                          (a setup.py that plants the review-round-1
#                          primitive — `~codex/.codex/config.toml` as a
#                          symlink to /proc/self/environ — leaves a survivor
#                          process, and tries runner-only writes and reads),
#                          then `create-codex-user` in `reset-home` mode.
#                          Asserted: the hostile code ran as codex, not the
#                          runner; it could plant the link and the survivor
#                          (positive controls) but not touch the runner's
#                          home or read the runner's process environment;
#                          after the reset no process runs as codex and the
#                          home holds exactly the composite's config.toml.
#                          Then a caller recipe (`recipe:`) runs as codex
#                          with uv on PATH and HOME=/home/codex.
#   caller-recipes         one job per fixture in tests/fixtures/callers
#                          (agents-owned stand-ins for the callers whose
#                          claude-setup does more than the generic recipe:
#                          the inspect_ai fork's Python 3.11 editable
#                          install, inspect_flow's Python 3.11 locked `uv
#                          sync --dev`, inspect_harbor's Python 3.12 `uv
#                          sync` with dev+doc default groups, ts-mono's Node
#                          22 pnpm frozen install — the last with no
#                          pyproject.toml, the recipe-without-Python route):
#                          this revision's composites provision the fixture
#                          as codex with its `codex_provision` recipe, reset
#                          the home, discover the tools the way the compose
#                          steps do and run each as codex under
#                          codex-action's launch shape, then the fixture's
#                          own checks (interpreter/Node version, groups,
#                          lockfile unchanged).
#   claude-launcher        the Claude agent's launcher of THIS revision
#                          (design/executed-paths-residual.md → The
#                          launcher), once per grant mode: `create-codex-user`
#                          and, in `workspace` mode, the pre-agent reclaim
#                          with `user: claude-agent`, then
#                          `claude-agent-launcher`. Asserted: Claude Code is
#                          installed root-owned at the version
#                          claude-code-action@v1 pins, the wrapper, the
#                          namespace script and the check are root-owned and
#                          closed to others, the run directory records this
#                          job's values, `--version` passes through the
#                          wrapper, the launcher's bin directory on the job
#                          PATH passes `assert-runner-only-path`, and no
#                          claude-agent process is left; a launch from a
#                          step shell (not the action's bun) is refused by
#                          agent-ns-launch's process check before anything
#                          starts; then the post-agent reclaim runs. It does
#                          not run the action or a model, and it plants no
#                          hostile probe: the boundary inside the namespace
#                          is assessed by Claude Security scans instead
#                          (decision: Ransom, 2026-09-24).
#
# Runs on pushes that touch the composites, the harness, the scanner or the
# fixtures, by hand, and weekly on `main`: per-job secret delivery is the
# platform's measured behaviour, not a contract, and no push here would
# reveal a change in it (decision: Ransom, 2026-09-23). GitHub emails a
# failed scheduled run to the user who last modified the cron line, and
# disables a scheduled workflow after 60 days without repository activity
# (this repository is public).

name: engine isolation canary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC, off the top-of-hour rush
  push:
    paths:
      - ".github/actions/create-codex-user/**"
      - ".github/actions/provision-fallback/**"
      - ".github/actions/reclaim-codex-workspace/**"
      - ".github/actions/claude-agent-launcher/**"
      - ".github/workflows/engine-isolation-canary.yml"
      - ".github/workflows/engine-isolation-canary-reusable.yml"
      - ".github/workflows/engine-isolation-canary-pipeline.yml"
      - "tests/fixtures/secret-input/**"
      - "tests/secret_delivery_scan.py"
      - "tests/fixtures/hostile-checkout/**"
      - "tests/fixtures/callers/**"

permissions:
  contents: read

jobs:
  probe:
    uses: ./.github/workflows/engine-isolation-canary-reusable.yml
    secrets:
      CANARY_A: ${{ secrets.CANARY_SENTINEL_A }}
      CANARY_B: ${{ secrets.CANARY_SENTINEL_B }}

  pipeline-probe:
    strategy:
      fail-fast: false
      matrix:
        engine: [claude, codex]
    uses: ./.github/workflows/engine-isolation-canary-pipeline.yml
    with:
      engine: ${{ matrix.engine }}
    secrets:
      MARVIN_APP_CLIENT_ID: ${{ secrets.CANARY_SENTINEL_A }}
      MARVIN_APP_PRIVATE_KEY: ${{ secrets.CANARY_SENTINEL_A }}
      OPENAI_API_KEY: ${{ secrets.CANARY_SENTINEL_B }}

  provisioning-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The hostile checkout takes the place of a caller's tree: its
      # pyproject.toml and setup.py go to the workspace root, where the
      # composites expect the project.
      - name: Stage the hostile checkout
        run: |
          set -euo pipefail
          cp tests/fixtures/hostile-checkout/pyproject.toml tests/fixtures/hostile-checkout/setup.py .
          echo "HOSTILE_REPORT=$GITHUB_WORKSPACE/hostile-report.txt" >>"$GITHUB_ENV"

      - name: Create codex user (this revision)
        uses: ./.github/actions/create-codex-user

      - name: Provision as the codex user over the hostile checkout (this revision)
        id: setup
        timeout-minutes: 10
        uses: ./.github/actions/provision-fallback
        with:
          user: codex

      # Positive controls: the hostile build backend ran, as codex, and did
      # what the finding describes — so the reset below has something to undo.
      - name: What the hostile backend reached
        run: |
          set -euo pipefail
          echo "--- hostile report"
          cat hostile-report.txt
          grep -q "^uid=$(id -u codex) user=codex$" hostile-report.txt || { echo "::error::the build backend did not run as codex"; exit 1; }
          grep -q "^planted=config.toml->/proc/self/environ$" hostile-report.txt || { echo "::error::the backend could not plant the config.toml symlink — the positive control is missing"; exit 1; }
          grep -q "^survivor=[0-9]" hostile-report.txt || { echo "::error::no survivor process was left — the positive control is missing"; exit 1; }
          grep -q "^runner-home-write=refused" hostile-report.txt || { echo "::error::the backend could write the runner's home"; exit 1; }
          grep -q "^runner-environ-read=refused" hostile-report.txt || { echo "::error::the backend could read the runner process's environment"; exit 1; }
          [ -L /home/codex/.codex/config.toml ] || { echo "::error::config.toml is not the planted symlink before the reset"; exit 1; }
          sudo pgrep -u codex -a || { echo "::error::no process running as codex before the reset"; exit 1; }
          [ -d .venv ] && [ "$(stat -c %U .venv)" = codex ] || { echo "::error::no codex-owned .venv"; exit 1; }
          [ ! -e /home/runner/HOSTILE ] || { echo "::error::runner-home marker exists"; exit 1; }
          echo "positive controls hold: the backend ran as codex, planted the link and a survivor, and reached nothing of the runner's"

      - name: Reset codex home (this revision)
        uses: ./.github/actions/create-codex-user
        with:
          mode: reset-home

      - name: The boundary after the reset
        run: |
          set -euo pipefail
          if sudo pgrep -u codex -a; then echo "::error::a process still runs as codex after the reset"; exit 1; fi
          cfg=/home/codex/.codex/config.toml
          [ -f "$cfg" ] && [ ! -L "$cfg" ] || { echo "::error::config.toml is not a regular file after the reset"; exit 1; }
          grep -q '^\[permissions.workspace_net\]$' "$cfg" || { echo "::error::config.toml does not carry the workspace_net profile"; exit 1; }
          [ "$(stat -c %U "$cfg")" = codex ] || { echo "::error::config.toml is not codex-owned"; exit 1; }
          si="/home/codex/.codex/$GITHUB_RUN_ID.json"
          [ -f "$si" ] && [ "$(stat -c '%U %a' "$si")" = "root 666" ] || { echo "::error::server-info file missing or wrong"; exit 1; }
          entries=$(find /home/codex/.codex -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | tr '\n' ' ')
          [ "$entries" = "$GITHUB_RUN_ID.json config.toml " ] || { echo "::error::unexpected entries in the codex home: $entries"; exit 1; }
          echo "boundary holds: no codex process, a pristine codex home"

      # The caller-recipe path: the same composite with a `recipe`, run as
      # codex after the reset — uv on PATH, HOME the codex user's, the
      # checkout as cwd.
      - name: Provision with a caller recipe (this revision)
        uses: ./.github/actions/provision-fallback
        with:
          user: codex
          recipe: |
            printf 'recipe uid=%s home=%s cwd=%s uv=%s\n' "$(id -u)" "$HOME" "$(pwd)" "$(command -v uv)" >recipe-report.txt
            uv venv --python 3.12 .venv-recipe
      - name: The recipe ran as codex with uv
        run: |
          set -euo pipefail
          cat recipe-report.txt
          grep -q "^recipe uid=$(id -u codex) home=/home/codex cwd=$GITHUB_WORKSPACE uv=/home/codex/.local/bin/uv$" recipe-report.txt || { echo "::error::the recipe did not run as expected"; exit 1; }
          [ -x .venv-recipe/bin/python ] || { echo "::error::the recipe's venv was not created"; exit 1; }
          .venv-recipe/bin/python --version

  caller-recipes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fixture: [inspect-ai-like, inspect-flow-like, inspect-harbor-like, ts-mono-like]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The fixture's project files take the place of a caller's tree at the
      # workspace root; its recipe is read into an output the way a caller
      # stub's `codex_provision` reaches the reusable workflow; the lockfile
      # hash is recorded so the checks can show the sync was the locked one.
      - name: Stage the fixture
        id: fx
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          set -euo pipefail
          cp -R "tests/fixtures/callers/$FIXTURE/project/." .
          {
            echo "recipe<<RECIPE_EOF"
            cat "tests/fixtures/callers/$FIXTURE/codex-provision.sh"
            echo "RECIPE_EOF"
          } >>"$GITHUB_OUTPUT"
          lock=""
          for f in uv.lock pnpm-lock.yaml; do [ -f "$f" ] && lock=$(sha256sum <"$f"); done
          echo "lock=$lock" >>"$GITHUB_OUTPUT"
          echo "pyproject=$([ -f pyproject.toml ] && echo yes || echo no)" >>"$GITHUB_OUTPUT"
          echo "staged $FIXTURE (pyproject: $([ -f pyproject.toml ] && echo yes || echo no))"

      - name: Create codex user (this revision)
        uses: ./.github/actions/create-codex-user

      # The reusable workflows' gate for this step, evaluated the same way:
      # a pyproject.toml OR a recipe — ts-mono-like has no pyproject.
      - name: Provision as the codex user with the caller's recipe (this revision)
        id: setup
        timeout-minutes: 10
        if: hashFiles('pyproject.toml') != '' || steps.fx.outputs.recipe != ''
        uses: ./.github/actions/provision-fallback
        with:
          user: codex
          recipe: ${{ steps.fx.outputs.recipe }}

      - name: Reset codex home (this revision)
        uses: ./.github/actions/create-codex-user
        with:
          mode: reset-home

      # Tool discovery exactly as the compose steps do it (the composite's
      # `bin` directories, the same list), then every discovered tool runs
      # as codex under codex-action's launch shape: `sudo -u codex` with
      # sudo's reset environment, no runner PATH.
      - name: Discovered tools run as codex
        env:
          BIN: ${{ steps.setup.outputs.bin }}
        run: |
          set -euo pipefail
          [ "${{ steps.setup.outcome }}" = success ] || { echo "::error::provisioning did not succeed"; exit 1; }
          tools=""
          IFS=: read -r -a dirs <<<"$BIN"
          for t in pytest ruff mypy pyright python3 node pnpm npm; do
            for d in "${dirs[@]}"; do
              [ -x "$d/$t" ] && { tools="$tools$t=$d/$t "; break; }
            done
          done
          echo "discovered: ${tools:-none}"
          [ -n "$tools" ] || { echo "::error::no tool discovered in $BIN"; exit 1; }
          for kv in $tools; do
            path=${kv#*=}
            sudo -u codex -H -- "$path" --version >/dev/null 2>&1 || { echo "::error::$path does not run as codex"; exit 1; }
            echo "runs as codex: $path"
          done

      - name: The fixture's checks
        env:
          FIXTURE: ${{ matrix.fixture }}
          LOCK_BEFORE: ${{ steps.fx.outputs.lock }}
          AS_CODEX: sudo -u codex -H --
        run: bash "tests/fixtures/callers/$FIXTURE/check.sh"

  claude-launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        grant: [workspace, none]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Never runs: it names claude-code-action@v1 so the runner downloads
      # it at job start, which is where the launcher reads the pinned CLI
      # version from, as it will in the agent jobs.
      - name: claude-code-action (downloaded, not run)
        if: false
        uses: anthropics/claude-code-action@v1

      - name: Create the claude-agent user (this revision)
        id: agentuser
        uses: ./.github/actions/create-codex-user
        with:
          user: claude-agent
          grant: ${{ matrix.grant }}

      # The reviewer's fork-head shape: the scratch copy, the agent's own.
      - name: Scratch copy (none mode)
        if: matrix.grant == 'none'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scratch"
          cp -a "$GITHUB_WORKSPACE" "$RUNNER_TEMP/scratch/src"
          sudo chown -R claude-agent:claude-agent "$RUNNER_TEMP/scratch"

      - name: Pre-agent reclaim (this revision)
        if: matrix.grant == 'workspace'
        uses: ./.github/actions/reclaim-codex-workspace
        with:
          user: claude-agent

      - name: Launcher (this revision)
        id: launcher
        uses: ./.github/actions/claude-agent-launcher
        with:
          grant: ${{ matrix.grant }}
          path-prefix: ${{ github.workspace }}/.venv/bin

      - name: What the launcher installed and recorded
        env:
          GRANT: ${{ matrix.grant }}
          EXECUTABLE: ${{ steps.launcher.outputs.executable }}
        run: |
          set -euo pipefail
          opt=/opt/meridian-agent
          fail() { echo "::error::$*"; exit 1; }
          [ "$EXECUTABLE" = "$opt/bin/claude" ] || fail "executable output is '$EXECUTABLE'"
          # Root-owned and closed to others, all the way down.
          bad=$(sudo find "$opt" \( ! -user root -o -perm /022 \) ! -type l -print)
          [ -z "$bad" ] || fail "not root-owned or writable by others: $bad"
          for f in claude agent-ns-launch agent-ns-init; do [ -x "$opt/bin/$f" ] || fail "$opt/bin/$f is not executable"; done
          run_ts="${RUNNER_WORKSPACE%/*}/_actions/anthropics/claude-code-action/v1/src/entrypoints/run.ts"
          pinned=$(sed -nE 's/^[[:space:]]*const claudeCodeVersion = "([0-9.]+)";.*/\1/p' "$run_ts")
          echo "claude-code-action@v1 pins Claude Code $pinned"
          cli=$(cat "$opt/run/cli")
          case "$cli" in "$opt/claude/"*) ;; *) fail "run/cli is '$cli'" ;; esac
          "$cli" --version | grep -qF "$pinned" || fail "the installed CLI is not $pinned"
          # The passthrough: --version reaches the real CLI as the runner.
          got=$("$opt/bin/claude" --version)
          echo "through the wrapper: $got"
          case "$got" in *"$pinned"*) ;; *) fail "the wrapper's --version passthrough printed '$got'" ;; esac
          for kv in "grant=$GRANT" "workspace=$GITHUB_WORKSPACE" "runner-temp=$RUNNER_TEMP" "runner-home=$HOME" \
                    "system-path=/usr/sbin:/usr/bin:/sbin:/bin" "head=$(git symbolic-ref -q HEAD || echo "detached:$(git rev-parse HEAD)")"; do
            [ "$(cat "$opt/run/${kv%%=*}")" = "${kv#*=}" ] || fail "run/${kv%%=*} is '$(cat "$opt/run/${kv%%=*}")', not '${kv#*=}'"
          done
          case "$(cat "$opt/run/path")" in "$GITHUB_WORKSPACE/.venv/bin:$opt/claude/.local/bin:"*) ;; *) fail "run/path is '$(cat "$opt/run/path")'" ;; esac
          [ -n "$(cat "$opt/run/runner-root")" ] || fail "run/runner-root is empty (no Runner.Worker found)"
          if sudo pgrep -u claude-agent -a; then fail "a claude-agent process survived the launcher"; fi
          # The directory claude-code-action appends to GITHUB_PATH.
          echo "$opt/bin" >>"$GITHUB_PATH"
          echo "launcher of this revision installed Claude Code $pinned root-owned (grant $GRANT)"

      - name: The launcher's bin directory on the job PATH passes the check (this revision)
        uses: ./.github/actions/assert-runner-only-path
        with:
          user: claude-agent

      # A launch from a step shell, not from the action's bun: the wrapper
      # prepares and hands off, and agent-ns-launch refuses before the
      # namespace exists.
      - name: A launch from outside the action is refused
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p ~/.claude
          [ -f ~/.claude/settings.json ] || echo '{}' >~/.claude/settings.json
          # The step shell is `bash -e`: take the expected failure's status.
          rc=0
          out=$(CLAUDE_CODE_ACTION=1 DEFAULT_WORKFLOW_TOKEN=$JOB_TOKEN /opt/meridian-agent/bin/claude --output-format stream-json 2>&1) || rc=$?
          echo "$out"
          [ "$rc" -ne 0 ] || { echo "::error::the launch was not refused"; exit 1; }
          grep -q "agent-ns-launch: refusing to launch the agent: the action process [0-9]* runs .*, not bun" <<<"$out" || { echo "::error::refused, but not by the action-process check"; exit 1; }
          if sudo pgrep -u claude-agent -a; then echo "::error::a claude-agent process is running"; exit 1; fi
          echo "refused by agent-ns-launch's process check; nothing started"

      - name: Post-agent reclaim (this revision)
        if: always() && steps.agentuser.outcome == 'success'
        uses: ./.github/actions/reclaim-codex-workspace
        with:
          user: claude-agent

      - name: After the reclaim
        run: |
          set -euo pipefail
          stat -c '%A %U:%G %n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.git"
          [ "$(stat -c %U "$GITHUB_WORKSPACE/.git")" = runner ] || { echo "::error::.git is not runner-owned"; exit 1; }
          if [ -n "$(find "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.git" -maxdepth 0 -perm /020)" ]; then echo "::error::the root or .git is still group-writable"; exit 1; fi
          [ ! -e /home/claude-agent/.anthropic-config ] || { echo "::error::the agent's config dir survived"; exit 1; }
          git status --short >/dev/null
          echo "reclaimed: .git and the root runner-owned and closed to the group"
