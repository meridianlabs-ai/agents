name: Claude (reusable)

# Reusable workflow wrapping anthropics/claude-code-action.
# Caller repos add a thin stub (see examples/claude-stub.yml) and inherit
# all configuration from here, so trigger/config changes happen in one place.
#
# Auth uses Anthropic Workload Identity Federation: each run exchanges the
# GitHub OIDC token for a short-lived Anthropic credential scoped to the
# meridian service account/workspace. No secrets required — but callers MUST
# grant `id-token: write` at the calling job level (GitHub does not pass
# id-token to reusable workflows implicitly).
#
# Note: GitHub does not issue OIDC tokens to workflows triggered by PRs from
# forks, so fork PRs cannot authenticate. All triggers in the stub run in the
# base-repo context, so this only matters if a caller adds pull_request
# triggers of its own.

on:
  workflow_call:
    inputs:
      trigger_phrase:
        description: Comment phrase that triggers Claude
        required: false
        type: string
        default: "@claude"
      anchor_repo:
        description: >-
          Repo whose issues this repo's claude/issue-N-* branch numbers
          reference when the same-named branch also exists there (the
          companion convention). Used only for @-mention derivation.
        required: false
        type: string
        default: ""
      label_trigger:
        description: Issue label that triggers Claude
        required: false
        type: string
        default: "claude"
      claude_args:
        description: Additional CLI arguments passed through to Claude Code
        required: false
        type: string
        default: ""
      model:
        description: >-
          Preferred model, passed to Claude Code as --model (empty = Claude
          Code's own default). Defaults to the Fable alias for all meridian
          repos. claude-code-action@v1 has no first-class model input, so this
          is spliced into claude_args.
        required: false
        type: string
        default: "fable"
      fallback_model:
        description: >-
          Model used when the preferred model is overloaded or unavailable
          (e.g. retired), passed as --fallback-model. "default" expands to the
          account default, so the Fable-preferred default degrades gracefully
          if Fable is gone. Pass "" to disable fallback. Ignored when model is
          empty.
        required: false
        type: string
        default: "default"
      codex_model:
        description: >-
          Model for the codex engine (design/codex-engine.md). Defaults to the
          strongest OpenAI tier (gpt-5.6-sol; decision: Ransom, 2026-08-31).
          Empty falls back to the codex CLI default.
        required: false
        type: string
        default: "gpt-5.6-sol"
      settings:
        description: >-
          Claude Code settings JSON (inline). Owns the permission allow-list:
          file edits + the verify loop (both python/python3 forms) + gh for PR
          creation and CI reads + a scoped git allow-list so the agent can sync
          its working branch with the base branch (fetch/merge/rebase/push) and
          inspect history. Additive to the action's defaults; headless runs
          auto-deny anything not allowed, which keeps arbitrary execution off
          the table for workflows triggered by public issue content. git is
          scoped to branch-sync + read-only subcommands, not blanket git:*; the
          job's contents:write token is the real privilege boundary, and the
          fork's branch protection still blocks force-push to main/meridian.
        required: false
        type: string
        default: >-
          {"permissions":{"allow":["Read","Edit","Write",
          "Bash(pytest:*)","Bash(ruff:*)","Bash(mypy:*)","Bash(pyright:*)","Bash(pip:*)",
          "Bash(pip3:*)","Bash(uv:*)","Bash(python:*)","Bash(python3:*)",
          "Bash(gh:*)",
          "Bash(git fetch:*)","Bash(git merge:*)","Bash(git rebase:*)",
          "Bash(git push:*)","Bash(git checkout:*)","Bash(git switch:*)",
          "Bash(git branch:*)","Bash(git status:*)","Bash(git log:*)",
          "Bash(git diff:*)","Bash(git show:*)","Bash(git rev-parse:*)",
          "Bash(git remote:*)",
          "Bash(git add:*)","Bash(git commit:*)","Bash(git config:*)"]}}
      base_branch:
        description: >-
          Base branch for branches/PRs Claude creates (defaults to the repo's
          default branch). Used by the inspect_ai fork to target pristine main
          rather than the meridian default branch.
        required: false
        type: string
        default: ""
      request_review_after_open:
        description: >-
          After opening/adopting an issue-triggered PR and applying the `auto`
          label, post an `@review` comment to start the reviewer. Set "true"
          only where auto-review-on-open does not fire — i.e. the inspect_ai
          fork, whose `pull_request` events never reach the workflow. Doing it
          here (deterministically, AFTER labeling) instead of from the agent's
          prompt closes a race: the agent used to post `@review` mid-run, before
          the post-step applied the label, so a fast review could post its
          summary while the PR was still unlabeled and the review-fix loop would
          skip it. Leave "false" on repos where PR-open auto-review already fires
          (posting @review here would double-review).
        required: false
        type: string
        default: "false"
      branch_sync_prompt:
        description: >-
          Guidance appended to the system prompt (via --append-system-prompt,
          so it adds to — not replaces — the comment-derived task) on the Claude
          path when the agent has to perform the base merge ITSELF: the "Sync
          branch with base" step normally merges on the runner for both engines,
          and only hands the job back here when it could not — a conflict (the
          index must be clean before claude-code-action's setupBranch runs) or a
          fork head. Fresh runs from an issue branch off the (hourly-synced)
          base, so no merge is needed and this is skipped. NB an empty value is
          NOT a sync off-switch: the runner-side merge always runs on
          PR-context runs; empty only suppresses this agent-side instruction,
          leaving the agent uninstructed on the conflict/fork paths — so keep
          it non-empty unless the caller handles those cases itself.
        required: false
        type: string
        default: >-
          You are continuing work on an existing branch. Before making any code
          changes, bring it up to date with its base branch: fetch the base
          branch and merge it into this branch, resolving any conflicts, so your
          changes and their tests run against current code — then include that
          merge when you push. The checkout has full history (fetch-depth 0),
          so a local merge works without extra fetching depth.
      branch_sync_append:
        description: >-
          Caller-specific guidance about the base merge, reaching the agent
          whenever a merge happened this run — on BOTH engines. When "Sync
          branch with base" hands the merge to the agent (conflict / fork
          head) it is appended to branch_sync_prompt; when the runner merged
          cleanly it is spliced on its own, behind a one-line lead-in saying a
          workflow step already merged and the agent should review the result.
          Clean merges are the case that motivated it: git can auto-merge a
          CHANGELOG without conflict and still land an entry under the wrong
          heading, which is exactly what the inspect_ai fork's append checks
          for. Empty by default. Keep it a single line — the composed prompt
          travels as one output line, so newlines are flattened.
        required: false
        type: string
        default: ""
      append_system_prompt:
        description: >-
          Repo-specific guidance appended to the system prompt (via
          --append-system-prompt, so it adds to — not replaces — the
          comment-derived task) on EVERY dev run. Empty by default: this is the
          channel for caller-specific conventions a shared default can't carry
          — e.g. the inspect_ai fork's stub sets it with CHANGELOG.md rules.
          (The fork can't ship a CLAUDE.md/AGENTS.md file: main must stay
          pristine and a file on meridian isn't present on the main-cut branches
          the agent works from — see design/shared-instructions.md.) Distinct
          from branch_sync_prompt, which is gated to PR follow-up runs.
        required: false
        type: string
        default: ""
    secrets:
      MARVIN_TOKEN:
        description: >-
          Machine-account (marvin@meridianlabs.ai) fine-grained PAT. Optional;
          stubs pass it explicitly via a one-key `secrets:` map (not `secrets:
          inherit`, which would expose every caller secret to this @main-pinned
          workflow — this is the only secret consumed). When present it's handed to
          claude-code-action as github_token, so the agent acts as the machine
          account: its branch pushes and the PR the post-step opens then trigger
          CI and @review, which a GITHUB_TOKEN-authored PR cannot (GitHub's
          recursion guard). The action also does NOT revoke a caller-provided
          token, so the post-step can reuse it to open the PR deterministically.
          When absent, the dev agent still works via the Claude App token but
          issue-triggered PR creation degrades (no CI; blocked entirely where
          Actions-PR-creation is disallowed). This is the identity layer for
          @auto; model auth stays Workload Identity Federation regardless. See
          design/auto-agent.md.
        required: false
      OPENAI_API_KEY:
        description: >-
          OpenAI API key for the codex engine (design/codex-engine.md).
          Consumed ONLY by the openai/codex-action step, which runs on items
          labeled engine:codex. Optional: absent, codex-labeled runs fail
          loudly at that step (never a silent Claude fallback).
        required: false

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # The trig check, the 👀 ack, and the Agent stage move all run
      # BEFORE the checkout: none of them touch the workspace (env-only script;
      # remotely-fetched composite action; API calls), and the fetch-depth-0
      # clone costs ~1 min on large repos — the ack should land in seconds,
      # not after the clone.
      #
      # Atlas stage tracking must NOT trust the stub's cheap substring gate:
      # reviewer summaries legitimately contain a backticked `@claude` ("reply
      # with a top-level @claude comment"), which starts this workflow even
      # though claude-code-action then declines (word-boundary check + bot
      # actor). Without this pre-check those phantom runs flipped issues to
      # Review after every review round. Mirror the action's word-boundary
      # trigger match and bot-actor rejection; only stage when it passes.
      - name: Check trigger (stage gating)
        id: trig
        env:
          PHRASE: ${{ inputs.trigger_phrase }}
          LABEL: ${{ inputs.label_trigger }}
          EVENT: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          COMMENT: ${{ github.event.comment.body }}
          REVIEW: ${{ github.event.review.body }}
          IBODY: ${{ github.event.issue.body }}
          ITITLE: ${{ github.event.issue.title }}
          LNAME: ${{ github.event.label.name }}
        run: |
          ok=false
          # The label path is exempt from the machine-account exclusion: the
          # triage pipeline labels issues `auto` AS marvin, and that labeled
          # event is the intended kickoff (fork PR inspect_ai#237) — without
          # this, marvin-labeled kickoffs ran the agent but skipped the ack
          # and both Atlas stage steps, so the board never showed the pickup.
          # Reading the label NAME carries no quoted-token hazard; bots stay
          # excluded everywhere.
          if [ "$EVENT" = "issues" ] && [ "$EVENT_ACTION" = "labeled" ] \
             && [ -n "$LABEL" ] && [ "$LNAME" = "$LABEL" ]; then
            case "$ACTOR" in *"[bot]") ;; *) ok=true ;; esac
          fi
          case "$ACTOR" in
            *"[bot]"|i-am-marvin) ;; # bot/machine actors never stage (label path above excepted)
            *)
              text="$COMMENT$REVIEW"
              if [ "$EVENT" = "issues" ]; then
                text="$IBODY
          $ITITLE"
              fi
              esc=$(printf '%s' "$PHRASE" | sed 's/[.[\*^$()+?{|]/\\&/g')
              printf '%s' "$text" | grep -qE "(^|[[:space:]])$esc([[:space:],.!?;:]|$)" && ok=true
              [ "$EVENT" = "issues" ] && [ "$EVENT_ACTION" = "labeled" ] && [ "$LNAME" = "$LABEL" ] && ok=true
              ;;
          esac
          echo "trigger check for stage tracking: ok=$ok"
          echo "ok=$ok" >>"$GITHUB_OUTPUT"

      # Acknowledge the trigger with an 👀 reaction from the machine account, so
      # the requester immediately sees the agent picked their message up
      # (issue #3). Gated on the same word-boundary trigger check as stage
      # tracking: no acks on phantom substring events, and no self-acks (the
      # check excludes bot/machine actors). Reactions are idempotent, so an
      # edited-comment re-trigger doesn't double up. pull_request_review has no
      # reaction endpoint — that (rare) trigger path goes unacknowledged.
      # Known divergence (shared with stage tracking): steps.trig does NOT
      # mirror the action's write-access check on the commenter, so on repos
      # where non-collaborators can comment (the public inspect_ai fork) an
      # outsider's trigger gets an 👀 even though claude-code-action then
      # declines the run — the ack means "seen", not "agent is running".
      # Best-effort: an ack must never fail the run.
      # Engine selection (design/codex-engine.md): an engine:codex label on
      # the triggering issue/PR routes this run to Codex. API read at gate
      # time — event payloads carry stale label lists on comment triggers.
      # Population note: riding steps.trig means bot actors never reach
      # engine detection, so on an engine:codex item a bot-authored trigger
      # falls through to the claude step — where claude-code-action's own
      # actor guard declines it (no allowed_bots on this verb), so the result
      # is the pre-existing no-op, not a silent Claude run. Residual gap: a
      # bare @claude posted by MARVIN (a User the action accepts) would run
      # the Claude path on a codex item — but marvin-authored text is
      # de-fanged everywhere by design, so such a comment shouldn't exist.
      - name: Detect engine
        id: engine
        if: steps.trig.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          engine=claude
          if [ -n "${NUM:-}" ]; then
            labels=$(gh api "repos/$REPO/issues/$NUM/labels" --paginate \
                       --jq '.[].name' 2>/dev/null || true)
            grep -qx 'engine:codex' <<<"$labels" && engine=codex
          fi
          echo "engine: $engine"
          echo "engine=$engine" >>"$GITHUB_OUTPUT"

      - name: Acknowledge trigger (eyes)
        if: steps.trig.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          COMMENT_ID: ${{ github.event.comment.id }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          case "$EVENT" in
            issue_comment)
              gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes --silent || true ;;
            pull_request_review_comment)
              gh api "repos/$REPO/pulls/comments/$COMMENT_ID/reactions" -f content=eyes --silent || true ;;
            issues)
              gh api "repos/$REPO/issues/$ISSUE/reactions" -f content=eyes --silent || true ;;
          esac

      # Atlas tracking (design/atlas-tracking.md): the agent is picking this
      # issue up, so move it to Agent. Best-effort — the action never
      # fails the run. On PR-context events the PR resolves to its issue via
      # the claude/issue-N-* branch (then a Fixes ref).
      - name: Stage - Agent
        if: steps.trig.outputs.ok == 'true'
        uses: meridianlabs-ai/agents/.github/actions/set-stage@main
        with:
          stage: Agent
          token: ${{ secrets.MARVIN_TOKEN }}
          repo: ${{ github.repository }}
          issue: ${{ github.event.issue.number || github.event.pull_request.number }}

      # Full history + tags: setuptools-scm versioning needs tags, and Claude
      # uses git log/blame to understand code. Costs ~1 min on large repos.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- Deterministic base-branch sync (design/architecture.md) ---------
      # The base merge happens HERE, on the runner, for BOTH engines — not in
      # a prompt. Two reasons. The codex sandbox has no network and cannot
      # merge at all; and a prompted merge is advisory, so branches drifted
      # anyway (inspect_ai#392 sat 11 commits behind main across 20 commits —
      # GitHub cannot compute a merge ref for a conflicted PR, so CI never ran
      # and every review round read stale code). PR-context runs only: a fresh
      # issue run branches off the hourly-synced base, so nothing to merge.
      #
      # A CONFLICTED merge is handed on differently per engine, and the split
      # is forced rather than stylistic. claude-code-action's setupBranch runs
      # `git checkout <branch> --`, which aborts with "you need to resolve your
      # current index first" whenever the index holds unmerged entries — so the
      # Claude path must be handed a CLEAN index, and its merge is redone
      # inside the agent (it has network and the git allow-list;
      # branch_sync_prompt carries the instruction, spliced only in this case).
      # Codex cannot fetch, so it is handed the merge still IN PROGRESS and
      # resolves the markers in the working tree; its landing step refuses to
      # push while any survive.
      - name: Sync branch with base
        id: sync
        if: >-
          steps.trig.outputs.ok == 'true' &&
          (github.event.issue.pull_request != '' || github.event.pull_request != '')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          ENGINE: ${{ steps.engine.outputs.engine }}
        run: |
          set -euo pipefail
          git config user.name "i-am-marvin"
          git config user.email "i-am-marvin@users.noreply.github.com"
          prj=$(gh pr view "$NUM" --repo "$REPO" \
                  --json headRefName,baseRefName,isCrossRepository,state)
          branch=$(jq -r '.headRefName' <<<"$prj")
          base=$(jq -r '.baseRefName' <<<"$prj")
          # Closed/merged PRs: claude-code-action's setupBranch does not
          # continue the old head there — it cuts a fresh branch off base — so
          # there is nothing to sync, and the head ref may already be deleted
          # (an unconditional fetch would die on it and kill a previously
          # working "@claude do X" follow-up on a merged PR). No agent-merge
          # flag either: the agent is not on the old branch.
          state=$(jq -r '.state' <<<"$prj")
          if [ "$state" != "OPEN" ]; then
            echo "PR #$NUM is $state — nothing to sync; the action branches off $base."
            exit 0
          fi
          # Fork heads: the branch is not on origin and neither engine can push
          # there. Leave the workspace untouched and let the engine paths apply
          # their own fork handling (codexprep declines loudly; the Claude path
          # fetches the pull ref itself). The agent-merge flag is still set so
          # the Claude path keeps today's prompted-merge behavior there.
          if [ "$(jq -r '.isCrossRepository' <<<"$prj")" = "true" ]; then
            echo "PR #$NUM has a fork head — skipping the runner-side base sync."
            echo "agent_merge=1" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet origin "$branch" "$base"
          git checkout --quiet "$branch"
          echo "branch=$branch" >>"$GITHUB_OUTPUT"
          echo "base=$base" >>"$GITHUB_OUTPUT"
          # Pre-merge tip. The landing steps treat "HEAD moved past this" as
          # landable work, so stamping it BEFORE the merge is what makes a
          # merge-only round push. Stamped after, a clean merge with no agent
          # edits would read as "nothing to push" and die with the runner —
          # exactly the drift this step exists to end.
          echo "start_sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          conflicts=""
          if git merge --no-edit "origin/$base"; then
            echo "merged origin/$base cleanly"
            echo "merge_sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          else
            # quotePath off: C-quoted (non-ASCII) paths would garble the codex
            # prompt's file list and dodge the landing guard's [ -f ] check,
            # silently skipping the marker scan for exactly those files.
            conflicts=$(git -c core.quotePath=false diff --name-only --diff-filter=U)
            # A merge that fails WITHOUT content conflicts must not fall
            # through: the codex path would proceed silently against the stale
            # base (no MERGE_HEAD, empty conflict list), and the Claude path
            # would fail only by accident (merge --abort with no merge in
            # progress). Loud on both engines instead.
            if [ -z "$conflicts" ]; then
              echo "::error::merge of origin/$base failed without content conflicts — see the merge output above."
              exit 1
            fi
            echo "::warning::merge of origin/$base conflicts in: $(tr '\n' ' ' <<<"$conflicts")"
            if [ "$ENGINE" != "codex" ]; then
              git merge --abort
              echo "aborted: the Claude path needs a clean index; the agent re-merges."
              echo "agent_merge=1" >>"$GITHUB_OUTPUT"
              conflicts=""
            fi
          fi
          # Unique delimiter: the block carries repo file paths, and a path
          # equal to a fixed delimiter would terminate it early and inject
          # the remaining lines as step outputs.
          eof="SYNC_CONFLICTS_$(date +%s)_$RANDOM"
          {
            echo "conflicts<<$eof"
            echo "$conflicts"
            echo "$eof"
          } >>"$GITHUB_OUTPUT"

      # Provision the project environment so the agent's allow-listed
      # pytest/ruff/mypy can actually run (a bare runner has neither the deps
      # nor the package installed). Convention-based opt-in: a caller repo adds
      # a `.github/actions/claude-setup` composite action that delegates to its
      # existing, cache-backed CI setup — no install command is duplicated here,
      # and the GitHub cache is the caller's (scoped to the run's repo), so it
      # hits the same entries normal CI populates. `./` resolves against the
      # checked-out workspace (the caller repo), not this workflow's repo. The
      # hashFiles guard makes this a no-op for repos that don't define it.
      # Fatal on failure: a broken setup surfaces loudly rather than silently
      # degrading to static-only checks. See design/architecture.md.
      - name: Provision project environment
        id: setup
        if: hashFiles('.github/actions/claude-setup/action.yml', '.github/actions/claude-setup/action.yaml') != ''
        uses: ./.github/actions/claude-setup

      # Compose the appended-system-prompt sources into ONE value, so we emit a
      # single --append-system-prompt flag. Multiple flags would force a bet on
      # undocumented CLI behavior (accumulate vs. last-one-wins), and the sources
      # co-occur on PR follow-ups (review_etiquette and the branch-sync sources
      # fire there, and append_system_prompt fires on every run). PR context =
      # an issue comment on a PR, or a review/review-comment event; fresh issue
      # runs branch off the synced base and skip all of them. Within PR context
      # the branch-sync sources are gated on what "Sync branch with base" did:
      # branch_sync_prompt only when it handed the merge to the agent,
      # branch_sync_append whenever a merge happened at all (see BRANCH_SYNC_
      # APPEND below). Joined on one line so the toJSON splice below stays a
      # clean single-quoted arg (a newline would survive toJSON as a literal \n
      # in the shell-parsed args).
      #
      # REVIEW_ETIQUETTE mirrors the @auto review-fix loop's thread-resolution
      # rule (claude-auto-review.yml): the dev agent is regularly invoked to
      # address PR review comments (directly via @claude, or — as after an @auto
      # escalation — because a handoff comment re-trips the kickoff gate), and
      # without this it fixes the code but leaves the review thread open. gh api
      # graphql is covered by the settings allow-list (Bash(gh:*)).
      #
      # REQUEST_REVIEW closes the loop when @auto is invoked on an *existing* PR
      # (e.g. "@auto fix the review issue"): the kickoff runs this dev agent,
      # which fixes and pushes — but the reviewer never re-runs on its own (no
      # auto-review on push; on the fork the pull_request family doesn't fire at
      # all), so without an explicit @review the loop stalls until a human asks.
      # Gated to the @auto trigger (autonomous intent) so a plain @claude PR tweak
      # doesn't spawn an unasked review, and to PR context (the issue->PR-open
      # case posts @review from the Open-or-adopt post-step instead, via
      # request_review_after_open, so it lands after the label).
      # LANDING is always-on: the agent's work exists only on the ephemeral
      # runner until pushed, and a run can never resume after its final turn.
      # Observed failure (inspect_ai#195): full fix implemented and tested,
      # then the agent ended its turn "waiting on" a verification subagent
      # before committing — everything was lost, and the green run + tidy
      # summary made it look done. Same lesson the reviewer prompt already
      # carries; the deterministic backstop is the "Verify agent work landed"
      # step below.
      - name: Compose appended system prompt
        id: sysprompt
        env:
          LANDING: "Your work exists ONLY on this ephemeral runner until it is committed and pushed — and a run can NEVER resume after your final turn ends. In THIS environment nothing can wake you: background tasks do NOT re-invoke you when they finish, their completion notifications never arrive, and a turn that ends 'waiting to be woken' simply ends the run and loses everything unpushed. So never end your turn waiting on anything — subagents, background commands, test suites: collect results in the foreground and complete the commit, push, and any PR or comment inside THIS run. If a final validation is long-running, commit/push/open the PR FIRST and let the PR's own CI be the gate (the automation reacts to it); an unpushed validated change is worth nothing, a pushed change awaiting CI is the normal pipeline."
          # Spliced only when the runner-side sync could NOT land the merge
          # itself — a conflict it had to abort to keep the index clean for
          # setupBranch, or a fork head it declined. On the ordinary clean-merge
          # path the branch is ALREADY current when the agent starts, and
          # telling it to merge again is noise that invites a redundant push.
          BRANCH_SYNC: ${{ steps.sync.outputs.agent_merge == '1' && inputs.branch_sync_prompt || '' }}
          # branch_sync_append is NOT gated the same way: it must reach the
          # agent whenever a merge happened this run, clean or delegated. The
          # fork's append exists for a NON-conflicting mis-merge (git
          # auto-merges CHANGELOG.md cleanly and lands the entry under the
          # wrong heading), so on the clean path it rides behind a lead-in
          # saying the runner already merged and the agent should review the
          # result; on the delegated path it simply follows branch_sync_prompt.
          AGENT_MERGE: ${{ steps.sync.outputs.agent_merge }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          SYNC_BASE: ${{ steps.sync.outputs.base }}
          SYNC_APPEND: ${{ inputs.branch_sync_append }}
          REVIEW_ETIQUETTE: "${{ (github.event.issue.pull_request != '' || github.event.pull_request != '') && 'When your task involves addressing inline pull-request review comments, resolve each review thread you fully address in code so settled feedback is visibly closed: query repository.pullRequest.reviewThreads via gh api graphql to get each thread id, then call the resolveReviewThread GraphQL mutation with that id. Reply with a brief rationale to, and leave unresolved, any comment you deliberately decline; never resolve a thread you did not actually address.' || '' }}"
          REQUEST_REVIEW: "${{ (github.event.issue.pull_request != '' || github.event.pull_request != '') && inputs.trigger_phrase == '@auto' && 'This is an autonomous run on an existing pull request. If your work pushed any new commit to the PR, finish by posting a top-level comment of exactly @review so the automated reviewer re-runs — it does not run automatically on push. Do not post it if you made no code changes. That exact standalone comment is the ONLY place to write the token bare: in any other comment text, backtick it (`@review`) — a bare token anywhere in a comment body starts a review run.' || '' }}"
          EXTRA: ${{ inputs.append_system_prompt }}
        run: |
          # Flattened: a newline in the append would corrupt the value= output
          # line below (and survive toJSON as a literal \n).
          append=""
          if [ -n "${SYNC_APPEND:-}" ]; then
            if [ "${AGENT_MERGE:-}" = "1" ]; then
              append=$(tr '\n' ' ' <<<"$SYNC_APPEND")
            elif [ -n "${MERGE_SHA:-}" ]; then
              append="A workflow step already merged origin/$SYNC_BASE into this branch before you started (a clean merge, no conflicts); review that merge result against the following before making other changes, and fix it in your commit if it is off: $(tr '\n' ' ' <<<"$SYNC_APPEND")"
            fi
          fi
          combined=""
          for part in "$LANDING" "$BRANCH_SYNC" "$append" "$REVIEW_ETIQUETTE" "$REQUEST_REVIEW" "$EXTRA"; do
            [ -n "$part" ] && combined="${combined:+$combined }$part"
          done
          echo "value=$combined" >> "$GITHUB_OUTPUT"

      # @auto invoked on an *existing* PR (e.g. "@auto fix the review issue"):
      # opt that PR into the loop by applying the `auto` label. The review-fix
      # loop (claude-auto-review.yml) gates on this label. Applied BEFORE the
      # agent runs (not in a post-step) so the label is in place before the
      # agent posts its @review — otherwise a fast reviewer could post its
      # summary while the PR is still unlabeled and the loop would skip it (the
      # same race the issue->PR path avoids via request_review_after_open). The
      # PR already exists here, so we can label it up front. Gated to the @auto
      # trigger: a write-access human typing @auto is exactly the opt-in the
      # label represents (a plain @claude PR run stays one-shot).
      # github.event.issue.number is the PR number on a PR comment. Idempotent;
      # adding a label fires no workflow here (no stub triggers on pull_request
      # `labeled`), so no recursion. Remove the label to disengage.
      - name: Opt existing PR into the @auto loop
        if: >-
          github.event.issue.pull_request != '' &&
          inputs.trigger_phrase == '@auto'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          AUTO_LABEL: "auto"
        run: |
          set -euo pipefail
          gh pr edit "$PR" --repo "$REPO" --add-label "$AUTO_LABEL" \
            && echo "Opted PR #$PR into the @auto loop (added '$AUTO_LABEL')." \
            || echo "Could not add '$AUTO_LABEL' to PR #$PR (label missing or no perms); continuing."
          # Explicit re-engagement resets the @auto budgets. A human typing @auto
          # to continue a PR that already hit the cap should get a FRESH set of
          # rounds — otherwise the leftover count in the sticky marker (e.g. "10
          # (cap 10)") makes the very next review re-escalate immediately, so the
          # loop only manages the single kickoff fix and stops (see inspect_ai#53).
          # Reset both sticky counters so the next review round starts at 1 and the
          # CI-fixer gets its full attempt budget again; the reset body carries no
          # "rounds:"/"attempts:" number, so each gate reads 0 and the record step
          # re-initialises the marker. Dropping the stored auto-review-head also
          # re-baselines the no-progress check. Best-effort; never fail the run.
          for marker in "<!-- auto-review-rounds -->" "<!-- auto-fix-attempts -->"; do
            cid=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                    --jq 'map(select(.body|contains("'"$marker"'"))) | last | .id // empty' 2>/dev/null || true)
            [ -z "$cid" ] && continue
            gh api -X PATCH "repos/$REPO/issues/comments/$cid" -f body="$marker
          🤖 auto counters reset on re-engagement — fresh cap." --silent \
              && echo "Reset counter: $marker" || true
          done

      - uses: anthropics/claude-code-action@v1
        if: steps.engine.outputs.engine != 'codex'
        id: claude
        with:
          anthropic_federation_rule_id: fdrl_01GpNgJm9jE6ZfvcqoJYQL2Y
          anthropic_organization_id: be5d0086-bc43-45d2-9184-20ecdd647aa7
          anthropic_service_account_id: svac_01RL4wYD7ikbypwYKf4wFojv
          anthropic_workspace_id: wrkspc_01RKCQ5DTPBatQ7kHLkaEueD
          trigger_phrase: ${{ inputs.trigger_phrase }}
          label_trigger: ${{ inputs.label_trigger }}
          base_branch: ${{ inputs.base_branch }}
          # Machine-account identity (empty falls back to the Claude App token).
          # Passing it also stops the action revoking it, so the post-step below
          # can reuse the same live token to open the PR. See secrets.MARVIN_TOKEN.
          github_token: ${{ secrets.MARVIN_TOKEN }}
          settings: ${{ inputs.settings }}
          claude_args: >-
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
            ${{ inputs.model != '' && inputs.fallback_model != '' && format('--fallback-model {0}', inputs.fallback_model) || '' }}
            ${{ steps.sysprompt.outputs.value != '' && format('--append-system-prompt {0}', toJSON(steps.sysprompt.outputs.value)) || '' }}
            ${{ inputs.claude_args }}

      # If the runner's base merge is STILL the branch tip, the agent finished
      # without committing anything of its own — and on a PR run nothing else
      # pushes it. Land it anyway: restoring the PR to mergeable is what lets
      # GitHub compute a merge ref again, which is what lets CI run at all.
      # Gated on HEAD being EXACTLY that merge commit, so an agent that
      # committed on top — pushed, or deliberately not — is never second-
      # guessed. always(), so a failed or cancelled agent still leaves the
      # branch current rather than resuming tomorrow's drift.
      - name: Push base merge if unpushed
        if: >-
          always() && steps.engine.outputs.engine != 'codex' &&
          steps.sync.outputs.merge_sha != ''
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          MARVIN: ${{ secrets.MARVIN_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.sync.outputs.branch }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$MERGE_SHA" ]; then
            echo "agent commits sit on top of the base merge — leaving the push to it."
            exit 0
          fi
          git fetch --quiet origin "$BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" = "$MERGE_SHA" ]; then
            echo "base merge is already on origin/$BRANCH."
            exit 0
          fi
          # Same extraheader override as the codex landing step: this job's
          # checkout persisted github.token as an http.<origin>.extraheader,
          # which preempts the URL credential, so without the reset the push
          # runs as github-actions[bot] and triggers nothing.
          git -c http.https://github.com/.extraheader= push --quiet \
            "https://x-access-token:${MARVIN:-$GH_TOKEN}@github.com/$REPO.git" \
            "HEAD:refs/heads/$BRANCH"
          echo "pushed base merge $(git rev-parse --short HEAD) to $BRANCH"

      # ---- Codex engine (design/codex-engine.md) ----------------------------
      # The codex sandbox has no network and no GitHub credentials, so unlike
      # the Claude path the agent only edits the working tree: these steps
      # prepare the branch, feed the task in a prompt file, then commit/push
      # and post deterministically. claude-code-action's internal branch
      # handling is unavailable here, so the prep step reproduces it: PR runs
      # check out the PR head; issue runs cut a claude/issue-N-* branch (the
      # board's join convention) off the base.
      - name: Prepare workspace (codex)
        id: codexprep
        if: steps.engine.outputs.engine == 'codex'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ (github.event.issue.pull_request != '' || github.event.pull_request != '') && 'true' || 'false' }}
          BASE: ${{ inputs.base_branch }}
          SYNC_START_SHA: ${{ steps.sync.outputs.start_sha }}
        run: |
          set -euo pipefail
          git config user.name "i-am-marvin"
          git config user.email "i-am-marvin@users.noreply.github.com"
          if [ "$IS_PR" = "true" ]; then
            prj=$(gh pr view "$NUM" --repo "$REPO" --json headRefName,isCrossRepository)
            # Fork PRs are out: the head branch is not on origin (this fetch
            # would die opaquely) and the landing step could not push to the
            # fork anyway. Fail here with a clear cause — the Surface step
            # turns it into a visible comment (design/codex-engine.md).
            if [ "$(jq -r '.isCrossRepository' <<<"$prj")" = "true" ]; then
              echo "::error::PR #$NUM has a fork head — the codex engine cannot push to fork branches; remove the engine:codex label to use the Claude path."
              exit 1
            fi
            branch=$(jq -r '.headRefName' <<<"$prj")
            # "Sync branch with base" already fetched, checked out and merged
            # this branch. Re-running the checkout would abort on the unmerged
            # index it deliberately leaves behind for codex to resolve, so only
            # check out when that step did not (fork heads, which exit above).
            if [ "$(git rev-parse --abbrev-ref HEAD)" != "$branch" ]; then
              git fetch --quiet origin "$branch"
              git checkout --quiet "$branch"
            fi
          else
            base="${BASE:-$(gh repo view "$REPO" --json defaultBranchRef --jq .defaultBranchRef.name)}"
            branch="claude/issue-$NUM-codex-$GITHUB_RUN_NUMBER"
            git checkout --quiet -b "$branch" "origin/$base"
          fi
          echo "prepared branch: $branch"
          echo "branch=$branch" >>"$GITHUB_OUTPUT"
          # Start marker for the landing step: HEAD moved past this = work to
          # land, even if codex committed locally instead of leaving a dirty
          # tree. On PR runs prefer the sync step's PRE-merge tip, so a round
          # whose only product is the base merge still pushes; plain HEAD on
          # issue runs, where no merge happened.
          echo "sha=${SYNC_START_SHA:-$(git rev-parse HEAD)}" >>"$GITHUB_OUTPUT"

      # The prompt travels as a git-excluded workspace file (prompt-file must
      # be inside the repo root). The ending contract makes codex's final
      # message double as the commit subject + the posted comment.
      - name: Compose codex prompt
        id: codexcompose
        if: steps.engine.outputs.engine == 'codex'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ (github.event.issue.pull_request != '' || github.event.pull_request != '') && 'true' || 'false' }}
          BRANCH: ${{ steps.codexprep.outputs.branch }}
          BASE: ${{ steps.sync.outputs.base }}
          CONFLICTS: ${{ steps.sync.outputs.conflicts }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          SYNC_APPEND: ${{ inputs.branch_sync_append }}
          COMMENT: ${{ github.event.comment.body }}
          REVIEW: ${{ github.event.review.body }}
          IBODY: ${{ github.event.issue.body }}
          ITITLE: ${{ github.event.issue.title }}
          EXTRA: ${{ inputs.append_system_prompt }}
        run: |
          set -euo pipefail
          # Retry-then-fail on context fetches — never swallow: the embedded
          # context is load-bearing, so a swallowed transient either burns
          # the round on inference (PR #392, 2026-09-01: the emptiness guard
          # fired "empty — transient?" with the real gh error discarded) or
          # silently degrades the prompt where no emptiness invariant exists
          # (the inline-comments section). Three attempts absorb blips;
          # exhaustion fails the step with gh's real stderr in the log,
          # routing into the prep-failure surfacing.
          fetch() { # fetch <outfile> <gh args...>
            local out="$1"; shift
            local n=0
            until gh "$@" >"$out"; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then
                # >&2: call sites sit inside a stdout-redirected group, so a
                # plain echo would land in the abandoned scratch file; the
                # runner parses workflow commands on stderr too.
                echo "::error::context fetch failed after 3 attempts: gh $*" >&2
                return 1
              fi
              sleep $((n * 5))
            done
          }
          {
            echo "You are the dev agent for $REPO, running on the Codex engine in a full local checkout of branch $BRANCH."
            if [ "$IS_PR" = "true" ]; then
              echo "Context: pull request #$NUM — its head branch is checked out; your edits continue that PR."
            else
              echo "Context: issue #$NUM — your edits will be pushed to a new branch and opened as a PR fixing it."
            fi
            echo "CONSTRAINTS: you have NO network access and NO GitHub credentials — you cannot run gh, git fetch, git push, or post comments; do not try. Make your changes in the working tree on the checked-out branch only — do NOT create or switch branches or check out other commits. Committing locally is unnecessary but harmless (the landing step lands local commits too); a deterministic workflow step commits leftover edits, pushes, and posts for you. Verify your work with the locally provisioned tools (pytest/ruff/mypy) where relevant."
            if [ -n "${CONFLICTS:-}" ]; then
              echo "MERGE CONFLICT RESOLUTION — do this FIRST, before the task below. A merge of origin/$BASE into this branch is already IN PROGRESS in your working tree and conflicts in these files:"
              sed 's/^/  /' <<<"$CONFLICTS"
              [ -n "${SYNC_APPEND:-}" ] && echo "$SYNC_APPEND"
              echo "Resolve every conflict by editing those files, preserving BOTH sides' intent — the base side is other people's merged work, so never resolve by discarding it wholesale. Local git is available and useful here (git status, git diff, git log, git add <file>); the network-dependent commands in the CONSTRAINTS above are still off, and you must NOT run git merge, git rebase or git checkout of any ref — that would strand the in-progress merge. After resolving each file you MUST stage it with git add <file>: the landing step FAILS the run on any path still unmerged in the index (that index check is what catches binary and modify/delete conflicts, which have no markers), and on any surviving conflict marker — so leaving either is strictly worse than resolving and staging. Once resolved, treat the MERGED tree as the code you are working on: re-read what you changed and re-run the relevant tests against it, not against the pre-merge state."
            elif [ -n "${MERGE_SHA:-}" ] && [ -n "${SYNC_APPEND:-}" ]; then
              # Clean merge: the repo-specific merge rule still applies (the
              # fork's is about a NON-conflicting CHANGELOG mis-merge).
              echo "BASE MERGE NOTE: a workflow step already merged origin/$BASE into this branch before you started (a clean merge, no conflicts). Review that merge result against the following before the task below, and fix it in the working tree if it is off:"
              echo "$SYNC_APPEND"
            fi
            echo "ENDING CONTRACT: your final message MUST start with a single conventional-commit summary line for the change (it becomes the commit subject), then a blank line, then a body explaining what you did and why (it is posted as a comment on #$NUM). If you cannot or should not make a change, leave the tree untouched and explain why in the final message."
            [ -n "$EXTRA" ] && printf 'REPO GUIDANCE: %s\n' "$EXTRA"
            echo "TASK:"
            if [ -n "$COMMENT" ]; then
              printf '%s\n' "$COMMENT"
            elif [ -n "$REVIEW" ]; then
              printf '%s\n' "$REVIEW"
            else
              printf '%s\n\n%s\n' "$ITITLE" "$IBODY"
            fi
            if [ "$IS_PR" = "true" ]; then
              # Codex cannot read the PR thread the way the Claude path does
              # (gh at runtime), so embed it: title/body plus bounded
              # newest-last slices, mirroring the review-fix prep — a trigger
              # like "address the feedback above" needs its referent in the
              # prompt. Sliced at the source so the head cap below cannot
              # truncate away the newest comments on comment-heavy PRs.
              echo ""
              echo "PR TITLE AND BODY:"
              # No --slurp here, so gh's own --jq is fine; fetch to a file
              # and cat it, same retry-then-fail as the comment fetches.
              fetch "$RUNNER_TEMP/codex-prtb.txt" pr view "$NUM" --repo "$REPO" \
                --json title,body --jq '"\(.title)\n\n\(.body // "")"'
              cat "$RUNNER_TEMP/codex-prtb.txt"
              echo ""
              # --slurp is incompatible with gh's own --jq (gh rejects the
              # combination), so pipe to standalone jq instead.
              echo "RECENT PR COMMENTS (newest last):"
              fetch "$RUNNER_TEMP/codex-prc.json" api "repos/$REPO/issues/$NUM/comments" --paginate --slurp
              jq -r '(add // []) | .[-12:][] | "--- \(.user.login) at \(.created_at):\n\(.body)\n"' "$RUNNER_TEMP/codex-prc.json"
              echo "RECENT INLINE REVIEW COMMENTS (path:line; newest last):"
              fetch "$RUNNER_TEMP/codex-inline.json" api "repos/$REPO/pulls/$NUM/comments" --paginate --slurp
              jq -r '(add // []) | .[-40:][] | "--- \(.path):\(.line // .original_line // "?") \(.user.login):\n\(.body)\n"' "$RUNNER_TEMP/codex-inline.json"
            elif [ -n "$COMMENT" ]; then
              printf '\nFor context, the issue title/body:\n%s\n\n%s\n' "$ITITLE" "$IBODY"
            fi
          } >"$RUNNER_TEMP/codex-context.md"
          # Cap + de-fang from the completed scratch file, NOT in one
          # pipeline with the writers above (SIGPIPE discipline — see the
          # loops' prep steps). The instruction header and TASK sit before
          # the embedded thread, so the cap can never trim the trigger; the
          # source-bounded slices keep it headroom, not the working bound.
          # The sed is belt-and-braces with the landing step's output
          # de-fang: the embedded comments can include reviewer verdict
          # comments, and a marker substring codex never sees is one it
          # cannot echo (length-neutral substitutions).
          head -c 120000 "$RUNNER_TEMP/codex-context.md" \
            | sed -E -e 's/claude-review-(summary|verdict)/claude-review \1/g' \
                     -e 's/auto-(handoff|review-rounds|review-head|fix-attempts)/auto \1/g' >.codex-prompt.md
          # The landing step stages with a blanket `git add -A` (new source
          # files are legitimate output), so exclude the prompt file and the
          # scratch that codex's verification runs leave behind on repos
          # whose .gitignore doesn't already cover it (caches, venvs).
          printf '%s\n' .codex-prompt.md .venv/ venv/ __pycache__/ \
            .pytest_cache/ .mypy_cache/ .ruff_cache/ .coverage node_modules/ \
            >>.git/info/exclude

      # codex-action's default safety-strategy (drop-sudo) chmods root-owned
      # service sockets under /run, breaking D-Bus -> systemd-resolved -> DNS;
      # the hosted runner then dies with "lost communication" 52-65 minutes
      # into the job (openai/codex-action#160; observed twice at ~62 min on
      # inspect_ai#389, 2026-08-31). Until fixed upstream, run codex as a
      # dedicated unprivileged user — the README's other blessed strategy for
      # permission profiles: containment is the user boundary plus the
      # profile sandbox, and the API key stays out of reach (codex has no
      # sudo). Setup mirrors the action's examples/unprivileged-user.yml —
      # the chown/g+rwX is what lets codex (primary group codex) write the
      # runner-owned workspace — plus two grants the example never needs (it
      # passes no explicit output-file and its demo prompt never runs git):
      # a codex-owned output dir under RUNNER_TEMP and git safe.directory,
      # commented inline.
      # NB the runner->codex group grant is inert for this job:
      # supplementary groups are fixed at process start, and every step is
      # spawned from a Runner.Worker that predates the usermod. Landing
      # codex's edits works anyway — runner still owns the pre-existing
      # workspace directories, codex's files are world-readable under its
      # umask, and the land step reclaims .git — the one place codex-owned
      # dirs (objects/ fan-out) would block runner's writes. (Group kept as
      # a faithful copy of the example; if codex ever drops a 600 file, the
      # land step needs a chmod -R a+rX sweep, not this group.)
      - name: Create codex user
        id: codexuser
        if: steps.engine.outputs.engine == 'codex'
        run: |
          set -euo pipefail
          sudo adduser --system --home /home/codex --shell /bin/bash --group codex
          sudo usermod -a -G codex runner
          sudo usermod -a -G runner codex
          sudo chown -R runner:codex "$GITHUB_WORKSPACE"
          sudo chmod -R g+rwX "$GITHUB_WORKSPACE"
          sudo find "$GITHUB_WORKSPACE" -type d -exec chmod g+s {} +
          # codex itself (via sudo -u) writes the explicit output-file and
          # the action re-reads it as codex, but RUNNER_TEMP is 755
          # runner:runner on the hosted image. Not g+w on the temp root:
          # codex's runner-group membership IS effective (its processes
          # start post-usermod), so that would hand it rename/delete over
          # the runner's step scripts and the per-step GITHUB_ENV/OUTPUT/
          # PATH files. A codex-owned subdir grants only the output-file
          # write; 755 keeps $OUT readable for the runner-side land step.
          sudo install -d -o codex -g codex -m 755 "$RUNNER_TEMP/codex"
          # The checkout stays runner-owned, so git commands running as
          # codex hit the dubious-ownership refusal, and no profile sandbox
          # lets the agent add the exemption itself.
          sudo -u codex -H git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Codex
        id: codexrun
        if: steps.engine.outputs.engine == 'codex'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          safety-strategy: unprivileged-user
          codex-user: codex
          model: ${{ inputs.codex_model }}
          permission-profile: ":workspace"
          # Authorization: codex-action's own built-in write-access check on
          # the triggering actor is the real gate here — steps.trig
          # deliberately checks trigger shape, not permissions (see its
          # Known-divergence note), mirroring the Claude path where
          # claude-code-action's internal check authorizes. Consequence on
          # public repos: an outsider's trigger on an engine:codex item FAILS
          # this step (the Surface step's error text names that cause) where
          # the Claude path declines silently. No allow-bot-users: bot actors
          # never pass steps.trig, so none reach this step — matching the
          # Claude path, which sets no allowed_bots on this verb either.
          prompt-file: .codex-prompt.md
          output-file: ${{ runner.temp }}/codex/codex-final.md

      # Land the codex work: commit + push (as the machine account, so the
      # push triggers CI), expose branch_name so the Open-or-adopt step below
      # opens/labels the PR on issue runs, post the final message, and on
      # @auto PR runs post the re-review hand-back the push now owes. This
      # step failing fails the run loudly — codex work cannot strand silently.
      - name: Land codex work
        id: codexland
        if: steps.codexrun.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          MARVIN: ${{ secrets.MARVIN_TOKEN }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ (github.event.issue.pull_request != '' || github.event.pull_request != '') && 'true' || 'false' }}
          BRANCH: ${{ steps.codexprep.outputs.branch }}
          START_SHA: ${{ steps.codexprep.outputs.sha }}
          OUT: ${{ runner.temp }}/codex/codex-final.md
          TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}
          CONFLICTS: ${{ steps.sync.outputs.conflicts }}
        run: |
          set -euo pipefail
          # Reclaim .git before writing objects as runner: any objects/XX
          # fan-out dir codex created (any object-writing git command) is
          # codex-owned, and runner's codex-group membership is inert this
          # job — the commit below would intermittently fail with
          # "insufficient permission for adding an object".
          sudo chown -R runner "$GITHUB_WORKSPACE/.git"
          # Unresolved-merge guard. `git add -A` would happily stage conflict
          # markers and `git commit` would then produce a perfectly valid merge
          # commit containing them, so the only thing standing between a
          # half-resolved merge and the PR branch is this check. Two distinct
          # failures: an unmerged index (codex never staged a resolution) and
          # staged-but-unresolved text (it staged the markers).
          #
          # The index check runs BEFORE `git add -A` on purpose, and the prompt
          # requires codex to `git add` each resolved file: it is the only
          # check that catches binary and modify/delete conflicts, which have
          # no markers to scan for — a blanket add would silently "resolve"
          # those to whatever sits in the working tree.
          #
          # Only the files the sync step reported are scanned, and `=======` is
          # deliberately NOT matched: a bare seven-equals line is a legitimate
          # reStructuredText/Markdown heading underline, so a repo-wide grep
          # for it would fail honest docs changes.
          if [ -n "$(git ls-files --unmerged)" ]; then
            echo "::error::codex left paths unmerged in the index after the base merge (resolved files must be staged with git add): $(git -c core.quotePath=false diff --name-only --diff-filter=U | tr '\n' ' ')— resolve and stage them manually, or drop the engine:codex label to use the Claude path."
            exit 1
          fi
          if [ -n "${CONFLICTS:-}" ]; then
            while IFS= read -r f; do
              [ -n "$f" ] && [ -f "$f" ] || continue
              if grep -qE '^(<<<<<<<|>>>>>>>) ' -- "$f"; then
                echo "::error::conflict markers remain in $f — refusing to push a half-resolved merge."
                exit 1
              fi
            done <<<"$CONFLICTS"
          fi
          # Untracked files count: new source files are legitimate codex
          # output (the prompt file and common test/venv scratch are kept
          # out via .git/info/exclude, written by the compose step).
          # MERGE_HEAD too: a conflict resolution staged byte-identical to
          # HEAD ("ours" on every hunk) leaves status clean while the merge
          # is still in progress — commit anyway so the merge completes,
          # HEAD moves past START_SHA, and the push gate lands it.
          if [ -n "$(git status --porcelain)" ] || git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            # || true inside the substitution: without it a missing/unreadable
            # $OUT fails the pipeline and set -e kills the step before the
            # fallback is reached — the fallback would only ever cover an
            # empty first line.
            subject=$(head -n1 "$OUT" 2>/dev/null | cut -c1-120 || true)
            [ -n "$subject" ] || subject="codex: automated change for #$NUM"
            git add -A
            git commit --quiet -m "$subject" -m "Co-Authored-By: Codex <noreply@openai.com>"
          fi
          # Landable work = HEAD moved since prep, not just a dirty tree:
          # the prompt calls local commits unnecessary but they are possible,
          # and a status-only check would silently discard them with the
          # runner. The refspec already pins the target branch, so a HEAD
          # codex left elsewhere still lands on $BRANCH; a diverted HEAD
          # that isn't genuinely new work fails the push non-fast-forward —
          # loud, not lossy.
          pushed=""
          if [ "$(git rev-parse HEAD)" != "$START_SHA" ]; then
            # -c http...extraheader=: this job's checkout persisted
            # github.token as an http.<origin>.extraheader authorization
            # header, which git attaches to every request here and which
            # preempts the URL credential (URL creds are only offered on a
            # 401 challenge, and the header means none comes) — without the
            # override the push silently runs as github-actions[bot] and
            # triggers nothing. An empty value resets the header list for
            # this one command, so the machine-account credential in the
            # URL is the one that authenticates. (The loop workflows don't
            # need this: their checkout persists MARVIN_TOKEN itself.)
            git -c http.https://github.com/.extraheader= push --quiet "https://x-access-token:${MARVIN:-$GH_TOKEN}@github.com/$REPO.git" "HEAD:refs/heads/$BRANCH"
            pushed=1
            echo "pushed $(git rev-parse --short HEAD) to $BRANCH"
            [ "$IS_PR" != "true" ] && echo "branch_name=$BRANCH" >>"$GITHUB_OUTPUT"
          else
            echo "codex made no changes; nothing to push."
          fi
          # Post the final message (de-fanged: it posts from a write-access
          # account, so bare trigger tokens would fire workflows, and the
          # @auto loops match their verdict/handoff markers with plain
          # substring contains() — codex QUOTING a marker would forge a
          # verdict or suppress an owed hand-back, so break those substrings
          # too).
          {
            printf '🤖 codex (dev agent):\n\n'
            sed -E -e 's/@(review|claude|auto)/`\1`/g' \
                   -e 's/claude-review-(summary|verdict)/claude-review \1/g' \
                   -e 's/auto-(handoff|review-rounds|review-head|fix-attempts)/auto \1/g' \
                   "$OUT" 2>/dev/null || echo "(codex produced no final message)"
            [ -z "$pushed" ] && printf '\n\n_No code changes were made._'
          } >"$RUNNER_TEMP/codex-comment.md"
          # GitHub caps comment bodies at 65,536 characters and codex's final
          # message is unbounded; here the post failing lands AFTER the push,
          # losing the summary for work that already landed. Truncate with a
          # note instead — cutting the de-fanged body can't resurrect a
          # trigger or marker (the sed removed the @ / split the substrings,
          # and truncation only drops trailing bytes).
          if [ "$(wc -c <"$RUNNER_TEMP/codex-comment.md")" -gt 60000 ]; then
            head -c 60000 "$RUNNER_TEMP/codex-comment.md" >"$RUNNER_TEMP/codex-comment.trunc"
            printf '\n\n_[truncated: codex output exceeded the comment size cap]_\n' >>"$RUNNER_TEMP/codex-comment.trunc"
            mv "$RUNNER_TEMP/codex-comment.trunc" "$RUNNER_TEMP/codex-comment.md"
          fi
          gh api "repos/$REPO/issues/$NUM/comments" -F body=@"$RUNNER_TEMP/codex-comment.md" --silent
          # Mirrors the Claude path's REQUEST_REVIEW prompt rule,
          # deterministically: an @auto push to an existing PR owes a
          # re-review (the reviewer does not run on push).
          if [ "$IS_PR" = "true" ] && [ -n "$pushed" ] && [ "$TRIGGER_PHRASE" = "@auto" ]; then
            gh pr comment "$NUM" --repo "$REPO" --body '@review'
          fi
      # ---- end Codex engine --------------------------------------------------

      # On issue triggers claude-code-action pushes a branch but usually only
      # posts a prefilled "Create PR" link rather than opening the PR — its
      # built-in flow tends to win over any --append-system-prompt nudge to run
      # `gh pr create`. So open the PR here deterministically. The exception: a
      # multi-step task ("open a PR and follow it through") can have the agent
      # run `gh pr create` itself — and this is the norm on the fork, whose
      # appended prompt mandates it — so by the time this step runs the PR may
      # already exist. Either way this step must reach the labeling below: adopt
      # the existing PR or open one, then propagate the `auto` label. (Original
      # bug: opening and labeling lived on one path, so agent-opened PRs never
      # got the `auto` label and the @auto review loop never engaged on them.)
      # Gated to fresh issue runs (the inverse of the branch-sync gate): PR
      # follow-ups already have a PR. branch_name is the action's output for the
      # branch it pushed — empty when the run made no commits, so this no-ops.
      #
      # Token: prefer the machine-account PAT (MARVIN_TOKEN). It's a real GitHub
      # identity, so the PR it opens triggers CI and @review (the whole point);
      # and because it was passed to the action as github_token, the action did
      # NOT revoke it, so it's still live here. Two dead ends ruled this in:
      # steps.claude.outputs.github_token is the Claude App token, which the
      # action revokes inside its own composite step (gh → 401 here); and the
      # default GITHUB_TOKEN is barred from creating PRs where the org disables
      # Actions PR-creation, and even when allowed its PRs trigger no CI
      # (recursion guard). The `|| github.token` fallback only applies on repos
      # without the secret, where it degrades exactly as documented above.
      - name: Open or adopt PR for issue-triggered run
        id: openpr
        if: >-
          github.event.issue.pull_request == '' &&
          github.event.pull_request == '' &&
          (steps.claude.outputs.branch_name != '' || steps.codexland.outputs.branch_name != '')
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.claude.outputs.branch_name || steps.codexland.outputs.branch_name }}
          # Empty on most repos (gh defaults --base to the repo default branch);
          # set on the fork, where base is pristine main, not the meridian default.
          BASE: ${{ inputs.base_branch }}
          ISSUE: ${{ github.event.issue.number }}
          # Label that opts a PR into the @auto loop; propagated from the issue.
          AUTO_LABEL: "auto"
          # The kickoff's trigger phrase — "@auto" for the autonomous kickoff job,
          # whether it fired from the `auto` label OR an `@auto` mention. Used to
          # label the PR even when the issue itself carries no `auto` label.
          TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}
          REQ_REVIEW: ${{ inputs.request_review_after_open }}
        run: |
          set -euo pipefail
          # The branch lives on origin; the initial checkout predates the push.
          if ! git fetch --quiet origin "$BRANCH"; then
            echo "Branch $BRANCH not on origin; nothing to open."
            exit 0
          fi
          # Adopt the PR if the agent already opened one for this branch (fork /
          # multi-step tasks); otherwise open it ourselves. Both paths fall
          # through to the labeling below.
          pr_url="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$pr_url" ]; then
            echo "PR already exists for $BRANCH ($pr_url); adopting it."
            opened=false
          else
            # Title/body from the latest commit (the agent writes descriptive,
            # conventional-commit messages); prefix the body with the issue link.
            title="$(git log -1 --format=%s FETCH_HEAD)"
            detail="$(git log -1 --format=%b FETCH_HEAD)"
            body="$(printf 'Fixes #%s\n\n%s' "$ISSUE" "$detail")"
            pr_url="$(gh pr create --repo "$REPO" --head "$BRANCH" ${BASE:+--base "$BASE"} \
              --title "$title" --body "$body")"
            opened=true
          fi
          # Label the PR `auto` so the @auto loop engages — whenever this is an
          # @auto run. That's true if the kickoff's trigger phrase is `@auto`
          # (fired by an `@auto` *mention*, even on an unlabeled issue) OR the
          # originating issue carries the `auto` label. The mention case was the
          # gap: "@auto please implement this" on an unlabeled issue opened an
          # unlabeled PR, so the review-fix loop never engaged (inspect_ai#71/#74).
          # Idempotent, and independent of who opened the PR — must run on the
          # adopt path too, or fork/agent-opened PRs never get labeled.
          issue_labels=$(gh issue view "$ISSUE" --repo "$REPO" --json labels --jq '.labels[].name' 2>/dev/null || true)
          if [ "$TRIGGER_PHRASE" = "@auto" ] \
             || grep -qx "$AUTO_LABEL" <<<"$issue_labels"; then
            echo "@auto run; labeling $pr_url with '$AUTO_LABEL'."
            gh pr edit "$pr_url" --add-label "$AUTO_LABEL" || true
          fi
          # Propagate any engine:* label too (design/codex-engine.md): every
          # PR-scoped run — reviewer, both loop rounds — reads the PR's own
          # labels, so without this an issue-selected engine would silently
          # revert to Claude the moment the PR opens. Copies the whole
          # engine: namespace (not just engine:codex) so future engines need
          # no change here. Runs before the @review below, so the first
          # review already sees the label.
          while IFS= read -r lbl; do
            [ -n "$lbl" ] || continue
            echo "propagating $lbl to $pr_url."
            gh pr edit "$pr_url" --add-label "$lbl" || true
          done <<<"$(grep '^engine:' <<<"$issue_labels" || true)"
          # Start the reviewer — but only AFTER the label above, so the review-fix
          # loop sees an authorized (labeled) PR when the reviewer's summary lands.
          # Only where the caller opts in (the fork, where PR-open auto-review
          # doesn't fire); elsewhere that native trigger already covers it. Posted
          # as the machine account so it actually triggers the reviewer. This
          # replaces the agent posting @review from its prompt, which raced the
          # labeling above (see request_review_after_open).
          if [ "${REQ_REVIEW:-false}" = "true" ]; then
            echo "Requesting review on $pr_url (post-label)."
            gh pr comment "$pr_url" --repo "$REPO" --body '@review' || true
          fi
          # Surface the real PR link on the issue — only when WE opened it.
          # claude-code-action's own run summary only shows a prefilled "Create
          # PR" compare link (now stale) and never names the opened PR, so post
          # it explicitly. When the agent opened its own PR it already linked it,
          # so a second comment here would just be noise.
          if [ "$opened" = "true" ]; then
            gh issue comment "$ISSUE" --repo "$REPO" --body "$(printf \
              '✅ Opened a pull request for this issue: %s\n\n(The "Create PR ➔" link in the run summary above is superseded — the PR is already open.)' \
              "$pr_url")" || true
          fi
          # Expose the PR for the stage post-step: an @auto run that left a PR
          # in the loop stays Agent; one that didn't hands back.
          echo "url=$pr_url" >>"$GITHUB_OUTPUT"

      # A run can end with its work stranded on the runner: the agent edits (and
      # maybe commits) locally, spawns a verification subagent, and ends its
      # turn "waiting" — a run can never resume, so everything evaporates with
      # the runner while the green run + tidy summary hide it (observed:
      # inspect_ai#195 — fix implemented and tested, zero bytes landed, stage
      # handed back to Review with nothing to review). Deterministic backstop
      # for the LANDING prompt rule: on issue-triggered runs, tracked-file
      # edits left uncommitted (untracked files are ignored — test caches and
      # scratch leftovers are normal), a reported branch carrying local commits
      # that never reached origin, or local commits contained in no remote ref
      # all mean the work did NOT land — say so visibly and fail the run.
      # The branch check only applies when the branch exists locally with
      # commits beyond the start SHA: the action mints a per-run branch name
      # even when the task is to update an EXISTING PR branch, and in that flow
      # the minted branch is legitimately never pushed (observed: inspect_ai#67
      # — review fixes pushed to the existing PR branch, false ⚠️ posted for
      # the unused per-run branch).
      - name: Verify agent work landed
        if: >-
          always() && steps.claude.outcome == 'success' &&
          github.event.issue.pull_request == '' &&
          github.event.pull_request == ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          START_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          unlanded=""
          dirty=$(git status --porcelain --untracked-files=no 2>/dev/null || true)
          [ -n "$dirty" ] && unlanded="uncommitted edits to tracked files"
          local_tip=$(git rev-parse --quiet --verify "refs/heads/${BRANCH:-}" || true)
          if [ -n "$local_tip" ] && [ "$local_tip" != "$START_SHA" ]; then
            git fetch --quiet origin "$BRANCH" 2>/dev/null || true
            if ! git branch -r --contains "$local_tip" 2>/dev/null | grep -q .; then
              unlanded="${unlanded:+$unlanded; }branch $BRANCH has local commits that never reached origin"
            fi
          fi
          head=$(git rev-parse HEAD 2>/dev/null || echo "")
          if [ -n "$head" ] && [ "$head" != "$START_SHA" ] \
             && ! git branch -r --contains "$head" 2>/dev/null | grep -q .; then
            unlanded="${unlanded:+$unlanded; }local commits contained in no remote branch"
          fi
          [ -z "$unlanded" ] && { echo "Work landed (or the run made no changes)."; exit 0; }
          # Local scratch is not proof of loss: a task's deliverable can land
          # OUTSIDE this repo (a companion-repo PR, agent comments) while
          # regeneration byproducts stay local by design (observed: an
          # External schema-regen task delivered a green ts-mono PR and drew
          # this ⚠️ for its local leftovers). Before flagging, look for
          # evidence the run shipped something anywhere: PRs the machine
          # account or agent app opened in the org since the run started, or
          # agent comments on this issue. Evidence -> pass with a notice
          # naming it; none -> the work is genuinely gone, External or not.
          started=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" --jq .created_at 2>/dev/null || true)
          evidence=""
          if [ -n "$started" ]; then
            org="${REPO%%/*}"
            prs=$(gh search prs --owner "$org" --author i-am-marvin --created ">=$started" \
                    --json repository,number --jq '[.[] | "\(.repository.nameWithOwner)#\(.number)"] | join(", ")' 2>/dev/null || true)
            [ -z "$prs" ] && prs=$(gh search prs --owner "$org" --author "app/claude" --created ">=$started" \
                    --json repository,number --jq '[.[] | "\(.repository.nameWithOwner)#\(.number)"] | join(", ")' 2>/dev/null || true)
            [ -n "$prs" ] && evidence="PR(s) opened during this run: $prs"
            if [ -z "$evidence" ]; then
              n=$(gh api "repos/$REPO/issues/$ISSUE/comments?since=$started" \
                    --jq '[.[] | select(.user.login == "claude[bot]")] | length' 2>/dev/null || echo 0)
              [ "${n:-0}" -gt 0 ] && evidence="$n agent comment(s) posted on this issue"
            fi
          fi
          if [ -n "$evidence" ]; then
            echo "::notice::local changes not landed ($unlanded), but the run shipped work elsewhere — $evidence. Local state treated as deliberate scratch."
            exit 0
          fi
          echo "::error::agent work did not land: $unlanded"
          gh issue comment "$ISSUE" --repo "$REPO" --body "$(printf '⚠️ The agent run finished WITHOUT landing its work (%s). The runner is ephemeral, so those changes are gone — the summary above may describe work that exists on no branch. Re-trigger to redo the task.' "$unlanded")" || true
          exit 1

      # Surface agent errors the action swallows. A model API error (overload /
      # 529, a model 404, etc.) leaves the run green at the workflow level but
      # with no result — and a stale "I'll get back to you" comment. Detect
      # is_error in the execution log (or a failed action step), post a visible
      # comment, and fail the job so the run isn't a misleading success.
      - name: Surface agent errors
        id: surface
        if: always()
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ (github.event.issue.pull_request != '' || github.event.pull_request != '') && 'true' || 'false' }}
          ANCHOR_REPO: ${{ inputs.anchor_repo }}
          CODEXPREP_OUTCOME: ${{ steps.codexprep.outcome }}
          CODEXCOMPOSE_OUTCOME: ${{ steps.codexcompose.outcome }}
          CODEXUSER_OUTCOME: ${{ steps.codexuser.outcome }}
          CODEX_OUTCOME: ${{ steps.codexrun.outcome }}
          CODEXLAND_OUTCOME: ${{ steps.codexland.outcome }}
        run: |
          set -uo pipefail
          file="${EXEC:-/home/runner/work/_temp/claude-execution-output.json}"
          err=""
          # The base-branch sync died before the agent started (a transient
          # gh/fetch error, or its own loud non-conflict merge failure). Every
          # downstream step is SKIPPED, not failed, so no other branch below
          # fires — without this the person who typed the trigger gets the
          # eyes reaction and then silence.
          if [ "${SYNC_OUTCOME:-}" = "failure" ]; then
            err="the base-branch sync step failed before the agent started (a transient gh/fetch error, or a base merge that failed without content conflicts — see the job logs); re-trigger to retry."
          fi
          # Provisioning died before the agent started (observed: a transient
          # curl failure downloading uv) — without this, the issue gets no
          # comment at all because the agent step was skipped, not failed.
          if [ -z "$err" ] && [ "${SETUP_OUTCOME:-}" = "failure" ]; then
            err="environment provisioning (claude-setup) failed before the agent started — usually a transient dependency-download/network error; re-trigger to retry."
          fi
          [ -z "$err" ] && [ -f "$file" ] && err=$(jq -r '(if type=="array" then . else .messages end) | map(select(.type=="result" and .is_error==true)) | last | .result // empty' "$file" 2>/dev/null || true)
          if [ -z "$err" ] && [ "$CLAUDE_OUTCOME" = "failure" ]; then
            err="the Claude Code step failed before producing a result (see the job logs)."
          fi
          # Codex engine: no execution file exists; step outcomes are the
          # signal (landing is deterministic, so green steps cannot strand).
          if [ -z "$err" ] && [ "${CODEXPREP_OUTCOME:-}" = "failure" ]; then
            err="the codex workspace prep failed before the agent started — a fork-head PR (the codex engine cannot push to fork branches; remove the engine:codex label), or a branch fetch error (see the job logs)."
          fi
          if [ -z "$err" ] && [ "${CODEXCOMPOSE_OUTCOME:-}" = "failure" ]; then
            err="composing the codex prompt failed before the agent started (see the job logs)."
          fi
          # A failed codex-user setup SKIPS the codex step, so it needs its
          # own check or the failure is a silent red job.
          if [ -z "$err" ] && [ "${CODEXUSER_OUTCOME:-}" = "failure" ]; then
            err="the codex user setup failed before the agent started (a runner-image change breaking adduser/usermod? — see the job logs)."
          fi
          if [ -z "$err" ] && [ "${CODEX_OUTCOME:-}" = "failure" ]; then
            err="the codex step failed (missing OPENAI_API_KEY, a triggering actor without write access, or a codex-action error — see the job logs)."
          fi
          if [ -z "$err" ] && [ "${CODEXLAND_OUTCOME:-}" = "failure" ]; then
            err="codex finished but its landing step failed — the work may not have reached the branch (see the job logs)."
          fi
          [ -z "$err" ] && { echo "No agent error detected."; exit 0; }
          echo "::error::Claude run did not complete: $err"
          if [ -n "${NUM:-}" ]; then
            # cc the responsible human on PR threads (same rationale as the
            # auto loops): PR-triggered failures otherwise email nobody. Issue
            # threads skip this — the issue author/assignee already gets email
            # as a participant. Derivation mirrors claude-auto.yml: closing
            # ref, else claude/issue-N-* branch; author unless bot/machine
            # account, else first assignee.
            cc=""
            if [ "${IS_PR:-false}" = "true" ]; then
              mention=""
              prj=$(gh pr view "$NUM" --repo "$REPO" --json body,headRefName 2>/dev/null || echo '{}')
              ref=$(jq -r '.body // ""' <<<"$prj" \
                      | grep -ioE '(fixes|closes|resolves)[[:space:]]+([-A-Za-z0-9._]+/[-A-Za-z0-9._]+)?#[0-9]+' \
                      | head -1 || true)
              inum=""
              issue_repo="$REPO"
              lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
              if [ -n "$ref" ]; then
                refrepo=$(printf '%s' "$ref" | grep -oiE '[-A-Za-z0-9._]+/[-A-Za-z0-9._]+' || true)
                if [ -z "$refrepo" ] || [ "$(lower "$refrepo")" = "$(lower "$REPO")" ]; then
                  inum=$(printf '%s' "$ref" | sed -n 's/.*#\([0-9]\{1,\}\).*/\1/p')
                elif [ -n "${ANCHOR_REPO:-}" ] && [ "$(lower "$refrepo")" = "$(lower "$ANCHOR_REPO")" ]; then
                  inum=$(printf '%s' "$ref" | sed -n 's/.*#\([0-9]\{1,\}\).*/\1/p')
                  issue_repo="$ANCHOR_REPO"
                fi
              fi
              if [ -z "$inum" ]; then
                hb=$(jq -r '.headRefName // ""' <<<"$prj")
                inum=$(printf '%s' "$hb" | sed -n 's/^claude\/issue-\([0-9]\{1,\}\)-.*/\1/p')
                if [ -n "$inum" ] && [ -n "${ANCHOR_REPO:-}" ] && \
                   gh api "repos/$ANCHOR_REPO/branches/$hb" --silent >/dev/null 2>&1; then
                  issue_repo="$ANCHOR_REPO"
                fi
              fi
              [ -n "$inum" ] && mention=$(gh api "repos/$issue_repo/issues/$inum" \
                --jq 'if .pull_request then "" elif (.user.type=="Bot" or .user.login=="i-am-marvin") then (.assignees[0].login // "") else .user.login end' 2>/dev/null || true)
              [ -n "$mention" ] && cc=$(printf '\n\ncc @%s' "$mention")
            fi
            gh issue comment "$NUM" --repo "$REPO" --body "$(printf '⚠️ This Claude run did not complete — it errored before finishing:\n\n> %s\n\nUsually transient (model API capacity/overload or a model-availability blip). Re-trigger to retry; if it persists see https://status.claude.com.%s' "$err" "$cc")" || true
          fi
          exit 1

      # Atlas tracking: the one-shot dev agent hands back to a human when it's
      # done — and an errored run also needs a human (the error comment asks
      # for a re-trigger) — so move to Review. The exception is a
      # SUCCESSFUL @auto run that left a PR in the loop (opened/adopted one, or
      # ran on a PR): the automated review loop owns the stage from there
      # (claude-auto-review.yml sets Review at its converged/escalated
      # handoff). always(): this must run after a failed claude step or a
      # failing Surface step — those are exactly the hand-back-to-human cases.
      - name: Stage - Review (hand-back)
        if: >-
          always() && steps.trig.outputs.ok == 'true' && !(
            inputs.trigger_phrase == '@auto' &&
            (steps.claude.outcome == 'success' || steps.codexland.outcome == 'success') &&
            steps.surface.outcome == 'success' &&
            (github.event.issue.pull_request != '' ||
             github.event.pull_request != '' ||
             steps.openpr.outputs.url != '')
          )
        uses: meridianlabs-ai/agents/.github/actions/set-stage@main
        with:
          stage: Review
          token: ${{ secrets.MARVIN_TOKEN }}
          repo: ${{ github.repository }}
          issue: ${{ github.event.issue.number || github.event.pull_request.number }}

      - name: Upload execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-output
          path: /home/runner/work/_temp/claude-execution-output.json
          if-no-files-found: ignore
