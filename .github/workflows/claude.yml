name: Claude (reusable)

# Reusable workflow wrapping anthropics/claude-code-action.
# Caller repos add a thin stub (see examples/claude-stub.yml) and inherit
# all configuration from here, so trigger/config changes happen in one place.
#
# Auth uses Anthropic Workload Identity Federation: each run exchanges the
# GitHub OIDC token for a short-lived Anthropic credential scoped to the
# meridian service account/workspace. No secrets required — but callers MUST
# grant `id-token: write` at the calling job level (GitHub does not pass
# id-token to reusable workflows implicitly).
#
# Note: GitHub does not issue OIDC tokens to workflows triggered by PRs from
# forks, so fork PRs cannot authenticate. All triggers in the stub run in the
# base-repo context, so this only matters if a caller adds pull_request
# triggers of its own — and since issue #59 those would not run the agent
# anyway: the trigger gate below has no pull_request branch, so `ok` stays
# false and every gated step (checkout through the action) is skipped.
#
# Fork-head PRs are REFUSED outright (issue #59): a comment or review on a PR
# whose head lives in a fork used to check out and execute that fork's code —
# its claude-setup action, then pytest/pip/uv from the allow-list — outside
# any sandbox, in a job holding MARVIN_TOKEN, the contents-write job token and
# the OIDC request token, and BEFORE claude-code-action's write-access check on
# the commenter. "The head is in a fork" is decided in the trigger gate, before
# any checkout, independent of who triggered the run; the reviewer (@review)
# is the sandboxed path for reviewing fork PRs.
#
# Three jobs since issue #84 (design/architecture.md → Landing job): `gate`
# (trusted: the trigger check and every write that must happen before the
# agent runs — 👀, stage → Agent, the @auto opt-in and counter reset — with
# MARVIN_TOKEN), `agent` (untrusted: checkout, provisioning, the agent; the
# job token only; commits locally and never pushes) and `land` (trusted: a
# fresh runner that pushes the commits, opens the PR on issue runs, posts
# the comments, the hand-back and the error report, and moves the stage —
# as marvin, from the manifest the agent job emitted). One push per run,
# at the end; iterating on CI is the @auto loop's job.

on:
  workflow_call:
    inputs:
      trigger_phrase:
        description: Comment phrase that triggers Claude
        required: false
        type: string
        default: "@claude"
      anchor_repo:
        description: >-
          Repo whose issues this repo's claude/issue-N-* branch numbers
          reference when the same-named branch also exists there (the
          companion convention). Used only for @-mention derivation.
        required: false
        type: string
        default: ""
      label_trigger:
        description: Issue label that triggers Claude
        required: false
        type: string
        default: "claude"
      claude_args:
        description: Additional CLI arguments passed through to Claude Code
        required: false
        type: string
        default: ""
      model:
        description: >-
          Preferred model, passed to Claude Code as --model (empty = Claude
          Code's own default). Defaults to the Fable alias for all meridian
          repos. claude-code-action@v1 has no first-class model input, so this
          is spliced into claude_args.
        required: false
        type: string
        default: "fable"
      fallback_model:
        description: >-
          Model used when the preferred model is overloaded or unavailable
          (e.g. retired), passed as --fallback-model. "default" expands to the
          account default, so the Fable-preferred default degrades gracefully
          if Fable is gone. Pass "" to disable fallback. Ignored when model is
          empty.
        required: false
        type: string
        default: "default"
      codex_model:
        description: >-
          Model for the codex engine (design/codex-engine.md). Empty (the
          default) omits --model so the run uses the codex CLI's own default,
          which tracks OpenAI's current flagship without edits here (decision:
          Ransom, 2026-09-08; previously pinned gpt-5.6-sol). Set to pin.
        required: false
        type: string
        default: ""
      codex_effort:
        description: >-
          Reasoning effort for codex implementation runs
          (low|medium|high|xhigh|max). Runs at high — reviews run at xhigh
          (decision: Ransom, 2026-09-08). Empty falls back to the codex CLI
          default.
        required: false
        type: string
        default: "high"
      settings:
        description: >-
          Claude Code settings JSON (inline). Owns the permission allow-list:
          file edits + the verify loop (both python/python3 forms) + gh for
          PR and CI reads + a scoped git allow-list so the agent can sync
          its working branch with the base branch (fetch/merge/rebase) and
          inspect history. Additive to the action's defaults; headless runs
          auto-deny anything not allowed, which keeps arbitrary execution off
          the table for workflows triggered by public issue content. git is
          scoped to branch-sync + read-only subcommands, not blanket git:*.
          The agent never pushes or posts (issue #84): the "Compose agent
          settings" step strips `Bash(git push:*)` from whatever this holds
          and denies it — together with claude-code-action's tag-mode push
          wrapper and the gh verbs that comment, review, open or merge — so
          a caller's override cannot re-enable them; the land job pushes and
          opens the PR from the landing manifest.
        required: false
        type: string
        default: >-
          {"permissions":{"allow":["Read","Edit","Write",
          "Bash(pytest:*)","Bash(ruff:*)","Bash(mypy:*)","Bash(pyright:*)","Bash(pip:*)",
          "Bash(pip3:*)","Bash(uv:*)","Bash(python:*)","Bash(python3:*)",
          "Bash(gh:*)",
          "Bash(git fetch:*)","Bash(git merge:*)","Bash(git rebase:*)",
          "Bash(git checkout:*)","Bash(git switch:*)",
          "Bash(git branch:*)","Bash(git status:*)","Bash(git log:*)",
          "Bash(git diff:*)","Bash(git show:*)","Bash(git rev-parse:*)",
          "Bash(git remote:*)",
          "Bash(git add:*)","Bash(git commit:*)","Bash(git config:*)"]}}
      base_branch:
        description: >-
          Base branch for branches/PRs Claude creates (defaults to the repo's
          default branch). Used by the inspect_ai fork to target pristine main
          rather than the meridian default branch.
        required: false
        type: string
        default: ""
      request_review_after_open:
        description: >-
          After the land job opens/adopts an issue-triggered PR and applies
          the `auto` label, post an `@review` comment to start the reviewer.
          Set "true" only where auto-review-on-open does not fire — i.e. the
          inspect_ai fork, whose `pull_request` events never reach the
          workflow. Since #84 this is the landing manifest's `handback`: the
          land composite posts exactly `@review` after its PR step, which
          labels first, so the review-fix loop always sees a labeled PR when
          the reviewer's summary lands (the race this input was created to
          close: the agent used to post `@review` mid-run, before the label).
          Leave "false" on repos where PR-open auto-review already fires
          (posting @review here would double-review).
        required: false
        type: string
        default: "false"
      branch_sync_prompt:
        description: >-
          Guidance appended to the system prompt (via --append-system-prompt,
          so it adds to — not replaces — the comment-derived task) on the Claude
          path when the agent has to perform the base merge ITSELF: the "Sync
          branch with base" step normally merges on the runner for both engines,
          and only hands the job back here when it could not — a conflict (the
          index must be clean before claude-code-action's setupBranch runs) or a
          fork head (unreachable in this workflow since issue #59: the trigger
          gate refuses fork heads before the sync runs; the shared composite's
          fork-head hand-off is kept as defense in depth). Fresh runs from an
          issue branch off the (hourly-synced) base, so no merge is needed and
          this is skipped. NB an empty value is NOT a sync off-switch: the
          runner-side merge always runs on PR-context runs; empty only
          suppresses this agent-side instruction, leaving the agent
          uninstructed on the conflict path — so keep it non-empty unless the
          caller handles that case itself.
        required: false
        type: string
        default: >-
          You are continuing work on an existing branch. Before making any code
          changes, bring it up to date with its base branch: fetch the base
          branch and merge it into this branch, resolving any conflicts, so your
          changes and their tests run against current code — and leave that merge
          committed on the branch; the workflow lands it with your other
          commits. The checkout has full history (fetch-depth 0),
          so a local merge works without extra fetching depth.
      branch_sync_append:
        description: >-
          Caller-specific guidance about the base merge, reaching the agent
          whenever a merge happened this run — on BOTH engines. When "Sync
          branch with base" hands the merge to the agent (a conflict; the
          composite's fork-head hand-off is unreachable here since issue #59)
          it is appended to branch_sync_prompt; when the runner merged
          cleanly it is spliced on its own, behind a one-line lead-in saying a
          workflow step already merged and the agent should review the result.
          Clean merges are the case that motivated it: git can auto-merge a
          CHANGELOG without conflict and still land an entry under the wrong
          heading, which is exactly what the inspect_ai fork's append checks
          for. Empty by default. Keep it a single line — the composed prompt
          travels as one output line, so newlines are flattened.
        required: false
        type: string
        default: ""
      append_system_prompt:
        description: >-
          Repo-specific guidance appended to the system prompt (via
          --append-system-prompt, so it adds to — not replaces — the
          comment-derived task) on EVERY dev run. Empty by default: this is the
          channel for caller-specific conventions a shared default can't carry
          — e.g. the inspect_ai fork's stub sets it with CHANGELOG.md rules.
          (The fork can't ship a CLAUDE.md/AGENTS.md file: main must stay
          pristine and a file on meridian isn't present on the main-cut branches
          the agent works from — see design/shared-instructions.md.) Distinct
          from branch_sync_prompt, which is gated to PR follow-up runs.
        required: false
        type: string
        default: ""
    secrets:
      MARVIN_TOKEN:
        description: >-
          Machine-account (marvin@meridianlabs.ai) fine-grained PAT. Optional;
          stubs pass it explicitly by name in their `secrets:` map (not
          `secrets: inherit`, which would expose every caller secret to this
          @main-pinned workflow — only the secrets declared here are consumed:
          this one and OPENAI_API_KEY below). Named ONLY in the `gate` and
          `land` jobs (issue #84; design/architecture.md → Landing job): the
          gate's pre-agent writes (the 👀 ack, the stage move, the @auto
          opt-in and counter reset) and the land job's push, PR, comments,
          hand-back and stage move run as the machine account, so the pushed
          branch and the PR trigger CI and @review, which a GITHUB_TOKEN push
          or PR cannot (GitHub's recursion guard). The job that runs the
          agent never sees it: the agent commits locally, with
          claude-code-action's own App token as its GITHUB_TOKEN. When
          absent, the land job falls back to the job token — the push and
          the PR come from github-actions[bot] (no CI; blocked entirely where
          Actions-PR-creation is disallowed), the documented degradation.
          This is the identity layer for @auto; model auth stays Workload
          Identity Federation regardless. See design/auto-agent.md.
        required: false
      OPENAI_API_KEY:
        description: >-
          OpenAI API key for the codex engine (design/codex-engine.md).
          Consumed ONLY by the openai/codex-action step, which runs on items
          labeled engine:codex. Optional: absent, codex-labeled runs fail
          loudly at that step (never a silent Claude fallback).
        required: false

jobs:
  # TRUSTED: the trigger check and every write that must happen BEFORE the
  # agent runs — the 👀 ack, the stage move to Agent, the @auto opt-in and
  # counter reset. Names MARVIN_TOKEN; checks out nothing.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # trig's permission and PR lookups
      pull-requests: write    # the refusal comment (job token); the ack, opt-in label and counter reset fall back to it
      issues: write
    outputs:
      ok: ${{ steps.trig.outputs.ok }}
      fork_head: ${{ steps.trig.outputs.fork_head }}
      engine: ${{ steps.engine.outputs.engine }}
      is_pr: ${{ (github.event.issue.pull_request != '' || github.event.pull_request != '') && 'true' || 'false' }}
      number: ${{ github.event.issue.number || github.event.pull_request.number }}
      # The PR's live head branch (PR runs): the land job's pin for the
      # manifest's branch, read here before any untrusted code ran.
      head_branch: ${{ steps.engine.outputs.head_branch }}
      # `true` when this run is in the @auto loop's hands: the trigger is
      # @auto, or the issue/PR carries the `auto` label. A PR run that lands
      # a commit then owes the `@review` hand-back; an issue run's PR gets
      # the label.
      auto: ${{ steps.engine.outputs.auto }}
      # Labels the land job puts on a PR it opens or adopts for an issue run
      # (JSON array): `auto` when the run is autonomous, plus the issue's
      # engine:* labels (design/codex-engine.md).
      pr_labels: ${{ steps.engine.outputs.pr_labels }}
    steps:
      # The trig check, the 👀 ack, and the Agent stage move all run
      # BEFORE the checkout: none of them touch the workspace (env-only script;
      # remotely-fetched composite action; API calls), and the fetch-depth-0
      # clone costs ~1 min on large repos — the ack should land in seconds,
      # not after the clone.
      #
      # Atlas stage tracking must NOT trust the stub's cheap substring gate:
      # reviewer summaries legitimately contain a backticked `@claude` ("reply
      # with a top-level @claude comment"), which starts this workflow even
      # though claude-code-action then declines (word-boundary check + bot
      # actor). Without this pre-check those phantom runs flipped issues to
      # Review after every review round. Mirror the action's word-boundary
      # trigger match and bot-actor rejection; only stage when it passes.
      #
      # `ok` also gates the RUN pipeline (the agent job — checkout,
      # provisioning, the agent — and the land job; the @auto opt-in below),
      # not just ack/stage: on PR-context events the gate
      # additionally resolves whether the target PR's head lives in a FORK
      # (`fork_head`), and a fork head forces ok=false so nothing downstream
      # runs — no checkout, no sync-branch, no claude-setup, no agent, no
      # landing, no stage move (issue #59; header comment). Decided here, before any
      # checkout, from the PR's head-repo identity (not from who commented):
      # issue_comment looks the PR up via the API; pull_request_review /
      # pull_request_review_comment read it from the event payload. An API
      # lookup that never answers refuses too (`fork_head=unknown` — don't
      # admit), with its own comment text so a same-repo PR is never told it
      # is from a fork; a payload with NO head repo is a deleted fork, not a
      # blip, and refuses as a known fork head. The one visible effect is the
      # refusal comment step below, posted only for a write-access commenter
      # so outsiders cannot make the workflow post.
      #
      # `ok` ALSO requires the actor to hold write access (issue #92). Until
      # then it meant only "the text matched": claude-code-action's built-in
      # write-access check was the sole actor authorization, and it runs
      # AFTER two machine-account writes — the @auto opt-in label and the
      # counter reset — so on a public caller any account's `@auto` comment
      # on a same-repo PR armed the autonomous loops and reset their caps
      # before the action declined it. The lookup happens here, before any
      # write, and emits `authorized` so the refusal step can reuse it.
      - name: Check trigger (stage gating)
        id: trig
        env:
          PHRASE: ${{ inputs.trigger_phrase }}
          LABEL: ${{ inputs.label_trigger }}
          EVENT: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          COMMENT: ${{ github.event.comment.body }}
          REVIEW: ${{ github.event.review.body }}
          IBODY: ${{ github.event.issue.body }}
          ITITLE: ${{ github.event.issue.title }}
          LNAME: ${{ github.event.label.name }}
          # Fork-head resolution. The JOB token (read access is enough, and it
          # cannot expire like a PAT); the review-event payload carries the
          # head repo directly.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request && 'true' || 'false' }}
          PR_NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          ok=false
          # The label path is exempt from the machine-account exclusion: the
          # triage pipeline labels issues `auto` AS marvin, and that labeled
          # event is the intended kickoff (fork PR inspect_ai#237) — without
          # this, marvin-labeled kickoffs ran the agent but skipped the ack
          # and both Atlas stage steps, so the board never showed the pickup.
          # Reading the label NAME carries no quoted-token hazard; bots stay
          # excluded everywhere.
          # Case-FOLDED, like the action: claude-code-action compiles its
          # trigger regexes with the `i` flag and lower-cases both label names
          # before comparing (src/github/validation/trigger.ts), and the stubs'
          # contains() gate is case-insensitive too. Since `ok` now gates the
          # whole run, a stricter mirror would turn `@Claude fix this` (mobile
          # auto-capitalisation) or a `Claude` label into a silent no-op.
          lname=${LNAME,,}; label=${LABEL,,}
          if [ "$EVENT" = "issues" ] && [ "$EVENT_ACTION" = "labeled" ] \
             && [ -n "$label" ] && [ "$lname" = "$label" ]; then
            case "$ACTOR" in *"[bot]") ;; *) ok=true ;; esac
          fi
          case "$ACTOR" in
            *"[bot]"|i-am-marvin) ;; # bot/machine actors never stage (label path above excepted)
            *)
              text="$COMMENT$REVIEW"
              if [ "$EVENT" = "issues" ]; then
                # Body/title count only on `opened`: the action checks them only
                # there (src/github/validation/trigger.ts), so matching them on
                # `labeled` too let ANY later label on an issue whose body carries
                # the phrase pass this gate — ack, stage move, checkout — before
                # the action no-op'd (and on the codex path, which never reaches
                # the action's check, each such label was a REAL run: a fresh
                # codex branch and PR). A matching label is handled above.
                text=""
                if [ "$EVENT_ACTION" = "opened" ]; then
                  text="$IBODY
          $ITITLE"
                fi
              fi
              esc=$(printf '%s' "$PHRASE" | sed 's/[.[\*^$()+?{|]/\\&/g')
              printf '%s' "$text" | grep -qiE "(^|[[:space:]])$esc([[:space:],.!?;:]|$)" && ok=true
              ;;
          esac
          # Actor authorization (issue #92): the text matched, now the actor
          # must hold write access, or nothing below runs — no ack, no stage
          # move, no @auto opt-in, no counter reset, no checkout, no agent.
          # Same lookup the reviewer's trig step makes for @review, with the
          # job token (read is enough, and it cannot expire like a PAT). Who
          # is judged: github.actor — the commenter/author, and on the
          # `labeled` path the account that applied the label (the actor of
          # a label event IS the labeler; marvin for triage-applied `auto`
          # labels, and it holds write, so that kickoff still passes). Fail
          # closed: a lookup error is `none`. Retried once like the fork-head
          # lookup, each attempt captured and used only on success (a failed
          # `gh api` prints its error body to STDOUT). Checked BEFORE the
          # fork-head lookup so an outsider's trigger costs one read and
          # produces no refusal comment: `fork_head` stays false for them,
          # and the refusal step is gated on `authorized` as well.
          authorized=false
          if [ "$ok" = "true" ]; then
            perm=""
            for i in 1 2; do
              perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/dev/null) && break
              perm=""
              [ "$i" -lt 2 ] && sleep 5
            done
            case "$perm" in
              admin|maintain|write) authorized=true ;;
              *)
                ok=false
                echo "::notice::$ACTOR does not have write access (permission: ${perm:-lookup failed}); not running, acking or staging."
                ;;
            esac
          fi
          # Fork-head refusal (issue #59). Resolved only for runs that would
          # otherwise proceed, on PR-context events. issue_comment: one API
          # read of the PR's isCrossRepository, retried once (a transient blip
          # must not refuse a legitimate same-repo run outright — but a
          # persistent failure refuses, fail-closed: only an explicit `false`
          # admits). Review events: the payload's head repo must equal this
          # repo. An EMPTY head repo there is not a lookup failure — no API
          # call was made — but the shape a PR takes when its fork has been
          # deleted (head.repo is null), which is by definition not same-repo,
          # so it counts as a known fork head: `unknown` would promise that a
          # re-trigger can help, and here every re-trigger lands in the same
          # place. Three states, so the refusal comment can tell the truth:
          # `true` is a known fork head, `unknown` is an API lookup that never
          # answered (the PR may well be same-repo — the comment must not
          # claim otherwise, nor tell the requester to "push the branch
          # here"). Both refuse.
          fork_head=false
          if [ "$ok" = "true" ]; then
            if [ "$EVENT" = "issue_comment" ] && [ "$IS_PR_COMMENT" = "true" ]; then
              xr=""
              for i in 1 2; do
                xr=$(gh pr view "$PR_NUM" --repo "$REPO" --json isCrossRepository \
                       --jq '.isCrossRepository' 2>/dev/null) && break
                xr=""
                [ "$i" -lt 2 ] && sleep 5
              done
              if [ "$xr" = "true" ]; then
                fork_head=true
                echo "::warning::PR #$PR_NUM has a fork head — refusing: the dev agent does not run on fork-head PRs; use @review for a sandboxed review."
              elif [ "$xr" != "false" ]; then
                fork_head=unknown
                echo "::warning::PR #$PR_NUM — the head-repo lookup failed (isCrossRepository='${xr:-lookup failed}'), so whether the head is a fork is unknown; refusing fail-closed. Re-trigger to retry."
              fi
            elif [ "$EVENT" = "pull_request_review" ] || [ "$EVENT" = "pull_request_review_comment" ]; then
              if [ -z "$HEAD_REPO" ]; then
                fork_head=true
                echo "::warning::PR #$PR_NUM — the event payload carries no head repo (its fork was deleted, or the payload shape drifted); not a same-repo head either way — refusing: the dev agent does not run on fork-head PRs."
              elif [ "$HEAD_REPO" != "$REPO" ]; then
                fork_head=true
                echo "::warning::PR #$PR_NUM has a fork head ($HEAD_REPO) — refusing: the dev agent does not run on fork-head PRs; use @review for a sandboxed review."
              fi
            fi
          fi
          [ "$fork_head" != "false" ] && ok=false
          echo "trigger check for stage tracking: ok=$ok authorized=$authorized fork_head=$fork_head"
          echo "ok=$ok" >>"$GITHUB_OUTPUT"
          echo "authorized=$authorized" >>"$GITHUB_OUTPUT"
          echo "fork_head=$fork_head" >>"$GITHUB_OUTPUT"

      # The refusal's one visible effect: tell the requester why nothing
      # happened — but ONLY when they hold write access: an outsider's
      # @claude on a public repo's fork PR must exit silently, since a
      # workflow that posts on demand for anyone is a spam channel. The
      # trigger check above already made that decision (issue #92): its
      # `authorized` output is the fail-closed permission read, and its
      # fork-head lookup only runs for an authorized actor, so this step's
      # gate reads both rather than repeating the API call. Posted as
      # github-actions[bot] via the job token (not MARVIN_TOKEN —
      # github-actions comments trigger no workflows, so the backticked
      # `@review` below cannot start a review run even on stubs with a looser
      # gate). Best-effort — never fails the run.
      #
      # Two texts, one per refusal state. A KNOWN fork head is a fixed
      # property of the PR, so its refusal posts once per PR: the caller
      # stubs fire on comment `edited` as well as `created`, and without the
      # marker check each edit of the collaborator's comment would pile up
      # another identical refusal (the 👀 ack is idempotent; a comment is
      # not). An UNKNOWN head (the lookup never answered) is a transient
      # event on a PR that may be same-repo, so it posts every time it
      # happens — silence would look like the trigger was ignored — and
      # never claims the PR is from a fork. Neither text writes the dev
      # trigger phrase bare (backticked like `@review`, belt and braces:
      # github-actions comments start no workflows anyway).
      - name: Refuse fork-head PR (explain to collaborators)
        if: >-
          steps.trig.outputs.authorized == 'true' &&
          (steps.trig.outputs.fork_head == 'true' || steps.trig.outputs.fork_head == 'unknown')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          FORK_HEAD: ${{ steps.trig.outputs.fork_head }}
          PHRASE: ${{ inputs.trigger_phrase }}
        run: |
          if [ "$FORK_HEAD" = "true" ]; then
            marker='<!-- claude-fork-head-refusal -->'
            # Once per PR. Fail-open on the read: a duplicate refusal is
            # harmless, a missing one leaves the requester guessing.
            prior=$(gh api "repos/$REPO/issues/$NUM/comments" --paginate \
                      --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id" 2>/dev/null || true)
            if [ -n "$prior" ]; then
              echo "fork-head refusal already posted on PR #$NUM; not repeating."
              exit 0
            fi
            body=$(printf 'The dev agent does not run on pull requests from forks. Use `@review` for a sandboxed review, or push the branch to this repository.\n\n%s' "$marker")
            what="fork-head refusal"
          else
            body=$(printf 'The dev agent could not determine whether the head of this pull request is in a fork (the PR lookup failed), so it did not run. Usually a transient GitHub API error — re-trigger with `%s`.' "$PHRASE")
            what="unknown-head refusal"
          fi
          gh pr comment "$NUM" --repo "$REPO" --body "$body" \
            && echo "posted the $what on PR #$NUM" \
            || echo "::warning::could not post the $what comment on PR #$NUM"

      # Acknowledge the trigger with an 👀 reaction from the machine account, so
      # the requester immediately sees the agent picked their message up
      # (issue #3). Gated on the same word-boundary trigger check as stage
      # tracking: no acks on phantom substring events, and no self-acks (the
      # check excludes bot/machine actors). Reactions are idempotent, so an
      # edited-comment re-trigger doesn't double up. pull_request_review has no
      # reaction endpoint — that (rare) trigger path goes unacknowledged.
      # Since issue #92 steps.trig also verifies the actor's write access, so
      # on repos where non-collaborators can comment (the public inspect_ai
      # fork) an outsider's trigger gets no 👀 at all — the ack now does mean
      # "an authorized run is starting".
      # Best-effort: an ack must never fail the run.
      # Engine selection (design/codex-engine.md): an engine:codex label on
      # the triggering issue/PR routes this run to Codex. API read at gate
      # time — event payloads carry stale label lists on comment triggers.
      # Population note: riding steps.trig means bot actors never reach
      # engine detection, so on an engine:codex item a bot-authored trigger
      # falls through to the claude step — where claude-code-action's own
      # actor guard declines it (no allowed_bots on this verb), so the result
      # is the pre-existing no-op, not a silent Claude run. The former
      # residual gap — a bare @claude posted by MARVIN (a User the action
      # accepts) running the Claude path on a codex item — is closed now that
      # the agent job is gated on steps.trig too (issue #59): marvin never
      # passes this check, so such a run skips (marvin-authored text is
      # de-fanged everywhere by design, and every stub excludes marvin at
      # the job level, so nothing relied on it running).
      # The same label read decides the run's @auto standing (`auto`: an
      # @auto trigger or an `auto` label — the land job's hand-back and PR
      # labels key on it) and, on PR runs, reads the PR's live head branch
      # for the land job's branch pin: both are facts the land job must take
      # from this trusted job, never from the one that ran the agent.
      - name: Detect engine
        id: engine
        if: steps.trig.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          PHRASE: ${{ inputs.trigger_phrase }}
          IS_PR: ${{ (github.event.issue.pull_request != '' || github.event.pull_request != '') && 'true' || 'false' }}
          # Review events carry the head ref in the payload; a PR comment
          # needs one read.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          engine=claude
          auto=false
          labels=""
          if [ -n "${NUM:-}" ]; then
            labels=$(gh api "repos/$REPO/issues/$NUM/labels" --paginate \
                       --jq '.[].name' 2>/dev/null || true)
            grep -qx 'engine:codex' <<<"$labels" && engine=codex
            grep -qx 'auto' <<<"$labels" && auto=true
          fi
          # An @auto mention is the opt-in even on an unlabeled item: the
          # opt-in step below labels an existing PR, and the land job labels
          # the PR it opens for an issue (the mention case was the gap that
          # left inspect_ai#71/#74's PRs outside the loop).
          [ "$PHRASE" = "@auto" ] && auto=true
          # Labels for a PR the land job opens or adopts on an issue run:
          # `auto` whenever this is an @auto run, plus the whole engine:*
          # namespace (not just engine:codex, so future engines need no
          # change here) — every PR-scoped run reads the PR's own labels, so
          # without the copy an issue-selected engine would silently revert
          # to Claude the moment the PR opens.
          pr_labels=$(jq -nc --arg auto "$auto" --arg labels "$labels" \
            '[($labels | split("\n")[] | select(startswith("engine:"))), (if $auto == "true" then "auto" else empty end)] | unique')
          head_branch=""
          if [ "$IS_PR" = "true" ]; then
            head_branch="$HEAD_REF"
            [ -n "$head_branch" ] || head_branch=$(gh pr view "$NUM" --repo "$REPO" --json headRefName --jq '.headRefName' 2>/dev/null || true)
            [ -n "$head_branch" ] || echo "::warning::could not read PR #$NUM's head branch; the land job looks it up itself."
          fi
          echo "engine: $engine auto: $auto pr_labels: $pr_labels head_branch: ${head_branch:-n/a}"
          {
            echo "engine=$engine"
            echo "auto=$auto"
            echo "pr_labels=$pr_labels"
            echo "head_branch=$head_branch"
          } >>"$GITHUB_OUTPUT"

      - name: Acknowledge trigger (eyes)
        if: steps.trig.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          COMMENT_ID: ${{ github.event.comment.id }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          case "$EVENT" in
            issue_comment)
              gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes --silent || true ;;
            pull_request_review_comment)
              gh api "repos/$REPO/pulls/comments/$COMMENT_ID/reactions" -f content=eyes --silent || true ;;
            issues)
              gh api "repos/$REPO/issues/$ISSUE/reactions" -f content=eyes --silent || true ;;
          esac

      # Atlas tracking (design/atlas-tracking.md): the agent is picking this
      # issue up, so move it to Agent. Best-effort — the action never
      # fails the run. On PR-context events the PR resolves to its issue via
      # the claude/issue-N-* branch (then a Fixes ref).
      - name: Stage - Agent
        if: steps.trig.outputs.ok == 'true'
        uses: meridianlabs-ai/agents/.github/actions/set-stage@main
        with:
          stage: Agent
          token: ${{ secrets.MARVIN_TOKEN }}
          repo: ${{ github.repository }}
          issue: ${{ github.event.issue.number || github.event.pull_request.number }}

      # @auto invoked on an *existing* PR (e.g. "@auto fix the review issue"):
      # opt that PR into the loop by applying the `auto` label. The review-fix
      # loop (claude-auto-review.yml) gates on this label. Applied BEFORE the
      # agent runs (here, in the trusted gate) so the label is in place before
      # the land job posts the `@review` hand-back the run's push owes —
      # otherwise a fast reviewer could post its summary while the PR is still
      # unlabeled and the loop would skip it (the same race the issue->PR path
      # avoids by having `land` label before it posts the hand-back). The PR
      # already exists here, so we can label it up front. Gated to the @auto
      # trigger: a write-access human typing @auto is exactly the opt-in the
      # label represents (a plain @claude PR run stays one-shot).
      # github.event.issue.number is the PR number on a PR comment. Idempotent;
      # adding a label fires no workflow here (no stub triggers on pull_request
      # `labeled`), so no recursion. Remove the label to disengage.
      # Gated on the trigger check (issue #59): a refused fork-head run must
      # not opt the PR into the loop — this is a machine-account write that
      # used to be reachable by anyone whose comment passed the stub's
      # substring gate. And since issue #92 the trigger check verifies the
      # commenter's write access, so the label is applied only for the
      # write-access human the comment above describes: before that, `ok`
      # meant only "the text matched", and this step (plus the counter reset
      # below) ran as marvin for ANY commenter on a public caller — arming
      # the loops, whose gates then trusted the label. The loop gates now
      # also verify who applied the label (claude-auto*.yml, via the
      # verify-auto-labeler composite).
      - name: Opt existing PR into the @auto loop
        if: >-
          steps.trig.outputs.ok == 'true' &&
          github.event.issue.pull_request != '' &&
          inputs.trigger_phrase == '@auto'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          AUTO_LABEL: "auto"
        run: |
          set -euo pipefail
          gh pr edit "$PR" --repo "$REPO" --add-label "$AUTO_LABEL" \
            && echo "Opted PR #$PR into the @auto loop (added '$AUTO_LABEL')." \
            || echo "Could not add '$AUTO_LABEL' to PR #$PR (label missing or no perms); continuing."

      # Explicit re-engagement resets the @auto budgets. A human typing @auto
      # to continue a PR that already hit the cap should get a FRESH set of
      # rounds — otherwise the leftover count in the sticky marker (e.g. "10
      # (cap 10)") makes the very next review re-escalate immediately, so the
      # loop only manages the single kickoff fix and stops (see inspect_ai#53).
      # Both counters are reset (the CI-fixer gets its full attempt budget
      # again too); the reset body is the shared composite's, which also
      # drops the stored auto-review-head so the no-progress check is
      # re-baselined. Best-effort: the composite never fails the run, and the
      # result is not needed here — the label above is what arms the loop.
      - name: Reset the @auto counters (re-engagement)
        if: >-
          steps.trig.outputs.ok == 'true' &&
          github.event.issue.pull_request != '' &&
          inputs.trigger_phrase == '@auto'
        uses: meridianlabs-ai/agents/.github/actions/reset-auto-counters@main
        with:
          token: ${{ secrets.MARVIN_TOKEN || github.token }}
          repo: ${{ github.repository }}
          pr: ${{ github.event.issue.number }}
          reason: "on re-engagement — fresh cap"


  # UNTRUSTED: the checkout, the provisioning and the agent. Names no secret
  # but OPENAI_API_KEY (the codex engine's, unavoidably — design/
  # codex-engine.md); the job token is read-only, so nothing here can push
  # or post as this workflow's identity. The agent commits locally;
  # `emit-landing` (last, always) packages the commits above the run's start
  # SHA and the landing manifest for the land job.
  agent:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read          # checkout, sync fetches; cannot push
      pull-requests: read     # the PR reads; cannot comment
      issues: read
      id-token: write         # WIF auth (and the action's own App token)
      actions: read
    steps:
      # Full history + tags: setuptools-scm versioning needs tags, and Claude
      # uses git log/blame to understand code. Costs ~1 min on large repos.
      # This job is gated on the gate's trigger check (issue #59): on
      # pull_request_review / pull_request_review_comment events the default
      # ref is refs/pull/N/merge, which CONTAINS a fork author's code when the
      # head is a fork — and the provisioning step right after would execute
      # it. A refused run never starts this job, so nothing is checked out.
      # persist-credentials:false (issue #61): checkout otherwise writes the
      # job token into .git/config for the rest of the job — and this job's
      # codex path group-grants the whole workspace to the codex user, which
      # could then read the token off disk. Nothing is persisted; every later
      # git network call authenticates itself (design/architecture.md → "No
      # persisted git credentials"): the runner-side steps and the
      # claude-code-action step through a step-scoped credential helper on
      # the job token. The agent itself never pushes (issue #84).
      - uses: actions/checkout@v4
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false

      # Regression guard for the invariant above (shared composite — one copy
      # for all three workflows): asks git, which follows includes, for the
      # header checkout would have persisted, keyed on the server URL.
      - name: Assert no credential persisted in the workspace
        id: assert
        uses: meridianlabs-ai/agents/.github/actions/assert-no-persisted-credential@main

      # The start SHA of an ISSUE run: the tip of the base branch the agent
      # branches from (claude-code-action's setupBranch and the codex prep
      # step both cut the new branch off it), stamped before either runs.
      # emit-landing bundles the commits above it and the land job refuses a
      # HEAD that does not descend from it. PR runs take theirs from
      # sync-branch instead (its PRE-merge tip, so a run whose only product
      # is the runner's base merge still lands it; on a closed PR, which the
      # sync skips, the live tip it read — the agent has to check that branch
      # out itself there, as it always had to). The base branch name is the
      # caller's input or the event's default branch — the same resolution
      # claude-code-action makes — and the fetch-depth-0 checkout already
      # holds every remote branch, so this is a local read. rev-parse on its
      # own line under -e, so a failure is this step's; the Surface step
      # names it, and the emit step falls back to github.sha so the manifest
      # carrying that error still validates.
      - name: Record base SHA
        id: base
        if: github.event.issue.pull_request == '' && github.event.pull_request == ''
        env:
          BASE: ${{ inputs.base_branch || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse "origin/$BASE")
          echo "base branch $BASE is at $sha"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      # ---- Deterministic base-branch sync (design/architecture.md) ---------
      # The base merge happens HERE, on the runner, for BOTH engines — not in
      # a prompt. Two reasons. The codex sandbox holds no credentials and is
      # told not to fetch, so it cannot be asked to merge (instruction, not
      # structure, since its sandbox gained network on 2026-09-09; the
      # in-progress hand-off means it never needs to); and a prompted merge
      # is advisory, so branches drifted anyway (inspect_ai#392 sat 11
      # commits behind main across 20 commits — GitHub cannot compute a merge
      # ref for a conflicted PR, so CI never ran and every review round read
      # stale code). PR-context runs only: a fresh issue run branches off the
      # hourly-synced base, so nothing to merge.
      #
      # The step body is the shared sync-branch composite (one copy for all
      # three workflows; the per-engine conflict split is documented there).
      # checkout: true because this job's actions/checkout landed on the
      # event's default ref, not the PR head: the action resolves the head,
      # skips closed/merged PRs and fork heads, and checks the branch out.
      - name: Sync branch with base
        id: sync
        if: github.event.issue.pull_request != '' || github.event.pull_request != ''
        uses: meridianlabs-ai/agents/.github/actions/sync-branch@main
        with:
          pr: ${{ github.event.issue.number || github.event.pull_request.number }}
          engine: ${{ needs.gate.outputs.engine }}
          token: ${{ github.token }}
          checkout: "true"

      # Provision the project environment so the agent's allow-listed
      # pytest/ruff/mypy can actually run (a bare runner has neither the deps
      # nor the package installed). Convention-based opt-in: a caller repo adds
      # a `.github/actions/claude-setup` composite action that delegates to its
      # existing, cache-backed CI setup — no install command is duplicated here,
      # and the GitHub cache is the caller's (scoped to the run's repo), so it
      # hits the same entries normal CI populates. `./` resolves against the
      # checked-out workspace (the caller repo), not this workflow's repo. The
      # hashFiles guard makes this a no-op for repos that don't define it.
      # Fatal on failure: a broken setup surfaces loudly rather than silently
      # degrading to static-only checks. See design/architecture.md.
      # Runs only in this job, which the gate's trigger check admits (issue
      # #59): this executes whatever the checked-out tree supplies, so it must
      # never run on a refused (fork-head) run — hashFiles alone would happily
      # find a fork's action.
      #
      # ONE exception, the same one the loops make: the codex conflict path.
      # sync-branch hands codex the base merge still IN PROGRESS, with
      # conflict markers in the tree, and provisioning runs over that tree —
      # so when pyproject.toml or the lockfile is among the conflicted files
      # the install fails DETERMINISTICALLY, and a fatal failure here would
      # skip the very run that exists to resolve the markers (every
      # re-trigger failing the same way). So when the sync left conflicts
      # (non-empty only on the codex path — the Claude path aborts its
      # conflicted merge) a provisioning failure is tolerated: codex runs
      # static-only, its prompt says so, and the next run — on the resolved
      # branch — provisions normally. `outcome` still reads `failure` on the
      # tolerated path (only `conclusion` is neutralized), which is what the
      # prompt composer and the Surface step key on.
      - name: Provision project environment
        id: setup
        if: hashFiles('.github/actions/claude-setup/action.yml', '.github/actions/claude-setup/action.yaml') != ''
        continue-on-error: ${{ steps.sync.outputs.conflicts != '' }}
        uses: ./.github/actions/claude-setup

      # Fallback where claude-setup is absent — the shared provision-fallback
      # composite the reviewer and both loops already use (the recipe, uv
      # version, retry, extras/`--group dev` and the .git/info/exclude
      # entries live there). The dev agent was the last path without it: on
      # the inspect_ai fork every PR branch is cut from pristine main and
      # carries no claude-setup, so a dev-verb run on a PR there — `@auto fix
      # review feedback` on inspect_ai#428, 2026-09-09 — ran with no
      # pytest/ruff/mypy at all. Claude installs its own so the gap only
      # showed on codex, which (sandbox network still off at the time) tried
      # an install, failed, pushed unformatted code with two mypy errors, and
      # CI caught what the agent could not. Same trigger gate as the shim
      # step: never on a refused run. Same conflicted-round tolerance as
      # above — this is the step that actually runs on the fork's PR heads,
      # where a conflicted dependency file would otherwise fail every
      # re-trigger identically.
      - name: Provision project environment (fallback)
        id: setupfb
        timeout-minutes: 10
        if: >-
          hashFiles('.github/actions/claude-setup/action.yml', '.github/actions/claude-setup/action.yaml') == '' &&
          hashFiles('pyproject.toml') != ''
        continue-on-error: ${{ steps.sync.outputs.conflicts != '' }}
        uses: meridianlabs-ai/agents/.github/actions/provision-fallback@main

      # Compose the appended-system-prompt sources into ONE value, so we emit a
      # single --append-system-prompt flag. Multiple flags would force a bet on
      # undocumented CLI behavior (accumulate vs. last-one-wins), and the sources
      # co-occur on PR follow-ups (review_etiquette and the branch-sync sources
      # fire there, and append_system_prompt fires on every run). PR context =
      # an issue comment on a PR, or a review/review-comment event; fresh issue
      # runs branch off the synced base and skip all of them. Within PR context
      # the branch-sync sources are gated on what "Sync branch with base" did:
      # branch_sync_prompt only when it handed the merge to the agent,
      # branch_sync_append whenever a merge happened at all (see BRANCH_SYNC_
      # APPEND below). Joined on one line so the toJSON splice below stays a
      # clean single-quoted arg (a newline would survive toJSON as a literal \n
      # in the shell-parsed args).
      #
      # REVIEW_ETIQUETTE mirrors the @auto review-fix loop's thread-resolution
      # rule (claude-auto-review.yml): the dev agent is regularly invoked to
      # address PR review comments (directly via @claude, or — as after an @auto
      # escalation — because a handoff comment re-trips the kickoff gate), and
      # without this it fixes the code but leaves the review thread open. gh api
      # graphql is covered by the settings allow-list (Bash(gh:*)) and runs as
      # the action's App token (claude[bot]), as it always did on a marvin-less
      # caller.
      #
      # LANDING is always-on and is where the agent learns the shape of this
      # workflow (issue #84): it commits and stops. It holds no credential that
      # may push or post as this workflow's identity — the land job pushes the
      # branch's new commits as the machine account, opens the PR on an issue
      # run (closing reference, run link, labels) and posts the comments the
      # agent leaves in the landing manifest (`comments`, the one key it may
      # write there), after the run ends. The old REQUEST_REVIEW paragraph (an
      # @auto run on an existing PR posting `@review` itself) is gone: the
      # hand-back is a field of the manifest, composed from the workflow's own
      # "HEAD moved" test, so a push and its re-review request cannot come
      # apart. The ENVIRONMENT part keeps the lesson from inspect_ai#195: full
      # fix implemented and tested, then the agent ended its turn "waiting on"
      # a verification subagent before committing — everything was lost, and
      # the green run + tidy summary made it look done. Same lesson the
      # reviewer prompt already carries; the deterministic backstop is now the
      # Surface step's uncommitted-edits check, and the push itself is the
      # workflow's.
      - name: Compose appended system prompt
        id: sysprompt
        env:
          LANDING_DIR: ${{ runner.temp }}/landing
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ (github.event.issue.pull_request != '' || github.event.pull_request != '') && 'true' || 'false' }}
          # Spliced only when the runner-side sync could NOT land the merge
          # itself — a conflict it had to abort to keep the index clean for
          # setupBranch, or a fork head it declined (the latter unreachable
          # here since issue #59: the trigger gate refuses fork heads before
          # the sync step; the composite's skip is shared with the loops and
          # kept as defense in depth). On the ordinary clean-merge path the
          # branch is ALREADY current when the agent starts, and telling it to
          # merge again is noise.
          BRANCH_SYNC: ${{ steps.sync.outputs.agent_merge == '1' && inputs.branch_sync_prompt || '' }}
          # branch_sync_append is NOT gated the same way: it must reach the
          # agent whenever a merge happened this run, clean or delegated. The
          # fork's append exists for a NON-conflicting mis-merge (git
          # auto-merges CHANGELOG.md cleanly and lands the entry under the
          # wrong heading), so on the clean path it rides behind a lead-in
          # saying the runner already merged and the agent should review the
          # result; on the delegated path it simply follows branch_sync_prompt.
          AGENT_MERGE: ${{ steps.sync.outputs.agent_merge }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          SYNC_BASE: ${{ steps.sync.outputs.base }}
          SYNC_APPEND: ${{ inputs.branch_sync_append }}
          REVIEW_ETIQUETTE: "${{ (github.event.issue.pull_request != '' || github.event.pull_request != '') && 'When your task involves addressing inline pull-request review comments, resolve each review thread you fully address in code so settled feedback is visibly closed: query repository.pullRequest.reviewThreads via gh api graphql to get each thread id, then call the resolveReviewThread GraphQL mutation with that id. Reply with a brief rationale to, and leave unresolved, any comment you deliberately decline; never resolve a thread you did not actually address. In any comment you post, never write the review-comment HTML marker or the codex reviewer''s footer ''engine: codex'' verbatim: they are how the codex fix rounds locate the newest review, so a comment of yours carrying either would be mistaken for the review.' || '' }}"
          EXTRA: ${{ inputs.append_system_prompt }}
        run: |
          # The landing directory exists before the agent starts, runner-owned,
          # so the agent writes its manifest-extra.json and body files straight
          # into it (the codex path never writes there; its summary is composed
          # by a runner step).
          mkdir -p "$LANDING_DIR"
          what="issue"; [ "$IS_PR" = "true" ] && what="pull request"
          # Single line: the value is spliced as one arg downstream (a newline
          # would corrupt the value= output line below and survive toJSON as a
          # literal \n).
          landing="LANDING (mandatory): you hold no credential that may push or post as this workflow's identity, so do NOT push, do NOT open a pull request, and do NOT post comments, reviews or reactions yourself — COMMIT your work to the current branch with git and stop. The workflow lands it after your run ends: it pushes the branch's new commits as the machine account (which runs CI) and, on an issue-triggered run, opens the pull request for you with the closing reference to the issue and a link to this run (on a pull request it pushes to the PR branch); your latest commit's subject and body become the PR title and description, so write them as such. The push-then-'Create a PR' flow the action's own instructions describe does not apply here — the push and the PR are the workflow's. To leave a comment on $what #$NUM (an answer, a question for the requester, something a reviewer must know), write the body to a file under $LANDING_DIR/ (file names must match [A-Za-z0-9._-] and must not start with a dot) and append {\"number\": $NUM, \"body_file\": \"<file name relative to $LANDING_DIR>\"} to the \`comments\` array in $LANDING_DIR/manifest-extra.json — one JSON object with at most that one key and nothing else; create the file if it does not exist and rewrite it whole when you update it, so it is valid JSON when your turn ends (an unparsable file drops everything in it). The workflow posts those bodies as the machine account after the push. In commit messages and in every body you write, never write the trigger tokens bare — backtick them (\`@review\`): they render from a write-access account, where a bare token starts a workflow. ENVIRONMENT (mandatory): your work exists ONLY on this ephemeral runner until it is committed — the workflow packages the commits on the current branch when your turn ends — and a run can NEVER resume after your final turn ends. In THIS environment nothing can wake you: background tasks do NOT re-invoke you when they finish, their completion notifications never arrive, and a turn that ends 'waiting to be woken' simply ends the run and loses everything uncommitted. So never end your turn waiting on anything — subagents, background commands, test suites: collect results in the foreground and complete the commit inside THIS run. If a final validation is long-running, commit FIRST and let the PR's own CI be the gate; an uncommitted validated change is worth nothing. Uncommitted edits to tracked files are lost with the runner and reported to the $what as an error, so commit everything you mean to keep and revert scratch edits to tracked files you do not."
          append=""
          if [ -n "${SYNC_APPEND:-}" ]; then
            if [ "${AGENT_MERGE:-}" = "1" ]; then
              append=$(tr '\n' ' ' <<<"$SYNC_APPEND")
            elif [ -n "${MERGE_SHA:-}" ]; then
              append="A workflow step already merged origin/$SYNC_BASE into this branch before you started (a clean merge, no conflicts); review that merge result against the following before making other changes, and fix it in your commit if it is off: $(tr '\n' ' ' <<<"$SYNC_APPEND")"
            fi
          fi
          combined=""
          for part in "$landing" "$BRANCH_SYNC" "$append" "$REVIEW_ETIQUETTE" "$EXTRA"; do
            [ -n "$part" ] && combined="${combined:+$combined }$part"
          done
          echo "value=$combined" >> "$GITHUB_OUTPUT"

      # The agent's push and posting channels are closed in settings, not only
      # in the prompt: `Bash(git push:*)` is stripped from the caller's allow
      # list and put on a `deny` list together with claude-code-action's
      # tag-mode push wrapper — the action's own prompt tells the agent to
      # push through `<action path>/scripts/git-push.sh origin <branch>` and
      # allows it by that path, which a `git push` prefix rule never sees (a
      # `*` matches anywhere in a Bash rule) — and the gh verbs that post or
      # open things (deny beats allow in Claude Code, so this holds against a
      # caller's `settings`, any claude_args override and the action's own
      # --allowedTools). Guard rails, not a security boundary: `Bash(gh:*)`
      # stays allowed because the PR and CI reads go through it, so `gh api
      # -X POST/PATCH`, `gh pr edit|close|ready` or a `git -C . push` pass the
      # listed prefixes while the action's own App token — NOT scoped to this
      # job's read-only permissions; it carries the App's contents/PR/issues
      # write — is in reach. What holds structurally is the split: nothing the
      # agent can reach is marvin's identity, so a write that slipped past
      # would be claude[bot]'s — attributable, and exactly what the dev agent
      # held on a marvin-less caller before — never the machine account's. Tag
      # mode installs the action's comment server (the tracking comment the
      # agent updates with its answer; that stays) and, only with
      # use_commit_signing, a file-ops server that commits server-side — not
      # enabled here, so there is no API-side push to deny. Claude path only:
      # codex composes its own prompt and holds no settings, so a failure here
      # must not skip it. Same shape as the loops' step; keep them in step.
      - name: Compose agent settings (deny pushes and posts)
        id: agentsettings
        if: needs.gate.outputs.engine != 'codex'
        env:
          SETTINGS: ${{ inputs.settings }}
        run: |
          set -euo pipefail
          # The action documents `settings` as a JSON string OR a path to a
          # settings file (its setupClaudeCodeSettings tries JSON.parse
          # first, then reads the path relative to the workspace — i.e. a
          # file from this checkout, which the deny overlay below then
          # covers like any other). Mirror that, since the value is
          # transformed here before the action sees it; anything else fails
          # loudly and the Surface step reports it (AGENTSETTINGS_OUTCOME) —
          # the action step is skipped, not failed, so nothing else would.
          [ -n "$SETTINGS" ] || SETTINGS='{}'
          is_object() { printf '%s' "$1" | jq -e 'type == "object"' >/dev/null 2>&1; }
          if ! is_object "$SETTINGS" && [ -f "$SETTINGS" ]; then
            echo "settings input is a path; reading $SETTINGS"
            SETTINGS=$(cat "$SETTINGS")
          fi
          is_object "$SETTINGS" || { echo "::error::the settings input is neither a JSON object nor a path to a file holding one"; exit 1; }
          deny='["Bash(git push:*)","Bash(*/scripts/git-push.sh *)","Bash(gh pr comment:*)","Bash(gh issue comment:*)","Bash(gh pr review:*)","Bash(gh pr create:*)","Bash(gh pr merge:*)","Bash(gh issue create:*)"]'
          merged=$(printf '%s' "$SETTINGS" | jq -c --argjson d "$deny" '
            .permissions.allow = ((.permissions.allow // []) - $d)
            | .permissions.deny = (((.permissions.deny // []) + $d) | unique)')
          {
            echo "value<<SETTINGS_EOF"
            printf '%s\n' "$merged"
            echo "SETTINGS_EOF"
          } >>"$GITHUB_OUTPUT"

      # GIT_CONFIG_* env (issue #61): with nothing persisted by checkout, the
      # action's own git needs a credential BEFORE it configures one — tag
      # mode's setupBranch runs `git fetch origin <branch>` (and `git
      # ls-remote` on issue runs) ahead of configureGitAuth (its
      # src/modes/tag/index.ts), which used to ride on checkout's persisted
      # header and would fail on a private caller. This defines a credential
      # helper, in this step's environment only, that answers a 401 from
      # GIT_TOKEN — the JOB token (issue #84): no github_token is passed, so
      # the action mints its own App token through the OIDC exchange (as the
      # reviewer's and the loops' steps do) and the machine-account PAT is nowhere in
      # this job. The agent never pushes: its branch for an issue run is
      # created LOCALLY (setupBranch's `git checkout -b`, verified in the
      # action's src/github/operations/branch.ts — no push), and the action's
      # post-run step (src/github/operations/branch-cleanup.ts) only
      # auto-commits, links or deletes a branch that already exists on
      # origin, which this one never does; the land job pushes the commits
      # and opens the PR. The helper is scoped to this server's URL, so a
      # `git fetch` the agent aims at any other host (its allow-list permits
      # the verb) gets no credential. additional_permissions asks the App
      # token for actions: read, as claude-auto.yml's step does: the exchange
      # grants contents/PR/issues by default, the job's own actions: read
      # covers the job token and not that token, and "why is CI red on this
      # PR" is an everyday dev-agent request (`gh run view --log-failed`) —
      # the PAT used to cover the read.
      - uses: anthropics/claude-code-action@v1
        if: needs.gate.outputs.engine != 'codex'
        id: claude
        env:
          GIT_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.${{ github.server_url }}.helper
          GIT_CONFIG_VALUE_1: '!f() { echo username=x-access-token; echo "password=$GIT_TOKEN"; }; f'
        with:
          anthropic_federation_rule_id: fdrl_01GpNgJm9jE6ZfvcqoJYQL2Y
          anthropic_organization_id: be5d0086-bc43-45d2-9184-20ecdd647aa7
          anthropic_service_account_id: svac_01RL4wYD7ikbypwYKf4wFojv
          anthropic_workspace_id: wrkspc_01RKCQ5DTPBatQ7kHLkaEueD
          trigger_phrase: ${{ inputs.trigger_phrase }}
          label_trigger: ${{ inputs.label_trigger }}
          base_branch: ${{ inputs.base_branch }}
          additional_permissions: "actions: read"
          settings: ${{ steps.agentsettings.outputs.value }}
          claude_args: >-
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
            ${{ inputs.model != '' && inputs.fallback_model != '' && format('--fallback-model {0}', inputs.fallback_model) || '' }}
            ${{ steps.sysprompt.outputs.value != '' && format('--append-system-prompt {0}', toJSON(steps.sysprompt.outputs.value)) || '' }}
            ${{ inputs.claude_args }}

      # The action leaves its App token in remote.origin.url, and git never
      # falls back to a helper when the URL carries a credential (a 401 there
      # rejects outright). Reset the URL so the token does not sit in
      # .git/config for the rest of the job and so any later runner-side
      # fetch reaches its own step-scoped helper. One mechanism across the
      # workflows. always(): a failed or cancelled agent leaves the URL
      # rewritten too.
      - name: Reset origin URL after the agent
        if: always() && steps.claude.outcome != 'skipped'
        uses: meridianlabs-ai/agents/.github/actions/reset-origin-url@main

      # ---- Codex engine (design/codex-engine.md) ----------------------------
      # The codex sandbox has no GitHub credentials, so the agent only edits
      # the working tree: these steps prepare the branch, feed the task in a
      # prompt file, then a runner step commits deterministically and the
      # land job pushes and posts. claude-code-action's internal branch
      # handling is unavailable here, so the prep step reproduces it: PR runs
      # check out the PR head; issue runs cut a claude/issue-N-* branch (the
      # board's join convention) off the base.
      - name: Prepare workspace (codex)
        id: codexprep
        if: needs.gate.outputs.engine == 'codex'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ (github.event.issue.pull_request != '' || github.event.pull_request != '') && 'true' || 'false' }}
          BASE: ${{ inputs.base_branch }}
          SYNC_START_SHA: ${{ steps.sync.outputs.start_sha }}
          # Step-scoped credential for the fetch below (nothing is persisted
          # by checkout; design/architecture.md → "No persisted git
          # credentials"). A read, so the job token.
          GIT_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.${{ github.server_url }}.helper
          GIT_CONFIG_VALUE_1: '!f() { echo username=x-access-token; echo "password=$GIT_TOKEN"; }; f'
        run: |
          set -euo pipefail
          git config user.name "i-am-marvin"
          git config user.email "i-am-marvin@users.noreply.github.com"
          if [ "$IS_PR" = "true" ]; then
            prj=$(gh pr view "$NUM" --repo "$REPO" --json headRefName,isCrossRepository)
            # Fork PRs are out: the head branch is not on origin (this fetch
            # would die opaquely) and the landing step could not push to the
            # fork anyway. Fail here with a clear cause — the Surface step
            # turns it into a visible comment (design/codex-engine.md).
            # Unreachable since issue #59: the trigger check refuses fork
            # heads before engine detection, for both engines. Kept as
            # defense in depth (a re-resolution of the same property, from
            # the same API field).
            if [ "$(jq -r '.isCrossRepository' <<<"$prj")" = "true" ]; then
              echo "::error::PR #$NUM has a fork head — the codex engine cannot push to fork branches; remove the engine:codex label to use the Claude path."
              exit 1
            fi
            branch=$(jq -r '.headRefName' <<<"$prj")
            # "Sync branch with base" already fetched, checked out and merged
            # this branch. Re-running the checkout would abort on the unmerged
            # index it deliberately leaves behind for codex to resolve, so only
            # check out when that step did not (fork heads, which exit above).
            if [ "$(git rev-parse --abbrev-ref HEAD)" != "$branch" ]; then
              git fetch --quiet origin "$branch"
              git checkout --quiet "$branch"
            fi
          else
            base="${BASE:-$(gh repo view "$REPO" --json defaultBranchRef --jq .defaultBranchRef.name)}"
            branch="claude/issue-$NUM-codex-$GITHUB_RUN_NUMBER"
            git checkout --quiet -b "$branch" "origin/$base"
          fi
          echo "prepared branch: $branch"
          echo "branch=$branch" >>"$GITHUB_OUTPUT"
          # Start marker for the landing step: HEAD moved past this = work to
          # land, even if codex committed locally instead of leaving a dirty
          # tree. On PR runs prefer the sync step's PRE-merge tip, so a round
          # whose only product is the base merge still pushes; plain HEAD on
          # issue runs, where no merge happened.
          echo "sha=${SYNC_START_SHA:-$(git rev-parse HEAD)}" >>"$GITHUB_OUTPUT"

      # The prompt travels as a git-excluded workspace file. codex-action
      # reads prompt-file itself, runner-side, before dropping to the codex
      # user, so the location is free — the reviewer's lives in RUNNER_TEMP;
      # here and in the loops it stays in the workspace, where the
      # `.git/info/exclude` entry below keeps the landing step's `git add
      # -A` from committing it. The ending contract makes codex's final
      # message double as the commit subject + the posted comment.
      # The PR-thread sections of the codex prompt (top-level comments
      # filtered and anchored on the newest review round, review threads by
      # state) come from the shared composite — the same jq the review-fix
      # loop embeds, so the two cannot drift — written to a file the compose
      # step cats. A failed fetch fails this step (retry-then-fail inside),
      # which skips the compose and the agent; the Surface step names it.
      - name: Fetch PR thread for codex prompt
        id: codexfeedback
        if: needs.gate.outputs.engine == 'codex' && (github.event.issue.pull_request != '' || github.event.pull_request != '')
        uses: meridianlabs-ai/agents/.github/actions/pr-feedback-context@main
        with:
          token: ${{ github.token }}
          repo: ${{ github.repository }}
          pr: ${{ github.event.issue.number || github.event.pull_request.number }}
          out: ${{ runner.temp }}/codex-feedback.md

      - name: Compose codex prompt
        id: codexcompose
        if: needs.gate.outputs.engine == 'codex'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ (github.event.issue.pull_request != '' || github.event.pull_request != '') && 'true' || 'false' }}
          BRANCH: ${{ steps.codexprep.outputs.branch }}
          BASE: ${{ steps.sync.outputs.base }}
          CONFLICTS: ${{ steps.sync.outputs.conflicts }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          SYNC_APPEND: ${{ inputs.branch_sync_append }}
          COMMENT: ${{ github.event.comment.body }}
          REVIEW: ${{ github.event.review.body }}
          IBODY: ${{ github.event.issue.body }}
          ITITLE: ${{ github.event.issue.title }}
          EXTRA: ${{ inputs.append_system_prompt }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          SETUPFB_OUTCOME: ${{ steps.setupfb.outcome }}
        run: |
          set -euo pipefail
          # Verification instruction keyed on what provisioning did, with the
          # tools' ABSOLUTE paths: under the unprivileged-user strategy
          # codex-action launches codex via `sudo -u codex` (no -E), and
          # sudo's env_reset/secure_path replaces PATH before codex starts —
          # so GITHUB_PATH additions (the venv) do NOT resolve as bare names
          # there (inspect_flow#818 dev run, 2026-09-09: `command -v pytest
          # ruff mypy` printed nothing under codex while the venv was on the
          # runner PATH; the reviewer's Create codex user step has said as
          # much since 2026-09-01). This compose step runs as the runner,
          # where the provisioned PATH is in effect, so discovery happens
          # here. A provisioning failure reaches this branch only on the
          # tolerated codex conflict path (fatal otherwise — the agent is
          # skipped), so that text names the conflicted dependency file as
          # the likely cause.
          if [ "${SETUP_OUTCOME:-}" = "success" ] || [ "${SETUPFB_OUTCOME:-}" = "success" ]; then
            tools=""
            for t in pytest ruff mypy pyright python3; do
              path=$(command -v "$t" 2>/dev/null || true)
              [ -n "$path" ] && tools="$tools$t=$path "
            done
            verify="Verify your work with the locally provisioned tools where relevant. Your process runs under sudo with a reset PATH, so bare command names will NOT resolve — invoke them by these ABSOLUTE paths: ${tools:-none discovered}."
          elif [ "${SETUP_OUTCOME:-}" = "failure" ] || [ "${SETUPFB_OUTCOME:-}" = "failure" ]; then
            verify="NOTE: environment provisioning FAILED before you started (on this conflicted run the likely cause is a conflicted dependency file — pyproject.toml or a lockfile — see the merge conflict task below), so pytest and the project's dependencies are probably NOT installed. Resolve the merge conflict first; THEN you may provision them yourself (network is available inside your sandbox): create .venv in the project root and dev-install the project into it (e.g. /usr/bin/python3 -m venv .venv && .venv/bin/pip install -e '.[dev]' — .venv/ and *.egg-info/ are already git-excluded; keep it to that). If that fails too, verify as far as the bare runner allows (py_compile, reading the code) and state plainly in your final message that verification was static-only — the next run provisions normally once the resolved branch is pushed."
          else
            verify="No project environment was provisioned for this checkout (no claude-setup action and no pyproject.toml); verify with whatever the bare runner offers and say what you could not run."
          fi
          # Retry-then-fail on context fetches — never swallow: the embedded
          # context is load-bearing, so a swallowed transient either burns
          # the round on inference (PR #392, 2026-09-01: the emptiness guard
          # fired "empty — transient?" with the real gh error discarded) or
          # silently degrades the prompt where no emptiness invariant exists
          # (the inline-comments section). Three attempts absorb blips;
          # exhaustion fails the step with gh's real stderr in the log,
          # routing into the prep-failure surfacing.
          fetch() { # fetch <outfile> <gh args...>
            local out="$1"; shift
            local n=0
            until gh "$@" >"$out"; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then
                # >&2: call sites sit inside a stdout-redirected group, so a
                # plain echo would land in the abandoned scratch file; the
                # runner parses workflow commands on stderr too.
                echo "::error::context fetch failed after 3 attempts: gh $*" >&2
                return 1
              fi
              sleep $((n * 5))
            done
          }
          {
            echo "You are the dev agent for $REPO, running on the Codex engine in a full local checkout of branch $BRANCH."
            if [ "$IS_PR" = "true" ]; then
              echo "Context: pull request #$NUM — its head branch is checked out; your edits continue that PR."
            else
              echo "Context: issue #$NUM — your edits will be pushed to a new branch and opened as a PR fixing it."
            fi
            echo "CONSTRAINTS: you have NO GitHub credentials — nothing you run can push or post, and you must NOT run gh, git fetch or git push at all (an anonymous fetch might succeed on a public repo; do not try it — the checked-out tree is the one to work on). Network access IS available inside your sandbox for package downloads and test fixtures (install into the project venv if a tool is missing; keep installs minimal, never install from a git+ URL — an editable VCS install clones a repo into the venv, and a nested checkout fails the run — and do not edit dependency files the task does not call for), but nothing you do can push to or post on GitHub. Make your changes in the working tree on the checked-out branch only — do NOT create or switch branches or check out other commits. Committing locally is unnecessary but harmless (the landing step lands local commits too); a deterministic workflow step commits leftover edits, pushes, and posts for you. $verify"
            if [ -n "${CONFLICTS:-}" ]; then
              echo "MERGE CONFLICT RESOLUTION — do this FIRST, before the task below. A merge of origin/$BASE into this branch is already IN PROGRESS in your working tree and conflicts in these files:"
              sed 's/^/  /' <<<"$CONFLICTS"
              [ -n "${SYNC_APPEND:-}" ] && echo "$SYNC_APPEND"
              echo "Resolve every conflict by editing those files, preserving BOTH sides' intent — the base side is other people's merged work, so never resolve by discarding it wholesale. Local git is available and useful here (git status, git diff, git log, git add <file>); the GitHub-facing commands the CONSTRAINTS above forbid (gh, git fetch, git push) stay forbidden, and you must NOT run git merge, git rebase or git checkout of any ref — that would strand the in-progress merge. After resolving each file you MUST stage it with git add <file>: the landing step FAILS the run on any path still unmerged in the index (that index check is what catches binary and modify/delete conflicts, which have no markers), and on any surviving conflict marker — so leaving either is strictly worse than resolving and staging. Once resolved, treat the MERGED tree as the code you are working on: re-read what you changed and re-run the relevant tests against it, not against the pre-merge state."
            elif [ -n "${MERGE_SHA:-}" ] && [ -n "${SYNC_APPEND:-}" ]; then
              # Clean merge: the repo-specific merge rule still applies (the
              # fork's is about a NON-conflicting CHANGELOG mis-merge).
              echo "BASE MERGE NOTE: a workflow step already merged origin/$BASE into this branch before you started (a clean merge, no conflicts). Review that merge result against the following before the task below, and fix it in the working tree if it is off:"
              echo "$SYNC_APPEND"
            fi
            echo "ENDING CONTRACT: your final message MUST start with a single conventional-commit summary line for the change (it becomes the commit subject), then a blank line, then a body explaining what you did and why (it is posted as a comment on #$NUM). If you cannot or should not make a change, leave the tree untouched and explain why in the final message. If the prompt has a REVIEW THREADS section, end the body with ONE final line of exactly the form RESOLVED-THREADS: <thread-id> <thread-id> ... (all ids on that same line, space-separated) naming the OPEN threads (their thread-id values from that section) whose feedback you FULLY addressed in code this round — or RESOLVED-THREADS: none. Never list a thread you declined, only partly addressed, or answered with rationale instead of a change: a workflow step resolves exactly the threads on that line, on your word, and only if your changes were pushed."
            [ -n "$EXTRA" ] && printf 'REPO GUIDANCE: %s\n' "$EXTRA"
            echo "TASK:"
            if [ -n "$COMMENT" ]; then
              printf '%s\n' "$COMMENT"
            elif [ -n "$REVIEW" ]; then
              printf '%s\n' "$REVIEW"
            else
              printf '%s\n\n%s\n' "$ITITLE" "$IBODY"
            fi
            if [ "$IS_PR" = "true" ]; then
              # Codex cannot read the PR thread the way the Claude path does
              # (gh at runtime), so embed it: title/body, the top-level
              # comments filtered and anchored on the newest review round
              # (bounded tail), then the review threads by state — mirroring
              # the review-fix prep — because a trigger like "address the
              # feedback above" needs its referent in the prompt. The bounds
              # are applied at the source so the head cap below stays the
              # backstop, not the working limit.
              echo ""
              echo "PR TITLE AND BODY:"
              # No --slurp here, so gh's own --jq is fine; fetch to a file
              # and cat it, same retry-then-fail as the comment fetches.
              fetch "$RUNNER_TEMP/codex-prtb.txt" pr view "$NUM" --repo "$REPO" \
                --json title,body --jq '"\(.title)\n\n\(.body // "")"'
              cat "$RUNNER_TEMP/codex-prtb.txt"
              echo ""
              # RECENT PR COMMENTS (filtered, anchored on the newest review
              # round, bounded tail) and REVIEW THREADS (by state, OPEN with
              # thread ids) — written by the pr-feedback-context composite
              # step above; the filter and renderer rationale lives there.
              cat "$RUNNER_TEMP/codex-feedback.md"
            elif [ -n "$COMMENT" ]; then
              printf '\nFor context, the issue title/body:\n%s\n\n%s\n' "$ITITLE" "$IBODY"
            fi
          } >"$RUNNER_TEMP/codex-context.md"
          # Cap + de-fang from the completed scratch file, NOT in one
          # pipeline with the writers above (SIGPIPE discipline — see the
          # loops' prep steps). The instruction header and TASK sit before
          # the embedded thread, so the cap can never trim the trigger. The
          # cap keeps the START of the file, so what it trims first is the
          # REVIEW THREADS section at the end (the inline findings) — which
          # is why the top-level slice ahead of it is bounded at the source
          # (five human comments before the anchor, the review round plus at
          # most 25 comments after it): the cap is the backstop, not the
          # working bound.
          # The sed is belt-and-braces with the landing step's output
          # de-fang: the embedded comments can include reviewer verdict
          # comments, and a marker substring codex never sees is one it
          # cannot echo (length-neutral substitutions). The review-comment
          # anchor marker and the codex reviewer's engine footer are in the
          # list too: the pr-feedback-context composite has already anchored
          # on them, and a posted summary that echoed either would be a false
          # anchor for a later round on this PR.
          head -c 120000 "$RUNNER_TEMP/codex-context.md" \
            | sed -E -e 's/claude-review-(summary|verdict|comment)/claude-review \1/g' \
                     -e 's/engine: codex/engine  codex/g' \
                     -e 's/auto-(handoff|review-rounds|review-head|fix-attempts)/auto \1/g' >.codex-prompt.md
          # The landing step stages with a blanket `git add -A` (new source
          # files are legitimate output), so exclude the prompt file and the
          # scratch that codex's verification runs leave behind on repos
          # whose .gitignore doesn't already cover it (caches, venvs, the
          # egg-info a setuptools editable install writes into the source
          # tree).
          printf '%s\n' .codex-prompt.md .venv/ venv/ '*.egg-info/' __pycache__/ \
            .pytest_cache/ .mypy_cache/ .ruff_cache/ .coverage node_modules/ \
            >>.git/info/exclude

      # codex-action's default safety-strategy (drop-sudo) chmods root-owned
      # service sockets under /run, breaking D-Bus -> systemd-resolved -> DNS;
      # the hosted runner then dies with "lost communication" 52-65 minutes
      # into the job (openai/codex-action#160; observed twice at ~62 min on
      # inspect_ai#389, 2026-08-31). Until fixed upstream, run codex as a
      # dedicated unprivileged user — the README's other blessed strategy for
      # permission profiles: containment is the user boundary plus the
      # profile sandbox, and the API key stays out of reach (codex has no
      # sudo). The user/grant recipe — pre-codex .git/config and embedded-
      # repo snapshots for the reclaim step, the action's
      # examples/unprivileged-user.yml chown/g+rwX, the codex-owned output
      # dir under RUNNER_TEMP, git safe.directory, and network ON in the
      # sandbox (design/codex-engine.md → Network) — is the shared
      # create-codex-user composite; its description carries the rationale
      # for each. Step name and id are load-bearing: the reclaim step gates
      # on `steps.codexuser.outcome`.
      - name: Create codex user
        id: codexuser
        if: needs.gate.outputs.engine == 'codex'
        uses: meridianlabs-ai/agents/.github/actions/create-codex-user@main

      - name: Run Codex
        id: codexrun
        if: needs.gate.outputs.engine == 'codex'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          safety-strategy: unprivileged-user
          codex-user: codex
          model: ${{ inputs.codex_model }}
          effort: ${{ inputs.codex_effort }}
          permission-profile: workspace_net
          # Authorization: the gate's trig step verified the actor's write access
          # before anything ran (issue #92), so an outsider's trigger on an
          # engine:codex item never reaches this step; codex-action's own
          # built-in write-access check on the triggering actor is the second,
          # independent gate (mirroring the Claude path, where
          # claude-code-action's internal check is the second one). No
          # allow-bot-users: bot actors never pass the gate's trig step, so none reach
          # this step — matching the Claude path, which sets no allowed_bots
          # on this verb either.
          prompt-file: .codex-prompt.md
          output-file: ${{ runner.temp }}/codex/codex-final.md

      # FIRST step after codex had write access to the tree, on every path
      # (always(): success, failure, cancelled): take .git back from the
      # codex user, refuse a redirected git dir (.git/commondir, symlinked
      # .git), and restore the pre-codex .git/config that `Create codex user`
      # snapshotted (design/codex-engine.md → Hook-safe landing). Runs BEFORE
      # the guard and the landing so that every later step reads a clean
      # config regardless of how codex, the guard or the commit step ended.
      # Every later step that runs git here — the guard, the commit step, the
      # manifest composer and emit-landing — is gated on the guard, which is
      # gated on this step's success (AGENTS.md → the codex path). Runs no
      # git itself.
      - name: Reclaim workspace from codex
        id: codexreclaim
        if: always() && steps.codexuser.outcome == 'success'
        uses: meridianlabs-ai/agents/.github/actions/reclaim-codex-workspace@main

      # Token split for the codex run: the CLI's step-log "tokens used" is one
      # blended number (non-cached input + output), so this reads the session
      # rollout codex wrote under its CODEX_HOME and puts input / cached /
      # output / reasoning counts and the model that served in the job
      # summary — the codex counterpart of Model provenance below. Runs right
      # after codex, before landing, so a landing failure can't hide the
      # spend. Best-effort: the script exits 0 on every path, and
      # continue-on-error makes that structural — a failure here must never
      # trip the landing step's implicit success() gate and strand the work.
      - name: Codex usage
        if: always() && needs.gate.outputs.engine == 'codex'
        continue-on-error: true
        uses: meridianlabs-ai/agents/.github/actions/codex-usage@main
        with:
          requested-model: ${{ inputs.codex_model }}
          requested-effort: ${{ inputs.codex_effort }}

      # Unresolved-merge guard (shared composite): the landing step's `git add
      # -A` would happily stage conflict markers and `git commit` would then
      # produce a valid merge commit containing them, so this check is the
      # only thing between a half-resolved merge and the PR branch. A separate
      # step so the landing step below is skipped, not entered, on failure;
      # the Surface step reads this step's outcome. Also gated on the reclaim:
      # a refused (redirected) git dir must not be read at all.
      - name: Guard against an unresolved merge (codex)
        id: codexguard
        if: steps.codexrun.outcome == 'success' && steps.codexreclaim.outcome == 'success'
        uses: meridianlabs-ai/agents/.github/actions/unresolved-merge-guard@main
        with:
          conflicts: ${{ steps.sync.outputs.conflicts }}

      # Commit the codex work: the commit half of the old "Land codex work"
      # step (issue #84). The push, the summary comment, the thread
      # resolutions and the re-review hand-back are the land job's, from the
      # manifest — emit-landing bundles START_SHA..HEAD at the end of this
      # job. No credential here. This step failing fails the run loudly —
      # codex work cannot strand silently.
      #
      # First git-running step after codex had write access to the workspace
      # (the guard above reads only). The reclaim step already took .git back
      # and restored the pre-codex .git/config (remote URLs, credential/http
      # keys, filter drivers, fsmonitor, hooksPath — anything codex wrote
      # there is gone), and this step trusts nothing else under .git
      # (design/codex-engine.md → hook-safe landing): the git dir is pinned
      # by env (GIT_DIR/GIT_COMMON_DIR/GIT_WORK_TREE), so a .git/commondir
      # file could not redirect git to a config codex owns even if the
      # reclaim's refusal had missed it (gitrepository-layout(5): that file
      # sets GIT_COMMON_DIR unless the env already does), and the GIT_CONFIG_*
      # env below re-pins the two things a config restore cannot: hooks live
      # as FILES in .git/hooks, so hooksPath points at an empty, runner-only
      # path; and the index may carry the fsmonitor extension, so fsmonitor
      # is off. The reclaim already moved .git/hooks aside and appended the
      # same two keys to the restored config for every later step; the env
      # pin here is belt and braces on the step that commits. GIT_CONFIG_GLOBAL
      # skips the runner's ~/.gitconfig as well: codex is in the runner
      # group, and a group-writable home file would sit outside the restore
      # (the hosted image ships it runner-only; this makes that structural —
      # identity for the commit is in the repo config the reclaim restored).
      - name: Commit codex work
        id: codexcommit
        if: steps.codexguard.outcome == 'success'
        env:
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          START_SHA: ${{ steps.codexprep.outputs.sha }}
          OUT: ${{ runner.temp }}/codex/codex-final.md
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          GIT_DIR: ${{ github.workspace }}/.git
          GIT_COMMON_DIR: ${{ github.workspace }}/.git
          GIT_WORK_TREE: ${{ github.workspace }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: ${{ runner.temp }}/no-hooks
          GIT_CONFIG_KEY_1: core.fsmonitor
          GIT_CONFIG_VALUE_1: "false"
        run: |
          set -euo pipefail
          # Untracked files count: new source files are legitimate codex
          # output (the prompt file and common test/venv scratch are kept
          # out via .git/info/exclude, written by the compose step).
          # MERGE_HEAD too: a conflict resolution staged byte-identical to
          # HEAD ("ours" on every hunk) leaves status clean while the merge
          # is still in progress — commit anyway so the merge completes,
          # HEAD moves past START_SHA, and the landing lands it.
          # --ignore-submodules=dirty: never spawn `git status` inside an
          # embedded repo (is_submodule_modified) — its nested .git/config
          # is codex-writable and outside the restore and the pins. The
          # reclaim step already refuses a nested repo codex added; this is
          # belt and braces, and `dirty` (unlike `all`) still reports a
          # changed gitlink pointer. `git add -A` below cannot be pinned the
          # same way, which is why the refusal is the primary defence.
          if [ -n "$(git status --porcelain --ignore-submodules=dirty)" ] || git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            # || true inside the substitution: without it a missing/unreadable
            # $OUT fails the pipeline and set -e kills the step before the
            # fallback is reached — the fallback would only ever cover an
            # empty first line.
            subject=$(head -n1 "$OUT" 2>/dev/null | cut -c1-120 || true)
            [ -n "$subject" ] || subject="codex: automated change for #$NUM"
            git add -A
            git commit --quiet -m "$subject" -m "Co-Authored-By: Codex <noreply@openai.com>"
          fi
          # Landable work = HEAD moved since prep, not just a dirty tree:
          # the prompt calls local commits unnecessary but they are possible,
          # and a status-only check would silently discard them with the
          # runner. emit-landing bundles START_SHA..HEAD at the end of the job
          # and the land job pushes it (refusing a HEAD that does not descend
          # from START_SHA — loud, not lossy); here the outcome shapes the
          # summary's footer, and the manifest composer reads the two outputs.
          committed=""
          merge_only=""
          if [ "$(git rev-parse HEAD)" != "$START_SHA" ]; then
            committed=1
            # HEAD still exactly the runner's clean base merge: codex changed
            # nothing (any commit above would have moved it). Report that
            # instead of silently dropping the "no code changes" line.
            [ -n "${MERGE_SHA:-}" ] && [ "$(git rev-parse HEAD)" = "$MERGE_SHA" ] && merge_only=1
            echo "committed $(git rev-parse --short HEAD)${merge_only:+ (base merge only)} — the land job pushes it"
          else
            echo "codex made no changes; nothing to land."
          fi
          echo "committed=$committed" >>"$GITHUB_OUTPUT"
          echo "merge_only=$merge_only" >>"$GITHUB_OUTPUT"

      # Codex cannot run gh, so the review threads it reports as fully
      # addressed (the RESOLVED-THREADS: line of its final message) are
      # parsed here — resolve: "false", the job token: this job holds no
      # write token, so the resolution is the land job's, from the manifest's
      # resolve_threads (only on a PR run that committed real changes: a
      # no-change or merge-only run addressed nothing, whatever the line
      # says; `land` intersects the ids with the PR's own threads). Also
      # writes the final message with the line stripped, on every path: it
      # is machine input, not summary. Best-effort — never fails the job.
      - name: Parse review threads codex reported as addressed
        id: codexthreads
        if: steps.codexcommit.outcome == 'success'
        uses: meridianlabs-ai/agents/.github/actions/resolve-reported-threads@main
        with:
          token: ${{ github.token }}
          repo: ${{ github.repository }}
          pr: ${{ github.event.issue.number || github.event.pull_request.number }}
          final-message: ${{ runner.temp }}/codex/codex-final.md
          stripped: ${{ runner.temp }}/codex-final.stripped.md
          resolve: "false"

      # The codex summary body for the land job to post on the issue/PR,
      # de-fanged: it posts from a write-access account, so bare trigger
      # tokens would fire workflows, and the @auto loops match their
      # verdict/handoff markers with plain substring contains() — codex
      # QUOTING a marker would forge a verdict or suppress an owed hand-back,
      # so break those substrings too. The review-comment anchor marker and
      # the codex reviewer's engine footer are in the list as well: this body
      # posts as marvin, an author pr-feedback-context trusts as a review
      # anchor, so a summary echoing either would be taken for the newest
      # review by the next codex fix round on the same PR (`land` de-fangs
      # triggers and markers again but deliberately not the footer — it
      # posts the codex reviewer's real one — so this is the footer's only
      # layer). Gated on the parse step (which is gated on the commit step):
      # the summary states the thread count, and OUT is the stripped copy it
      # wrote — falling back to FINAL, codex's message unstripped, when that
      # copy is missing (the composite warned; a stray RESOLVED-THREADS line
      # in a comment beats the summary going unread — inspect_ai#428's ten
      # blind rounds). The footer lines say "committed", never "pushed": this
      # step cannot know the push happened (emit-landing may still lose the
      # bundle), and the land job posts the body either way. Runs no git.
      - name: Write codex summary
        id: codexsummary
        if: steps.codexthreads.outcome == 'success'
        env:
          DIR: ${{ runner.temp }}/landing
          OUT: ${{ runner.temp }}/codex-final.stripped.md
          FINAL: ${{ runner.temp }}/codex/codex-final.md
          IS_PR: ${{ (github.event.issue.pull_request != '' || github.event.pull_request != '') && 'true' || 'false' }}
          COMMITTED: ${{ steps.codexcommit.outputs.committed }}
          MERGE_ONLY: ${{ steps.codexcommit.outputs.merge_only }}
          IDS: ${{ steps.codexthreads.outputs.ids }}
        run: |
          set -euo pipefail
          mkdir -p "$DIR"
          src="$OUT"; [ -f "$src" ] || src="$FINAL"
          n_ids=$(wc -w <<<"${IDS:-}" | tr -d ' ')
          {
            printf '🤖 codex (dev agent):\n\n'
            sed -E -e 's/@(review|claude|auto)/`\1`/g' \
                   -e 's/claude-review-(summary|verdict|comment)/claude-review \1/g' \
                   -e 's/engine: codex/engine  codex/g' \
                   -e 's/auto-(handoff|review-rounds|review-head|fix-attempts)/auto \1/g' \
                   "$src" 2>/dev/null || echo "(codex produced no final message)"
            [ -z "$COMMITTED" ] && printf '\n\n_No code changes were made._'
            [ -n "$MERGE_ONLY" ] && printf '\n\n_No code changes were made; the base-branch merge from the workflow was committed and lands with this run._'
            if [ "$IS_PR" = "true" ] && [ -n "$COMMITTED" ] && [ -z "$MERGE_ONLY" ] && [ "${n_ids:-0}" -gt 0 ]; then
              printf '\n\n_%s review thread(s) codex reported as fully addressed are resolved when this run lands._' "$n_ids"
            fi
          } >"$DIR/codex-comment.md"
          # GitHub caps comment bodies at 65,536 characters and codex's final
          # message is unbounded; a post failing there would lose the summary
          # for work that already landed. Truncate with a note instead —
          # cutting the de-fanged body can't resurrect a trigger or marker
          # (the sed removed the @ / split the substrings, and truncation
          # only drops trailing bytes). 59,000, not 60,000: the land job's
          # own de-fang re-caps at 60,000, and the note below must fit under
          # THAT cap or the second truncation would drop it (and the
          # validator refuses a body file of 64 KiB or more outright).
          if [ "$(wc -c <"$DIR/codex-comment.md")" -gt 59000 ]; then
            head -c 59000 "$DIR/codex-comment.md" >"$DIR/codex-comment.trunc"
            printf '\n\n_[truncated: codex output exceeded the comment size cap]_\n' >>"$DIR/codex-comment.trunc"
            mv "$DIR/codex-comment.trunc" "$DIR/codex-comment.md"
          fi
          echo "codex summary: $(wc -c <"$DIR/codex-comment.md") bytes — posted by the land job."
      # ---- end Codex engine --------------------------------------------------

      # Which model actually served this run (design/architecture.md → Model
      # selection): the init line echoes the requested model even when
      # --fallback-model fires, so this parses modelUsage, writes the served-
      # model table to THIS job's summary, and — when a non-requested model
      # served tokens or the result reads like a classifier refusal — hands
      # the note it would have posted back as its `note` output. No token:
      # this job names no GitHub-write secret, so the note travels to the land
      # job as the manifest's provenance_comment_file (composed below) and
      # posts from there as the machine account. Best-effort, always exits 0.
      # Codex runs have no execution file — the Codex usage step above covers
      # them.
      - name: Model provenance
        id: provenance
        if: always() && needs.gate.outputs.engine != 'codex'
        uses: meridianlabs-ai/agents/.github/actions/model-provenance@main
        with:
          exec-file: ${{ steps.claude.outputs.execution_file }}
          requested: ${{ inputs.model }}

      # Surface agent errors the action swallows. A model API error (overload /
      # 529, a model 404, etc.) leaves the run green at the workflow level but
      # with no result — and a stale "I'll get back to you" comment. Detect
      # is_error in the execution log (or a failed step anywhere on the path),
      # and the "completed-but-blocked" case: the agent finished with no error
      # but left its edits uncommitted (below). This job cannot post the ⚠️
      # itself any more (issue #84: the comment must come from an account
      # whose posts are read, and this job holds no such token): the message
      # is written to a file the landing manifest carries as `error` with
      # fail_run true, and the LAND job posts it — de-fanged, as the machine
      # account — and fails the run AFTER everything else landed. So this step
      # exits 0 on every path: the red X is the land job's.
      - name: Surface agent errors
        id: surface
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          ASSERT_OUTCOME: ${{ steps.assert.outcome }}
          BASE_OUTCOME: ${{ steps.base.outcome }}
          START_SHA: ${{ steps.base.outputs.sha || steps.sync.outputs.start_sha || steps.sync.outputs.head_sha }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          SYNC_CONFLICTS: ${{ steps.sync.outputs.conflicts }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          SETUPFB_OUTCOME: ${{ steps.setupfb.outcome }}
          AGENTSETTINGS_OUTCOME: ${{ steps.agentsettings.outcome }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ (github.event.issue.pull_request != '' || github.event.pull_request != '') && 'true' || 'false' }}
          ANCHOR_REPO: ${{ inputs.anchor_repo }}
          ENGINE: ${{ needs.gate.outputs.engine }}
          CODEXPREP_OUTCOME: ${{ steps.codexprep.outcome }}
          CODEXFEEDBACK_OUTCOME: ${{ steps.codexfeedback.outcome }}
          CODEXCOMPOSE_OUTCOME: ${{ steps.codexcompose.outcome }}
          CODEXUSER_OUTCOME: ${{ steps.codexuser.outcome }}
          CODEX_OUTCOME: ${{ steps.codexrun.outcome }}
          CODEXRECLAIM_OUTCOME: ${{ steps.codexreclaim.outcome }}
          CODEXGUARD_OUTCOME: ${{ steps.codexguard.outcome }}
          CODEXCOMMIT_OUTCOME: ${{ steps.codexcommit.outcome }}
          CODEXSUMMARY_OUTCOME: ${{ steps.codexsummary.outcome }}
          ERROR_FILE: ${{ runner.temp }}/agent-error.md
          # The tree check below runs git on the Claude path only (the codex
          # path's commit step already committed the tree, and a reclaim that
          # did not succeed sets err before any git call); pinned like the
          # landing steps anyway (design/codex-engine.md → Hook-safe landing)
          # so the ordering never becomes load-bearing.
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: ${{ runner.temp }}/no-hooks
          GIT_CONFIG_KEY_1: core.fsmonitor
          GIT_CONFIG_VALUE_1: "false"
        run: |
          set -uo pipefail
          rm -f "$ERROR_FILE"
          file="${EXEC:-/home/runner/work/_temp/claude-execution-output.json}"
          err=""
          # The checkout or the persisted-credential assertion failed: nothing
          # else ran (every later step is SKIPPED, not failed). Test for
          # anything but success and name both causes, so a tripped security
          # invariant is not read as a checkout hiccup and blindly re-triggered.
          if [ "${CHECKOUT_OUTCOME:-}" != "success" ] || [ "${ASSERT_OUTCOME:-}" != "success" ]; then
            err="checking out the repository or verifying that no credential was persisted in the workspace failed before the agent started — see the job logs for which; nothing was attempted. Re-trigger to retry only if it was the checkout; a persisted credential is a workflow bug, not a transient."
          fi
          # Issue runs: the base branch's tip could not be read (the caller's
          # base_branch input names a branch that is not on origin?).
          if [ -z "$err" ] && [ "${BASE_OUTCOME:-}" = "failure" ]; then
            err="reading the tip of the base branch failed before the agent started (the base_branch the caller configured is not on origin? — see the job logs); nothing was attempted."
          fi
          # The base-branch sync died before the agent started (a transient
          # gh/fetch error, or its own loud non-conflict merge failure). Every
          # downstream step is SKIPPED, not failed, so no other branch below
          # fires — without this the person who typed the trigger gets the
          # eyes reaction and then silence.
          if [ -z "$err" ] && [ "${SYNC_OUTCOME:-}" = "failure" ]; then
            err="the base-branch sync step failed before the agent started (a transient gh/fetch error, or a base merge that failed without content conflicts — see the job logs); re-trigger to retry."
          fi
          # Provisioning died before the agent started (observed: a transient
          # curl failure downloading uv) — without this, the issue gets no
          # comment at all because the agent step was skipped, not failed.
          # EXCEPT on the codex conflict path (SYNC_CONFLICTS non-empty):
          # there both provisioning steps are continue-on-error, the agent
          # ran static-only with the failure spelled out in its prompt, and
          # the later clauses judge what it did — so a failure there is a
          # log warning, not an error, and "re-trigger to retry" (wrong
          # advice for a conflicted dependency file, which fails identically
          # every time) is never given for it. Mirrors the loops' Surface
          # steps.
          if [ -n "${SYNC_CONFLICTS:-}" ]; then
            if [ "${SETUP_OUTCOME:-}" = "failure" ] || [ "${SETUPFB_OUTCOME:-}" = "failure" ]; then
              echo "::warning::environment provisioning failed on a conflicted run (conflicts in: $(tr '\n' ' ' <<<"$SYNC_CONFLICTS" | sed 's/ *$//')); the agent ran static-only and was told so."
            fi
          elif [ -z "$err" ] && [ "${SETUP_OUTCOME:-}" = "failure" ]; then
            err="environment provisioning (claude-setup) failed before the agent started — usually a transient dependency-download/network error; re-trigger to retry."
          elif [ -z "$err" ] && [ "${SETUPFB_OUTCOME:-}" = "failure" ]; then
            err="fallback environment provisioning (uv dev-install) failed before the agent started — either a transient dependency-download/network error, or the project does not dev-install on a bare runner (that one fails identically on every trigger: check the job logs and fix it by hand); re-trigger if it looks transient."
          fi
          # The settings composer failed (a caller's `settings` that is
          # neither a JSON object nor a path to a file holding one): the
          # action step is SKIPPED, not failed, so without this clause the
          # run ends "No agent error detected" with nothing on the issue.
          # Deterministic — the caller's stub is what needs fixing, so no
          # "re-trigger" advice.
          if [ -z "$err" ] && [ "${AGENTSETTINGS_OUTCOME:-}" = "failure" ]; then
            err="composing the agent's settings failed before the agent started — the caller's \`settings\` input is neither a JSON object nor a path to a file holding one (see the job logs). This fails identically on every trigger: fix the caller stub's settings input."
          fi
          # The agent's own error text is free-form (and unbounded — it is
          # the final message when is_error is set); cap it so the manifest's
          # error.message stays well under the validator's 64 KiB limit.
          [ -z "$err" ] && [ -f "$file" ] && err=$(jq -r '(if type=="array" then . else .messages end) | map(select(.type=="result" and .is_error==true)) | last | .result // empty' "$file" 2>/dev/null | head -c 6000 || true)
          if [ -z "$err" ] && [ "$CLAUDE_OUTCOME" = "failure" ]; then
            err="the Claude Code step failed before producing a result (see the job logs)."
          fi
          # Codex engine: no execution file exists; step outcomes are the
          # signal (the commit is deterministic, so green steps cannot strand).
          if [ -z "$err" ] && [ "${CODEXPREP_OUTCOME:-}" = "failure" ]; then
            err="the codex workspace prep failed before the agent started — a fork-head PR (the codex engine cannot push to fork branches; remove the engine:codex label), or a branch fetch error (see the job logs)."
          fi
          if [ -z "$err" ] && [ "${CODEXFEEDBACK_OUTCOME:-}" = "failure" ]; then
            err="fetching the PR thread for the codex prompt failed before the agent started (a gh/API error that outlasted three attempts — see the job logs); re-trigger to retry."
          fi
          if [ -z "$err" ] && [ "${CODEXCOMPOSE_OUTCOME:-}" = "failure" ]; then
            err="composing the codex prompt failed before the agent started (see the job logs)."
          fi
          # A failed codex-user setup SKIPS the codex step, so it needs its
          # own check or the failure is a silent red job.
          if [ -z "$err" ] && [ "${CODEXUSER_OUTCOME:-}" = "failure" ]; then
            err="the codex user setup failed before the agent started (a runner-image change breaking adduser/usermod? — see the job logs)."
          fi
          if [ -z "$err" ] && [ "${CODEX_OUTCOME:-}" = "failure" ]; then
            err="the codex step failed (missing OPENAI_API_KEY, a triggering actor without write access, or a codex-action error — see the job logs)."
          fi
          # A reclaim that did not succeed SKIPS the guard, the commit step
          # and every later git call (the manifest composer skips git and
          # emit-landing runs read-only whenever the guard did not succeed,
          # which a skipped guard is), so it needs its own check or the
          # failure is a silent red job. `!= success` (not `= failure`) so a
          # job cancel that landed mid-reclaim is named too; the codexuser
          # test keeps the Claude path's `skipped` reclaim from tripping it.
          if [ -z "$err" ] && [ "${CODEXUSER_OUTCOME:-}" = "success" ] && [ "${CODEXRECLAIM_OUTCOME:-}" != "success" ]; then
            err="codex finished but the workspace could not be reclaimed from it (reclaim step outcome: ${CODEXRECLAIM_OUTCOME:-unknown}) — processes were still running as codex after repeated kills, .git is not a plain directory or a .git/commondir redirect exists, codex left an embedded git repository in the tree (a git init or git worktree add under the checkout — the false-alarm case in design/codex-engine.md → Hook-safe landing), the pre-codex git config could not be restored, or the job was cancelled mid-reclaim (see the job logs); nothing was landed. Inspect the codex run's transcript before re-triggering."
          fi
          # A failed guard SKIPS the commit step, so it needs its own check.
          # "nothing was landed" holds because the manifest composer and
          # emit-landing go read-only on a guard that did not succeed: a
          # local commit codex made over the markers is never bundled.
          if [ -z "$err" ] && [ "${CODEXGUARD_OUTCOME:-}" = "failure" ]; then
            err="codex finished but left the base merge unresolved (an unmerged index or surviving conflict markers — see the job logs); nothing was landed. Resolve and stage the conflicts manually, or drop the engine:codex label to use the Claude path."
          fi
          if [ -z "$err" ] && [ "${CODEXCOMMIT_OUTCOME:-}" = "failure" ]; then
            # The guard succeeded on this path, so codex's own local commits
            # (if any) still land through ancestry; only the runner's commit
            # of its leftover edits is lost — say so, rather than "nothing".
            err="codex finished but committing its leftover edits failed — codex's own local commits, if any, still land; its uncommitted edits did not, and its summary could not be composed (see the job logs)."
          fi
          # The commit succeeded but the summary was never written (the parse
          # composite is best-effort and cannot fail, so a skipped summary
          # step means a failed one): the commits land, the thread has no
          # comment about them.
          if [ -z "$err" ] && [ "${CODEXCOMMIT_OUTCOME:-}" = "success" ] && [ "${CODEXSUMMARY_OUTCOME:-}" != "success" ]; then
            err="codex finished and its commits land, but its summary could not be composed (summary step outcome: ${CODEXSUMMARY_OUTCOME:-unknown}; see the job logs for the final message)."
          fi
          # Completed-but-blocked (Claude path): the action reports success,
          # but the agent left edits to tracked files uncommitted — they die
          # with the runner, whatever its summary says (inspect_ai#195: fix
          # implemented and tested, zero bytes landed). The deterministic
          # replacement for the old "Verify agent work landed" step, which
          # checked for unpushed commits: the push is the land job's now, so
          # only an uncommitted tree can strand work. Untracked files are
          # normal scratch (test caches, venvs) — only tracked-file edits
          # count. Flagged only when nothing of the AGENT's is landable: HEAD
          # still at the start SHA, or exactly the runner's clean base merge
          # (the merge still lands, so the wording says so). With an agent
          # commit above it the commits land and the leftovers are a warning.
          if [ -z "$err" ] && [ "$ENGINE" != "codex" ] && [ "$CLAUDE_OUTCOME" = "success" ] && [[ "${START_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            dirty=$(git status --porcelain --untracked-files=no --ignore-submodules=dirty 2>/dev/null || true)
            if [ -n "$dirty" ]; then
              head=$(git rev-parse HEAD 2>/dev/null || echo "$START_SHA")
              if [ "$head" = "$START_SHA" ] || { [ -n "${MERGE_SHA:-}" ] && [ "$head" = "$MERGE_SHA" ]; }; then
                # Strip the @ from trigger tokens in agent-authored text and
                # split the codex reviewer's footer — this is embedded in a
                # marvin-authored comment, which pr-feedback-context would
                # take for the newest review if it carried the footer (the
                # land job de-fangs triggers and markers again, but not the
                # footer: see the codex summary step's comment).
                summary=$(jq -r '(if type=="array" then . else .messages end) | map(select(.type=="result")) | last | .result // empty' "$file" 2>/dev/null | head -c 1000 | sed -E -e 's/@(review|claude|auto)/\1/g' -e 's/engine: codex/engine  codex/g' || true)
                err="the agent finished but left edits to tracked files uncommitted, so none of its work landed (only the runner's base merge, if there was one) — whatever its summary reports, no code change reached the branch. The runner is ephemeral, so those edits are gone; re-trigger to redo the task."
                [ -n "$summary" ] && err="$err Agent summary: $summary"
              else
                echo "::warning::the agent committed but also left uncommitted edits to tracked files behind; the commits land, the leftovers die with the runner: $(printf '%s' "$dirty" | head -5 | tr '\n' ' ')"
              fi
            fi
          fi
          [ -z "$err" ] && { echo "No agent error detected."; exit 0; }
          echo "::error::Claude run did not complete: $err — the land job posts the note and fails the run."
          # cc the responsible human on PR threads (same rationale as the
          # auto loops): PR-triggered failures otherwise email nobody. Issue
          # threads skip this — the issue author/assignee already gets email
          # as a participant. Derivation mirrors claude-auto.yml: closing
          # ref, else claude/issue-N-* branch; first assignee unless
          # bot/machine account, else author unless bot/machine account.
          # Reads only, with the job token.
          cc=""
          if [ "${IS_PR:-false}" = "true" ] && [ -n "${NUM:-}" ]; then
            mention=""
            prj=$(gh pr view "$NUM" --repo "$REPO" --json body,headRefName 2>/dev/null || echo '{}')
            ref=$(jq -r '.body // ""' <<<"$prj" \
                    | grep -ioE '(fixes|closes|resolves)[[:space:]]+([-A-Za-z0-9._]+/[-A-Za-z0-9._]+)?#[0-9]+' \
                    | head -1 || true)
            inum=""
            issue_repo="$REPO"
            lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
            if [ -n "$ref" ]; then
              refrepo=$(printf '%s' "$ref" | grep -oiE '[-A-Za-z0-9._]+/[-A-Za-z0-9._]+' || true)
              if [ -z "$refrepo" ] || [ "$(lower "$refrepo")" = "$(lower "$REPO")" ]; then
                inum=$(printf '%s' "$ref" | sed -n 's/.*#\([0-9]\{1,\}\).*/\1/p')
              elif [ -n "${ANCHOR_REPO:-}" ] && [ "$(lower "$refrepo")" = "$(lower "$ANCHOR_REPO")" ]; then
                inum=$(printf '%s' "$ref" | sed -n 's/.*#\([0-9]\{1,\}\).*/\1/p')
                issue_repo="$ANCHOR_REPO"
              fi
            fi
            if [ -z "$inum" ]; then
              hb=$(jq -r '.headRefName // ""' <<<"$prj")
              inum=$(printf '%s' "$hb" | sed -n 's/^claude\/issue-\([0-9]\{1,\}\)-.*/\1/p')
              if [ -n "$inum" ] && [ -n "${ANCHOR_REPO:-}" ] && \
                 gh api "repos/$ANCHOR_REPO/branches/$hb" --silent >/dev/null 2>&1; then
                issue_repo="$ANCHOR_REPO"
              fi
            fi
            [ -n "$inum" ] && mention=$(gh api "repos/$issue_repo/issues/$inum" \
              --jq 'if .pull_request then "" else (([(.assignees // [])[] | select(.type != "Bot" and .login != "i-am-marvin") | .login] | first // "") as $a | if $a != "" then $a elif (.user.type=="Bot" or .user.login=="i-am-marvin") then "" else .user.login end) end' 2>/dev/null || true)
            [ -n "$mention" ] && cc=$(printf '\n\ncc @%s' "$mention")
          fi
          # Trigger tokens deliberately absent from our own text (the land
          # job's de-fang would backtick them anyway): it is posted.
          printf '⚠️ This Claude run did not complete — it errored before finishing:\n\n> %s\n\nUsually transient (model API capacity/overload or a model-availability blip). Re-trigger to retry; if it persists see https://status.claude.com.%s\n' "$err" "$cc" >"$ERROR_FILE"

      # Everything the land job pushes, posts and moves, as ONE JSON object for
      # emit-landing's manifest-extra (schema: .github/actions/emit-landing/
      # README.md). Body text goes in as files under the landing directory,
      # referenced by name; the manifest itself is DATA the land job
      # validates before acting. The rules, each the old post-agent step it
      # replaces (issue #84):
      #   branch — PR runs: the PR's head branch (the gate's lookup; the
      #     validator pins the manifest to the PR's live headRefName anyway).
      #     Issue runs: the branch claude-code-action or the codex prep step
      #     cut (`branch_name` / codexprep's output; a failed action step
      #     loses its outputs, so the local branch is read when it carries
      #     the issue's prefix), else a prefix-conforming placeholder.
      #     NOTHING is bundled unless HEAD is on that branch: the checkout
      #     lands on the event's default ref, which on the fork (default
      #     `meridian`, base_branch `main`) is a branch AHEAD of the
      #     recorded base tip — so a run whose agent never initialized its
      #     branch (provisioning or the action step failed first) would
      #     otherwise read `main..meridian` as agent work, invent the
      #     placeholder branch and ask for a PR against main (review round
      #     1 of #84 reproduced it). Same rule on PR runs: a closed PR the
      #     sync skipped leaves HEAD on the default ref, whose history may
      #     well contain the PR's merged tip. No evidence, no bundle:
      #     emit-landing runs read-only (the `read_only` output).
      #   pr.open (was "Open or adopt PR for issue-triggered run") — an issue
      #     run whose HEAD moved: title from the tip commit's subject (the
      #     agent writes descriptive, conventional-commit messages — codex's
      #     is its final message's first line — or a default), body `Fixes
      #     #N` + the commit body + the run link, base from base_branch,
      #     labels from the gate (`auto`, engine:*), the originating issue
      #     for the "✅ Opened a pull request" link. `land` adopts an open PR
      #     for the branch instead of duplicating it. With
      #     request_review_after_open (the fork), `handback` rides along:
      #     `land` posts the `@review` after the PR step, which labels first
      #     — the ordering the input exists for.
      #   handback (was "Ensure hand-back after agent push" and the codex
      #     summary's `@review`) — a PR run whose HEAD moved, on an @auto
      #     run or an `auto`-labelled PR (the gate's `auto`): the landed
      #     commit owes exactly one `@review`, whatever the agent step's
      #     outcome (the loops' rule — dropping committed work is worse, the
      #     push is what re-runs CI, and the ⚠️ says the run failed). A
      #     merge-only run owes it too, as the old backstop's post did: the
      #     merge moves the head, and a Q&A @auto run on a behind branch
      #     would otherwise move it with nobody requesting re-review.
      #   comments — codex: the summary the step above wrote. Claude: the
      #     agent's own `comments` from its manifest-extra.json — the ONE key
      #     it may write; each entry pinned to THIS issue/PR (a number of the
      #     agent's choosing would be a posting channel onto other threads),
      #     the body file shape-checked, present, not a symlink and capped
      #     (the validator refuses the WHOLE manifest — commits included —
      #     over one bad reference, so a bad entry is dropped with a warning
      #     instead), at most five, and de-fanged in place with the codex
      #     summary's sed, footer rule included — `land` breaks triggers
      #     and markers again but leaves the codex reviewer's footer alone,
      #     so an agent body quoting `engine: codex`, posted as marvin
      #     after a review verdict, would be pr-feedback-context's newest
      #     review anchor for the next codex fix round (review round 1 of
      #     #84 reproduced it). A no-change Claude run that left no
      #     comment relays its final message instead (de-fanged with the
      #     codex summary's sed, footer rule included), so a run that
      #     answered a question or gave up leaves its answer on the thread
      #     as the machine account — the codex summary's Claude analogue.
      #   resolve_threads — codex, PR run, real commits: the RESOLVED-THREADS
      #     ids (`land` intersects them with the PR's own threads).
      #   stage (was "Stage - Review (hand-back)") — Review: the one-shot dev
      #     agent hands back to a human when it is done, and an errored run
      #     also needs one; EXCEPT a SUCCESSFUL @auto run that left a PR in
      #     the loop (opened one, or ran on a PR): the review loop owns the
      #     stage from there (design/atlas-tracking.md).
      #   provenance_comment_file, error — as in the loops.
      # `moved` requires ancestry (the same test emit-landing applies before
      # it bundles — a rebased HEAD lands nothing and must owe nothing).
      # emit-landing drops handback, stage and resolve_threads again when it
      # drops the bundle, so no bare `@review` posts for a run whose work
      # was lost; `pr.open` survives, and `land` then refuses to open a PR
      # for a branch that is not on origin — reported, not silent.
      # Not set -e: a manifest must come out of every path. On the codex path
      # (the gate's ENGINE — not `codexuser.outcome`, which is
      # `skipped`/`failure` when the prep or user-setup step failed and would
      # let those two fall through to the ancestry branch) the git reads are
      # skipped (nothing lands, no PR, no hand-back) unless the
      # unresolved-merge guard SUCCEEDED — the same condition emit-landing's
      # read-only takes; the loops' composers have the full rationale (the
      # guard is the enforcement point: a failed guard means conflict markers
      # survive in a tree codex may have committed over). Post-codex git, so
      # the git dir is pinned by env like the guard and the commit step.
      - name: Compose landing manifest
        id: landing
        if: always()
        env:
          DIR: ${{ runner.temp }}/landing
          EXTRA: ${{ runner.temp }}/landing-extra.json
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ (github.event.issue.pull_request != '' || github.event.pull_request != '') && 'true' || 'false' }}
          ISSUE: ${{ !github.event.issue.pull_request && github.event.issue.number || '' }}
          ENGINE: ${{ needs.gate.outputs.engine }}
          TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}
          AUTO: ${{ needs.gate.outputs.auto }}
          PR_LABELS: ${{ needs.gate.outputs.pr_labels }}
          HEAD_BRANCH: ${{ needs.gate.outputs.head_branch || steps.sync.outputs.branch }}
          REQ_REVIEW: ${{ inputs.request_review_after_open }}
          BASE: ${{ inputs.base_branch }}
          START_SHA: ${{ steps.base.outputs.sha || steps.sync.outputs.start_sha || steps.sync.outputs.head_sha || github.sha }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          CLAUDE_BRANCH: ${{ steps.claude.outputs.branch_name }}
          CODEX_BRANCH: ${{ steps.codexprep.outputs.branch }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          CODEXGUARD_OUTCOME: ${{ steps.codexguard.outcome }}
          CODEXCOMMIT_OUTCOME: ${{ steps.codexcommit.outcome }}
          CODEX_IDS: ${{ steps.codexthreads.outputs.ids }}
          PROV_NOTE: ${{ steps.provenance.outputs.note }}
          ERROR_FILE: ${{ runner.temp }}/agent-error.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_DIR: ${{ github.workspace }}/.git
          GIT_COMMON_DIR: ${{ github.workspace }}/.git
          GIT_WORK_TREE: ${{ github.workspace }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: ${{ runner.temp }}/no-hooks
          GIT_CONFIG_KEY_1: core.fsmonitor
          GIT_CONFIG_VALUE_1: "false"
        run: |
          set -uo pipefail
          mkdir -p "$DIR"
          extra='{}'
          moved=false
          head=""
          local_branch=""
          git_ok=""
          if [ "$ENGINE" = "codex" ] && [ "${CODEXGUARD_OUTCOME:-}" != "success" ]; then
            echo "landing: the codex unresolved-merge guard did not succeed (outcome: ${CODEXGUARD_OUTCOME:-unknown} — a failed prep, user-setup, codex or reclaim step skips it); running no git — nothing lands, no PR is opened and no hand-back is owed."
          else
            git_ok=1
            local_branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || true)
          fi
          # -- the branch the land job pushes to (emit-landing's `branch`)
          if [ "$IS_PR" = "true" ]; then
            branch="$HEAD_BRANCH"
          else
            branch="${CODEX_BRANCH:-$CLAUDE_BRANCH}"
            if [ -z "$branch" ]; then
              case "$local_branch" in "claude/issue-${ISSUE:-0}-"*) branch="$local_branch" ;; esac
            fi
            [ -n "$branch" ] || branch="claude/issue-${ISSUE:-0}-run-$GITHUB_RUN_ID"
          fi
          echo "branch=$branch" >>"$GITHUB_OUTPUT"
          # -- what may be bundled: HEAD on the branch (the evidence that the
          # agent's branch was initialized and worked on), moved past the
          # start SHA and descending from it.
          read_only=true
          if [ -n "$git_ok" ] && [ -n "$branch" ] && [ "$local_branch" = "$branch" ]; then
            read_only=false
            if [[ "${START_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
              head=$(git rev-parse HEAD 2>/dev/null || echo "$START_SHA")
              if [ "$head" != "$START_SHA" ] && git merge-base --is-ancestor "$START_SHA" "$head" 2>/dev/null; then
                moved=true
              fi
            fi
          elif [ -n "$git_ok" ]; then
            echo "landing: HEAD is on '${local_branch:-?}', not on the run's branch '$branch' — the agent never initialized or left its branch; nothing is bundled and no PR is opened."
          fi
          echo "read_only=$read_only" >>"$GITHUB_OUTPUT"
          # Merge-only: HEAD moved, but only to the runner's clean base merge
          # — any agent commit would have moved it further — so the agent
          # committed nothing.
          merge_only=""
          [ "$moved" = "true" ] && [ -n "${MERGE_SHA:-}" ] && [ "$head" = "$MERGE_SHA" ] && merge_only=1
          committed=""
          [ "$moved" = "true" ] && [ -z "$merge_only" ] && committed=1
          # -- pr.open: an issue run that produced commits gets its PR
          if [ "$IS_PR" != "true" ] && [ "$moved" = "true" ] && [[ "${ISSUE:-}" =~ ^[0-9]+$ ]]; then
            # Title from the tip commit's subject; jq slices by code point,
            # so the validator's 256-character cap cannot split a multibyte
            # character the way `cut -c` (bytes) would.
            title=$(git log -1 --format=%s HEAD 2>/dev/null | tr -d '\n' || true)
            [ -n "$title" ] || title="claude: automated change for #$ISSUE"
            detail=$(git log -1 --format=%b HEAD 2>/dev/null || true)
            {
              printf 'Fixes #%s\n\n' "$ISSUE"
              [ -z "$detail" ] || printf '%s\n\n' "$detail"
              printf -- '---\n_Opened by the dev agent from [this run](%s)._\n' "$RUN_URL"
            } >"$DIR/pr-body.md"
            labels='[]'
            printf '%s' "${PR_LABELS:-}" | jq -e 'type == "array" and all(strings)' >/dev/null 2>&1 && labels="$PR_LABELS"
            pr=$(jq -nc --arg t "$title" --arg base "$BASE" --argjson labels "$labels" --argjson issue "$ISSUE" \
                   '{open: true, title: $t[:256], body_file: "pr-body.md", labels: $labels, issue: $issue}
                    + (if $base != "" then {base: $base} else {} end)')
            extra=$(jq -c --argjson pr "$pr" '.pr = $pr' <<<"$extra")
            if [ "${REQ_REVIEW:-false}" = "true" ]; then
              extra=$(jq -c '.handback = true' <<<"$extra")
            fi
          fi
          # -- hand-back: a landed commit on a PR in the loop's hands
          if [ "$IS_PR" = "true" ] && [ "$moved" = "true" ] && [ "${AUTO:-}" = "true" ]; then
            extra=$(jq -c '.handback = true' <<<"$extra")
          fi
          # -- comments (and the codex thread ids)
          if [ "$ENGINE" = "codex" ]; then
            if [ "${CODEXCOMMIT_OUTCOME:-}" = "success" ] && [ -s "$DIR/codex-comment.md" ] && [[ "$NUM" =~ ^[0-9]+$ ]]; then
              extra=$(jq -c --argjson n "$NUM" '.comments = [{number: $n, body_file: "codex-comment.md"}]' <<<"$extra")
              if [ "$IS_PR" = "true" ] && [ -n "$committed" ]; then
                # One jq builds the array, so an empty or all-filtered list
                # is exactly `[]` (review round 1 of #83: a grep-based
                # version appended a second array under pipefail).
                ids=$(jq -nc --arg s "${CODEX_IDS:-}" '[$s | split(" ")[] | select(test("^PRRT_[A-Za-z0-9_-]+$"))] | unique')
                [ "$ids" = "[]" ] || extra=$(jq -c --argjson t "$ids" '.resolve_threads = $t' <<<"$extra")
              fi
            fi
          else
            agent='{}'
            if [ -f "$DIR/manifest-extra.json" ]; then
              if ! agent=$(jq -c 'if type=="object" then . else error("not an object") end' "$DIR/manifest-extra.json" 2>&1); then
                echo "::error::landing: the agent's manifest-extra.json is not a JSON object ($agent); its comments were dropped."
                agent='{}'
              fi
            fi
            unknown=$(jq -r '[keys[] | select(. != "comments")] | join(", ")' <<<"$agent" 2>/dev/null || true)
            [ -z "$unknown" ] || echo "::warning::landing: ignored keys the agent may not set in its manifest: $unknown."
            comments='[]'
            n=0
            # `-` stands in for a missing number: read strips leading IFS
            # whitespace, so an empty first field would collapse into the
            # second.
            while IFS=$'\t' read -r number file; do
              [ -n "$file" ] || { echo "::warning::landing: dropped a comments entry with no body_file."; continue; }
              if [ "$number" != "-" ] && [ "$number" != "$NUM" ]; then
                echo "::warning::landing: dropped comments entry '$file': number $number is not this run's #$NUM."
                continue
              fi
              if ! [[ "$file" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*$ ]]; then
                echo "::warning::landing: dropped comments entry '$file': body_file must be a plain file name ([A-Za-z0-9._-], not starting with a dot)."
                continue
              fi
              if [ -L "$DIR/$file" ] || [ ! -f "$DIR/$file" ]; then
                echo "::warning::landing: dropped comments entry '$file': no such regular file under the landing directory."
                continue
              fi
              if [ "$n" -ge 5 ]; then
                echo "::warning::landing: dropped comments entry '$file': at most five comments per run."
                continue
              fi
              # De-fang in place (to a sibling scratch file, then move — no
              # GNU-vs-BSD `sed -i`), then cap like the codex summary (the
              # validator refuses a body file of 64 KiB or more, and `land`
              # re-caps at 60,000 with its own note).
              sed -E -e 's/@(review|claude|auto)/`\1`/g' \
                     -e 's/claude-review-(summary|verdict|comment)/claude-review \1/g' \
                     -e 's/engine: codex/engine  codex/g' \
                     -e 's/auto-(handoff|review-rounds|review-head|fix-attempts)/auto \1/g' \
                     "$DIR/$file" >"$DIR/$file.defanged" && mv "$DIR/$file.defanged" "$DIR/$file"
              if [ "$(wc -c <"$DIR/$file")" -gt 59000 ]; then
                head -c 59000 "$DIR/$file" >"$DIR/$file.trunc"
                printf '\n\n_[truncated: the body exceeded the comment size cap]_\n' >>"$DIR/$file.trunc"
                mv "$DIR/$file.trunc" "$DIR/$file"
              fi
              comments=$(jq -c --argjson num "$NUM" --arg f "$file" '. + [{number: $num, body_file: $f}]' <<<"$comments")
              n=$((n + 1))
            done < <(jq -r '(.comments // [])[]? | select(type == "object") | [((.number // "-") | tostring), ((.body_file // "") | if type == "string" then . else "" end)] | @tsv' <<<"$agent" 2>/dev/null || true)
            if [ "$n" -gt 0 ]; then
              extra=$(jq -c --argjson c "$comments" '.comments = $c' <<<"$extra")
            elif [ -z "$committed" ] && [ "${CLAUDE_OUTCOME:-}" = "success" ] && [ ! -s "$ERROR_FILE" ] && [[ "$NUM" =~ ^[0-9]+$ ]]; then
              # No agent commit, no comment of its own and no error: relay
              # the final message so the answer (or the reason it changed
              # nothing) reaches the thread. Same de-fang as the codex
              # summary step: this posts as marvin, so a final message
              # quoting a trigger, a loop marker or the codex reviewer's
              # footer would fire a workflow, forge a verdict or pose as the
              # newest review; `land` repeats the trigger and marker rules
              # but deliberately not the footer.
              file="${EXEC:-/home/runner/work/_temp/claude-execution-output.json}"
              summary=$(jq -r '(if type=="array" then . else .messages end) | map(select(.type=="result")) | last | .result // empty' "$file" 2>/dev/null | head -c 10000 \
                | sed -E -e 's/@(review|claude|auto)/`\1`/g' \
                         -e 's/claude-review-(summary|verdict|comment)/claude-review \1/g' \
                         -e 's/engine: codex/engine  codex/g' \
                         -e 's/auto-(handoff|review-rounds|review-head|fix-attempts)/auto \1/g' || true)
              {
                printf '🤖 claude (dev agent): no code changes were made%s — the agent'"'"'s summary:\n\n' "${merge_only:+ (the base-branch merge from the workflow was committed and lands with this run)}"
                printf '%s\n' "${summary:-(the agent produced no final message)}"
              } >"$DIR/agent-summary.md"
              extra=$(jq -c --argjson num "$NUM" '.comments = [{number: $num, body_file: "agent-summary.md"}]' <<<"$extra")
            fi
          fi
          # -- stage
          agent_ok=""
          if [ "$ENGINE" = "codex" ]; then
            [ "${CODEXCOMMIT_OUTCOME:-}" = "success" ] && agent_ok=1
          else
            [ "${CLAUDE_OUTCOME:-}" = "success" ] && agent_ok=1
          fi
          in_loop=""
          if [ "$IS_PR" = "true" ] || [ "$(jq -r '.pr.open // false' <<<"$extra")" = "true" ]; then in_loop=1; fi
          if [ "$TRIGGER_PHRASE" = "@auto" ] && [ -n "$agent_ok" ] && [ ! -s "$ERROR_FILE" ] && [ -n "$in_loop" ]; then
            echo "landing: successful @auto run with a PR in the loop; the stage stays at Agent (the review loop owns it)."
          else
            extra=$(jq -c '.stage = "Review"' <<<"$extra")
          fi
          if [ -n "${PROV_NOTE:-}" ]; then
            printf '%s\n' "$PROV_NOTE" >"$DIR/prov.md"
            extra=$(jq -c '.provenance_comment_file = "prov.md"' <<<"$extra")
          fi
          if [ -s "$ERROR_FILE" ]; then
            extra=$(jq -c --rawfile msg "$ERROR_FILE" '.error = {message: $msg, fail_run: true}' <<<"$extra")
          fi
          printf '%s\n' "$extra" >"$EXTRA"
          echo "landing: branch=$branch read_only=$read_only moved=$moved committed=${committed:-0} merge_only=${merge_only:-0} $(jq -c 'if .error then .error.message = "<\(.error.message | length) chars>" else . end' <<<"$extra")"

      # Last, always: package the commits above the start SHA and the
      # manifest for the land job. The PR/issue numbers are the event
      # payload's (README → Using the pair), the SAME expressions the land
      # job gets: the validator pins the manifest's pr_number / issue_number
      # to them, its branch to the PR's live head ref on PR runs and to the
      # `claude/issue-N-` prefix on issue runs. read-only whenever the
      # composer says so (its `read_only` output; anything but an explicit
      # `false` — a composer that never wrote it — counts): on the codex path
      # (the gate's engine, so a failed prep or user-setup step is covered
      # too) unless the unresolved-merge guard succeeded — a reclaim that did
      # not succeed skips the guard, and no git may run against a workspace
      # codex still owns; a FAILED guard means conflict markers survive in the
      # tree, and a local commit codex made over them must not be bundled —
      # and on either path when HEAD is not on the run's branch (the agent
      # never initialized it: the checkout's default ref is not agent work).
      # read-only packages nothing above the start SHA. Either way the
      # manifest still carries the Surface step's error for the land job to
      # post. start-sha falls
      # back to github.sha when the checkout or the base step failed
      # (`steps.base` / `steps.sync` empty): an empty start_sha would be
      # refused at `validate`, and the land composite posts the manifest's
      # error only from a VALIDATED manifest — with no repo there is nothing
      # to bundle either way, and github.sha is a trusted, well-formed
      # placeholder.
      - name: Emit landing manifest
        if: always()
        uses: meridianlabs-ai/agents/.github/actions/emit-landing@main
        with:
          start-sha: ${{ steps.base.outputs.sha || steps.sync.outputs.start_sha || steps.sync.outputs.head_sha || github.sha }}
          branch: ${{ steps.landing.outputs.branch || needs.gate.outputs.head_branch }}
          pr-number: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
          issue-number: ${{ !github.event.issue.pull_request && github.event.issue.number || '' }}
          manifest-extra: ${{ runner.temp }}/landing-extra.json
          read-only: ${{ steps.landing.outputs.read_only != 'false' && 'true' || 'false' }}

  # TRUSTED, last: a fresh runner that checks out nothing and installs
  # nothing. The `land` composite is the whole landing — download, validate,
  # push the bundled commits as marvin (which runs CI), open or adopt the PR
  # on an issue run (labels, the "✅ Opened a pull request" link on the
  # issue), post the agent's comments or the codex summary, post exactly
  # `@review` where a hand-back is owed, move the stage, post the provenance
  # note, report the agent error and fail the run when it says so. always():
  # an agent job that failed still gets its error posted; with no artifact at
  # all (runner killed mid-agent) the composite fails its download, lands
  # nothing, and says so on the issue/PR. Gated on the gate job's success as
  # well as its `ok`: a gate that failed after admitting the run has no
  # agent job to land.
  #
  # This workflow keeps the marvin-less fallback the loops dropped: callers
  # without MARVIN_TOKEN still get a github-actions[bot] push and PR — no CI,
  # and blocked entirely where Actions-PR-creation is disallowed — today's
  # documented degradation (secrets.MARVIN_TOKEN above). So the job token
  # holds contents: write HERE, in the job that never ran the agent; the
  # agent job's is read-only.
  land:
    needs: [gate, agent]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write         # the job-token fallback push
      pull-requests: write    # the fallback PR, labels and comments
      issues: write
      actions: read           # artifact download
    steps:
      # Skipped when the agent job was cancelled (as the loops' land jobs
      # skip): its partial commits are not pushed and no PR is opened on the
      # strength of an always(); the two steps below say so instead.
      # `skipped` is excluded too — the job-level gate already rules it out
      # — belt and braces for the same "no artifact, no agent" shape.
      - name: Land
        id: land
        if: needs.agent.result != 'cancelled' && needs.agent.result != 'skipped'
        uses: meridianlabs-ai/agents/.github/actions/land@main
        with:
          # The machine account where the caller has it; the job token
          # elsewhere (the degradation above).
          token: ${{ secrets.MARVIN_TOKEN || github.token }}
          # The event payload's numbers — the SAME expressions emit-landing
          # got: the validator pins the manifest's pr_number / issue_number
          # to them, and they are where the final report goes when the
          # manifest never validated (missing artifact, tampered manifest).
          pr-number: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
          issue-number: ${{ !github.event.issue.pull_request && github.event.issue.number || '' }}
          # The PR's live head branch, read by the gate before any untrusted
          # code ran: the validator's pin for the manifest's branch on PR
          # runs. Empty on issue runs (and when the gate's read failed —
          # the composite then looks it up itself).
          pr-head-ref: ${{ needs.gate.outputs.head_branch }}
          # Issue runs have no PR head ref to pin the branch to; the prefix
          # claude-code-action (and the codex prep step) give issue branches,
          # composed from the trusted issue number, keeps the push off the
          # branches of PRs opened for other issues. Ignored on PR runs.
          branch-prefix: ${{ !github.event.issue.pull_request && github.event.issue.number && format('claude/issue-{0}-', github.event.issue.number) || '' }}
          # The dev-agent manifest never files follow-up issues; an empty
          # allow-list makes the validator refuse any that appear.
          allowed-issue-repos: ""

      # A cancelled agent job lands nothing and posts nothing except this
      # note — and moves the stage, as every run that needs a human does.
      # Same identity fallback as the landing. Best-effort.
      - name: Report a cancelled agent job
        if: needs.agent.result == 'cancelled'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "${NUM:-}" ] || { echo "no issue or PR to post on"; exit 0; }
          gh api "repos/$REPO/issues/$NUM/comments" \
            -f body="⚠️ The agent job of [this run]($RUN_URL) was cancelled before it finished, so nothing was landed: no push, no pull request, no comments. Re-trigger to redo the task." \
            --silent || echo "::warning::could not post the cancellation note on #$NUM"

      - name: Stage - Review (cancelled agent)
        if: needs.agent.result == 'cancelled'
        uses: meridianlabs-ai/agents/.github/actions/set-stage@main
        with:
          stage: Review
          token: ${{ secrets.MARVIN_TOKEN }}
          repo: ${{ github.repository }}
          issue: ${{ github.event.issue.number || github.event.pull_request.number }}
