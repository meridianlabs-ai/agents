# The agents repo's OWN @auto-loop stub (adapted from
# examples/claude-auto-stub.yml; -stub suffix because claude-auto.yml is the
# reusable definition here). ONE deliberate deviation: this repo has NO CI
# workflow ("no unit-test suite" — changes are validated by triggering the
# agents), so the example's `workflow_run` trigger and ci-fix job are omitted —
# there is nothing for the CI-fix loop to react to. Only the review->fix half
# of @auto runs here. If a CI workflow is ever added, restore the ci-fix job
# from the example and name the CI workflow in on.workflow_run.workflows.
#
# Requires the MARVIN_APP_CLIENT_ID and MARVIN_APP_PRIVATE_KEY org secrets
# scoped to this repo (the machine account's GitHub App): without them the
# gate fails at its mint step.

name: Claude Auto

on:
  # Phase 2/3: react to the reviewer's marked summary comment.
  issue_comment:
    types: [created]

jobs:
  # Review -> fix / handoff. Fire only on the reviewer's marked summary comment
  # on a PR. Cheap gate here (it's a PR, body has the marker); the reusable
  # workflow does the rest (comment author == reviewer, same-repo, `auto`
  # label, round cap).
  review-fix:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != '' &&
      contains(github.event.comment.body, '<!-- claude-review-summary -->')
    uses: meridianlabs-ai/agents/.github/workflows/claude-auto-review.yml@main
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    secrets:
      MARVIN_APP_CLIENT_ID: ${{ secrets.MARVIN_APP_CLIENT_ID }}
      MARVIN_APP_PRIVATE_KEY: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
      # codex engine (design/codex-engine.md in the agents repo):
      # consumed only on items labeled engine:codex; optional.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    with:
      # codex_provision (optional; agents#136): the repository's provisioning
      # recipe for CODEX runs — bash run as the unprivileged codex user in
      # the checkout, in place of the generic `uv venv && uv pip install -e
      # .[dev]`. The codex job never runs this repository's claude-setup
      # action (a composite runs as the runner; nothing from the checkout may
      # run as the runner there), so put here what claude-setup does that the
      # generic recipe does not. uv is on PATH, HOME is /home/codex, no sudo,
      # network on; create .venv so the agent's tools are found. Examples —
      # a Python pin:          uv venv --python 3.11 && uv pip install -e ".[dev]"
      # a lockfile sync:       uv venv --python 3.11 && uv sync --dev
      # Node tooling:          corepack enable --install-directory ~/.local/bin && pnpm install --frozen-lockfile
      # codex_provision: |
      #   uv venv --python 3.11
      #   uv sync --dev
      pr_number: ${{ github.event.issue.number }}
      comment_author: ${{ github.event.comment.user.login }}
