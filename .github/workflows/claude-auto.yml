name: Claude Auto (reusable)

# @auto Phase 1: the CI-failure -> fix loop. A caller stub triggers this on
# `workflow_run` (completed) of the repo's CI workflow(s). When CI fails on a PR
# that carries the `auto` label, this wakes the dev agent (as the machine
# account) with the failing run to push a fix; marvin's push re-runs CI, closing
# the loop. Bounded by fix_attempt_cap: at the cap it drops the `auto` label
# (the kill-switch) and pings a human. See design/auto-agent.md.
#
# Why workflow_run, not check_suite: check_suite/check_run events are NOT
# delivered when the check suite was created by GitHub Actions (GitHub's
# recursion guard), so they never fire for Actions-based CI. workflow_run is the
# supported way to react to a workflow completing — at the cost of the caller
# naming its CI workflow(s) in on.workflow_run.workflows.
#
# The `auto` label is the authorization gate (a write-access human opts a PR in,
# and removing it halts the loop), NOT authorship — a human may label their own
# PR. The machine-account login only matters for attribution in later phases.

on:
  workflow_call:
    inputs:
      head_branch:
        description: PR head branch whose CI failed (from workflow_run.head_branch).
        required: true
        type: string
      pr_number:
        description: >-
          PR number (from workflow_run.pull_requests[0].number) — used only to
          key the concurrency group so this shares it with claude-auto-review.yml
          (both serialize per PR). Empty when CI ran on a non-PR branch, which
          this job skips anyway.
        required: false
        type: string
        default: ""
      ci_run_id:
        description: The failed CI run id, so the agent can read its failing logs.
        required: true
        type: string
      auto_label:
        description: Label that opts a PR into the loop and acts as the kill-switch.
        required: false
        type: string
        default: "auto"
      fix_attempt_cap:
        description: >-
          Max consecutive CI-fix attempts before escalating to a human. Distinct
          from the review-round cap; an unfixable failure would otherwise loop
          forever (marvin's PAT pushes keep re-triggering CI).
        required: false
        type: number
        default: 3
      model:
        required: false
        type: string
        default: "fable"
      fallback_model:
        required: false
        type: string
        default: "default"
      codex_model:
        description: >-
          Model for the codex engine (design/codex-engine.md). Defaults to the
          strongest OpenAI tier (gpt-5.6-sol; decision: Ransom, 2026-08-31).
          Empty falls back to the codex CLI default.
        required: false
        type: string
        default: "gpt-5.6-sol"
      append_system_prompt:
        description: >-
          Repo-specific guidance (e.g. the fork's branch/CHANGELOG rules), same
          channel as claude.yml. Empty by default.
        required: false
        type: string
        default: ""
      branch_sync_append:
        description: >-
          Caller-specific merge guidance, same channel as claude.yml's input of
          the same name: reaches the agent on BOTH engines whenever "Sync
          branch with base" merged this run — appended to the conflict note
          when the merge is handed to the agent, and spliced behind a "a
          workflow step already merged; review the result" lead-in when the
          runner merged cleanly. Clean merges are the case that motivated it
          (git auto-merges a CHANGELOG without conflict and lands the entry
          under the wrong heading — the fork's append checks for that). Empty
          by default. Keep it a single line — the Claude-path prompt travels
          as one output line, so newlines are flattened.
        required: false
        type: string
        default: ""
      anchor_repo:
        description: >-
          Repo whose issues this repo's claude/issue-N-* branch numbers
          reference when the same-named branch also exists there (the
          companion convention). Used only for @-mention derivation.
        required: false
        type: string
        default: ""
      settings:
        description: >-
          Claude Code settings JSON. Keep in sync with claude.yml's default —
          the fix agent needs the same edit + verify-loop + git/gh allow-list.
        required: false
        type: string
        default: >-
          {"permissions":{"allow":["Read","Edit","Write",
          "Bash(pytest:*)","Bash(ruff:*)","Bash(mypy:*)","Bash(pyright:*)","Bash(pip:*)",
          "Bash(pip3:*)","Bash(uv:*)","Bash(python:*)","Bash(python3:*)",
          "Bash(gh:*)",
          "Bash(git fetch:*)","Bash(git merge:*)","Bash(git rebase:*)",
          "Bash(git push:*)","Bash(git checkout:*)","Bash(git switch:*)",
          "Bash(git branch:*)","Bash(git status:*)","Bash(git log:*)",
          "Bash(git diff:*)","Bash(git show:*)","Bash(git rev-parse:*)",
          "Bash(git remote:*)",
          "Bash(git add:*)","Bash(git commit:*)","Bash(git config:*)"]}}
    secrets:
      MARVIN_TOKEN:
        description: >-
          Machine-account PAT. Required for this loop: the fix push must come
          from a real identity so the re-run of CI actually fires (a
          GITHUB_TOKEN push wouldn't — recursion guard), and the same identity
          drove the PR. Without it the loop can't function, so the job no-ops.
        required: false
      OPENAI_API_KEY:
        description: >-
          OpenAI API key for the codex engine (design/codex-engine.md); used
          only by CI-fix rounds on PRs labeled engine:codex.
        required: false

jobs:
  auto-ci-fix:
    runs-on: ubuntu-latest
    # Serialize per PR branch so the attempt counter's read-modify-write can't
    # race: overlapping runs (a human push mid-fix, multiple named CI workflows,
    # a re-run) would otherwise both read the same count and slip past the cap,
    # defeating the kill-switch. cancel-in-progress: false lets an in-flight fix
    # finish (cancelling mid-push would corrupt the branch) and queues the next.
    concurrency:
      group: claude-auto-${{ github.repository }}-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # read the failed CI run's logs
    steps:
      # Check out the PR branch so the agent fixes in place and pushes back to
      # it. Authenticate the remote as the machine account (not the default
      # GITHUB_TOKEN) so the agent's `git push` re-triggers CI — a GITHUB_TOKEN
      # push would be silently dropped by the recursion guard, stalling the loop.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_branch }}
          token: ${{ secrets.MARVIN_TOKEN || github.token }}

      # Resolve the PR, enforce the `auto`-label gate, and compute the attempt
      # count (deterministically, in shell — it gates whether the agent runs).
      # Decide: skip (no PR / not labeled / no token), escalate (over cap), or
      # fix. The counter increments BEFORE the agent runs, so an agent that
      # crashes still consumes an attempt rather than looping forever.
      - name: Gate and count
        id: gate
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          HEAD: ${{ inputs.head_branch }}
          AUTO_LABEL: ${{ inputs.auto_label }}
          CAP: ${{ inputs.fix_attempt_cap }}
          HAS_TOKEN: ${{ secrets.MARVIN_TOKEN != '' }}
          MARKER: "<!-- auto-fix-attempts -->"
        run: |
          set -euo pipefail
          act() { echo "act=$1" >>"$GITHUB_OUTPUT"; }
          # Retry a gh call on transient failure. A 5xx / secondary rate limit
          # returns an HTML error page, which `gh --jq` then rejects with
          # "invalid character '<'"; under `set -e` an unguarded call like that
          # aborts the gate BEFORE it decides fix/escalate, so no fix and no
          # escalation ever post and the loop silently stalls (see
          # design/auto-agent.md). Retry with backoff; a persistent failure
          # still returns non-zero so the gate-failure failsafe below surfaces
          # it instead of dying quietly.
          ghr() {
            local n=0
            until "$@"; do
              n=$((n+1))
              if [ "$n" -ge 4 ]; then return 1; fi
              sleep $((n*3))
            done
          }
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "No MARVIN_TOKEN; the fix loop can't push as a real identity. Skipping."
            act skip; exit 0
          fi
          pr=$(ghr gh pr list --repo "$REPO" --head "$HEAD" --state open \
                 --json number,labels --jq '.[0] // empty')
          if [ -z "$pr" ]; then
            echo "No open PR for $HEAD; nothing to do."; act skip; exit 0
          fi
          number=$(jq -r '.number' <<<"$pr")
          echo "pr=$number" >>"$GITHUB_OUTPUT"
          # Engine selection (design/codex-engine.md): the PR's engine:codex
          # label routes fix rounds to Codex.
          echo "engine=$(jq -r 'if any(.labels[]; .name=="engine:codex") then "codex" else "claude" end' <<<"$pr")" >>"$GITHUB_OUTPUT"
          if [ "$(jq -r --arg l "$AUTO_LABEL" 'any(.labels[]; .name==$l)' <<<"$pr")" != "true" ]; then
            echo "PR #$number is not @auto-labeled; skipping."; act skip; exit 0
          fi
          # Attempt counter: a single sticky marker comment we own.
          cid=$(ghr gh api "repos/$REPO/issues/$number/comments" --paginate \
                  --jq 'map(select(.body|contains("'"$MARKER"'"))) | last | .id // empty')
          prev=0
          if [ -n "$cid" ]; then
            mbody=$(ghr gh api "repos/$REPO/issues/comments/$cid" --jq '.body')
            prev=$(printf '%s' "$mbody" | sed -n 's/.*attempts:[[:space:]]*\([0-9]*\).*/\1/p')
            prev=${prev:-0}
          fi
          next=$((prev + 1))
          echo "attempt=$next" >>"$GITHUB_OUTPUT"
          echo "cid=$cid" >>"$GITHUB_OUTPUT"
          if [ "$next" -gt "$CAP" ]; then act escalate; else act fix; fi

      # Failsafe: if the gate step itself errored (e.g. a transient API failure
      # the retries above couldn't ride out), it never set `act`, so every step
      # below skips and nothing reaches the PR — the loop would stall silently
      # with the label still on. Surface it so a human knows to resume. Kept
      # trigger-free ON PURPOSE: the body must not contain a literal @auto or
      # @review, or this comment would re-fire the loop (see design/auto-agent.md).
      - name: Surface gate failure
        if: always() && steps.gate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.gate.outputs.pr || inputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          [ -z "${PR:-}" ] && { echo "No PR number; nothing to surface."; exit 0; }
          gh issue comment "$PR" --repo "$REPO" --body "$(printf '⚠️ auto: the CI-fix run errored before it could act (a transient GitHub API failure in the gate step). The loop is paused, not stopped — the label is still on. Re-run the failed job (%s) or push a new commit to resume.' "$RUN_URL")" || true

      # Atlas tracking (design/atlas-tracking.md): a CI-fix round is the agent
      # working the PR's issue; an escalation hands it to a human. The PR
      # branch resolves to its issue via claude/issue-N-* (then a Fixes ref).
      - name: Stage - Agent
        if: steps.gate.outputs.act == 'fix'
        uses: meridianlabs-ai/agents/.github/actions/set-stage@main
        with:
          stage: Agent
          token: ${{ secrets.MARVIN_TOKEN }}
          repo: ${{ github.repository }}
          issue: ${{ steps.gate.outputs.pr }}
          branch: ${{ inputs.head_branch }}

      - name: Stage - Review (escalation)
        if: steps.gate.outputs.act == 'escalate'
        uses: meridianlabs-ai/agents/.github/actions/set-stage@main
        with:
          stage: Review
          token: ${{ secrets.MARVIN_TOKEN }}
          repo: ${{ github.repository }}
          issue: ${{ steps.gate.outputs.pr }}
          branch: ${{ inputs.head_branch }}

      # Over the cap: hand off to a human and disarm the loop by removing the
      # label. Removing it is also what a human does to stop @auto manually.
      - name: Escalate to human
        if: steps.gate.outputs.act == 'escalate'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.gate.outputs.pr }}
          AUTO_LABEL: ${{ inputs.auto_label }}
          CAP: ${{ inputs.fix_attempt_cap }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          gh pr comment "$PR" --repo "$REPO" --body \
            "🤖 auto: I've hit the $CAP-attempt limit fixing CI and still can't get it green ([latest run]($RUN_URL)). Removing the \`$AUTO_LABEL\` label and handing this to a human. Re-add the label to let me try again."
          gh pr edit "$PR" --repo "$REPO" --remove-label "$AUTO_LABEL" || true

      # Capture the branch tip and a timestamp before the agent runs so later
      # steps can tell whether the agent's fix landed and what it posted.
      - name: Record base SHA
        if: steps.gate.outputs.act == 'fix'
        id: base
        run: |
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "ts=$(date -u +%FT%TZ)" >>"$GITHUB_OUTPUT"

      # ---- Deterministic base-branch sync (design/architecture.md) ---------
      # The base merge happens HERE, on the runner, for BOTH engines — not in a
      # prompt. The codex sandbox has no network and cannot merge at all, and a
      # prompted merge is advisory, so branches drifted anyway: inspect_ai#392
      # sat 11 commits behind main across 20 commits, and because GitHub cannot
      # compute a merge ref for a conflicted PR, CI never ran and every fix
      # round was written against stale code.
      #
      # A CONFLICTED merge is handed on differently per engine, and the split is
      # forced rather than stylistic: claude-code-action's setupBranch runs
      # `git checkout <branch> --`, which aborts with "you need to resolve your
      # current index first" on an unmerged index, so the Claude path must get a
      # CLEAN index and re-merge inside the agent (it has network and the git
      # allow-list). Codex gets the merge still IN PROGRESS and resolves the
      # markers in the tree; the landing step refuses to push while any survive.
      - name: Sync branch with base
        id: sync
        if: steps.gate.outputs.act == 'fix'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.gate.outputs.pr }}
          ENGINE: ${{ steps.gate.outputs.engine }}
        run: |
          set -euo pipefail
          git config user.name "i-am-marvin"
          git config user.email "i-am-marvin@users.noreply.github.com"
          base=$(gh pr view "$PR" --repo "$REPO" --json baseRefName --jq .baseRefName)
          git fetch --quiet origin "$base"
          echo "base=$base" >>"$GITHUB_OUTPUT"
          # No checkout here: this job's actions/checkout already put the PR
          # head branch in the workspace, and "Record base SHA" above stamped
          # its PRE-merge tip — which is what makes a round whose only product
          # is the base merge still count as landable work and push.
          conflicts=""
          if git merge --no-edit "origin/$base"; then
            echo "merged origin/$base cleanly"
            echo "merge_sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          else
            # quotePath off: C-quoted (non-ASCII) paths would garble the codex
            # prompt's file list and dodge the landing guard's [ -f ] check,
            # silently skipping the marker scan for exactly those files.
            conflicts=$(git -c core.quotePath=false diff --name-only --diff-filter=U)
            # A merge that fails WITHOUT content conflicts must not fall
            # through: the codex path would proceed silently against the stale
            # base (no MERGE_HEAD, empty conflict list), and the Claude path
            # would fail only by accident (merge --abort with no merge in
            # progress). Loud on both engines instead.
            if [ -z "$conflicts" ]; then
              echo "::error::merge of origin/$base failed without content conflicts — see the merge output above."
              exit 1
            fi
            echo "::warning::merge of origin/$base conflicts in: $(tr '\n' ' ' <<<"$conflicts")"
            if [ "$ENGINE" != "codex" ]; then
              git merge --abort
              echo "aborted: the Claude path needs a clean index; the agent re-merges."
              echo "agent_merge=1" >>"$GITHUB_OUTPUT"
              conflicts=""
            fi
          fi
          # Unique delimiter: the block carries repo file paths, and a path
          # equal to a fixed delimiter would terminate it early and inject
          # the remaining lines as step outputs.
          eof="SYNC_CONFLICTS_$(date +%s)_$RANDOM"
          {
            echo "conflicts<<$eof"
            echo "$conflicts"
            echo "$eof"
          } >>"$GITHUB_OUTPUT"

      # Record the attempt (idempotent sticky comment) before invoking the
      # agent — but AFTER the sync step, matching the review loop's ordering:
      # a sync failure (transient gh/fetch error) skips the agent steps rather
      # than failing them, so the refund step would never fire, and an attempt
      # recorded up front would stay burned with no fix ever tried.
      - name: Record attempt
        if: steps.gate.outputs.act == 'fix'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.gate.outputs.pr }}
          CID: ${{ steps.gate.outputs.cid }}
          ATTEMPT: ${{ steps.gate.outputs.attempt }}
          CAP: ${{ inputs.fix_attempt_cap }}
          MARKER: "<!-- auto-fix-attempts -->"
        run: |
          set -euo pipefail
          body="$MARKER
          🤖 auto CI-fix attempts: $ATTEMPT (cap $CAP)."
          if [ -n "$CID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$CID" -f body="$body" --silent
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" --silent
          fi

      - name: Compose fix prompt
        if: steps.gate.outputs.act == 'fix'
        id: prompt
        env:
          PR: ${{ steps.gate.outputs.pr }}
          HEAD: ${{ inputs.head_branch }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          ATTEMPT: ${{ steps.gate.outputs.attempt }}
          CAP: ${{ inputs.fix_attempt_cap }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.ci_run_id }}
          AGENT_MERGE: ${{ steps.sync.outputs.agent_merge }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          SYNC_BASE: ${{ steps.sync.outputs.base }}
          SYNC_APPEND: ${{ inputs.branch_sync_append }}
        run: |
          # Single line: the prompt is spliced as one arg downstream.
          # The merge instruction is spliced only when "Sync branch with base"
          # could not land the merge itself — it must abort a conflicted merge
          # to leave setupBranch a clean index, so on that path the agent does
          # the merge. The caller's branch_sync_append reaches the agent on
          # EITHER path: the fork's is about a non-conflicting CHANGELOG
          # mis-merge, so a clean runner merge is exactly when it applies.
          merge_note=""
          if [ "${AGENT_MERGE:-}" = "1" ]; then
            merge_note=" FIRST TASK, before any of the above: this branch conflicts with its base branch $SYNC_BASE, and a workflow step could not merge it for you. Merge origin/$SYNC_BASE into this branch and resolve every conflict, preserving both sides' intent — the base side is other people's merged work, so never resolve by discarding it wholesale — then include that merge when you push. Until that lands GitHub cannot compute a merge ref for this PR, so CI does not run and the failing job you are asked to fix cannot even be re-evaluated."
            # Flattened: a newline would corrupt the value= output line below.
            [ -n "${SYNC_APPEND:-}" ] && merge_note="$merge_note $(tr '\n' ' ' <<<"$SYNC_APPEND")"
          elif [ -n "${MERGE_SHA:-}" ] && [ -n "${SYNC_APPEND:-}" ]; then
            merge_note=" NOTE: a workflow step already merged origin/$SYNC_BASE into this branch before you started (a clean merge, no conflicts). Review that merge result against the following before your other changes, and fix it in your commit if it is off: $(tr '\n' ' ' <<<"$SYNC_APPEND")"
          fi
          printf 'value=%s\n' "You are @auto, fixing failing CI on PR #$PR (branch $HEAD). CI run $CI_RUN_ID ($RUN_URL) failed — this is fix attempt $ATTEMPT of $CAP. Inspect the failing jobs with \`gh run view $CI_RUN_ID --log-failed\`, diagnose the root cause, and fix it on the current branch. Verify your fix locally (run the relevant pytest/ruff/mypy). Then commit and push to the current branch with git (you are pushing as the machine account, which re-runs CI) — do NOT open a new PR. ENDING CONTRACT (mandatory): if ANY commit reached the branch during this run — a test fix, a merge of main, a doc-only change, anything — your FINAL action is a top-level PR comment of exactly @review. This is not conditional on whether you consider the push a 'fix': any push invalidates the standing review verdict, the reviewer does not run on push, and skipping the comment strands the board at Agent with no hand-back. The ONLY case where you skip @review is when you pushed nothing at all. If after investigating you cannot fix it, post a PR comment explaining what's blocking and stop. In any comment you post, refer to this automation as \`auto\` without an @ prefix; a literal @auto would re-trigger the loop. Likewise never write the loop's marker substrings claude-review-summary, claude-review-verdict, auto-handoff, auto-review-rounds, auto-review-head, or auto-fix-attempts verbatim in any comment — they are matched by plain substring, so quoting one (e.g. when citing a reviewer comment) would forge a verdict or a hand-off; break the token if you must reference it (e.g. 'claude-review summary').${merge_note}" >>"$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        if: steps.gate.outputs.act == 'fix' && steps.gate.outputs.engine != 'codex'
        id: claude
        with:
          anthropic_federation_rule_id: fdrl_01GpNgJm9jE6ZfvcqoJYQL2Y
          anthropic_organization_id: be5d0086-bc43-45d2-9184-20ecdd647aa7
          anthropic_service_account_id: svac_01RL4wYD7ikbypwYKf4wFojv
          anthropic_workspace_id: wrkspc_01RKCQ5DTPBatQ7kHLkaEueD
          github_token: ${{ secrets.MARVIN_TOKEN }}
          prompt: ${{ steps.prompt.outputs.value }}
          settings: ${{ inputs.settings }}
          claude_args: >-
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
            ${{ inputs.model != '' && inputs.fallback_model != '' && format('--fallback-model {0}', inputs.fallback_model) || '' }}
            ${{ inputs.append_system_prompt != '' && format('--append-system-prompt {0}', toJSON(inputs.append_system_prompt)) || '' }}

      # If the runner's base merge is STILL the branch tip, the agent finished
      # without committing anything of its own and nothing else will push it.
      # Land it anyway: restoring the PR to mergeable is what lets GitHub
      # compute a merge ref again, which is what lets CI run at all. Gated on
      # HEAD being EXACTLY that merge commit, so an agent that committed on top
      # — pushed, or deliberately not — is never second-guessed. always(), so a
      # failed or cancelled agent still leaves the branch current.
      - name: Push base merge if unpushed
        if: >-
          always() && steps.gate.outputs.act == 'fix' &&
          steps.gate.outputs.engine != 'codex' && steps.sync.outputs.merge_sha != ''
        env:
          BRANCH: ${{ inputs.head_branch }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$MERGE_SHA" ]; then
            echo "agent commits sit on top of the base merge — leaving the push to it."
            exit 0
          fi
          git fetch --quiet origin "$BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" = "$MERGE_SHA" ]; then
            echo "base merge is already on origin/$BRANCH."
            exit 0
          fi
          # This job's checkout persisted MARVIN_TOKEN, so a plain push already
          # authenticates as the machine account and re-triggers CI.
          git push --quiet origin "HEAD:refs/heads/$BRANCH"
          echo "pushed base merge $(git rev-parse --short HEAD) to $BRANCH"

      # ---- Codex engine CI-fix round (design/codex-engine.md) ----------------
      # The codex sandbox has no network, so the failing CI logs are
      # pre-fetched into the prompt file; commit/push/post are deterministic.
      # A push then owes the @review hand-back, which the backstop below posts.
      - name: Prepare codex CI-fix context
        id: codexprep
        if: steps.gate.outputs.act == 'fix' && steps.gate.outputs.engine == 'codex'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.gate.outputs.pr }}
          HEAD: ${{ inputs.head_branch }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          ATTEMPT: ${{ steps.gate.outputs.attempt }}
          CONFLICTS: ${{ steps.sync.outputs.conflicts }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          SYNC_BASE: ${{ steps.sync.outputs.base }}
          SYNC_APPEND: ${{ inputs.branch_sync_append }}
          CAP: ${{ inputs.fix_attempt_cap }}
        run: |
          set -euo pipefail
          # Retry-then-fail on context fetches — never swallow: the embedded
          # context is load-bearing, so a swallowed transient either burns
          # the round on inference (PR #392, 2026-09-01: the emptiness guard
          # fired "empty — transient?" with the real gh error discarded) or
          # silently degrades the prompt where no emptiness invariant exists
          # (the inline-comments section). Three attempts absorb blips;
          # exhaustion fails the step with gh's real stderr in the log,
          # routing into the prep-failure surfacing and the attempt refund.
          fetch() { # fetch <outfile> <gh args...>
            local out="$1"; shift
            local n=0
            until gh "$@" >"$out"; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then
                # >&2: call sites sit inside a stdout-redirected group, so a
                # plain echo would land in the abandoned scratch file; the
                # runner parses workflow commands on stderr too.
                echo "::error::context fetch failed after 3 attempts: gh $*" >&2
                return 1
              fi
              sleep $((n * 5))
            done
          }
          git config user.name "i-am-marvin"
          git config user.email "i-am-marvin@users.noreply.github.com"
          {
            echo "You are auto, fixing failing CI on PR #$PR in $REPO (branch $HEAD, fix attempt $ATTEMPT of $CAP), running on the Codex engine in a local checkout of the branch."
            echo "CONSTRAINTS: you have NO network access and NO GitHub credentials — you cannot run gh, git fetch, git push, or post comments; do not try. Fix in the working tree on the checked-out branch only — do NOT create or switch branches or check out other commits. Committing locally is unnecessary but harmless (the landing step lands local commits too); a deterministic workflow step commits leftover edits, pushes (which re-runs CI), and posts for you. Verify locally (pytest/ruff/mypy) where relevant."
            if [ -n "${CONFLICTS:-}" ]; then
              echo "MERGE CONFLICT RESOLUTION — do this FIRST, before the task below. A merge of origin/$SYNC_BASE into this branch is already IN PROGRESS in your working tree and conflicts in these files:"
              sed 's/^/  /' <<<"$CONFLICTS"
              [ -n "${SYNC_APPEND:-}" ] && echo "$SYNC_APPEND"
              echo "Resolve every conflict by editing those files, preserving BOTH sides' intent — the base side is other people's merged work, so never resolve by discarding it wholesale. Local git is available and useful here (git status, git diff, git log, git add <file>); the network-dependent commands in the CONSTRAINTS above are still off, and you must NOT run git merge, git rebase or git checkout of any ref — that would strand the in-progress merge. After resolving each file you MUST stage it with git add <file>: the landing step FAILS the run on any path still unmerged in the index (that index check is what catches binary and modify/delete conflicts, which have no markers), and on any surviving conflict marker — so leaving either is strictly worse than resolving and staging. Once resolved, treat the MERGED tree as the code you are working on: re-run the relevant tests against it, not against the pre-merge state."
            elif [ -n "${MERGE_SHA:-}" ] && [ -n "${SYNC_APPEND:-}" ]; then
              # Clean merge: the repo-specific merge rule still applies (the
              # fork's is about a NON-conflicting CHANGELOG mis-merge).
              echo "BASE MERGE NOTE: a workflow step already merged origin/$SYNC_BASE into this branch before you started (a clean merge, no conflicts). Review that merge result against the following before the task below, and fix it in the working tree if it is off:"
              echo "$SYNC_APPEND"
            fi
            echo "ENDING CONTRACT: your final message MUST start with a single conventional-commit summary line for the fix (it becomes the commit subject), then a blank line, then a body explaining the root cause and the fix (posted as a comment). If you cannot fix it, leave the tree untouched and explain what is blocking."
            echo ""
            echo "FAILING CI LOG (run $CI_RUN_ID, failed jobs, tail):"
            fetch "$RUNNER_TEMP/codex-ci-log.txt" run view "$CI_RUN_ID" --repo "$REPO" --log-failed
            tail -c 100000 "$RUNNER_TEMP/codex-ci-log.txt"
          } >.codex-prompt.md
          # The landing step stages with a blanket `git add -A`, so exclude
          # the prompt file and the scratch codex's verification runs leave
          # behind on repos whose .gitignore doesn't cover it (caches, venvs).
          printf '%s\n' .codex-prompt.md .venv/ venv/ __pycache__/ \
            .pytest_cache/ .mypy_cache/ .ruff_cache/ .coverage node_modules/ \
            >>.git/info/exclude

      # codex-action's default safety-strategy (drop-sudo) chmods root-owned
      # service sockets under /run, breaking D-Bus -> systemd-resolved -> DNS;
      # the hosted runner then dies with "lost communication" 52-65 minutes
      # into the job (openai/codex-action#160; observed twice at ~62 min on
      # inspect_ai#389, 2026-08-31). Until fixed upstream, run codex as a
      # dedicated unprivileged user — the README's other blessed strategy for
      # permission profiles: containment is the user boundary plus the
      # profile sandbox, and the API key stays out of reach (codex has no
      # sudo). Setup mirrors the action's examples/unprivileged-user.yml —
      # the chown/g+rwX is what lets codex (primary group codex) write the
      # runner-owned workspace — plus two grants the example never needs (it
      # passes no explicit output-file and its demo prompt never runs git):
      # a codex-owned output dir under RUNNER_TEMP and git safe.directory,
      # commented inline.
      # NB the runner->codex group grant is inert for this job:
      # supplementary groups are fixed at process start, and every step is
      # spawned from a Runner.Worker that predates the usermod. Landing
      # codex's edits works anyway — runner still owns the pre-existing
      # workspace directories, codex's files are world-readable under its
      # umask, and the land step reclaims .git — the one place codex-owned
      # dirs (objects/ fan-out) would block runner's writes. (Group kept as
      # a faithful copy of the example; if codex ever drops a 600 file, the
      # land step needs a chmod -R a+rX sweep, not this group.)
      - name: Create codex user
        id: codexuser
        if: steps.gate.outputs.act == 'fix' && steps.gate.outputs.engine == 'codex'
        run: |
          set -euo pipefail
          sudo adduser --system --home /home/codex --shell /bin/bash --group codex
          sudo usermod -a -G codex runner
          sudo usermod -a -G runner codex
          sudo chown -R runner:codex "$GITHUB_WORKSPACE"
          sudo chmod -R g+rwX "$GITHUB_WORKSPACE"
          sudo find "$GITHUB_WORKSPACE" -type d -exec chmod g+s {} +
          # codex itself (via sudo -u) writes the explicit output-file and
          # the action re-reads it as codex, but RUNNER_TEMP is 755
          # runner:runner on the hosted image. Not g+w on the temp root:
          # codex's runner-group membership IS effective (its processes
          # start post-usermod), so that would hand it rename/delete over
          # the runner's step scripts and the per-step GITHUB_ENV/OUTPUT/
          # PATH files. A codex-owned subdir grants only the output-file
          # write; 755 keeps $OUT readable for the runner-side land step.
          sudo install -d -o codex -g codex -m 755 "$RUNNER_TEMP/codex"
          # The checkout stays runner-owned, so git commands running as
          # codex hit the dubious-ownership refusal, and no profile sandbox
          # lets the agent add the exemption itself.
          sudo -u codex -H git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Codex CI fix
        id: codexfix
        if: steps.gate.outputs.act == 'fix' && steps.gate.outputs.engine == 'codex'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          safety-strategy: unprivileged-user
          codex-user: codex
          model: ${{ inputs.codex_model }}
          permission-profile: ":workspace"
          # workflow_run's actor is the CI run's actor: normally the machine
          # account (a User with write — passes the action's built-in check),
          # but a branch the Claude App pushed (mixed-engine PR relabeled
          # mid-loop) makes it the claude bot — allow that one, matching the
          # other codex steps.
          allow-bot-users: "claude"
          prompt-file: .codex-prompt.md
          output-file: ${{ runner.temp }}/codex/codex-final.md

      - name: Land codex fix
        id: codexland
        if: steps.codexfix.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.gate.outputs.pr }}
          ATTEMPT: ${{ steps.gate.outputs.attempt }}
          OUT: ${{ runner.temp }}/codex/codex-final.md
          START_SHA: ${{ steps.base.outputs.sha }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
          CONFLICTS: ${{ steps.sync.outputs.conflicts }}
        run: |
          set -euo pipefail
          # Reclaim .git before writing objects as runner: any objects/XX
          # fan-out dir codex created (any object-writing git command) is
          # codex-owned, and runner's codex-group membership is inert this
          # job — the commit below (or the hand-back backstop's fetch)
          # would intermittently fail with "insufficient permission for
          # adding an object".
          sudo chown -R runner "$GITHUB_WORKSPACE/.git"
          # Unresolved-merge guard. `git add -A` would happily stage conflict
          # markers and `git commit` would then produce a perfectly valid merge
          # commit containing them, so this check is the only thing between a
          # half-resolved merge and the PR branch. Two distinct failures: an
          # unmerged index (codex never staged a resolution) and staged-but-
          # unresolved text (it staged the markers).
          #
          # The index check runs BEFORE `git add -A` on purpose, and the prompt
          # requires codex to `git add` each resolved file: it is the only
          # check that catches binary and modify/delete conflicts, which have
          # no markers to scan for — a blanket add would silently "resolve"
          # those to whatever sits in the working tree.
          #
          # Only the files the sync step reported are scanned, and `=======` is
          # deliberately NOT matched: a bare seven-equals line is a legitimate
          # reStructuredText/Markdown heading underline, so a repo-wide grep for
          # it would fail honest docs changes.
          if [ -n "$(git ls-files --unmerged)" ]; then
            echo "::error::codex left paths unmerged in the index after the base merge (resolved files must be staged with git add): $(git -c core.quotePath=false diff --name-only --diff-filter=U | tr '\n' ' ')— resolve and stage them manually, or drop the engine:codex label to use the Claude path."
            exit 1
          fi
          if [ -n "${CONFLICTS:-}" ]; then
            while IFS= read -r f; do
              [ -n "$f" ] && [ -f "$f" ] || continue
              if grep -qE '^(<<<<<<<|>>>>>>>) ' -- "$f"; then
                echo "::error::conflict markers remain in $f — refusing to push a half-resolved merge."
                exit 1
              fi
            done <<<"$CONFLICTS"
          fi
          # MERGE_HEAD too: a conflict resolution staged byte-identical to
          # HEAD ("ours" on every hunk) leaves status clean while the merge
          # is still in progress — commit anyway so the merge completes,
          # HEAD moves past START_SHA, and the push gate lands it.
          if [ -n "$(git status --porcelain)" ] || git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            # || true inside the substitution: without it a missing/unreadable
            # $OUT fails the pipeline and set -e kills the step before the
            # fallback is reached — the fallback would only ever cover an
            # empty first line.
            subject=$(head -n1 "$OUT" 2>/dev/null | cut -c1-120 || true)
            [ -n "$subject" ] || subject="codex: fix failing CI on PR #$PR"
            git add -A
            git commit --quiet -m "$subject" -m "Co-Authored-By: Codex <noreply@openai.com>"
          fi
          # Landable work = HEAD moved since the run started, not just a
          # dirty tree: the prompt calls local commits unnecessary but they
          # are possible, and a status-only check would silently discard
          # them with the runner. Explicit refspec so the PR head branch is
          # what gets updated even if codex left HEAD on some other local
          # branch; a diverted HEAD that isn't genuinely new work fails the
          # push non-fast-forward — loud, not lossy.
          pushed=""
          if [ "$(git rev-parse HEAD)" != "$START_SHA" ]; then
            git push --quiet origin "HEAD:refs/heads/$HEAD_BRANCH"
            pushed=1
            echo "pushed $(git rev-parse --short HEAD) to $HEAD_BRANCH"
          fi
          # Post the summary either way (a no-change round IS the blocker
          # comment the ending contract calls for), de-fanged: it posts from
          # a write-access account, and the loops match their verdict/handoff
          # markers with plain substring contains() — codex QUOTING a marker
          # would forge a verdict or suppress an owed hand-back, so break
          # those substrings too. On a push, the backstop below posts the
          # owed @review.
          {
            if [ -n "$pushed" ]; then
              printf '🤖 auto (codex, CI-fix attempt %s): fix pushed — summary below.\n\n' "$ATTEMPT"
            else
              printf '🤖 auto (codex, CI-fix attempt %s): no fix pushed — details below.\n\n' "$ATTEMPT"
            fi
            sed -E -e 's/@(review|claude|auto)/`\1`/g' \
                   -e 's/claude-review-(summary|verdict)/claude-review \1/g' \
                   -e 's/auto-(handoff|review-rounds|review-head|fix-attempts)/auto \1/g' \
                   "$OUT" 2>/dev/null || echo "(codex produced no final message)"
          } >"$RUNNER_TEMP/codex-comment.md"
          # GitHub caps comment bodies at 65,536 characters and codex's final
          # message is unbounded; here the post failing lands AFTER the push,
          # losing the summary for work that already landed. Truncate with a
          # note instead — cutting the de-fanged body can't resurrect a
          # trigger or marker (the sed removed the @ / split the substrings,
          # and truncation only drops trailing bytes).
          if [ "$(wc -c <"$RUNNER_TEMP/codex-comment.md")" -gt 60000 ]; then
            head -c 60000 "$RUNNER_TEMP/codex-comment.md" >"$RUNNER_TEMP/codex-comment.trunc"
            printf '\n\n_[truncated: codex output exceeded the comment size cap]_\n' >>"$RUNNER_TEMP/codex-comment.trunc"
            mv "$RUNNER_TEMP/codex-comment.trunc" "$RUNNER_TEMP/codex-comment.md"
          fi
          gh api "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/codex-comment.md" --silent
      # ---- end Codex engine ---------------------------------------------------

      # Backstop for the ending contract above: a fix round that pushed ANY
      # commit must re-request review — the push invalidates the standing
      # verdict, and without the @review comment (the loop's only hand-back
      # from a CI fix) the board strands at Agent with nothing running
      # (observed: inspect_ai#195 — a post-convergence fix pushed a main-merge
      # + doc move and posted nothing). The remedy is mechanical, so complete
      # the contract deterministically instead of failing red: post the
      # re-review request as the machine account (whose comments trigger the
      # reviewer). Exact-body comment; the reviewer's word-boundary gate and
      # per-PR newest-wins concurrency make a duplicate harmless.
      # Codex gate is codexfix, not codexland: a landing that pushed and then
      # died posting its comment still owes the @review — this step detects
      # the push itself, so gating on the earlier step closes that gap.
      - name: Ensure hand-back after push
        if: >-
          always() && steps.gate.outputs.act == 'fix' &&
          (steps.claude.outcome == 'success' || steps.codexfix.outcome == 'success')
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.gate.outputs.pr }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          SINCE: ${{ steps.base.outputs.ts }}
        run: |
          set -uo pipefail
          git fetch --quiet origin "$HEAD_BRANCH" 2>/dev/null || true
          tip=$(git rev-parse "origin/$HEAD_BRANCH" 2>/dev/null || echo "$BASE_SHA")
          [ "$tip" = "$BASE_SHA" ] && { echo "No push this round; no hand-back owed."; exit 0; }
          posted=$(gh api "repos/$REPO/issues/$PR/comments?since=$SINCE" \
            --jq '[.[] | select((.body | test("^\\s*@review\\s*$")) or (.body | contains("auto-handoff")))] | length' 2>/dev/null || echo 0)
          if [ "${posted:-0}" -gt 0 ]; then
            echo "Hand-back already posted this round."
          else
            echo "Agent pushed ($BASE_SHA -> $tip) without a hand-back; posting the re-review request."
            # Retry with backoff: this comment IS the hand-back — a swallowed
            # failure (observed: GitHub 503 during an outage) strands the
            # board at Agent with green CI and nobody notified. Fail the run
            # loudly if it never lands.
            ok=""
            for i in 1 2 3 4 5; do
              if gh pr comment "$PR" --repo "$REPO" --body '@review'; then ok=1; break; fi
              echo "hand-back post failed (attempt $i); retrying"
              sleep $((i * 15))
            done
            if [ -z "$ok" ]; then
              echo "::error::hand-back @review comment failed after 5 attempts — post it manually"
              exit 1
            fi
          fi

      # Surface agent errors the action swallows (model overload/529, 404, etc.),
      # which otherwise leave the fix run green with nothing pushed. Also catches
      # the "completed-but-blocked" case: the agent finishes with no error but
      # left its fix unlanded (see the landed/pending check below).
      - name: Surface agent errors
        if: always() && steps.gate.outputs.act == 'fix'
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          NUM: ${{ steps.gate.outputs.pr }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
          ANCHOR_REPO: ${{ inputs.anchor_repo }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          SINCE: ${{ steps.base.outputs.ts }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          CODEXPREP_OUTCOME: ${{ steps.codexprep.outcome }}
          CODEXUSER_OUTCOME: ${{ steps.codexuser.outcome }}
          CODEX_OUTCOME: ${{ steps.codexfix.outcome }}
          CODEXLAND_OUTCOME: ${{ steps.codexland.outcome }}
        run: |
          set -uo pipefail
          file="${EXEC:-/home/runner/work/_temp/claude-execution-output.json}"
          err=""
          # The base-branch sync died before the agent started (a transient
          # gh/fetch error, or its own loud non-conflict merge failure). Every
          # downstream step is SKIPPED, not failed, so no other branch below
          # fires; the attempt was deliberately not recorded (Record attempt
          # runs after the sync), so the refund path does not apply either —
          # without this the failure is a silent stall with the board at Agent.
          if [ "${SYNC_OUTCOME:-}" = "failure" ]; then
            err="the base-branch sync step failed before the agent started (a transient gh/fetch error, or a base merge that failed without content conflicts — see the job logs); no fix was attempted. Re-trigger to retry."
          fi
          [ -z "$err" ] && [ -f "$file" ] && err=$(jq -r '(if type=="array" then . else .messages end) | map(select(.type=="result" and .is_error==true)) | last | .result // empty' "$file" 2>/dev/null || true)
          if [ -z "$err" ] && [ "${CODEXPREP_OUTCOME:-}" = "failure" ]; then
            err="the codex context-preparation step failed before the agent started — no fix was attempted (see the job logs)."
          fi
          # A failed codex-user setup SKIPS the codex step, so it needs its
          # own check or the failure is a silent red job.
          if [ -z "$err" ] && [ "${CODEXUSER_OUTCOME:-}" = "failure" ]; then
            err="the codex user setup failed before the agent started — no fix was attempted (a runner-image change breaking adduser/usermod? — see the job logs)."
          fi
          if [ -z "$err" ] && [ "${CODEX_OUTCOME:-}" = "failure" ]; then
            err="the codex fix step failed (missing OPENAI_API_KEY, or a codex-action error — see the job logs)."
          fi
          if [ -z "$err" ] && [ "${CODEXLAND_OUTCOME:-}" = "failure" ]; then
            err="codex finished but its landing step failed — the fix may not have reached the branch (see the job logs)."
          fi
          if [ -z "$err" ] && [ "$CLAUDE_OUTCOME" = "failure" ]; then
            err="the CI-fix step failed before producing a result (see the job logs)."
          fi
          # Completed-but-blocked: the action reports success, but the agent did
          # work that never reached the branch — uncommitted edits or local
          # commits it couldn't push (e.g. a git command outside the allow-list).
          # A healthy fix either lands its changes (commit+push, or a server-side
          # API commit — both advance the remote tip) or makes none at all
          # (posting a blocker comment instead), so unlanded local work means the
          # fix silently stalled and never reached CI. See design/auto-agent.md.
          if [ -z "$err" ] && [ -n "${BASE_SHA:-}" ]; then
            git fetch origin "$HEAD_BRANCH" --quiet 2>/dev/null || true
            remote=$(git rev-parse "origin/$HEAD_BRANCH" 2>/dev/null || echo "$BASE_SHA")
            pending=""
            # untracked files are normal scratch (test caches, venvs) — only
            # tracked-file edits count as unlanded work (see claude-auto-review)
            [ -n "$(git status --porcelain --untracked-files=no 2>/dev/null || true)" ] && pending=1
            [ -n "$(git rev-list "$BASE_SHA..HEAD" 2>/dev/null || true)" ] && pending=1
            handed=0
            if [ "$remote" = "$BASE_SHA" ] && [ -n "$pending" ]; then
              # A hand-off posted this round explains unpushed local edits —
              # the agent hit a push wall and said so (see claude-auto-review).
              # In THIS loop that should essentially never happen: the CI-fix
              # prompt's ending contract is @review-or-blocker, never a
              # hand-off, and nothing here moves the board on the marker. So
              # match strictly (machine account + marker as the leading line,
              # per the documented hand-off contract, mirroring the review
              # loop's selfhandoff detector) — a hit means the agent improvised
              # a hand-off, not prose quoting the marker. The outcome gate also
              # mirrors that detector's success-only condition: a cancelled
              # claude step (empty err, non-success outcome) must fall through
              # to flagging, not suppression. Accepted trade-off: unlike the
              # review loop, suppression here has no compensating board move or
              # taught @-mention — the improvised hand-off comment on the PR is
              # the only human-visible trace, hence the ::warning:: below.
              if [ -n "${NUM:-}" ] && [ "$CLAUDE_OUTCOME" = "success" ]; then
                handed=$(gh api "repos/$REPO/issues/$NUM/comments?since=${SINCE:-}" \
                  --jq '[.[] | select(.user.login=="i-am-marvin" and (.body|startswith("<!-- auto-handoff -->")))] | length' 2>/dev/null || echo 0)
              fi
              if [ "${handed:-0}" -gt 0 ]; then
                echo "::warning::unpushed local edits, but a hand-off comment posted this round explains them; not flagging. (Off-contract for this loop — the CI-fix ending contract is @review-or-blocker, never a hand-off.)"
              else
                # Strip the @ from trigger tokens in agent-authored text — this
                # is embedded in a marvin-authored comment (see claude-auto-review).
                summary=$(jq -r '(if type=="array" then . else .messages end) | map(select(.type=="result")) | last | .result // empty' "$file" 2>/dev/null | head -c 1000 | sed -E 's/@(review|claude|auto)/\1/g' || true)
                err="the agent finished but left edits to tracked files (or unpushed commits) that never landed on the branch — whatever its summary reports, no code change reached CI."
                [ -n "$summary" ] && err="$err Agent summary: $summary"
              fi
            fi
          fi
          [ -z "$err" ] && { echo "No agent error detected."; exit 0; }
          echo "::error::CI-fix run did not complete: $err"
          if [ -n "${NUM:-}" ]; then
            # @-mention the responsible human (the Fixes-ref issue's author,
            # same-repo refs only, bots skipped): without a mention, these
            # error reports on agent-authored PRs generate no email for
            # anyone — non-participants never hear about the failure.
            mention=""
            ref=$(gh pr view "$NUM" --repo "$REPO" --json body --jq '.body // ""' 2>/dev/null \
                    | grep -ioE '(fixes|closes|resolves)[[:space:]]+([-A-Za-z0-9._]+/[-A-Za-z0-9._]+)?#[0-9]+' \
                    | head -1 || true)
            inum=""
            issue_repo="$REPO"
            lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
            if [ -n "$ref" ]; then
              refrepo=$(printf '%s' "$ref" | grep -oiE '[-A-Za-z0-9._]+/[-A-Za-z0-9._]+' || true)
              if [ -z "$refrepo" ] || [ "$(lower "$refrepo")" = "$(lower "$REPO")" ]; then
                inum=$(printf '%s' "$ref" | sed -n 's/.*#\([0-9]\{1,\}\).*/\1/p')
              elif [ -n "${ANCHOR_REPO:-}" ] && [ "$(lower "$refrepo")" = "$(lower "$ANCHOR_REPO")" ]; then
                inum=$(printf '%s' "$ref" | sed -n 's/.*#\([0-9]\{1,\}\).*/\1/p')
                issue_repo="$ANCHOR_REPO"
              fi
            fi
            # Mention-only fallback: non-closing refs (deliberate "Refs ...#N")
            # or no ref — derive from the claude/issue-N-* branch convention.
            # On a companion repo the number references the anchor repo's
            # tracker, but only when the twin branch exists there.
            if [ -z "$inum" ]; then
              inum=$(printf '%s' "$HEAD_BRANCH" | sed -n 's/^claude\/issue-\([0-9]\{1,\}\)-.*/\1/p')
              if [ -n "$inum" ] && [ -n "${ANCHOR_REPO:-}" ] && \
                 gh api "repos/$ANCHOR_REPO/branches/$HEAD_BRANCH" --silent >/dev/null 2>&1; then
                issue_repo="$ANCHOR_REPO"
              fi
            fi
            # Author, unless bot or machine account (marvin is a User, not a
            # Bot — triage issues are marvin-authored); then first assignee.
            [ -n "$inum" ] && mention=$(gh api "repos/$issue_repo/issues/$inum" \
              --jq 'if .pull_request then "" elif (.user.type=="Bot" or .user.login=="i-am-marvin") then (.assignees[0].login // "") else .user.login end' 2>/dev/null || true)
            cc=""
            [ -n "$mention" ] && cc=$(printf '\n\ncc @%s' "$mention")
            gh issue comment "$NUM" --repo "$REPO" --body "$(printf '⚠️ The auto CI-fix run did not complete:\n\n> %s\n\nIf this looks transient (model API capacity/overload), CI will re-trigger it on the next push or you can re-run the workflow; otherwise it likely needs a human.%s' "$err" "$cc")" || true
          fi
          exit 1

      # Infra crashes must not burn fix attempts: the counter increments
      # BEFORE the agent runs (so real crashes still consume attempts), but a
      # step that died with NO execution output at all (bootstrap failure —
      # observed: "socket hang up" before the agent started) attempted no fix,
      # and two such blips nearly escalated a PR spuriously. Roll the sticky
      # counter back one; any run that produced execution output still counts.
      # A failed codex step is the same class — its landing step never ran,
      # so no fix reached the branch (a persistently missing OPENAI_API_KEY
      # must not burn attempts toward spurious escalation) — and so are a
      # failed codex PREP or user-setup step, which die before the agent
      # starts and skip codexfix outright; no execution file ever exists on
      # the codex path, so the guard below refunds it.
      # Safe from races: the job's per-PR concurrency group serializes us.
      - name: Refund infra-crashed attempt
        if: >-
          always() && steps.gate.outputs.act == 'fix' &&
          (steps.claude.outcome == 'failure' || steps.codexfix.outcome == 'failure' ||
           steps.codexprep.outcome == 'failure' || steps.codexuser.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.gate.outputs.pr }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
          ATTEMPT: ${{ steps.gate.outputs.attempt }}
          CAP: ${{ inputs.fix_attempt_cap }}
          MARKER: "<!-- auto-fix-attempts -->"
        run: |
          set -uo pipefail
          file="${EXEC:-/home/runner/work/_temp/claude-execution-output.json}"
          if [ -s "$file" ]; then
            echo "Execution output exists — a real attempt ran; not refunding."
            exit 0
          fi
          prev=$((ATTEMPT - 1))
          cid=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                  --jq 'map(select(.body|contains("'"$MARKER"'"))) | last | .id // empty' 2>/dev/null || true)
          [ -z "$cid" ] && { echo "No counter comment found; nothing to refund."; exit 0; }
          body="$MARKER
          🤖 auto CI-fix attempts: $prev (cap $CAP). (one attempt refunded — the fix agent crashed before starting: infrastructure, not the fix)"
          gh api -X PATCH "repos/$REPO/issues/comments/$cid" -f body="$body" --silent || true
          echo "Refunded attempt $ATTEMPT -> $prev."

      - name: Upload execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-auto-execution-output
          path: /home/runner/work/_temp/claude-execution-output.json
          if-no-files-found: ignore
