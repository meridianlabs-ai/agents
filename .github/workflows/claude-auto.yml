name: Claude Auto (reusable)

# @auto Phase 1: the CI-failure -> fix loop. A caller stub triggers this on
# `workflow_run` (completed) of the repo's CI workflow(s). When CI fails on a PR
# that carries the `auto` label, this wakes the dev agent with the failing run
# to commit a fix; a trusted landing job then pushes that commit as the machine
# account (marvin's push re-runs CI, closing the loop) and posts the re-review
# request. Bounded by fix_attempt_cap: at the cap it drops the `auto` label
# (the kill-switch) and pings a human. See design/auto-agent.md.
#
# Why workflow_run, not check_suite: check_suite/check_run events are NOT
# delivered when the check suite was created by GitHub Actions (GitHub's
# recursion guard), so they never fire for Actions-based CI. workflow_run is the
# supported way to react to a workflow completing — at the cost of the caller
# naming its CI workflow(s) in on.workflow_run.workflows.
#
# The `auto` label is the authorization gate (a write-access human opts a PR in,
# and removing it halts the loop), NOT authorship — a human may label their own
# PR. The gate verifies WHO applied it (issue #92): the most recent labeler
# must be the machine account or an account with write access, else the label
# is removed and no round runs. The machine-account login otherwise only
# matters for attribution in later phases.
#
# WHICH PR a failed run is for is established here, not taken from the caller
# (Claude Security finding 4628657, qualified 2026-09-21): the stub forwards
# `workflow_run.pull_requests[0].number`, and GitHub documents that list as
# the open PRs matching the run's head, which "do not necessarily indicate
# pull requests that triggered the run" — two PRs from one branch into
# different bases share a head SHA and both appear, in no specified order,
# and the one left after the other closes is not thereby the origin. So the
# gate's first step (the shared bind-ci-run composite) reads the run back
# from the API, requires it to be this repo's own pull_request run on the
# forwarded branch with its latest attempt the one that failed, and binds it
# to the ONE same-repo PR from that branch that was open when the run was
# created, at the run's head SHA — none or several refuse, and a caller
# number that disagrees refuses. Only then does the label gate look at the
# PR. The land job derives the same context again before pushing. What this
# cannot do, and does not claim: name the triggering PR when two shared the
# branch (nothing GitHub exposes tells their runs apart; the merge commit a
# PR run tested is not in the API), or authorize an actor — the label check
# and the model actions' own actor checks stay what they are.
#
# Three jobs (design/architecture.md → Landing job; issue #82, the first loop
# conversion after the reviewer's in #81): `gate` resolves the PR, enforces
# the label gate and the attempt cap, and does the pre-agent marvin writes
# (stage → Agent, the attempt counter, or the escalation hand-off) — no
# checkout; `fix` checks out the PR branch and runs the agent with the JOB
# TOKEN ONLY, commits locally, never pushes or posts, and ends by packaging
# its commits and everything the land job should post into the landing
# manifest (emit-landing); `land` — a fresh runner, no checkout — pushes the
# commits as marvin (which re-runs CI), posts the codex summary / the
# provenance note / the error report, posts exactly `@review` when a commit
# landed, moves the stage, and refunds the attempt when the agent never ran.
# The machine account's token (the app token `gate` and `land` mint) is
# named in those two jobs and nowhere else: a process the
# agent left running, or a PATH/ENV edit it made through $GITHUB_PATH /
# $GITHUB_ENV, can observe later steps of its own job but not another job
# (Claude Security finding 4122321).

on:
  workflow_call:
    inputs:
      head_branch:
        description: >-
          PR head branch whose CI failed (from workflow_run.head_branch). The
          gate's bind step requires it to be the run's own head branch as the
          API reports it.
        required: true
        type: string
      pr_number:
        description: >-
          PR number (from workflow_run.pull_requests[0].number). NOT the
          run's trigger identity: GitHub's list is an association (the open
          PRs matching the head), so the gate binds the run to its PR itself
          (bind-ci-run: the one same-repo PR from head_branch open when the
          run was created, at the run's head SHA) and requires this number to
          agree — a disagreement, or several candidates, skips with the
          reason. It is also the key of the concurrency group shared with
          claude-auto-review.yml (both serialize per PR), which is why it is
          an input and not derived. Viewed by number, never resolved from the
          branch name (Claude Security finding 4122320). Empty when CI ran on
          a non-PR branch, which the gate skips.
        required: false
        type: string
        default: ""
      ci_run_id:
        description: >-
          The failed CI run id (from workflow_run.id), so the agent can read
          its failing logs. The gate's bind step requires it to be the run
          this workflow_run event completed and reads the run back from the
          API; the reusable workflow acts on no other run.
        required: true
        type: string
      auto_label:
        description: Label that opts a PR into the loop and acts as the kill-switch.
        required: false
        type: string
        default: "auto"
      fix_attempt_cap:
        description: >-
          Max consecutive CI-fix attempts before escalating to a human. Distinct
          from the review-round cap; an unfixable failure would otherwise loop
          forever (marvin's PAT pushes keep re-triggering CI).
        required: false
        type: number
        default: 3
      model:
        required: false
        type: string
        default: "fable"
      fallback_model:
        required: false
        type: string
        default: "default"
      codex_model:
        description: >-
          Model for the codex engine (design/codex-engine.md). Empty (the
          default) omits --model so the run uses the codex CLI's own default,
          which tracks OpenAI's current flagship without edits here (decision:
          Ransom, 2026-09-08; previously pinned gpt-5.6-sol). Set to pin.
        required: false
        type: string
        default: ""
      codex_effort:
        description: >-
          Reasoning effort for codex implementation runs
          (low|medium|high|xhigh|max). Runs at high — reviews run at xhigh
          (decision: Ransom, 2026-09-08). Empty falls back to the codex CLI
          default.
        required: false
        type: string
        default: "high"
      codex_provision:
        description: >-
          The caller's provisioning recipe for CODEX runs (bash), run as the
          unprivileged codex user in the checkout after the codex user
          exists and before codex starts — the codex-run counterpart of the
          repository's `.github/actions/claude-setup` action, which the codex
          job never runs (a composite action can only run as the runner, and
          nothing from the checkout may run as the runner in that job:
          Claude Security finding 4628446). Empty (the default) runs the
          generic recipe — `uv venv` and `uv pip install -e .[dev]`
          (`--group dev` when the project declares one) — where the checkout
          has a pyproject.toml. Set it to keep what the repository's
          claude-setup does: a Python pin (`uv venv --python 3.11`), a
          lockfile sync (`uv sync --dev`), Node tooling (`corepack enable
          --install-directory ~/.local/bin && pnpm install
          --frozen-lockfile`). The recipe runs with uv bootstrapped on PATH
          and network on; it has no sudo, HOME is /home/codex, PATH is
          sudo's default plus ~/.local/bin, and it must create the project's
          `.venv` for the prompts' tool discovery (which also looks in
          `node_modules/.bin` and ~/.local/bin). It runs under `bash
          --noprofile --norc -eo pipefail`, like a `shell: bash` step: a
          failing command fails provisioning (handle an expected failure
          with `|| true`). A recipe runs whether or not the checkout has a
          pyproject.toml — only the generic recipe needs one. It comes from
          the caller's workflow file, so it is trusted like every other input
          here; keep it free of anything derived from the run's event.
        required: false
        type: string
        default: ""
      append_system_prompt:
        description: >-
          Repo-specific guidance (e.g. the fork's branch/CHANGELOG rules), same
          channel as claude.yml. Empty by default.
        required: false
        type: string
        default: ""
      branch_sync_append:
        description: >-
          Caller-specific merge guidance, same channel as claude.yml's input of
          the same name: reaches the agent on BOTH engines whenever "Sync
          branch with base" merged this run — appended to the conflict note
          when the merge is handed to the agent, and spliced behind a "a
          workflow step already merged; review the result" lead-in when the
          runner merged cleanly. Clean merges are the case that motivated it
          (git auto-merges a CHANGELOG without conflict and lands the entry
          under the wrong heading — the fork's append checks for that). Empty
          by default. Keep it a single line — the Claude-path prompt travels
          as one output line, so newlines are flattened.
        required: false
        type: string
        default: ""
      anchor_repo:
        description: >-
          Repo whose issues this repo's claude/issue-N-* branch numbers
          reference when the same-named branch also exists there (the
          companion convention). Used only for @-mention derivation.
        required: false
        type: string
        default: ""
      settings:
        description: >-
          Claude Code settings JSON. Keep in sync with claude.yml's default —
          the fix agent needs the same edit + verify-loop + git/gh allow-list,
          MINUS `Bash(git push:*)`: the fix agent commits locally and the land
          job pushes (issue #82). The "Compose fix settings" step strips that
          rule from whatever a caller passes here (a JSON object, or the
          action's other documented form, a path to a settings file) and
          adds it (plus the gh comment/review/create verbs) to a `deny` list,
          so a caller's settings cannot re-enable the direct push and posting
          commands.
        required: false
        type: string
        default: >-
          {"permissions":{"allow":["Read","Edit","Write",
          "Bash(pytest:*)","Bash(ruff:*)","Bash(mypy:*)","Bash(pyright:*)","Bash(pip:*)",
          "Bash(pip3:*)","Bash(uv:*)","Bash(python:*)","Bash(python3:*)",
          "Bash(gh:*)",
          "Bash(git fetch:*)","Bash(git merge:*)","Bash(git rebase:*)",
          "Bash(git checkout:*)","Bash(git switch:*)",
          "Bash(git branch:*)","Bash(git status:*)","Bash(git log:*)",
          "Bash(git diff:*)","Bash(git show:*)","Bash(git rev-parse:*)",
          "Bash(git remote:*)",
          "Bash(git add:*)","Bash(git commit:*)","Bash(git config:*)"]}}
    secrets:
      MARVIN_APP_CLIENT_ID:
        description: >-
          Client ID of the machine account's GitHub App (`meridian-marvin`,
          bot login `meridian-marvin[bot]`; Phase 2 of the credential
          separation, design/architecture.md → Landing job). With
          MARVIN_APP_PRIVATE_KEY it is the machine account's only credential
          (the PAT was retired 2026-09-18), consumed ONLY by
          the `gate` job (the PR lookup, the attempt counter, stage → Agent,
          the escalation hand-off) and the `land` job (the push of the
          agent's commits — it must come from a real identity so the re-run
          of CI actually fires; a GITHUB_TOKEN push wouldn't — recursion
          guard — plus the `@review` hand-back, the codex summary, the stage
          move and the attempt refund); each mints a one-hour installation
          token scoped to this repository and to the permissions that job's
          writes need, revoked when the job ends, and every push, comment,
          label and board move runs as the bot. NEVER present in the `fix`
          job, where the PR's code runs. Without the two secrets the loop
          can't function, so the gate fails at its mint step. Pass it
          explicitly by name in the stub's `secrets:` map, never
          `secrets: inherit`.
        required: false
      MARVIN_APP_PRIVATE_KEY:
        description: >-
          Private key (PEM) of the GitHub App named by MARVIN_APP_CLIENT_ID;
          read ONLY by the mint steps of the `gate` and `land` jobs. Needed
          together with it (see MARVIN_APP_CLIENT_ID).
        required: false
      OPENAI_API_KEY:
        description: >-
          OpenAI API key for the codex engine (design/codex-engine.md); used
          only by CI-fix rounds on PRs labeled engine:codex.
        required: false

# The identity every author check in this file trusts: the machine account,
# under both of its logins — the User `i-am-marvin` (the PAT, today) and the
# GitHub App's `meridian-marvin[bot]` (Phase 2: the app's tokens push and
# post as the bot; its collaborator permission reads `none`, so it is trusted
# by login only, before the `[bot]` refusal below). The User leaves this ONE
# value when the PAT is retired; no trust decision below names a login
# itself. Comma-separated. `github-actions[bot]` never belongs here: any
# repository's workflow run posts as it. (Handoff: ~/Documents/security/
# remaining-security-work.md → section 3; the same value, by the same name,
# is being introduced in the sibling workflows.)
env:
  TRUSTED_LOGINS: i-am-marvin,meridian-marvin[bot]

jobs:
  # TRUSTED, first: the PR lookup, the `auto`-label gate, the attempt cap and
  # every marvin write that must happen BEFORE the agent runs — stage → Agent,
  # the attempt counter, or the escalation (disarm, reset, hand-off). Checks
  # out nothing: every value it emits is computed from the API before any PR
  # code ran, which is what makes its outputs the trusted context the other
  # two jobs run on (`pr` pins the landing manifest to this PR).
  gate:
    runs-on: ubuntu-latest
    # Serialize per PR branch so the attempt counter's read-modify-write can't
    # race: overlapping runs (a human push mid-fix, multiple named CI workflows,
    # a re-run) would otherwise both read the same count and slip past the cap,
    # defeating the kill-switch. The same group is on the `fix` job (so two
    # agents never work the same branch at once) and on claude-auto-review.yml
    # (so the CI-fixer and the review-fixer never overlap). cancel-in-progress:
    # false lets an in-flight fix finish and queues the next. The `land` job
    # is deliberately NOT in the group: ordering inside a group is arbitrary
    # and at most one job pends, so a landing that had to wait behind the
    # next run's gate could be cancelled as the older pending job and the
    # agent's commits lost with it. The land composite's own non-fast-forward
    # guard covers the residual overlap (a landing pushing while the next
    # run's agent already checked out): the later push is refused loudly and
    # reported, never forced. The same arbitrary ordering has a second,
    # accepted consequence (review round 7): when gate N finishes while gate
    # N+1 already pends, fix N joins the group and one of the two pending
    # jobs is cancelled — if it is gate N+1, that run vanishes silently
    # (`Surface gate failure` keys on failure, not cancelled, and its land
    # job is skipped by the gate-success gate). Callers with several named
    # CI workflows hit this when two workflow_run completions for one PR
    # land close together; it only costs a round when fix N lands NOTHING
    # (no push, so no CI re-run re-fires the loop) — a landed fix re-runs
    # CI on the new tip and the loop resumes, and a human push resumes it
    # otherwise.
    concurrency:
      group: claude-auto-${{ github.repository }}-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write    # job-token fallbacks of the counter/hand-off posts
      issues: write
    outputs:
      act: ${{ steps.gate.outputs.act }}
      pr: ${{ steps.gate.outputs.pr }}
      engine: ${{ steps.gate.outputs.engine }}
      attempt: ${{ steps.gate.outputs.attempt }}
      mention: ${{ steps.who.outputs.mention }}
      # The run's context the bind step established (trusted: read from the
      # API before any PR code ran): the fix job requires its checkout to be
      # at `head_sha` (the head the run tested), and the land job derives
      # the same context again and requires PR, head SHA, base ref and
      # attempt to be reproduced before it pushes; `base_sha` is the base
      # tip the sync must merge (not reproduced at landing: the base may
      # advance after the merge).
      head_sha: ${{ steps.bind.outputs.head_sha }}
      base_ref: ${{ steps.bind.outputs.base_ref }}
      base_sha: ${{ steps.bind.outputs.base_sha }}
      run_attempt: ${{ steps.bind.outputs.run_attempt }}
      # The identity the fix job's runner-side commits carry (the base
      # merge, the codex commit): the bot's when this job minted an app
      # token — so the commit author and the land job's pusher agree; the
      # User's is sync-branch's default, unreachable now that the gate
      # fails when it did not mint. Decided here, where the minting
      # happened; the fix job only reads these two strings.
      git_user_name: ${{ steps.mint.outcome == 'success' && 'meridian-marvin[bot]' || 'i-am-marvin' }}
      git_user_email: ${{ steps.mint.outcome == 'success' && '330132053+meridian-marvin[bot]@users.noreply.github.com' || 'i-am-marvin@users.noreply.github.com' }}
    steps:
      # The machine account's token for this job (Phase 2, design/
      # architecture.md → Landing job): a one-hour installation token of the
      # GitHub App, minted from the caller's app secrets and
      # scoped to THIS repository and to what this job writes — the attempt
      # counter, the escalation hand-off and the gate-failure note (issues),
      # the `auto` label's removal on escalation or an outsider's label
      # (pull requests), the stage moves (the org's Atlas project); the PR
      # and timeline reads are covered by the same permissions. The
      # responsible-human derivation also READS the anchor repo (a public
      # one — the inspect_ai fork — in every deployment; best-effort, empty
      # on failure). Revoked when the job ends. Every later step reads
      # `steps.mint.outputs.token`. Unconditional: the loop cannot work
      # without the machine account, so a caller without the app secrets
      # fails here, first and loudly (the PAT was retired 2026-09-18; the
      # gate used to skip with a log line when it was absent).
      - name: Mint the machine account's token
        id: mint
        uses: actions/create-github-app-token@v2
        with:
          # `app-id` accepts the App ID or the Client ID; v2 has no client-id input.
          app-id: ${{ secrets.MARVIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
          owner: meridianlabs-ai
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write
          permission-organization-projects: write
          # The bind step reads the failed run back (`actions/runs/<id>`):
          # a permission of its own, which pull requests does not imply —
          # only a public caller would answer the read without it.
          permission-actions: read
          # ...and the base branch's tip (`branches/<base>`, the commit the
          # sync is pinned to), which needs contents: read on a private
          # caller (the review-fix gate documents the same read).
          permission-contents: read

      # The gate is four steps (deterministic, in shell — it decides whether
      # the agent runs): bind the failed run to its PR (shared composite,
      # below); resolve that PR and enforce the `auto`-label check; verify
      # who applied the label (shared composite); then compute the attempt
      # count and decide. Decide: skip (unbound run / no PR / not labeled /
      # unverified or outsider labeler), escalate (over cap), or fix. The
      # counter increments BEFORE the agent runs, so an agent that crashes
      # still consumes an attempt rather than looping forever — and it is
      # computed only AFTER the binding and the labeler check pass, so a run
      # that is not this PR's, or an outsider's label, never burns attempts.
      # Downstream steps read every gate output (`act`, `pr`, `engine`,
      # `attempt`, `cid`) from the LAST step, which re-emits the resolve
      # step's, so the split is invisible to them.
      #
      # Bind first (finding 4628657; the composite's description carries the
      # rule and its limits): the run is `inputs.ci_run_id`, which must be
      # this workflow_run event's own run; it is read back from the API and
      # must be this repo's pull_request run on `inputs.head_branch` whose
      # latest attempt is the one that just failed; its actors (who started
      # it, who re-ran it) must be TRUSTED_LOGINS or write-access accounts
      # (the engines' own actor rule, decided here before any write instead
      # of after the counter and the base merge); and it binds to the one
      # same-repo PR from that branch open when it was created, at the run's
      # head SHA, with no retarget on its timeline since, which must be the
      # PR `inputs.pr_number` names. Anything else refuses with a reason the
      # resolve step logs — no counter, escalation, stage, sync or model work
      # follows. A persistent API failure fails this step,
      # which the gate-failure failsafe surfaces (in the log only: with no
      # bound PR there is no PR the note may be posted on).
      - name: Bind the failed run to its PR
        id: bind
        uses: meridianlabs-ai/agents/.github/actions/bind-ci-run@main
        with:
          token: ${{ steps.mint.outputs.token }}
          repo: ${{ github.repository }}
          run-id: ${{ inputs.ci_run_id }}
          event-name: ${{ github.event_name }}
          event-run-id: ${{ github.event.workflow_run.id }}
          event-run-attempt: ${{ github.event.workflow_run.run_attempt }}
          expect-head-branch: ${{ inputs.head_branch }}
          expect-pr: ${{ inputs.pr_number }}
          trusted-logins: ${{ env.TRUSTED_LOGINS }}

      - name: Resolve PR and check the auto label
        id: resolve
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD: ${{ inputs.head_branch }}
          # The BOUND PR (empty when the bind step refused), not the caller's
          # number: the bind step required the two to agree.
          PR_NUMBER: ${{ steps.bind.outputs.pr }}
          BIND_OK: ${{ steps.bind.outputs.ok }}
          BIND_REASON: ${{ steps.bind.outputs.reason }}
          AUTO_LABEL: ${{ inputs.auto_label }}
        run: |
          set -euo pipefail
          # `act` here is skip or verify (proceed to the labeler check); the
          # final act (skip/fix/escalate) is the Gate and count step's.
          act() { echo "act=$1" >>"$GITHUB_OUTPUT"; }
          # An unbound run is skipped before any PR read: the bind step's
          # reason says which check refused (no PR, a foreign or stale run,
          # several PRs sharing the branch, a caller number that disagrees).
          if [ "$BIND_OK" != "1" ]; then
            echo "${BIND_REASON:-the run could not be bound to a PR (no reason recorded)}"
            act skip; exit 0
          fi
          # Retry a gh call on transient failure. A 5xx / secondary rate limit
          # returns an HTML error page, which `gh --jq` then rejects with
          # "invalid character '<'"; under `set -e` an unguarded call like that
          # aborts the gate BEFORE it decides fix/escalate, so no fix and no
          # escalation ever post and the loop silently stalls (see
          # design/auto-agent.md). Retry with backoff; a persistent failure
          # still returns non-zero so the gate-failure failsafe below surfaces
          # it instead of dying quietly. Each attempt's stdout is captured
          # and emitted only on overall success: a failed `gh api` prints the
          # HTTP error body to STDOUT, so streaming attempts through would
          # prefix a fail-then-succeed retry's real output with error bodies
          # — poisoning every $(ghr …) capture in exactly the case the retry
          # exists for. (Same ghr as claude-auto-review.yml's gate.)
          ghr() {
            local n=0 out
            until out=$("$@"); do
              n=$((n+1))
              if [ "$n" -ge 4 ]; then return 1; fi
              sleep $((n*3))
            done
            printf '%s' "$out"
          }
          # The PR is the one the bind step bound the run to (it required the
          # caller's inputs.pr_number, from workflow_run.pull_requests[0].number,
          # to agree), viewed by NUMBER and checked against the run again —
          # never found by branch name (Claude Security finding 4122320): `gh
          # pr list --head` matches the ref name in ANY head repository, newest
          # first, so a fork PR whose branch was named like an open same-repo
          # PR was the one resolved — its labels decided whether a round ran,
          # and the round's counter, comments, label removal and board moves
          # landed on it while the fix was pushed to the same-repo branch.
          # (The bind step's own listing is a REST `pulls?head=owner:branch`
          # ENUMERATION filtered to this repository's heads, used to prove no
          # other PR can be the origin — not a lookup that picks one.) Each
          # check that fails skips with its reason; there is deliberately no
          # fallback to a branch listing.
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "No PR number from the triggering run (pr_number='$PR_NUMBER': CI ran on a non-PR branch, or the run named no PR); nothing to do."
            act skip; exit 0
          fi
          pr=$(ghr gh pr view "$PR_NUMBER" --repo "$REPO" \
                 --json number,state,isCrossRepository,headRefName,labels)
          state=$(jq -r '.state' <<<"$pr")
          if [ "$state" != "OPEN" ]; then
            echo "PR #$PR_NUMBER is $state, not open; nothing to do."; act skip; exit 0
          fi
          if [ "$(jq -r '.isCrossRepository' <<<"$pr")" != "false" ]; then
            echo "PR #$PR_NUMBER's head is in a fork; the CI-fix loop works same-repo PRs only. Skipping."
            act skip; exit 0
          fi
          head_ref=$(jq -r '.headRefName' <<<"$pr")
          if [ "$head_ref" != "$HEAD" ]; then
            echo "PR #$PR_NUMBER's head branch is '$head_ref' but the failed CI run's is '$HEAD'; skipping."
            act skip; exit 0
          fi
          number=$(jq -r '.number' <<<"$pr")
          echo "pr=$number" >>"$GITHUB_OUTPUT"
          # Engine selection (design/codex-engine.md): the PR's engine:codex
          # label routes fix rounds to Codex.
          echo "engine=$(jq -r 'if any(.labels[]; .name=="engine:codex") then "codex" else "claude" end' <<<"$pr")" >>"$GITHUB_OUTPUT"
          if [ "$(jq -r --arg l "$AUTO_LABEL" 'any(.labels[]; .name==$l)' <<<"$pr")" != "true" ]; then
            echo "PR #$number is not @auto-labeled; skipping."; act skip; exit 0
          fi
          act verify

      # Who applied the label (issue #92): the most recent `labeled` event
      # must come from marvin or a write-access account. An outsider's label
      # is removed (as marvin) and noted on the PR; no evidence (no event,
      # an App labeler, a failed lookup) refuses without disarming and posts
      # a one-time notice. Shared composite with claude-auto-review.yml —
      # the verdicts and the PR-facing text live there. Runs under the
      # machine account's token (the resolve step already required it). A persistent
      # timeline fetch failure FAILS this step, which the gate-failure
      # failsafe below surfaces like a crash of the other two.
      - name: Verify who applied the auto label
        id: labeler
        if: steps.resolve.outputs.act == 'verify'
        uses: meridianlabs-ai/agents/.github/actions/verify-auto-labeler@main
        with:
          token: ${{ steps.mint.outputs.token }}
          repo: ${{ github.repository }}
          pr: ${{ steps.resolve.outputs.pr }}
          label: ${{ inputs.auto_label }}
          trusted-logins: ${{ env.TRUSTED_LOGINS }}

      - name: Gate and count
        id: gate
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.resolve.outputs.pr }}
          ENGINE: ${{ steps.resolve.outputs.engine }}
          RESOLVED: ${{ steps.resolve.outputs.act }}
          LABELER_VERDICT: ${{ steps.labeler.outputs.verdict }}
          CAP: ${{ inputs.fix_attempt_cap }}
          MARKER: "<!-- auto-fix-attempts -->"
        run: |
          set -euo pipefail
          act() { echo "act=$1" >>"$GITHUB_OUTPUT"; }
          # Same ghr as the resolve step (and claude-auto-review.yml's gate).
          ghr() {
            local n=0 out
            until out=$("$@"); do
              n=$((n+1))
              if [ "$n" -ge 4 ]; then return 1; fi
              sleep $((n*3))
            done
            printf '%s' "$out"
          }
          # Re-emit the resolve step's outputs so every downstream step keeps
          # reading `steps.gate.outputs.pr` / `.engine` (empty when no PR).
          echo "pr=$PR" >>"$GITHUB_OUTPUT"
          echo "engine=$ENGINE" >>"$GITHUB_OUTPUT"
          if [ "$RESOLVED" != "verify" ]; then act skip; exit 0; fi
          if [ "$LABELER_VERDICT" != "ok" ]; then
            echo "Labeler check on PR #$PR: ${LABELER_VERDICT:-no verdict}; skipping."; act skip; exit 0
          fi
          number="$PR"
          # Attempt counter: a single sticky marker comment we own — so only a
          # comment from a TRUSTED author is the counter (Claude Security
          # finding 4121987): the newest marker comment by one of
          # TRUSTED_LOGINS (the loop's own), else the newest by an account
          # with write access (a maintainer's hand-written count); a marker
          # from any other login is ignored and never PATCHed. Before this the
          # LAST marker comment by ANY author was the counter, so any commenter
          # on a public caller could reset the cap (unbounded rounds) or force
          # an escalation (the label removed as marvin), and their comment
          # became the one the loop edited. The land job's refund step reads
          # the counter the same way; keep the two helpers identical.
          # `--paginate --jq` runs per page, so the pages are slurped and
          # flattened locally (as verify-auto-labeler does).
          cands=$(ghr gh api "repos/$REPO/issues/$number/comments?per_page=100" --paginate \
                    | jq -cs --arg m "$MARKER" '[.[][] | select(.body|contains($m)) | {id, login: (.user.login // ""), body}]')
          # trusted_author LOGIN: true when LOGIN is one of TRUSTED_LOGINS or
          # holds admin/maintain/write (the collaborators endpoint's base
          # permission, looked up once per login per run — the cache is a
          # `|login=perm|` list, not an associative array, so the tests can
          # run it under bash 3). A failed lookup is untrusted (fail closed);
          # a GitHub App (`*[bot]`, github-actions[bot] included) is never
          # looked up: the endpoint 404s for Apps, and any repository's
          # workflow run posts as github-actions[bot].
          perms=""
          trusted_author() {
            local login="$1" perm
            [ -n "$login" ] || return 1
            case ",${TRUSTED_LOGINS// /}," in *",$login,"*) return 0 ;; esac
            case "$login" in *"[bot]") return 1 ;; esac
            case "$perms" in
              *"|$login="*) perm=${perms##*"|$login="}; perm=${perm%%"|"*} ;;
              *) perm=$(ghr gh api "repos/$REPO/collaborators/$login/permission" --jq '.permission') || perm=""
                 perms="$perms|$login=$perm|" ;;
            esac
            case "$perm" in admin|maintain|write) return 0 ;; *) return 1 ;; esac
          }
          # parse_attempts BODY: prints the count, in decimal, when BODY carries
          # exactly one `attempts:` whose following token is one to nine digits
          # (the generated `attempts: N (cap C).`), else nothing — a reset body
          # has no count; a doubled one, a token with any other character
          # (`3junk`) or an oversized one is not believed. Nine digits keeps
          # the arithmetic in range, and `10#` reads a leading zero as decimal
          # (bash would otherwise take `08` as octal and abort the gate).
          parse_attempts() {
            local n
            [ "$(printf '%s' "$1" | grep -o 'attempts:' | wc -l | tr -d ' ')" = 1 ] || return 0
            n=$(printf '%s' "$1" | sed -n 's/.*attempts:[[:space:]]*\([^[:space:]]*\).*/\1/p')
            [[ "$n" =~ ^[0-9]{1,9}$ ]] && printf '%s' "$((10#$n))"
            return 0
          }
          # The loop's own comment first (no lookups when one exists), else
          # the newest by a write-access account.
          cid=$(jq -r --arg t "${TRUSTED_LOGINS// /}" '($t | split(",")) as $tl
                  | map(select(.login as $l | any($tl[]; . == $l))) | last | .id // empty' <<<"$cands")
          if [ -z "$cid" ]; then
            while IFS=$'\t' read -r id login; do
              [ -n "$id" ] || continue
              if trusted_author "$login"; then cid="$id"; break; fi
            done < <(jq -r 'reverse | .[] | [.id, .login] | @tsv' <<<"$cands")
          fi
          prev=0
          if [ -n "$cid" ]; then
            cauthor=$(jq -r --argjson id "$cid" 'map(select(.id == $id)) | first | .login' <<<"$cands")
            n=$(parse_attempts "$(jq -r --argjson id "$cid" 'map(select(.id == $id)) | first | .body' <<<"$cands")")
            if [ -n "$n" ]; then
              prev=$n
            else
              echo "Counter comment $cid by $cauthor carries no single valid 'attempts: N' (one to nine digits); counting from 0."
            fi
            echo "Counter: comment $cid by $cauthor reads attempts=$prev."
          else
            echo "No counter comment from a trusted author on PR #$number; counting from 0."
          fi
          jq -r --arg cid "$cid" '.[] | select((.id|tostring) != $cid)
            | "Ignored marker comment \(.id) by \(.login): not the counter (only a comment by the loop itself, else by a write-access account, counts)."' <<<"$cands"
          next=$((prev + 1))
          echo "attempt=$next" >>"$GITHUB_OUTPUT"
          echo "cid=$cid" >>"$GITHUB_OUTPUT"
          if [ "$next" -gt "$CAP" ]; then act escalate; else act fix; fi

      # Failsafe: if any of the four gate steps errored (e.g. a transient API
      # failure the retries above couldn't ride out), `act` was never set, so
      # every step below skips and nothing reaches the PR — the loop would
      # stall silently with the label still on. Surface it so a human knows
      # to resume. Kept trigger-free ON PURPOSE: the body must not contain a
      # literal @auto or @review, or this comment would re-fire the loop (see
      # design/auto-agent.md). Posted only on the PR the bind step BOUND the
      # run to, never on the caller's unverified number: a bind step that
      # errored has bound nothing, and the note then stays in the job log —
      # a run whose PR is unknown may not write to a PR of the caller's
      # choosing.
      - name: Surface gate failure
        if: >-
          always() &&
          (steps.bind.outcome == 'failure' || steps.resolve.outcome == 'failure' ||
           steps.labeler.outcome == 'failure' || steps.gate.outcome == 'failure')
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.bind.outputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          [ -z "${PR:-}" ] && { echo "No bound PR (the bind step refused or errored); the failure stays in this log."; exit 0; }
          gh issue comment "$PR" --repo "$REPO" --body "$(printf '⚠️ auto: the CI-fix run errored before it could act (a transient GitHub API failure in a gate step). The loop is paused, not stopped — the label is still on. Re-run the failed job (%s) or push a new commit to resume.' "$RUN_URL")" || true

      # Atlas tracking (design/atlas-tracking.md): a CI-fix round is the agent
      # working the PR's issue; an escalation hands it to a human. The PR
      # branch resolves to its issue via claude/issue-N-* (then a Fixes ref).
      # The move back to Review after a landed fix is the land job's (the
      # manifest's `stage`).
      - name: Stage - Agent
        if: steps.gate.outputs.act == 'fix'
        uses: meridianlabs-ai/agents/.github/actions/set-stage@main
        with:
          stage: Agent
          token: ${{ steps.mint.outputs.token }}
          repo: ${{ github.repository }}
          issue: ${{ steps.gate.outputs.pr }}
          branch: ${{ inputs.head_branch }}

      - name: Stage - Review (escalation)
        if: steps.gate.outputs.act == 'escalate'
        uses: meridianlabs-ai/agents/.github/actions/set-stage@main
        with:
          stage: Review
          token: ${{ steps.mint.outputs.token }}
          repo: ${{ github.repository }}
          issue: ${{ steps.gate.outputs.pr }}
          branch: ${{ inputs.head_branch }}

      # Over the cap: hand off to a human and disarm the loop. Three steps in
      # a fixed order — disarm, reset, hand off — each later one phrasing
      # itself on the earlier ones' outcomes (claude-auto-review.yml's
      # escalation mirrors this):
      #   1. Disarm: remove the label. This is the load-bearing part (it is
      #      also what a human does to stop @auto manually), so it goes first
      #      and nothing else is gated on anything but it.
      #   2. Reset the attempt counter — ONLY if the disarm succeeded. The
      #      counter is a per-PR-lifetime tally (green CI in between does not
      #      reset it), so without the reset the hand-off's "re-add the label
      #      to let me try again" was false: the next red CI read the
      #      exhausted counter and escalated again on sight, no fix attempted
      #      (inspect_flow#824, 2026-09-09: two of the three attempts had been
      #      burned by rounds that ran without a provisioned environment, and
      #      the third was 70 minutes and five green pushes earlier).
      #      Re-labeling is an explicit human decision; it buys a fresh
      #      budget. Gating on the disarm keeps a failed label removal
      #      self-limiting, as it was before the reset existed: the label
      #      stays on but the counter stays exhausted, so the next red CI
      #      re-escalates (and retries the removal) instead of running a
      #      fresh budget with no human decision.
      #   3. Hand off: the comment tells the truth about both — a failed reset
      #      leaves the exhausted counter in place, and promising a fresh
      #      budget then would be exactly the false "re-add it" the reset
      #      exists to fix; a failed disarm is the one case where "re-add it"
      #      is wrong because it was never removed. The post retries (shared
      #      post-pr-comment composite) and runs even if the disarm or reset
      #      STEP errored outright (!cancelled(), not the default success()):
      #      by this point the label may already be gone, so a skipped or
      #      transiently failed comment would leave the PR silently parked
      #      with nobody pinged and only a red job as the trace. Empty
      #      disarm/reset outputs (the step never wrote them) route to the
      #      conservative wording — "still armed", "could not reset".
      # The disarm and the reset are shared composites (AGENTS.md convention:
      # step bodies copied between the loops live in .github/actions/).
      - name: Disarm the loop (escalation)
        if: steps.gate.outputs.act == 'escalate'
        id: disarm
        uses: meridianlabs-ai/agents/.github/actions/disarm-auto-loop@main
        with:
          token: ${{ steps.mint.outputs.token }}
          repo: ${{ github.repository }}
          pr: ${{ steps.gate.outputs.pr }}
          label: ${{ inputs.auto_label }}

      # The reset targets the comment the gate COUNTED FROM (its `cid`), not
      # "the newest marker comment": the gate reads only a trusted author's
      # comment (finding 4121987), so a reset that picked the newest marker
      # by any author could rewrite an outsider's comment and leave the
      # loop's own exhausted, and re-adding the label would escalate again
      # on sight — the false "re-add it" the reset exists to fix. The shared
      # composite takes that id (`comment-id`; the review loop passes its
      # gate's the same way) and keeps `ok`'s meaning: 1 = reset, or nothing
      # to reset; 0 = the PATCH failed after retries.
      - name: Reset the attempt counter (escalation)
        if: steps.gate.outputs.act == 'escalate' && steps.disarm.outputs.disarmed == '1'
        id: reset
        uses: meridianlabs-ai/agents/.github/actions/reset-auto-counters@main
        with:
          token: ${{ steps.mint.outputs.token }}
          repo: ${{ github.repository }}
          pr: ${{ steps.gate.outputs.pr }}
          counters: attempts
          comment-id: ${{ steps.gate.outputs.cid }}
          trusted-logins: ${{ env.TRUSTED_LOGINS }}
          reason: "on escalation — re-adding `${{ inputs.auto_label }}` starts a fresh budget"

      # Trigger-free ON PURPOSE (like every bot-authored comment here): the
      # re-engagement path is described, never spelled as its literal trigger.
      - name: Compose the hand-off
        if: ${{ !cancelled() && steps.gate.outputs.act == 'escalate' }}
        id: handoff
        env:
          AUTO_LABEL: ${{ inputs.auto_label }}
          CAP: ${{ inputs.fix_attempt_cap }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.ci_run_id }}
          DISARMED: ${{ steps.disarm.outputs.disarmed }}
          RESET_OK: ${{ steps.reset.outputs.ok }}
        run: |
          set -euo pipefail
          if [ "$DISARMED" != "1" ]; then
            clause="I could not remove the \`$AUTO_LABEL\` label (API error), so the loop is still armed — but its attempt counter is exhausted, so I'll escalate again rather than run. Remove the label by hand to stop me; to let me try again with a fresh budget, re-engage me with an @-mention comment (that re-applies the label and resets both counters)."
          elif [ "$RESET_OK" = "1" ]; then
            clause="Removing the \`$AUTO_LABEL\` label. Re-add it to let me try again on the next red CI run — the attempt counter is reset, so that starts a fresh budget of $CAP."
          else
            clause="Removing the \`$AUTO_LABEL\` label. Re-add it to let me try again on the next red CI run — but I could not reset the attempt counter (API error), so first edit my sticky \"auto CI-fix attempts\" comment so the count reads 0, or re-engage me with an @-mention comment instead (that re-applies the label and resets both counters); otherwise I'll escalate again on sight."
          fi
          printf 'body=%s\n' "🤖 auto: I've hit the $CAP-attempt limit fixing CI and still can't get it green ([latest run]($RUN_URL)). Handing this to a human. $clause" >>"$GITHUB_OUTPUT"

      - name: Escalate to human
        if: ${{ !cancelled() && steps.gate.outputs.act == 'escalate' }}
        uses: meridianlabs-ai/agents/.github/actions/post-pr-comment@main
        with:
          token: ${{ steps.mint.outputs.token }}
          repo: ${{ github.repository }}
          pr: ${{ steps.gate.outputs.pr }}
          body: ${{ steps.handoff.outputs.body }}
          what: escalation hand-off
          failure-hint: >-
            The disarm (disarmed=${{ steps.disarm.outputs.disarmed || 'unknown' }})
            and reset (ok=${{ steps.reset.outputs.ok || 'skipped' }}) above have
            already run, so nobody was told.

      # Record the attempt (idempotent sticky comment) before invoking the
      # agent. Until the job split this ran AFTER the fix job's sync and
      # provisioning steps, so a sync or provisioning failure — which skips
      # the agent — never burned an attempt; it cannot follow them any more
      # (they run in the untrusted job, and this is a marvin write), so the
      # land job's refund step now covers that case too: an attempt whose
      # agent step did not succeed and whose landing pushed nothing is refunded,
      # whatever skipped it.
      - name: Record attempt
        if: steps.gate.outputs.act == 'fix'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.gate.outputs.pr }}
          CID: ${{ steps.gate.outputs.cid }}
          ATTEMPT: ${{ steps.gate.outputs.attempt }}
          CAP: ${{ inputs.fix_attempt_cap }}
          MARKER: "<!-- auto-fix-attempts -->"
        run: |
          set -euo pipefail
          body="$MARKER
          🤖 auto CI-fix attempts: $ATTEMPT (cap $CAP)."
          if [ -n "$CID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$CID" -f body="$body" --silent
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" --silent
          fi

      # @-mention target for the error report the land job may post: without
      # one, error reports on agent/marvin-authored PRs generate no email for
      # anyone. Closing ref → claude/issue-N-* branch → the issue's first
      # assignee (bots and the machine account skipped), else its non-bot
      # author — the same derivation as the other three workflows. Here in
      # the gate job, not the fix job, for two reasons: the companion-repo
      # branch check reads the ANCHOR repo, which the fix job's job token
      # cannot see when that repo is private (it would fall back to resolving
      # the number against this repo and cc the wrong person), and a value
      # computed before any PR code ran needs no shape check before it
      # reaches a marvin-posted body. Best-effort: exits 0 with an empty
      # mention on any lookup failure.
      - name: Derive responsible human for error cc
        id: who
        if: steps.gate.outputs.act == 'fix'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ steps.gate.outputs.pr }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
          ANCHOR_REPO: ${{ inputs.anchor_repo }}
        run: |
          set -uo pipefail
          mention=""
          ref=$(gh pr view "$NUM" --repo "$REPO" --json body --jq '.body // ""' 2>/dev/null \
                  | grep -ioE '(fixes|closes|resolves)[[:space:]]+([-A-Za-z0-9._]+/[-A-Za-z0-9._]+)?#[0-9]+' \
                  | head -1 || true)
          inum=""
          issue_repo="$REPO"
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          if [ -n "$ref" ]; then
            refrepo=$(printf '%s' "$ref" | grep -oiE '[-A-Za-z0-9._]+/[-A-Za-z0-9._]+' || true)
            if [ -z "$refrepo" ] || [ "$(lower "$refrepo")" = "$(lower "$REPO")" ]; then
              inum=$(printf '%s' "$ref" | sed -n 's/.*#\([0-9]\{1,\}\).*/\1/p')
            elif [ -n "${ANCHOR_REPO:-}" ] && [ "$(lower "$refrepo")" = "$(lower "$ANCHOR_REPO")" ]; then
              inum=$(printf '%s' "$ref" | sed -n 's/.*#\([0-9]\{1,\}\).*/\1/p')
              issue_repo="$ANCHOR_REPO"
            fi
          fi
          # Mention-only fallback: non-closing refs (deliberate "Refs ...#N")
          # or no ref — derive from the claude/issue-N-* branch convention.
          # On a companion repo the number references the anchor repo's
          # tracker, but only when the twin branch exists there.
          if [ -z "$inum" ]; then
            inum=$(printf '%s' "$HEAD_BRANCH" | sed -n 's/^claude\/issue-\([0-9]\{1,\}\)-.*/\1/p')
            if [ -n "$inum" ] && [ -n "${ANCHOR_REPO:-}" ] && \
               gh api "repos/$ANCHOR_REPO/branches/$HEAD_BRANCH" --silent >/dev/null 2>&1; then
              issue_repo="$ANCHOR_REPO"
            fi
          fi
          # First assignee that is neither a Bot nor the machine account,
          # else the author unless bot or machine account (marvin is a User,
          # not a Bot — triage issues are marvin-authored). Assignee first since
          # 2026-09-10: the assignee is the repo's "responsible human"
          # (Atlas views filter on assignee), and the reporter may be a
          # different person — inspect_ai#473's handoff pinged the issue's
          # author while the assignee had kicked off the run.
          [ -n "$inum" ] && mention=$(gh api "repos/$issue_repo/issues/$inum" 2>/dev/null \
            | jq -r --arg t "${TRUSTED_LOGINS// /}" '($t | split(",")) as $tl | if .pull_request then "" else (([(.assignees // [])[] | select(.type != "Bot" and (.login as $l | any($tl[]; . == $l) | not)) | .login] | first // "") as $a | if $a != "" then $a elif (.user.type=="Bot" or (.user.login as $l | any($tl[]; . == $l))) then "" else .user.login end) end' 2>/dev/null || true)
          echo "mention=$mention" >>"$GITHUB_OUTPUT"
          echo "cc target: ${mention:-none}"

  # UNTRUSTED: checks out the PR head, provisions, runs the agent. Names NO
  # GitHub-write secret — the machine account's token is absent (the
  # invariant at the top of this file); the codex engine's OPENAI_API_KEY is
  # named at its Run step
  # because codex must hold its own key, and the WIF inputs on the action
  # step are identifiers, not secrets (AGENTS.md). The agent commits locally
  # and never pushes or posts: the job token is read-only (permissions below),
  # the settings deny `git push` and the gh posting verbs, and everything
  # that must be pushed, posted or moved afterwards goes into the landing
  # manifest the last step uploads, for the `land` job to act on.
  fix:
    needs: gate
    if: needs.gate.outputs.act == 'fix' && needs.gate.outputs.engine != 'codex'
    runs-on: ubuntu-latest
    # Same group as the gate (rationale there): one agent per PR branch at a
    # time, and never alongside a review-fix round.
    concurrency:
      group: claude-auto-${{ github.repository }}-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read          # checkout, sync fetches; cannot push
      pull-requests: read     # the PR lookups; cannot comment
      issues: read
      id-token: write         # WIF auth (and the action's own App token)
      actions: read           # the failed CI run's logs
    outputs:
      # What the land job's refund step needs from this job: whether the
      # agent step ran to a result — the Claude step's outcome (`skipped` on
      # a run whose sync or provisioning failed before the agent started).
      # There is deliberately no "did the agent launch" output: nothing this
      # job can observe proves it — the action's `execution_file` output is
      # published by its own error handler from whatever file sits at the
      # default path, which the PR's provisioning step can pre-create (review
      # round 2 of finding 4628657's fix) — so a failed Claude step is
      # treated as a round that landed nothing, and refunded, whether or not
      # Claude ran. The codex job publishes the same output from its steps.
      agent_outcome: ${{ steps.claude.outcome }}
    steps:
      # Check out the PR branch so the agent fixes in place; the land job
      # pushes the result. persist-credentials:false (issue #61): checkout
      # otherwise writes its token into .git/config for the rest of the job —
      # and the codex job, which starts with this same checkout, group-grants
      # the whole workspace to the codex user. Nothing is persisted; every later git network call
      # authenticates itself (design/architecture.md → "No persisted git
      # credentials"): the runner-side steps through a step-scoped credential
      # helper on the job token, the agent through claude-code-action's own
      # origin-URL credential (its App token — the agent never pushes, so
      # the identity behind it no longer matters here). The fetch itself is a
      # read, so the job token is enough for it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_branch }}
          token: ${{ github.token }}
          persist-credentials: false

      # Regression guard for the invariant above (shared composite — one copy
      # for all three workflows): asks git, which follows includes, for the
      # header checkout would have persisted, keyed on the server URL.
      - name: Assert no credential persisted in the workspace
        uses: meridianlabs-ai/agents/.github/actions/assert-no-persisted-credential@main

      # Capture the branch tip before the agent runs: emit-landing's start-sha
      # (commits above it are the run's landable work), and what "Compose
      # landing manifest" compares HEAD against to decide whether a hand-back
      # is owed. Stamped BEFORE the base sync below, so a round whose only
      # product is the runner's base merge still counts as landable work.
      # rev-parse on its own line under -e, so a failure is this step's (not
      # echo's success with an empty sha); Surface agent errors reads the
      # outcome, and the emit step falls back to github.sha so the manifest
      # carrying that error still validates. The tip must be the head the
      # failed run TESTED (the gate's `head_sha`, from the run's API record):
      # the checkout is by branch name, so a push between the gate and this
      # step would put the agent on code the failing logs do not describe.
      # Then this step fails, nothing below runs, and the attempt is
      # refunded; the newer push's own run drives the next round.
      - name: Record base SHA
        id: base
        env:
          TESTED_SHA: ${{ needs.gate.outputs.head_sha }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          if [ "$sha" != "$TESTED_SHA" ]; then
            echo "::error::the checked-out tip $sha is not the head the failed run tested (${TESTED_SHA:-unknown}); the branch moved since the gate bound the run, so this round is for a stale run and does nothing."
            exit 1
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      # ---- Deterministic base-branch sync (design/architecture.md) ---------
      # The base merge happens HERE, on the runner, for BOTH engines (this
      # job and the codex job open the same way) — not in a prompt. The codex sandbox holds no credentials and is told not to fetch,
      # so it cannot be asked to merge (instruction, not structure, since its
      # sandbox gained network on 2026-09-09; the in-progress hand-off means it
      # never needs to), and a prompted merge is advisory, so branches drifted
      # anyway: inspect_ai#392 sat 11 commits behind main across 20 commits,
      # and because GitHub cannot compute a merge ref for a conflicted PR, CI
      # never ran and every fix round was written against stale code.
      #
      # A CONFLICTED merge is handed on differently per engine: the Claude path
      # gets a CLEAN index and re-merges inside the agent (it has network and
      # the git allow-list); codex gets the merge still IN PROGRESS and resolves
      # the markers in the tree, and its commit step refuses to proceed while
      # any survive. In claude.yml the split is forced — tag mode's setupBranch
      # runs `git checkout <branch> --`, which aborts on an unmerged index.
      # This workflow runs the action in agent mode (bare `prompt:`, no
      # track_progress), which does NOT run setupBranch, so the action would
      # tolerate an in-progress merge here. The split is mirrored anyway: one
      # mental model and one merge instruction across all three workflows (here
      # the inline merge_note in "Compose fix prompt"; claude.yml's is its
      # branch_sync_prompt input).
      #
      # The step body is the shared sync-branch composite (one copy for all
      # three workflows). checkout stays false: this job's actions/checkout
      # already put the PR head branch in the workspace (the gate handled
      # closed and fork PRs), and "Record base SHA" above stamped its
      # PRE-merge tip — which is what makes a merge-only round land (the
      # merge commit is above the start SHA, so the land job pushes it and
      # posts the re-review request; there is no separate backstop any more).
      # The job token: the composite only reads (a PR lookup and fetches),
      # and it is what its step-scoped git credential is built from.
      - name: Sync branch with base
        id: sync
        uses: meridianlabs-ai/agents/.github/actions/sync-branch@main
        with:
          pr: ${{ needs.gate.outputs.pr }}
          engine: ${{ needs.gate.outputs.engine }}
          token: ${{ github.token }}
          # The base the gate's bind step established the run tested (the
          # PR's base, with no retarget since the run was created): the
          # composite refuses to merge anything else, so a PR retargeted
          # between the gate and this step fails the sync (the agent is
          # skipped, the attempt refunded) instead of merging a base the
          # failing logs never saw.
          base: ${{ needs.gate.outputs.base_ref }}
          # ...and the base TIP the gate read: the fetched origin/<base> must
          # be exactly it, so the base cannot move between the gate's read
          # and the merge (it may have moved between the run and the gate:
          # the loop targets the base as it is).
          base-sha: ${{ needs.gate.outputs.base_sha }}
          # The merge commit's author: the gate decided it from which token
          # it minted (bot on the app path, User on the PAT).
          user-name: ${{ needs.gate.outputs.git_user_name }}
          user-email: ${{ needs.gate.outputs.git_user_email }}

      # Provision the project environment BEFORE the fix agent starts, so its
      # pytest/ruff/pyright actually run — the same two steps the reviewer
      # has (claude-review.yml; rationale there and in design/architecture.md
      # → "Provisioning the environment for the verify loop"). Until
      # 2026-09-09 the loops had neither, and the
      # gap was invisible on the Claude engine, which installs what it needs
      # from inside the agent, but total on codex, whose sandbox had NO
      # network until 2026-09-09: every codex fix round ran in a bare
      # checkout — "No module named inspect_ai / pytest / ruff / pyright" —
      # pushed changes verified only by whatever tests import nothing, and
      # finally declined to fix at all (inspect_flow#824, 2026-09-09). Placed
      # after the base sync (so a dependency file the merge touched is what
      # gets installed). A provisioning failure SKIPS the agent; the attempt
      # the gate already recorded is refunded by the land job (the agent
      # never launched and nothing lands), and the Surface step reports it.
      # Fatal on failure, like the reviewer's: a broken setup must be loud,
      # not a silent static-only fix round (the Claude path aborts a
      # conflicted base merge and re-merges inside the agent, so the codex
      # job's conflicted-round tolerance has no counterpart here). Claude
      # engine only: this job runs the caller's composite (and the fallback
      # below) as the runner, which is exactly how the Claude agent itself
      # runs — unsandboxed, as the runner, over a same-repo tree whose tests
      # it then executes — so code from the tree gains nothing here it does
      # not already have once the agent starts; and this job names no
      # OPENAI_API_KEY (Claude Security finding 4629153: the key is the
      # codex job's alone). The codex job provisions differently: the shared
      # fallback recipe, run as the unprivileged codex user AFTER the codex
      # user boundary exists, never the caller's composite as the runner
      # (finding 4628446).
      - name: Provision project environment
        id: setup
        if: hashFiles('.github/actions/claude-setup/action.yml', '.github/actions/claude-setup/action.yaml') != ''
        uses: ./.github/actions/claude-setup

      # Fallback where claude-setup is absent (PR heads on the inspect_ai
      # fork, whose branches are cut from pristine main; Python caller repos
      # that never added the action — NOT cross-repository fork heads, which
      # never reach this step: the CI-fix stub filters on
      # `head_repository.full_name == github.repository`): the same
      # provision-fallback composite the reviewer runs (uv version, retry,
      # extras/`--group dev`, PATH and `.venv/`-exclude reasoning in its
      # description) — the exclude matters here because, unlike the
      # reviewer, the Claude-engine agent commits from this tree.
      - name: Provision project environment (fallback)
        id: setupfb
        timeout-minutes: 10
        if: >-
          hashFiles('.github/actions/claude-setup/action.yml', '.github/actions/claude-setup/action.yaml') == '' &&
          hashFiles('pyproject.toml') != ''
        uses: meridianlabs-ai/agents/.github/actions/provision-fallback@main

      # The agent commits and stops: it holds no credential that may push or
      # post as the loop's identity, so the prompt says so plainly and hands
      # the landing (push as marvin, the `@review` hand-back) to the workflow.
      # The ENVIRONMENT and ENDING CONTRACT paragraphs stay — restated for a
      # run that ends with commits on the branch and nothing more. The
      # backtick discipline for trigger tokens and loop markers stays too,
      # aimed at commit messages and the final message now: the commit list
      # renders on the PR, and the final message of a no-change round is
      # relayed to the PR by the land job (de-fanged there as well — two
      # layers, so neither can drift to zero).
      - name: Compose fix prompt
        id: prompt
        env:
          PR: ${{ needs.gate.outputs.pr }}
          HEAD: ${{ inputs.head_branch }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          ATTEMPT: ${{ needs.gate.outputs.attempt }}
          CAP: ${{ inputs.fix_attempt_cap }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.ci_run_id }}
          AGENT_MERGE: ${{ steps.sync.outputs.agent_merge }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          SYNC_BASE: ${{ steps.sync.outputs.base }}
          SYNC_APPEND: ${{ inputs.branch_sync_append }}
        run: |
          # Single line: the prompt is spliced as one arg downstream.
          # The merge instruction is spliced only when "Sync branch with base"
          # could not land the merge itself — it aborts a conflicted merge to
          # hand the Claude path a clean index (see that step's comment), so
          # on that path the agent does the merge. The caller's
          # branch_sync_append reaches the agent on
          # EITHER path: the fork's is about a non-conflicting CHANGELOG
          # mis-merge, so a clean runner merge is exactly when it applies.
          merge_note=""
          if [ "${AGENT_MERGE:-}" = "1" ]; then
            merge_note=" FIRST TASK, before any of the above: this branch conflicts with its base branch $SYNC_BASE, and a workflow step could not merge it for you. Merge origin/$SYNC_BASE into this branch and resolve every conflict, preserving both sides' intent — the base side is other people's merged work, so never resolve by discarding it wholesale — and leave that merge committed on the branch; the workflow lands it with your other commits. Until that lands GitHub cannot compute a merge ref for this PR, so CI does not run and the failing job you are asked to fix cannot even be re-evaluated."
            # Flattened: a newline would corrupt the value= output line below.
            [ -n "${SYNC_APPEND:-}" ] && merge_note="$merge_note $(tr '\n' ' ' <<<"$SYNC_APPEND")"
          elif [ -n "${MERGE_SHA:-}" ] && [ -n "${SYNC_APPEND:-}" ]; then
            merge_note=" NOTE: a workflow step already merged origin/$SYNC_BASE into this branch before you started (a clean merge, no conflicts). Review that merge result against the following before your other changes, and fix it in your commit if it is off: $(tr '\n' ' ' <<<"$SYNC_APPEND")"
          fi
          printf 'value=%s\n' "You are @auto, fixing failing CI on PR #$PR (branch $HEAD). CI run $CI_RUN_ID ($RUN_URL) failed — this is fix attempt $ATTEMPT of $CAP. Inspect the failing jobs with \`gh run view $CI_RUN_ID --log-failed\`, diagnose the root cause, and fix it on the current branch. Verify your fix locally (run the relevant pytest/ruff/mypy). Then COMMIT to the current branch with git and stop. Do NOT push, do NOT open a PR, and do NOT post any comment, review or reaction: you hold no credential that may push or post as the loop's identity, and the workflow lands your work after your run ends — it pushes the branch's new commits as the machine account (which re-runs CI) and posts the re-review request itself. Do NOT create or edit files under .github/workflows/: the workflow cannot push them (the machine account has no Workflows permission) and the landing refuses the whole bundle, so every commit of the run is lost; if the task needs a workflow change, stop and say so in a comment so a maintainer makes it from their machine. ENVIRONMENT (mandatory): your work exists ONLY on this ephemeral runner until committed — the workflow packages the commits on the current branch when your turn ends — and a run can NEVER resume after your final turn: background tasks do not re-invoke you and their completion notifications never arrive, so never end your turn waiting on anything (subagents, background commands, test suites): collect results in the foreground, and if a final validation is long-running, commit FIRST and let the PR's own CI be the gate (observed loss: a fix round ended with tests 'running in the background' and everything evaporated with the runner). ENDING CONTRACT (mandatory): a run that changed anything ends with those changes COMMITTED on the current branch — nothing more, nothing less. Uncommitted edits to tracked files are lost with the runner and are reported to the PR as a failed round, so commit everything you mean to keep, and revert scratch edits to tracked files you do not. If after investigating you cannot fix it, leave the tree unchanged and make your final message a plain explanation of what is blocking — the workflow relays it to the PR. In commit messages and in that final message, refer to this automation as \`auto\` without an @ prefix, and never write the review or dev-agent trigger tokens bare (backtick them): the commit list and the relayed text render on the PR, where a bare trigger token would start a workflow. Likewise never write the loop's marker substrings claude-review-summary, claude-review-verdict, auto-handoff, auto-review-rounds, auto-review-head, or auto-fix-attempts verbatim — they are matched by plain substring, so quoting one would forge a verdict or a hand-off; break the token if you must reference it (e.g. 'claude-review summary').${merge_note}" >>"$GITHUB_OUTPUT"

      # The agent's push and posting channels are closed in settings, not only
      # in the prompt: `Bash(git push:*)` is stripped from the caller's allow
      # list and put on a `deny` list together with the gh verbs that post or
      # open things (deny beats allow in Claude Code, so this holds against a
      # caller's `settings` and any claude_args override). Guard rails, not
      # a security boundary: `Bash(gh:*)` stays allowed because the log and
      # PR reads the fix needs go through it, so `gh api -X POST/PATCH`,
      # `gh pr edit|close|ready` or a `git -C . push` pass the listed
      # prefixes while the action's own App token — NOT scoped to this
      # job's read-only permissions; it carries the App's contents/PR/issues
      # write — is in reach. What holds structurally is the invariant at the
      # top of this file: nothing the agent can reach is marvin's identity,
      # so a write that slipped past the deny list and the prompt would be
      # claude[bot]'s — attributable, and the same identity the dev agent
      # already writes under on a marvin-less claude.yml caller — never the
      # loop's. No MCP server is installed in agent mode without explicit
      # tool grants (none are given), so there is no API-side commit or
      # comment tool to deny.
      - name: Compose fix settings (deny pushes and posts)
        id: fixsettings
        env:
          SETTINGS: ${{ inputs.settings }}
        run: |
          set -euo pipefail
          # The action documents `settings` as a JSON string OR a path to a
          # settings file (its setupClaudeCodeSettings tries JSON.parse
          # first, then reads the path relative to the workspace — i.e. a
          # file from this PR checkout, which the deny overlay below then
          # covers like any other). Mirror that, since the value is
          # transformed here before the action sees it; anything else fails
          # loudly and the Surface step reports it (FIXSETTINGS_OUTCOME) —
          # the action step is skipped, not failed, so nothing else would.
          [ -n "$SETTINGS" ] || SETTINGS='{}'
          is_object() { printf '%s' "$1" | jq -e 'type == "object"' >/dev/null 2>&1; }
          if ! is_object "$SETTINGS" && [ -f "$SETTINGS" ]; then
            echo "settings input is a path; reading $SETTINGS"
            SETTINGS=$(cat "$SETTINGS")
          fi
          is_object "$SETTINGS" || { echo "::error::the settings input is neither a JSON object nor a path to a file holding one"; exit 1; }
          deny='["Bash(git push:*)","Bash(gh pr comment:*)","Bash(gh issue comment:*)","Bash(gh pr review:*)","Bash(gh pr create:*)","Bash(gh pr merge:*)","Bash(gh issue create:*)"]'
          merged=$(printf '%s' "$SETTINGS" | jq -c --argjson d "$deny" '
            .permissions.allow = ((.permissions.allow // []) - $d)
            | .permissions.deny = (((.permissions.deny // []) + $d) | unique)')
          {
            echo "value<<SETTINGS_EOF"
            printf '%s\n' "$merged"
            echo "SETTINGS_EOF"
          } >>"$GITHUB_OUTPUT"

      # No github_token: the action mints its own App token through the OIDC
      # exchange (as claude-review.yml's does), so the machine-account PAT is
      # nowhere in this job. additional_permissions asks that token for
      # actions: read — the exchange grants contents/PR/issues by default,
      # and `gh run view --log-failed` on the failed CI run is the first
      # thing the fix does (the job's own actions: read covers the job token,
      # not the App token). First use of additional_permissions in this repo:
      # if the exchange or a caller's App installation does not grant
      # `actions`, this step fails before Claude starts on EVERY Claude-engine
      # round — loud (the Surface step reports "failed before producing a
      # result" and the attempt is refunded), but confirm on the first caller
      # round after merge; the PAT used to cover the log read. The
      # GIT_CONFIG_* env is the step-scoped fallback credential (issue #61)
      # for any git call that does not go through the action's rewritten
      # origin URL — the JOB token now: the agent never pushes, and the
      # helper is scoped to this server's URL, so a `git fetch` the agent
      # aims at any other host gets no credential.
      - uses: anthropics/claude-code-action@v1
        id: claude
        env:
          GIT_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.${{ github.server_url }}.helper
          GIT_CONFIG_VALUE_1: '!f() { echo username=x-access-token; echo "password=$GIT_TOKEN"; }; f'
        with:
          anthropic_federation_rule_id: fdrl_01GpNgJm9jE6ZfvcqoJYQL2Y
          anthropic_organization_id: be5d0086-bc43-45d2-9184-20ecdd647aa7
          anthropic_service_account_id: svac_01RL4wYD7ikbypwYKf4wFojv
          anthropic_workspace_id: wrkspc_01RKCQ5DTPBatQ7kHLkaEueD
          additional_permissions: "actions: read"
          prompt: ${{ steps.prompt.outputs.value }}
          # workflow_run's actor is the CI run's actor — the account that
          # pushed the branch: the machine account, a User today and the
          # App's bot login under Phase 2 (TRUSTED_LOGINS; the User entry is
          # inert, the action consults this list for non-User actors only).
          # Without it the action's non-human-actor guard would refuse every
          # CI-fix round on a bot-pushed branch. The gate did the real
          # authorization.
          allowed_bots: ${{ env.TRUSTED_LOGINS }}
          settings: ${{ steps.fixsettings.outputs.value }}
          claude_args: >-
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
            ${{ inputs.model != '' && inputs.fallback_model != '' && format('--fallback-model {0}', inputs.fallback_model) || '' }}
            ${{ inputs.append_system_prompt != '' && format('--append-system-prompt {0}', toJSON(inputs.append_system_prompt)) || '' }}

      # The action leaves its App token in remote.origin.url; reset the URL so
      # the token does not sit in .git/config for the rest of the job and so
      # any later runner-side fetch reaches its own step-scoped helper — git
      # never consults a helper when the URL carries a credential. One
      # mechanism across the three workflows. always(): a failed agent leaves
      # the URL rewritten too.
      - name: Reset origin URL after the agent
        if: always() && steps.claude.outcome != 'skipped'
        uses: meridianlabs-ai/agents/.github/actions/reset-origin-url@main

      # Which model actually served this run (design/architecture.md → Model
      # selection): the init line echoes the requested model even when
      # --fallback-model fires, so this parses modelUsage, writes the served-
      # model table to THIS job's summary, and — when a non-requested model
      # served tokens or the result reads like a classifier refusal — hands
      # the note it would have posted back as its `note` output. No token:
      # this job names no secret, so the note travels to the land job as the
      # manifest's provenance_comment_file (composed below) and posts from
      # there as the machine account. Best-effort, always exits 0. (The codex
      # job's counterpart is its Codex usage step.)
      - name: Model provenance
        id: provenance
        if: always()
        uses: meridianlabs-ai/agents/.github/actions/model-provenance@main
        with:
          exec-file: ${{ steps.claude.outputs.execution_file }}
          requested: ${{ inputs.model }}

      # Surface agent errors the action swallows (model overload/529, 404, etc.),
      # which otherwise leave the fix run green with nothing landed. Also
      # catches the "completed-but-blocked" case: the agent finishes with no
      # error but left uncommitted edits (see below). This job cannot post the
      # ⚠️ itself any more (the comment must come from an account whose posts
      # are read, and this job holds no such token): the message is written
      # to a file the landing manifest carries as `error` with fail_run true,
      # and the LAND job posts it — de-fanged, as the machine account — and
      # fails the run AFTER everything else landed. So this step exits 0 on
      # every path: the red X is the land job's.
      - name: Surface agent errors
        id: surface
        if: always()
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          BASE_OUTCOME: ${{ steps.base.outcome }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          SYNC_CONFLICTS: ${{ steps.sync.outputs.conflicts }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          SETUPFB_OUTCOME: ${{ steps.setupfb.outcome }}
          FIXSETTINGS_OUTCOME: ${{ steps.fixsettings.outcome }}
          # The gate job's lookup (trusted: computed as marvin before any PR
          # code ran); the land job de-fangs the body it lands in anyway.
          MENTION: ${{ needs.gate.outputs.mention }}
          ERROR_FILE: ${{ runner.temp }}/agent-error.md
          # The tree check below runs git after the agent; pinned like the
          # codex job's landing steps (design/codex-engine.md → Hook-safe
          # landing) so the ordering never becomes load-bearing.
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: ${{ runner.temp }}/no-hooks
          GIT_CONFIG_KEY_1: core.fsmonitor
          GIT_CONFIG_VALUE_1: "false"
        run: |
          set -uo pipefail
          rm -f "$ERROR_FILE"
          file="${EXEC:-/home/runner/work/_temp/claude-execution-output.json}"
          err=""
          # The checkout, the persisted-credential assertion or the SHA step
          # failed: nothing else ran. The SHA step has no always(), so a
          # failed checkout OR a tripped assertion (the composite exits 1)
          # leaves it SKIPPED, not failed — test for anything but success,
          # and name all three causes so a tripped security invariant is not
          # read as a checkout hiccup and blindly re-triggered.
          if [ "${BASE_OUTCOME:-}" != "success" ]; then
            err="checking out the PR branch, verifying no credential was persisted in the workspace, or reading the branch SHA failed before the agent started, or the checked-out tip was no longer the head the failed run tested (the branch moved since the gate bound the run) — see the job logs for which; no fix was attempted. A moved branch needs nothing: its own CI run drives the next round. Re-trigger to retry only if it was the checkout or the SHA read; a persisted credential is a workflow bug, not a transient."
          fi
          # The base-branch sync died before the agent started (a transient
          # gh/fetch error, or its own loud non-conflict merge failure). Every
          # downstream step is SKIPPED, not failed, so no other branch below
          # fires; the attempt the gate recorded is refunded by the land job
          # (the agent never launched, nothing lands) — without this the
          # failure is a silent stall with the board at Agent.
          if [ -z "$err" ] && [ "${SYNC_OUTCOME:-}" = "failure" ]; then
            err="the base-branch sync step failed before the agent started (a transient gh/fetch error, or a base merge that failed without content conflicts — see the job logs); no fix was attempted. Re-trigger to retry."
          fi
          # Provisioning died before the agent started: same shape as the sync
          # failure above — the agent steps are SKIPPED and without this the
          # job is a silent red with the board parked at Agent. Unlike the
          # sync failure (which exits before merge_sha is written), the
          # runner's clean base merge, if there was one, is still above the
          # start SHA here, so emit-landing bundles it and the land job
          # pushes it — re-running CI — and posts the re-review request, even
          # though no fix was attempted. That is the right outcome (the
          # branch stays current, and the re-run finds nothing left to merge,
          # so a deterministic failure repeats this comment at most once more
          # and then stops rather than looping), but the wording below says
          # so instead of claiming nothing moved. A DETERMINISTIC cause is
          # named too: on this loop, red CI can be caused by the PR's own
          # dependency change (a pyproject.toml that no longer installs),
          # which now fails provisioning on every trigger — before 2026-09-09
          # the Claude engine would have attempted that class of fix;
          # accepted, it mirrors the dev agent's and reviewer's fatal stance,
          # but "re-trigger" is wrong advice for it, so the message says to
          # fix it by hand. (The codex job tolerates a provisioning failure
          # on its conflicted path; this job has no such path — the Claude
          # engine's sync aborts a conflicted merge and hands it to the
          # agent.)
          if [ -z "$err" ] && [ "${SETUP_OUTCOME:-}" = "failure" ]; then
            err="environment provisioning (claude-setup) failed before the fix agent started — a transient dependency-download/network error, a dependency file the base merge touched, or this PR's own dependency change no longer installing (that one fails identically on every trigger: fix it by hand); no fix was attempted, though the runner's clean base merge, if there was one, was still landed on the branch. Re-trigger if it looks transient."
          elif [ -z "$err" ] && [ "${SETUPFB_OUTCOME:-}" = "failure" ]; then
            err="fallback environment provisioning (uv dev-install) failed before the fix agent started — a transient dependency-download/network error, the project not dev-installing on a bare runner, or this PR's own dependency change no longer installing (either of those fails identically on every trigger: fix it by hand — check the job logs); no fix was attempted, though the runner's clean base merge, if there was one, was still landed on the branch. Re-trigger if it looks transient."
          fi
          # The settings composer failed (a caller's `settings` that is
          # neither a JSON object nor a path to a file holding one): the
          # action step is SKIPPED, not failed, so without this clause the
          # round ends "No agent error detected" with a red job on every
          # trigger and nothing on the PR. Deterministic — the caller's stub
          # is what needs fixing, so no "re-trigger" advice.
          if [ -z "$err" ] && [ "${FIXSETTINGS_OUTCOME:-}" = "failure" ]; then
            err="composing the fix agent's settings failed before the agent started — the caller's \`settings\` input is neither a JSON object nor a path to a file holding one (see the job logs); no fix was attempted. This fails identically on every trigger: fix the caller stub's settings input."
          fi
          # The agent's own error text is free-form (and unbounded — it is
          # the final message when is_error is set); cap it so the manifest's
          # error.message stays well under the validator's 64 KiB limit.
          [ -z "$err" ] && [ -f "$file" ] && err=$(jq -r '(if type=="array" then . else .messages end) | map(select(.type=="result" and .is_error==true)) | last | .result // empty' "$file" 2>/dev/null | head -c 6000 || true)
          if [ -z "$err" ] && [ "$CLAUDE_OUTCOME" = "failure" ]; then
            # Whether Claude launched before the failure cannot be told from
            # outside the action (its execution-file output is published by
            # its error handler from whatever sits at the default path), so
            # every failed step is one round: nothing lands and the attempt
            # is refunded — the composer withholds the bundle, the runner's
            # base merge and any local commits included.
            err="the CI-fix step failed (the action refused to run for this actor, failed to start, or failed during the run — see the job logs); nothing was landed, the runner's base merge and any commits of the run included, and the attempt is refunded."
          fi
          # Completed-but-blocked: the action reports success,
          # but the agent left edits to tracked files uncommitted — they die
          # with the runner, whatever its summary says. A healthy fix either
          # commits its changes (the land job pushes them) or makes none at
          # all (its final message explains why, relayed by the land job).
          # Untracked files are normal scratch (test caches, venvs) — only
          # tracked-file edits count. Flagged only when nothing of the
          # AGENT's is landable: HEAD still at the start SHA, or exactly the
          # runner's clean base merge (a merge-only round — the one commit
          # above the start SHA is the runner's, and the agent's own work is
          # the edits dying here; the merge still lands and owes its
          # hand-back, so the wording says "no fix", not "nothing"). With an
          # agent commit above it the fix lands and the leftovers are a
          # warning, as before the split when a pushed round was never
          # second-guessed.
          if [ -z "$err" ] && [ "$CLAUDE_OUTCOME" = "success" ] && [ -n "${BASE_SHA:-}" ]; then
            dirty=$(git status --porcelain --untracked-files=no --ignore-submodules=dirty 2>/dev/null || true)
            if [ -n "$dirty" ]; then
              head=$(git rev-parse HEAD 2>/dev/null || echo "$BASE_SHA")
              if [ "$head" = "$BASE_SHA" ] || { [ -n "${MERGE_SHA:-}" ] && [ "$head" = "$MERGE_SHA" ]; }; then
                # Strip the @ from trigger tokens in agent-authored text and
                # split the codex reviewer's footer — this is embedded in a
                # marvin-authored comment, which pr-feedback-context would
                # take for the newest review if it carried the footer (the
                # land job de-fangs triggers and markers again, but not the
                # footer: see the codex summary step's comment).
                summary=$(jq -r '(if type=="array" then . else .messages end) | map(select(.type=="result")) | last | .result // empty' "$file" 2>/dev/null | head -c 1000 | sed -E -e 's/@(review|claude|auto)/\1/g' -e 's/engine: codex/engine  codex/g' || true)
                err="the agent finished but left edits to tracked files uncommitted, so no fix landed on the branch (only the runner's base merge, if there was one) — whatever its summary reports, no code change reached CI."
                [ -n "$summary" ] && err="$err Agent summary: $summary"
              else
                echo "::warning::the agent committed a fix but also left uncommitted edits to tracked files behind; the commits land, the leftovers die with the runner: $(printf '%s' "$dirty" | head -5 | tr '\n' ' ')"
              fi
            fi
          fi
          [ -z "$err" ] && { echo "No agent error detected."; exit 0; }
          echo "::error::CI-fix run did not complete: $err — the land job posts the note and fails the run."
          cc=""
          [ -n "${MENTION:-}" ] && cc=$(printf '\n\ncc @%s' "$MENTION")
          printf '⚠️ The auto CI-fix run did not complete:\n\n> %s\n\nIf this looks transient (model API capacity/overload), CI will re-trigger it on the next push or you can re-run the workflow; otherwise it likely needs a human.%s\n' "$err" "$cc" >"$ERROR_FILE"

      # Everything the land job pushes, posts or moves, as ONE JSON object for
      # emit-landing's manifest-extra (schema: .github/actions/emit-landing/
      # README.md). Body text goes in as files under the landing directory,
      # referenced by name; the manifest itself is DATA the land job
      # validates before acting. Fields:
      #   handback  — true when HEAD moved past the start SHA (and descends
      #               from it, the same test emit-landing applies before it
      #               bundles — a rebased HEAD lands nothing and must owe
      #               nothing): the loop's rule, a run that landed a commit
      #               owes exactly one `@review`. The runner's base merge
      #               counts (a merge-only round moves HEAD), so the
      #               "pushed but no hand-back" failure mode the deleted
      #               backstops covered cannot occur — the hand-back is a
      #               field of the same manifest as the push — and the
      #               converse holds too: emit-landing drops handback and
      #               stage when it drops the bundle (HEAD moved, no bundle
      #               written), so no bare `@review` posts for a round whose
      #               work was lost. Owed on ancestry — but only for a round
      #               whose agent step did not FAIL: a Claude step that
      #               ended `failure` (the action's actor refusal, a
      #               bootstrap failure, max-turns or an is_error result
      #               mid-fix — indistinguishable from outside the action)
      #               lands nothing and owes nothing, its commits included,
      #               and its attempt is refunded (finding 4628657, review
      #               rounds 1–3; the rule and its cost are on the composer
      #               step below and in design/auto-agent.md). From #82 to
      #               2026-09-22 such a step landed its commits with the ⚠️
      #               alongside; that was dropped because the only evidence
      #               that the agent had run at all — the action's
      #               execution-file output — is one a PR file can forge.
      #   stage     — never set here. A hand-back is mid-flight (the
      #               reviewer runs next), and a card stays at Agent while
      #               any agent of the loop is still to run; Review is the
      #               gate's, on escalation — the loop's end (one rule for
      #               every loop, design/atlas-tracking.md; Ransom,
      #               2026-09-18 — until then the hand-back set Review too).
      #   comments  — codex's final message (engine codex; the commit step
      #               wrote it, de-fanged), or — the Claude path's analogue,
      #               so a round that gave up is not silent — the agent's
      #               final message when it committed nothing and the run
      #               succeeded: HEAD still at the start SHA, or exactly the
      #               runner's clean base merge (a merge-only round: the
      #               merge lands and owes its hand-back, but the agent
      #               committed nothing — the codex path's merge_only header
      #               is the same rule). The blocker explanation the prompt
      #               asks for; when the Surface step already reported the
      #               round, its message carries the summary instead.
      #   provenance_comment_file — the model-provenance note, if any
      #   error     — the Surface step's message (fail_run: true)
      # Not set -e: a manifest must come out of every path. On the codex path
      # (the ENGINE the gate resolved — not `codexuser.outcome`, which is
      # `skipped`/`failure` when the prep or user-setup step failed and
      # would let those two fall through to the ancestry branch, landing
      # the runner's base merge and keeping the attempt where the Surface
      # strings, the refund and the docs all say nothing lands) the git
      # reads are skipped (handback false) unless the unresolved-merge guard
      # SUCCEEDED — the same condition emit-landing's read-only takes, so
      # nothing above the start SHA is packaged either. The guard is itself
      # gated on the codex step and the reclaim having succeeded, and both
      # of those on the user setup, so "guard did not succeed" covers every
      # codex-path failure: a failed prep or user-setup step (no codex
      # process ran; the base merge, if any, stays unpushed and the round
      # is refunded, as before the split), a failed codex step (its partial
      # local commits are never pushed — as before the split, when the
      # landing step was gated on the run step), a reclaim that did not
      # succeed (nothing lands from a workspace codex still owns), and a
      # guard that FAILED — codex may commit locally, and `git commit` over
      # staged-but-still-marked paths completes the base merge, so HEAD moves
      # past the start SHA with conflict markers in the tree; keying on
      # ancestry alone would bundle and push that as marvin, request the
      # re-review and only then post an error saying nothing landed. The
      # guard is the enforcement point (design/architecture.md → The landing
      # step is the enforcement point), so its failure withholds the push
      # here as it withheld the old Land codex fix step. Post-codex git, so
      # the git dir is pinned by env like the guard and the commit step
      # (AGENTS.md; the reclaim's refusal of a redirect is the primary
      # defence, this is belt and braces).
      #
      # The Claude path has the same withholding for a step that FAILED, for
      # any reason: the action's own actor-permission refusal, a bootstrap
      # failure before Claude started, or a failure during the run. The
      # three cannot be told apart from outside the action — its
      # `execution_file` output is not launch evidence, since its error
      # handler publishes whatever file sits at the default path, which the
      # PR's provisioning step can pre-create (review rounds 1 and 2 of
      # finding 4628657's fix: a preseeded file read as "launched" and let a
      # refused round bundle the base merge and dodge its refund). So the
      # rule is fail-closed on the step's OUTCOME, a runner fact no PR file
      # can forge: a failed Claude step lands nothing — no git, no
      # hand-back, not the runner's base merge, not a commit Claude may have
      # made before failing — and the refund (agent step not successful,
      # nothing pushed) gives the attempt back. Before finding 4628657 such a
      # round still bundled the runner's clean base merge (and its commits),
      # so a declined authorization pushed a marvin commit, re-ran CI and
      # kept its attempt while the codex path's failure landed nothing; the
      # two engines now agree. A round whose agent step was SKIPPED (a
      # provisioning failure) is unchanged: the Surface step's provisioning
      # clauses document that the base merge lands there (decision
      # 2026-09-09).
      - name: Compose landing manifest
        id: landing
        if: always()
        env:
          DIR: ${{ runner.temp }}/landing
          EXTRA: ${{ runner.temp }}/landing-extra.json
          PR: ${{ needs.gate.outputs.pr }}
          ATTEMPT: ${{ needs.gate.outputs.attempt }}
          START_SHA: ${{ steps.base.outputs.sha }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          PROV_NOTE: ${{ steps.provenance.outputs.note }}
          ERROR_FILE: ${{ runner.temp }}/agent-error.md
          GIT_DIR: ${{ github.workspace }}/.git
          GIT_COMMON_DIR: ${{ github.workspace }}/.git
          GIT_WORK_TREE: ${{ github.workspace }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: ${{ runner.temp }}/no-hooks
          GIT_CONFIG_KEY_1: core.fsmonitor
          GIT_CONFIG_VALUE_1: "false"
        run: |
          set -uo pipefail
          mkdir -p "$DIR"
          extra='{}'
          moved=false
          head=""
          if [ "${CLAUDE_OUTCOME:-}" = "failure" ]; then
            echo "landing: the Claude step failed (the action refused the actor, failed to start, or failed during the run — indistinguishable from here); running no git — nothing lands, not the runner's base merge or a commit of the run either, no hand-back is owed, and the attempt is refunded."
          elif [[ "${START_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            head=$(git rev-parse HEAD 2>/dev/null || echo "$START_SHA")
            if [ "$head" != "$START_SHA" ] && git merge-base --is-ancestor "$START_SHA" "$head" 2>/dev/null; then
              moved=true
            fi
          fi
          if [ "$moved" = "true" ]; then
            extra=$(jq -c '.handback = true' <<<"$extra")
          fi
          # Merge-only: HEAD moved, but only to the runner's clean base merge
          # — any agent commit would have moved it further — so the agent
          # committed nothing and its final message is owed to the PR just
          # as on a round where nothing moved at all.
          merge_only=""
          [ "$moved" = "true" ] && [ -n "${MERGE_SHA:-}" ] && [ "$head" = "$MERGE_SHA" ] && merge_only=1
          if [ "${CLAUDE_OUTCOME:-}" = "success" ] && { [ "$moved" != "true" ] || [ -n "$merge_only" ]; } && [ ! -s "$ERROR_FILE" ] && [[ "$PR" =~ ^[0-9]+$ ]]; then
            file="${EXEC:-/home/runner/work/_temp/claude-execution-output.json}"
            # Same de-fang as the codex summary step: this relay posts as
            # marvin, so a final message quoting a trigger, a loop marker or
            # the codex reviewer's footer would fire a workflow, forge a
            # verdict or pose as the newest review. `land` repeats the trigger
            # and marker rules but deliberately not the footer (it posts the
            # codex reviewer's real one), so this is the footer's only layer.
            summary=$(jq -r '(if type=="array" then . else .messages end) | map(select(.type=="result")) | last | .result // empty' "$file" 2>/dev/null | head -c 10000 \
              | sed -E -e 's/@(review|claude|auto)/`\1`/g' \
                       -e 's/claude-review-(summary|verdict|comment)/claude-review \1/g' \
                       -e 's/engine: codex/engine  codex/g' \
                       -e 's/auto-(handoff|review-rounds|review-head|fix-attempts)/auto \1/g' || true)
            {
              if [ -n "$merge_only" ]; then
                printf '🤖 auto (CI-fix attempt %s): base merge only, no fix this attempt — the agent'"'"'s summary:\n\n' "$ATTEMPT"
              else
                printf '🤖 auto (CI-fix attempt %s): no fix this attempt — the agent'"'"'s summary:\n\n' "$ATTEMPT"
              fi
              printf '%s\n' "${summary:-(the agent produced no final message)}"
            } >"$DIR/agent-summary.md"
            extra=$(jq -c --argjson n "$PR" '.comments = [{number: $n, body_file: "agent-summary.md"}]' <<<"$extra")
          fi
          if [ -n "${PROV_NOTE:-}" ]; then
            printf '%s\n' "$PROV_NOTE" >"$DIR/prov.md"
            extra=$(jq -c '.provenance_comment_file = "prov.md"' <<<"$extra")
          fi
          if [ -s "$ERROR_FILE" ]; then
            extra=$(jq -c --rawfile msg "$ERROR_FILE" '.error = {message: $msg, fail_run: true}' <<<"$extra")
          fi
          printf '%s\n' "$extra" >"$EXTRA"
          echo "landing: moved=$moved $(jq -c 'if .error then .error.message = "<\(.error.message | length) chars>" else . end' <<<"$extra")"

      # Last, always: package the commits above the start SHA and the
      # manifest for the land job. The PR number is the gate job's trusted
      # lookup, the SAME value the land job gets (README → Using the pair):
      # the validator pins the manifest's pr_number to it and its branch to
      # that PR's live head ref. read-only when the Claude step FAILED (the
      # composer's condition, see its comment): nothing above the start SHA
      # — the runner's base merge, a commit made before the failure — is
      # packaged for a round the action did not complete. Either way the
      # manifest still carries the Surface step's error for the land job to
      # post (the README's snippet skips the step outright there; here the
      # report matters more than the empty bundle).
      - name: Emit landing manifest
        if: always()
        uses: meridianlabs-ai/agents/.github/actions/emit-landing@main
        with:
          # When the checkout (or the SHA step) failed, `steps.base` is empty
          # and an empty start_sha would be refused at `validate` — and the
          # land composite posts the manifest's error only from a VALIDATED
          # manifest, so the Surface step's checkout-failure message would be
          # lost to the log. With no repo there is nothing to bundle either
          # way; github.sha (always 40 hex; the default-branch head on
          # workflow_run) is a trusted, well-formed placeholder.
          start-sha: ${{ steps.base.outputs.sha || github.sha }}
          branch: ${{ inputs.head_branch }}
          pr-number: ${{ needs.gate.outputs.pr }}
          manifest-extra: ${{ runner.temp }}/landing-extra.json
          read-only: ${{ steps.claude.outcome == 'failure' && 'true' || 'false' }}


  # UNTRUSTED, codex engine: the same checkout and sync as the Claude job
  # above, then the codex user boundary, provisioning AS that user, codex,
  # the reclaim and the deterministic commit. The ONLY job of the workflow
  # that names OPENAI_API_KEY (Claude Security finding 4629153: a secret a
  # step references is delivered to the job's runner whether or not the
  # step's `if:` ends up true — the runner builds its `secrets` context
  # from the job message before any step runs — so the Claude job's message
  # used to carry the codex key too; now this job is selected by the gate's
  # engine output at the job level, which GitHub evaluates before
  # dispatching, and a Claude-engine round never has a job message with the
  # key in it). And the only job that runs the codex user recipe: nothing
  # from the checked-out tree executes as the runner here (finding 4628446;
  # the provisioning step's comment).
  fix-codex:
    needs: gate
    if: needs.gate.outputs.act == 'fix' && needs.gate.outputs.engine == 'codex'
    runs-on: ubuntu-latest
    # Same group as the gate (rationale there): one agent per PR branch at a
    # time, and never alongside a review-fix round.
    concurrency:
      group: claude-auto-${{ github.repository }}-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read          # checkout, sync fetches; cannot push
      pull-requests: read     # the PR lookups; cannot comment
      issues: read
      id-token: write         # WIF auth (and the action's own App token)
      actions: read           # the failed CI run's logs
    outputs:
      # What the land job's refund step needs from this job: whether the
      # agent step ran to a result. `agent_outcome` is `failure` when any
      # codex step that precedes or is the codex run failed, and the codex
      # run's outcome otherwise (`skipped` on a run whose sync or
      # provisioning failed before it started). Step outcomes only: nothing
      # a PR file can forge (the Claude job's comment on the same output).
      agent_outcome: ${{ (steps.codexprep.outcome == 'failure' || steps.codexuser.outcome == 'failure' || steps.codexhome.outcome == 'failure' || steps.codexcompose.outcome == 'failure' || steps.codexfix.outcome == 'failure') && 'failure' || steps.codexfix.outcome }}
    steps:
      # Check out the PR branch so the agent fixes in place; the land job
      # pushes the result. persist-credentials:false (issue #61): checkout
      # otherwise writes its token into .git/config for the rest of the job —
      # and this job group-grants the whole workspace to the codex user.
      # Nothing is persisted; every later git network call
      # authenticates itself (design/architecture.md → "No persisted git
      # credentials"): the runner-side steps through a step-scoped credential
      # helper on the job token; codex holds no credential and never fetches.
      # The fetch itself is a read, so the job token is enough for it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_branch }}
          token: ${{ github.token }}
          persist-credentials: false

      # Regression guard for the invariant above (shared composite — one copy
      # for all three workflows): asks git, which follows includes, for the
      # header checkout would have persisted, keyed on the server URL.
      - name: Assert no credential persisted in the workspace
        uses: meridianlabs-ai/agents/.github/actions/assert-no-persisted-credential@main

      # Capture the branch tip before the agent runs: emit-landing's start-sha
      # (commits above it are the run's landable work), and what "Compose
      # landing manifest" compares HEAD against to decide whether a hand-back
      # is owed. Stamped BEFORE the base sync below, so a round whose only
      # product is the runner's base merge still counts as landable work.
      # rev-parse on its own line under -e, so a failure is this step's (not
      # echo's success with an empty sha); Surface agent errors reads the
      # outcome, and the emit step falls back to github.sha so the manifest
      # carrying that error still validates. The tip must be the head the
      # failed run TESTED (the gate's `head_sha`, from the run's API record):
      # the checkout is by branch name, so a push between the gate and this
      # step would put the agent on code the failing logs do not describe.
      # Then this step fails, nothing below runs, and the attempt is
      # refunded; the newer push's own run drives the next round.
      - name: Record base SHA
        id: base
        env:
          TESTED_SHA: ${{ needs.gate.outputs.head_sha }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          if [ "$sha" != "$TESTED_SHA" ]; then
            echo "::error::the checked-out tip $sha is not the head the failed run tested (${TESTED_SHA:-unknown}); the branch moved since the gate bound the run, so this round is for a stale run and does nothing."
            exit 1
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      # ---- Deterministic base-branch sync (design/architecture.md) ---------
      # The base merge happens HERE, on the runner, for BOTH engines (this
      # job and the codex job open the same way) — not in a prompt. The codex sandbox holds no credentials and is told not to fetch,
      # so it cannot be asked to merge (instruction, not structure, since its
      # sandbox gained network on 2026-09-09; the in-progress hand-off means it
      # never needs to), and a prompted merge is advisory, so branches drifted
      # anyway: inspect_ai#392 sat 11 commits behind main across 20 commits,
      # and because GitHub cannot compute a merge ref for a conflicted PR, CI
      # never ran and every fix round was written against stale code.
      #
      # A CONFLICTED merge is handed on differently per engine: the Claude path
      # gets a CLEAN index and re-merges inside the agent (it has network and
      # the git allow-list); codex gets the merge still IN PROGRESS and resolves
      # the markers in the tree, and its commit step refuses to proceed while
      # any survive. In claude.yml the split is forced — tag mode's setupBranch
      # runs `git checkout <branch> --`, which aborts on an unmerged index.
      # This workflow runs the action in agent mode (bare `prompt:`, no
      # track_progress), which does NOT run setupBranch, so the action would
      # tolerate an in-progress merge here. The split is mirrored anyway: one
      # mental model and one merge instruction across all three workflows (here
      # the inline merge_note in "Compose fix prompt"; claude.yml's is its
      # branch_sync_prompt input).
      #
      # The step body is the shared sync-branch composite (one copy for all
      # three workflows). checkout stays false: this job's actions/checkout
      # already put the PR head branch in the workspace (the gate handled
      # closed and fork PRs), and "Record base SHA" above stamped its
      # PRE-merge tip — which is what makes a merge-only round land (the
      # merge commit is above the start SHA, so the land job pushes it and
      # posts the re-review request; there is no separate backstop any more).
      # The job token: the composite only reads (a PR lookup and fetches),
      # and it is what its step-scoped git credential is built from.
      - name: Sync branch with base
        id: sync
        uses: meridianlabs-ai/agents/.github/actions/sync-branch@main
        with:
          pr: ${{ needs.gate.outputs.pr }}
          engine: ${{ needs.gate.outputs.engine }}
          token: ${{ github.token }}
          # The base the gate's bind step established the run tested (the
          # PR's base, with no retarget since the run was created): the
          # composite refuses to merge anything else, so a PR retargeted
          # between the gate and this step fails the sync (the agent is
          # skipped, the attempt refunded) instead of merging a base the
          # failing logs never saw.
          base: ${{ needs.gate.outputs.base_ref }}
          # ...and the base TIP the gate read: the fetched origin/<base> must
          # be exactly it, so the base cannot move between the gate's read
          # and the merge (it may have moved between the run and the gate:
          # the loop targets the base as it is).
          base-sha: ${{ needs.gate.outputs.base_sha }}
          # The merge commit's author: the gate decided it from which token
          # it minted (bot on the app path, User on the PAT).
          user-name: ${{ needs.gate.outputs.git_user_name }}
          user-email: ${{ needs.gate.outputs.git_user_email }}

      # ---- Codex engine CI-fix round (design/codex-engine.md) ----------------
      # The codex sandbox has no GitHub credentials, so the failing CI logs are
      # pre-fetched into the prompt file (job token: reads only; the compose
      # step below); the commit is deterministic (below), and the push and
      # the summary comment are the land job's, through the manifest. This
      # step is the part that must run BEFORE the codex user exists: the
      # commit identity it writes into .git/config is what `Create codex
      # user` snapshots and the reclaim step restores, and the landing
      # directory is created runner-owned before codex gets its workspace
      # grants, so the codex user (a member of the runner group under the
      # create-codex-user recipe) cannot pre-create it or plant a file the
      # later commit and compose steps write next to.
      - name: Prepare codex workspace
        id: codexprep
        env:
          LANDING_DIR: ${{ runner.temp }}/landing
          # The codex commit's author (the gate's outputs: bot on the app
          # path, User on the PAT — see the gate job).
          GIT_USER_NAME: ${{ needs.gate.outputs.git_user_name }}
          GIT_USER_EMAIL: ${{ needs.gate.outputs.git_user_email }}
        run: |
          set -euo pipefail
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          mkdir -p "$LANDING_DIR"
          # The commit step stages with a blanket `git add -A` (new source
          # files are legitimate output), so exclude the scratch that
          # provisioning and codex's verification runs leave behind on repos
          # whose .gitignore doesn't already cover it (caches, venvs, the
          # egg-info a setuptools editable install writes into the source
          # tree). Written HERE, before the codex user exists: after the
          # workspace grant a process running as codex could have replaced
          # .git/info/exclude with a symlink, and a runner-side append would
          # follow it (finding 4628446, review round 1). The prompt file
          # itself lives in RUNNER_TEMP for the same reason.
          printf '%s\n' .venv/ venv/ '*.egg-info/' __pycache__/ \
            .pytest_cache/ .mypy_cache/ .ruff_cache/ .coverage node_modules/ \
            >>.git/info/exclude

      # codex-action's default safety-strategy (drop-sudo) chmods root-owned
      # service sockets under /run, breaking D-Bus -> systemd-resolved -> DNS;
      # the hosted runner then dies with "lost communication" 52-65 minutes
      # into the job (openai/codex-action#160; observed twice at ~62 min on
      # inspect_ai#389, 2026-08-31). Until fixed upstream, run codex as a
      # dedicated unprivileged user — the README's other blessed strategy for
      # permission profiles: containment is the user boundary plus the
      # profile sandbox, and the API key stays out of reach (codex has no
      # sudo). The user/grant recipe — pre-codex .git/config and embedded-
      # repo snapshots for the reclaim step, the action's
      # examples/unprivileged-user.yml chown/g+rwX, the codex-owned output
      # dir under RUNNER_TEMP, git safe.directory, and network ON in the
      # sandbox (design/codex-engine.md → Network) — is the shared
      # create-codex-user composite; its description carries the rationale
      # for each. Step name and id are load-bearing: the reclaim step gates
      # on `steps.codexuser.outcome`. Runs BEFORE provisioning (Claude
      # Security finding 4628446): from here on nothing from the checked-out
      # tree executes as the runner — the provisioning step below runs the
      # tree's build backend as the codex user, and codex itself runs as
      # that user.
      - name: Create codex user
        id: codexuser
        uses: meridianlabs-ai/agents/.github/actions/create-codex-user@main

      # Provision the project environment AS THE CODEX USER, after the user
      # boundary exists (Claude Security finding 4628446). The Claude job
      # runs the caller's `claude-setup` composite and the fallback recipe as
      # the runner; a composite action can only run as the runner, and on
      # this job the runner is a uid with passwordless sudo, the OIDC request
      # token and — at the codex-action step below — OPENAI_API_KEY, none of
      # which the codex user boundary lets codex reach. The PR head this job
      # checks out may be one the pipeline itself authored from an outsider's
      # issue text (pushed and labelled by the machine account, so
      # `same-repo` says nothing about who wrote its `pyproject.toml` build
      # hooks or its `claude-setup` action), so its code runs only where
      # codex's own code runs: as `codex`, no sudo, no tokens, no view of the
      # runner's processes. Hence always the shared fallback recipe (`user:
      # codex` — the composite runs `provision.sh` under `sudo -u codex -H`),
      # never `./.github/actions/claude-setup`, even on callers that define
      # it: the venv lands in the checkout as before, codex-owned, and the
      # compose step names its tools by the composite's `bin` output. Python
      # projects (`pyproject.toml`) get the generic recipe; a caller recipe runs
      # without one (the stub knows its project: a Node repository's `pnpm
      # install` has no pyproject); anything else codex provisions itself
      # inside its sandbox, which has network (its prompt says so).
      # Placed after the base sync (so a dependency file the merge touched is
      # what gets installed). A provisioning failure SKIPS the agent; the
      # attempt the gate already recorded is refunded by the land job (the
      # agent never launched and nothing lands), and the Surface step
      # reports it — fatal, with ONE exception: the conflict path. sync-branch
      # hands codex the base merge still IN PROGRESS, with conflict markers
      # in the tree, and provisioning runs over that tree — so when
      # pyproject.toml or the lockfile is among the conflicted files the
      # install fails DETERMINISTICALLY, and a fatal failure here would skip
      # the very round that exists to resolve the markers (every re-trigger
      # failing the same way). So when the sync left conflicts a provisioning
      # failure is tolerated: the round runs static-only, codex is told in
      # its prompt that provisioning failed, and the next round — on the
      # resolved branch — provisions normally. `outcome` still reads
      # `failure` on the tolerated path (only `conclusion` is neutralized),
      # which is what the prompt composer and the Surface step key on.
      - name: Provision project environment (as the codex user)
        id: setup
        timeout-minutes: 10
        if: hashFiles('pyproject.toml') != '' || inputs.codex_provision != ''
        continue-on-error: ${{ steps.sync.outputs.conflicts != '' }}
        uses: meridianlabs-ai/agents/.github/actions/provision-fallback@main
        with:
          user: codex
          # The caller's own recipe for codex runs, if its stub set one (the
          # trusted counterpart of its claude-setup); empty runs the generic
          # dev-install.
          recipe: ${{ inputs.codex_provision }}

      # The boundary between provisioning-as-codex and codex-action (Claude
      # Security finding 4628446, review round 1): kill every process still
      # running as codex — a hostile build backend's survivor — and re-create
      # the codex home from scratch. codex-action's runner-side bootstrap
      # reads ~codex/.codex/config.toml (following a symlink) and writes the
      # merged file back readable by codex, so a config.toml the provisioning
      # had replaced with a link to /proc/self/environ would copy the action
      # process's environment — the OIDC request token, the key input — into
      # a file codex can read. After this step nothing runs as codex and the
      # only files codex-action reads before launching codex are the ones the
      # composite wrote. A failure skips codex (the Surface step names it).
      - name: Reset codex home
        id: codexhome
        uses: meridianlabs-ai/agents/.github/actions/create-codex-user@main
        with:
          mode: reset-home

      # The prompt: the failing CI logs and the task, with the verification
      # instruction keyed on what the provisioning step (as codex, above) did.
      # After provisioning, as the runner, into RUNNER_TEMP (755
      # runner:runner, readable by codex; codex-action reads prompt-file
      # runner-side anyway) — never into the workspace: once the codex user
      # has its grant, a runner-side write there could follow a symlink a
      # process running as codex planted (finding 4628446, review round 1).
      - name: Compose codex prompt
        id: codexcompose
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.gate.outputs.pr }}
          HEAD: ${{ inputs.head_branch }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          ATTEMPT: ${{ needs.gate.outputs.attempt }}
          CONFLICTS: ${{ steps.sync.outputs.conflicts }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          SYNC_BASE: ${{ steps.sync.outputs.base }}
          SYNC_APPEND: ${{ inputs.branch_sync_append }}
          CAP: ${{ inputs.fix_attempt_cap }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          BIN: ${{ steps.setup.outputs.bin }}
        run: |
          set -euo pipefail
          # Retry-then-fail on context fetches — never swallow: the embedded
          # context is load-bearing, so a swallowed transient either burns
          # the round on inference (PR #392, 2026-09-01: the emptiness guard
          # fired "empty — transient?" with the real gh error discarded) or
          # silently degrades the prompt where no emptiness invariant exists
          # (the inline-comments section). Three attempts absorb blips;
          # exhaustion fails the step with gh's real stderr in the log,
          # routing into the prep-failure surfacing and the attempt refund.
          fetch() { # fetch <outfile> <gh args...>
            local out="$1"; shift
            local n=0
            until gh "$@" >"$out"; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then
                # >&2: call sites sit inside a stdout-redirected group, so a
                # plain echo would land in the abandoned scratch file; the
                # runner parses workflow commands on stderr too.
                echo "::error::context fetch failed after 3 attempts: gh $*" >&2
                return 1
              fi
              sleep $((n * 5))
            done
          }
          # What the sandbox actually has depends on what the provisioning
          # step did: it is conditional (no pyproject.toml means it did not
          # run), and on a conflicted round a failure is tolerated rather
          # than fatal (see that step) — so the verification instruction says
          # which case it is instead of asserting a venv that may not exist.
          # The tools go in by ABSOLUTE path: under the unprivileged-user
          # strategy codex-action launches codex via `sudo -u codex` (no -E),
          # and sudo's env_reset/secure_path replaces PATH before codex
          # starts, so a venv on PATH would NOT resolve as bare names there
          # (inspect_flow#818 dev run, 2026-09-09). The provisioning ran as
          # codex, so there is no runner PATH to discover from either: the
          # tools are looked up in the venv's bin directory the composite
          # reports.
          if [ "${SETUP_OUTCOME:-}" = "success" ]; then
            tools=""
            IFS=: read -r -a dirs <<<"$BIN"
            for t in pytest ruff mypy pyright python3 node pnpm npm; do
              for d in "${dirs[@]}"; do
                [ -x "$d/$t" ] && { tools="$tools$t=$d/$t "; break; }
              done
            done
            verify="Verify with the locally provisioned tools where relevant. Your process runs under sudo with a reset PATH, so bare command names will NOT resolve — invoke them by these ABSOLUTE paths: ${tools:-none discovered}."
          elif [ "${SETUP_OUTCOME:-}" = "failure" ]; then
            verify="NOTE: environment provisioning FAILED before you started (on this conflicted round the likely cause is a conflicted dependency file — pyproject.toml or a lockfile — see the merge conflict task below), so pytest and the project's dependencies are probably NOT installed. Resolve the merge conflict first; THEN you may provision them yourself (network is available inside your sandbox): create .venv in the project root and dev-install the project into it (e.g. /usr/bin/python3 -m venv .venv && .venv/bin/pip install -e '.[dev]' — .venv/ and *.egg-info/ are already git-excluded; keep it to that). If that fails too, verify as far as the bare runner allows (py_compile, reading the code) and state plainly in your final message that verification was static-only this round — the next round provisions normally once the resolved branch is pushed."
          else
            verify="Verify locally (pytest/ruff/mypy) where relevant and available — no project environment was provisioned for this checkout (no pyproject.toml); network is available inside your sandbox, so you may install what verification needs yourself (keep it minimal and out of the tree — a venv or cache directory, never edits to tracked files)."
          fi
          {
            echo "You are auto, fixing failing CI on PR #$PR in $REPO (branch $HEAD, fix attempt $ATTEMPT of $CAP), running on the Codex engine in a local checkout of the branch."
            echo "CONSTRAINTS: you have NO GitHub credentials — nothing you run can push or post, and you must NOT run gh, git fetch or git push at all (an anonymous fetch might succeed on a public repo; do not try it — the checked-out tree is the one to work on). Network access IS available inside your sandbox for package downloads and test fixtures (install into the project venv if a tool is missing; keep installs minimal, never install from a git+ URL — an editable VCS install clones a repo into the venv, and a nested checkout fails the run — and do not edit dependency files the task does not call for), but nothing you do can push to or post on GitHub. Fix in the working tree on the checked-out branch only — do NOT create or switch branches or check out other commits. Do NOT create or edit files under .github/workflows/: the workflow cannot push them (the machine account has no Workflows permission) and the landing refuses the whole bundle, so every commit of the run is lost; if the task needs a workflow change, stop and say so in your final message so a maintainer makes it from their machine. Committing locally is unnecessary but harmless (local commits land too); a deterministic workflow step commits leftover edits, and the workflow's landing job then pushes the branch (which re-runs CI) and posts your final message for you. $verify"
            if [ -n "${CONFLICTS:-}" ]; then
              echo "MERGE CONFLICT RESOLUTION — do this FIRST, before the task below. A merge of origin/$SYNC_BASE into this branch is already IN PROGRESS in your working tree and conflicts in these files:"
              sed 's/^/  /' <<<"$CONFLICTS"
              [ -n "${SYNC_APPEND:-}" ] && echo "$SYNC_APPEND"
              echo "Resolve every conflict by editing those files, preserving BOTH sides' intent — the base side is other people's merged work, so never resolve by discarding it wholesale. Local git is available and useful here (git status, git diff, git log, git add <file>); the GitHub-facing commands the CONSTRAINTS above forbid (gh, git fetch, git push) stay forbidden, and you must NOT run git merge, git rebase or git checkout of any ref — that would strand the in-progress merge. After resolving each file you MUST stage it with git add <file>: the landing step FAILS the run on any path still unmerged in the index (that index check is what catches binary and modify/delete conflicts, which have no markers), and on any surviving conflict marker — so leaving either is strictly worse than resolving and staging. Once resolved, treat the MERGED tree as the code you are working on: re-run the relevant tests against it, not against the pre-merge state."
            elif [ -n "${MERGE_SHA:-}" ] && [ -n "${SYNC_APPEND:-}" ]; then
              # Clean merge: the repo-specific merge rule still applies (the
              # fork's is about a NON-conflicting CHANGELOG mis-merge).
              echo "BASE MERGE NOTE: a workflow step already merged origin/$SYNC_BASE into this branch before you started (a clean merge, no conflicts). Review that merge result against the following before the task below, and fix it in the working tree if it is off:"
              echo "$SYNC_APPEND"
            fi
            echo "ENDING CONTRACT: your final message MUST start with a single conventional-commit summary line for the fix (it becomes the commit subject), then a blank line, then a body explaining the root cause and the fix (posted as a comment). If you cannot fix it, leave the tree untouched and explain what is blocking."
            echo ""
            echo "FAILING CI LOG (run $CI_RUN_ID, failed jobs, tail):"
            fetch "$RUNNER_TEMP/codex-ci-log.txt" run view "$CI_RUN_ID" --repo "$REPO" --log-failed
            tail -c 100000 "$RUNNER_TEMP/codex-ci-log.txt"
          } >"$RUNNER_TEMP/codex-prompt.md"

      - name: Run Codex CI fix
        id: codexfix
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          safety-strategy: unprivileged-user
          codex-user: codex
          model: ${{ inputs.codex_model }}
          effort: ${{ inputs.codex_effort }}
          permission-profile: workspace_net
          # workflow_run's actor is the CI run's actor: normally the machine
          # account (a User with write today — passes the action's built-in
          # check; the App's bot login under Phase 2 — TRUSTED_LOGINS, as the
          # Claude step's allowed_bots), but a branch the Claude App pushed
          # (mixed-engine PR relabeled mid-loop) makes it the claude bot —
          # allow that one too, matching the other codex steps.
          allow-bot-users: ${{ format('claude,{0}', env.TRUSTED_LOGINS) }}
          prompt-file: ${{ runner.temp }}/codex-prompt.md
          output-file: ${{ runner.temp }}/codex/codex-final.md

      # FIRST step after codex had write access to the tree, on every path
      # (always(): success, failure, cancelled): take .git back from the
      # codex user, refuse a redirected git dir (.git/commondir, symlinked
      # .git), and restore the pre-codex .git/config that `Create codex user`
      # snapshotted (design/codex-engine.md → Hook-safe landing). Runs BEFORE
      # the guard, the commit step, the manifest composer and emit-landing so
      # that every later git-running step reads a clean config regardless of
      # how codex ended; each of them is gated on this step having SUCCEEDED
      # (`== 'success'`, never `!= 'failure'`: a reclaim cancelled mid-run
      # must skip every later git call). Runs no git itself.
      - name: Reclaim workspace from codex
        id: codexreclaim
        if: always() && steps.codexuser.outcome == 'success'
        uses: meridianlabs-ai/agents/.github/actions/reclaim-codex-workspace@main

      # Token split for the codex run: the CLI's step-log "tokens used" is one
      # blended number (non-cached input + output), so this reads the session
      # rollout codex wrote under its CODEX_HOME and puts input / cached /
      # output / reasoning counts and the model that served in the job
      # summary — the codex counterpart of the Claude job's Model provenance
      # step. Runs right
      # after codex, before the commit step, so a commit failure can't hide
      # the spend. Best-effort: the script exits 0 on every path, and
      # continue-on-error makes that structural — a failure here must never
      # trip the commit step's implicit success() gate and strand the work.
      - name: Codex usage
        if: always()
        continue-on-error: true
        uses: meridianlabs-ai/agents/.github/actions/codex-usage@main
        with:
          requested-model: ${{ inputs.codex_model }}
          requested-effort: ${{ inputs.codex_effort }}

      # Unresolved-merge guard (shared composite): the commit step's `git add
      # -A` would happily stage conflict markers and `git commit` would then
      # produce a valid merge commit containing them, so this check is the
      # only thing between a half-resolved merge and the PR branch. A separate
      # step so the commit step below is skipped, not entered, on failure;
      # the Surface step reads this step's outcome, and so do the manifest
      # composer and emit-landing (read-only unless this step SUCCEEDED):
      # codex may commit locally, and a commit over staged-but-still-marked
      # paths completes the merge and moves HEAD past the start SHA, so the
      # push must key on this step, not on ancestry alone — as the old Land
      # codex fix step did. Also gated on the reclaim: a refused (redirected)
      # git dir must not be read at all.
      - name: Guard against an unresolved merge (codex)
        id: codexguard
        if: steps.codexfix.outcome == 'success' && steps.codexreclaim.outcome == 'success'
        uses: meridianlabs-ai/agents/.github/actions/unresolved-merge-guard@main
        with:
          conflicts: ${{ steps.sync.outputs.conflicts }}

      # The commit half of what used to be "Land codex fix": commit whatever
      # codex left in the tree, then write the de-fanged summary comment into
      # the landing directory for the land job to post. No push and no
      # credential here — the push is the land job's, from the bundle
      # emit-landing writes at the end of this job. First git-running step
      # after codex had write access to the workspace: the reclaim step above
      # already took .git back and restored the pre-codex .git/config (remote
      # URLs, credential/http keys, filter drivers, fsmonitor, hooksPath —
      # anything codex wrote there is gone), and this step trusts nothing
      # else under .git (design/codex-engine.md → hook-safe landing): the git
      # dir is pinned by env (GIT_DIR/GIT_COMMON_DIR/GIT_WORK_TREE), so a
      # .git/commondir file could not redirect git to a config codex owns
      # even if the reclaim's refusal had missed it (gitrepository-layout(5):
      # that file sets GIT_COMMON_DIR unless the env already does), and the
      # GIT_CONFIG_* env below re-pins the two things a config restore cannot:
      # hooks live as FILES in .git/hooks, so hooksPath points at an empty,
      # runner-only path; and the index may carry the fsmonitor extension, so
      # fsmonitor is off. The reclaim already moved .git/hooks aside and
      # appended the same two keys to the restored config for every later
      # step; the env pin here is belt and braces on the step that commits.
      # GIT_CONFIG_GLOBAL skips the runner's ~/.gitconfig as well: codex is
      # in the runner group, and a group-writable home file would sit outside
      # the restore (the hosted image ships it runner-only; this makes that
      # structural — identity for the commit is in the repo config the
      # reclaim restored).
      - name: Commit codex fix
        id: codexcommit
        if: steps.codexguard.outcome == 'success'
        env:
          PR: ${{ needs.gate.outputs.pr }}
          ATTEMPT: ${{ needs.gate.outputs.attempt }}
          OUT: ${{ runner.temp }}/codex/codex-final.md
          DIR: ${{ runner.temp }}/landing
          START_SHA: ${{ steps.base.outputs.sha }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          GIT_DIR: ${{ github.workspace }}/.git
          GIT_COMMON_DIR: ${{ github.workspace }}/.git
          GIT_WORK_TREE: ${{ github.workspace }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: ${{ runner.temp }}/no-hooks
          GIT_CONFIG_KEY_1: core.fsmonitor
          GIT_CONFIG_VALUE_1: "false"
        run: |
          set -euo pipefail
          mkdir -p "$DIR"
          # MERGE_HEAD too: a conflict resolution staged byte-identical to
          # HEAD ("ours" on every hunk) leaves status clean while the merge
          # is still in progress — commit anyway so the merge completes,
          # HEAD moves past START_SHA, and the landing lands it.
          # --ignore-submodules=dirty: never spawn `git status` inside an
          # embedded repo (is_submodule_modified) — its nested .git/config
          # is codex-writable and outside the restore and the pins. The
          # reclaim step already refuses a nested repo codex added; this is
          # belt and braces, and `dirty` (unlike `all`) still reports a
          # changed gitlink pointer. `git add -A` below cannot be pinned the
          # same way, which is why the refusal is the primary defence.
          if [ -n "$(git status --porcelain --ignore-submodules=dirty)" ] || git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            # || true inside the substitution: without it a missing/unreadable
            # $OUT fails the pipeline and set -e kills the step before the
            # fallback is reached — the fallback would only ever cover an
            # empty first line.
            subject=$(head -n1 "$OUT" 2>/dev/null | cut -c1-120 || true)
            [ -n "$subject" ] || subject="codex: fix failing CI on PR #$PR"
            git add -A
            git commit --quiet -m "$subject" -m "Co-Authored-By: Codex <noreply@openai.com>"
          fi
          # Landable work = HEAD moved since the run started, not just a
          # dirty tree: the prompt calls local commits unnecessary but they
          # are possible, and a status-only check would silently discard
          # them with the runner. emit-landing bundles START_SHA..HEAD at the
          # end of the job and the land job pushes it to the PR head branch
          # (refusing a HEAD that does not descend from START_SHA — loud, not
          # lossy); here the outcome only shapes the summary's first line.
          committed=""
          merge_only=""
          if [ "$(git rev-parse HEAD)" != "$START_SHA" ]; then
            committed=1
            # HEAD still exactly the runner's clean base merge: codex changed
            # nothing (any commit above would have moved it), so say so
            # rather than announcing a fix over a summary that says nothing
            # needed changing. Still lands — the push is what re-runs CI (a
            # computable merge ref again) — and still owes the @review the
            # manifest carries; the re-review re-reads the now-current code.
            # The headers say "committed", not "pushed": this step cannot
            # know the push happened (emit-landing may still lose the bundle
            # and drop the hand-back, and the land job posts the comments
            # either way), so the wording claims only what is true here.
            [ -n "${MERGE_SHA:-}" ] && [ "$(git rev-parse HEAD)" = "$MERGE_SHA" ] && merge_only=1
            echo "committed $(git rev-parse --short HEAD) on the branch${merge_only:+ (base merge only)} — the land job pushes it"
          fi
          # The summary goes to the PR either way (a no-change round IS the
          # blocker comment the ending contract calls for) — posted by the
          # land job AFTER its push succeeded (its Post step follows the
          # push; the headers below still say "committed", not "pushed",
          # because a lost bundle drops the push but not the comment),
          # de-fanged: it posts from a write-access account, and the loops
          # match their verdict/handoff markers with plain substring
          # contains() — codex QUOTING a marker would forge a verdict or
          # suppress an owed hand-back, so break those substrings too. The
          # list here includes the review-comment anchor marker and the codex
          # reviewer's engine footer: this summary posts as marvin, a machine
          # author the review-fix rounds' anchor selection trusts, so a CI-fix
          # summary echoing either would be taken for the newest review by
          # the next fix round on the same PR. The land job's `defang`
          # (land/lib.sh) repeats the trigger and marker rules (two layers,
          # so neither can drift to zero) but deliberately NOT the footer:
          # `land` is shared with claude-review.yml, which posts the codex
          # reviewer's own footer through it as the anchor. So the footer sed
          # lives only here and in the Claude-path bodies below (the relay's
          # agent-summary.md and the Surface step's embedded summary); keep
          # the three copies in step.
          {
            if [ -n "$merge_only" ]; then
              printf '🤖 auto (codex, CI-fix attempt %s): base merge only, no fix this attempt — details below.\n\n' "$ATTEMPT"
            elif [ -n "$committed" ]; then
              printf '🤖 auto (codex, CI-fix attempt %s): fix committed — summary below.\n\n' "$ATTEMPT"
            else
              printf '🤖 auto (codex, CI-fix attempt %s): no fix this attempt — details below.\n\n' "$ATTEMPT"
            fi
            sed -E -e 's/@(review|claude|auto)/`\1`/g' \
                   -e 's/claude-review-(summary|verdict|comment)/claude-review \1/g' \
                   -e 's/engine: codex/engine  codex/g' \
                   -e 's/auto-(handoff|review-rounds|review-head|fix-attempts)/auto \1/g' \
                   "$OUT" 2>/dev/null || echo "(codex produced no final message)"
          } >"$DIR/codex-comment.md"
          # GitHub caps comment bodies at 65,536 characters and codex's final
          # message is unbounded; a post failing there would lose the summary
          # for work that already landed. Truncate with a note instead —
          # cutting the de-fanged body can't resurrect a trigger or marker
          # (the sed removed the @ / split the substrings, and truncation
          # only drops trailing bytes). 59,000, not 60,000: the land job's
          # own de-fang re-caps at 60,000, and the note below must fit under
          # THAT cap or the second truncation would drop it.
          if [ "$(wc -c <"$DIR/codex-comment.md")" -gt 59000 ]; then
            head -c 59000 "$DIR/codex-comment.md" >"$DIR/codex-comment.trunc"
            printf '\n\n_[truncated: codex output exceeded the comment size cap]_\n' >>"$DIR/codex-comment.trunc"
            mv "$DIR/codex-comment.trunc" "$DIR/codex-comment.md"
          fi
          echo "codex summary: $(wc -c <"$DIR/codex-comment.md") bytes — posted by the land job."
      # ---- end Codex engine ---------------------------------------------------

      # Surface agent errors: a failed step anywhere on the path (the commit
      # step is deterministic, so a completed codex run cannot strand its
      # edits the way the Claude job's agent can). This job cannot post the
      # ⚠️ itself any more (the comment must come from an account whose posts
      # are read, and this job holds no such token): the message is written
      # to a file the landing manifest carries as `error` with fail_run true,
      # and the LAND job posts it — de-fanged, as the machine account — and
      # fails the run AFTER everything else landed. So this step exits 0 on
      # every path: the red X is the land job's.
      - name: Surface agent errors
        id: surface
        if: always()
        env:
          BASE_OUTCOME: ${{ steps.base.outcome }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          SYNC_CONFLICTS: ${{ steps.sync.outputs.conflicts }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          CODEXPREP_OUTCOME: ${{ steps.codexprep.outcome }}
          CODEXCOMPOSE_OUTCOME: ${{ steps.codexcompose.outcome }}
          CODEXUSER_OUTCOME: ${{ steps.codexuser.outcome }}
          CODEXHOME_OUTCOME: ${{ steps.codexhome.outcome }}
          CODEX_OUTCOME: ${{ steps.codexfix.outcome }}
          CODEXRECLAIM_OUTCOME: ${{ steps.codexreclaim.outcome }}
          CODEXGUARD_OUTCOME: ${{ steps.codexguard.outcome }}
          CODEXCOMMIT_OUTCOME: ${{ steps.codexcommit.outcome }}
          # The gate job's lookup (trusted: computed as marvin before any PR
          # code ran); the land job de-fangs the body it lands in anyway.
          MENTION: ${{ needs.gate.outputs.mention }}
          ERROR_FILE: ${{ runner.temp }}/agent-error.md
        run: |
          set -uo pipefail
          rm -f "$ERROR_FILE"
          err=""
          # The checkout, the persisted-credential assertion or the SHA step
          # failed: nothing else ran. The SHA step has no always(), so a
          # failed checkout OR a tripped assertion (the composite exits 1)
          # leaves it SKIPPED, not failed — test for anything but success,
          # and name all three causes so a tripped security invariant is not
          # read as a checkout hiccup and blindly re-triggered.
          if [ "${BASE_OUTCOME:-}" != "success" ]; then
            err="checking out the PR branch, verifying no credential was persisted in the workspace, or reading the branch SHA failed before the agent started, or the checked-out tip was no longer the head the failed run tested (the branch moved since the gate bound the run) — see the job logs for which; no fix was attempted. A moved branch needs nothing: its own CI run drives the next round. Re-trigger to retry only if it was the checkout or the SHA read; a persisted credential is a workflow bug, not a transient."
          fi
          # The base-branch sync died before the agent started (a transient
          # gh/fetch error, or its own loud non-conflict merge failure). Every
          # downstream step is SKIPPED, not failed, so no other branch below
          # fires; the attempt the gate recorded is refunded by the land job
          # (the agent never launched, nothing lands) — without this the
          # failure is a silent stall with the board at Agent.
          if [ -z "$err" ] && [ "${SYNC_OUTCOME:-}" = "failure" ]; then
            err="the base-branch sync step failed before the agent started (a transient gh/fetch error, or a base merge that failed without content conflicts — see the job logs); no fix was attempted. Re-trigger to retry."
          fi
          # Provisioning died before the agent started: same shape as the sync
          # failure above — the agent steps are SKIPPED and without this the
          # job is a silent red with the board parked at Agent. Unlike the
          # sync failure (which exits before merge_sha is written), the
          # runner's clean base merge, if there was one, is still above the
          # start SHA here, so emit-landing bundles it and the land job
          # pushes it — re-running CI — and posts the re-review request, even
          # though no fix was attempted. That is the right outcome (the
          # branch stays current, and the re-run finds nothing left to merge,
          # so a deterministic failure repeats this comment at most once more
          # and then stops rather than looping), but the wording below says
          # so instead of claiming nothing moved. A DETERMINISTIC cause is
          # named too: on this loop, red CI can be caused by the PR's own
          # dependency change (a pyproject.toml that no longer installs),
          # which now fails provisioning on every trigger — before 2026-09-09
          # the Claude engine would have attempted that class of fix;
          # accepted, it mirrors the dev agent's and reviewer's fatal stance,
          # but "re-trigger" is wrong advice for it, so the message says to
          # fix it by hand. EXCEPT on the conflict path (SYNC_CONFLICTS
          # non-empty): there the provisioning step is continue-on-error,
          # the round ran static-only with the failure spelled out in codex's
          # prompt, and the later clauses judge what it did — so a failure
          # there is a log warning, not an error, and "re-trigger to retry"
          # (wrong advice for a conflicted dependency file, which fails
          # identically every time) is never given for it.
          if [ -n "${SYNC_CONFLICTS:-}" ]; then
            if [ "${SETUP_OUTCOME:-}" = "failure" ]; then
              echo "::warning::environment provisioning failed on a conflicted round (conflicts in: $(tr '\n' ' ' <<<"$SYNC_CONFLICTS" | sed 's/ *$//')); the fix agent ran static-only and was told so."
            fi
          elif [ -z "$err" ] && [ "${SETUP_OUTCOME:-}" = "failure" ]; then
            err="environment provisioning (the uv dev-install, run as the codex user) failed before the fix agent started — a transient dependency-download/network error, the project not dev-installing on a bare runner, a dependency file the base merge touched, or this PR's own dependency change no longer installing (those fail identically on every trigger: fix it by hand — check the job logs); no fix was attempted, though the runner's clean base merge, if there was one, was still landed on the branch. Re-trigger if it looks transient."
          fi
          if [ -z "$err" ] && [ "${CODEXPREP_OUTCOME:-}" = "failure" ]; then
            err="the codex workspace-preparation step failed before the agent started — no fix was attempted (see the job logs)."
          fi
          if [ -z "$err" ] && [ "${CODEXCOMPOSE_OUTCOME:-}" = "failure" ]; then
            err="composing the codex prompt (the failing CI log fetch) failed before the agent started — no fix was attempted (a gh/API error that outlasted three attempts? — see the job logs)."
          fi
          # A failed codex-user setup SKIPS the codex step, so it needs its
          # own check or the failure is a silent red job.
          if [ -z "$err" ] && [ "${CODEXHOME_OUTCOME:-}" = "failure" ]; then
            err="resetting the codex home after provisioning failed before the agent started — processes were still running as codex after repeated kills (a provisioning survivor?) or the home could not be re-created (see the job logs); nothing was attempted."
          fi
          if [ -z "$err" ] && [ "${CODEXUSER_OUTCOME:-}" = "failure" ]; then
            err="the codex user setup failed before the agent started — no fix was attempted (a runner-image change breaking adduser/usermod? — see the job logs)."
          fi
          if [ -z "$err" ] && [ "${CODEX_OUTCOME:-}" = "failure" ]; then
            err="the codex fix step failed (missing OPENAI_API_KEY, or a codex-action error — see the job logs)."
          fi
          # A reclaim that did not succeed SKIPS the guard, the commit step
          # and every later git call (the manifest composer skips git and
          # emit-landing runs read-only whenever the guard did not succeed,
          # which a skipped guard is): on this path .git is still the
          # codex-written one (a refusal, a failed restore, or a job cancel
          # that landed mid-reclaim — outcome `cancelled`, not `failure`, with
          # the kill/chown/restore only partly done). `!= success` mirrors
          # the other step gates; the codexuser test keeps the Claude path's
          # `skipped` reclaim from tripping it.
          if [ -z "$err" ] && [ "${CODEXUSER_OUTCOME:-}" = "success" ] && [ "${CODEXRECLAIM_OUTCOME:-}" != "success" ]; then
            err="codex finished but the workspace could not be reclaimed from it (reclaim step outcome: ${CODEXRECLAIM_OUTCOME:-unknown}) — processes were still running as codex after repeated kills, .git is not a plain directory or a .git/commondir redirect exists, codex left an embedded git repository in the tree (a git init or git worktree add under the checkout — the false-alarm case in design/codex-engine.md → Hook-safe landing), the pre-codex git config could not be restored, or the job was cancelled mid-reclaim (see the job logs); nothing was landed. Inspect the codex run's transcript before re-triggering."
          fi
          # A failed guard SKIPS the commit step, so it needs its own check.
          # "nothing was landed" holds because the manifest composer and
          # emit-landing go read-only on a guard that did not succeed: a
          # local commit codex made over the markers is never bundled.
          if [ -z "$err" ] && [ "${CODEXGUARD_OUTCOME:-}" = "failure" ]; then
            err="codex finished but left the base merge unresolved (an unmerged index or surviving conflict markers — see the job logs); nothing was landed. Resolve and stage the conflicts manually, or drop the engine:codex label to use the Claude path."
          fi
          if [ -z "$err" ] && [ "${CODEXCOMMIT_OUTCOME:-}" = "failure" ]; then
            # The guard succeeded on this path, so codex's own local commits
            # (if any) still land through ancestry; only the runner's commit
            # of its leftover edits is lost — say so, rather than "nothing".
            err="codex finished but committing its leftover edits failed — codex's own local commits, if any, still land; its uncommitted edits did not (see the job logs)."
          fi
          [ -z "$err" ] && { echo "No agent error detected."; exit 0; }
          echo "::error::CI-fix run did not complete: $err — the land job posts the note and fails the run."
          cc=""
          [ -n "${MENTION:-}" ] && cc=$(printf '\n\ncc @%s' "$MENTION")
          printf '⚠️ The auto CI-fix run did not complete:\n\n> %s\n\nIf this looks transient (model API capacity/overload), CI will re-trigger it on the next push or you can re-run the workflow; otherwise it likely needs a human.%s\n' "$err" "$cc" >"$ERROR_FILE"

      # Everything the land job pushes, posts or moves, as ONE JSON object for
      # emit-landing's manifest-extra (schema: .github/actions/emit-landing/
      # README.md). Body text goes in as files under the landing directory,
      # referenced by name; the manifest itself is DATA the land job
      # validates before acting. Fields:
      #   handback  — true when HEAD moved past the start SHA (and descends
      #               from it, the same test emit-landing applies before it
      #               bundles — a rebased HEAD lands nothing and must owe
      #               nothing): the loop's rule, a run that landed a commit
      #               owes exactly one `@review`. The runner's base merge
      #               counts (a merge-only round moves HEAD), so the
      #               "pushed but no hand-back" failure mode the deleted
      #               backstops covered cannot occur — the hand-back is a
      #               field of the same manifest as the push — and the
      #               converse holds too: emit-landing drops handback and
      #               stage when it drops the bundle (HEAD moved, no bundle
      #               written), so no bare `@review` posts for a round whose
      #               work was lost. Owed on ancestry — but only for a round
      #               whose agent step did not FAIL: a Claude step that
      #               ended `failure` (the action's actor refusal, a
      #               bootstrap failure, max-turns or an is_error result
      #               mid-fix — indistinguishable from outside the action)
      #               lands nothing and owes nothing, its commits included,
      #               and its attempt is refunded (finding 4628657, review
      #               rounds 1–3; the rule and its cost are on the composer
      #               step below and in design/auto-agent.md). From #82 to
      #               2026-09-22 such a step landed its commits with the ⚠️
      #               alongside; that was dropped because the only evidence
      #               that the agent had run at all — the action's
      #               execution-file output — is one a PR file can forge.
      #   stage     — never set here. A hand-back is mid-flight (the
      #               reviewer runs next), and a card stays at Agent while
      #               any agent of the loop is still to run; Review is the
      #               gate's, on escalation — the loop's end (one rule for
      #               every loop, design/atlas-tracking.md; Ransom,
      #               2026-09-18 — until then the hand-back set Review too).
      #   comments  — codex's final message (engine codex; the commit step
      #               wrote it, de-fanged), or — the Claude path's analogue,
      #               so a round that gave up is not silent — the agent's
      #               final message when it committed nothing and the run
      #               succeeded: HEAD still at the start SHA, or exactly the
      #               runner's clean base merge (a merge-only round: the
      #               merge lands and owes its hand-back, but the agent
      #               committed nothing — the codex path's merge_only header
      #               is the same rule). The blocker explanation the prompt
      #               asks for; when the Surface step already reported the
      #               round, its message carries the summary instead.
      #   provenance_comment_file — the model-provenance note, if any
      #   error     — the Surface step's message (fail_run: true)
      # Not set -e: a manifest must come out of every path. On the codex path
      # (the ENGINE the gate resolved — not `codexuser.outcome`, which is
      # `skipped`/`failure` when the prep or user-setup step failed and
      # would let those two fall through to the ancestry branch, landing
      # the runner's base merge and keeping the attempt where the Surface
      # strings, the refund and the docs all say nothing lands) the git
      # reads are skipped (handback false) unless the unresolved-merge guard
      # SUCCEEDED — the same condition emit-landing's read-only takes, so
      # nothing above the start SHA is packaged either. The guard is itself
      # gated on the codex step and the reclaim having succeeded, and both
      # of those on the user setup, so "guard did not succeed" covers every
      # codex-path failure: a failed prep or user-setup step (no codex
      # process ran; the base merge, if any, stays unpushed and the round
      # is refunded, as before the split), a failed codex step (its partial
      # local commits are never pushed — as before the split, when the
      # landing step was gated on the run step), a reclaim that did not
      # succeed (nothing lands from a workspace codex still owns), and a
      # guard that FAILED — codex may commit locally, and `git commit` over
      # staged-but-still-marked paths completes the base merge, so HEAD moves
      # past the start SHA with conflict markers in the tree; keying on
      # ancestry alone would bundle and push that as marvin, request the
      # re-review and only then post an error saying nothing landed. The
      # guard is the enforcement point (design/architecture.md → The landing
      # step is the enforcement point), so its failure withholds the push
      # here as it withheld the old Land codex fix step. Post-codex git, so
      # the git dir is pinned by env like the guard and the commit step
      # (AGENTS.md; the reclaim's refusal of a redirect is the primary
      # defence, this is belt and braces).
      #
      # The Claude path has the same withholding for a step that FAILED, for
      # any reason: the action's own actor-permission refusal, a bootstrap
      # failure before Claude started, or a failure during the run. The
      # three cannot be told apart from outside the action — its
      # `execution_file` output is not launch evidence, since its error
      # handler publishes whatever file sits at the default path, which the
      # PR's provisioning step can pre-create (review rounds 1 and 2 of
      # finding 4628657's fix: a preseeded file read as "launched" and let a
      # refused round bundle the base merge and dodge its refund). So the
      # rule is fail-closed on the step's OUTCOME, a runner fact no PR file
      # can forge: a failed Claude step lands nothing — no git, no
      # hand-back, not the runner's base merge, not a commit Claude may have
      # made before failing — and the refund (agent step not successful,
      # nothing pushed) gives the attempt back. Before finding 4628657 such a
      # round still bundled the runner's clean base merge (and its commits),
      # so a declined authorization pushed a marvin commit, re-ran CI and
      # kept its attempt while the codex path's failure landed nothing; the
      # two engines now agree. A round whose agent step was SKIPPED (a
      # provisioning failure) is unchanged: the Surface step's provisioning
      # clauses document that the base merge lands there (decision
      # 2026-09-09).
      - name: Compose landing manifest
        id: landing
        if: always()
        env:
          DIR: ${{ runner.temp }}/landing
          EXTRA: ${{ runner.temp }}/landing-extra.json
          PR: ${{ needs.gate.outputs.pr }}
          ATTEMPT: ${{ needs.gate.outputs.attempt }}
          START_SHA: ${{ steps.base.outputs.sha }}
          CODEXGUARD_OUTCOME: ${{ steps.codexguard.outcome }}
          CODEXCOMMIT_OUTCOME: ${{ steps.codexcommit.outcome }}
          ERROR_FILE: ${{ runner.temp }}/agent-error.md
          GIT_DIR: ${{ github.workspace }}/.git
          GIT_COMMON_DIR: ${{ github.workspace }}/.git
          GIT_WORK_TREE: ${{ github.workspace }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: ${{ runner.temp }}/no-hooks
          GIT_CONFIG_KEY_1: core.fsmonitor
          GIT_CONFIG_VALUE_1: "false"
        run: |
          set -uo pipefail
          mkdir -p "$DIR"
          extra='{}'
          moved=false
          head=""
          if [ "${CODEXGUARD_OUTCOME:-}" != "success" ]; then
            echo "landing: the codex unresolved-merge guard did not succeed (outcome: ${CODEXGUARD_OUTCOME:-unknown} — a failed prep, user-setup, provisioning, codex or reclaim step skips it); running no git — nothing lands and no hand-back is owed."
          elif [[ "${START_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            head=$(git rev-parse HEAD 2>/dev/null || echo "$START_SHA")
            if [ "$head" != "$START_SHA" ] && git merge-base --is-ancestor "$START_SHA" "$head" 2>/dev/null; then
              moved=true
            fi
          fi
          if [ "$moved" = "true" ]; then
            extra=$(jq -c '.handback = true' <<<"$extra")
          fi
          # The summary the commit step wrote (its header already says
          # whether this was a fix, a base merge alone, or no change).
          if [ "${CODEXCOMMIT_OUTCOME:-}" = "success" ] && [ -s "$DIR/codex-comment.md" ] && [[ "$PR" =~ ^[0-9]+$ ]]; then
            extra=$(jq -c --argjson n "$PR" '.comments = [{number: $n, body_file: "codex-comment.md"}]' <<<"$extra")
          fi
          if [ -s "$ERROR_FILE" ]; then
            extra=$(jq -c --rawfile msg "$ERROR_FILE" '.error = {message: $msg, fail_run: true}' <<<"$extra")
          fi
          printf '%s\n' "$extra" >"$EXTRA"
          echo "landing: moved=$moved $(jq -c 'if .error then .error.message = "<\(.error.message | length) chars>" else . end' <<<"$extra")"

      # Last, always: package the commits above the start SHA and the
      # manifest for the land job. The PR number is the gate job's trusted
      # lookup, the SAME value the land job gets (README → Using the pair):
      # the validator pins the manifest's pr_number to it and its branch to
      # that PR's live head ref. read-only unless the unresolved-merge guard
      # succeeded (the composer's condition, see its comment; a failed prep,
      # user-setup, provisioning, codex or reclaim step skips the guard): a
      # reclaim that did not succeed skips the guard, and no git may run
      # against a workspace codex still owns; a FAILED guard means conflict
      # markers survive in the tree, and a local commit codex made over them
      # must not be bundled — read-only packages nothing above the start SHA.
      # Either way the manifest still carries the Surface step's error for
      # the land job to post (the README's snippet skips the step outright
      # there; here the report matters more than the empty bundle).
      - name: Emit landing manifest
        if: always()
        uses: meridianlabs-ai/agents/.github/actions/emit-landing@main
        with:
          # When the checkout (or the SHA step) failed, `steps.base` is empty
          # and an empty start_sha would be refused at `validate` — and the
          # land composite posts the manifest's error only from a VALIDATED
          # manifest, so the Surface step's checkout-failure message would be
          # lost to the log. With no repo there is nothing to bundle either
          # way; github.sha (always 40 hex; the default-branch head on
          # workflow_run) is a trusted, well-formed placeholder.
          start-sha: ${{ steps.base.outputs.sha || github.sha }}
          branch: ${{ inputs.head_branch }}
          pr-number: ${{ needs.gate.outputs.pr }}
          manifest-extra: ${{ runner.temp }}/landing-extra.json
          read-only: ${{ steps.codexguard.outcome != 'success' && 'true' || 'false' }}


  # TRUSTED, last: a fresh runner that checks out nothing and installs
  # nothing. The `land` composite is the whole landing — download, validate,
  # push the bundled commits as marvin (re-running CI), post the codex or
  # no-change summary, post exactly `@review` when a commit landed, move the
  # stage to Review, post the provenance note, report the agent error and
  # fail the run when it says so — then the attempt refund. always(): a fix
  # job that failed still gets its error posted and its attempt refunded;
  # with no artifact at all (runner killed mid-agent) the composite fails
  # its download, lands nothing, and says so on the PR. A CANCELLED fix job
  # skips the Land step but still gets its refund (see the step gates).
  #
  # Gated on the gate job having SUCCEEDED, not only on its `act` output: a
  # gate that failed after writing act=fix — `Record attempt` is the
  # realistic case, one un-retried `gh api` write under set -e — skips the
  # fix job (`needs.fix.result` is `skipped`), so there is no artifact to
  # land, and whether the attempt was recorded is unknown; landing would
  # post "Landing failed at step(s): download" on the PR for a round that
  # never started, and refunding might write one BELOW the true count
  # (weakening the kill-switch). Neither runs: a red gate job with nothing
  # on the PR, as a Record-attempt failure was before the split.
  land:
    needs: [gate, fix, fix-codex]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.act == 'fix'
    runs-on: ubuntu-latest
    env:
      # The result and agent outcome of the ONE fix job the gate's engine
      # selected (the other is `skipped`, with empty outputs): what the
      # steps below gate on.
      AGENT_RESULT: ${{ needs.gate.outputs.engine == 'codex' && needs.fix-codex.result || needs.fix.result }}
      AGENT_OUTCOME: ${{ needs.gate.outputs.engine == 'codex' && needs.fix-codex.outputs.agent_outcome || needs.fix.outputs.agent_outcome }}
    # Every write here is marvin's (the land composite's `token`, the refund's
    # GH_TOKEN); the job token only reads — the artifact, the PR head ref
    # and default branch, the start SHA fetch.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read           # artifact download
    steps:
      # The machine account's token for this job (see the gate job's mint
      # step): scoped to THIS repository and to the landing's writes — the
      # push (contents), the `@review` hand-back, the codex summary and the
      # attempt refund (issues), the PR-side posts (pull requests), the
      # stage move (the org's Atlas project). Follow-up issues are refused
      # here (`allowed-issue-repos: ""`), so no other repository is in
      # scope. Revoked when the job ends.
      - name: Mint the machine account's token
        id: mint
        uses: actions/create-github-app-token@v2
        with:
          # `app-id` accepts the App ID or the Client ID; v2 has no client-id input.
          app-id: ${{ secrets.MARVIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
          owner: meridianlabs-ai
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-organization-projects: write
          # The revalidation reads the failed run back, as the gate did.
          permission-actions: read

      # Skipped when the fix job was cancelled (claude-review.yml's land job
      # skips the same way). The usual cause is the concurrency group: its
      # ordering is arbitrary, so run N's pending `fix` can lose the group to
      # run N+1's `gate` and then be cancelled as the OLDER pending job when
      # N+1's `fix` queues — a round whose agent never started. Landing it
      # would fail the artifact download and post "Landing failed" on the PR
      # for nothing. A run cancelled by hand mid-agent is skipped too: its
      # partial commits are not pushed and re-reviewed on the strength of an
      # always(). The step is gated, not the job, so the refund below still
      # runs and gives back the attempt the gate recorded. `skipped` is
      # excluded too — the job-level gate on the gate job's success already
      # rules it out (a fix job is skipped only when its gate did not
      # succeed), so the test is belt and braces for the same "no artifact,
      # no agent" shape should the job gate ever loosen.
      # Revalidate the run's context before anything is pushed (finding
      # 4628657): the same derivation the gate made, from the API again, in
      # this trusted job — the run is still this event's own failed
      # pull_request run at the same attempt, it still binds to the one
      # same-repo PR from the branch open when it was created, that PR is
      # the gate's, still open, with the same base and its head still at the
      # SHA the run tested. A PR retargeted, a branch pushed, a run re-run
      # or a closed PR from the branch reopened during the round withholds
      # the landing (the step below says so on the PR the GATE bound and
      # fails the job); a PR opened during the round does not — created
      # after the run, it cannot be the run's origin. Nothing the agent job
      # uploaded is consulted for any of it. Same skip as the Land step: a
      # cancelled or skipped fix job has nothing to land, and the refund
      # below still runs.
      - name: Revalidate the run binding
        id: rebind
        if: env.AGENT_RESULT != 'cancelled' && env.AGENT_RESULT != 'skipped'
        uses: meridianlabs-ai/agents/.github/actions/bind-ci-run@main
        with:
          token: ${{ steps.mint.outputs.token }}
          repo: ${{ github.repository }}
          run-id: ${{ inputs.ci_run_id }}
          event-name: ${{ github.event_name }}
          event-run-id: ${{ github.event.workflow_run.id }}
          event-run-attempt: ${{ github.event.workflow_run.run_attempt }}
          expect-head-branch: ${{ inputs.head_branch }}
          expect-pr: ${{ needs.gate.outputs.pr }}
          trusted-logins: ${{ env.TRUSTED_LOGINS }}
          revalidate: "true"
          expect-head-sha: ${{ needs.gate.outputs.head_sha }}
          expect-base-ref: ${{ needs.gate.outputs.base_ref }}
          expect-run-attempt: ${{ needs.gate.outputs.run_attempt }}

      - name: Land
        id: land
        if: env.AGENT_RESULT != 'cancelled' && env.AGENT_RESULT != 'skipped' && steps.rebind.outputs.ok == '1'
        uses: meridianlabs-ai/agents/.github/actions/land@main
        with:
          # The machine account (the minted app token), no fallback: the
          # gate already failed when the app secrets were absent (a
          # job-token push would not re-run CI and a job-token `@review`
          # would not trigger the reviewer).
          token: ${{ steps.mint.outputs.token }}
          # The gate job's PR lookup — trusted, computed before any PR code
          # ran, reproduced by the revalidation above, and the SAME value
          # emit-landing got: the validator pins the manifest's pr_number to
          # it, and it is where the final report goes when the manifest
          # never validated (missing artifact, tampered manifest).
          pr-number: ${{ needs.gate.outputs.pr }}
          # The PR's head ref: the gate's bind step required it to be the
          # run's head branch and the bound PR's head ref, and the
          # revalidation just did again, so it is the PR's live headRefName
          # and the validator's pin for the manifest's branch — no lookup of
          # its own needed.
          pr-head-ref: ${{ inputs.head_branch }}
          # The CI-fix manifest never files follow-up issues; an empty
          # allow-list makes the validator refuse any that appear.
          allowed-issue-repos: ""

      # The revalidation refused: say so where the gate bound the run (the
      # only PR this run may write to), trigger-free like every bot comment
      # here, and fail the job so the refusal is a red X, not a quiet skip.
      # The attempt is NOT refunded here (the refund's condition is the
      # agent never having run): the round ran; it is its landing that the
      # changed context withheld, and the branch's own next CI run drives
      # the next round.
      - name: Report withheld landing
        if: ${{ !cancelled() && steps.rebind.outcome == 'success' && steps.rebind.outputs.ok != '1' }}
        uses: meridianlabs-ai/agents/.github/actions/post-pr-comment@main
        with:
          token: ${{ steps.mint.outputs.token }}
          repo: ${{ github.repository }}
          pr: ${{ needs.gate.outputs.pr }}
          body: "⚠️ auto: the CI-fix round's landing was withheld — the run's context changed while the agent worked: ${{ steps.rebind.outputs.reason }} Nothing was pushed or posted from this round; the branch's next CI run starts the next one."
          what: withheld-landing note

      - name: Fail on a withheld landing
        if: ${{ !cancelled() && steps.rebind.outcome == 'success' && steps.rebind.outputs.ok != '1' }}
        env:
          REASON: ${{ steps.rebind.outputs.reason }}
        run: |
          echo "::error::land: the landing was withheld — $REASON"
          exit 1

      # Infra crashes must not burn fix attempts: the counter increments in
      # the gate job, BEFORE the agent runs, but a round whose agent step did
      # not succeed and whose landing pushed nothing — a bootstrap failure
      # (observed: "socket hang up" before the agent started; two such blips
      # nearly escalated a PR spuriously), the action's own actor refusal, a
      # Claude failure during the run, a failed codex prep / user-setup /
      # run step (no fix reached the branch; a persistently missing
      # OPENAI_API_KEY must not burn attempts toward spurious escalation), or
      # a sync / provisioning failure that skipped the agent outright (before
      # the split the attempt was recorded after those steps; it cannot be
      # any more, so the refund covers it) — landed no fix. Roll the sticky
      # counter back one. Two conditions: the agent step did not succeed,
      # and the landing pushed nothing (a round whose commits landed keeps
      # its attempt whatever the agent step's outcome). There used to be a
      # third — "the agent never produced execution output" — so that a
      # Claude run that reached a result kept its attempt even when it
      # failed; it was dropped (finding 4628657, review round 2) because the
      # only evidence for it, the action's execution-file output, is
      # published by the action's error handler from a file the PR's
      # provisioning step can pre-create, and a forged "launched" both
      # admitted a bundle and blocked this refund. A crashing agent cannot
      # loop on refunds: nothing pushed means no CI re-run and no next
      # round until a human pushes. Never on a FAILED gate
      # (the job gate above): whether `Record attempt` ever incremented is
      # then unknown, and an unrecorded attempt refunded would put the count
      # one below the truth — not refunding is the conservative side.
      #
      # NOT serialized: this job is outside the per-PR concurrency group (the
      # gate's comment says why), so this write can interleave with the next
      # run's gate re-recording the same sticky comment — two workflow_run
      # completions for one PR close together (several named CI workflows)
      # plus an infra-crashed agent. Narrowed, not closed: the step
      # decrements the comment's CURRENT count instead of writing the gate's
      # stale `attempt - 1`, so a record the next gate made in between
      # survives in either order (refund after gate: k+1 → k, the live
      # attempt still counted; gate after refund: it reads k-1 and records
      # k). Only the two read-modify-writes crossing inside one window still
      # leaves the count one off. Accepted: the trigger is rare, the cost is
      # one attempt of slack in either direction, and an escalation still
      # drops the label and posts — never a silent stall.
      - name: Refund infra-crashed attempt
        if: >-
          always() && needs.gate.outputs.act == 'fix' &&
          env.AGENT_OUTCOME != 'success' &&
          steps.land.outputs.pushed != '1'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.gate.outputs.pr }}
          ATTEMPT: ${{ needs.gate.outputs.attempt }}
          CAP: ${{ inputs.fix_attempt_cap }}
          MARKER: "<!-- auto-fix-attempts -->"
        run: |
          set -uo pipefail
          # Same trusted read as the gate's (finding 4121987; the helpers are
          # copies of the gate's — keep them identical): the newest marker
          # comment by one of TRUSTED_LOGINS, else the newest by a
          # write-access account; any other login's is never PATCHed.
          # Best-effort throughout, like the rest of this step.
          ghr() {
            local n=0 out
            until out=$("$@"); do
              n=$((n+1))
              if [ "$n" -ge 4 ]; then return 1; fi
              sleep $((n*3))
            done
            printf '%s' "$out"
          }
          perms=""
          trusted_author() {
            local login="$1" perm
            [ -n "$login" ] || return 1
            case ",${TRUSTED_LOGINS// /}," in *",$login,"*) return 0 ;; esac
            case "$login" in *"[bot]") return 1 ;; esac
            case "$perms" in
              *"|$login="*) perm=${perms##*"|$login="}; perm=${perm%%"|"*} ;;
              *) perm=$(ghr gh api "repos/$REPO/collaborators/$login/permission" --jq '.permission') || perm=""
                 perms="$perms|$login=$perm|" ;;
            esac
            case "$perm" in admin|maintain|write) return 0 ;; *) return 1 ;; esac
          }
          parse_attempts() {
            local n
            [ "$(printf '%s' "$1" | grep -o 'attempts:' | wc -l | tr -d ' ')" = 1 ] || return 0
            n=$(printf '%s' "$1" | sed -n 's/.*attempts:[[:space:]]*\([^[:space:]]*\).*/\1/p')
            [[ "$n" =~ ^[0-9]{1,9}$ ]] && printf '%s' "$((10#$n))"
            return 0
          }
          cands=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate 2>/dev/null \
                    | jq -cs --arg m "$MARKER" '[.[][] | select(.body|contains($m)) | {id, login: (.user.login // ""), body}]' 2>/dev/null) || cands=""
          [ -n "$cands" ] || cands="[]"
          cid=$(jq -r --arg t "${TRUSTED_LOGINS// /}" '($t | split(",")) as $tl
                  | map(select(.login as $l | any($tl[]; . == $l))) | last | .id // empty' <<<"$cands")
          if [ -z "$cid" ]; then
            while IFS=$'\t' read -r id login; do
              [ -n "$id" ] || continue
              if trusted_author "$login"; then cid="$id"; break; fi
            done < <(jq -r 'reverse | .[] | [.id, .login] | @tsv' <<<"$cands")
          fi
          [ -z "$cid" ] && { echo "No counter comment from a trusted author found; nothing to refund."; exit 0; }
          # Re-read the count (same parse as the gate's) rather than trusting
          # the gate's value: the next run's gate may have re-recorded since,
          # and an escalation's reset may have zeroed it — a body without a
          # valid count reads as 0, as in the gate (the old fallback to this
          # run's ATTEMPT would have undone such a reset); never below zero.
          cur=$(parse_attempts "$(jq -r --argjson id "$cid" 'map(select(.id == $id)) | first | .body' <<<"$cands")")
          if [ -z "$cur" ]; then
            echo "Counter comment $cid carries no single valid 'attempts: N'; treating the count as 0."
            cur=0
          fi
          prev=$(( cur > 0 ? cur - 1 : 0 ))
          body="$MARKER
          🤖 auto CI-fix attempts: $prev (cap $CAP). (one attempt refunded — the fix agent never ran to a result and nothing landed: infrastructure, not the fix)"
          gh api -X PATCH "repos/$REPO/issues/comments/$cid" -f body="$body" --silent || true
          echo "Refunded attempt: counter $cur -> $prev (this run was attempt $ATTEMPT)."
