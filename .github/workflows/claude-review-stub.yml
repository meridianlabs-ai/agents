# The agents repo's OWN reviewer stub (copy of examples/claude-review-stub.yml;
# -stub suffix because claude-review.yml is the reusable definition here).
# Auto-reviews PRs on open (pull_request_target — the workflow resolves from
# the base branch, so even reviewer-file PRs auto-review; release-please
# PRs are skipped, gated in the reusable workflow) and on demand via @review.
name: Review

on:
  # pull_request (NOT pull_request_target — attempted 2026-08-26, reverted:
  # Anthropic's token exchange rejects prt-shaped OIDC subjects, "Invalid
  # OIDC token"; see design/architecture.md → auto-review tradeoffs).
  # Consequence: PRs that EDIT the reviewer's own files skip auto-review
  # (server-side workflow validation) and need a manual top-level @review
  # comment, which resolves the workflow from the default branch.
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    # Run on PR events (skipping drafts — they get reviewed via
    # ready_for_review when marked ready — and fork PRs: under
    # pull_request_target the event runs with base-repo secrets, so the
    # same-repo check below is a SECURITY boundary, not an ergonomic
    # skip), or on a PR comment containing
    # @review — or an @review comment on an External-labeled proxy ISSUE, which
    # reviews the tracked upstream PR and posts findings on the proxy (external
    # mode; see the reusable workflow). An explicit @review still works on a
    # draft, and on a fork PR when the commenter has write access (enforced in
    # the reusable's trig check before checkout). `@review` does not collide
    # with the dev agent's `@claude` trigger.
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft != true &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@review')) ||
      (github.event.issue.pull_request == null &&
       contains(github.event.issue.labels.*.name, 'External') &&
       contains(github.event.comment.body, '@review'))
    uses: meridianlabs-ai/agents/.github/workflows/claude-review.yml@main
    # Machine-account PAT for the deterministic ack/stage steps only (eyes
    # reaction + board stage); never handed to the review agent, which stays
    # read-only. Absent -> those steps no-op.
    secrets:
      MARVIN_TOKEN: ${{ secrets.MARVIN_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
