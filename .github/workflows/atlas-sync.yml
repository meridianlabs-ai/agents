# Hourly Atlas sync (design: design/atlas-tracking.md → "The hourly Atlas
# sync"). Hosted HERE (org-wide board infrastructure) since 2026-08-26;
# previously on the fork's meridian branch. Every call is an explicit
# repos/{owner}/{repo} API call under the machine account's token, so the
# hosting repo is just the cron + script + secret surface.
#
# Syncs every open fork issue on Atlas that has an Upstream PR field —
# promotions follow the upstream reviewDecision tail; External proxies close
# on upstream merge/close, queue at Merge on maintainer approval, and return
# to Review on contributor response.
#
# Retired 2026-09-11 (decision: Ransom): the discovery task that seeded a
# proxy issue for each external contributor's upstream PR review-requested-to
# / assigned-to the reviewer, and the auto-@review it posted on new proxies
# and on Contributor -> Review flips. Automated external reviews run locally
# through Orca now (orca-pr-sync + a local review skill). Existing proxies
# keep their Upstream PR field and are still synced here.
#
# Runs as the machine account (Phase 2, design/architecture.md → Landing job):
# the first step mints a one-hour installation token of the GitHub App
# `meridian-marvin` scoped to the inspect_ai fork — the only repository the
# script writes (issue comments, state changes and reactions on the fork's
# proxy issues; it reads the fork's Actions runs and the upstream PRs, which
# are public) — plus the org's projects (the Atlas board), and a SECOND,
# read-only token for ts-mono: the companion-PR reads and the reviewer's
# collaborator-permission lookup behind the companion merge gate are
# authenticated reads of another repository, which a fork-only token cannot
# make (review round 1 of agents#111). The script routes every ts-mono call
# through that token (GH_TOKEN_TS_MONO) and fails closed without it; neither
# token can write outside its one repository. The app secrets are the only
# credential (the PAT was retired 2026-09-18); the preflight is what an app
# token can answer — a read of the Atlas project and of ts-mono (the
# OAuth-scope header check is gone: installation tokens report no scopes).
# Deterministic — no agent invocation.

name: Atlas sync

on:
  schedule:
    - cron: "17 * * * *" # hourly, off the top-of-hour rush
  workflow_dispatch:

concurrency:
  group: atlas-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # A wedged run would otherwise hold the concurrency group for the 6-hour
    # default and silently skip the hourly syncs in between.
    timeout-minutes: 15
    steps:
      # The machine account's token, minted from the app secrets (org secrets
      # scoped to this repo); the run cannot work without them. One token for
      # the run's whole write set — the fork's issues (comments, close /
      # reopen, reactions), the Atlas board (org projects) — with the fork's
      # Actions runs read for the live-run check. Revoked when the job ends.
      - name: Mint the machine account's token
        id: mint
        uses: actions/create-github-app-token@v2
        with:
          # `app-id` accepts the App ID or the Client ID; v2 has no client-id input.
          app-id: ${{ secrets.MARVIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
          owner: meridianlabs-ai
          repositories: inspect_ai
          permission-issues: write
          permission-pull-requests: write
          permission-actions: read
          permission-organization-projects: write

      # The ts-mono read token: the companion PRs (GraphQL and `gh pr list`),
      # their comments, and `repos/ts-mono/collaborators/<login>/permission`
      # for the reviewer who approved a companion — an authenticated read the
      # fork token above cannot make. Read-only by construction: metadata
      # (the permission endpoint) and pull requests (the PR and comment
      # reads), no write permission of any kind. Same identity, second
      # scope; revoked when the job ends.
      - name: Mint the ts-mono read token
        id: mint_ts_mono
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MARVIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
          owner: meridianlabs-ai
          repositories: ts-mono
          permission-metadata: read
          permission-pull-requests: read

      - uses: actions/checkout@v4

      # An installation token reports no OAuth scopes, so the checks are
      # real reads: the Atlas project with the fork token, the ts-mono
      # repository with the ts-mono token. Fail
      # loudly — without project access every board write silently 403s,
      # and without ts-mono access every companion lookup fails closed and
      # holds its promotion at Sign-off.
      - name: Preflight - tokens can read the org project and ts-mono
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          GH_TOKEN_TS_MONO: ${{ steps.mint_ts_mono.outputs.token }}
        run: |
          set -euo pipefail
          gh api graphql -f query='{node(id:"PVT_kwDOC7YMCM4BU68p"){... on ProjectV2{title}}}' \
            --jq '.data.node.title' >/dev/null \
            || { echo "::error::token cannot read the Atlas project"; exit 1; }
          GH_TOKEN="$GH_TOKEN_TS_MONO" gh api repos/meridianlabs-ai/ts-mono --jq '.full_name' >/dev/null \
            || { echo "::error::the ts-mono read token cannot read meridianlabs-ai/ts-mono"; exit 1; }

      - name: Sync
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          # The ts-mono read token (atlas_sync.py -> gh_env).
          GH_TOKEN_TS_MONO: ${{ steps.mint_ts_mono.outputs.token }}
          REVIEWER: ransomr
        run: python3 .github/scripts/atlas_sync.py
