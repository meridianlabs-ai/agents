version: 2
updates:
  # Actions are pinned to commit SHAs with a `# vX.Y.Z` comment; Dependabot
  # bumps both. The cooldown gives a compromised release time to be caught
  # before it is proposed; security updates skip it. examples/ is not
  # scanned: update its pins by hand when the workflows' pins move.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # The "Set up Node for codex-action" steps pin setup-node to the commit
      # openai/codex-action runs internally; it moves with codex-action by hand.
      - dependency-name: "actions/setup-node"
      # The cache-mode canaries need a client older than @actions/cache 6.2.0
      # (see cache-mode-canary-reusable.yml); actions/cache is only used there.
      - dependency-name: "actions/cache*"
    groups:
      # One PR per week for every other action update, majors included.
      github-actions:
        patterns:
          - "*"
        # Its own PR: before merging a codex-action bump, check the
        # actions/setup-node commit the new version runs and update the
        # "Set up Node for codex-action" pins and NODE_STEP in
        # tests/test_codex_path.py to match. CI does not catch a mismatch.
        exclude-patterns:
          - "openai/codex-action"

  # The npm packages the agent jobs install (openai/codex-action's CLI and
  # proxy, the reviewer's sandbox-runtime), at the exact versions in
  # npm-pins/package.json. Same cooldown as above. One weekly PR: codex
  # releases most days. Before merging a codex bump, check that
  # @openai/codex-responses-api-proxy has the same version (codex-action
  # installs both). engine-isolation-canary skips Dependabot's runs, so the
  # new pins first run on a hosted runner after the merge.
  - package-ecosystem: "npm"
    directory: "/.github/actions/npm-pins"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm-pins:
        patterns:
          - "*"

  # pytest and pytest-xdist in uv.lock (tests.yml, the dogfood stubs'
  # provisioning).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      python-packages:
        patterns:
          - "*"
