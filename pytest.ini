[pytest]
# Run with `python3 -m pytest -n auto` (pytest-xdist) from the repo root;
# CI runs the same command (see tests/README.md). `-n auto` is not in
# addopts so that a plain `python3 -m pytest` still works where
# pytest-xdist is not installed, and a single test starts no workers.
testpaths = tests
addopts = -q
